<svg viewBox="0 0 640 216" role="img" aria-label="Top: 'I stayed at home' stands straight on the ground — an independent clause. 'because it was raining' is falling over alone — a dependent clause. Bottom: the two are joined — I stayed at home because it was raining." xmlns="http://www.w3.org/2000/svg"><title>A dependent clause (dashed) needs the support of an independent clause (solid) to stand.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .id-gnd { fill: none; stroke: var(--text-soft); stroke-width: 2; }
              .id-blk { fill: var(--sheet); stroke-width: 2.2; }
              .id-dep { fill: var(--sheet); stroke-width: 2.2; stroke-dasharray: 6 4; }
              .id-w { font: 700 14px var(--font); }
              .id-g { font: 600 11.5px var(--font); fill: var(--text-soft); }
              .id-link { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
            </style>
          </defs>

          <path class="id-gnd" d="M20 90 L300 90"/>
          <rect class="id-blk" x="40" y="48" width="200" height="42" rx="8" stroke="var(--role-verb)"/>
          <text class="id-w" x="140" y="74" text-anchor="middle" fill="var(--role-verb)">I stayed at home.</text>
          <g transform="rotate(10 475 69)">
            <rect class="id-dep" x="360" y="48" width="230" height="42" rx="8" stroke="var(--role-conj)"/>
            <text class="id-w" x="475" y="74" text-anchor="middle" fill="var(--role-conj)">because it was raining</text>
          </g>
          <text class="id-g" x="140" y="112" text-anchor="middle">INDEPENDENT — stands alone, full meaning</text>
          <text class="id-g" x="460" y="140" text-anchor="middle">DEPENDENT — falls over alone</text>

          <rect class="id-blk" x="40" y="156" width="200" height="42" rx="8" stroke="var(--role-verb)"/>
          <text class="id-w" x="140" y="182" text-anchor="middle" fill="var(--role-verb)">I stayed at home</text>
          <path class="id-link" d="M240 177 L256 177"/>
          <rect class="id-dep" x="256" y="156" width="240" height="42" rx="8" stroke="var(--role-conj)"/>
          <text class="id-w" x="376" y="182" text-anchor="middle" fill="var(--role-conj)">because it was raining.</text>
          <text class="id-g" x="510" y="182">supported ✓</text>
        </svg>