<svg viewBox="0 0 680 400" role="img" aria-label="Grid of phrasal verb particles: the core feeling and one example for each of up, off, out, down, after, across, on and along" xmlns="http://www.w3.org/2000/svg"><title>Eight particles, the feeling each one carries, and three common phrasal verbs for each.</title><style>svg{--brand-400:#fb923c;--brand-500:#f97316;--brand-600:#ea580c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cell { fill: var(--card); stroke: var(--brand-400); stroke-width: 1.8; }
              .pt { font: 800 17px var(--font); fill: var(--brand-600); }
              .fe { font: 600 11.5px var(--font); fill: var(--text); }
              .eg { font: 500 11px var(--font); fill: var(--text-soft); }
              .gl { stroke: var(--brand-500); stroke-width: 2; fill: none; }
              .gld { fill: var(--brand-500); }
            </style>
          </defs>

          <!-- up -->
          <g transform="translate(16 14)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">up</text>
            <path class="gl" d="M120 62 L120 22"/><circle class="gld" cx="120" cy="20" r="4"/>
            <text class="fe" x="12" y="50">completely, finished</text>
            <text class="eg" x="12" y="70">give up · eat up · use up</text>
          </g>

          <!-- off -->
          <g transform="translate(190 14)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">off</text>
            <path class="gl" d="M106 40 L140 40"/><circle class="gld" cx="100" cy="40" r="4"/>
            <text class="fe" x="12" y="50">apart, moving away</text>
            <text class="eg" x="12" y="70">put off · take off · call off</text>
          </g>

          <!-- out -->
          <g transform="translate(364 14)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">out</text>
            <path class="gl" d="M104 28 L104 52 L140 52"/><circle class="gld" cx="104" cy="24" r="4"/>
            <text class="fe" x="12" y="50">coming out, running out</text>
            <text class="eg" x="12" y="70">sort out · run out · find out</text>
          </g>

          <!-- down -->
          <g transform="translate(16 112)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">down</text>
            <path class="gl" d="M120 22 L120 62"/><circle class="gld" cx="120" cy="64" r="4"/>
            <text class="fe" x="12" y="50">reduce, refuse</text>
            <text class="eg" x="12" y="70">turn down · cut down · write down</text>
          </g>

          <!-- after -->
          <g transform="translate(190 112)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">after</text>
            <circle class="gld" cx="104" cy="40" r="4"/><circle class="gld" cx="124" cy="40" r="4"/>
            <path class="gl" d="M132 40 L146 40"/>
            <text class="fe" x="12" y="50">follow, take care of</text>
            <text class="eg" x="12" y="70">look after · take after</text>
          </g>

          <!-- across -->
          <g transform="translate(364 112)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">across</text>
            <path class="gl" d="M100 46 L146 46"/><circle class="gld" cx="123" cy="32" r="4"/>
            <text class="fe" x="12" y="50">bumping into on the way</text>
            <text class="eg" x="12" y="70">come across · get across</text>
          </g>

          <!-- on -->
          <g transform="translate(16 210)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">on</text>
            <path class="gl" d="M100 40 L146 40"/>
            <circle class="gld" cx="100" cy="40" r="4"/><circle class="gld" cx="146" cy="40" r="4"/>
            <text class="fe" x="12" y="50">continue, stay attached</text>
            <text class="eg" x="12" y="70">carry on · hold on · go on</text>
          </g>

          <!-- along -->
          <g transform="translate(190 210)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">along</text>
            <path class="gl" d="M100 34 L146 34"/>
            <path class="gl" d="M100 48 L146 48"/>
            <text class="fe" x="12" y="50">moving together</text>
            <text class="eg" x="12" y="70">get along · go along with</text>
          </g>

          <!-- up (again) -->
          <g transform="translate(364 210)">
            <rect class="cell" x="0" y="0" width="158" height="86" rx="11"/>
            <text class="pt" x="12" y="28">up (2)</text>
            <path class="gl" d="M104 60 L124 30 L144 46"/>
            <text class="fe" x="12" y="50">bring forward, lift</text>
            <text class="eg" x="12" y="70">bring up · pick up · set up</text>
          </g>

          <text class="eg" x="540" y="46">Understand the feeling</text>
          <text class="eg" x="540" y="64">of the particle, and</text>
          <text class="eg" x="540" y="82">half the meaning of</text>
          <text class="eg" x="540" y="100">a new phrasal verb</text>
          <text class="eg" x="540" y="118">guesses itself.</text>

          <text class="fe" x="540" y="166">Note:</text>
          <text class="eg" x="540" y="186">some phrasal verbs</text>
          <text class="eg" x="540" y="204">do not get their meaning</text>
          <text class="eg" x="540" y="222">from the particle at all —</text>
          <text class="eg" x="540" y="240">so just learn them.</text>

          <rect class="cell" x="16" y="320" width="506" height="62" rx="11"/>
          <text class="fe" x="30" y="344">One particle can carry two feelings:</text>
          <text class="eg" x="30" y="366">"pick up" = lift, learn, and collect someone — all three are correct.</text>
        </svg>