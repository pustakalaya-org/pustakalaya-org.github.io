<svg viewBox="0 0 640 290" role="img" aria-label="Three steps of listening: Before listening, look at the title and key words; While listening, hear the gist the first time and the detail the second time; After listening, check the transcript and say it aloud" xmlns="http://www.w3.org/2000/svg"><title>Before → While → After. The most important rule: do not look at the transcript for the
    first two listens. You are training your brain to get meaning from the sound.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .bw-box { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
       .bw-head { fill: var(--accent); opacity: 0.16; }
       .bw-t { font: 800 15px var(--font); fill: var(--accent); }
       .bw-s { font: 600 12px var(--font); fill: var(--text-soft); }
       .bw-w { font: 500 13px var(--font); fill: var(--text); }
       .bw-ar { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#bw-arrow); }
       .bw-loop { fill: none; stroke: var(--accent-2); stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#bw-arrow2); }
       .bw-l { font: 700 12px var(--font); fill: var(--accent-2); }
      </style>
      <marker id="bw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
      </marker>
      <marker id="bw-arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
      </marker>
     </defs>

     <g transform="translate(10 20)">
      <rect class="bw-box" x="0" y="0" width="180" height="200" rx="14"/>
      <path class="bw-head" d="M14 0 H166 A14 14 0 0 1 180 14 V52 H0 V14 A14 14 0 0 1 14 0 Z"/>
      <text class="bw-t" x="14" y="26">1. BEFORE</text>
      <text class="bw-s" x="14" y="44">before listening</text>
      <text class="bw-w" x="14" y="80">• Read the title</text>
      <text class="bw-w" x="14" y="104">• Look at key words</text>
      <text class="bw-w" x="14" y="128">• Make a guess:</text>
      <text class="bw-w" x="26" y="150">what will happen?</text>
      <text class="bw-s" x="14" y="184">1 minute</text>
     </g>

     <path class="bw-ar" d="M194 120 H222"/>

     <g transform="translate(230 20)">
      <rect class="bw-box" x="0" y="0" width="180" height="200" rx="14"/>
      <path class="bw-head" d="M14 0 H166 A14 14 0 0 1 180 14 V52 H0 V14 A14 14 0 0 1 14 0 Z"/>
      <text class="bw-t" x="14" y="26">2. WHILE</text>
      <text class="bw-s" x="14" y="44">while listening</text>
      <text class="bw-w" x="14" y="80">• 1st time: gist</text>
      <text class="bw-w" x="26" y="102">(what happened?)</text>
      <text class="bw-w" x="14" y="128">• 2nd time: detail</text>
      <text class="bw-w" x="26" y="150">(who, when, where)</text>
      <text class="bw-s" x="14" y="184">keep the text closed!</text>
     </g>

     <path class="bw-ar" d="M414 120 H442"/>

     <g transform="translate(450 20)">
      <rect class="bw-box" x="0" y="0" width="180" height="200" rx="14"/>
      <path class="bw-head" d="M14 0 H166 A14 14 0 0 1 180 14 V52 H0 V14 A14 14 0 0 1 14 0 Z"/>
      <text class="bw-t" x="14" y="26">3. AFTER</text>
      <text class="bw-s" x="14" y="44">after listening</text>
      <text class="bw-w" x="14" y="80">• Open the transcript</text>
      <text class="bw-w" x="14" y="104">• Listen again to</text>
      <text class="bw-w" x="26" y="126">what you missed</text>
      <text class="bw-w" x="14" y="150">• Say it aloud</text>
      <text class="bw-s" x="14" y="184">shadowing</text>
     </g>

     <path class="bw-loop" d="M540 226 C540 280 100 280 100 232"/>
     <text class="bw-l" x="320" y="268" text-anchor="middle">next day, a new story — the same three steps</text>
    </svg>