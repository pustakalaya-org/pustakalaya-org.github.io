<svg viewBox="0 0 620 300" role="img" aria-label="Front view of the lips: for V the upper teeth rest on the lower lip, for W both lips are round and the teeth are hidden" xmlns="http://www.w3.org/2000/svg"><title>The easiest way to check: look in a mirror. When you say V, your upper teeth should be visible. When you say W, they should not.</title><style>svg{--brand-500:#f97316;--brand-600:#ea580c;--canvas:#eef1f6;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--line:#e3e7ef;--role-adv:#db2777;--role-noun:#2563eb;--role-prep:#ea580c;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lip { fill: color-mix(in srgb, var(--brand-500) 22%, transparent); stroke: var(--brand-600); stroke-width: 2.4; }
              .tth { fill: var(--sheet); stroke: var(--ink-300); stroke-width: 1.6; }
              .ttl { font: 800 17px var(--font); fill: var(--text); }
              .sub2 { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .note { font: 500 12px var(--font); fill: var(--text-soft); }
              .arr { stroke: var(--role-adv); stroke-width: 2; fill: none; marker-end: url(#ah); }
              .word { font: 700 14px var(--font); fill: var(--role-prep); }
              .air { stroke: var(--role-noun); stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
            </style>
            <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-adv)"/>
            </marker>
          </defs>

          <!-- ===== V panel ===== -->
          <g transform="translate(0 0)">
            <text class="ttl" x="20" y="28">V</text>
            <text class="sub2" x="48" y="28">very, van, love</text>

            <!-- outer lips: narrow, lower lip tucked -->
            <path class="lip" d="M40 96 C 100 62, 200 62, 258 96 C 228 118, 150 124, 110 118 C 80 114, 54 108, 40 96 Z"/>
            <!-- upper teeth resting on lower lip -->
            <rect class="tth" x="106" y="92" width="20" height="22" rx="3"/>
            <rect class="tth" x="128" y="92" width="20" height="22" rx="3"/>
            <rect class="tth" x="150" y="92" width="20" height="22" rx="3"/>
            <!-- lower lip line -->
            <path d="M80 116 C 130 130, 190 128, 232 112" fill="none" stroke="var(--role-prep)" stroke-width="3"/>

            <path class="arr" d="M300 86 C 250 86, 220 92, 186 98"/>
            <text class="note" x="306" y="82">upper teeth</text>
            <text class="note" x="306" y="98">on the lower lip</text>

            <path class="arr" d="M300 134 C 250 134, 200 128, 170 122"/>
            <text class="note" x="306" y="130">lower lip</text>
            <text class="note" x="306" y="146">presses in slightly</text>

            <path class="air" d="M150 118 C 150 150, 120 160, 96 168"/>
            <text class="note" x="36" y="186">air + throat vibration</text>
            <text class="note" x="36" y="204">rubs out through here</text>

            <text class="word" x="36" y="232">vet · vine · very</text>
          </g>

          <!-- divider -->
          <line x1="430" y1="12" x2="430" y2="288" stroke="var(--line)" stroke-width="1.5"/>

          <!-- ===== W panel ===== -->
          <g transform="translate(436 0)">
            <text class="ttl" x="12" y="28">W</text>
            <text class="sub2" x="40" y="28">wet, work</text>

            <!-- round pursed lips -->
            <ellipse class="lip" cx="88" cy="106" rx="62" ry="40"/>
            <ellipse cx="88" cy="106" rx="26" ry="20" fill="var(--canvas)" stroke="var(--role-prep)" stroke-width="2.4"/>
            <text class="note" x="88" y="111" text-anchor="middle">oo</text>

            <path class="arr" d="M20 178 C 44 160, 64 148, 76 138"/>
            <text class="note" x="-4" y="196">lips round —</text>
            <text class="note" x="-4" y="212">like blowing out a candle</text>

            <text class="note" x="-4" y="240">teeth not visible,</text>
            <text class="note" x="-4" y="256">not touching the lips</text>

            <text class="word" x="-4" y="284">wet · wine · worry</text>
          </g>
        </svg>