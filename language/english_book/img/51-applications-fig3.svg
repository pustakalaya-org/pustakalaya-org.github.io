<svg viewBox="0 0 680 200" role="img" aria-label="Order of a complaint: first the facts — what, when, order number; then the impact — what loss was caused; then the demand — repair, replace or refund; then the deadline — by when; and at the bottom, attach the proof" xmlns="http://www.w3.org/2000/svg"><title>Four steps, in one order. Anger has no place in this order — and no need.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cp-1 { fill: var(--sheet-2); stroke: var(--accent-line); stroke-width: 1.6; }
              .cp-2 { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.6; }
              .cp-3 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
              .cp-4 { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.6; }
              .cp-h { font: 800 13px var(--font); fill: var(--text); }
              .cp-s { font: 500 11px var(--font); fill: var(--text-soft); }
              .cp-at { fill: none; stroke: var(--accent-2); stroke-width: 1.8; stroke-dasharray: 5 5; }
              .cp-a { font: 700 11.5px var(--font); fill: var(--accent-ink); }
            </style>
          </defs>
          <path class="cp-1" d="M16 30 H160 L186 80 L160 130 H16 Z"/>
          <path class="cp-2" d="M176 30 H322 L348 80 L322 130 H176 L202 80 Z"/>
          <path class="cp-3" d="M338 30 H484 L510 80 L484 130 H338 L364 80 Z"/>
          <path class="cp-4" d="M500 30 H664 V130 H500 L526 80 Z"/>

          <text class="cp-h" x="34" y="70">1. Facts</text>
          <text class="cp-s" x="34" y="90">what, when, where,</text>
          <text class="cp-s" x="34" y="106">order number</text>

          <text class="cp-h" x="214" y="70">2. Impact</text>
          <text class="cp-s" x="214" y="90">what loss or trouble</text>
          <text class="cp-s" x="214" y="106">it caused</text>

          <text class="cp-h" x="376" y="70">3. Demand</text>
          <text class="cp-s" x="376" y="90">repair, replace</text>
          <text class="cp-s" x="376" y="106">or refund</text>

          <text class="cp-h" x="540" y="70">4. Deadline</text>
          <text class="cp-s" x="540" y="90">by when — a</text>
          <text class="cp-s" x="540" y="106">fixed date</text>

          <path class="cp-at" d="M60 136 V166 H620 V136"/>
          <text class="cp-a" x="340" y="188" text-anchor="middle">Attach with it: invoice, photo, earlier ticket number</text>
        </svg>