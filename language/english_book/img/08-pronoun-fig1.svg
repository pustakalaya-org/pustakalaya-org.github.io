<svg viewBox="0 0 680 290" role="img" aria-label="A diagram showing that in a sentence the subject pronoun sits before the verb and the object pronoun sits after the verb" xmlns="http://www.w3.org/2000/svg"><title>The form of a pronoun is decided by its place — subject before the verb, object after the verb.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .slot { fill: var(--card); stroke-width: 2; }
              .sl { font: 800 14px var(--font); }
              .ss { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .wd3 { font: 700 18px var(--font); }
              .flow { stroke: var(--ink-300); stroke-width: 2; fill: none; marker-end: url(#ah3); }
              .note { font: 500 12px var(--font); fill: var(--text-soft); }
              .big { font: 800 16px var(--font); fill: var(--text); }
            </style>
            <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-300)"/>
            </marker>
          </defs>

          <text class="big" x="20" y="28">Before and after the verb — two separate lists</text>

          <!-- track -->
          <line class="flow" x1="40" y1="110" x2="640" y2="110"/>

          <g transform="translate(130 110)">
            <rect class="slot" x="-96" y="-44" width="192" height="60" rx="10" stroke="var(--role-pron)"/>
            <text class="sl" x="0" y="-22" text-anchor="middle" fill="var(--role-pron)">SUBJECT</text>
            <text class="ss" x="0" y="-5" text-anchor="middle">I · you · he · she · it</text>
            <text class="ss" x="0" y="9" text-anchor="middle">we · they</text>
            <text class="ss" x="0" y="40" text-anchor="middle">the doer</text>
          </g>

          <g transform="translate(350 110)">
            <rect class="slot" x="-70" y="-30" width="140" height="42" rx="10" stroke="var(--role-verb)"/>
            <text class="sl" x="0" y="-10" text-anchor="middle" fill="var(--role-verb)">VERB</text>
            <text class="ss" x="0" y="5" text-anchor="middle">called · helped · saw</text>
          </g>

          <g transform="translate(560 110)">
            <rect class="slot" x="-96" y="-44" width="192" height="60" rx="10" stroke="var(--role-pron)"/>
            <text class="sl" x="0" y="-22" text-anchor="middle" fill="var(--role-pron)">OBJECT</text>
            <text class="ss" x="0" y="-5" text-anchor="middle">me · you · him · her · it</text>
            <text class="ss" x="0" y="9" text-anchor="middle">us · them</text>
            <text class="ss" x="0" y="40" text-anchor="middle">what the action fell on</text>
          </g>

          <!-- sample -->
          <text class="wd3" x="86" y="196" fill="var(--role-pron)">She</text>
          <text class="wd3" x="300" y="196" fill="var(--role-verb)">helped</text>
          <text class="wd3" x="530" y="196" fill="var(--role-pron)">him</text>
          <text class="note" x="340" y="232" text-anchor="middle">✓ She helped him.</text>
          <text class="note" x="340" y="254" text-anchor="middle">✗ Her helped he. — change the column and the sentence falls apart.</text>
          <text class="note" x="340" y="276" text-anchor="middle">After a preposition the object list is used too: with him, for us, between them.</text>
        </svg>