<svg viewBox="0 0 480 380" role="img" aria-label="Word family tree of happy: on the bottom line happiness (noun), happy (adjective), happily (adverb). When the prefix un- is added on top: unhappiness, unhappy, unhappily." xmlns="http://www.w3.org/2000/svg"><title>Going up (un-) = the opposite meaning. Going left or right (-ness, -ly) = the same meaning, a new job.
        The colour shows whether the word is a noun, an adjective or an adverb.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .wf-n { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2; }
              .wf-a { fill: var(--sheet); stroke: var(--role-adj); stroke-width: 2; }
              .wf-v { fill: var(--sheet); stroke: var(--role-adv); stroke-width: 2; }
              .wf-root { fill: var(--accent-soft); stroke: var(--role-adj); stroke-width: 3; }
              .wf-ln { fill: none; stroke: var(--accent); stroke-width: 2.5; marker-end: url(#wf-ar); }
              .wf-w { font: 700 15px var(--font); fill: var(--text); }
              .wf-hn { font: 800 11.5px var(--font); fill: var(--role-noun); letter-spacing: 0.08em; }
              .wf-ha { font: 800 11.5px var(--font); fill: var(--role-adj); letter-spacing: 0.08em; }
              .wf-hv { font: 800 11.5px var(--font); fill: var(--role-adv); letter-spacing: 0.08em; }
              .wf-tag { font: 800 13px var(--font); fill: var(--accent); }
              .wf-s { font: 500 12px var(--font); fill: var(--text-soft); }
              .wf-b { font: 700 13px var(--font); fill: var(--text); }
            </style>
            <marker id="wf-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>

          <text class="wf-hn" x="70" y="36" text-anchor="middle">NOUN</text>
          <text class="wf-ha" x="240" y="36" text-anchor="middle">ADJECTIVE</text>
          <text class="wf-hv" x="410" y="36" text-anchor="middle">ADVERB</text>

          <rect class="wf-n" x="10" y="56" width="120" height="56" rx="10"/>
          <text class="wf-w" x="70" y="89" text-anchor="middle">unhappiness</text>
          <rect class="wf-a" x="180" y="56" width="120" height="56" rx="10"/>
          <text class="wf-w" x="240" y="89" text-anchor="middle">unhappy</text>
          <rect class="wf-v" x="350" y="56" width="120" height="56" rx="10"/>
          <text class="wf-w" x="410" y="89" text-anchor="middle">unhappily</text>

          <path class="wf-ln" d="M178 84 L134 84"/>
          <text class="wf-tag" x="155" y="74" text-anchor="middle">-ness</text>
          <path class="wf-ln" d="M302 84 L346 84"/>
          <text class="wf-tag" x="325" y="74" text-anchor="middle">-ly</text>

          <path class="wf-ln" d="M240 234 L240 116"/>
          <text class="wf-tag" x="252" y="170">un-</text>
          <text class="wf-s" x="252" y="188">(prefix: opposite)</text>

          <rect class="wf-n" x="10" y="236" width="120" height="56" rx="10"/>
          <text class="wf-w" x="70" y="269" text-anchor="middle">happiness</text>
          <rect class="wf-root" x="180" y="236" width="120" height="56" rx="10"/>
          <text class="wf-w" x="240" y="262" text-anchor="middle">happy</text>
          <text class="wf-s" x="240" y="281" text-anchor="middle">root</text>
          <rect class="wf-v" x="350" y="236" width="120" height="56" rx="10"/>
          <text class="wf-w" x="410" y="269" text-anchor="middle">happily</text>

          <path class="wf-ln" d="M178 264 L134 264"/>
          <text class="wf-tag" x="155" y="254" text-anchor="middle">-ness</text>
          <path class="wf-ln" d="M302 264 L346 264"/>
          <text class="wf-tag" x="325" y="254" text-anchor="middle">-ly</text>

          <text class="wf-b" x="240" y="330" text-anchor="middle">Prefix → changes the meaning.   Suffix → changes the part of speech.</text>
          <text class="wf-s" x="240" y="352" text-anchor="middle">y → i: happy + ness = happiness, happy + ly = happily</text>
        </svg>