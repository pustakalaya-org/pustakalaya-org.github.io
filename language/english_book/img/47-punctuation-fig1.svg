<svg viewBox="0 0 720 320" role="img" aria-label="A road of punctuation marks: the comma is the shortest pause, the semicolon is longer, the colon opens what comes next, the full stop is a complete stop" xmlns="http://www.w3.org/2000/svg"><title>Four marks, four lengths of break. Orange = a light pause, red = a full stop.</title><style>svg{--bad:#be123c;--bad-bg:#fdecef;--brand-400:#fb923c;--brand-600:#ea580c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:ui-monospace, Menlo, Consolas, monospace;--ink-200:#e2e8f0;--ink-500:#64748b;--page:#eef1f6;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .road { fill: var(--ink-200); }
              .lane { stroke: var(--page); stroke-width: 3; stroke-dasharray: 16 14; }
              .sgn  { font: 800 22px var(--font-mono); fill: var(--brand-600); }
              .nm   { font: 800 12px var(--font); fill: var(--text); }
              .ds   { font: 500 11px var(--font); fill: var(--text-soft); }
              .pole { stroke: var(--ink-500); stroke-width: 2; }
              .plate{ fill: var(--card); stroke: var(--brand-400); stroke-width: 2; }
              .bar  { fill: var(--brand-400); }
              .hd   { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.07em; }
            </style>
          </defs>

          <text class="hd" x="20" y="22">SHORT PAUSE</text>
          <text class="hd" x="700" y="22" text-anchor="end">LONG PAUSE</text>

          <!-- road -->
          <rect class="road" x="20" y="150" width="680" height="34" rx="6"/>
          <line class="lane" x1="30" y1="167" x2="690" y2="167"/>

          <!-- sign 1: comma -->
          <g transform="translate(90 0)">
            <line class="pole" x1="0" y1="150" x2="0" y2="112"/>
            <rect class="plate" x="-46" y="58" width="92" height="56" rx="10"/>
            <text class="sgn" x="0" y="96" text-anchor="middle">,</text>
            <text class="nm" x="0" y="206" text-anchor="middle">comma</text>
            <text class="ds" x="0" y="222" text-anchor="middle">slow down a little</text>
            <rect class="bar" x="-14" y="236" width="28" height="9" rx="4"/>
          </g>

          <!-- sign 2: semicolon -->
          <g transform="translate(270 0)">
            <line class="pole" x1="0" y1="150" x2="0" y2="112"/>
            <rect class="plate" x="-46" y="58" width="92" height="56" rx="10"/>
            <text class="sgn" x="0" y="96" text-anchor="middle">;</text>
            <text class="nm" x="0" y="206" text-anchor="middle">semicolon</text>
            <text class="ds" x="0" y="222" text-anchor="middle">two linked clauses</text>
            <rect class="bar" x="-26" y="236" width="52" height="9" rx="4"/>
          </g>

          <!-- sign 3: colon -->
          <g transform="translate(450 0)">
            <line class="pole" x1="0" y1="150" x2="0" y2="112"/>
            <rect class="plate" x="-46" y="58" width="92" height="56" rx="10"/>
            <text class="sgn" x="0" y="96" text-anchor="middle">:</text>
            <text class="nm" x="0" y="206" text-anchor="middle">colon</text>
            <text class="ds" x="0" y="222" text-anchor="middle">a list or reason follows</text>
            <rect class="bar" x="-26" y="236" width="52" height="9" rx="4"/>
          </g>

          <!-- sign 4: full stop -->
          <g transform="translate(630 0)">
            <line class="pole" x1="0" y1="150" x2="0" y2="112"/>
            <rect class="plate" x="-46" y="58" width="92" height="56" rx="10" fill="var(--bad-bg)" stroke="var(--bad)"/>
            <text class="sgn" x="0" y="98" text-anchor="middle" fill="var(--bad)">.</text>
            <text class="nm" x="0" y="206" text-anchor="middle">full stop</text>
            <text class="ds" x="0" y="222" text-anchor="middle">the end of the idea</text>
            <rect class="bar" x="-40" y="236" width="80" height="9" rx="4" fill="var(--bad)"/>
          </g>

          <text class="ds" x="360" y="282" text-anchor="middle">Bar length = pause length. Before choosing a mark, ask: how long do I need to pause?</text>
          <text class="ds" x="360" y="302" text-anchor="middle">And remember: the mark sticks to the word, with one space after it — "Yes, fine." not "Yes , fine ."</text>
        </svg>