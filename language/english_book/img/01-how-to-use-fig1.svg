<svg viewBox="0 0 640 230" role="img" aria-label="The daily split of fifteen minutes: four minutes reading, six minutes speaking aloud, three minutes quiz, two minutes reviewing yesterday" xmlns="http://www.w3.org/2000/svg"><title>Notice: the biggest block is orange — speaking . Reading is only a quarter of your time.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .slbl { font: 700 14px var(--font); fill: var(--sheet); }
              .smin { font: 800 22px var(--font); fill: var(--sheet); }
              .cap { font: 500 12px var(--font); fill: var(--text-soft); }
              .axis { font: 600 11px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="axis" x="10" y="22">15 MINUTES — EVERY DAY</text>

          <rect x="10" y="36" width="162" height="86" rx="8" fill="var(--role-noun)"/>
          <text class="smin" x="91" y="72" text-anchor="middle">4</text>
          <text class="slbl" x="91" y="94" text-anchor="middle">Read</text>

          <rect x="178" y="36" width="244" height="86" rx="8" fill="var(--brand-500)"/>
          <text class="smin" x="300" y="72" text-anchor="middle">6</text>
          <text class="slbl" x="300" y="94" text-anchor="middle">Speak aloud</text>

          <rect x="428" y="36" width="122" height="86" rx="8" fill="var(--role-verb)"/>
          <text class="smin" x="489" y="72" text-anchor="middle">3</text>
          <text class="slbl" x="489" y="94" text-anchor="middle">Quiz</text>

          <rect x="556" y="36" width="74" height="86" rx="8" fill="var(--role-adj)"/>
          <text class="smin" x="593" y="72" text-anchor="middle">2</text>
          <text class="slbl" x="593" y="94" text-anchor="middle">Review</text>

          <text class="cap" x="10" y="150">Read one part of a chapter — not the whole chapter in one day.</text>
          <text class="cap" x="10" y="170">Press 🔊 on each example sentence, listen, then say it yourself. This is the biggest part.</text>
          <text class="cap" x="10" y="190">Do the quiz at the end of the chapter — you learn most from wrong answers.</text>
          <text class="cap" x="10" y="210">Say three sentences from yesterday again. Just three.</text>
        </svg>