<svg viewBox="0 0 640 260" role="img" aria-label="Comparing short and long vowels: a short bar for the short sound and a long bar for the long sound, for four pairs" xmlns="http://www.w3.org/2000/svg"><title>Blue bar = short sound (ends quickly). Orange bar = long sound (stretched).
        The letters are the same, but the length changes the meaning.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sb { fill: var(--role-noun); }
              .lb2 { fill: var(--brand-500); }
              .wd { font: 700 13px var(--font); fill: var(--text); }
              .mn { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .hd2 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="hd2" x="12" y="18">SHORT SOUND</text>
          <text class="hd2" x="330" y="18">LONG SOUND</text>

          <g transform="translate(0 32)">
            <text class="wd" x="12" y="14">ship</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">a boat</text>
            <text class="wd" x="330" y="14">sheep</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">an animal</text>
          </g>

          <g transform="translate(0 86)">
            <text class="wd" x="12" y="14">full</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">not empty</text>
            <text class="wd" x="330" y="14">fool</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">silly person</text>
          </g>

          <g transform="translate(0 140)">
            <text class="wd" x="12" y="14">bit</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">a little</text>
            <text class="wd" x="330" y="14">beat</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">hit / heartbeat</text>
          </g>

          <g transform="translate(0 194)">
            <text class="wd" x="12" y="14">cut</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">to slice</text>
            <text class="wd" x="330" y="14">cart</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">a trolley</text>
          </g>
        </svg>