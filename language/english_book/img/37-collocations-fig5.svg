<svg viewBox="0 0 480 300" role="img" aria-label="Word web of decision: verbs on the left — make a, take a, reach a. Adjectives on the right — a big, a difficult, a final. Below — decision on or about, and decision to plus verb." xmlns="http://www.w3.org/2000/svg"><title>&quot;We need to reach a final decision on the budget.&quot; — three parts of the web in a single sentence.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-prep:#ea580c;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dw-c { fill: var(--accent); }
              .dw-ct { font: 800 18px var(--font); fill: var(--sheet); }
              .dw-v { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2; }
              .dw-a { fill: var(--sheet); stroke: var(--role-adj); stroke-width: 2; }
              .dw-p { fill: var(--sheet); stroke: var(--role-prep); stroke-width: 2; }
              .dw-ln { fill: none; stroke: var(--accent-line); stroke-width: 2; }
              .dw-w { font: 600 13.5px var(--font); fill: var(--text); }
              .dw-hv { font: 800 11.5px var(--font); fill: var(--role-verb); letter-spacing: 0.08em; }
              .dw-ha { font: 800 11.5px var(--font); fill: var(--role-adj); letter-spacing: 0.08em; }
              .dw-hp { font: 800 11.5px var(--font); fill: var(--role-prep); letter-spacing: 0.08em; }
            </style>
          </defs>
          <text class="dw-hv" x="65" y="40" text-anchor="middle">VERB</text>
          <text class="dw-ha" x="415" y="40" text-anchor="middle">ADJECTIVE</text>

          <path class="dw-ln" d="M120 67 L170 130"/>
          <path class="dw-ln" d="M120 135 L170 135"/>
          <path class="dw-ln" d="M120 203 L170 140"/>
          <path class="dw-ln" d="M360 67 L310 130"/>
          <path class="dw-ln" d="M360 135 L310 135"/>
          <path class="dw-ln" d="M360 203 L310 140"/>
          <path class="dw-ln" d="M200 160 L160 236"/>
          <path class="dw-ln" d="M280 160 L320 236"/>

          <rect class="dw-v" x="10" y="50" width="110" height="34" rx="17"/><text class="dw-w" x="65" y="72" text-anchor="middle">make a</text>
          <rect class="dw-v" x="10" y="118" width="110" height="34" rx="17"/><text class="dw-w" x="65" y="140" text-anchor="middle">take a</text>
          <rect class="dw-v" x="10" y="186" width="110" height="34" rx="17"/><text class="dw-w" x="65" y="208" text-anchor="middle">reach a</text>

          <rect class="dw-c" x="170" y="110" width="140" height="50" rx="25"/>
          <text class="dw-ct" x="240" y="141" text-anchor="middle">decision</text>

          <rect class="dw-a" x="360" y="50" width="110" height="34" rx="17"/><text class="dw-w" x="415" y="72" text-anchor="middle">a big</text>
          <rect class="dw-a" x="360" y="118" width="110" height="34" rx="17"/><text class="dw-w" x="415" y="140" text-anchor="middle">a difficult</text>
          <rect class="dw-a" x="360" y="186" width="110" height="34" rx="17"/><text class="dw-w" x="415" y="208" text-anchor="middle">a final</text>

          <rect class="dw-p" x="80" y="238" width="160" height="34" rx="17"/><text class="dw-w" x="160" y="260" text-anchor="middle">decision on / about</text>
          <rect class="dw-p" x="250" y="238" width="160" height="34" rx="17"/><text class="dw-w" x="330" y="260" text-anchor="middle">decision to + verb</text>
          <text class="dw-hp" x="240" y="292" text-anchor="middle">PREPOSITION / NEXT WORD</text>
        </svg>