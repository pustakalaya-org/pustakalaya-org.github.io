<svg viewBox="0 0 640 222" role="img" aria-label="Three shapes of a modal sentence: statement — She can swim. Negative — She can't swim, with not attached straight to the modal. Question — Can she swim?, where the modal moves before the subject and no do/does is used." xmlns="http://www.w3.org/2000/svg"><title>A modal makes its own negatives and questions — there is no need to call in &quot;do&quot;.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .md-blk { fill: var(--sheet); stroke-width: 2.2; }
              .md-w { font: 700 15px var(--font); }
              .md-row { font: 800 12px var(--font); fill: var(--text); }
              .md-note { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .md-arc { fill: none; stroke: var(--role-verb); stroke-width: 2; stroke-dasharray: 5 4; }
            </style>
            <marker id="mdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/>
            </marker>
          </defs>

          <text class="md-row" x="14" y="45">Statement</text>
          <rect class="md-blk" x="120" y="20" width="70" height="40" rx="9" stroke="var(--role-noun)"/>
          <text class="md-w" x="155" y="45" text-anchor="middle" fill="var(--role-noun)">She</text>
          <rect class="md-blk" x="200" y="20" width="80" height="40" rx="9" stroke="var(--role-verb)"/>
          <text class="md-w" x="240" y="45" text-anchor="middle" fill="var(--role-verb)">can</text>
          <rect class="md-blk" x="290" y="20" width="90" height="40" rx="9" stroke="var(--role-adv)"/>
          <text class="md-w" x="335" y="45" text-anchor="middle" fill="var(--role-adv)">swim.</text>
          <text class="md-note" x="400" y="45">modal + V1 (no -s, no to)</text>

          <text class="md-row" x="14" y="115">Negative</text>
          <rect class="md-blk" x="120" y="90" width="70" height="40" rx="9" stroke="var(--role-noun)"/>
          <text class="md-w" x="155" y="115" text-anchor="middle" fill="var(--role-noun)">She</text>
          <rect class="md-blk" x="200" y="90" width="80" height="40" rx="9" stroke="var(--role-verb)"/>
          <text class="md-w" x="240" y="115" text-anchor="middle" fill="var(--role-verb)">can't</text>
          <rect class="md-blk" x="290" y="90" width="90" height="40" rx="9" stroke="var(--role-adv)"/>
          <text class="md-w" x="335" y="115" text-anchor="middle" fill="var(--role-adv)">swim.</text>
          <text class="md-note" x="400" y="115">"not" attaches straight to the modal</text>

          <path class="md-arc" d="M240 164 C240 144, 160 144, 158 164" marker-end="url(#mdArrow)"/>
          <text class="md-note" x="252" y="156">modal moves to the front</text>
          <text class="md-row" x="14" y="195">Question</text>
          <rect class="md-blk" x="120" y="170" width="70" height="40" rx="9" stroke="var(--role-verb)"/>
          <text class="md-w" x="155" y="195" text-anchor="middle" fill="var(--role-verb)">Can</text>
          <rect class="md-blk" x="200" y="170" width="80" height="40" rx="9" stroke="var(--role-noun)"/>
          <text class="md-w" x="240" y="195" text-anchor="middle" fill="var(--role-noun)">she</text>
          <rect class="md-blk" x="290" y="170" width="90" height="40" rx="9" stroke="var(--role-adv)"/>
          <text class="md-w" x="335" y="195" text-anchor="middle" fill="var(--role-adv)">swim?</text>
          <text class="md-note" x="400" y="195">no need for do / does</text>
        </svg>