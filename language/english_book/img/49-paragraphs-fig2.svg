<svg viewBox="0 0 640 340" role="img" aria-label="Paragraph burger: the top bun is the topic sentence, the three middle layers are support sentences — reason, example, proof — and the bottom bun is the closing sentence" xmlns="http://www.w3.org/2000/svg"><title>Without the buns the burger falls apart; without the filling it is just bread.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet-2:#f7f8fb;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .bg-bun { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .bg-f1 { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.6; }
              .bg-f2 { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.6; }
              .bg-f3 { fill: var(--sheet-2); stroke: var(--accent-2); stroke-width: 1.6; }
              .bg-t { font: 800 13px var(--font); fill: var(--text); }
              .bg-ld { fill: none; stroke: var(--text-faint); stroke-width: 1.4; stroke-dasharray: 3 4; }
              .bg-h { font: 800 12px var(--font); fill: var(--accent-ink); }
              .bg-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <path class="bg-bun" d="M30 96 Q30 22 165 22 Q300 22 300 96 Z"/>
          <text class="bg-t" x="165" y="72" text-anchor="middle">Topic sentence</text>

          <rect class="bg-f1" x="40" y="108" width="250" height="40" rx="18"/>
          <text class="bg-t" x="165" y="133" text-anchor="middle">Support 1 — reason</text>
          <rect class="bg-f2" x="40" y="156" width="250" height="40" rx="18"/>
          <text class="bg-t" x="165" y="181" text-anchor="middle">Support 2 — example</text>
          <rect class="bg-f3" x="40" y="204" width="250" height="40" rx="18"/>
          <text class="bg-t" x="165" y="229" text-anchor="middle">Support 3 — proof / number</text>

          <path class="bg-bun" d="M30 256 H300 Q300 318 165 318 Q30 318 30 256 Z"/>
          <text class="bg-t" x="165" y="292" text-anchor="middle">Closing sentence</text>

          <path class="bg-ld" d="M300 64 H336"/>
          <text class="bg-h" x="344" y="58">Subject + your opinion</text>
          <text class="bg-s" x="344" y="76">Walking to work is the easiest way to stay fit.</text>

          <path class="bg-ld" d="M290 128 H336"/>
          <text class="bg-h" x="344" y="122">Why?</text>
          <text class="bg-s" x="344" y="140">It needs no gym fee and no extra time.</text>

          <path class="bg-ld" d="M290 176 H336"/>
          <text class="bg-h" x="344" y="170">For example?</text>
          <text class="bg-s" x="344" y="188">A 20-minute walk each way = 3+ hours a week.</text>

          <path class="bg-ld" d="M290 224 H336"/>
          <text class="bg-h" x="344" y="218">Proof</text>
          <text class="bg-s" x="344" y="236">Doctors suggest about 150 minutes a week.</text>

          <path class="bg-ld" d="M300 288 H336"/>
          <text class="bg-h" x="344" y="282">Wrap it up</text>
          <text class="bg-s" x="344" y="300">So if your office is close, leave the bike at home.</text>
        </svg>