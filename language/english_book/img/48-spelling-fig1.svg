<svg viewBox="0 0 640 410" role="img" aria-label="Deciding whether to double the consonant: the suffix must start with a vowel, the word must end in one vowel and one consonant, and the stress must be on the last part; only then do you double" xmlns="http://www.w3.org/2000/svg"><title>Double only if all three answers are &quot;yes&quot;. If even one is &quot;no&quot;, keep the consonant single.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sd-q { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .sd-n { fill: var(--sheet-2); stroke: var(--line-strong); stroke-width: 1.5; }
              .sd-y { fill: var(--good-bg); stroke: var(--good); stroke-width: 2; }
              .sd-t { font: 700 13px var(--font); fill: var(--text); }
              .sd-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .sd-g { font: 700 13px var(--font); fill: var(--good); }
              .sd-l { fill: none; stroke: var(--accent-2); stroke-width: 2; }
              .sd-k { font: 800 11px var(--font); fill: var(--accent-ink); letter-spacing: 0.04em; }
            </style>
            <marker id="sd-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>

          <rect class="sd-q" x="20" y="20" width="330" height="64" rx="10"/>
          <text class="sd-t" x="36" y="46">1. Does the suffix start with a vowel?</text>
          <text class="sd-s" x="36" y="68">-ing, -ed, -er, -est, -able</text>
          <path class="sd-l" d="M350 52 H394" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="356" y="44">NO</text>
          <rect class="sd-n" x="400" y="24" width="220" height="56" rx="10"/>
          <text class="sd-t" x="414" y="46">Don't double</text>
          <text class="sd-s" x="414" y="66">ship + ment = shipment</text>

          <path class="sd-l" d="M185 84 V114" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="194" y="104">YES</text>

          <rect class="sd-q" x="20" y="120" width="330" height="64" rx="10"/>
          <text class="sd-t" x="36" y="146">2. Ends in one vowel + one consonant?</text>
          <text class="sd-s" x="36" y="168">stop, run, begin ✓ · rain, help ✗</text>
          <path class="sd-l" d="M350 152 H394" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="356" y="144">NO</text>
          <rect class="sd-n" x="400" y="124" width="220" height="56" rx="10"/>
          <text class="sd-t" x="414" y="146">Don't double</text>
          <text class="sd-s" x="414" y="166">rain → raining, help → helped</text>

          <path class="sd-l" d="M185 184 V214" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="194" y="204">YES</text>

          <rect class="sd-q" x="20" y="220" width="330" height="64" rx="10"/>
          <text class="sd-t" x="36" y="246">3. Is the stress on the last syllable?</text>
          <text class="sd-s" x="36" y="268">Always yes for one-syllable words</text>
          <path class="sd-l" d="M350 252 H394" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="356" y="244">NO</text>
          <rect class="sd-n" x="400" y="224" width="220" height="56" rx="10"/>
          <text class="sd-t" x="414" y="246">Don't double</text>
          <text class="sd-s" x="414" y="266">VI-sit → visited, O-pen → opening</text>

          <path class="sd-l" d="M185 284 V314" marker-end="url(#sd-ar)"/>
          <text class="sd-k" x="194" y="304">YES</text>

          <rect class="sd-y" x="20" y="320" width="600" height="60" rx="10"/>
          <text class="sd-g" x="36" y="345">Double the consonant</text>
          <text class="sd-s" x="36" y="366">stop → stopped · run → running · be-GIN → beginning · pre-FER → preferred</text>

          <text class="sd-s" x="20" y="402">w, x, y never double: fix → fixing, play → played, show → showing</text>
        </svg>