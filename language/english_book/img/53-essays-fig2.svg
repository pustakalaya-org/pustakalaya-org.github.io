<svg viewBox="0 0 640 190" role="img" aria-label="The 40 minutes of Task 2: 5 minutes planning, 30 minutes writing, 5 minutes checking" xmlns="http://www.w3.org/2000/svg"><title>Skipping the plan is the biggest mistake. Five minutes of planning saves ten minutes while you write.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .it-a { fill: var(--accent-2); }
              .it-b { fill: var(--accent); }
              .it-c { fill: var(--role-verb); }
              .it-t { font: 800 14px var(--font); fill: var(--sheet); }
              .it-s { font: 600 12px var(--font); fill: var(--text-soft); }
              .it-h { font: 800 14px var(--font); fill: var(--text); }
            </style>
          </defs>
          <text class="it-h" x="20" y="28">Task 2 · 40 minutes · at least 250 words</text>
          <rect class="it-a" x="20" y="48" width="75" height="54" rx="8"/>
          <rect class="it-b" x="98" y="48" width="444" height="54" rx="8"/>
          <rect class="it-c" x="545" y="48" width="75" height="54" rx="8"/>
          <text class="it-t" x="57" y="80" text-anchor="middle">5 min</text>
          <text class="it-t" x="320" y="80" text-anchor="middle">30 min — write (4 paragraphs)</text>
          <text class="it-t" x="582" y="80" text-anchor="middle">5 min</text>
          <text class="it-s" x="57" y="124" text-anchor="middle">plan:</text>
          <text class="it-s" x="57" y="140" text-anchor="middle">type, thesis</text>
          <text class="it-s" x="57" y="156" text-anchor="middle">2 ideas</text>
          <text class="it-s" x="320" y="124" text-anchor="middle">intro ~40 · body 2 × ~90 · conclusion ~40</text>
          <text class="it-s" x="320" y="142" text-anchor="middle">about 260–290 words</text>
          <text class="it-s" x="582" y="124" text-anchor="middle">check:</text>
          <text class="it-s" x="582" y="140" text-anchor="middle">a/the, -s,</text>
          <text class="it-s" x="582" y="156" text-anchor="middle">tense</text>
        </svg>