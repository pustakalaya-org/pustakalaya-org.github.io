<svg viewBox="0 0 700 230" role="img" aria-label="A sentence with the part of speech of each word written under it" xmlns="http://www.w3.org/2000/svg"><title>Taking a normal sentence apart — this is how you start to &quot;see&quot; grammar.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-conj:#65a30d;--role-interj:#e11d48;--role-noun:#2563eb;--role-prep:#ea580c;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .wd { font: 700 17px var(--font); fill: var(--text); }
              .tg { font: 700 10px var(--font); letter-spacing: .04em; }
              .brc { stroke-width: 2; fill: none; }
              .cap { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <text class="cap" x="20" y="24">"Oh! The tired boy quietly sat near his mother and slept."</text>

          <!-- row of words with tags -->
          <g transform="translate(20 70)">
            <text class="wd" x="0" y="0" fill="var(--role-interj)">Oh!</text>
            <path class="brc" d="M0 10 L32 10" stroke="var(--role-interj)"/>
            <text class="tg" x="0" y="26" fill="var(--role-interj)">INTERJ</text>
          </g>
          <g transform="translate(70 70)">
            <text class="wd" x="0" y="0">The</text>
            <path class="brc" d="M0 10 L30 10" stroke="var(--role-adj)"/>
            <text class="tg" x="0" y="26" fill="var(--role-adj)">ARTICLE</text>
          </g>
          <g transform="translate(142 70)">
            <text class="wd" x="0" y="0" fill="var(--role-adj)">tired</text>
            <path class="brc" d="M0 10 L40 10" stroke="var(--role-adj)"/>
            <text class="tg" x="0" y="26" fill="var(--role-adj)">ADJ</text>
          </g>
          <g transform="translate(200 70)">
            <text class="wd" x="0" y="0" fill="var(--role-noun)">boy</text>
            <path class="brc" d="M0 10 L30 10" stroke="var(--role-noun)"/>
            <text class="tg" x="0" y="26" fill="var(--role-noun)">NOUN</text>
          </g>
          <g transform="translate(252 70)">
            <text class="wd" x="0" y="0" fill="var(--role-adv)">quietly</text>
            <path class="brc" d="M0 10 L55 10" stroke="var(--role-adv)"/>
            <text class="tg" x="0" y="26" fill="var(--role-adv)">ADV</text>
          </g>
          <g transform="translate(325 70)">
            <text class="wd" x="0" y="0" fill="var(--role-verb)">sat</text>
            <path class="brc" d="M0 10 L26 10" stroke="var(--role-verb)"/>
            <text class="tg" x="0" y="26" fill="var(--role-verb)">VERB</text>
          </g>
          <g transform="translate(375 70)">
            <text class="wd" x="0" y="0" fill="var(--role-prep)">near</text>
            <path class="brc" d="M0 10 L38 10" stroke="var(--role-prep)"/>
            <text class="tg" x="0" y="26" fill="var(--role-prep)">PREP</text>
          </g>
          <g transform="translate(432 70)">
            <text class="wd" x="0" y="0" fill="var(--role-pron)">his</text>
            <path class="brc" d="M0 10 L24 10" stroke="var(--role-pron)"/>
            <text class="tg" x="0" y="26" fill="var(--role-pron)">PRON</text>
          </g>
          <g transform="translate(482 70)">
            <text class="wd" x="0" y="0" fill="var(--role-noun)">mother</text>
            <path class="brc" d="M0 10 L58 10" stroke="var(--role-noun)"/>
            <text class="tg" x="0" y="26" fill="var(--role-noun)">NOUN</text>
          </g>
          <g transform="translate(558 70)">
            <text class="wd" x="0" y="0" fill="var(--role-conj)">and</text>
            <path class="brc" d="M0 10 L30 10" stroke="var(--role-conj)"/>
            <text class="tg" x="0" y="26" fill="var(--role-conj)">CONJ</text>
          </g>
          <g transform="translate(612 70)">
            <text class="wd" x="0" y="0" fill="var(--role-verb)">slept.</text>
            <path class="brc" d="M0 10 L46 10" stroke="var(--role-verb)"/>
            <text class="tg" x="0" y="26" fill="var(--role-verb)">VERB</text>
          </g>

          <text class="cap" x="20" y="160">Look: seven types in one sentence. This is not unusual —</text>
          <text class="cap" x="20" y="180">normal everyday English looks just like this.</text>
          <text class="cap" x="20" y="208">(The article "the" is counted in the adjective family in this book.)</text>
        </svg>