<svg viewBox="0 0 640 300" role="img" aria-label="Which exam: the question Why do you need it in the middle, with four branches — study abroad, work or migration, a lasting certificate for Europe or international use, and just knowing your level" xmlns="http://www.w3.org/2000/svg"><title>Even within one country, different universities or visas accept different exams. Before you apply,
        read the &quot;English language requirements&quot; on their website.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ex-q { fill: var(--accent); }
              .ex-qt { font: 800 15px var(--font); fill: var(--sheet); }
              .ex-b { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .ex-h { font: 800 13px var(--font); fill: var(--text); }
              .ex-s { font: 600 12px var(--font); fill: var(--accent-2); }
              .ex-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
              .ex-f { font: italic 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <path class="ex-ln" d="M320 70 L85 140"/>
          <path class="ex-ln" d="M320 70 L240 140"/>
          <path class="ex-ln" d="M320 70 L400 140"/>
          <path class="ex-ln" d="M320 70 L555 140"/>
          <rect class="ex-q" x="210" y="20" width="220" height="50" rx="25"/>
          <text class="ex-qt" x="320" y="51" text-anchor="middle">Why do you need it?</text>

          <rect class="ex-b" x="10" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="85" y="166" text-anchor="middle">Study abroad</text>
          <text class="ex-s" x="85" y="192" text-anchor="middle">IELTS Academic</text>
          <text class="ex-s" x="85" y="210" text-anchor="middle">TOEFL · PTE</text>
          <text class="ex-f" x="85" y="234" text-anchor="middle">check the university list</text>

          <rect class="ex-b" x="165" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="240" y="166" text-anchor="middle">Work / migration</text>
          <text class="ex-s" x="240" y="192" text-anchor="middle">IELTS General</text>
          <text class="ex-s" x="240" y="210" text-anchor="middle">PTE (some countries)</text>
          <text class="ex-f" x="240" y="234" text-anchor="middle">check the visa site</text>

          <rect class="ex-b" x="325" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="400" y="166" text-anchor="middle">Lifelong cert.</text>
          <text class="ex-s" x="400" y="192" text-anchor="middle">B2 First</text>
          <text class="ex-s" x="400" y="210" text-anchor="middle">C1 Advanced</text>
          <text class="ex-f" x="400" y="234" text-anchor="middle">Europe, many companies</text>

          <rect class="ex-b" x="480" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="555" y="166" text-anchor="middle">Know your level</text>
          <text class="ex-s" x="555" y="192" text-anchor="middle">this chapter's list</text>
          <text class="ex-s" x="555" y="210" text-anchor="middle">+ Final Test</text>
          <text class="ex-f" x="555" y="234" text-anchor="middle">save your money</text>

          <text class="ex-f" x="320" y="286" text-anchor="middle">First the destination's official list, then the exam — never the other way round.</text>
        </svg>