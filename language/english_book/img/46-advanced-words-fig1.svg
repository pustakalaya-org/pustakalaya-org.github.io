<svg viewBox="0 0 680 420" role="img" aria-label="Map of eighteen advanced words: formality increases from left to right, and everyday use increases from bottom to top" xmlns="http://www.w3.org/2000/svg"><title>Orange dots = words you can start speaking today. Blue dots = words to read and
        recognise first; speak them later.</title><style>svg{--brand-500:#f97316;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--line:#e3e7ef;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fr { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
              .ax { stroke: var(--ink-300); stroke-width: 2; }
              .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 5; }
              .axl { font: 700 11px var(--font); fill: var(--text-soft); }
              .dot { fill: var(--brand-500); }
              .dot2 { fill: var(--role-noun); }
              .wd { font: 650 12px var(--font); fill: var(--text); }
              .zonel { font: 700 10.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <rect class="fr" x="56" y="24" width="604" height="330" rx="12"/>
          <line class="gl" x1="358" y1="24" x2="358" y2="354"/>
          <line class="gl" x1="56" y1="189" x2="660" y2="189"/>

          <line class="ax" x1="56" y1="354" x2="660" y2="354"/>
          <line class="ax" x1="56" y1="354" x2="56" y2="24"/>

          <text class="axl" x="62" y="372">← spoken language</text>
          <text class="axl" x="656" y="372" text-anchor="end">bookish / written language →</text>
          <text class="axl" x="46" y="34" text-anchor="end" transform="rotate(-90 46 34)">heard every day →</text>

          <text class="zonel" x="68" y="42">SAY IT FREELY</text>
          <text class="zonel" x="648" y="348" text-anchor="end">READING ONLY</text>

          <circle class="dot" cx="110" cy="60" r="6"/>
          <text class="wd" x="122" y="64">keen</text>

