<svg viewBox="0 0 640 300" role="img" aria-label="Two travel timelines. Flight: book, check in, board, take off, land. Train: book, status, platform, coach, arrive. A short phrase under each step." xmlns="http://www.w3.org/2000/svg"><title>The words on top = the steps (verb or noun). The words below = the short phrase you will hear or say at that step.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tj-ln { fill: none; stroke: var(--accent-line); stroke-width: 3; }
              .tj-d { fill: var(--accent); }
              .tj-d2 { fill: var(--accent-2); }
              .tj-r { font: 800 14px var(--font); fill: var(--text-soft); }
              .tj-s { font: 700 14px var(--font); fill: var(--text); }
              .tj-x { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <text class="tj-r" x="20" y="34">FLIGHT</text>
          <path class="tj-ln" d="M60 80 H580"/>
          <circle class="tj-d" cx="60" cy="80" r="10"/>
          <circle class="tj-d" cx="190" cy="80" r="10"/>
          <circle class="tj-d" cx="320" cy="80" r="10"/>
          <circle class="tj-d" cx="450" cy="80" r="10"/>
          <circle class="tj-d" cx="580" cy="80" r="10"/>
          <text class="tj-s" x="60" y="62" text-anchor="middle">book</text>
          <text class="tj-s" x="190" y="62" text-anchor="middle">check in</text>
          <text class="tj-s" x="320" y="62" text-anchor="middle">board</text>
          <text class="tj-s" x="450" y="62" text-anchor="middle">take off</text>
          <text class="tj-s" x="580" y="62" text-anchor="middle">land</text>
          <text class="tj-x" x="60" y="108" text-anchor="middle">a return</text>
          <text class="tj-x" x="60" y="124" text-anchor="middle">ticket</text>
          <text class="tj-x" x="190" y="108" text-anchor="middle">get a</text>
          <text class="tj-x" x="190" y="124" text-anchor="middle">boarding pass</text>
          <text class="tj-x" x="320" y="108" text-anchor="middle">at gate 14</text>
          <text class="tj-x" x="450" y="108" text-anchor="middle">delayed</text>
          <text class="tj-x" x="450" y="124" text-anchor="middle">by 1 hour</text>
          <text class="tj-x" x="580" y="108" text-anchor="middle">connecting</text>
          <text class="tj-x" x="580" y="124" text-anchor="middle">flight?</text>

          <text class="tj-r" x="20" y="184">TRAIN</text>
          <path class="tj-ln" d="M60 230 H580"/>
          <circle class="tj-d2" cx="60" cy="230" r="10"/>
          <circle class="tj-d2" cx="190" cy="230" r="10"/>
          <circle class="tj-d2" cx="320" cy="230" r="10"/>
          <circle class="tj-d2" cx="450" cy="230" r="10"/>
          <circle class="tj-d2" cx="580" cy="230" r="10"/>
          <text class="tj-s" x="60" y="212" text-anchor="middle">book</text>
          <text class="tj-s" x="190" y="212" text-anchor="middle">status</text>
          <text class="tj-s" x="320" y="212" text-anchor="middle">platform</text>
          <text class="tj-s" x="450" y="212" text-anchor="middle">coach</text>
          <text class="tj-s" x="580" y="212" text-anchor="middle">arrive</text>
          <text class="tj-x" x="60" y="258" text-anchor="middle">get a PNR</text>
          <text class="tj-x" x="190" y="258" text-anchor="middle">confirmed or</text>
          <text class="tj-x" x="190" y="274" text-anchor="middle">waitlisted</text>
          <text class="tj-x" x="320" y="258" text-anchor="middle">platform 5</text>
          <text class="tj-x" x="450" y="258" text-anchor="middle">B2, berth 34</text>
          <text class="tj-x" x="580" y="258" text-anchor="middle">running</text>
          <text class="tj-x" x="580" y="274" text-anchor="middle">late</text>
        </svg>