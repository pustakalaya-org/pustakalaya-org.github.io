<svg viewBox="0 0 640 260" role="img" aria-label="If a consonant comes before y, the y becomes i, as in happy to happiness; if a vowel comes before y, the y stays, as in play to played; and before ing the y always stays" xmlns="http://www.w3.org/2000/svg"><title>You only need to look at one letter — the y&#x27;s neighbour.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-softer:color-mix(in srgb, #ea580c 5%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .yi-q { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .yi-a { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.8; }
              .yi-b { fill: var(--accent-softer); stroke: var(--accent-line); stroke-width: 1.8; }
              .yi-l { fill: none; stroke: var(--accent-2); stroke-width: 2; }
              .yi-t { font: 700 13.5px var(--font); fill: var(--text); }
              .yi-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .yi-k { font: 800 11px var(--font); fill: var(--accent-ink); letter-spacing: 0.05em; }
            </style>
            <marker id="yi-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>
          <rect class="yi-q" x="200" y="16" width="240" height="52" rx="12"/>
          <text class="yi-t" x="320" y="47" text-anchor="middle">What is just before the y?</text>

          <path class="yi-l" d="M260 68 L150 118" marker-end="url(#yi-ar)"/>
          <text class="yi-k" x="118" y="94">CONSONANT</text>
          <path class="yi-l" d="M380 68 L490 118" marker-end="url(#yi-ar)"/>
          <text class="yi-k" x="452" y="94">VOWEL</text>

          <rect class="yi-a" x="20" y="124" width="280" height="76" rx="12"/>
          <text class="yi-t" x="36" y="150">y → i</text>
          <text class="yi-s" x="36" y="170">happy → happiness · study → studied</text>
          <text class="yi-s" x="36" y="188">carry → carries · easy → easier</text>

          <rect class="yi-a" x="340" y="124" width="280" height="76" rx="12"/>
          <text class="yi-t" x="356" y="150">y stays</text>
          <text class="yi-s" x="356" y="170">play → played · enjoy → enjoyment</text>
          <text class="yi-s" x="356" y="188">key → keys · obey → obeyed</text>

          <rect class="yi-b" x="20" y="214" width="600" height="36" rx="10"/>
          <text class="yi-s" x="320" y="237" text-anchor="middle">Before -ing the y always stays: study → studying, carry → carrying (never "ii")</text>
        </svg>