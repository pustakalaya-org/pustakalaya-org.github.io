<svg viewBox="0 0 640 300" role="img" aria-label="Ladder: 1 lakh = 100 thousand, 10 lakh = 1 million, 1 crore = 10 million, 100 crore = 1 billion." xmlns="http://www.w3.org/2000/svg"><title>Remember two magic pairs: 10 lakh = 1 million and 1 crore = 10 million . Everything else follows from these.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:ui-monospace, Menlo, Consolas, monospace;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lk-l { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .lk-r { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2; }
              .lk-t { font: 800 15px var(--font); fill: var(--text); }
              .lk-d { font: 600 12.5px var(--font-mono); fill: var(--text-soft); }
              .lk-eq { font: 800 20px var(--font); fill: var(--accent); }
              .lk-h { font: 800 13px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
            </style>
          </defs>
          <text class="lk-h" x="140" y="24" text-anchor="middle">INDIA</text>
          <text class="lk-h" x="500" y="24" text-anchor="middle">INTERNATIONAL</text>

          <rect class="lk-l" x="20" y="38" width="240" height="52" rx="10"/>
          <text class="lk-t" x="36" y="60">1 lakh</text>
          <text class="lk-d" x="36" y="80">1,00,000</text>
          <text class="lk-eq" x="320" y="72" text-anchor="middle">=</text>
          <rect class="lk-r" x="380" y="38" width="240" height="52" rx="10"/>
          <text class="lk-t" x="396" y="60">100 thousand</text>
          <text class="lk-d" x="396" y="80">100,000</text>

          <rect class="lk-l" x="20" y="102" width="240" height="52" rx="10"/>
          <text class="lk-t" x="36" y="124">10 lakh</text>
          <text class="lk-d" x="36" y="144">10,00,000</text>
          <text class="lk-eq" x="320" y="136" text-anchor="middle">=</text>
          <rect class="lk-r" x="380" y="102" width="240" height="52" rx="10"/>
          <text class="lk-t" x="396" y="124">1 million</text>
          <text class="lk-d" x="396" y="144">1,000,000</text>

          <rect class="lk-l" x="20" y="166" width="240" height="52" rx="10"/>
          <text class="lk-t" x="36" y="188">1 crore</text>
          <text class="lk-d" x="36" y="208">1,00,00,000</text>
          <text class="lk-eq" x="320" y="200" text-anchor="middle">=</text>
          <rect class="lk-r" x="380" y="166" width="240" height="52" rx="10"/>
          <text class="lk-t" x="396" y="188">10 million</text>
          <text class="lk-d" x="396" y="208">10,000,000</text>

          <rect class="lk-l" x="20" y="230" width="240" height="52" rx="10"/>
          <text class="lk-t" x="36" y="252">100 crore</text>
          <text class="lk-d" x="36" y="272">1,00,00,00,000</text>
          <text class="lk-eq" x="320" y="264" text-anchor="middle">=</text>
          <rect class="lk-r" x="380" y="230" width="240" height="52" rx="10"/>
          <text class="lk-t" x="396" y="252">1 billion</text>
          <text class="lk-d" x="396" y="272">1,000,000,000</text>
        </svg>