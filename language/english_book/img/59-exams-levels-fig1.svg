<svg viewBox="0 0 640 350" role="img" aria-label="The CEFR ladder: six steps from A1 to C2, with the level name, the approximate total hours, and an estimate of the IELTS band on each step" xmlns="http://www.w3.org/2000/svg"><title>Hours = the rough total study time from the beginning up to that level (a common estimate of guided
        learning hours). The IELTS band is only a rough comparison — each exam has its own official table.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lv-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .lv-b { fill: var(--accent-soft); stroke: var(--accent-2); stroke-width: 2; }
              .lv-c { fill: var(--accent-soft); stroke: var(--role-verb); stroke-width: 2; }
              .lv-k { font: 800 20px var(--font); fill: var(--text); }
              .lv-n { font: 700 12px var(--font); fill: var(--text); }
              .lv-h { font: 500 12px var(--font); fill: var(--text-soft); }
              .lv-i { font: 700 12px var(--font); fill: var(--accent); }
              .lv-g { font: 800 13px var(--font); fill: var(--text-soft); }
              .lv-ln { fill: none; stroke: var(--line-strong); stroke-width: 2; }
            </style>
          </defs>
          <path class="lv-ln" d="M14 312 H626"/>
          <rect class="lv-a" x="20" y="252" width="96" height="60" rx="8"/>
          <text class="lv-k" x="68" y="278" text-anchor="middle">A1</text>
          <text class="lv-n" x="68" y="298" text-anchor="middle">Beginner</text>
          <text class="lv-h" x="68" y="240" text-anchor="middle">~90 hrs</text>

          <rect class="lv-a" x="122" y="212" width="96" height="100" rx="8"/>
          <text class="lv-k" x="170" y="238" text-anchor="middle">A2</text>
          <text class="lv-n" x="170" y="258" text-anchor="middle">Elementary</text>
          <text class="lv-h" x="170" y="200" text-anchor="middle">~200 hrs</text>

          <rect class="lv-b" x="224" y="172" width="96" height="140" rx="8"/>
          <text class="lv-k" x="272" y="198" text-anchor="middle">B1</text>
          <text class="lv-n" x="272" y="218" text-anchor="middle">Intermediate</text>
          <text class="lv-i" x="272" y="290" text-anchor="middle">IELTS ~4–5</text>
          <text class="lv-h" x="272" y="160" text-anchor="middle">~400 hrs</text>

          <rect class="lv-b" x="326" y="132" width="96" height="180" rx="8"/>
          <text class="lv-k" x="374" y="158" text-anchor="middle">B2</text>
          <text class="lv-n" x="374" y="178" text-anchor="middle">Upper-int.</text>
          <text class="lv-i" x="374" y="290" text-anchor="middle">IELTS 5.5–6.5</text>
          <text class="lv-h" x="374" y="120" text-anchor="middle">~550 hrs</text>

          <rect class="lv-c" x="428" y="92" width="96" height="220" rx="8"/>
          <text class="lv-k" x="476" y="118" text-anchor="middle">C1</text>
          <text class="lv-n" x="476" y="138" text-anchor="middle">Advanced</text>
          <text class="lv-i" x="476" y="290" text-anchor="middle">IELTS ~7–8</text>
          <text class="lv-h" x="476" y="80" text-anchor="middle">~750 hrs</text>

          <rect class="lv-c" x="530" y="52" width="96" height="260" rx="8"/>
          <text class="lv-k" x="578" y="78" text-anchor="middle">C2</text>
          <text class="lv-n" x="578" y="98" text-anchor="middle">Proficient</text>
          <text class="lv-i" x="578" y="290" text-anchor="middle">IELTS 8.5–9</text>
          <text class="lv-h" x="578" y="40" text-anchor="middle">1,000+ hrs</text>

          <text class="lv-g" x="119" y="334" text-anchor="middle">A · Basic</text>
          <text class="lv-g" x="323" y="334" text-anchor="middle">B · Independent</text>
          <text class="lv-g" x="527" y="334" text-anchor="middle">C · Proficient</text>
        </svg>