<svg viewBox="0 0 660 300" role="img" aria-label="Where the possessive apostrophe goes — three routes: singular, plural, and plural ending in -s" xmlns="http://www.w3.org/2000/svg"><title>One question — &quot;does it end in -s?&quot; — and the place of the apostrophe is decided.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--ink-500:#64748b;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .q { fill: var(--card); stroke: var(--ink-300); stroke-width: 2; }
              .qt { font: 700 13px var(--font); fill: var(--text); }
              .ok { fill: var(--card); stroke: var(--role-noun); stroke-width: 2; }
              .okt { font: 800 15px var(--font); fill: var(--role-noun); }
              .ex { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .ar { stroke: var(--ink-500); stroke-width: 1.6; fill: none; marker-end: url(#ah2); }
              .yn { font: 700 11px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-500)"/>
            </marker>
          </defs>

          <rect class="q" x="200" y="12" width="260" height="46" rx="10"/>
          <text class="qt" x="330" y="33" text-anchor="middle">Does the noun end in -s?</text>
          <text class="ex" x="330" y="50" text-anchor="middle">(just check the last letter)</text>

          <path class="ar" d="M250 58 L130 58 L130 110"/>
          <text class="yn" x="150" y="86">NO</text>
          <path class="ar" d="M410 58 L530 58 L530 110"/>
          <text class="yn" x="470" y="86">YES</text>

          <g transform="translate(130 110)">
            <rect class="ok" x="-110" y="0" width="220" height="64" rx="10"/>
            <text class="okt" x="0" y="26" text-anchor="middle">+ 's</text>
            <text class="ex" x="0" y="44" text-anchor="middle">boy → boy's bag</text>
            <text class="ex" x="0" y="58" text-anchor="middle">children → children's park</text>
          </g>

          <g transform="translate(530 110)">
            <rect class="ok" x="-110" y="0" width="220" height="64" rx="10"/>
            <text class="okt" x="0" y="26" text-anchor="middle">just '</text>
            <text class="ex" x="0" y="44" text-anchor="middle">boys → boys' bags</text>
            <text class="ex" x="0" y="58" text-anchor="middle">teachers → teachers' room</text>
          </g>

          <rect class="q" x="150" y="206" width="360" height="66" rx="10"/>
          <text class="qt" x="330" y="230" text-anchor="middle">A lifeless thing? 'of' is better</text>
          <text class="ex" x="330" y="249" text-anchor="middle">the leg of the table (not: the table's leg)</text>
          <text class="ex" x="330" y="264" text-anchor="middle">but with time, 's works: today's news</text>
        </svg>