<svg viewBox="0 0 480 320" role="img" aria-label="Top: Sam gives a book to Riya — Sam lends, Riya borrows. Bottom: you in the middle. Coming towards you is bring, going away from you is take." xmlns="http://www.w3.org/2000/svg"><title>One book, two points of view: the giver lends , the receiver borrows . And wherever &quot;you&quot; are decides whether it is bring or take.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dr-per { fill: var(--accent-line); }
              .dr-bk { fill: var(--accent-2); }
              .dr-ln { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#dr-ar); }
              .dr-ln2 { fill: none; stroke: var(--role-noun); stroke-width: 3; marker-end: url(#dr-ar2); }
              .dr-me { fill: var(--accent); }
              .dr-dv { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
              .dr-n { font: 700 13px var(--font); fill: var(--text); }
              .dr-t { font: 700 13px var(--font); fill: var(--accent); }
              .dr-t2 { font: 800 14px var(--font); fill: var(--role-noun); }
              .dr-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .dr-mt { font: 800 13px var(--font); fill: var(--sheet); }
            </style>
            <marker id="dr-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
            <marker id="dr-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-noun)"/>
            </marker>
          </defs>

          <circle class="dr-per" cx="60" cy="44" r="16"/>
          <ellipse class="dr-per" cx="60" cy="86" rx="26" ry="18"/>
          <text class="dr-n" x="60" y="124" text-anchor="middle">Riya</text>
          <text class="dr-s" x="60" y="142" text-anchor="middle">borrows (takes)</text>

          <circle class="dr-per" cx="420" cy="44" r="16"/>
          <ellipse class="dr-per" cx="420" cy="86" rx="26" ry="18"/>
          <text class="dr-n" x="420" y="124" text-anchor="middle">Sam</text>
          <text class="dr-s" x="420" y="142" text-anchor="middle">lends (gives)</text>

          <path class="dr-ln" d="M380 72 L104 72"/>
          <rect class="dr-bk" x="228" y="60" width="26" height="22" rx="3"/>
          <text class="dr-t" x="240" y="46" text-anchor="middle">Sam lends a book TO Riya.</text>
          <text class="dr-t" x="240" y="106" text-anchor="middle">Riya borrows a book FROM Sam.</text>

          <path class="dr-dv" d="M10 168 L470 168"/>

          <path class="dr-ln2" d="M30 240 L204 240"/>
          <path class="dr-ln2" d="M276 240 L450 240"/>
          <circle class="dr-me" cx="240" cy="240" r="26"/>
          <text class="dr-mt" x="240" y="245" text-anchor="middle">You</text>
          <text class="dr-t2" x="117" y="226" text-anchor="middle">BRING</text>
          <text class="dr-s" x="117" y="262" text-anchor="middle">towards you</text>
          <text class="dr-t2" x="363" y="226" text-anchor="middle">TAKE</text>
          <text class="dr-s" x="363" y="262" text-anchor="middle">away from you</text>
          <text class="dr-s" x="240" y="302" text-anchor="middle">Bring me some water. · Take this file to the office.</text>
        </svg>