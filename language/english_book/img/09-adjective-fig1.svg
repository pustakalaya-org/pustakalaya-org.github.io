<svg viewBox="0 0 720 320" role="img" aria-label="The adjective train showing the correct order — opinion, size, age, shape, colour, origin, material, purpose, then the noun" xmlns="http://www.w3.org/2000/svg"><title>The adjective train: the engine (noun) is at the front, and the cars are coupled behind it in this order.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--ink-300:#cbd5e1;--role-adj:#9333ea;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .car { fill: var(--card); stroke: var(--role-adj); stroke-width: 2; }
              .cno { font: 800 11px var(--font); fill: var(--role-adj); }
              .cnm { font: 800 11.5px var(--font); fill: var(--text); }
              .cex { font: 500 10px var(--font); fill: var(--text-soft); }
              .eng { fill: var(--role-noun); }
              .engt { font: 800 13px var(--font); fill: #fff; }
              .rail { stroke: var(--ink-300); stroke-width: 2.5; }
              .tie { stroke: var(--ink-200); stroke-width: 2; }
              .cap3 { font: 500 12px var(--font); fill: var(--text-soft); }
              .hdr2 { font: 800 14px var(--font); fill: var(--text); }
              .wheel { fill: var(--ink-300); }
            </style>
          </defs>

          <text class="hdr2" x="16" y="22">Adjective train — from the back to the front, and the engine is always the NOUN</text>

          <!-- rails -->
          <line class="rail" x1="10" y1="196" x2="710" y2="196"/>
          <g class="tie">
            <line x1="40" y1="196" x2="40" y2="204"/>
            <line x1="140" y1="196" x2="140" y2="204"/>
            <line x1="240" y1="196" x2="240" y2="204"/>
            <line x1="340" y1="196" x2="340" y2="204"/>
            <line x1="440" y1="196" x2="440" y2="204"/>
            <line x1="540" y1="196" x2="540" y2="204"/>
            <line x1="640" y1="196" x2="640" y2="204"/>
          </g>

          <!-- cars -->
          <g transform="translate(14 110)">
            <rect class="car" x="0" y="0" width="76" height="80" rx="8"/>
            <text class="cno" x="38" y="16" text-anchor="middle">1</text>
            <text class="cnm" x="38" y="34" text-anchor="middle">OPINION</text>
            <text class="cex" x="38" y="50" text-anchor="middle">lovely</text>
            <text class="cex" x="38" y="63" text-anchor="middle">ugly, nice</text>
            <text class="cex" x="38" y="76" text-anchor="middle">boring</text>
            <circle class="wheel" cx="20" cy="88" r="5"/>
            <circle class="wheel" cx="58" cy="88" r="5"/>
          </g>
          <g transform="translate(96 110)">
            <rect class="car" x="0" y="0" width="72" height="80" rx="8"/>
            <text class="cno" x="36" y="16" text-anchor="middle">2</text>
            <text class="cnm" x="36" y="34" text-anchor="middle">SIZE</text>
            <text class="cex" x="36" y="50" text-anchor="middle">big, small</text>
            <text class="cex" x="36" y="63" text-anchor="middle">tall, tiny</text>
            <circle class="wheel" cx="18" cy="88" r="5"/>
            <circle class="wheel" cx="54" cy="88" r="5"/>
          </g>
          <g transform="translate(174 110)">
            <rect class="car" x="0" y="0" width="72" height="80" rx="8"/>
            <text class="cno" x="36" y="16" text-anchor="middle">3</text>
            <text class="cnm" x="36" y="34" text-anchor="middle">AGE</text>
            <text class="cex" x="36" y="50" text-anchor="middle">old, new</text>
            <text class="cex" x="36" y="63" text-anchor="middle">young</text>
            <circle class="wheel" cx="18" cy="88" r="5"/>
            <circle class="wheel" cx="54" cy="88" r="5"/>
          </g>
          <g transform="translate(252 110)">
            <rect class="car" x="0" y="0" width="72" height="80" rx="8"/>
            <text class="cno" x="36" y="16" text-anchor="middle">4</text>
            <text class="cnm" x="36" y="34" text-anchor="middle">SHAPE</text>
            <text class="cex" x="36" y="50" text-anchor="middle">round</text>
            <text class="cex" x="36" y="63" text-anchor="middle">square</text>
            <circle class="wheel" cx="18" cy="88" r="5"/>
            <circle class="wheel" cx="54" cy="88" r="5"/>
          </g>
          <g transform="translate(330 110)">
            <rect class="car" x="0" y="0" width="72" height="80" rx="8"/>
            <text class="cno" x="36" y="16" text-anchor="middle">5</text>
            <text class="cnm" x="36" y="34" text-anchor="middle">COLOUR</text>
            <text class="cex" x="36" y="50" text-anchor="middle">red, blue</text>
            <text class="cex" x="36" y="63" text-anchor="middle">golden</text>
            <circle class="wheel" cx="18" cy="88" r="5"/>
            <circle class="wheel" cx="54" cy="88" r="5"/>
          </g>
          <g transform="translate(408 110)">
            <rect class="car" x="0" y="0" width="72" height="80" rx="8"/>
            <text class="cno" x="36" y="16" text-anchor="middle">6</text>
            <text class="cnm" x="36" y="34" text-anchor="middle">ORIGIN</text>
            <text class="cex" x="36" y="50" text-anchor="middle">Indian</text>
            <text class="cex" x="36" y="63" text-anchor="middle">Japanese</text>
            <circle class="wheel" cx="18" cy="88" r="5"/>
            <circle class="wheel" cx="54" cy="88" r="5"/>
          </g>
          <g transform="translate(486 110)">
            <rect class="car" x="0" y="0" width="76" height="80" rx="8"/>
            <text class="cno" x="38" y="16" text-anchor="middle">7</text>
            <text class="cnm" x="38" y="34" text-anchor="middle">MATERIAL</text>
            <text class="cex" x="38" y="50" text-anchor="middle">wooden</text>
            <text class="cex" x="38" y="63" text-anchor="middle">cotton</text>
            <circle class="wheel" cx="20" cy="88" r="5"/>
            <circle class="wheel" cx="56" cy="88" r="5"/>
          </g>
          <g transform="translate(568 110)">
            <rect class="car" x="0" y="0" width="74" height="80" rx="8"/>
            <text class="cno" x="37" y="16" text-anchor="middle">8</text>
            <text class="cnm" x="37" y="34" text-anchor="middle">PURPOSE</text>
            <text class="cex" x="37" y="50" text-anchor="middle">writing</text>
            <text class="cex" x="37" y="63" text-anchor="middle">sleeping</text>
            <circle class="wheel" cx="19" cy="88" r="5"/>
            <circle class="wheel" cx="55" cy="88" r="5"/>
          </g>

          <!-- engine -->
          <g transform="translate(648 104)">
            <rect class="eng" x="0" y="0" width="64" height="86" rx="10"/>
            <text class="engt" x="32" y="40" text-anchor="middle">NOUN</text>
            <text class="engt" x="32" y="58" text-anchor="middle" font-size="11">table</text>
            <circle class="wheel" cx="16" cy="88" r="6"/>
            <circle class="wheel" cx="48" cy="88" r="6"/>
          </g>

          <text class="cap3" x="16" y="240">a lovely small old round brown Indian wooden writing table</text>
          <text class="cap3" x="16" y="262">In real life you rarely use more than three — but the ones you do use follow this order.</text>
          <text class="cap3" x="16" y="288">Memory shortcut: O-S-A-S-C-O-M-P — "Oh, She Always Says Cute Old Material Puns."</text>
          <text class="cap3" x="16" y="310">If in doubt, one rule is enough: opinion sits farthest away, material sits closest to the noun.</text>
        </svg>