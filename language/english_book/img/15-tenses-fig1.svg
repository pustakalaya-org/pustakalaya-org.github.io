<svg viewBox="0 0 880 640" role="img" aria-label="Map of the twelve tenses: three columns past, present, future and four rows simple, continuous, perfect, perfect continuous, with a small timeline in each box showing where the action sits" xmlns="http://www.w3.org/2000/svg"><title>Filled circle = the point of the action. Thick line = the action is going on. Empty circle = the
        other point before which the action finished. Orange dotted line = NOW.</title><style>svg{--brand-500:#f97316;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--ink-500:#64748b;--line:#e3e7ef;--page-alt:#eef1f6;--role-noun:#2563eb;--role-verb:#0d9488;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ax { stroke: var(--ink-300); stroke-width: 2; fill: none; }
              .mini { stroke: var(--ink-300); stroke-width: 1.5; fill: none; }
              .nowl { stroke: var(--brand-500); stroke-width: 1.6; stroke-dasharray: 4 3; }
              .cell { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.4; }
              .ttl { font: 750 12.5px var(--font); }
              .eg  { font: 700 13px var(--font); fill: var(--role-verb); }
              .sub { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .rowl { font: 750 11.5px var(--font); fill: var(--text-soft); }
              .colh { font: 800 13px var(--font); letter-spacing: 0.06em; }
              .tp { fill: var(--role-noun); stroke: var(--role-noun); }
              .tn { fill: var(--role-verb); stroke: var(--role-verb); }
              .tf { fill: var(--brand-500); stroke: var(--brand-500); }
            </style>
            <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-500)"/>
            </marker>
          </defs>

          <!-- master time axis -->
          <line class="ax" x1="120" y1="40" x2="862" y2="40" marker-end="url(#arw)"/>
          <line class="nowl" x1="490" y1="22" x2="490" y2="60"/>
          <text class="sub" x="200" y="30" text-anchor="middle">earlier time</text>
          <text class="colh" x="490" y="18" text-anchor="middle" fill="var(--brand-600)">NOW</text>
          <text class="sub" x="760" y="30" text-anchor="middle">later time</text>

          <!-- column headers -->
          <text class="colh tp" x="240" y="86" text-anchor="middle">PAST</text>
          <text class="colh tn" x="490" y="86" text-anchor="middle">PRESENT</text>
          <text class="colh tf" x="740" y="86" text-anchor="middle">FUTURE</text>

          <!-- row labels -->
          <text class="rowl" x="108" y="160" text-anchor="end">SIMPLE</text>
          <text class="rowl" x="108" y="290" text-anchor="end">CONTINUOUS</text>
          <text class="rowl" x="108" y="420" text-anchor="end">PERFECT</text>
          <text class="rowl" x="108" y="543" text-anchor="end">PERFECT</text>
          <text class="rowl" x="108" y="558" text-anchor="end">CONTINUOUS</text>

          <!-- ================= ROW 1 : SIMPLE ================= -->
          <g transform="translate(120 100)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tp" x="14" y="22">Past Simple</text>
            <text class="eg" x="14" y="42">I wrote</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tp" cx="56" cy="78" r="7"/>
            <text class="sub" x="14" y="108">Happened once, finished. Time known.</text>
          </g>
          <g transform="translate(370 100)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tn" x="14" y="22">Present Simple</text>
            <text class="eg" x="14" y="42">I write</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tn" cx="44" cy="78" r="5"/>
            <circle class="tn" cx="82" cy="78" r="5"/>
            <circle class="tn" cx="120" cy="78" r="5"/>
            <circle class="tn" cx="158" cy="78" r="5"/>
            <circle class="tn" cx="196" cy="78" r="5"/>
            <text class="sub" x="14" y="108">A habit or a fact. Happens again and again.</text>
          </g>
          <g transform="translate(620 100)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tf" x="14" y="22">Future Simple</text>
            <text class="eg" x="14" y="42">I will write</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tf" cx="186" cy="78" r="7"/>
            <text class="sub" x="14" y="108">Will happen once later. A decision, a promise.</text>
          </g>

          <!-- ================= ROW 2 : CONTINUOUS ================= -->
          <g transform="translate(120 230)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tp" x="14" y="22">Past Continuous</text>
            <text class="eg" x="14" y="42">I was writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tp" x="28" y="72" width="62" height="12" rx="6"/>
            <text class="sub" x="14" y="108">Was going on at that time.</text>
          </g>
          <g transform="translate(370 230)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tn" x="14" y="22">Present Continuous</text>
            <text class="eg" x="14" y="42">I am writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tn" x="88" y="72" width="64" height="12" rx="6"/>
            <text class="sub" x="14" y="108">Now, going on at this moment.</text>
          </g>
          <g transform="translate(620 230)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tf" x="14" y="22">Future Continuous</text>
            <text class="eg" x="14" y="42">I will be writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tf" x="152" y="72" width="62" height="12" rx="6"/>
            <text class="sub" x="14" y="108">Will be going on at a later time.</text>
          </g>

          <!-- ================= ROW 3 : PERFECT ================= -->
          <g transform="translate(120 360)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tp" x="14" y="22">Past Perfect</text>
            <text class="eg" x="14" y="42">I had written</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tp" cx="34" cy="78" r="7"/>
            <line x1="44" y1="78" x2="76" y2="78" stroke="var(--role-noun)" stroke-width="2" marker-end="url(#arw)"/>
            <circle cx="88" cy="78" r="6" fill="none" stroke="var(--role-noun)" stroke-width="2.4"/>
            <text class="sub" x="14" y="108">Finished before another past action.</text>
          </g>
          <g transform="translate(370 360)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tn" x="14" y="22">Present Perfect</text>
            <text class="eg" x="14" y="42">I have written</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tn" cx="52" cy="78" r="7"/>
            <line x1="62" y1="78" x2="112" y2="78" stroke="var(--role-verb)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arw)"/>
            <text class="sub" x="14" y="108">Done — but the result is still here.</text>
          </g>
          <g transform="translate(620 360)">
            <rect class="cell" x="0" y="0" width="240" height="120" rx="10"/>
            <text class="ttl tf" x="14" y="22">Future Perfect</text>
            <text class="eg" x="14" y="42">I will have written</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <circle class="tf" cx="156" cy="78" r="7"/>
            <line x1="166" y1="78" x2="198" y2="78" stroke="var(--brand-500)" stroke-width="2" marker-end="url(#arw)"/>
            <circle cx="210" cy="78" r="6" fill="none" stroke="var(--brand-500)" stroke-width="2.4"/>
            <text class="sub" x="14" y="108">Will be finished before a later deadline.</text>
          </g>

          <!-- ============ ROW 4 : PERFECT CONTINUOUS ============ -->
          <g transform="translate(120 490)">
            <rect class="cell" x="0" y="0" width="240" height="124" rx="10"/>
            <text class="ttl tp" x="14" y="22">Past Perfect Cont.</text>
            <text class="eg" x="14" y="42">I had been writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tp" x="24" y="72" width="54" height="12" rx="6"/>
            <circle cx="90" cy="78" r="6" fill="none" stroke="var(--role-noun)" stroke-width="2.4"/>
            <text class="sub" x="14" y="110">Going on for a while up to that past point.</text>
          </g>
          <g transform="translate(370 490)">
            <rect class="cell" x="0" y="0" width="240" height="124" rx="10"/>
            <text class="ttl tn" x="14" y="22">Present Perfect Cont.</text>
            <text class="eg" x="14" y="42">I have been writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tn" x="52" y="72" width="68" height="12" rx="6"/>
            <text class="sub" x="14" y="110">Started earlier, still going on.</text>
          </g>
          <g transform="translate(620 490)">
            <rect class="cell" x="0" y="0" width="240" height="124" rx="10"/>
            <text class="ttl tf" x="14" y="22">Future Perfect Cont.</text>
            <text class="eg" x="14" y="42">I will have been writing</text>
            <line class="mini" x1="16" y1="78" x2="224" y2="78"/>
            <line class="nowl" x1="120" y1="64" x2="120" y2="92"/>
            <rect class="tf" x="146" y="72" width="60" height="12" rx="6"/>
            <circle cx="216" cy="78" r="6" fill="none" stroke="var(--brand-500)" stroke-width="2.4"/>
            <text class="sub" x="14" y="110">Will have been going on up to that point.</text>
          </g>
        </svg>