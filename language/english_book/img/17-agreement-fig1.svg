<svg viewBox="0 0 720 380" role="img" aria-label="Diagram for finding the real subject: remove the phrase between the subject and the verb and the correct verb appears" xmlns="http://www.w3.org/2000/svg"><title>Blue word = the real subject. Pink dotted box = the part that has no effect on the verb.
        Green arrow = what matches what.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .head { font: 800 15px var(--font); fill: var(--role-noun); }
              .mid  { font: 500 14px var(--font); fill: var(--text-soft); }
              .vb   { font: 800 15px var(--font); fill: var(--role-verb); }
              .tail { font: 500 14px var(--font); fill: var(--text); }
              .cut  { fill: none; stroke: var(--role-adv); stroke-width: 1.6; stroke-dasharray: 5 3; }
              .cutx { stroke: var(--role-adv); stroke-width: 1.6; }
              .link { fill: none; stroke: var(--role-verb); stroke-width: 2.2; }
              .note { font: 600 11px var(--font); fill: var(--text-soft); }
              .badge{ font: 800 10px var(--font); fill: var(--role-adv); letter-spacing: 0.06em; }
            </style>
            <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/>
            </marker>
          </defs>

          <text class="note" x="20" y="22">Remove the phrase in the middle — the subject becomes clear.</text>

          <!-- example 1 -->
          <g transform="translate(20 60)">
            <text class="head" x="0" y="20">The box</text>
            <rect class="cut" x="76" y="2" width="134" height="26" rx="6"/>
            <text class="mid" x="86" y="20">of old books</text>
            <line class="cutx" x1="80" y1="26" x2="206" y2="4"/>
            <text class="badge" x="76" y="46">REMOVE</text>
            <text class="vb" x="222" y="20">is</text>
            <text class="tail" x="246" y="20">very heavy.</text>
            <path class="link" d="M34 -2 C 60 -26, 200 -26, 226 -2" marker-end="url(#ag)"/>
            <text class="note" x="100" y="-24" text-anchor="middle">box → is</text>
          </g>

          <!-- example 2 -->
          <g transform="translate(20 170)">
            <text class="head" x="0" y="20">One</text>
            <rect class="cut" x="42" y="2" width="146" height="26" rx="6"/>
            <text class="mid" x="52" y="20">of my friends</text>
            <line class="cutx" x1="46" y1="26" x2="184" y2="4"/>
            <text class="badge" x="42" y="46">REMOVE</text>
            <text class="vb" x="200" y="20">lives</text>
            <text class="tail" x="244" y="20">in Nagpur.</text>
            <path class="link" d="M18 -2 C 50 -26, 180 -26, 208 -2" marker-end="url(#ag)"/>
            <text class="note" x="110" y="-24" text-anchor="middle">One → lives (it is about one friend)</text>
          </g>

          <!-- example 3 : nearest rule -->
          <g transform="translate(20 290)">
            <text class="mid" x="0" y="20">Neither the teacher nor</text>
            <text class="head" x="178" y="20">the students</text>
            <text class="vb" x="286" y="20">were</text>
            <text class="tail" x="332" y="20">late.</text>
            <path class="link" d="M224 30 C 240 56, 280 56, 298 30" marker-end="url(#ag)"/>
            <text class="note" x="260" y="68" text-anchor="middle">with neither…nor, the verb matches the NEAREST subject</text>
          </g>
        </svg>