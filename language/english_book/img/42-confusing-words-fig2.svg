<svg viewBox="0 0 480 300" role="img" aria-label="An apostrophe stands in for a missing letter: it's means it is, you're means you are, they're means they are. Its, your and their show who owns something and never have an apostrophe." xmlns="http://www.w3.org/2000/svg"><title>An apostrophe is a patch that sits where a letter is missing. If you see a patch, open it up and read the full words.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ap-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .ap-b { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .ap-p { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .ap-w { font: 700 16px var(--font); fill: var(--text); }
              .ap-q { font: 800 16px var(--font); fill: var(--accent); }
              .ap-eq { font: 700 18px var(--font); fill: var(--text-soft); }
              .ap-n { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .ap-g { fill: var(--accent); }
              .ap-pb { font: 700 13.5px var(--font); fill: var(--text); }
              .ap-ps { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="ap-a" x="10" y="20" width="96" height="46" rx="10"/>
          <text class="ap-w" x="58" y="49" text-anchor="middle">it<tspan class="ap-q">'</tspan>s</text>
          <text class="ap-eq" x="118" y="49">=</text>
          <rect class="ap-b" x="140" y="20" width="70" height="46" rx="10"/>
          <text class="ap-w" x="175" y="49" text-anchor="middle">it</text>
          <rect class="ap-b" x="218" y="20" width="70" height="46" rx="10"/>
          <text class="ap-w" x="253" y="49" text-anchor="middle"><tspan class="ap-q">i</tspan>s</text>
          <text class="ap-n" x="300" y="40">' replaces the</text>
          <text class="ap-n" x="300" y="57">letter "i"</text>

          <rect class="ap-a" x="10" y="84" width="96" height="46" rx="10"/>
          <text class="ap-w" x="58" y="113" text-anchor="middle">you<tspan class="ap-q">'</tspan>re</text>
          <text class="ap-eq" x="118" y="113">=</text>
          <rect class="ap-b" x="140" y="84" width="70" height="46" rx="10"/>
          <text class="ap-w" x="175" y="113" text-anchor="middle">you</text>
          <rect class="ap-b" x="218" y="84" width="70" height="46" rx="10"/>
          <text class="ap-w" x="253" y="113" text-anchor="middle"><tspan class="ap-q">a</tspan>re</text>
          <text class="ap-n" x="300" y="104">' replaces the</text>
          <text class="ap-n" x="300" y="121">letter "a"</text>

          <rect class="ap-a" x="10" y="148" width="96" height="46" rx="10"/>
          <text class="ap-w" x="58" y="177" text-anchor="middle">they<tspan class="ap-q">'</tspan>re</text>
          <text class="ap-eq" x="118" y="177">=</text>
          <rect class="ap-b" x="140" y="148" width="70" height="46" rx="10"/>
          <text class="ap-w" x="175" y="177" text-anchor="middle">they</text>
          <rect class="ap-b" x="218" y="148" width="70" height="46" rx="10"/>
          <text class="ap-w" x="253" y="177" text-anchor="middle"><tspan class="ap-q">a</tspan>re</text>
          <text class="ap-n" x="300" y="168">' replaces the</text>
          <text class="ap-n" x="300" y="185">letter "a"</text>

          <rect class="ap-p" x="10" y="214" width="460" height="74" rx="12"/>
          <text class="ap-pb" x="26" y="240">its · your · their = WHOSE? — never an apostrophe</text>
          <text class="ap-ps" x="26" y="262">The dog wagged its tail. · Is this your bag? · It's their house.</text>
          <text class="ap-ps" x="26" y="280">And there = place: t + HERE → "over there".</text>
        </svg>