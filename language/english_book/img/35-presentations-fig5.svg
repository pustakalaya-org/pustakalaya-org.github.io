<svg viewBox="0 0 480 300" role="img" aria-label="Box breathing square: breathe in for four seconds, hold for four, breathe out for four, hold for four. Three rounds before going on stage." xmlns="http://www.w3.org/2000/svg"><title>When the heartbeat slows, the voice also becomes slower and deeper. It is a one-minute job.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .br-sq { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linejoin: round; }
              .br-ar { fill: var(--accent); }
              .br-c { fill: var(--accent-2); }
              .br-t { font: 700 14px var(--font); fill: var(--text); }
              .br-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .br-m { font: 800 16px var(--font); fill: var(--accent); }
            </style>
          </defs>
          <path class="br-sq" d="M140 50 L340 50 L340 250 L140 250 Z"/>
          <polygon class="br-ar" points="234,43 248,50 234,57"/>
          <polygon class="br-ar" points="333,144 340,158 347,144"/>
          <polygon class="br-ar" points="246,243 232,250 246,257"/>
          <polygon class="br-ar" points="133,156 140,142 147,156"/>
          <circle class="br-c" cx="140" cy="50" r="7"/>
          <circle class="br-c" cx="340" cy="50" r="7"/>
          <circle class="br-c" cx="340" cy="250" r="7"/>
          <circle class="br-c" cx="140" cy="250" r="7"/>

          <text class="br-t" x="240" y="32" text-anchor="middle">Breathe in · 4 seconds</text>
          <text class="br-t" x="354" y="146">Hold</text>
          <text class="br-s" x="354" y="164">4 seconds</text>
          <text class="br-t" x="240" y="280" text-anchor="middle">Breathe out · 4 seconds</text>
          <text class="br-t" x="126" y="146" text-anchor="end">Hold</text>
          <text class="br-s" x="126" y="164" text-anchor="end">4 seconds</text>

          <text class="br-m" x="240" y="146" text-anchor="middle">Three rounds</text>
          <text class="br-s" x="240" y="166" text-anchor="middle">before you go on stage</text>
        </svg>