<svg viewBox="0 0 640 250" role="img" aria-label="Inversion: I have never seen it becomes Never have I seen it. Never moves to the front, and have moves in front of the subject I." xmlns="http://www.w3.org/2000/svg"><title>Two steps: the negative word goes first, then helping verb + subject — just like Have I…? in a question.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-pron:#0891b2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .iv-b { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
              .iv-n { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
              .iv-a { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
              .iv-s { fill: var(--sheet); stroke: var(--role-pron); stroke-width: 2.5; }
              .iv-t { font: 700 15px var(--font); fill: var(--text); }
              .iv-l { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .iv-arc { fill: none; stroke: var(--role-verb); stroke-width: 2.5; marker-end: url(#iv-m); }
              .iv-arc2 { fill: none; stroke: var(--accent); stroke-width: 2.5; marker-end: url(#iv-m2); }
            </style>
            <marker id="iv-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/>
            </marker>
            <marker id="iv-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>

          <text class="iv-l" x="20" y="24">NORMAL ORDER</text>
          <rect class="iv-s" x="20" y="36" width="90" height="44" rx="8"/>
          <text class="iv-t" x="65" y="63" text-anchor="middle">I</text>
          <rect class="iv-a" x="122" y="36" width="100" height="44" rx="8"/>
          <text class="iv-t" x="172" y="63" text-anchor="middle">have</text>
          <rect class="iv-n" x="234" y="36" width="110" height="44" rx="8"/>
          <text class="iv-t" x="289" y="63" text-anchor="middle">never</text>
          <rect class="iv-b" x="356" y="36" width="130" height="44" rx="8"/>
          <text class="iv-t" x="421" y="63" text-anchor="middle">seen it.</text>

          <path class="iv-arc2" d="M289 84 C289 118 80 110 72 154"/>
          <path class="iv-arc" d="M172 84 C172 120 192 124 192 154"/>

          <text class="iv-l" x="20" y="150">INVERSION</text>
          <rect class="iv-n" x="20" y="160" width="110" height="44" rx="8"/>
          <text class="iv-t" x="75" y="187" text-anchor="middle">Never</text>
          <rect class="iv-a" x="142" y="160" width="100" height="44" rx="8"/>
          <text class="iv-t" x="192" y="187" text-anchor="middle">have</text>
          <rect class="iv-s" x="254" y="160" width="90" height="44" rx="8"/>
          <text class="iv-t" x="299" y="187" text-anchor="middle">I</text>
          <rect class="iv-b" x="356" y="160" width="130" height="44" rx="8"/>
          <text class="iv-t" x="421" y="187" text-anchor="middle">seen it.</text>

          <text class="iv-l" x="500" y="176">= question</text>
          <text class="iv-l" x="500" y="194">word order</text>
          <text class="iv-l" x="20" y="236">No helping verb? Use do / does / did: Rarely do we… · Little did he know…</text>
        </svg>