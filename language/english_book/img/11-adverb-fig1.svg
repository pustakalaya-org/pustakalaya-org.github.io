<svg viewBox="0 0 660 260" role="img" aria-label="An adverb can work on three things — a verb, an adjective and another adverb; an adjective works only on a noun" xmlns="http://www.w3.org/2000/svg"><title>An adverb can work on three things — a verb, an adjective or another adverb. A noun is outside its reach.</title><style>svg{--bad:#be123c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tgt { fill: var(--card); stroke-width: 2; }
              .tt { font: 700 12.5px var(--font); }
              .src { fill: var(--role-adv); }
              .srct { font: 800 13px var(--font); fill: #fff; }
              .arw { stroke: var(--role-adv); stroke-width: 2; fill: none; marker-end: url(#ah5); }
              .lbl2 { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .hdr3 { font: 800 13px var(--font); fill: var(--text); }
              .nx { stroke: var(--bad); stroke-width: 2; }
            </style>
            <marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-adv)"/>
            </marker>
          </defs>

          <text class="hdr3" x="14" y="20">What an ADVERB can describe</text>

          <rect class="src" x="20" y="100" width="118" height="46" rx="10"/>
          <text class="srct" x="79" y="122" text-anchor="middle">ADVERB</text>
          <text class="srct" x="79" y="138" text-anchor="middle" font-size="10">quickly, very</text>

          <path class="arw" d="M140 110 C210 60, 250 52, 316 52"/>
          <path class="arw" d="M140 123 C215 120, 250 118, 316 118"/>
          <path class="arw" d="M140 136 C210 186, 250 192, 316 192"/>

          <g transform="translate(320 32)">
            <rect class="tgt" x="0" y="0" width="150" height="40" rx="9" stroke="var(--role-verb)"/>
            <text class="tt" x="75" y="25" text-anchor="middle" fill="var(--role-verb)">VERB</text>
            <text class="lbl2" x="162" y="25">walks quickly</text>
          </g>
          <g transform="translate(320 98)">
            <rect class="tgt" x="0" y="0" width="150" height="40" rx="9" stroke="var(--role-adj)"/>
            <text class="tt" x="75" y="25" text-anchor="middle" fill="var(--role-adj)">ADJECTIVE</text>
            <text class="lbl2" x="162" y="25">very tall</text>
          </g>
          <g transform="translate(320 172)">
            <rect class="tgt" x="0" y="0" width="150" height="40" rx="9" stroke="var(--role-adv)"/>
            <text class="tt" x="75" y="25" text-anchor="middle" fill="var(--role-adv)">ANOTHER ADVERB</text>
            <text class="lbl2" x="162" y="25">too quickly</text>
          </g>

          <g transform="translate(20 194)">
            <rect class="tgt" x="0" y="0" width="118" height="42" rx="9" stroke="var(--role-noun)"/>
            <text class="tt" x="59" y="19" text-anchor="middle" fill="var(--role-noun)">NOUN</text>
            <text class="lbl2" x="59" y="34" text-anchor="middle">not for adverbs</text>
            <line class="nx" x1="100" y1="-56" x2="128" y2="-28"/>
            <line class="nx" x1="128" y1="-56" x2="100" y2="-28"/>
          </g>
          <text class="lbl2" x="14" y="252">For a noun, use an adjective — "a quick walk", not "a quickly walk".</text>
        </svg>