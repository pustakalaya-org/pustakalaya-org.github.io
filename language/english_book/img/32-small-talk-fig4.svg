<svg viewBox="0 0 480 300" role="img" aria-label="Scale of agreement: five levels from Absolutely to I see it differently. The warning below says You are wrong is not on this scale at all." xmlns="http://www.w3.org/2000/svg"><title>Even as you move to the right, the voice stays soft. The strongest form of disagreement is
        &quot;I see it differently&quot; — not &quot;you are wrong&quot;.</title><style>svg{--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adv:#db2777;--role-conj:#65a30d;--role-interj:#e11d48;--role-prep:#ea580c;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sc-ln { fill: none; stroke: var(--accent-line); stroke-width: 3; }
              .sc-tk { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
              .sc-p { font: 700 13px var(--font); fill: var(--text); }
              .sc-g { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .sc-x { fill: var(--sheet); stroke: var(--role-interj); stroke-width: 2; }
              .sc-xt { font: 700 13px var(--font); fill: var(--role-interj); }
            </style>
          </defs>

          <path class="sc-ln" d="M30 150 L450 150"/>

          <path class="sc-tk" d="M30 140 L30 128"/>
          <path class="sc-tk" d="M135 140 L135 88"/>
          <path class="sc-tk" d="M240 140 L240 56"/>
          <path class="sc-tk" d="M345 140 L345 88"/>
          <path class="sc-tk" d="M450 140 L450 128"/>

          <circle cx="30" cy="150" r="9" fill="var(--role-conj)"/>
          <circle cx="135" cy="150" r="9" fill="var(--role-verb)"/>
          <circle cx="240" cy="150" r="9" fill="var(--accent-2)"/>
          <circle cx="345" cy="150" r="9" fill="var(--role-prep)"/>
          <circle cx="450" cy="150" r="9" fill="var(--role-adv)"/>

          <text class="sc-p" x="22" y="120">Absolutely!</text>
          <text class="sc-p" x="135" y="80" text-anchor="middle">That's so true.</text>
          <text class="sc-p" x="240" y="48" text-anchor="middle">I see your point, but…</text>
          <text class="sc-p" x="345" y="80" text-anchor="middle">I'm not so sure.</text>
          <text class="sc-p" x="458" y="120" text-anchor="end">I see it differently.</text>

          <text class="sc-g" x="22" y="184">full yes</text>
          <text class="sc-g" x="135" y="210" text-anchor="middle">yes</text>
          <text class="sc-g" x="240" y="184" text-anchor="middle">half yes</text>
          <text class="sc-g" x="345" y="210" text-anchor="middle">doubt</text>
          <text class="sc-g" x="458" y="184" text-anchor="end">soft "no"</text>

          <rect class="sc-x" x="80" y="240" width="320" height="42" rx="10"/>
          <text class="sc-xt" x="240" y="266" text-anchor="middle">✗ "You are wrong." — not on this scale</text>
        </svg>