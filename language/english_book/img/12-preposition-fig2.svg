<svg viewBox="0 0 640 420" role="img" aria-label="Five boxes: Where for place, When for time, Where to for direction, How with what for manner, Why for what for purpose prepositions" xmlns="http://www.w3.org/2000/svg"><title>Question first, then the word: Where? → place, When? → time, Where to? → direction,
        How / with what? → manner, Why / for what? → purpose.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-prep:#ea580c;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pc { fill: var(--card); stroke: var(--role-prep); stroke-width: 2; }
              .pb { fill: var(--role-prep); opacity: 0.14; }
              .pq { font: 800 16px var(--font); fill: var(--role-prep); }
              .pt { font: 600 12px var(--font); fill: var(--text-soft); }
              .pw { font: 700 13px var(--font); fill: var(--text); }
              .pe { font: italic 500 12px var(--font); fill: var(--text-soft); }
              .pi { fill: none; stroke: var(--role-prep); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
            </style>
          </defs>

          <!-- WHERE? -->
          <g transform="translate(8 8)">
            <rect class="pc" x="0" y="0" width="200" height="190" rx="14"/>
            <path class="pb" d="M14 0 H186 A14 14 0 0 1 200 14 V56 H0 V14 A14 14 0 0 1 14 0 Z"/>
            <text class="pq" x="14" y="28">WHERE?</text>
            <text class="pt" x="14" y="46">Place</text>
            <path class="pi" d="M176 40 C166 28 166 16 176 14 C186 16 186 28 176 40 Z"/>
            <circle class="pi" cx="176" cy="22" r="3"/>
            <text class="pw" x="14" y="84">in · on · at · under</text>
            <text class="pw" x="14" y="106">near · behind · beside</text>
            <text class="pw" x="14" y="128">between · above</text>
            <text class="pe" x="14" y="166">under the bed</text>
          </g>

          <!-- WHEN? -->
          <g transform="translate(220 8)">
            <rect class="pc" x="0" y="0" width="200" height="190" rx="14"/>
            <path class="pb" d="M14 0 H186 A14 14 0 0 1 200 14 V56 H0 V14 A14 14 0 0 1 14 0 Z"/>
            <text class="pq" x="14" y="28">WHEN?</text>
            <text class="pt" x="14" y="46">Time</text>
            <circle class="pi" cx="176" cy="27" r="13"/>
            <path class="pi" d="M176 19 V27 L182 31"/>
            <text class="pw" x="14" y="84">at · on · in · before</text>
            <text class="pw" x="14" y="106">after · since · for</text>
            <text class="pw" x="14" y="128">during · until</text>
            <text class="pe" x="14" y="166">at 6 · on Monday · in May</text>
          </g>

          <!-- WHERE TO? -->
          <g transform="translate(432 8)">
            <rect class="pc" x="0" y="0" width="200" height="190" rx="14"/>
            <path class="pb" d="M14 0 H186 A14 14 0 0 1 200 14 V56 H0 V14 A14 14 0 0 1 14 0 Z"/>
            <text class="pq" x="14" y="28">WHERE TO?</text>
            <text class="pt" x="14" y="46">Direction</text>
            <path class="pi" d="M160 27 H190 M182 19 L190 27 L182 35"/>
            <text class="pw" x="14" y="84">to · into · onto · from</text>
            <text class="pw" x="14" y="106">through · across</text>
            <text class="pw" x="14" y="128">towards · along</text>
            <text class="pe" x="14" y="166">walk along the river</text>
          </g>

          <!-- HOW / WITH WHAT? -->
          <g transform="translate(114 218)">
            <rect class="pc" x="0" y="0" width="200" height="190" rx="14"/>
            <path class="pb" d="M14 0 H186 A14 14 0 0 1 200 14 V56 H0 V14 A14 14 0 0 1 14 0 Z"/>
            <text class="pq" x="14" y="28">HOW / WITH WHAT?</text>
            <text class="pt" x="14" y="46">Manner · way, tool</text>
            <text class="pw" x="14" y="84">by · with · in</text>
            <text class="pw" x="14" y="106">by bus · with a pen</text>
            <text class="pw" x="14" y="128">in a hurry</text>
            <text class="pe" x="14" y="166">cut it with a knife</text>
          </g>

          <!-- WHY / FOR WHAT? -->
          <g transform="translate(326 218)">
            <rect class="pc" x="0" y="0" width="200" height="190" rx="14"/>
            <path class="pb" d="M14 0 H186 A14 14 0 0 1 200 14 V56 H0 V14 A14 14 0 0 1 14 0 Z"/>
            <text class="pq" x="14" y="28">WHY / FOR WHAT?</text>
            <text class="pt" x="14" y="46">Purpose</text>
            <text class="pw" x="14" y="84">for · to</text>
            <text class="pw" x="14" y="106">for practice</text>
            <text class="pw" x="14" y="128">to the shop for milk</text>
            <text class="pe" x="14" y="166">He came for the job.</text>
          </g>
        </svg>