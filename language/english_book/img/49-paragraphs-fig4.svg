<svg viewBox="0 0 680 290" role="img" aria-label="Four signboards: a plus sign for adding a point, a two-way arrow for a contrast, an arrow for a result, and e.g. for an example, each with its words underneath" xmlns="http://www.w3.org/2000/svg"><title>The moment the reader sees the signboard, they know where the thought is heading.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--bad:#be123c;--bad-bg:#fdecef;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--line-strong:#cfd6e2;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sg-pole { fill: none; stroke: var(--text-faint); stroke-width: 3; }
              .sg-p1 { fill: var(--good-bg); stroke: var(--good); stroke-width: 2; }
              .sg-p2 { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 2; }
              .sg-p3 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .sg-p4 { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 2; }
              .sg-road { fill: none; stroke: var(--line-strong); stroke-width: 3; stroke-dasharray: 18 12; }
              .sg-sym { font: 800 24px var(--font); fill: var(--text); }
              .sg-nm { font: 800 12px var(--font); fill: var(--text); }
              .sg-w { font: 600 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <path class="sg-road" d="M10 270 H670"/>

          <g transform="translate(90 0)">
            <path class="sg-pole" d="M0 120 V262"/>
            <rect class="sg-p1" x="-70" y="30" width="140" height="90" rx="12"/>
            <text class="sg-sym" x="0" y="70" text-anchor="middle">+</text>
            <text class="sg-nm" x="0" y="100" text-anchor="middle">Add a point</text>
            <text class="sg-w" x="0" y="160" text-anchor="middle">moreover</text>
            <text class="sg-w" x="0" y="178" text-anchor="middle">in addition</text>
            <text class="sg-w" x="0" y="196" text-anchor="middle">also</text>
          </g>

          <g transform="translate(253 0)">
            <path class="sg-pole" d="M0 120 V262"/>
            <rect class="sg-p2" x="-70" y="30" width="140" height="90" rx="12"/>
            <text class="sg-sym" x="0" y="70" text-anchor="middle">↔</text>
            <text class="sg-nm" x="0" y="100" text-anchor="middle">Contrast</text>
            <text class="sg-w" x="0" y="160" text-anchor="middle">however</text>
            <text class="sg-w" x="0" y="178" text-anchor="middle">on the other hand</text>
            <text class="sg-w" x="0" y="196" text-anchor="middle">but</text>
          </g>

          <g transform="translate(416 0)">
            <path class="sg-pole" d="M0 120 V262"/>
            <rect class="sg-p3" x="-70" y="30" width="140" height="90" rx="12"/>
            <text class="sg-sym" x="0" y="70" text-anchor="middle">→</text>
            <text class="sg-nm" x="0" y="100" text-anchor="middle">Result</text>
            <text class="sg-w" x="0" y="160" text-anchor="middle">therefore</text>
            <text class="sg-w" x="0" y="178" text-anchor="middle">as a result</text>
            <text class="sg-w" x="0" y="196" text-anchor="middle">so</text>
          </g>

          <g transform="translate(579 0)">
            <path class="sg-pole" d="M0 120 V262"/>
            <rect class="sg-p4" x="-70" y="30" width="140" height="90" rx="12"/>
            <text class="sg-sym" x="0" y="70" text-anchor="middle">e.g.</text>
            <text class="sg-nm" x="0" y="100" text-anchor="middle">Example</text>
            <text class="sg-w" x="0" y="160" text-anchor="middle">for example</text>
            <text class="sg-w" x="0" y="178" text-anchor="middle">for instance</text>
            <text class="sg-w" x="0" y="196" text-anchor="middle">such as</text>
          </g>
        </svg>