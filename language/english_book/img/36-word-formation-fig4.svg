<svg viewBox="0 0 480 330" role="img" aria-label="The root port, meaning to carry, in the middle with six words around it: transport, import, export, portable, report, support." xmlns="http://www.w3.org/2000/svg"><title>One root, six words. The prefix gave the direction (im = in, ex = out, re = back), the root gave the action (carry).</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rw-c { fill: var(--accent); }
              .rw-ct { font: 800 24px var(--font); fill: var(--sheet); }
              .rw-cs { font: 600 12.5px var(--font); fill: var(--sheet); }
              .rw-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
              .rw-lf { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .rw-w { font: 700 15px var(--font); fill: var(--text); }
              .rw-hl { fill: var(--accent); }
              .rw-s { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <path class="rw-ln" d="M200 132 L145 84"/>
          <path class="rw-ln" d="M280 132 L335 84"/>
          <path class="rw-ln" d="M188 165 L135 165"/>
          <path class="rw-ln" d="M292 165 L345 165"/>
          <path class="rw-ln" d="M200 198 L145 246"/>
          <path class="rw-ln" d="M280 198 L335 246"/>

          <circle class="rw-c" cx="240" cy="165" r="52"/>
          <text class="rw-ct" x="240" y="165" text-anchor="middle">port</text>
          <text class="rw-cs" x="240" y="186" text-anchor="middle">to carry</text>

          <rect class="rw-lf" x="15" y="36" width="130" height="48" rx="10"/>
          <text class="rw-w" x="80" y="57" text-anchor="middle">trans<tspan class="rw-hl">port</tspan></text>
          <text class="rw-s" x="80" y="75" text-anchor="middle">across places</text>

          <rect class="rw-lf" x="335" y="36" width="130" height="48" rx="10"/>
          <text class="rw-w" x="400" y="57" text-anchor="middle">im<tspan class="rw-hl">port</tspan></text>
          <text class="rw-s" x="400" y="75" text-anchor="middle">bring in</text>

          <rect class="rw-lf" x="5" y="141" width="130" height="48" rx="10"/>
          <text class="rw-w" x="70" y="162" text-anchor="middle">ex<tspan class="rw-hl">port</tspan></text>
          <text class="rw-s" x="70" y="180" text-anchor="middle">send out</text>

          <rect class="rw-lf" x="345" y="141" width="130" height="48" rx="10"/>
          <text class="rw-w" x="410" y="162" text-anchor="middle"><tspan class="rw-hl">port</tspan>able</text>
          <text class="rw-s" x="410" y="180" text-anchor="middle">easy to carry</text>

          <rect class="rw-lf" x="15" y="246" width="130" height="48" rx="10"/>
          <text class="rw-w" x="80" y="267" text-anchor="middle">re<tspan class="rw-hl">port</tspan></text>
          <text class="rw-s" x="80" y="285" text-anchor="middle">carry news back</text>

          <rect class="rw-lf" x="335" y="246" width="130" height="48" rx="10"/>
          <text class="rw-w" x="400" y="267" text-anchor="middle">sup<tspan class="rw-hl">port</tspan></text>
          <text class="rw-s" x="400" y="285" text-anchor="middle">hold up from below</text>
        </svg>