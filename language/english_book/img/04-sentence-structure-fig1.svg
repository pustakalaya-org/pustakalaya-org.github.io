<svg viewBox="0 0 640 222" role="img" aria-label="The sentence 'The old man sold his bike yesterday' in two halves — the subject 'The old man' and the predicate 'sold his bike yesterday'. Ask the verb 'who?' to find the subject." xmlns="http://www.w3.org/2000/svg"><title>Subject = what the sentence is about. Predicate = everything from the verb onwards.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sp-blk { fill: var(--sheet); stroke-width: 2.2; }
              .sp-w { font: 700 15px var(--font); }
              .sp-lbl { font: 800 12.5px var(--font); letter-spacing: .06em; }
              .sp-sub { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .sp-br { fill: none; stroke-width: 2; }
              .sp-q { fill: none; stroke: var(--text-soft); stroke-width: 1.8; stroke-dasharray: 5 5; }
            </style>
            <marker id="spArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--text-soft)"/>
            </marker>
          </defs>

          <text class="sp-lbl" x="120" y="22" text-anchor="middle" fill="var(--role-noun)">SUBJECT</text>
          <text class="sp-sub" x="120" y="38" text-anchor="middle">who is it about?</text>
          <path class="sp-br" stroke="var(--role-noun)" d="M30 60 L30 48 L210 48 L210 60"/>

          <text class="sp-lbl" x="418" y="22" text-anchor="middle" fill="var(--role-verb)">PREDICATE</text>
          <text class="sp-sub" x="418" y="38" text-anchor="middle">what is said about it? (verb + the rest)</text>
          <path class="sp-br" stroke="var(--role-verb)" d="M226 60 L226 48 L610 48 L610 60"/>

          <rect class="sp-blk" x="30" y="68" width="180" height="48" rx="10" stroke="var(--role-noun)"/>
          <text class="sp-w" x="120" y="98" text-anchor="middle" fill="var(--role-noun)">The old man</text>

          <rect class="sp-blk" x="226" y="68" width="384" height="48" rx="10" stroke="var(--role-verb)"/>
          <text class="sp-w" x="418" y="98" text-anchor="middle" fill="var(--role-verb)">sold his bike yesterday.</text>

          <path class="sp-q" d="M268 122 Q195 176 124 124" marker-end="url(#spArrow)"/>
          <text class="sp-sub" x="300" y="150">"Who sold?" → The old man</text>
          <text class="sp-sub" x="320" y="200" text-anchor="middle">Ask the verb "who?" or "what?" — the answer is the subject.</text>
        </svg>