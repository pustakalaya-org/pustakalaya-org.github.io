<svg viewBox="0 0 480 360" role="img" aria-label="A video call window: four tiles, one with your shared screen, one frozen tile, and buttons for mic, camera, share and leave at the bottom. The mic button is labelled You're on mute and the share button Can you see my screen." xmlns="http://www.w3.org/2000/svg"><title>The three most common lines in one picture — mic, screen and a frozen video. Understand them the moment you hear them.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--accent-softer:color-mix(in srgb, #ea580c 5%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-interj:#e11d48;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .vc-w { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 2; }
              .vc-tile { fill: var(--accent-soft); }
              .vc-frz { fill: var(--accent-soft); stroke: var(--role-interj); stroke-width: 2; }
              .vc-p { fill: var(--accent-line); }
              .vc-scr { fill: var(--sheet); stroke: var(--text-soft); stroke-width: 1.5; }
              .vc-sl { fill: none; stroke: var(--accent); stroke-width: 3; }
              .vc-bar { fill: var(--accent-softer, var(--sheet)); }
              .vc-ic { fill: var(--text-soft); }
              .vc-ico { fill: none; stroke: var(--text-soft); stroke-width: 2; }
              .vc-off { fill: none; stroke: var(--role-interj); stroke-width: 2.5; }
              .vc-leave { fill: var(--role-interj); }
              .vc-lead { fill: none; stroke: var(--accent); stroke-width: 1.5; }
              .vc-n { font: 600 11.5px var(--font); fill: var(--text-soft); }
              .vc-q { font: 700 13px var(--font); fill: var(--accent); }
              .vc-fz { font: 700 12.5px var(--font); fill: var(--role-interj); }
            </style>
          </defs>
          <rect class="vc-w" x="20" y="20" width="440" height="282" rx="14"/>

          <rect class="vc-tile" x="36" y="36" width="200" height="104" rx="8"/>
          <circle class="vc-p" cx="136" cy="74" r="18"/>
          <ellipse class="vc-p" cx="136" cy="124" rx="34" ry="16"/>
          <text class="vc-n" x="46" y="132">You</text>

          <rect class="vc-frz" x="244" y="36" width="200" height="104" rx="8"/>
          <circle class="vc-p" cx="344" cy="80" r="18"/>
          <ellipse class="vc-p" cx="344" cy="128" rx="34" ry="12"/>
          <text class="vc-fz" x="344" y="54" text-anchor="middle">"You froze for a second."</text>
          <text class="vc-n" x="254" y="132">Ravi</text>

          <rect class="vc-tile" x="36" y="148" width="200" height="104" rx="8"/>
          <rect class="vc-scr" x="56" y="158" width="160" height="74" rx="4"/>
          <path class="vc-sl" d="M70 176 L150 176"/>
          <path class="vc-sl" d="M70 194 L196 194"/>
          <path class="vc-sl" d="M70 212 L130 212"/>
          <text class="vc-n" x="46" y="246">Your screen</text>

          <rect class="vc-tile" x="244" y="148" width="200" height="104" rx="8"/>
          <circle class="vc-p" cx="344" cy="186" r="18"/>
          <ellipse class="vc-p" cx="344" cy="236" rx="34" ry="16"/>
          <text class="vc-n" x="254" y="244">Meera</text>

          <rect class="vc-ic" x="165" y="266" width="10" height="16" rx="5"/>
          <path class="vc-ico" d="M161 278 Q170 290 179 278"/>
          <path class="vc-off" d="M160 290 L182 264"/>
          <rect class="vc-ic" x="206" y="270" width="16" height="12" rx="2"/>
          <polygon class="vc-ic" points="222,276 230,271 230,281"/>
          <rect class="vc-ico" x="252" y="268" width="18" height="14" rx="2"/>
          <path class="vc-ico" d="M261 279 L261 272 M257 275 L261 271 L265 275"/>
          <circle class="vc-leave" cx="306" cy="276" r="12"/>

          <path class="vc-lead" d="M170 296 L170 318 L120 318"/>
          <text class="vc-q" x="20" y="323">"You're on mute."</text>
          <path class="vc-lead" d="M261 296 L261 334"/>
          <text class="vc-q" x="261" y="352" text-anchor="middle">"Can you see my screen?"</text>
        </svg>