<svg viewBox="0 0 640 230" role="img" aria-label="The four parts of a bullet: Verb - Automated, Task - monthly GST reports, How - using Python, Result and number - cutting preparation time from 3 days to 4 hours" xmlns="http://www.w3.org/2000/svg"><title>One line, four jobs: what you did (verb), on what (task), how (tool), and what result came out (with a number).</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-prep:#ea580c;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .bf-v { fill: var(--role-verb); opacity: 0.16; stroke: var(--role-verb); stroke-width: 2; }
              .bf-n { fill: var(--role-noun); opacity: 0.16; stroke: var(--role-noun); stroke-width: 2; }
              .bf-p { fill: var(--role-prep); opacity: 0.16; stroke: var(--role-prep); stroke-width: 2; }
              .bf-a { fill: var(--role-adj); opacity: 0.16; stroke: var(--role-adj); stroke-width: 2; }
              .bf-t { font: 700 15px var(--font); fill: var(--text); }
              .bf-lv { font: 800 13px var(--font); fill: var(--role-verb); }
              .bf-ln { font: 800 13px var(--font); fill: var(--role-noun); }
              .bf-lp { font: 800 13px var(--font); fill: var(--role-prep); }
              .bf-la { font: 800 13px var(--font); fill: var(--role-adj); }
              .bf-s { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="bf-v" x="20" y="40" width="130" height="50" rx="10"/>
          <text class="bf-t" x="85" y="71" text-anchor="middle">Automated</text>
          <text class="bf-lv" x="85" y="28" text-anchor="middle">1 · VERB</text>
          <text class="bf-s" x="85" y="110" text-anchor="middle">past tense, strong</text>

          <rect class="bf-n" x="160" y="40" width="220" height="50" rx="10"/>
          <text class="bf-t" x="270" y="71" text-anchor="middle">monthly GST reports</text>
          <text class="bf-ln" x="270" y="28" text-anchor="middle">2 · TASK</text>
          <text class="bf-s" x="270" y="110" text-anchor="middle">what you worked on</text>

          <rect class="bf-p" x="390" y="40" width="230" height="50" rx="10"/>
          <text class="bf-t" x="505" y="71" text-anchor="middle">using Python scripts,</text>
          <text class="bf-lp" x="505" y="28" text-anchor="middle">(how — optional)</text>
          <text class="bf-s" x="505" y="110" text-anchor="middle">the tool or method</text>

          <rect class="bf-a" x="20" y="140" width="600" height="50" rx="10"/>
          <text class="bf-t" x="320" y="171" text-anchor="middle">cutting preparation time from 3 days to 4 hours.</text>
          <text class="bf-la" x="320" y="214" text-anchor="middle">3 + 4 · RESULT + NUMBER — what changed, and by how much</text>
        </svg>