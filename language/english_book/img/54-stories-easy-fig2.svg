<svg viewBox="0 0 600 300" role="img" aria-label="Story map: the Story in the middle, with Who, Where, When, What happened and How did they feel around it" xmlns="http://www.w3.org/2000/svg"><title>Story map: Who, Where, When, What happened, How did they feel. If you can fill in even
    three of them after the first listen, you are on the right track.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .sm-c { fill: var(--accent); }
       .sm-ct { font: 800 16px var(--font); fill: var(--sheet); }
       .sm-n { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
       .sm-q { font: 800 14px var(--font); fill: var(--accent-2); }
       .sm-h { font: 500 12px var(--font); fill: var(--text-soft); }
       .sm-ln { fill: none; stroke: var(--line-strong); stroke-width: 2; }
      </style>
     </defs>
     <path class="sm-ln" d="M300 150 L110 60 M300 150 L490 60 M300 150 L110 240 M300 150 L490 240 M300 150 L300 262"/>
     <circle class="sm-c" cx="300" cy="150" r="52"/>
     <text class="sm-ct" x="300" y="146" text-anchor="middle">STORY</text>
     <text class="sm-ct" x="300" y="166" text-anchor="middle">story</text>

     <rect class="sm-n" x="20" y="30" width="180" height="58" rx="12"/>
     <text class="sm-q" x="110" y="54" text-anchor="middle">WHO?</text>
     <text class="sm-h" x="110" y="74" text-anchor="middle">who — names, relations</text>

     <rect class="sm-n" x="400" y="30" width="180" height="58" rx="12"/>
     <text class="sm-q" x="490" y="54" text-anchor="middle">WHERE?</text>
     <text class="sm-h" x="490" y="74" text-anchor="middle">where — city, place</text>

     <rect class="sm-n" x="20" y="212" width="180" height="58" rx="12"/>
     <text class="sm-q" x="110" y="236" text-anchor="middle">WHEN?</text>
     <text class="sm-h" x="110" y="256" text-anchor="middle">when — day, time</text>

     <rect class="sm-n" x="400" y="212" width="180" height="58" rx="12"/>
     <text class="sm-q" x="490" y="236" text-anchor="middle">HOW DID THEY FEEL?</text>
     <text class="sm-h" x="490" y="256" text-anchor="middle">feelings — happy, nervous…</text>

     <rect class="sm-n" x="215" y="240" width="170" height="54" rx="12"/>
     <text class="sm-q" x="300" y="262" text-anchor="middle">WHAT HAPPENED?</text>
     <text class="sm-h" x="300" y="282" text-anchor="middle">what happened — the event</text>
    </svg>