<svg viewBox="0 0 760 560" role="img" aria-label="Article चुनने का flowchart: पहले पूछो noun specific है या नहीं, फिर countable singular है या नहीं, फिर आवाज़ vowel से शुरू होती है या नहीं" xmlns="http://www.w3.org/2000/svg"><title>सवाल क्रम से पूछने हैं। पहला सवाल सबसे ज़रूरी है — अगर जवाब &quot;हाँ&quot; है, तो
        बाकी दो सवाल पूछने की ज़रूरत ही नहीं।</title><style>svg{--brand-400:#fb923c;--brand-50:#fff7ed;--brand-500:#f97316;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-500:#64748b;--line:#e3e7ef;--page-alt:#eef1f6;--role-adv:#db2777;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .q { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.5; }
              .qt { font: 650 13px var(--font); fill: var(--text); }
              .qs { font: 500 11px var(--font); fill: var(--text-soft); }
              .ans { fill: var(--brand-50); stroke: var(--brand-400); stroke-width: 2; }
              .anst { font: 800 19px var(--font); fill: var(--brand-600); }
              .anss { font: 600 10.5px var(--font); fill: var(--text-soft); }
              .flow { stroke: var(--ink-500); stroke-width: 2; fill: none; }
              .yn { font: 800 11px var(--font); fill: var(--role-verb); }
              .nn { font: 800 11px var(--font); fill: var(--role-adv); }
              .start { fill: var(--brand-500); }
              .startt { font: 800 13px var(--font); fill: #fff; }
            </style>
            <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-500)"/>
            </marker>
          </defs>

          <!-- start -->
          <rect class="start" x="140" y="12" width="250" height="40" rx="20"/>
          <text class="startt" x="265" y="37" text-anchor="middle">सामने एक NOUN है</text>
          <line class="flow" x1="265" y1="52" x2="265" y2="84" marker-end="url(#fa)"/>

          <!-- Q1 -->
          <rect class="q" x="60" y="90" width="410" height="68" rx="12"/>
          <text class="qt" x="80" y="118">1. सुनने वाले को पता है कौन सा वाला?</text>
          <text class="qs" x="80" y="138">पहले ज़िक्र हो चुका · दुनिया में एक ही है · सामने रखा है</text>
          <line class="flow" x1="470" y1="124" x2="560" y2="124" marker-end="url(#fa)"/>
          <text class="yn" x="505" y="116" text-anchor="middle">हाँ</text>
          <rect class="ans" x="566" y="96" width="178" height="56" rx="12"/>
          <text class="anst" x="655" y="124" text-anchor="middle">the</text>
          <text class="anss" x="655" y="142" text-anchor="middle">the sun · the book I bought</text>

          <line class="flow" x1="265" y1="158" x2="265" y2="196" marker-end="url(#fa)"/>
          <text class="nn" x="248" y="180" text-anchor="end">नहीं</text>

          <!-- Q2 -->
          <rect class="q" x="60" y="202" width="410" height="68" rx="12"/>
          <text class="qt" x="80" y="230">2. Countable और singular है?</text>
          <text class="qs" x="80" y="250">एक गिनने लायक चीज़ · "one ___" बोल सकते हो?</text>
          <line class="flow" x1="470" y1="236" x2="560" y2="236" marker-end="url(#fa)"/>
          <text class="nn" x="505" y="228" text-anchor="middle">नहीं</text>
          <rect class="ans" x="566" y="208" width="178" height="56" rx="12"/>
          <text class="anst" x="655" y="234" text-anchor="middle">— कुछ नहीं</text>
          <text class="anss" x="655" y="252" text-anchor="middle">I like mangoes · Rice is cheap</text>

          <line class="flow" x1="265" y1="270" x2="265" y2="308" marker-end="url(#fa)"/>
          <text class="yn" x="248" y="292" text-anchor="end">हाँ</text>

          <!-- Q3 -->
          <rect class="q" x="60" y="314" width="410" height="68" rx="12"/>
          <text class="qt" x="80" y="342">3. अगला शब्द VOWEL की आवाज़ से शुरू?</text>
          <text class="qs" x="80" y="362">आवाज़ देखो, अक्षर नहीं — a, e, i, o, u की ध्वनि</text>
          <line class="flow" x1="470" y1="348" x2="560" y2="348" marker-end="url(#fa)"/>
          <text class="yn" x="505" y="340" text-anchor="middle">हाँ</text>
          <rect class="ans" x="566" y="320" width="178" height="56" rx="12"/>
          <text class="anst" x="655" y="348" text-anchor="middle">an</text>
          <text class="anss" x="655" y="366" text-anchor="middle">an apple · an hour · an MLA</text>

          <line class="flow" x1="265" y1="382" x2="265" y2="420" marker-end="url(#fa)"/>
          <text class="nn" x="248" y="404" text-anchor="end">नहीं</text>
          <rect class="ans" x="176" y="426" width="178" height="56" rx="12"/>
          <text class="anst" x="265" y="454" text-anchor="middle">a</text>
          <text class="anss" x="265" y="472" text-anchor="middle">a book · a university · a one-day match</text>

          <text class="qs" x="380" y="520" text-anchor="middle">तीन सवाल, चार जवाब। इससे बाहर कुछ नहीं।</text>
        </svg>