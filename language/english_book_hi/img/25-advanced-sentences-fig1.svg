<svg viewBox="0 0 640 290" role="img" aria-label="ऊपर: I repaired my car — काम मैंने ख़ुद किया। नीचे: I got my car repaired — मैंने mechanic से करवाया, mechanic ने car ठीक की।" xmlns="http://www.w3.org/2000/svg"><title>Causative में काम करने वाला बीच में छुप जाता है। वाक्य सिर्फ़ इतना कहता है: चीज़ पर काम हुआ , और वो मैंने करवाया ।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cs-p { fill: var(--accent); }
              .cs-o { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .cs-h { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2.5; }
              .cs-ar { fill: none; stroke: var(--role-verb); stroke-width: 2.5; marker-end: url(#cs-a); }
              .cs-ar2 { fill: none; stroke: var(--text-soft); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#cs-a2); }
              .cs-w { font: 700 14px var(--font); fill: var(--sheet); }
              .cs-t { font: 700 14px var(--font); fill: var(--text); }
              .cs-s { font: 800 15px var(--font); fill: var(--text); }
              .cs-v { font: 700 13px var(--font); fill: var(--role-verb); }
              .cs-g { font: italic 500 12.5px var(--font); fill: var(--text-soft); }
              .cs-sep { stroke: var(--line); stroke-width: 1.5; }
            </style>
            <marker id="cs-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/>
            </marker>
            <marker id="cs-a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--text-soft)"/>
            </marker>
          </defs>

          <text class="cs-s" x="20" y="28">I repaired my car.</text>
          <text class="cs-g" x="20" y="48">काम मैंने ख़ुद किया</text>
          <circle class="cs-p" cx="300" cy="62" r="26"/>
          <text class="cs-w" x="300" y="67" text-anchor="middle">I</text>
          <path class="cs-ar" d="M330 62 L506 62"/>
          <text class="cs-v" x="418" y="52" text-anchor="middle">repaired</text>
          <rect class="cs-o" x="512" y="40" width="104" height="44" rx="10"/>
          <text class="cs-t" x="564" y="67" text-anchor="middle">car</text>

          <line class="cs-sep" x1="20" y1="118" x2="620" y2="118"/>

          <text class="cs-s" x="20" y="150">I got my car repaired.</text>
          <text class="cs-g" x="20" y="170">मैंने car ठीक करवाई</text>
          <circle class="cs-p" cx="70" cy="226" r="26"/>
          <text class="cs-w" x="70" y="231" text-anchor="middle">I</text>
          <path class="cs-ar2" d="M100 226 L250 226"/>
          <text class="cs-g" x="176" y="214" text-anchor="middle">पैसे / कहना</text>
          <rect class="cs-h" x="256" y="202" width="130" height="48" rx="10"/>
          <text class="cs-t" x="321" y="231" text-anchor="middle">mechanic</text>
          <path class="cs-ar" d="M392 226 L506 226"/>
          <text class="cs-v" x="449" y="214" text-anchor="middle">repaired</text>
          <rect class="cs-o" x="512" y="204" width="104" height="44" rx="10"/>
          <text class="cs-t" x="564" y="231" text-anchor="middle">car</text>
          <text class="cs-g" x="320" y="276" text-anchor="middle">mechanic का नाम लेना ज़रूरी नहीं — "get + car + repaired" काफ़ी है</text>
        </svg>