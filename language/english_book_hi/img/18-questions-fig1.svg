<svg viewBox="0 0 740 420" role="img" aria-label="सीधे वाक्य से सवाल बनाने का नक्शा: helping verb subject के आगे छलाँग लगाता है, और WH-word सबसे आगे आता है" xmlns="http://www.w3.org/2000/svg"><title>नारंगी डिब्बा = helping verb। वह subject के आगे छलाँग लगाता है। गुलाबी dotted डिब्बा
        = WH-word, जो हमेशा सबसे आगे बैठता है।</title><style>svg{--brand-400:#fb923c;--brand-50:#fff7ed;--brand-500:#f97316;--brand-600:#ea580c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--page-alt:#eef1f6;--role-adv:#db2777;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sbx { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.4; }
              .abx { fill: var(--brand-50); stroke: var(--brand-400); stroke-width: 2; }
              .wbx { fill: var(--card); stroke: var(--role-adv); stroke-width: 2; stroke-dasharray: 5 3; }
              .wd  { font: 700 15px var(--font); fill: var(--text); }
              .aux { font: 800 15px var(--font); fill: var(--brand-600); }
              .whw { font: 800 15px var(--font); fill: var(--role-adv); }
              .slot { font: 700 9.5px var(--font); fill: var(--text-soft); letter-spacing: 0.07em; }
              .rowl { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.05em; }
              .hop { stroke: var(--brand-500); stroke-width: 2.2; fill: none; stroke-dasharray: 5 4; }
            </style>
            <marker id="qa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--brand-500)"/>
            </marker>
          </defs>

          <!-- statement -->
          <text class="rowl" x="16" y="42">सीधा वाक्य</text>
          <g transform="translate(16 54)">
            <rect class="sbx" x="0" y="0" width="104" height="44" rx="9"/>
            <text class="wd" x="52" y="28" text-anchor="middle">You</text>
            <text class="slot" x="52" y="60" text-anchor="middle">SUBJECT</text>

            <rect class="abx" x="114" y="0" width="86" height="44" rx="9"/>
            <text class="aux" x="157" y="28" text-anchor="middle">are</text>
            <text class="slot" x="157" y="60" text-anchor="middle">HELPING</text>

            <rect class="sbx" x="210" y="0" width="112" height="44" rx="9"/>
            <text class="wd" x="266" y="28" text-anchor="middle">going</text>
            <text class="slot" x="266" y="60" text-anchor="middle">MAIN VERB</text>

            <rect class="sbx" x="332" y="0" width="140" height="44" rx="9"/>
            <text class="wd" x="402" y="28" text-anchor="middle">to Delhi</text>
            <text class="slot" x="402" y="60" text-anchor="middle">बाकी</text>
          </g>

          <!-- hop arrow -->
          <path class="hop" d="M173 54 C 173 24, 60 24, 60 142" marker-end="url(#qa)"/>
          <text class="slot" x="118" y="20" text-anchor="middle" fill="var(--brand-600)">HELPING VERB सबसे आगे</text>

          <!-- yes/no question -->
          <text class="rowl" x="16" y="178">YES / NO सवाल</text>
          <g transform="translate(16 190)">
            <rect class="abx" x="0" y="0" width="86" height="44" rx="9"/>
            <text class="aux" x="43" y="28" text-anchor="middle">Are</text>
            <rect class="sbx" x="96" y="0" width="104" height="44" rx="9"/>
            <text class="wd" x="148" y="28" text-anchor="middle">you</text>
            <rect class="sbx" x="210" y="0" width="112" height="44" rx="9"/>
            <text class="wd" x="266" y="28" text-anchor="middle">going</text>
            <rect class="sbx" x="332" y="0" width="140" height="44" rx="9"/>
            <text class="wd" x="402" y="28" text-anchor="middle">to Delhi</text>
            <text class="wd" x="492" y="30">?</text>
            <text class="slot" x="0" y="62">जवाब: Yes, I am. / No, I am not.</text>
          </g>

          <!-- wh question -->
          <text class="rowl" x="16" y="306">WH सवाल</text>
          <g transform="translate(16 318)">
            <rect class="wbx" x="0" y="0" width="104" height="44" rx="9"/>
            <text class="whw" x="52" y="28" text-anchor="middle">Where</text>
            <text class="slot" x="52" y="62" text-anchor="middle">WH-WORD</text>

            <rect class="abx" x="114" y="0" width="86" height="44" rx="9"/>
            <text class="aux" x="157" y="28" text-anchor="middle">are</text>
            <text class="slot" x="157" y="62" text-anchor="middle">HELPING</text>

            <rect class="sbx" x="210" y="0" width="104" height="44" rx="9"/>
            <text class="wd" x="262" y="28" text-anchor="middle">you</text>
            <text class="slot" x="262" y="62" text-anchor="middle">SUBJECT</text>

            <rect class="sbx" x="324" y="0" width="112" height="44" rx="9"/>
            <text class="wd" x="380" y="28" text-anchor="middle">going</text>
            <text class="slot" x="380" y="62" text-anchor="middle">MAIN VERB</text>

            <text class="wd" x="452" y="30">?</text>
            <text class="slot" x="486" y="26">"to Delhi" हट गया —</text>
            <text class="slot" x="486" y="40">वही जवाब है!</text>
          </g>
        </svg>