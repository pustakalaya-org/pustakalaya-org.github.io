<svg viewBox="0 0 480 325" role="img" aria-label="Say और tell का ढाँचा: She said hello to me — say के बाद बात, फिर to और इंसान। She told me a story — tell के बाद सीधा इंसान, फिर बात। नीचे tell की पक्की जोड़ियाँ: the truth, a lie, a story, a joke। Say की: sorry, hello, thank you, goodbye।" xmlns="http://www.w3.org/2000/svg"><title>Tell के बाद सीधा इंसान आता है (told me )। Say के बाद इंसान चाहिए तो &quot;to&quot; लगाओ (said hello to me )।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-prep:#ea580c;--role-pron:#0891b2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sy-s { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .sy-v { fill: var(--accent); }
              .sy-o { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .sy-p { fill: var(--sheet); stroke: var(--role-pron); stroke-width: 2; }
              .sy-pr { fill: var(--sheet); stroke: var(--role-prep); stroke-width: 2; }
              .sy-c { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
              .sy-c2 { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 1.5; }
              .sy-dv { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
              .sy-w { font: 700 14px var(--font); fill: var(--text); }
              .sy-wv { font: 800 14px var(--font); fill: var(--sheet); }
              .sy-a { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .sy-h { font: 800 13px var(--font); fill: var(--accent); }
              .sy-h2 { font: 800 13px var(--font); fill: var(--accent-2); }
              .sy-cw { font: 600 13px var(--font); fill: var(--text); }
            </style>
          </defs>
          <rect class="sy-s" x="10" y="30" width="60" height="38" rx="8"/><text class="sy-w" x="40" y="54" text-anchor="middle">She</text>
          <rect class="sy-v" x="78" y="30" width="70" height="38" rx="8"/><text class="sy-wv" x="113" y="54" text-anchor="middle">said</text>
          <rect class="sy-o" x="156" y="30" width="80" height="38" rx="8"/><text class="sy-w" x="196" y="54" text-anchor="middle">hello</text>
          <rect class="sy-pr" x="244" y="30" width="80" height="38" rx="8"/><text class="sy-w" x="284" y="54" text-anchor="middle">to me</text>
          <text class="sy-a" x="336" y="46">say + बात</text>
          <text class="sy-a" x="336" y="63">(+ to + इंसान)</text>

          <rect class="sy-s" x="10" y="100" width="60" height="38" rx="8"/><text class="sy-w" x="40" y="124" text-anchor="middle">She</text>
          <rect class="sy-v" x="78" y="100" width="70" height="38" rx="8"/><text class="sy-wv" x="113" y="124" text-anchor="middle">told</text>
          <rect class="sy-p" x="156" y="100" width="60" height="38" rx="8"/><text class="sy-w" x="186" y="124" text-anchor="middle">me</text>
          <rect class="sy-o" x="224" y="100" width="100" height="38" rx="8"/><text class="sy-w" x="274" y="124" text-anchor="middle">a story</text>
          <text class="sy-a" x="336" y="116">tell + इंसान</text>
          <text class="sy-a" x="336" y="133">+ बात</text>

          <path class="sy-dv" d="M10 166 L470 166"/>

          <text class="sy-h" x="10" y="194">हमेशा TELL:</text>
          <rect class="sy-c" x="10" y="204" width="110" height="34" rx="17"/><text class="sy-cw" x="65" y="226" text-anchor="middle">the truth</text>
          <rect class="sy-c" x="126" y="204" width="110" height="34" rx="17"/><text class="sy-cw" x="181" y="226" text-anchor="middle">a lie</text>
          <rect class="sy-c" x="242" y="204" width="110" height="34" rx="17"/><text class="sy-cw" x="297" y="226" text-anchor="middle">a story</text>
          <rect class="sy-c" x="358" y="204" width="110" height="34" rx="17"/><text class="sy-cw" x="413" y="226" text-anchor="middle">a joke</text>

          <text class="sy-h2" x="10" y="270">हमेशा SAY:</text>
          <rect class="sy-c2" x="10" y="280" width="110" height="34" rx="17"/><text class="sy-cw" x="65" y="302" text-anchor="middle">sorry</text>
          <rect class="sy-c2" x="126" y="280" width="110" height="34" rx="17"/><text class="sy-cw" x="181" y="302" text-anchor="middle">hello</text>
          <rect class="sy-c2" x="242" y="280" width="110" height="34" rx="17"/><text class="sy-cw" x="297" y="302" text-anchor="middle">thank you</text>
          <rect class="sy-c2" x="358" y="280" width="110" height="34" rx="17"/><text class="sy-cw" x="413" y="302" text-anchor="middle">goodbye</text>
        </svg>