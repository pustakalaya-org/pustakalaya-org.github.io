<svg viewBox="0 0 640 230" role="img" aria-label="पंद्रह मिनट का रोज़ का बँटवारा: चार मिनट पढ़ना, छह मिनट ज़ोर से बोलना, तीन मिनट क्विज़, दो मिनट कल का दोहराव" xmlns="http://www.w3.org/2000/svg"><title>ध्यान दो: सबसे बड़ा हिस्सा नारंगी है — बोलना । पढ़ना सिर्फ़ चौथाई हिस्सा है।</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .slbl { font: 700 14px var(--font); fill: var(--sheet); }
              .smin { font: 800 22px var(--font); fill: var(--sheet); }
              .cap { font: 500 12px var(--font); fill: var(--text-soft); }
              .axis { font: 600 11px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="axis" x="10" y="22">15 मिनट — रोज़</text>

          <rect x="10" y="36" width="162" height="86" rx="8" fill="var(--role-noun)"/>
          <text class="smin" x="91" y="72" text-anchor="middle">4</text>
          <text class="slbl" x="91" y="94" text-anchor="middle">पढ़ो</text>

          <rect x="178" y="36" width="244" height="86" rx="8" fill="var(--brand-500)"/>
          <text class="smin" x="300" y="72" text-anchor="middle">6</text>
          <text class="slbl" x="300" y="94" text-anchor="middle">ज़ोर से बोलो</text>

          <rect x="428" y="36" width="122" height="86" rx="8" fill="var(--role-verb)"/>
          <text class="smin" x="489" y="72" text-anchor="middle">3</text>
          <text class="slbl" x="489" y="94" text-anchor="middle">क्विज़</text>

          <rect x="556" y="36" width="74" height="86" rx="8" fill="var(--role-adj)"/>
          <text class="smin" x="593" y="72" text-anchor="middle">2</text>
          <text class="slbl" x="593" y="94" text-anchor="middle">दोहराओ</text>

          <text class="cap" x="10" y="150">एक चैप्टर का एक हिस्सा पढ़ो — पूरा चैप्टर एक दिन में नहीं।</text>
          <text class="cap" x="10" y="170">हर example sentence पर 🔊 दबाकर सुनो, फिर खुद बोलो। यही सबसे बड़ा हिस्सा है।</text>
          <text class="cap" x="10" y="190">चैप्टर के आखिर का क्विज़ करो — गलत जवाब से ही सीखना होता है।</text>
          <text class="cap" x="10" y="210">कल जो पढ़ा था, उसके तीन sentence दोबारा बोलो। बस तीन।</text>
        </svg>