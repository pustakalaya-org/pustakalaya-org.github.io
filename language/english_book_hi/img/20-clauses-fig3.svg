<svg viewBox="0 0 640 214" role="img" aria-label="Relative clause noun के तुरंत बाद बैठता है: The man [who lives next door] is a doctor — who का मतलब the man। The phone [that I bought] stopped working — that का मतलब the phone, इसलिए 'it' दोबारा नहीं लगता।" xmlns="http://www.w3.org/2000/svg"><title>Relative clause (dashed) अपने noun के ठीक बाद बैठता है, और who/that उस noun की जगह ले लेता है।</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rc-n { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.2; }
              .rc-r { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2.2; stroke-dasharray: 6 4; }
              .rc-m { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.2; }
              .rc-wn { font: 700 13.5px var(--font); fill: var(--role-noun); }
              .rc-wr { font: 700 13.5px var(--font); fill: var(--role-conj); }
              .rc-wm { font: 700 13.5px var(--font); fill: var(--role-verb); }
              .rc-arc { fill: none; stroke: var(--role-conj); stroke-width: 2; }
              .rc-g { font: 600 11.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="rcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-conj)"/>
            </marker>
          </defs>

          <path class="rc-arc" d="M180 54 Q132 10 88 52" marker-end="url(#rcArrow)"/>
          <text class="rc-g" x="134" y="22" text-anchor="middle">who = the man</text>
          <rect class="rc-n" x="30" y="56" width="110" height="38" rx="8"/>
          <text class="rc-wn" x="85" y="80" text-anchor="middle">The man</text>
          <rect class="rc-r" x="150" y="56" width="200" height="38" rx="8"/>
          <text class="rc-wr" x="250" y="80" text-anchor="middle">who lives next door</text>
          <rect class="rc-m" x="360" y="56" width="140" height="38" rx="8"/>
          <text class="rc-wm" x="430" y="80" text-anchor="middle">is a doctor.</text>
          <text class="rc-g" x="514" y="80">मुख्य clause</text>

          <rect class="rc-n" x="30" y="124" width="120" height="38" rx="8"/>
          <text class="rc-wn" x="90" y="148" text-anchor="middle">The phone</text>
          <rect class="rc-r" x="160" y="124" width="150" height="38" rx="8"/>
          <text class="rc-wr" x="235" y="148" text-anchor="middle">that I bought</text>
          <rect class="rc-m" x="320" y="124" width="170" height="38" rx="8"/>
          <text class="rc-wm" x="405" y="148" text-anchor="middle">stopped working.</text>
          <path class="rc-arc" d="M185 164 Q140 200 94 166" marker-end="url(#rcArrow)"/>
          <text class="rc-g" x="214" y="200">that = the phone — "it" दोबारा नहीं</text>
        </svg>