<svg viewBox="0 0 680 330" role="img" aria-label="चार गुणों की तीव्रता की सीढ़ी: हल्का, तेज़ और सबसे तेज़ शब्द तीन चढ़ती सीढ़ियों पर" xmlns="http://www.w3.org/2000/svg"><title>तीन सीढ़ियाँ: हल्का, आम, और सबसे तेज़। बात छोटी हो तो नीचे वाला शब्द चुनो —
        वरना English natural नहीं, नकली लगती है।</title><style>svg{--brand-100:#ffedd5;--brand-200:#fed7aa;--brand-400:#fb923c;--brand-500:#f97316;--brand-600:#ea580c;--brand-700:#c2410c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-adj:#9333ea;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .st { fill: var(--brand-100); stroke: var(--brand-400); stroke-width: 1.6; }
              .st2 { fill: var(--brand-200); stroke: var(--brand-500); stroke-width: 1.6; }
              .st3 { fill: none; stroke: var(--brand-600); stroke-width: 2.4; }
              .w1 { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .w2 { font: 700 13px var(--font); fill: var(--brand-700); }
              .w3 { font: 800 13.5px var(--font); fill: var(--role-adj); }
              .cap { font: 700 12px var(--font); fill: var(--text); }
              .lvl { font: 600 11px var(--font); fill: var(--text-soft); }
              .arrow { stroke: var(--ink-300); stroke-width: 2; fill: none; }
            </style>
          </defs>

          <line class="arrow" x1="34" y1="296" x2="34" y2="40" marker-end=""/>
          <text class="lvl" x="40" y="48">तीव्रता ऊपर</text>

          <rect class="st" x="62" y="236" width="140" height="44" rx="9"/>
          <rect class="st2" x="62" y="176" width="140" height="44" rx="9"/>
          <rect class="st3" x="62" y="116" width="140" height="44" rx="9"/>
          <text class="cap" x="132" y="302" text-anchor="middle">गर्मी</text>
          <text class="w1" x="132" y="263" text-anchor="middle">warm</text>
          <text class="w2" x="132" y="203" text-anchor="middle">hot</text>
          <text class="w3" x="132" y="143" text-anchor="middle">sweltering</text>

          <rect class="st" x="222" y="236" width="140" height="44" rx="9"/>
          <rect class="st2" x="222" y="176" width="140" height="44" rx="9"/>
          <rect class="st3" x="222" y="116" width="140" height="44" rx="9"/>
          <text class="cap" x="292" y="302" text-anchor="middle">दुख</text>
          <text class="w1" x="292" y="263" text-anchor="middle">annoyed</text>
          <text class="w2" x="292" y="203" text-anchor="middle">upset</text>
          <text class="w3" x="292" y="143" text-anchor="middle">distraught</text>

          <rect class="st" x="382" y="236" width="140" height="44" rx="9"/>
          <rect class="st2" x="382" y="176" width="140" height="44" rx="9"/>
          <rect class="st3" x="382" y="116" width="140" height="44" rx="9"/>
          <text class="cap" x="452" y="302" text-anchor="middle">आकार</text>
          <text class="w1" x="452" y="263" text-anchor="middle">large</text>
          <text class="w2" x="452" y="203" text-anchor="middle">huge</text>
          <text class="w3" x="452" y="143" text-anchor="middle">mammoth</text>

          <rect class="st" x="542" y="236" width="120" height="44" rx="9"/>
          <rect class="st2" x="542" y="176" width="120" height="44" rx="9"/>
          <rect class="st3" x="542" y="116" width="120" height="44" rx="9"/>
          <text class="cap" x="602" y="302" text-anchor="middle">भूख</text>
          <text class="w1" x="602" y="263" text-anchor="middle">peckish</text>
          <text class="w2" x="602" y="203" text-anchor="middle">hungry</text>
          <text class="w3" x="602" y="143" text-anchor="middle">ravenous</text>

          <text class="lvl" x="62" y="86">सबसे ऊपर वाला शब्द सिर्फ़ सबसे ऊपर वाली हालत के लिए।</text>
        </svg>