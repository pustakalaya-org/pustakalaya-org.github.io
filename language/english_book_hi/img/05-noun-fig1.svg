<svg viewBox="0 0 700 400" role="img" aria-label="Noun के प्रकारों का पेड़ — नाम के हिसाब से पाँच शाखाएँ और गिनती के हिसाब से दो शाखाएँ" xmlns="http://www.w3.org/2000/svg"><title>Noun का पेड़ — ऊपर नाम के हिसाब से पाँच शाखाएँ, नीचे गिनती के हिसाब से दो।</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-noun:#2563eb;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rt { fill: var(--role-noun); }
              .rtt { font: 800 15px var(--font); fill: #fff; }
              .bx2 { fill: var(--card); stroke: var(--role-noun); stroke-width: 1.8; }
              .hd { font: 700 12px var(--font); fill: var(--role-noun); }
              .eg { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .ln { stroke: var(--ink-300); stroke-width: 1.6; fill: none; }
              .sec { font: 700 11px var(--font); fill: var(--text-soft); letter-spacing: .06em; }
            </style>
          </defs>

          <rect class="rt" x="280" y="10" width="140" height="42" rx="21"/>
          <text class="rtt" x="350" y="37" text-anchor="middle">NOUN</text>

          <text class="sec" x="20" y="78">नाम के हिसाब से</text>
          <path class="ln" d="M350 52 L350 70 L70 70 L70 92"/>
          <path class="ln" d="M350 70 L205 70 L205 92"/>
          <path class="ln" d="M350 70 L350 92"/>
          <path class="ln" d="M350 70 L495 70 L495 92"/>
          <path class="ln" d="M350 70 L630 70 L630 92"/>

          <g transform="translate(70 92)">
            <rect class="bx2" x="-62" y="0" width="124" height="52" rx="9"/>
            <text class="hd" x="0" y="20" text-anchor="middle">PROPER</text>
            <text class="eg" x="0" y="36" text-anchor="middle">Ravi, Delhi, Monday</text>
          </g>
          <g transform="translate(205 92)">
            <rect class="bx2" x="-62" y="0" width="124" height="52" rx="9"/>
            <text class="hd" x="0" y="20" text-anchor="middle">COMMON</text>
            <text class="eg" x="0" y="36" text-anchor="middle">boy, city, chair</text>
          </g>
          <g transform="translate(350 92)">
            <rect class="bx2" x="-62" y="0" width="124" height="52" rx="9"/>
            <text class="hd" x="0" y="20" text-anchor="middle">COLLECTIVE</text>
            <text class="eg" x="0" y="36" text-anchor="middle">team, family, crowd</text>
          </g>
          <g transform="translate(495 92)">
            <rect class="bx2" x="-62" y="0" width="124" height="52" rx="9"/>
            <text class="hd" x="0" y="20" text-anchor="middle">ABSTRACT</text>
            <text class="eg" x="0" y="36" text-anchor="middle">love, fear, truth</text>
          </g>
          <g transform="translate(630 92)">
            <rect class="bx2" x="-62" y="0" width="124" height="52" rx="9"/>
            <text class="hd" x="0" y="20" text-anchor="middle">MATERIAL</text>
            <text class="eg" x="0" y="36" text-anchor="middle">gold, rice, wood</text>
          </g>

          <text class="sec" x="20" y="212">गिनती के हिसाब से</text>
          <path class="ln" d="M350 52 L440 52 L440 200 L215 200 L215 226"/>
          <path class="ln" d="M440 200 L485 200 L485 226"/>

          <g transform="translate(215 226)">
            <rect class="bx2" x="-110" y="0" width="220" height="96" rx="10"/>
            <text class="hd" x="0" y="22" text-anchor="middle">COUNTABLE</text>
            <text class="eg" x="0" y="42" text-anchor="middle">गिन सकते हैं: one book, two books</text>
            <text class="eg" x="0" y="60" text-anchor="middle">a / an लगता है · plural बनता है</text>
            <text class="eg" x="0" y="78" text-anchor="middle">many, few के साथ चलता है</text>
          </g>
          <g transform="translate(485 226)">
            <rect class="bx2" x="-110" y="0" width="220" height="96" rx="10"/>
            <text class="hd" x="0" y="22" text-anchor="middle">UNCOUNTABLE</text>
            <text class="eg" x="0" y="42" text-anchor="middle">गिन नहीं सकते: water, advice</text>
            <text class="eg" x="0" y="60" text-anchor="middle">a / an नहीं · plural नहीं</text>
            <text class="eg" x="0" y="78" text-anchor="middle">much, little के साथ चलता है</text>
          </g>

          <text class="eg" x="350" y="352" text-anchor="middle">एक ही noun दोनों तरह से गिना जाता है — जैसे "rice" common है, material है, और uncountable भी।</text>
          <text class="eg" x="350" y="372" text-anchor="middle">इसलिए इन दो बँटवारों को एक-दूसरे का मुक़ाबला न समझो।</text>
        </svg>