<svg viewBox="0 0 700 500" role="img" aria-label="Tense shift की सीढ़ी: present simple past simple बन जाता है, present continuous past continuous, present perfect past perfect, will would, can could, may might, must had to" xmlns="http://www.w3.org/2000/svg"><title>हरा डिब्बा = जो बोला गया। नारंगी डिब्बा = report करते वक़्त का रूप। Past Perfect आख़िरी
        सीढ़ी है — उससे आगे पीछे जाने की जगह नहीं है।</title><style>svg{--brand-400:#fb923c;--brand-50:#fff7ed;--brand-500:#f97316;--brand-600:#ea580c;--brand-700:#c2410c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-verb:#0d9488;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .db { fill: var(--card); stroke: var(--role-verb); stroke-width: 1.8; }
              .rb { fill: var(--brand-50); stroke: var(--brand-400); stroke-width: 1.8; }
              .dt { font: 700 12.5px var(--font); fill: var(--role-verb); }
              .rt { font: 700 12.5px var(--font); fill: var(--brand-700); }
              .hd { font: 800 11px var(--font); letter-spacing: 0.07em; fill: var(--text-soft); }
              .st { stroke: var(--ink-300); stroke-width: 2; fill: none; }
              .dn { stroke: var(--brand-500); stroke-width: 2; fill: none; }
              .bl { font: 800 11px var(--font); fill: var(--brand-600); letter-spacing: 0.08em; }
            </style>
            <marker id="rs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--brand-500)"/>
            </marker>
          </defs>

          <text class="hd" x="100" y="26">जो कहा गया (direct)</text>
          <text class="hd" x="412" y="26">जैसे बताया जाएगा (reported)</text>

          <!-- big downward banner -->
          <line class="dn" x1="30" y1="40" x2="30" y2="462" marker-end="url(#rs)"/>
          <text class="bl" x="22" y="250" text-anchor="middle" transform="rotate(-90 22 250)">एक कदम पीछे</text>

          <!-- rows -->
          <g transform="translate(0 40)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">Present Simple — "I write"</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">Past Simple — he wrote</text>
          </g>
          <g transform="translate(0 86)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">Present Cont. — "I am writing"</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">Past Cont. — he was writing</text>
          </g>
          <g transform="translate(0 132)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">Present Perfect — "I have written"</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">Past Perfect — he had written</text>
          </g>
          <g transform="translate(0 178)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">Past Simple — "I wrote"</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">Past Perfect — he had written</text>
          </g>
          <g transform="translate(0 224)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">Past Cont. — "I was writing"</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">Past Perfect Cont. — he had been writing</text>
          </g>
          <g transform="translate(0 270)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">will / shall</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">would</text>
          </g>
          <g transform="translate(0 316)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">can</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">could</text>
          </g>
          <g transform="translate(0 362)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">may</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">might</text>
          </g>
          <g transform="translate(0 408)">
            <rect class="db" x="60" y="0" width="272" height="34" rx="8"/>
            <text class="dt" x="74" y="22">must / have to</text>
            <line class="st" x1="338" y1="17" x2="396" y2="17" marker-end="url(#rs)"/>
            <rect class="rb" x="402" y="0" width="282" height="34" rx="8"/>
            <text class="rt" x="416" y="22">had to</text>
          </g>

          <text class="hd" x="350" y="482" text-anchor="middle">Past Perfect पहले से है? फिर कुछ नहीं बदलता — सीढ़ी ख़त्म हो गई।</text>
        </svg>