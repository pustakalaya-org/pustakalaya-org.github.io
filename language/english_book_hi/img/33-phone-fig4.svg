<svg viewBox="0 0 480 360" role="img" aria-label="Voicemail का पाँच कदम का साँचा: नाम और कहाँ से, क्यों कॉल किया, क्या चाहिए, नंबर दो बार धीरे, और कब तक plus शुक्रिया।" xmlns="http://www.w3.org/2000/svg"><title>कदम 4 सबसे ज़रूरी है — सुनने वाला पेन ढूँढ रहा होता है, इसलिए नंबर दो बार।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .vm-ln { fill: none; stroke: var(--accent-line); stroke-width: 3; }
              .vm-d { fill: var(--accent); }
              .vm-d2 { fill: var(--accent-2); }
              .vm-n { font: 800 13px var(--font); fill: var(--sheet); }
              .vm-t { font: 700 14px var(--font); fill: var(--text); }
              .vm-s { font: italic 500 12.5px var(--font); fill: var(--text-soft); }
              .vm-h { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>
          <text class="vm-h" x="20" y="18">VOICEMAIL — 30 सेकंड का साँचा</text>
          <path class="vm-ln" d="M40 44 L40 324"/>

          <circle class="vm-d" cx="40" cy="44" r="14"/><text class="vm-n" x="40" y="49" text-anchor="middle">1</text>
          <text class="vm-t" x="66" y="40">नाम + कहाँ से</text>
          <text class="vm-s" x="66" y="58">"Hi, this is Neha Kapoor from Zenith Travels."</text>

          <circle class="vm-d" cx="40" cy="114" r="14"/><text class="vm-n" x="40" y="119" text-anchor="middle">2</text>
          <text class="vm-t" x="66" y="110">क्यों कॉल किया</text>
          <text class="vm-s" x="66" y="128">"I'm calling about your booking for Goa."</text>

          <circle class="vm-d" cx="40" cy="184" r="14"/><text class="vm-n" x="40" y="189" text-anchor="middle">3</text>
          <text class="vm-t" x="66" y="180">क्या चाहिए</text>
          <text class="vm-s" x="66" y="198">"Could you call me back to confirm the dates?"</text>

          <circle class="vm-d2" cx="40" cy="254" r="14"/><text class="vm-n" x="40" y="259" text-anchor="middle">4</text>
          <text class="vm-t" x="66" y="250">नंबर — दो बार, धीरे</text>
          <text class="vm-s" x="66" y="268">"It's 98201 45678. Again, 98201 45678."</text>

          <circle class="vm-d" cx="40" cy="324" r="14"/><text class="vm-n" x="40" y="329" text-anchor="middle">5</text>
          <text class="vm-t" x="66" y="320">कब तक + शुक्रिया</text>
          <text class="vm-s" x="66" y="338">"Before six today, if possible. Thanks!"</text>
        </svg>