<svg viewBox="0 0 680 330" role="img" aria-label="Interjection वाक्य के बाहर खड़ा रहता है, और भाव की तीव्रता से punctuation तय होता है" xmlns="http://www.w3.org/2000/svg"><title>Interjection वाक्य के बाहर खड़ा होता है, और भाव की तीव्रता punctuation तय करती है।</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--ink-300:#cbd5e1;--role-interj:#e11d48;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sent { fill: var(--card); stroke: var(--ink-300); stroke-width: 1.8; }
              .intb { fill: var(--card); stroke: var(--role-interj); stroke-width: 2.4; stroke-dasharray: 6 4; }
              .iw { font: 800 17px var(--font); fill: var(--role-interj); }
              .sw { font: 700 14px var(--font); fill: var(--text); }
              .sm { font: 500 11px var(--font); fill: var(--text-soft); }
              .hd5 { font: 800 13px var(--font); fill: var(--text); }
              .mtr { stroke-width: 10; fill: none; stroke-linecap: round; }
              .mk { font: 800 15px var(--font); fill: var(--role-interj); }
            </style>
          </defs>

          <text class="hd5" x="14" y="20">Interjection वाक्य के बाहर खड़ा है</text>

          <g transform="translate(14 34)">
            <rect class="intb" x="0" y="0" width="96" height="46" rx="10"/>
            <text class="iw" x="48" y="30" text-anchor="middle">Oh no!</text>
          </g>
          <g transform="translate(130 34)">
            <rect class="sent" x="0" y="0" width="420" height="46" rx="10"/>
            <text class="sw" x="210" y="23" text-anchor="middle">the train has already left</text>
            <text class="sm" x="210" y="39" text-anchor="middle">subject + verb + object — पूरा वाक्य, अपने आप में खड़ा</text>
          </g>
          <text class="sm" x="566" y="52">हटा दो तो</text>
          <text class="sm" x="566" y="68">भी ठीक है</text>

          <text class="hd5" x="14" y="124">भाव जितना तेज़ — उतना ही punctuation</text>

          <!-- meter -->
          <line class="mtr" x1="60" y1="176" x2="620" y2="176" stroke="var(--ink-200)"/>
          <line class="mtr" x1="60" y1="176" x2="250" y2="176" stroke="var(--role-interj)" opacity="0.3"/>
          <line class="mtr" x1="250" y1="176" x2="430" y2="176" stroke="var(--role-interj)" opacity="0.6"/>
          <line class="mtr" x1="430" y1="176" x2="620" y2="176" stroke="var(--role-interj)"/>

          <g>
            <circle cx="150" cy="176" r="7" fill="var(--role-interj)" opacity="0.45"/>
            <text class="mk" x="150" y="208" text-anchor="middle">,</text>
            <text class="sm" x="150" y="228" text-anchor="middle">हल्का भाव</text>
            <text class="sm" x="150" y="244" text-anchor="middle">Oh, I see.</text>
            <text class="sm" x="150" y="260" text-anchor="middle">Well, let me think.</text>
          </g>
          <g>
            <circle cx="340" cy="176" r="7" fill="var(--role-interj)" opacity="0.7"/>
            <text class="mk" x="340" y="208" text-anchor="middle">!</text>
            <text class="sm" x="340" y="228" text-anchor="middle">साफ़ भाव</text>
            <text class="sm" x="340" y="244" text-anchor="middle">Wow! Look at that.</text>
            <text class="sm" x="340" y="260" text-anchor="middle">Oops! My mistake.</text>
          </g>
          <g>
            <circle cx="530" cy="176" r="7" fill="var(--role-interj)"/>
            <text class="mk" x="530" y="208" text-anchor="middle">!!</text>
            <text class="sm" x="530" y="228" text-anchor="middle">तेज़ भाव</text>
            <text class="sm" x="530" y="244" text-anchor="middle">Ouch!! That really hurt.</text>
            <text class="sm" x="530" y="260" text-anchor="middle">(लिखने में कम use करो)</text>
          </g>

          <text class="sm" x="14" y="298">बीच में आए तो दोनों तरफ़ comma: "The answer, alas, was wrong."</text>
          <text class="sm" x="14" y="320">Formal लिखने में interjection लगभग नहीं आता — ये बोलचाल और कहानी का शब्द है।</text>
        </svg>