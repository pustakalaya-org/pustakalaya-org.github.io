<svg viewBox="0 0 640 260" role="img" aria-label="छोटी और लंबी vowel की तुलना: छोटी आवाज़ की पट्टी छोटी और लंबी आवाज़ की पट्टी लंबी, चार जोड़ियों के लिए" xmlns="http://www.w3.org/2000/svg"><title>नीली पट्टी = छोटी आवाज़ (झटके से खत्म)। नारंगी पट्टी = लंबी आवाज़ (खींची हुई)।
        एक ही अक्षर, पर लंबाई से मतलब बदल जाता है।</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sb { fill: var(--role-noun); }
              .lb2 { fill: var(--brand-500); }
              .wd { font: 700 13px var(--font); fill: var(--text); }
              .mn { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .hd2 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="hd2" x="12" y="18">छोटी आवाज़</text>
          <text class="hd2" x="330" y="18">लंबी आवाज़</text>

          <g transform="translate(0 32)">
            <text class="wd" x="12" y="14">ship</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">जहाज़</text>
            <text class="wd" x="330" y="14">sheep</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">भेड़</text>
          </g>

          <g transform="translate(0 86)">
            <text class="wd" x="12" y="14">full</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">भरा हुआ</text>
            <text class="wd" x="330" y="14">fool</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">बेवकूफ़</text>
          </g>

          <g transform="translate(0 140)">
            <text class="wd" x="12" y="14">bit</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">थोड़ा सा</text>
            <text class="wd" x="330" y="14">beat</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">धड़कन / मारना</text>
          </g>

          <g transform="translate(0 194)">
            <text class="wd" x="12" y="14">cut</text>
            <rect class="sb" x="86" y="3" width="34" height="14" rx="7"/>
            <text class="mn" x="130" y="14">काटना</text>
            <text class="wd" x="330" y="14">cart</text>
            <rect class="lb2" x="404" y="3" width="108" height="14" rx="7"/>
            <text class="mn" x="522" y="14">ठेला</text>
          </g>
        </svg>