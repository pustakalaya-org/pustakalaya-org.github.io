          <path class="sl-ld" d="M150 312 H372"/>
          <circle class="sl-dot" cx="378" cy="312" r="5"/>
          <text class="sl-h" x="392" y="308">अंत</text>
          <text class="sl-s" x="392" y="324">Thanking you + Yours sincerely</text>

          <path class="sl-ld" d="M200 366 H372"/>
          <circle class="sl-dot" cx="378" cy="366" r="5"/>
          <text class="sl-h" x="392" y="362">पहचान</text>
          <text class="sl-s" x="392" y="378">नाम, class, roll number</text>
        </svg>