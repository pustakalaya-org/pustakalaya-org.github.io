<svg viewBox="0 0 640 420" role="img" aria-label="School application का ढाँचा: ऊपर To और principal का पता, फिर तारीख़, subject, Respected Madam, body, Thanking you और Yours sincerely, और नीचे नाम, class और roll number" xmlns="http://www.w3.org/2000/svg"><title>यह ढाँचा school और college के लिए है। Office ईमेल में इसे मत ले जाना।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sl-pg { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.6; }
              .sl-t { font: 600 11.5px var(--font); fill: var(--text); }
              .sl-b { font: 800 11.5px var(--font); fill: var(--text); }
              .sl-bar { fill: var(--line-strong); }
              .sl-ld { fill: none; stroke: var(--accent-2); stroke-width: 1.5; }
              .sl-dot { fill: var(--accent); }
              .sl-h { font: 800 12px var(--font); fill: var(--accent-ink); }
              .sl-s { font: 500 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="sl-pg" x="16" y="12" width="330" height="396" rx="10"/>

          <text class="sl-t" x="36" y="42">To</text>
          <text class="sl-t" x="36" y="58">The Principal</text>
          <text class="sl-t" x="36" y="74">Green Valley Public School</text>
          <text class="sl-t" x="36" y="90">Nagpur</text>

          <text class="sl-t" x="36" y="122">10 August</text>

          <text class="sl-b" x="36" y="152">Subject: Application for leave, 6–8 August</text>

          <text class="sl-t" x="36" y="182">Respected Madam,</text>

          <rect class="sl-bar" x="36" y="198" width="290" height="7" rx="3.5"/>
          <rect class="sl-bar" x="36" y="214" width="270" height="7" rx="3.5"/>
          <rect class="sl-bar" x="36" y="230" width="282" height="7" rx="3.5"/>
          <rect class="sl-bar" x="36" y="246" width="160" height="7" rx="3.5"/>
          <rect class="sl-bar" x="36" y="266" width="250" height="7" rx="3.5"/>

          <text class="sl-t" x="36" y="304">Thanking you,</text>
          <text class="sl-t" x="36" y="322">Yours sincerely,</text>

          <text class="sl-b" x="36" y="358">Ananya Joshi</text>
          <text class="sl-t" x="36" y="376">Class 9 B, Roll No. 14</text>

          <path class="sl-ld" d="M250 66 H372"/>
          <circle class="sl-dot" cx="378" cy="66" r="5"/>
          <text class="sl-h" x="392" y="62">To — किसको</text>
          <text class="sl-s" x="392" y="78">पद, school, शहर — अलग लाइनें</text>

          <path class="sl-ld" d="M112 118 H372"/>
          <circle class="sl-dot" cx="378" cy="118" r="5"/>
          <text class="sl-h" x="392" y="114">तारीख़</text>
          <text class="sl-s" x="392" y="130">जिस दिन लिख रहे हो</text>

          <path class="sl-ld" d="M340 148 H372"/>
          <circle class="sl-dot" cx="378" cy="148" r="5"/>
          <text class="sl-h" x="392" y="152">Subject — एक लाइन में पूरी बात</text>

          <path class="sl-ld" d="M150 178 H372"/>
          <circle class="sl-dot" cx="378" cy="182" r="5"/>
          <text class="sl-h" x="392" y="178">Greeting</text>
          <text class="sl-s" x="392" y="194">school में "Respected" चलता है</text>

          <path class="sl-ld" d="M330 232 H372"/>
          <circle class="sl-dot" cx="378" cy="232" r="5"/>
