<svg viewBox="0 0 480 430" role="img" aria-label="Presentation का ढाँचा: Open में hook और introduction, फिर signpost, Body में तीन point और हर point के साथ example, फिर signpost, और Close में summary, एक takeaway और सवाल।" xmlns="http://www.w3.org/2000/svg"><title>Open और Close छोटे हैं, Body लंबा। बीच की छोटी गोलियाँ — signposts — सुनने वाले को बताती हैं
        कि एक हिस्सा खत्म हुआ और नया शुरू।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ps-o { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .ps-b { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .ps-p { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .ps-g { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 1.5; }
              .ps-br { fill: none; stroke: var(--accent-line); stroke-width: 2; }
              .ps-h { font: 800 14px var(--font); fill: var(--accent); letter-spacing: 0.06em; }
              .ps-t { font: 500 13px var(--font); fill: var(--text); }
              .ps-gt { font: 700 12.5px var(--font); fill: var(--accent-2); }
              .ps-a { font: 600 13px var(--font); fill: var(--text-soft); }
              .ps-ab { font: 800 13px var(--font); fill: var(--text); }
            </style>
          </defs>

          <rect class="ps-o" x="20" y="20" width="300" height="78" rx="12"/>
          <text class="ps-h" x="36" y="44">OPEN</text>
          <text class="ps-t" x="36" y="66">Hook — सवाल, number या कहानी</text>
          <text class="ps-t" x="36" y="86">आप कौन + आज क्या + कितना समय</text>

          <rect class="ps-g" x="96" y="106" width="148" height="26" rx="13"/>
          <text class="ps-gt" x="170" y="124" text-anchor="middle">→ "First, …"</text>

          <rect class="ps-b" x="20" y="140" width="300" height="170" rx="12"/>
          <text class="ps-h" x="36" y="164">BODY</text>
          <rect class="ps-p" x="36" y="176" width="268" height="34" rx="8"/>
          <text class="ps-t" x="50" y="198">Point 1 + एक example</text>
          <rect class="ps-p" x="36" y="222" width="268" height="34" rx="8"/>
          <text class="ps-t" x="50" y="244">Point 2 + एक example</text>
          <rect class="ps-p" x="36" y="268" width="268" height="34" rx="8"/>
          <text class="ps-t" x="50" y="290">Point 3 + एक example</text>

          <rect class="ps-g" x="96" y="318" width="148" height="26" rx="13"/>
          <text class="ps-gt" x="170" y="336" text-anchor="middle">→ "To sum up, …"</text>

          <rect class="ps-o" x="20" y="352" width="300" height="70" rx="12"/>
          <text class="ps-h" x="36" y="376">CLOSE</text>
          <text class="ps-t" x="36" y="400">Summary + एक takeaway + Q&amp;A</text>

          <path class="ps-br" d="M332 24 Q342 24 342 40 L342 82 Q342 96 332 96"/>
          <text class="ps-a" x="352" y="56">बताओ क्या</text>
          <text class="ps-a" x="352" y="74">बताओगे</text>

          <path class="ps-br" d="M332 144 Q342 144 342 160 L342 292 Q342 306 332 306"/>
          <text class="ps-ab" x="352" y="222">बताओ</text>
          <text class="ps-a" x="352" y="240">(तीन से ज़्यादा</text>
          <text class="ps-a" x="352" y="256">point नहीं)</text>

          <path class="ps-br" d="M332 356 Q342 356 342 370 L342 404 Q342 418 332 418"/>
          <text class="ps-a" x="352" y="384">बताओ क्या</text>
          <text class="ps-a" x="352" y="402">बताया</text>
        </svg>