<svg viewBox="0 0 640 350" role="img" aria-label="बीच में रोज़ की ज़िंदगी, उसके चारों तरफ़ पाँच विषय: सेहत, पैसा, घर, Shopping और सफ़र, हर एक के कुछ ख़ास शब्द के साथ" xmlns="http://www.w3.org/2000/svg"><title>पाँच विषय, हर एक के पाँच-दस टुकड़े। इन्हीं से रोज़ की 80% बातचीत चल जाती है।</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tw-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
              .tw-c { fill: var(--accent); }
              .tw-ct { font: 800 16px var(--font); fill: var(--sheet); }
              .tw-b { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .tw-h { font: 800 15px var(--font); fill: var(--accent); }
              .tw-w { font: 500 13px var(--font); fill: var(--text); }
            </style>
          </defs>
          <path class="tw-ln" d="M320 150 L200 80"/>
          <path class="tw-ln" d="M320 150 L440 80"/>
          <path class="tw-ln" d="M320 150 L115 258"/>
          <path class="tw-ln" d="M320 150 L320 258"/>
          <path class="tw-ln" d="M320 150 L525 258"/>

          <circle class="tw-c" cx="320" cy="150" r="58"/>
          <text class="tw-ct" x="320" y="146" text-anchor="middle">रोज़ की</text>
          <text class="tw-ct" x="320" y="166" text-anchor="middle">ज़िंदगी</text>

          <rect class="tw-b" x="20" y="16" width="190" height="84" rx="12"/>
          <text class="tw-h" x="34" y="42">सेहत</text>
          <text class="tw-w" x="34" y="66">sore throat · fever</text>
          <text class="tw-w" x="34" y="86">chemist · dose</text>

          <rect class="tw-b" x="430" y="16" width="190" height="84" rx="12"/>
          <text class="tw-h" x="444" y="42">पैसा</text>
          <text class="tw-w" x="444" y="66">account · EMI · UPI</text>
          <text class="tw-w" x="444" y="86">withdraw · transfer</text>

          <rect class="tw-b" x="20" y="258" width="190" height="84" rx="12"/>
          <text class="tw-h" x="34" y="284">घर</text>
          <text class="tw-w" x="34" y="308">leaking · power cut</text>
          <text class="tw-w" x="34" y="328">plumber · fix</text>

          <rect class="tw-b" x="225" y="258" width="190" height="84" rx="12"/>
          <text class="tw-h" x="239" y="284">Shopping</text>
          <text class="tw-w" x="239" y="308">fit · exchange</text>
          <text class="tw-w" x="239" y="328">refund · receipt</text>

          <rect class="tw-b" x="430" y="258" width="190" height="84" rx="12"/>
          <text class="tw-h" x="444" y="284">सफ़र</text>
          <text class="tw-w" x="444" y="308">booking · delayed</text>
          <text class="tw-w" x="444" y="328">platform · boarding</text>
        </svg>