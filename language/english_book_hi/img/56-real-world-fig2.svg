<svg viewBox="0 0 640 330" role="img" aria-label="Note-taking template: ऊपर Topic, बाएँ Signposts और सवाल, दाएँ Key points और numbers, नीचे एक लाइन का Summary। उदाहरण PIN code lecture से" xmlns="http://www.w3.org/2000/svg"><title>बाएँ: signposts और सवाल (ढाँचा)। दाएँ: तथ्य और numbers। नीचे: एक लाइन का
    सार — सुनने के बाद लिखो।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:ui-monospace, Menlo, Consolas, monospace;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .nt-fr { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
       .nt-hd { fill: var(--accent); opacity: 0.14; }
       .nt-sep { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 5 4; }
       .nt-h { font: 800 13px var(--font); fill: var(--accent); }
       .nt-w { font: 600 13px var(--font-mono, monospace); fill: var(--text); }
       .nt-s { font: 600 12px var(--font); fill: var(--accent-2); }
      </style>
     </defs>
     <rect class="nt-fr" x="10" y="10" width="620" height="310" rx="12"/>
     <rect class="nt-hd" x="10" y="10" width="620" height="44" rx="12"/>
     <text class="nt-h" x="26" y="38">TOPIC:</text>
     <text class="nt-w" x="90" y="38">PIN code — कैसे काम करता है</text>

     <path class="nt-sep" d="M190 54 V248 M10 248 H630"/>
     <text class="nt-h" x="26" y="78">SIGNPOSTS / ?</text>
     <text class="nt-s" x="26" y="104">Why?</text>
     <text class="nt-s" x="26" y="140">How does it work?</text>
     <text class="nt-s" x="26" y="176">For example</text>
     <text class="nt-s" x="26" y="212">In other words</text>
     <text class="nt-s" x="26" y="236">GPS? → next</text>

     <text class="nt-h" x="206" y="78">KEY POINTS + NUMBERS</text>
