<svg viewBox="0 0 640 270" role="img" aria-label="thirteen में ज़ोर आख़िरी हिस्से teen पर और ee लंबी; thirty में ज़ोर पहले हिस्से thir पर और आख़िरी हिस्सा छोटा।" xmlns="http://www.w3.org/2000/svg"><title>बड़ा डिब्बा = ज़ोर वाला हिस्सा। -teen में आख़िरी हिस्सा बड़ा और लंबा; -ty में
        पहला हिस्सा बड़ा और आख़िर झटके से ख़त्म।</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .nb-big { fill: var(--accent); }
              .nb-sm { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
              .nb-w { font: 800 22px var(--font); fill: var(--text); }
              .nb-sy { font: 700 15px var(--font); fill: var(--sheet); }
              .nb-sy2 { font: 600 14px var(--font); fill: var(--text); }
              .nb-n { font: 600 13px var(--font); fill: var(--text-soft); }
              .nb-h { font: 800 13px var(--font); fill: var(--accent); letter-spacing: .05em; }
              .nb-sep { stroke: var(--line); stroke-width: 1.5; }
            </style>
          </defs>

          <text class="nb-h" x="20" y="26">13 · THIRTEEN</text>
          <text class="nb-w" x="20" y="62">thir-TEEN</text>
          <rect class="nb-sm" x="200" y="56" width="80" height="34" rx="8"/>
          <text class="nb-sy2" x="240" y="78" text-anchor="middle">thir</text>
          <rect class="nb-big" x="290" y="30" width="150" height="60" rx="10"/>
          <text class="nb-sy" x="365" y="66" text-anchor="middle">TEEEN</text>
          <text class="nb-n" x="460" y="56">ज़ोर आख़िर में,</text>
          <text class="nb-n" x="460" y="76">"ee" लंबी + n</text>

          <line class="nb-sep" x1="20" y1="122" x2="620" y2="122"/>

          <text class="nb-h" x="20" y="152">30 · THIRTY</text>
          <text class="nb-w" x="20" y="188">THIR-ty</text>
          <rect class="nb-big" x="200" y="156" width="120" height="60" rx="10"/>
          <text class="nb-sy" x="260" y="192" text-anchor="middle">THIR</text>
          <rect class="nb-sm" x="330" y="182" width="56" height="34" rx="8"/>
          <text class="nb-sy2" x="358" y="204" text-anchor="middle">ty</text>
          <text class="nb-n" x="460" y="182">ज़ोर शुरू में,</text>
          <text class="nb-n" x="460" y="202">आख़िर छोटा "ti/di"</text>

          <text class="nb-n" x="20" y="252">यही pattern: 14/40 · 15/50 · 16/60 · 17/70 · 18/80 · 19/90</text>
        </svg>