<svg viewBox="0 0 700 300" role="img" aria-label="Apostrophe लगाने का फ़ैसला: singular noun में apostrophe s, plural जो s पर ख़त्म हो उसमें सिर्फ़ apostrophe, शब्द जोड़ने में apostrophe s, और plural बनाने में apostrophe कभी नहीं" xmlns="http://www.w3.org/2000/svg"><title>हरा = सही जगह। लाल = वो गलती जो दुकान के board से लेकर office के email तक सब
        जगह दिखती है।</title><style>svg{--bad:#be123c;--bad-bg:#fdecef;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--font-mono:ui-monospace, Menlo, Consolas, monospace;--good:#15803d;--good-bg:#e8f7ee;--ink-500:#64748b;--line:#e3e7ef;--page-alt:#eef1f6;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ab { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.4; }
              .ag { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.8; }
              .an { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 1.8; }
              .at { font: 700 12.5px var(--font); fill: var(--text); }
              .ah { font: 800 12px var(--font); fill: var(--text-soft); letter-spacing: 0.06em; }
              .ax { font: 800 14px var(--font-mono); fill: var(--brand-600); }
              .ar { fill: none; stroke: var(--ink-500); stroke-width: 2; }
              .as { font: 500 10.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-500)"/>
            </marker>
          </defs>

          <text class="ah" x="20" y="24">APOSTROPHE कहाँ लगेगा?</text>

          <rect class="ab" x="20" y="38" width="200" height="44" rx="9"/>
          <text class="at" x="34" y="58">एक इंसान / चीज़ का</text>
          <text class="as" x="34" y="74">रवि का bag</text>
          <line class="ar" x1="226" y1="60" x2="286" y2="60" marker-end="url(#ap)"/>
          <rect class="ag" x="292" y="38" width="150" height="44" rx="9"/>
          <text class="ax" x="367" y="65" text-anchor="middle">Ravi's bag</text>
          <text class="as" x="460" y="65">'s लगाओ</text>

          <rect class="ab" x="20" y="96" width="200" height="44" rx="9"/>
          <text class="at" x="34" y="116">Plural, जो s पर ख़त्म</text>
          <text class="as" x="34" y="132">लड़कों का hostel</text>
          <line class="ar" x1="226" y1="118" x2="286" y2="118" marker-end="url(#ap)"/>
          <rect class="ag" x="292" y="96" width="150" height="44" rx="9"/>
          <text class="ax" x="367" y="123" text-anchor="middle">boys' hostel</text>
          <text class="as" x="460" y="123">सिर्फ़ ' लगाओ</text>

          <rect class="ab" x="20" y="154" width="200" height="44" rx="9"/>
          <text class="at" x="34" y="174">Plural, बिना s</text>
          <text class="as" x="34" y="190">बच्चों का park</text>
          <line class="ar" x1="226" y1="176" x2="286" y2="176" marker-end="url(#ap)"/>
          <rect class="ag" x="292" y="154" width="150" height="44" rx="9"/>
          <text class="ax" x="367" y="181" text-anchor="middle">children's park</text>
          <text class="as" x="460" y="181">'s लगाओ</text>

          <rect class="ab" x="20" y="212" width="200" height="44" rx="9"/>
          <text class="at" x="34" y="232">शब्द जोड़ रहे हो</text>
          <text class="as" x="34" y="248">it is → …</text>
          <line class="ar" x1="226" y1="234" x2="286" y2="234" marker-end="url(#ap)"/>
          <rect class="ag" x="292" y="212" width="150" height="44" rx="9"/>
          <text class="ax" x="367" y="239" text-anchor="middle">it's</text>
          <text class="as" x="460" y="239">छूटे अक्षर की जगह</text>

          <rect class="an" x="20" y="268" width="422" height="26" rx="9"/>
          <text class="at" x="34" y="286" fill="var(--bad)">सिर्फ़ plural? → apostrophe कभी नहीं: mangoes, not mango's</text>
        </svg>