<svg viewBox="0 0 480 330" role="img" aria-label="तीन problem और उनकी लाइन: नेटवर्क खराब हो तो sorry you're breaking up, बहुत तेज़ बोल रहे हों तो could you speak more slowly, एक शब्द न समझे तो what was the last part। नीचे: ज़रूरी बात को दोहराकर confirm करो।" xmlns="http://www.w3.org/2000/svg"><title>पहले problem पहचानो, फिर उसकी लाइन। और जो भी date, time, number या नाम हो — उसे
        अपने शब्दों में दोहराकर पक्का करो।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .hr-p { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .hr-a { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .hr-c { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2; }
              .hr-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#hr-ar); }
              .hr-h { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
              .hr-t { font: 700 13.5px var(--font); fill: var(--text); }
              .hr-s { font: italic 500 13px var(--font); fill: var(--text); }
              .hr-k { font: 600 13px var(--font); fill: var(--role-conj); }
            </style>
            <marker id="hr-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>
          <text class="hr-h" x="20" y="22">PROBLEM</text>
          <text class="hr-h" x="200" y="22">आपकी लाइन</text>

          <rect class="hr-p" x="20" y="34" width="150" height="62" rx="10"/>
          <text class="hr-t" x="34" y="60">नेटवर्क खराब,</text>
          <text class="hr-t" x="34" y="80">आवाज़ टूट रही</text>
          <path class="hr-ln" d="M172 65 L196 65"/>
          <rect class="hr-a" x="200" y="34" width="270" height="62" rx="10"/>
          <text class="hr-s" x="214" y="60">"Sorry, you're breaking up."</text>
          <text class="hr-s" x="214" y="80">"Can I call you back?"</text>

          <rect class="hr-p" x="20" y="112" width="150" height="62" rx="10"/>
          <text class="hr-t" x="34" y="138">बहुत तेज़ बोल</text>
          <text class="hr-t" x="34" y="158">रहे हैं</text>
          <path class="hr-ln" d="M172 143 L196 143"/>
          <rect class="hr-a" x="200" y="112" width="270" height="62" rx="10"/>
          <text class="hr-s" x="214" y="138">"Could you speak a little</text>
          <text class="hr-s" x="214" y="158">more slowly, please?"</text>

          <rect class="hr-p" x="20" y="190" width="150" height="62" rx="10"/>
          <text class="hr-t" x="34" y="216">एक शब्द नहीं</text>
          <text class="hr-t" x="34" y="236">समझा</text>
          <path class="hr-ln" d="M172 221 L196 221"/>
          <rect class="hr-a" x="200" y="190" width="270" height="62" rx="10"/>
          <text class="hr-s" x="214" y="216">"Sorry, what was the</text>
          <text class="hr-s" x="214" y="236">last part?"</text>

          <rect class="hr-c" x="20" y="268" width="450" height="50" rx="10"/>
          <text class="hr-k" x="34" y="298">ज़रूरी बात? "Just to confirm — Thursday at three?"</text>
        </svg>