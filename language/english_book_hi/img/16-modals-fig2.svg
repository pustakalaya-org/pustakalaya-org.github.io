<svg viewBox="0 0 640 252" role="img" aria-label="विनम्रता की सीढ़ी — Can I (दोस्त, घर), Could you (विनम्र), May I (formal, सिर्फ़ permission), Would you mind plus -ing (सबसे विनम्र request)। सीढ़ी जितनी ऊपर, उतनी ज़्यादा विनम्रता।" xmlns="http://www.w3.org/2000/svg"><title>सीढ़ी जितनी ऊपर, बात उतनी विनम्र। Office और अनजान लोगों के साथ बीच की सीढ़ियाँ सबसे सुरक्षित हैं।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-prep:#ea580c;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pl-step { fill: var(--sheet); stroke-width: 2; }
              .pl-w { font: 800 14px var(--font); }
              .pl-g { font: 500 11px var(--font); fill: var(--text-soft); }
              .pl-ex { font: 600 11px var(--font); fill: var(--text); }
              .pl-ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
              .pl-hd { font: 800 12px var(--font); fill: var(--accent); }
            </style>
            <marker id="plArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>

          <text class="pl-hd" x="30" y="30">ज़्यादा विनम्र, ज़्यादा formal →</text>
          <path class="pl-ln" d="M100 155 L240 115 L380 75 L540 33" marker-end="url(#plArrow)"/>

          <rect class="pl-step" x="30" y="170" width="140" height="70" rx="8" stroke="var(--role-adj)"/>
          <text class="pl-w" x="100" y="192" text-anchor="middle" fill="var(--role-adj)">Can I / you…?</text>
          <text class="pl-g" x="100" y="210" text-anchor="middle">दोस्त, घर</text>
          <text class="pl-ex" x="100" y="228" text-anchor="middle">Can I sit here?</text>

          <rect class="pl-step" x="170" y="130" width="140" height="110" rx="8" stroke="var(--role-adv)"/>
          <text class="pl-w" x="240" y="152" text-anchor="middle" fill="var(--role-adv)">Could you…?</text>
          <text class="pl-g" x="240" y="170" text-anchor="middle">विनम्र, हर जगह</text>
          <text class="pl-ex" x="240" y="188" text-anchor="middle">Could you help me?</text>

          <rect class="pl-step" x="310" y="90" width="140" height="150" rx="8" stroke="var(--role-prep)"/>
          <text class="pl-w" x="380" y="112" text-anchor="middle" fill="var(--role-prep)">May I…?</text>
          <text class="pl-g" x="380" y="130" text-anchor="middle">formal — सिर्फ़ I / we</text>
          <text class="pl-ex" x="380" y="148" text-anchor="middle">May I come in?</text>

          <rect class="pl-step" x="450" y="50" width="170" height="190" rx="8" stroke="var(--role-verb)"/>
          <text class="pl-w" x="535" y="72" text-anchor="middle" fill="var(--role-verb)">Would you mind…?</text>
          <text class="pl-g" x="535" y="90" text-anchor="middle">सबसे विनम्र request</text>
          <text class="pl-ex" x="535" y="108" text-anchor="middle">Would you mind waiting?</text>
          <text class="pl-g" x="535" y="126" text-anchor="middle">(mind के बाद verb-ing)</text>
        </svg>