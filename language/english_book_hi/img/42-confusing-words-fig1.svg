<svg viewBox="0 0 480 330" role="img" aria-label="तीन गुच्छे: आवाज़ एक पर spelling अलग — its, your, their, stationary, principal। Spelling लगभग एक — affect, advice, lose, quite, then, accept। दिशा या गिनती का फ़र्क — borrow, bring, say, fewer, lie।" xmlns="http://www.w3.org/2000/svg"><title>पहला गुच्छा लिखते वक़्त पकड़ता है, दूसरा पढ़ते वक़्त, और तीसरा बोलते वक़्त — क्योंकि Hindi में एक ही शब्द दोनों काम करता है।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ov-h { fill: var(--accent); }
              .ov-h2 { fill: var(--accent-2); }
              .ov-h3 { fill: var(--role-noun); }
              .ov-ht { font: 800 12.5px var(--font); fill: var(--sheet); letter-spacing: 0.04em; }
              .ov-c { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .ov-w { font: 600 12.5px var(--font); fill: var(--text); }
            </style>
          </defs>
          <rect class="ov-h" x="6" y="10" width="150" height="56" rx="10"/>
          <text class="ov-ht" x="81" y="33" text-anchor="middle">आवाज़ एक,</text>
          <text class="ov-ht" x="81" y="52" text-anchor="middle">SPELLING अलग</text>
          <rect class="ov-h2" x="165" y="10" width="150" height="56" rx="10"/>
          <text class="ov-ht" x="240" y="33" text-anchor="middle">SPELLING</text>
          <text class="ov-ht" x="240" y="52" text-anchor="middle">लगभग एक</text>
          <rect class="ov-h3" x="324" y="10" width="150" height="56" rx="10"/>
          <text class="ov-ht" x="399" y="33" text-anchor="middle">दिशा या</text>
          <text class="ov-ht" x="399" y="52" text-anchor="middle">गिनती का फ़र्क</text>

          <rect class="ov-c" x="6" y="80" width="150" height="32" rx="16"/><text class="ov-w" x="81" y="101" text-anchor="middle">its / it's</text>
          <rect class="ov-c" x="6" y="120" width="150" height="32" rx="16"/><text class="ov-w" x="81" y="141" text-anchor="middle">your / you're</text>
          <rect class="ov-c" x="6" y="160" width="150" height="32" rx="16"/><text class="ov-w" x="81" y="181" text-anchor="middle">their / there / they're</text>
          <rect class="ov-c" x="6" y="200" width="150" height="32" rx="16"/><text class="ov-w" x="81" y="221" text-anchor="middle">stationAry / -Ery</text>
          <rect class="ov-c" x="6" y="240" width="150" height="32" rx="16"/><text class="ov-w" x="81" y="261" text-anchor="middle">principAL / -LE</text>

          <rect class="ov-c" x="165" y="80" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="101" text-anchor="middle">affect / effect</text>
          <rect class="ov-c" x="165" y="120" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="141" text-anchor="middle">advice / advise</text>
          <rect class="ov-c" x="165" y="160" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="181" text-anchor="middle">lose / loose</text>
          <rect class="ov-c" x="165" y="200" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="221" text-anchor="middle">quite / quiet</text>
          <rect class="ov-c" x="165" y="240" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="261" text-anchor="middle">then / than</text>
          <rect class="ov-c" x="165" y="280" width="150" height="32" rx="16"/><text class="ov-w" x="240" y="301" text-anchor="middle">accept / except</text>

          <rect class="ov-c" x="324" y="80" width="150" height="32" rx="16"/><text class="ov-w" x="399" y="101" text-anchor="middle">borrow / lend</text>
          <rect class="ov-c" x="324" y="120" width="150" height="32" rx="16"/><text class="ov-w" x="399" y="141" text-anchor="middle">bring / take</text>
          <rect class="ov-c" x="324" y="160" width="150" height="32" rx="16"/><text class="ov-w" x="399" y="181" text-anchor="middle">say / tell</text>
          <rect class="ov-c" x="324" y="200" width="150" height="32" rx="16"/><text class="ov-w" x="399" y="221" text-anchor="middle">fewer / less</text>
          <rect class="ov-c" x="324" y="240" width="150" height="32" rx="16"/><text class="ov-w" x="399" y="261" text-anchor="middle">lie / lay</text>
        </svg>