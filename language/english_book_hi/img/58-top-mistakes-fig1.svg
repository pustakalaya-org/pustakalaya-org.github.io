<svg viewBox="0 0 680 320" role="img" aria-label="छह groups का bar chart जिसमें articles और prepositions की bar सबसे लंबी हैं और word order की सबसे छोटी" xmlns="http://www.w3.org/2000/svg"><title>छह groups, गलती होने की तरतीब में। Articles और prepositions हिंदी में होते ही नहीं —
        इसलिए वही सबसे ज़्यादा छूटते हैं।</title><style>svg{--brand-200:#fed7aa;--brand-400:#fb923c;--brand-500:#f97316;--brand-700:#c2410c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--line:#e3e7ef;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .bar { fill: var(--brand-500); }
              .bar2 { fill: var(--brand-400); }
              .bar3 { fill: var(--brand-200); }
              .lb { font: 700 12px var(--font); fill: var(--text); }
              .vl { font: 700 11.5px var(--font); fill: var(--brand-700); }
              .nt { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .ax { stroke: var(--ink-300); stroke-width: 2; }
              .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
            </style>
          </defs>

          <line class="ax" x1="162" y1="24" x2="162" y2="278"/>
          <line class="grid" x1="282" y1="24" x2="282" y2="278"/>
          <line class="grid" x1="402" y1="24" x2="402" y2="278"/>
          <line class="grid" x1="522" y1="24" x2="522" y2="278"/>
          <line class="grid" x1="642" y1="24" x2="642" y2="278"/>

          <text class="lb" x="154" y="48" text-anchor="end">Articles</text>
          <rect class="bar" x="162" y="34" width="456" height="24" rx="5"/>
          <text class="vl" x="622" y="51" style="font-size:11px">a / an / the</text>

          <text class="lb" x="154" y="88" text-anchor="end">Prepositions</text>
          <rect class="bar" x="162" y="74" width="408" height="24" rx="5"/>
          <text class="vl" x="578" y="91">in / on / at</text>

          <text class="lb" x="154" y="128" text-anchor="end">Tenses</text>
          <rect class="bar2" x="162" y="114" width="348" height="24" rx="5"/>
          <text class="vl" x="518" y="131">since / for</text>

          <text class="lb" x="154" y="168" text-anchor="end">Word choice</text>
          <rect class="bar2" x="162" y="154" width="300" height="24" rx="5"/>
          <text class="vl" x="470" y="171">much / many</text>

          <text class="lb" x="154" y="208" text-anchor="end">Plurals</text>
          <rect class="bar3" x="162" y="194" width="228" height="24" rx="5"/>
          <text class="vl" x="398" y="211">informations</text>

          <text class="lb" x="154" y="248" text-anchor="end">Word order</text>
          <rect class="bar3" x="162" y="234" width="168" height="24" rx="5"/>
          <text class="vl" x="338" y="251">question order</text>

          <line class="ax" x1="162" y1="278" x2="650" y2="278"/>
          <text class="nt" x="162" y="298">कम</text>
          <text class="nt" x="646" y="298" text-anchor="end">सबसे ज़्यादा गलतियाँ</text>
          <text class="nt" x="162" y="314">Chart का मतलब: ऊपर वाले groups पर पहले मेहनत करो।</text>
        </svg>