<svg viewBox="0 0 680 400" role="img" aria-label="Idioms का तीन-signal chart: हरे में हर जगह safe idioms, पीले में सिर्फ़ बोलने वाले, लाल में formal जगह पर मना" xmlns="http://www.w3.org/2000/svg"><title>तीन डिब्बे, तीन signal। अगर याद न रहे, हरा डिब्बा हमेशा सुरक्षित है।</title><style>svg{--bad:#be123c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .col { fill: var(--card); stroke-width: 2; }
              .g { stroke: var(--good); }
              .a { stroke: var(--warn); }
              .r { stroke: var(--bad); }
              .hdg { font: 800 13px var(--font); fill: var(--good); }
              .hda { font: 800 13px var(--font); fill: var(--warn); }
              .hdr { font: 800 13px var(--font); fill: var(--bad); }
              .it { font: 600 11.8px var(--font); fill: var(--text); }
              .nt { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .lamp-g { fill: var(--good); }
              .lamp-a { fill: var(--warn); }
              .lamp-r { fill: var(--bad); }
            </style>
          </defs>

