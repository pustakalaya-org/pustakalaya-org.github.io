<svg viewBox="0 0 480 336" role="img" aria-label="Phonetic alphabet की grid: A for Alpha से Z for Zulu तक। B, D, E, P, T, V, M, N, F और S रंगीन हैं क्योंकि फ़ोन पर ये आपस में सबसे ज़्यादा मिलते हैं।" xmlns="http://www.w3.org/2000/svg"><title>&quot;B for Bombay&quot; जैसे देसी शब्द भी India में चल जाते हैं — बस शब्द साफ़ और जाना-पहचाना हो।
        International कॉल पर ऊपर वाली लिस्ट सबसे safe है।</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pa-c { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .pa-h { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .pa-l { font: 800 16px var(--font); fill: var(--accent); }
              .pa-w { font: 500 13px var(--font); fill: var(--text); }
              .pa-t { font: 700 13px var(--font); fill: var(--text-soft); }
              .pa-n { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <text class="pa-t" x="6" y="20">फ़ोन पर: "B for Bravo, R for Romeo…"</text>

          <rect class="pa-c" x="6" y="34" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="59">A</text><text class="pa-w" x="40" y="58">Alpha</text>
          <rect class="pa-h" x="124" y="34" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="59">B</text><text class="pa-w" x="158" y="58">Bravo</text>
          <rect class="pa-c" x="242" y="34" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="59">C</text><text class="pa-w" x="276" y="58">Charlie</text>
          <rect class="pa-h" x="360" y="34" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="59">D</text><text class="pa-w" x="394" y="58">Delta</text>

          <rect class="pa-h" x="6" y="76" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="101">E</text><text class="pa-w" x="40" y="100">Echo</text>
          <rect class="pa-h" x="124" y="76" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="101">F</text><text class="pa-w" x="158" y="100">Foxtrot</text>
          <rect class="pa-c" x="242" y="76" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="101">G</text><text class="pa-w" x="276" y="100">Golf</text>
          <rect class="pa-c" x="360" y="76" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="101">H</text><text class="pa-w" x="394" y="100">Hotel</text>

          <rect class="pa-c" x="6" y="118" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="143">I</text><text class="pa-w" x="40" y="142">India</text>
          <rect class="pa-c" x="124" y="118" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="143">J</text><text class="pa-w" x="158" y="142">Juliett</text>
          <rect class="pa-c" x="242" y="118" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="143">K</text><text class="pa-w" x="276" y="142">Kilo</text>
          <rect class="pa-c" x="360" y="118" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="143">L</text><text class="pa-w" x="394" y="142">Lima</text>

          <rect class="pa-h" x="6" y="160" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="185">M</text><text class="pa-w" x="40" y="184">Mike</text>
          <rect class="pa-h" x="124" y="160" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="185">N</text><text class="pa-w" x="158" y="184">November</text>
          <rect class="pa-c" x="242" y="160" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="185">O</text><text class="pa-w" x="276" y="184">Oscar</text>
          <rect class="pa-h" x="360" y="160" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="185">P</text><text class="pa-w" x="394" y="184">Papa</text>

          <rect class="pa-c" x="6" y="202" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="227">Q</text><text class="pa-w" x="40" y="226">Quebec</text>
          <rect class="pa-c" x="124" y="202" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="227">R</text><text class="pa-w" x="158" y="226">Romeo</text>
          <rect class="pa-h" x="242" y="202" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="227">S</text><text class="pa-w" x="276" y="226">Sierra</text>
          <rect class="pa-h" x="360" y="202" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="227">T</text><text class="pa-w" x="394" y="226">Tango</text>

          <rect class="pa-c" x="6" y="244" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="269">U</text><text class="pa-w" x="40" y="268">Uniform</text>
          <rect class="pa-h" x="124" y="244" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="269">V</text><text class="pa-w" x="158" y="268">Victor</text>
          <rect class="pa-c" x="242" y="244" width="114" height="38" rx="8"/><text class="pa-l" x="254" y="269">W</text><text class="pa-w" x="276" y="268">Whiskey</text>
          <rect class="pa-c" x="360" y="244" width="114" height="38" rx="8"/><text class="pa-l" x="372" y="269">X</text><text class="pa-w" x="394" y="268">X-ray</text>

          <rect class="pa-c" x="6" y="286" width="114" height="38" rx="8"/><text class="pa-l" x="18" y="311">Y</text><text class="pa-w" x="40" y="310">Yankee</text>
          <rect class="pa-c" x="124" y="286" width="114" height="38" rx="8"/><text class="pa-l" x="136" y="311">Z</text><text class="pa-w" x="158" y="310">Zulu</text>
          <rect class="pa-h" x="246" y="296" width="14" height="14" rx="3"/>
          <text class="pa-n" x="268" y="302">रंगीन = फ़ोन पर आपस में</text>
          <text class="pa-n" x="268" y="318">सबसे मिलते-जुलते letters</text>
        </svg>