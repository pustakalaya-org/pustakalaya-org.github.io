<svg viewBox="0 0 620 212" role="img" aria-label="दो तरीके: She gave her son a phone — इंसान पहले, बिना to। She gave a phone to her son — चीज़ पहले, इंसान के साथ to। दोनों में objects की जगह बदल जाती है।" xmlns="http://www.w3.org/2000/svg"><title>इंसान पहले आए तो &quot;to&quot; नहीं लगता। चीज़ पहले आए तो इंसान से पहले &quot;to&quot; (या &quot;for&quot;) लगाओ।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-prep:#ea580c;--role-pron:#0891b2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .oo-blk { fill: var(--sheet); stroke-width: 2; }
              .oo-w { font: 700 13.5px var(--font); }
              .oo-note { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .oo-hd { font: 800 12px var(--font); fill: var(--text); }
              .oo-ln { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 5 4; }
            </style>
          </defs>

          <rect class="oo-blk" x="30" y="20" width="60" height="38" rx="8" stroke="var(--role-noun)"/>
          <text class="oo-w" x="60" y="44" text-anchor="middle" fill="var(--role-noun)">She</text>
          <rect class="oo-blk" x="100" y="20" width="70" height="38" rx="8" stroke="var(--role-verb)"/>
          <text class="oo-w" x="135" y="44" text-anchor="middle" fill="var(--role-verb)">gave</text>
          <rect class="oo-blk" x="180" y="20" width="90" height="38" rx="8" stroke="var(--role-prep)"/>
          <text class="oo-w" x="225" y="44" text-anchor="middle" fill="var(--role-prep)">her son</text>
          <rect class="oo-blk" x="280" y="20" width="100" height="38" rx="8" stroke="var(--role-pron)"/>
          <text class="oo-w" x="330" y="44" text-anchor="middle" fill="var(--role-pron)">a phone.</text>
          <text class="oo-hd" x="410" y="36">इंसान पहले</text>
          <text class="oo-note" x="410" y="53">बिना "to" — S V O O</text>

          <path class="oo-ln" d="M225 62 C225 100, 340 100, 340 132"/>
          <path class="oo-ln" d="M330 62 C330 100, 225 100, 225 132"/>

          <rect class="oo-blk" x="30" y="136" width="60" height="38" rx="8" stroke="var(--role-noun)"/>
          <text class="oo-w" x="60" y="160" text-anchor="middle" fill="var(--role-noun)">She</text>
          <rect class="oo-blk" x="100" y="136" width="70" height="38" rx="8" stroke="var(--role-verb)"/>
          <text class="oo-w" x="135" y="160" text-anchor="middle" fill="var(--role-verb)">gave</text>
          <rect class="oo-blk" x="180" y="136" width="90" height="38" rx="8" stroke="var(--role-pron)"/>
          <text class="oo-w" x="225" y="160" text-anchor="middle" fill="var(--role-pron)">a phone</text>
          <rect class="oo-blk" x="280" y="136" width="120" height="38" rx="8" stroke="var(--role-prep)"/>
          <text class="oo-w" x="340" y="160" text-anchor="middle" fill="var(--role-prep)">to her son.</text>
          <text class="oo-hd" x="420" y="152">चीज़ पहले</text>
          <text class="oo-note" x="420" y="169">इंसान के साथ "to"</text>
          <text class="oo-note" x="310" y="202" text-anchor="middle">मतलब बिल्कुल एक — सिर्फ़ क्रम और "to" का फ़र्क।</text>
        </svg>