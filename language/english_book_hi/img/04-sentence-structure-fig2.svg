<svg viewBox="0 0 640 262" role="img" aria-label="हिंदी में क्रम Subject, Object, Verb है — राम ने, श्याम को, मारा। English में क्रम Subject, Verb, Object है — Ram hit Shyam। Verb और object की जगह आपस में बदल जाती है।" xmlns="http://www.w3.org/2000/svg"><title>हिंदी में &quot;ने / को&quot; काम बताते हैं, इसलिए क्रम खुला है। English में जगह ही सब कुछ बताती है।</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-pron:#0891b2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .wo-blk { fill: var(--sheet); stroke-width: 2.2; }
              .wo-w { font: 700 15px var(--font); }
              .wo-tag { font: 800 12px var(--font); }
              .wo-row { font: 800 12px var(--font); fill: var(--text); }
              .wo-sub { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .wo-ln { fill: none; stroke: var(--text-soft); stroke-width: 1.6; stroke-dasharray: 5 5; }
            </style>
          </defs>

          <text class="wo-row" x="14" y="53">हिंदी (SOV)</text>
          <text class="wo-tag" x="170" y="20" text-anchor="middle" fill="var(--role-noun)">S</text>
          <text class="wo-tag" x="315" y="20" text-anchor="middle" fill="var(--role-pron)">O</text>
          <text class="wo-tag" x="455" y="20" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="wo-blk" x="110" y="28" width="120" height="40" rx="9" stroke="var(--role-noun)"/>
          <text class="wo-w" x="170" y="53" text-anchor="middle" fill="var(--role-noun)">राम ने</text>
          <rect class="wo-blk" x="250" y="28" width="130" height="40" rx="9" stroke="var(--role-pron)"/>
          <text class="wo-w" x="315" y="53" text-anchor="middle" fill="var(--role-pron)">श्याम को</text>
          <rect class="wo-blk" x="400" y="28" width="110" height="40" rx="9" stroke="var(--role-verb)"/>
          <text class="wo-w" x="455" y="53" text-anchor="middle" fill="var(--role-verb)">मारा</text>

          <path class="wo-ln" d="M170 72 L170 146"/>
          <path class="wo-ln" d="M315 72 C315 110, 455 110, 455 146"/>
          <path class="wo-ln" d="M455 72 C455 110, 315 110, 315 146"/>

          <text class="wo-row" x="14" y="175">English (SVO)</text>
          <rect class="wo-blk" x="110" y="150" width="120" height="40" rx="9" stroke="var(--role-noun)"/>
          <text class="wo-w" x="170" y="175" text-anchor="middle" fill="var(--role-noun)">Ram</text>
          <rect class="wo-blk" x="250" y="150" width="130" height="40" rx="9" stroke="var(--role-verb)"/>
          <text class="wo-w" x="315" y="175" text-anchor="middle" fill="var(--role-verb)">hit</text>
          <rect class="wo-blk" x="400" y="150" width="110" height="40" rx="9" stroke="var(--role-pron)"/>
          <text class="wo-w" x="455" y="175" text-anchor="middle" fill="var(--role-pron)">Shyam.</text>
          <text class="wo-tag" x="170" y="208" text-anchor="middle" fill="var(--role-noun)">S</text>
          <text class="wo-tag" x="315" y="208" text-anchor="middle" fill="var(--role-verb)">V</text>
          <text class="wo-tag" x="455" y="208" text-anchor="middle" fill="var(--role-pron)">O</text>

          <text class="wo-sub" x="320" y="236" text-anchor="middle">Verb हिंदी में आखिर में जाता है; English में सीधे subject के बाद।</text>
          <text class="wo-sub" x="320" y="254" text-anchor="middle">"Shyam hit Ram" बोला तो मार Ram को पड़ी — सिर्फ़ जगह बदलने से!</text>
        </svg>