<svg viewBox="0 0 640 430" role="img" aria-label="Essay का ढाँचा: ऊपर उल्टा त्रिकोण intro जो thesis पर ख़त्म होता है, बीच में दो body paragraph जिनके अंदर Point, Explain, Evidence, Link, और नीचे सीधा त्रिकोण conclusion" xmlns="http://www.w3.org/2000/svg"><title>Intro चौड़े से पतला होता है (topic → thesis), conclusion पतले से चौड़ा (राय → बड़ी तस्वीर)।
        बीच में हर body paragraph एक PEEL है।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .es-in { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
