          <text class="es-th" x="320" y="96" text-anchor="middle">THESIS — आपकी राय</text>

          <rect class="es-bd" x="140" y="128" width="360" height="92" rx="12"/>
          <text class="es-h" x="160" y="152">BODY 1</text>
          <text class="es-p" x="160" y="176">P — Point</text>
          <text class="es-p" x="330" y="176">E — Explain</text>
          <text class="es-p" x="160" y="200">E — Evidence / Example</text>
          <text class="es-p" x="330" y="200">L — Link</text>

          <rect class="es-bd" x="140" y="234" width="360" height="92" rx="12"/>
          <text class="es-h" x="160" y="258">BODY 2</text>
          <text class="es-p" x="160" y="282">P — Point</text>
