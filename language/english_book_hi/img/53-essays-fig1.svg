          <text class="es-th" x="320" y="366" text-anchor="middle">राय दोबारा (नए शब्दों में)</text>
          <text class="es-h" x="320" y="390" text-anchor="middle">CONCLUSION</text>
          <text class="es-s" x="320" y="410" text-anchor="middle">कोई नया point नहीं</text>

          <text class="es-n" x="520" y="178">~70–90</text>
