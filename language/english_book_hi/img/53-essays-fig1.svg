              .es-h { font: 800 15px var(--font); fill: var(--text); }
              .es-s { font: 500 12px var(--font); fill: var(--text-soft); }
              .es-th { font: 800 13px var(--font); fill: var(--accent); }
              .es-p { font: 700 12px var(--font); fill: var(--accent-2); }
              .es-n { font: 700 13px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <path class="es-in" d="M60 10 H580 L440 110 H200 Z"/>
          <text class="es-h" x="320" y="38" text-anchor="middle">INTRODUCTION</text>
