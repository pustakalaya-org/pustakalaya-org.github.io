<svg viewBox="0 0 640 330" role="img" aria-label="Decision tree: पहले होता था, अब नहीं तो used to या would; आदत है तो be used to plus -ing; आदत पड़ रही है तो get used to plus -ing." xmlns="http://www.w3.org/2000/svg"><title>तीन रास्ते, तीन structures। पहले वाले में &quot;used to&quot; के बाद V1 ;
        बाकी दो में &quot;to&quot; के बाद -ing या noun ।</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ut-root { fill: var(--accent); }
              .ut-q { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
              .ut-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .ut-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
              .ut-rt { font: 700 16px var(--font); fill: var(--sheet); }
              .ut-t { font: 600 14px var(--font); fill: var(--text); }
              .ut-b { font: 800 16px var(--font); fill: var(--role-verb); }
              .ut-s { font: 600 13px var(--font); fill: var(--text); }
              .ut-e { font: italic 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <rect class="ut-root" x="190" y="12" width="260" height="46" rx="23"/>
          <text class="ut-rt" x="320" y="41" text-anchor="middle">आदत की कौन-सी बात?</text>

          <path class="ut-ln" d="M320 58 L320 84 M115 84 L525 84 M115 84 L115 104 M320 84 L320 104 M525 84 L525 104"/>

          <rect class="ut-q" x="20" y="104" width="190" height="58" rx="10"/>
          <text class="ut-t" x="115" y="128" text-anchor="middle">पहले होता था,</text>
          <text class="ut-t" x="115" y="148" text-anchor="middle">अब नहीं</text>

          <rect class="ut-q" x="225" y="104" width="190" height="58" rx="10"/>
          <text class="ut-t" x="320" y="128" text-anchor="middle">आदत है —</text>
          <text class="ut-t" x="320" y="148" text-anchor="middle">अब normal लगता है</text>

          <rect class="ut-q" x="430" y="104" width="190" height="58" rx="10"/>
          <text class="ut-t" x="525" y="128" text-anchor="middle">आदत पड़ रही है</text>
          <text class="ut-t" x="525" y="148" text-anchor="middle">(नया → normal)</text>

          <path class="ut-ln" d="M115 162 L115 190 M320 162 L320 190 M525 162 L525 190"/>

          <rect class="ut-a" x="20" y="190" width="190" height="72" rx="10"/>
          <text class="ut-b" x="115" y="218" text-anchor="middle">used to + V1</text>
          <text class="ut-s" x="115" y="242" text-anchor="middle">would + V1 (सिर्फ़ action)</text>

          <rect class="ut-a" x="225" y="190" width="190" height="72" rx="10"/>
          <text class="ut-b" x="320" y="218" text-anchor="middle">be used to</text>
          <text class="ut-s" x="320" y="242" text-anchor="middle">+ -ing / noun</text>

          <rect class="ut-a" x="430" y="190" width="190" height="72" rx="10"/>
          <text class="ut-b" x="525" y="218" text-anchor="middle">get used to</text>
          <text class="ut-s" x="525" y="242" text-anchor="middle">+ -ing / noun</text>

          <text class="ut-e" x="115" y="288" text-anchor="middle">I used to live in Patna.</text>
          <text class="ut-e" x="320" y="288" text-anchor="middle">I'm used to the heat.</text>
          <text class="ut-e" x="525" y="288" text-anchor="middle">I'm getting used to it.</text>
          <text class="ut-e" x="115" y="310" text-anchor="middle">पहले पटना में रहता था</text>
          <text class="ut-e" x="320" y="310" text-anchor="middle">गर्मी की आदत है</text>
          <text class="ut-e" x="525" y="310" text-anchor="middle">आदत पड़ रही है</text>
        </svg>