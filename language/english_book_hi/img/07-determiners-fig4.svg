<svg viewBox="0 0 660 200" role="img" aria-label="पाँच तस्वीरें: each — एक-एक करके हर एक; every — पूरा group एक साथ; both — दो के दो; either — दो में से कोई एक; neither — दो में से कोई नहीं।" xmlns="http://www.w3.org/2000/svg"><title>&quot;both&quot; के अलावा सब singular noun लेते हैं। &quot;all&quot; तीन या ज़्यादा के लिए — all students, all water।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .eg-dot { fill: var(--role-noun); }
              .eg-ring { fill: none; stroke: var(--role-noun); stroke-width: 2; }
              .eg-grp { fill: none; stroke: var(--accent); stroke-width: 2; }
              .eg-tick { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
              .eg-x { fill: none; stroke: var(--text-soft); stroke-width: 2.2; stroke-linecap: round; }
              .eg-w { font: 800 15px var(--font); fill: var(--text); }
              .eg-g { font: 500 11px var(--font); fill: var(--text-soft); }
              .eg-r { font: 700 10.5px var(--font); fill: var(--role-noun); }
            </style>
          </defs>

          <!-- each -->
          <circle class="eg-dot" cx="36" cy="80" r="9"/>
          <circle class="eg-dot" cx="56" cy="80" r="9"/>
          <circle class="eg-dot" cx="76" cy="80" r="9"/>
          <circle class="eg-dot" cx="96" cy="80" r="9"/>
          <path class="eg-tick" d="M30 100 L42 100 M50 100 L62 100 M70 100 L82 100 M90 100 L102 100"/>
          <text class="eg-w" x="66" y="134" text-anchor="middle">each</text>
          <text class="eg-g" x="66" y="152" text-anchor="middle">हर एक, अलग-अलग</text>
          <text class="eg-r" x="66" y="172" text-anchor="middle">+ singular noun</text>

          <!-- every -->
          <rect class="eg-grp" x="152" y="62" width="92" height="36" rx="18"/>
          <circle class="eg-dot" cx="168" cy="80" r="9"/>
          <circle class="eg-dot" cx="188" cy="80" r="9"/>
          <circle class="eg-dot" cx="208" cy="80" r="9"/>
          <circle class="eg-dot" cx="228" cy="80" r="9"/>
          <text class="eg-w" x="198" y="134" text-anchor="middle">every</text>
          <text class="eg-g" x="198" y="152" text-anchor="middle">हर — पूरा group</text>
          <text class="eg-r" x="198" y="172" text-anchor="middle">+ singular noun</text>

          <!-- both -->
          <rect class="eg-grp" x="296" y="60" width="68" height="40" rx="20"/>
          <circle class="eg-dot" cx="314" cy="80" r="10"/>
          <circle class="eg-dot" cx="346" cy="80" r="10"/>
          <text class="eg-w" x="330" y="134" text-anchor="middle">both</text>
          <text class="eg-g" x="330" y="152" text-anchor="middle">दोनों</text>
          <text class="eg-r" x="330" y="172" text-anchor="middle">+ plural noun</text>

          <!-- either -->
          <circle class="eg-dot" cx="446" cy="80" r="10"/>
          <circle class="eg-ring" cx="478" cy="80" r="10"/>
          <text class="eg-w" x="462" y="134" text-anchor="middle">either</text>
          <text class="eg-g" x="462" y="152" text-anchor="middle">दो में से कोई एक</text>
          <text class="eg-r" x="462" y="172" text-anchor="middle">+ singular noun</text>

          <!-- neither -->
          <circle class="eg-ring" cx="578" cy="80" r="10"/>
          <circle class="eg-ring" cx="610" cy="80" r="10"/>
          <path class="eg-x" d="M562 64 L626 96"/>
          <text class="eg-w" x="594" y="134" text-anchor="middle">neither</text>
          <text class="eg-g" x="594" y="152" text-anchor="middle">दो में से कोई नहीं</text>
          <text class="eg-r" x="594" y="172" text-anchor="middle">+ singular noun</text>
        </svg>