<svg viewBox="0 0 480 230" role="img" aria-label="बाएँ: लोगों के गोले जो गिने जा सकते हैं — fewer people। दाएँ: पानी का glass जो गिना नहीं जा सकता — less water।" xmlns="http://www.w3.org/2000/svg"><title>गोल-गोल लोग गिने जा सकते हैं → fewer। पानी बह जाता है, गिना नहीं जाता → less।</title><style>svg{--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-pron:#0891b2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fl-p { fill: var(--role-noun); }
              .fl-po { fill: var(--accent-line); }
              .fl-gl { fill: none; stroke: var(--text-soft); stroke-width: 2.5; stroke-linejoin: round; }
              .fl-w { fill: var(--role-pron); opacity: 0.55; }
              .fl-t { font: 800 15px var(--font); fill: var(--text); }
              .fl-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .fl-dv { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
            </style>
          </defs>
