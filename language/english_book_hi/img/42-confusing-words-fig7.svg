          <circle class="fl-p" cx="142" cy="40" r="11"/>
          <circle class="fl-p" cx="40" cy="76" r="11"/>
          <circle class="fl-p" cx="74" cy="76" r="11"/>
          <circle class="fl-po" cx="108" cy="76" r="11"/>
          <circle class="fl-po" cx="142" cy="76" r="11"/>
          <circle class="fl-po" cx="40" cy="112" r="11"/>
