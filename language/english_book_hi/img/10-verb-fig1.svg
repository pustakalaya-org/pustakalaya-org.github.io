<svg viewBox="0 0 700 440" role="img" aria-label="Verb के प्रकारों का पेड़ — चार सवाल: काम का या मदद का, object लेता है या नहीं, जोड़ने वाला है या नहीं, और form regular है या irregular" xmlns="http://www.w3.org/2000/svg"><title>Verb को चार सवालों से देखो, एक बँटवारे से नहीं। हर सवाल अलग जानकारी देता है।</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-verb:#0d9488;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .vroot { fill: var(--role-verb); }
              .vrt { font: 800 15px var(--font); fill: #fff; }
              .qq { fill: var(--card); stroke: var(--ink-300); stroke-width: 1.6; }
              .qqt { font: 700 11.5px var(--font); fill: var(--text-soft); }
              .leaf { fill: var(--card); stroke: var(--role-verb); stroke-width: 1.8; }
              .lh { font: 700 12px var(--font); fill: var(--role-verb); }
              .le { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .cn { stroke: var(--ink-300); stroke-width: 1.5; fill: none; }
            </style>
          </defs>

          <rect class="vroot" x="285" y="8" width="130" height="38" rx="19"/>
          <text class="vrt" x="350" y="33" text-anchor="middle">VERB</text>

          <!-- Q1 -->
          <path class="cn" d="M350 46 L350 62 L120 62 L120 78"/>
          <g transform="translate(120 78)">
            <rect class="qq" x="-100" y="0" width="200" height="26" rx="13"/>
            <text class="qqt" x="0" y="18" text-anchor="middle">1. ख़ुद काम है, या मदद?</text>
          </g>
          <path class="cn" d="M120 104 L120 116 L44 116 L44 134"/>
          <path class="cn" d="M120 116 L196 116 L196 134"/>
          <g transform="translate(44 134)">
            <rect class="leaf" x="-40" y="0" width="80" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">MAIN</text>
            <text class="le" x="0" y="34" text-anchor="middle">eat, go</text>
          </g>
          <g transform="translate(196 134)">
            <rect class="leaf" x="-48" y="0" width="96" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">HELPING</text>
            <text class="le" x="0" y="34" text-anchor="middle">is, have, will</text>
          </g>

          <!-- Q2 -->
          <path class="cn" d="M350 46 L350 62 L580 62 L580 78"/>
          <g transform="translate(580 78)">
            <rect class="qq" x="-108" y="0" width="216" height="26" rx="13"/>
            <text class="qqt" x="0" y="18" text-anchor="middle">2. Object लेता है या नहीं?</text>
          </g>
          <path class="cn" d="M580 104 L580 116 L500 116 L500 134"/>
          <path class="cn" d="M580 116 L656 116 L656 134"/>
          <g transform="translate(500 134)">
            <rect class="leaf" x="-56" y="0" width="112" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">TRANSITIVE</text>
            <text class="le" x="0" y="34" text-anchor="middle">eat <tspan font-weight="700">rice</tspan></text>
          </g>
          <g transform="translate(646 134)">
            <rect class="leaf" x="-50" y="0" width="100" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">INTRANS.</text>
            <text class="le" x="0" y="34" text-anchor="middle">sleep, arrive</text>
          </g>

          <!-- Q3 -->
          <path class="cn" d="M350 46 L350 212 L170 212 L170 228"/>
          <g transform="translate(170 228)">
            <rect class="qq" x="-110" y="0" width="220" height="26" rx="13"/>
            <text class="qqt" x="0" y="18" text-anchor="middle">3. काम है, या पुल (link)?</text>
          </g>
          <path class="cn" d="M170 254 L170 266 L86 266 L86 284"/>
          <path class="cn" d="M170 266 L256 266 L256 284"/>
          <g transform="translate(86 284)">
            <rect class="leaf" x="-56" y="0" width="112" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">ACTION</text>
            <text class="le" x="0" y="34" text-anchor="middle">run, build, cut</text>
          </g>
          <g transform="translate(256 284)">
            <rect class="leaf" x="-56" y="0" width="112" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">LINKING</text>
            <text class="le" x="0" y="34" text-anchor="middle">is, seem, taste</text>
          </g>

          <!-- Q4 -->
          <path class="cn" d="M350 46 L350 212 L560 212 L560 228"/>
          <g transform="translate(560 228)">
            <rect class="qq" x="-110" y="0" width="220" height="26" rx="13"/>
            <text class="qqt" x="0" y="18" text-anchor="middle">4. Past में -ed लगता है?</text>
          </g>
          <path class="cn" d="M560 254 L560 266 L480 266 L480 284"/>
          <path class="cn" d="M560 266 L644 266 L644 284"/>
          <g transform="translate(480 284)">
            <rect class="leaf" x="-56" y="0" width="112" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">REGULAR</text>
            <text class="le" x="0" y="34" text-anchor="middle">walk → walked</text>
          </g>
          <g transform="translate(644 284)">
            <rect class="leaf" x="-52" y="0" width="104" height="48" rx="8"/>
            <text class="lh" x="0" y="18" text-anchor="middle">IRREGULAR</text>
            <text class="le" x="0" y="34" text-anchor="middle">go → went</text>
          </g>

          <text class="le" x="350" y="378" text-anchor="middle">चार सवाल, चार अलग जवाब — और एक ही verb चारों लिस्ट में आ सकता है।</text>
          <text class="le" x="350" y="398" text-anchor="middle">जैसे "write": main verb है, transitive है, action है, और irregular भी।</text>
          <text class="le" x="350" y="422" text-anchor="middle">इसलिए "verb का प्रकार" एक नहीं होता — चार होते हैं, साथ-साथ।</text>
        </svg>