<svg viewBox="0 0 700 420" role="img" aria-label="Conjunction के तीन प्रकार — coordinating बराबरी में जोड़ता है, subordinating एक हिस्से को दूसरे पर टिकाता है, और correlative जोड़ी में आता है" xmlns="http://www.w3.org/2000/svg"><title>तीन परिवार: बराबरी में जोड़ने वाले, टिकाने वाले, और जोड़ी में आने वाले।</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-conj:#65a30d;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cbox { fill: var(--card); stroke: var(--role-conj); stroke-width: 2; }
              .cb2 { fill: var(--card); stroke: var(--ink-300); stroke-width: 1.8; }
              .ch { font: 800 13px var(--font); fill: var(--role-conj); }
              .cs { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .ct { font: 700 12px var(--font); fill: var(--text); }
              .link { stroke: var(--role-conj); stroke-width: 3; fill: none; }
              .lnk2 { stroke: var(--role-conj); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
              .cw2 { font: 800 14px var(--font); fill: var(--role-conj); }
              .sect { font: 800 12px var(--font); fill: var(--text); letter-spacing: .04em; }
            </style>
          </defs>

          <!-- 1 coordinating -->
          <text class="sect" x="14" y="22">1. COORDINATING — दोनों बराबर, दोनों अपने पैरों पर खड़े</text>
          <g transform="translate(14 34)">
            <rect class="cb2" x="0" y="0" width="200" height="54" rx="9"/>
            <text class="ct" x="100" y="24" text-anchor="middle">I was tired</text>
            <text class="cs" x="100" y="42" text-anchor="middle">पूरा वाक्य</text>
          </g>
          <line class="link" x1="216" y1="61" x2="268" y2="61"/>
          <g transform="translate(268 44)">
            <rect class="cbox" x="0" y="0" width="76" height="34" rx="17"/>
            <text class="cw2" x="38" y="23" text-anchor="middle">but</text>
          </g>
          <line class="link" x1="346" y1="61" x2="398" y2="61"/>
          <g transform="translate(398 34)">
            <rect class="cb2" x="0" y="0" width="200" height="54" rx="9"/>
            <text class="ct" x="100" y="24" text-anchor="middle">I finished the work</text>
            <text class="cs" x="100" y="42" text-anchor="middle">पूरा वाक्य</text>
          </g>
          <text class="cs" x="14" y="108">FANBOYS — for, and, nor, but, or, yet, so. बीच में comma लगता है।</text>

          <!-- 2 subordinating -->
          <text class="sect" x="14" y="152">2. SUBORDINATING — एक हिस्सा दूसरे पर टिका हुआ, अकेला अधूरा</text>
          <g transform="translate(14 164)">
            <rect class="cb2" x="0" y="0" width="190" height="54" rx="9" stroke-dasharray="6 4"/>
            <text class="ct" x="95" y="24" text-anchor="middle">because it rained</text>
            <text class="cs" x="95" y="42" text-anchor="middle">अकेला अधूरा</text>
          </g>
          <path class="lnk2" d="M204 191 L286 191"/>
          <g transform="translate(286 164)">
            <rect class="cb2" x="0" y="0" width="190" height="54" rx="9"/>
            <text class="ct" x="95" y="24" text-anchor="middle">we stayed home</text>
            <text class="cs" x="95" y="42" text-anchor="middle">पूरा वाक्य</text>
          </g>
          <text class="cs" x="492" y="186">जब ये हिस्सा पहले</text>
          <text class="cs" x="492" y="202">आए तो comma लगता है।</text>
          <text class="cs" x="14" y="238">because, although, if, when, since, unless, while, after, before, so that, than</text>

          <!-- 3 correlative -->
          <text class="sect" x="14" y="282">3. CORRELATIVE — जोड़ी में आते हैं, दोनों हिस्से ज़रूरी</text>
          <g transform="translate(14 294)">
            <rect class="cbox" x="0" y="0" width="92" height="32" rx="16"/>
            <text class="cw2" x="46" y="21" text-anchor="middle">not only</text>
          </g>
          <g transform="translate(116 294)">
            <rect class="cb2" x="0" y="0" width="128" height="32" rx="9"/>
            <text class="ct" x="64" y="21" text-anchor="middle">sang</text>
          </g>
          <g transform="translate(254 294)">
            <rect class="cbox" x="0" y="0" width="92" height="32" rx="16"/>
            <text class="cw2" x="46" y="21" text-anchor="middle">but also</text>
          </g>
          <g transform="translate(356 294)">
            <rect class="cb2" x="0" y="0" width="128" height="32" rx="9"/>
            <text class="ct" x="64" y="21" text-anchor="middle">danced</text>
          </g>
          <path class="lnk2" d="M60 290 C110 258, 270 258, 300 290"/>
          <text class="cs" x="14" y="350">either…or · neither…nor · both…and · not only…but also · whether…or · no sooner…than</text>
          <text class="cs" x="14" y="372">पक्का नियम: दोनों तरफ़ एक ही तरह का हिस्सा आना चाहिए — verb के सामने verb, noun के सामने noun।</text>
          <text class="cs" x="14" y="398">✓ not only sang but also danced &#160;&#160; ✗ not only sang but also a dancer</text>
        </svg>