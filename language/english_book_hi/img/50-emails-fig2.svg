<svg viewBox="0 0 680 300" role="img" aria-label="Formality की सीढ़ी: सबसे नीचे दोस्त को WhatsApp, फिर colleague को message, teammate को ईमेल, boss या client को ईमेल, और सबसे ऊपर formal letter या application, हर एक की greeting के साथ" xmlns="http://www.w3.org/2000/svg"><title>जितना ऊपर जाओगे, उतने कम emoji, कम contractions और ज़्यादा पूरे वाक्य।</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fl-s1 { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent-line); stroke-width: 1.5; }
              .fl-s2 { fill: var(--accent); fill-opacity: 0.14; stroke: var(--accent-line); stroke-width: 1.5; }
              .fl-s3 { fill: var(--accent); fill-opacity: 0.2; stroke: var(--accent-line); stroke-width: 1.5; }
              .fl-s4 { fill: var(--accent); fill-opacity: 0.28; stroke: var(--accent); stroke-width: 1.5; }
              .fl-s5 { fill: var(--accent); fill-opacity: 0.36; stroke: var(--accent); stroke-width: 1.5; }
              .fl-ar { fill: none; stroke: var(--accent-2); stroke-width: 2.2; stroke-dasharray: 7 6; }
              .fl-h { font: 800 11.5px var(--font); fill: var(--text); }
              .fl-g { font: 600 11.5px var(--font); fill: var(--accent-ink); }
              .fl-k { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.06em; }
            </style>
            <marker id="fl-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>

          <rect class="fl-s1" x="16" y="226" width="124" height="54" rx="8"/>
          <rect class="fl-s2" x="146" y="186" width="124" height="94" rx="8"/>
          <rect class="fl-s3" x="276" y="146" width="124" height="134" rx="8"/>
          <rect class="fl-s4" x="406" y="106" width="124" height="174" rx="8"/>
          <rect class="fl-s5" x="536" y="66" width="128" height="214" rx="8"/>

          <text class="fl-h" x="78" y="248" text-anchor="middle">WhatsApp — दोस्त</text>
          <text class="fl-g" x="78" y="268" text-anchor="middle">"Hey! 😄"</text>

          <text class="fl-h" x="208" y="208" text-anchor="middle">Message — colleague</text>
          <text class="fl-g" x="208" y="228" text-anchor="middle">"Hi Rahul"</text>

          <text class="fl-h" x="338" y="168" text-anchor="middle">Email — teammate</text>
          <text class="fl-g" x="338" y="188" text-anchor="middle">"Hi Priya,"</text>

          <text class="fl-h" x="468" y="128" text-anchor="middle">Email — boss / client</text>
          <text class="fl-g" x="468" y="148" text-anchor="middle">"Dear Mr Sharma,"</text>

          <text class="fl-h" x="600" y="88" text-anchor="middle">Formal letter</text>
          <text class="fl-g" x="600" y="108" text-anchor="middle">"Dear Sir or Madam,"</text>

          <path class="fl-ar" d="M40 200 L560 40" marker-end="url(#fl-m)"/>
          <text class="fl-k" x="230" y="112" transform="rotate(-17 230 112)">ज़्यादा formal</text>
        </svg>