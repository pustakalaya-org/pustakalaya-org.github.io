<svg viewBox="0 0 610 222" role="img" aria-label="एक इंसान के पास वाली चीज़ के लिए this (एक) और these (कई); दूर वाली चीज़ के लिए that (एक) और those (कई)।" xmlns="http://www.w3.org/2000/svg"><title>ऊपर की लाइन एक चीज़ के लिए, नीचे की लाइन कई चीज़ों के लिए। बाएँ पास, दाएँ दूर।</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dm-man { fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; }
              .dm-cell { fill: var(--sheet); stroke-width: 2; }
              .dm-w { font: 800 16px var(--font); }
              .dm-g { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .dm-hd { font: 800 12px var(--font); fill: var(--text); letter-spacing: .04em; }
              .dm-ax { fill: none; stroke: var(--accent); stroke-width: 2; }
            </style>
            <marker id="dmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>

          <circle class="dm-man" cx="50" cy="104" r="12"/>
          <path class="dm-man" d="M50 116 L50 156 M30 132 L70 132 M50 156 L36 188 M50 156 L64 188"/>

          <path class="dm-ax" d="M110 30 L556 30" marker-end="url(#dmArrow)"/>
          <text class="dm-hd" x="210" y="56" text-anchor="middle">पास (near)</text>
          <text class="dm-hd" x="450" y="56" text-anchor="middle">दूर (far)</text>

          <rect class="dm-cell" x="110" y="66" width="200" height="62" rx="10" stroke="var(--role-adj)"/>
          <text class="dm-w" x="210" y="95" text-anchor="middle" fill="var(--role-adj)">this book</text>
          <text class="dm-g" x="210" y="115" text-anchor="middle">यह किताब</text>

          <rect class="dm-cell" x="350" y="66" width="200" height="62" rx="10" stroke="var(--role-adj)"/>
          <text class="dm-w" x="450" y="95" text-anchor="middle" fill="var(--role-adj)">that book</text>
          <text class="dm-g" x="450" y="115" text-anchor="middle">वह किताब</text>

          <rect class="dm-cell" x="110" y="142" width="200" height="62" rx="10" stroke="var(--role-noun)"/>
          <text class="dm-w" x="210" y="171" text-anchor="middle" fill="var(--role-noun)">these books</text>
          <text class="dm-g" x="210" y="191" text-anchor="middle">ये किताबें</text>

          <rect class="dm-cell" x="350" y="142" width="200" height="62" rx="10" stroke="var(--role-noun)"/>
          <text class="dm-w" x="450" y="171" text-anchor="middle" fill="var(--role-noun)">those books</text>
          <text class="dm-g" x="450" y="191" text-anchor="middle">वे किताबें</text>

          <text class="dm-hd" x="582" y="102" text-anchor="middle">एक</text>
          <text class="dm-hd" x="582" y="178" text-anchor="middle">कई</text>
        </svg>