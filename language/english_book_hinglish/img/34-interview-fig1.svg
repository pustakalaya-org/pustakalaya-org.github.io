<svg viewBox="0 0 680 330" role="img" aria-label="Apna introduction ka teen hisson ka saancha: pehle vartamaan kaam, phir pichhla anubhav, phir aage ka lakshya, teeno ka waqt dikhaya gaya hai" xmlns="http://www.w3.org/2000/svg"><title>Yahi saancha har interview me chalta hai — fresher ho ya 10 saal ka anubhav.
        Sirf andar ka maal badalta hai, dhaancha wahi rehta hai.</title><style>svg{--brand-500:#f97316;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--ink-300:#cbd5e1;--role-noun:#2563eb;--role-prep:#ea580c;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .bx3 { fill: var(--sheet); stroke-width: 2.4; }
              .p1 { stroke: var(--role-noun); }
              .p2 { stroke: var(--role-verb); }
              .p3 { stroke: var(--brand-500); }
              .num3 { font: 800 26px var(--font); }
              .ttl3 { font: 800 14px var(--font); fill: var(--text); }
              .bd { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .sec { font: 700 11px var(--font); fill: var(--text-soft); }
              .arr3 { stroke: var(--ink-300); stroke-width: 2.4; fill: none; marker-end: url(#a3); }
              .tbar { fill: var(--ink-200); }
              .tfill { fill: var(--brand-500); }
              .hd6 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
              .ex3 { font: italic 600 11.5px var(--font); fill: var(--role-prep); }
            </style>
            <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-300)"/>
            </marker>
          </defs>

          <text class="hd6" x="12" y="18">"TELL ME ABOUT YOURSELF" — 45 SECOND KA NAKSHA</text>

          <!-- card 1 -->
          <rect class="bx3 p1" x="12" y="34" width="206" height="150" rx="12"/>
          <text class="num3" x="30" y="70" fill="var(--role-noun)">1</text>
          <text class="ttl3" x="62" y="68">ABHI</text>
          <text class="bd" x="30" y="94">Aaj aap kya karte hain —</text>
          <text class="bd" x="30" y="111">kaam, role, kahan.</text>
          <text class="ex3" x="30" y="138">"I'm a support</text>
          <text class="ex3" x="30" y="154">engineer at a</text>
          <text class="ex3" x="30" y="170">telecom company."</text>

          <path class="arr3" d="M222 110 L 246 110"/>

          <!-- card 2 -->
          <rect class="bx3 p2" x="250" y="34" width="190" height="150" rx="12"/>
          <text class="num3" x="268" y="70" fill="var(--role-verb)">2</text>
          <text class="ttl3" x="300" y="68">PEHLE</text>
          <text class="bd" x="268" y="94">Kitna anubhav, kya</text>
          <text class="bd" x="268" y="111">khaas kiya — ek example.</text>
          <text class="ex3" x="268" y="138">"Before that I</text>
          <text class="ex3" x="268" y="154">handled billing</text>
          <text class="ex3" x="268" y="170">for three years."</text>

          <path class="arr3" d="M444 110 L 468 110"/>

          <!-- card 3 -->
          <rect class="bx3 p3" x="472" y="34" width="196" height="150" rx="12"/>
          <text class="num3" x="490" y="70" fill="var(--brand-600)">3</text>
          <text class="ttl3" x="522" y="68">AAGE</text>
          <text class="bd" x="490" y="94">Ab kya chahte hain —</text>
          <text class="bd" x="490" y="111">aur isi naukri se kyun.</text>
          <text class="ex3" x="490" y="138">"Now I'm looking</text>
          <text class="ex3" x="490" y="154">for a role with</text>
          <text class="ex3" x="490" y="170">more client work."</text>

          <!-- time bar -->
          <text class="hd6" x="12" y="222">WAQT KA BATWARA</text>
          <rect class="tbar" x="12" y="234" width="656" height="26" rx="8"/>
          <rect class="tfill" x="12" y="234" width="200" height="26" rx="8"/>
          <rect class="tfill" x="216" y="234" width="186" height="26" rx="8" opacity="0.72"/>
          <rect class="tfill" x="406" y="234" width="262" height="26" rx="8" opacity="0.45"/>
          <text class="sec" x="24" y="252">~15 sec</text>
          <text class="sec" x="228" y="252">~15 sec</text>
          <text class="sec" x="418" y="252">~15 sec</text>

          <text class="bd" x="12" y="288">Kul 45 second. Ismein apna gaon, parivaar, hobby ya school ka naam nahi aata —</text>
          <text class="bd" x="12" y="306">wo tab batana jab poochha jaaye. Teen hisse, teen-chaar vaakya, phir chup.</text>
          <text class="bd" x="12" y="324">Teesra hissa sabse zaroori hai: yahi batata hai ki aap yahan kyun baithe hain.</text>
        </svg>