<svg viewBox="0 0 480 220" role="img" aria-label="Baayein: then ki timeline — pehle breakfast, then office. Daayein: than ki tulna — do bar, Ravi lamba hai Amit se." xmlns="http://www.w3.org/2000/svg"><title>Samay ki line par &quot;then&quot;, taraazu par &quot;than&quot;.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tt-ln { fill: none; stroke: var(--accent-line); stroke-width: 3; marker-end: url(#tt-ar); }
              .tt-d { fill: var(--accent); }
              .tt-b1 { fill: var(--accent); }
              .tt-b2 { fill: var(--accent-2); }
              .tt-base { fill: none; stroke: var(--accent-line); stroke-width: 2; }
              .tt-k { font: 800 15px var(--font); fill: var(--accent); }
              .tt-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .tt-c { font: 700 13px var(--font); fill: var(--text); }
              .tt-e { font: italic 500 13px var(--font); fill: var(--text); }
            </style>
            <marker id="tt-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>
          <path class="tt-ln" d="M16 96 L222 96"/>
          <circle class="tt-d" cx="44" cy="96" r="8"/>
          <circle class="tt-d" cx="186" cy="96" r="8"/>
          <text class="tt-s" x="44" y="124" text-anchor="middle">breakfast</text>
          <text class="tt-s" x="186" y="124" text-anchor="middle">office</text>
          <text class="tt-k" x="115" y="84" text-anchor="middle">then →</text>
          <text class="tt-c" x="115" y="30" text-anchor="middle">thEn = timE</text>
          <text class="tt-s" x="115" y="48" text-anchor="middle">(phir, uske baad, tab)</text>

          <path class="tt-base" d="M262 120 L466 120"/>
          <rect class="tt-b1" x="300" y="56" width="50" height="64" rx="4"/>
          <rect class="tt-b2" x="388" y="84" width="50" height="36" rx="4"/>
          <text class="tt-s" x="325" y="138" text-anchor="middle">Ravi</text>
          <text class="tt-s" x="413" y="138" text-anchor="middle">Amit</text>
          <text class="tt-c" x="364" y="30" text-anchor="middle">thAn = compArison</text>
          <text class="tt-s" x="364" y="48" text-anchor="middle">(se zyada / se kam)</text>

          <text class="tt-e" x="16" y="180">We had breakfast, then we left.</text>
          <text class="tt-e" x="262" y="180">Ravi is taller than Amit.</text>
          <text class="tt-s" x="16" y="206">Comparison (-er, more, less, rather) ke baad hamesha "than".</text>
        </svg>