<svg viewBox="0 0 680 360" role="img" aria-label="Determiner chunne ka ped. Noun gin sakte ho? Haan — countable: ek ho to a/an, each, every, this, that, either, neither; kai ho to many, several, a few, few, fewer, these, those, both. Nahi — uncountable: much, a little, little, less, this, that. Dono ke saath: some, any, all, enough, no, a lot of, the, my." xmlns="http://www.w3.org/2000/svg"><title>Pehle poochho &quot;gin sakte ho?&quot;, phir &quot;ek ya kai?&quot; — determiner apne aap mil jaayega.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dt-root { fill: var(--accent); }
              .dt-rt { font: 800 14px var(--font); fill: #fff; }
              .dt-q { fill: var(--sheet); stroke: var(--text-soft); stroke-width: 1.6; }
              .dt-qt { font: 700 12.5px var(--font); fill: var(--text); }
              .dt-leaf { fill: var(--sheet); stroke-width: 2; }
              .dt-lh { font: 800 12px var(--font); }
              .dt-lw { font: 600 12px var(--font); fill: var(--text); }
              .dt-cn { fill: none; stroke: var(--text-soft); stroke-width: 1.6; }
              .dt-band { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.8; stroke-dasharray: 5 4; }
              .dt-bt { font: 600 11.5px var(--font); fill: var(--text); }
            </style>
          </defs>

          <rect class="dt-root" x="280" y="10" width="120" height="34" rx="17"/>
          <text class="dt-rt" x="340" y="32" text-anchor="middle">NOUN</text>
          <path class="dt-cn" d="M340 44 L340 60"/>
          <rect class="dt-q" x="240" y="60" width="200" height="30" rx="15"/>
          <text class="dt-qt" x="340" y="80" text-anchor="middle">Gin sakte ho?</text>

          <path class="dt-cn" d="M340 90 L340 104 L170 104 L170 118"/>
          <path class="dt-cn" d="M340 104 L540 104 L540 118"/>

          <rect class="dt-q" x="90" y="118" width="160" height="28" rx="14" stroke="var(--role-noun)"/>
          <text class="dt-qt" x="170" y="137" text-anchor="middle" fill="var(--role-noun)">Haan → countable</text>
          <rect class="dt-q" x="450" y="118" width="180" height="28" rx="14" stroke="var(--role-adj)"/>
          <text class="dt-qt" x="540" y="137" text-anchor="middle" fill="var(--role-adj)">Nahi → uncountable</text>

          <path class="dt-cn" d="M170 146 L170 158 L90 158 L90 172"/>
          <path class="dt-cn" d="M170 158 L255 158 L255 172"/>
          <path class="dt-cn" d="M540 146 L540 172"/>

          <rect class="dt-leaf" x="20" y="172" width="140" height="120" rx="10" stroke="var(--role-noun)"/>
          <text class="dt-lh" x="90" y="193" text-anchor="middle" fill="var(--role-noun)">EK (singular)</text>
          <text class="dt-lw" x="90" y="216" text-anchor="middle">a / an</text>
          <text class="dt-lw" x="90" y="236" text-anchor="middle">each, every</text>
          <text class="dt-lw" x="90" y="256" text-anchor="middle">this, that</text>
          <text class="dt-lw" x="90" y="276" text-anchor="middle">either, neither</text>

          <rect class="dt-leaf" x="180" y="172" width="150" height="120" rx="10" stroke="var(--role-noun)"/>
          <text class="dt-lh" x="255" y="193" text-anchor="middle" fill="var(--role-noun)">KAI (plural)</text>
          <text class="dt-lw" x="255" y="216" text-anchor="middle">many, several</text>
          <text class="dt-lw" x="255" y="236" text-anchor="middle">a few, few, fewer</text>
          <text class="dt-lw" x="255" y="256" text-anchor="middle">these, those</text>
          <text class="dt-lw" x="255" y="276" text-anchor="middle">both</text>

          <rect class="dt-leaf" x="440" y="172" width="200" height="120" rx="10" stroke="var(--role-adj)"/>
          <text class="dt-lh" x="540" y="193" text-anchor="middle" fill="var(--role-adj)">DHER (bina ginti)</text>
          <text class="dt-lw" x="540" y="216" text-anchor="middle">much</text>
          <text class="dt-lw" x="540" y="236" text-anchor="middle">a little, little, less</text>
          <text class="dt-lw" x="540" y="256" text-anchor="middle">this, that</text>
          <text class="dt-lw" x="540" y="276" text-anchor="middle">water, advice, work…</text>

          <rect class="dt-band" x="20" y="308" width="620" height="40" rx="10"/>
          <text class="dt-bt" x="330" y="333" text-anchor="middle">Dono ke saath chalte hain: some · any · all · enough · no · a lot of · the · my / your / their</text>
        </svg>