<svg viewBox="0 0 680 330" role="img" aria-label="Do bolne ke tareekon ki tulna: oopar wali patti fillers se bhari hui, neeche wali patti saaf chuppi aur ek sochne wale phrase ke saath" xmlns="http://www.w3.org/2000/svg"><title>Dono baat me waqt lagbhag barabar laga. Farq sirf ye hai ki doosri me khaali jagah chuppi aur ek taiyaar phrase ne bhari, &quot;um&quot; ne nahi.</title><style>svg{--bad:#be123c;--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sp { fill: var(--brand-500); }
              .fl2 { fill: var(--bad); opacity: 0.75; }
              .si { fill: none; stroke: var(--ink-300); stroke-width: 2; stroke-dasharray: 5 4; }
              .ph { fill: var(--role-verb); }
              .tx { font: 600 11.5px var(--font); fill: var(--text); }
              .txw { font: 700 11.5px var(--font); fill: var(--sheet); }
              .ttl2 { font: 800 13px var(--font); fill: var(--text); }
              .nt { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .lgt { font: 600 11.5px var(--font); fill: var(--text-soft); }
              .ax { font: 700 11px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="ax" x="12" y="18">WAQT —→</text>

          <!-- ROW A : filler-heavy -->
          <text class="ttl2" x="12" y="48">A. Filler se bhari baat</text>
          <g transform="translate(12 58)">
            <rect class="sp" x="0" y="0" width="58" height="30" rx="5"/>
            <text class="txw" x="29" y="20" text-anchor="middle">So I</text>
            <rect class="fl2" x="62" y="0" width="74" height="30" rx="5"/>
            <text class="txw" x="99" y="20" text-anchor="middle">ummm</text>
            <rect class="sp" x="140" y="0" width="76" height="30" rx="5"/>
            <text class="txw" x="178" y="20" text-anchor="middle">I think</text>
            <rect class="fl2" x="220" y="0" width="92" height="30" rx="5"/>
            <text class="txw" x="266" y="20" text-anchor="middle">basically</text>
            <rect class="fl2" x="316" y="0" width="60" height="30" rx="5"/>
            <text class="txw" x="346" y="20" text-anchor="middle">like</text>
            <rect class="sp" x="380" y="0" width="100" height="30" rx="5"/>
            <text class="txw" x="430" y="20" text-anchor="middle">we should</text>
            <rect class="fl2" x="484" y="0" width="82" height="30" rx="5"/>
            <text class="txw" x="525" y="20" text-anchor="middle">matlab</text>
            <rect class="sp" x="570" y="0" width="86" height="30" rx="5"/>
            <text class="txw" x="613" y="20" text-anchor="middle">wait</text>
          </g>
          <text class="nt" x="12" y="112">Aadhi baat filler hai. Sunne wala thak jaata hai aur asli baat kho jaati hai.</text>

          <!-- ROW B : clean -->
          <text class="ttl2" x="12" y="162">B. Chuppi aur sochne wale phrase ke saath</text>
          <g transform="translate(12 172)">
            <rect class="sp" x="0" y="0" width="96" height="30" rx="5"/>
            <text class="txw" x="48" y="20" text-anchor="middle">I think</text>
            <rect class="si" x="100" y="0" width="52" height="30" rx="5"/>
            <text class="tx" x="126" y="20" text-anchor="middle">⏸</text>
            <rect class="ph" x="156" y="0" width="186" height="30" rx="5"/>
            <text class="txw" x="249" y="20" text-anchor="middle">let me put it this way</text>
            <rect class="si" x="346" y="0" width="52" height="30" rx="5"/>
            <text class="tx" x="372" y="20" text-anchor="middle">⏸</text>
            <rect class="sp" x="402" y="0" width="254" height="30" rx="5"/>
            <text class="txw" x="529" y="20" text-anchor="middle">we should wait one more week</text>
          </g>
          <text class="nt" x="12" y="226">Utna hi waqt laga — par baat saaf hai, aur bolne wala sochta hua lagta hai, atakta hua nahi.</text>

          <!-- legend -->
          <g transform="translate(12 252)">
            <rect class="sp" x="0" y="0" width="16" height="12" rx="3"/>
            <text class="lgt" x="24" y="11">asli baat</text>
            <rect class="fl2" x="110" y="0" width="16" height="12" rx="3"/>
            <text class="lgt" x="134" y="11">filler — kaat do</text>
            <rect class="ph" x="268" y="0" width="16" height="12" rx="3"/>
            <text class="lgt" x="292" y="11">sochne ka phrase</text>
            <rect class="si" x="432" y="0" width="16" height="12" rx="3"/>
            <text class="lgt" x="456" y="11">chuppi — bharna nahi</text>
          </g>
          <text class="nt" x="12" y="300">Niyam: filler ko chuppi se badlo. Chuppi mushkil lage to ek taiyaar phrase bol do.</text>
          <text class="nt" x="12" y="320">Dono me se kuch bhi "ummmm" se behtar hai.</text>
        </svg>