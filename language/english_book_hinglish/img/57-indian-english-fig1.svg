<svg viewBox="0 0 680 420" role="img" aria-label="Teen column ka naksha: aapki aadat, saamne wale ke dimaag me kya chalta hai, aur kya bolna behtar hai" xmlns="http://www.w3.org/2000/svg"><title>Beech ka column yaad rakho. Saamne wala naraz nahi hota — wo ruk kar sochta hai, aur wahi
        ek pal ka rukna aapki baat ka asar kam karta hai.</title><style>svg{--brand-400:#fb923c;--brand-50:#fff7ed;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--ink-300:#cbd5e1;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .hd { font: 800 11.5px var(--font); }
              .h1c { fill: var(--brand-600); }
              .h2c { fill: var(--warn); }
              .h3c { fill: var(--good); }
              .cellA { fill: var(--brand-50); stroke: var(--brand-400); stroke-width: 1.4; }
              .cellB { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.4; }
              .cellC { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.4; }
              .tx { font: 600 11.5px var(--font); fill: var(--text); }
              .tq { font: 500 11px var(--font); fill: var(--text-soft); }
              .arr { stroke: var(--ink-300); stroke-width: 1.6; fill: none; }
              .arrh { fill: var(--ink-300); }
            </style>
          </defs>

          <text class="hd h1c" x="14" y="18">AAPKI AADAT</text>
          <text class="hd h2c" x="236" y="18">SAAMNE WALE KE DIMAAG ME</text>
          <text class="hd h3c" x="506" y="18">YE BOLO</text>

          <g transform="translate(0 28)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">Myself Ravi.</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Myself… kya? Naam Myself hai</text>
            <text class="tq" x="250" y="33">ya kuch chhoot gaya?"</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="26">I'm Ravi.</text>
          </g>

          <g transform="translate(0 92)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">Please revert back.</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Revert matlab purani haalat</text>
            <text class="tq" x="250" y="33">me jaana… kya waapas karna hai?"</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="26">Please reply.</text>
          </g>

          <g transform="translate(0 156)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">Do the needful.</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Needful kya hai? Mujhe exactly</text>
            <text class="tq" x="250" y="33">kya karna hai, ye to bataya nahi."</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="20">Please approve</text>
            <text class="tx" x="526" y="35">and send it on.</text>
          </g>

          <g transform="translate(0 220)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">Can we prepone it?</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Ye shabd maine kabhi suna hi</text>
            <text class="tq" x="250" y="33">nahi. Pre-pone? Postpone?"</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="20">Can we move it</text>
            <text class="tx" x="526" y="35">up to Monday?</text>
          </g>

          <g transform="translate(0 284)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">I have a doubt.</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Doubt matlab shaq. Isko mujh par</text>
            <text class="tq" x="250" y="33">bharosa nahi hai?"</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="26">I have a question.</text>
          </g>

          <g transform="translate(0 348)">
            <rect class="cellA" x="12" y="0" width="198" height="42" rx="8"/>
            <text class="tx" x="24" y="26">I'm out of station.</text>
            <path class="arr" d="M214 21 L230 21"/><path class="arrh" d="M230 17 l8 4 -8 4 z"/>
            <rect class="cellB" x="240" y="0" width="246" height="42" rx="8"/>
            <text class="tq" x="250" y="18">"Kaunsa station? Petrol pump?</text>
            <text class="tq" x="250" y="33">Railway? Radio station?"</text>
            <path class="arr" d="M490 21 L506 21"/><path class="arrh" d="M506 17 l8 4 -8 4 z"/>
            <rect class="cellC" x="516" y="0" width="152" height="42" rx="8"/>
            <text class="tx" x="526" y="26">I'm out of town.</text>
          </g>
        </svg>