<svg viewBox="0 0 640 210" role="img" aria-label="Leave email ki chaar zaroori cheezein: dates din aur taarikh ke saath, ek line ki wajah, kaam ka intezaam yaani handover, aur aakhir me seedha sawaal" xmlns="http://www.w3.org/2000/svg"><title>Chaaron hon to manager ek line me jawaab de sakta hai. Ek bhi chhoota to sawaal-jawaab shuru.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lv-t { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .lv-c { fill: var(--accent); }
              .lv-n { font: 800 12px var(--font); fill: var(--sheet); }
              .lv-h { font: 800 13px var(--font); fill: var(--text); }
              .lv-s { font: 500 11px var(--font); fill: var(--text-soft); }
              .lv-l { fill: none; stroke: var(--accent-2); stroke-width: 2.2; stroke-dasharray: 2 6; stroke-linecap: round; }
              .lv-k { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.07em; }
            </style>
          </defs>
          <text class="lv-k" x="16" y="22">LEAVE EMAIL KI CHECKLIST</text>
          <path class="lv-l" d="M156 112 H172 M312 112 H328 M468 112 H484"/>

          <rect class="lv-t" x="16" y="44" width="140" height="136" rx="14"/>
          <circle class="lv-c" cx="40" cy="70" r="13"/>
          <text class="lv-n" x="40" y="74" text-anchor="middle">1</text>
          <text class="lv-h" x="30" y="108">Dates</text>
          <text class="lv-s" x="30" y="128">Din + taarikh:</text>
          <text class="lv-s" x="30" y="144">Wed 18 – Fri 20 Nov</text>
          <text class="lv-s" x="30" y="160">kitne din, kab wapas</text>

          <rect class="lv-t" x="172" y="44" width="140" height="136" rx="14"/>
          <circle class="lv-c" cx="196" cy="70" r="13"/>
          <text class="lv-n" x="196" y="74" text-anchor="middle">2</text>
          <text class="lv-h" x="186" y="108">Wajah</text>
          <text class="lv-s" x="186" y="128">Sirf ek line:</text>
          <text class="lv-s" x="186" y="144">"sister's wedding"</text>
          <text class="lv-s" x="186" y="160">poori kahaani nahi</text>

          <rect class="lv-t" x="328" y="44" width="140" height="136" rx="14"/>
          <circle class="lv-c" cx="352" cy="70" r="13"/>
          <text class="lv-n" x="352" y="74" text-anchor="middle">3</text>
          <text class="lv-h" x="342" y="108">Handover</text>
          <text class="lv-s" x="342" y="128">Kaam ka intezaam:</text>
          <text class="lv-s" x="342" y="144">kya pura hoga,</text>
          <text class="lv-s" x="342" y="160">kaun sambhalega</text>

          <rect class="lv-t" x="484" y="44" width="140" height="136" rx="14"/>
          <circle class="lv-c" cx="508" cy="70" r="13"/>
          <text class="lv-n" x="508" y="74" text-anchor="middle">4</text>
          <text class="lv-h" x="498" y="108">Sawaal</text>
          <text class="lv-s" x="498" y="128">Seedhi maang:</text>
          <text class="lv-s" x="498" y="144">"Could you please</text>
          <text class="lv-s" x="498" y="160">confirm…?"</text>
        </svg>