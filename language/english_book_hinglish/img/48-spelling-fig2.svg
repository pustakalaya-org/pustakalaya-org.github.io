<svg viewBox="0 0 640 270" role="img" aria-label="hope shabd ke do raaste: ing lagane par e girta hai aur hoping banta hai, ful lagane par e rehta hai aur hopeful banta hai" xmlns="http://www.w3.org/2000/svg"><title>Ek hi shabd, do raaste. Suffix ka pehla akshar tay karta hai ki e rahega ya jaayega.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .se-w { fill: var(--sheet); stroke: var(--accent); stroke-width: 2.2; }
              .se-a { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.8; }
              .se-l { fill: none; stroke: var(--accent-2); stroke-width: 2.2; }
              .se-big { font: 800 24px var(--font); fill: var(--text); }
              .se-t { font: 700 16px var(--font); fill: var(--text); }
              .se-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .se-k { font: 800 11px var(--font); fill: var(--accent-ink); letter-spacing: 0.05em; }
            </style>
            <marker id="se-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>

          <rect class="se-w" x="30" y="92" width="140" height="66" rx="14"/>
          <text class="se-big" x="100" y="134" text-anchor="middle">hope</text>

          <path class="se-l" d="M170 112 C 230 112, 240 56, 300 56" marker-end="url(#se-ar)"/>
          <text class="se-k" x="196" y="70">+ ing (vowel)</text>
          <rect class="se-a" x="306" y="26" width="310" height="60" rx="12"/>
          <text class="se-t" x="324" y="54">hop<tspan fill="var(--bad)" text-decoration="line-through">e</tspan>ing → hoping</text>
          <text class="se-s" x="324" y="74">e gir gaya — vowel se pehle zaroorat nahi</text>

          <path class="se-l" d="M170 138 C 230 138, 240 194, 300 194" marker-end="url(#se-ar)"/>
          <text class="se-k" x="186" y="190">+ ful (consonant)</text>
          <rect class="se-a" x="306" y="164" width="310" height="60" rx="12"/>
          <text class="se-t" x="324" y="192">hope + ful → hopeful</text>
          <text class="se-s" x="324" y="212">e bacha raha — consonant se pehle zaroori hai</text>

          <text class="se-s" x="320" y="256" text-anchor="middle">Dhyan do: hop + ing = hopping (kood rahe) · hope + ing = hoping (ummeed)</text>
        </svg>