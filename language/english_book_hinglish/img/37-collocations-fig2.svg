<svg viewBox="0 0 480 330" role="img" aria-label="Do dabbe. Make wale dabbe me: a decision, a mistake, a plan, money, a noise, friends, an effort, a phone call. Do wale dabbe me: homework, the dishes, business, your best, a favour, exercise, research, the shopping." xmlns="http://www.w3.org/2000/svg"><title>Make ke baad aksar kuch nikalta hai — faisla, paisa, aawaaz, dost. Do ke baad koi kaam hota hai jo nipataana hai.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .md-bm { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .md-bd { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .md-c { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .md-h { font: 800 20px var(--font); fill: var(--accent); }
              .md-h2 { font: 800 20px var(--font); fill: var(--accent-2); }
              .md-s { font: 600 12px var(--font); fill: var(--text-soft); }
              .md-w { font: 600 13px var(--font); fill: var(--text); }
            </style>
          </defs>
          <rect class="md-bm" x="6" y="10" width="230" height="312" rx="14"/>
          <text class="md-h" x="22" y="42">MAKE</text>
          <text class="md-s" x="22" y="62">kuch naya banana / paida karna</text>
          <rect class="md-c" x="18" y="80" width="100" height="34" rx="8"/><text class="md-w" x="68" y="102" text-anchor="middle">a decision</text>
          <rect class="md-c" x="124" y="80" width="100" height="34" rx="8"/><text class="md-w" x="174" y="102" text-anchor="middle">a mistake</text>
          <rect class="md-c" x="18" y="140" width="100" height="34" rx="8"/><text class="md-w" x="68" y="162" text-anchor="middle">a plan</text>
          <rect class="md-c" x="124" y="140" width="100" height="34" rx="8"/><text class="md-w" x="174" y="162" text-anchor="middle">money</text>
          <rect class="md-c" x="18" y="200" width="100" height="34" rx="8"/><text class="md-w" x="68" y="222" text-anchor="middle">a noise</text>
          <rect class="md-c" x="124" y="200" width="100" height="34" rx="8"/><text class="md-w" x="174" y="222" text-anchor="middle">friends</text>
          <rect class="md-c" x="18" y="260" width="100" height="34" rx="8"/><text class="md-w" x="68" y="282" text-anchor="middle">an effort</text>
          <rect class="md-c" x="124" y="260" width="100" height="34" rx="8"/><text class="md-w" x="174" y="282" text-anchor="middle">a phone call</text>

          <rect class="md-bd" x="244" y="10" width="230" height="312" rx="14"/>
          <text class="md-h2" x="260" y="42">DO</text>
          <text class="md-s" x="260" y="62">kaam, duty, koi kriya</text>
          <rect class="md-c" x="256" y="80" width="100" height="34" rx="8"/><text class="md-w" x="306" y="102" text-anchor="middle">homework</text>
          <rect class="md-c" x="362" y="80" width="100" height="34" rx="8"/><text class="md-w" x="412" y="102" text-anchor="middle">the dishes</text>
          <rect class="md-c" x="256" y="140" width="100" height="34" rx="8"/><text class="md-w" x="306" y="162" text-anchor="middle">business</text>
          <rect class="md-c" x="362" y="140" width="100" height="34" rx="8"/><text class="md-w" x="412" y="162" text-anchor="middle">your best</text>
          <rect class="md-c" x="256" y="200" width="100" height="34" rx="8"/><text class="md-w" x="306" y="222" text-anchor="middle">a favour</text>
          <rect class="md-c" x="362" y="200" width="100" height="34" rx="8"/><text class="md-w" x="412" y="222" text-anchor="middle">exercise</text>
          <rect class="md-c" x="256" y="260" width="100" height="34" rx="8"/><text class="md-w" x="306" y="282" text-anchor="middle">research</text>
          <rect class="md-c" x="362" y="260" width="100" height="34" rx="8"/><text class="md-w" x="412" y="282" text-anchor="middle">the shopping</text>
        </svg>