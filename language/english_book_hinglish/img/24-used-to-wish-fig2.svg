<svg viewBox="0 0 640 300" role="img" aria-label="Wish ki timeline: beete kal ka afsos wish plus had V3, abhi ki ichchha wish plus past simple, doosron se shikayat wish plus would." xmlns="http://www.w3.org/2000/svg"><title>Jitna peeche ka afsos, utna peeche ka tense. Abhi ki ichchha → past simple; beete kal ka
        afsos → past perfect; doosron se chidh → would.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .w-ax { fill: none; stroke: var(--line-strong); stroke-width: 3; marker-end: url(#w-ar); }
              .w-now { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 5 5; }
              .w-dot { fill: var(--accent); }
              .w-card { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .w-h { font: 800 13px var(--font); fill: var(--accent); letter-spacing: .04em; }
              .w-f { font: 800 15px var(--font); fill: var(--role-verb); }
              .w-e { font: 600 13px var(--font); fill: var(--text); }
              .w-g { font: italic 500 12px var(--font); fill: var(--text-soft); }
              .w-l { font: 700 13px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="w-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong)"/>
            </marker>
          </defs>

          <text class="w-h" x="115" y="30" text-anchor="middle">AFSOS (BEETA KAL)</text>
          <text class="w-h" x="320" y="30" text-anchor="middle">ABHI KI ICHCHHA</text>
          <text class="w-h" x="525" y="30" text-anchor="middle">SHIKAYAT / BADLAAV</text>

          <path class="w-ax" d="M24 70 L620 70"/>
          <line class="w-now" x1="320" y1="46" x2="320" y2="94"/>
          <circle class="w-dot" cx="115" cy="70" r="7"/>
          <circle class="w-dot" cx="320" cy="70" r="7"/>
          <circle class="w-dot" cx="525" cy="70" r="7"/>
          <text class="w-l" x="30" y="100">past</text>
          <text class="w-l" x="320" y="112" text-anchor="middle">NOW</text>
          <text class="w-l" x="612" y="100" text-anchor="end">future</text>

          <rect class="w-card" x="20" y="130" width="190" height="140" rx="12"/>
          <text class="w-f" x="115" y="162" text-anchor="middle">wish + had + V3</text>
          <text class="w-e" x="115" y="196" text-anchor="middle">I wish I had studied.</text>
          <text class="w-g" x="115" y="220" text-anchor="middle">kaash maine padhai</text>
          <text class="w-g" x="115" y="238" text-anchor="middle">ki hoti</text>

          <rect class="w-card" x="225" y="130" width="190" height="140" rx="12"/>
          <text class="w-f" x="320" y="162" text-anchor="middle">wish + V2 / were</text>
          <text class="w-e" x="320" y="196" text-anchor="middle">I wish I knew.</text>
          <text class="w-g" x="320" y="220" text-anchor="middle">kaash mujhe pata hota</text>
          <text class="w-g" x="320" y="238" text-anchor="middle">(par nahi pata)</text>

          <rect class="w-card" x="430" y="130" width="190" height="140" rx="12"/>
          <text class="w-f" x="525" y="162" text-anchor="middle">wish + would + V1</text>
          <text class="w-e" x="525" y="196" text-anchor="middle">I wish he would call.</text>
          <text class="w-g" x="525" y="220" text-anchor="middle">kaash wo call kare!</text>
          <text class="w-g" x="525" y="238" text-anchor="middle">(doosre ka rawaiya)</text>
        </svg>