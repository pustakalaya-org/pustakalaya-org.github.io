<svg viewBox="0 0 640 380" role="img" aria-label="Do phone: baayein phone me sirf Hi sir bheja gaya, do ghante koi jawaab nahi, phir adhoori baat; daayein phone me ek hi message me poori baat aur turant jawaab" xmlns="http://www.w3.org/2000/svg"><title>Baayein: chaar message, do ghante, phir bhi adhoori baat. Daayein: ek message, poori baat.</title><style>svg{--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--line:#e3e7ef;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-faint:#6b7385;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .wa-ph { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
              .wa-top { fill: var(--sheet-2); }
              .wa-me { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.2; }
              .wa-them { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1.2; }
              .wa-t { font: 600 11.5px var(--font); fill: var(--text); }
              .wa-s { font: 500 10.5px var(--font); fill: var(--text-faint); }
              .wa-h { font: 800 12px var(--font); fill: var(--text); }
              .wa-bad { fill: var(--bad); }
              .wa-ok { fill: var(--good); }
              .wa-m { font: 800 12px var(--font); fill: var(--sheet); }
            </style>
          </defs>

          <rect class="wa-ph" x="30" y="12" width="250" height="356" rx="26"/>
          <rect class="wa-top" x="32" y="14" width="246" height="40" rx="24"/>
          <text class="wa-h" x="155" y="39" text-anchor="middle">Mr Khanna</text>

          <rect class="wa-me" x="180" y="72" width="84" height="32" rx="12"/>
          <text class="wa-t" x="222" y="92" text-anchor="middle">Hi sir</text>
          <text class="wa-s" x="155" y="130" text-anchor="middle">… 2 ghante baad …</text>
          <rect class="wa-them" x="46" y="146" width="110" height="32" rx="12"/>
          <text class="wa-t" x="101" y="166" text-anchor="middle">Haan, bolo?</text>
          <rect class="wa-me" x="150" y="194" width="114" height="32" rx="12"/>
          <text class="wa-t" x="207" y="214" text-anchor="middle">Sir woh train…</text>
          <rect class="wa-me" x="166" y="234" width="98" height="32" rx="12"/>
          <text class="wa-t" x="215" y="254" text-anchor="middle">late hai sir</text>
          <rect class="wa-them" x="46" y="276" width="150" height="32" rx="12"/>
          <text class="wa-t" x="121" y="296" text-anchor="middle">Kab tak? Slides?</text>
          <circle class="wa-bad" cx="155" cy="338" r="13"/>
          <text class="wa-m" x="155" y="342" text-anchor="middle">✗</text>

          <rect class="wa-ph" x="360" y="12" width="250" height="356" rx="26"/>
          <rect class="wa-top" x="362" y="14" width="246" height="40" rx="24"/>
          <text class="wa-h" x="485" y="39" text-anchor="middle">Mr Khanna</text>

          <rect class="wa-me" x="384" y="72" width="210" height="112" rx="12"/>
          <text class="wa-t" x="398" y="94">Good morning, Mr Khanna.</text>
          <text class="wa-t" x="398" y="112">My train is running 40 min</text>
          <text class="wa-t" x="398" y="130">late, so I will reach by 10:15.</text>
          <text class="wa-t" x="398" y="148">The slides for the 11 am</text>
          <text class="wa-t" x="398" y="166">meeting are in your inbox.</text>
          <rect class="wa-them" x="376" y="200" width="160" height="32" rx="12"/>
          <text class="wa-t" x="456" y="220" text-anchor="middle">Thanks, see you then 👍</text>
          <text class="wa-s" x="485" y="258" text-anchor="middle">… 1 minute me baat khatam</text>
          <circle class="wa-ok" cx="485" cy="338" r="13"/>
          <text class="wa-m" x="485" y="342" text-anchor="middle">✓</text>
        </svg>