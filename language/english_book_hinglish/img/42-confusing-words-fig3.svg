<svg viewBox="0 0 480 320" role="img" aria-label="Chaar khaane: stationary ke saath khadi hui car — A for at rest. Stationery ke saath lifafa aur pen — E for envelope. Principal ke saath ek insaan — principal is your pal. Principle ke saath niyamon ka kaagaz — principle aur rule dono le par khatam." xmlns="http://www.w3.org/2000/svg"><title>Ek akshar, ek tasveer. A = khadi car, E = lifafa, PAL = insaan, LE = rule.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sp-pn { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .sp-car { fill: var(--accent-line); }
              .sp-wh { fill: var(--text-soft); }
              .sp-env { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .sp-fl { fill: none; stroke: var(--accent); stroke-width: 2; }
              .sp-pen { fill: none; stroke: var(--accent-2); stroke-width: 5; stroke-linecap: round; }
              .sp-per { fill: var(--accent-line); }
              .sp-doc { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2; }
              .sp-dl { fill: none; stroke: var(--role-noun); stroke-width: 2; }
              .sp-t { font: 700 15px var(--font); fill: var(--text); }
              .sp-hl { fill: var(--accent); }
              .sp-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .sp-k { font: 700 12.5px var(--font); fill: var(--accent); }
            </style>
          </defs>

          <rect class="sp-pn" x="6" y="6" width="230" height="150" rx="12"/>
          <rect class="sp-car" x="36" y="56" width="50" height="22" rx="6"/>
          <rect class="sp-car" x="22" y="74" width="88" height="28" rx="8"/>
          <circle class="sp-wh" cx="44" cy="104" r="9"/>
          <circle class="sp-wh" cx="90" cy="104" r="9"/>
          <text class="sp-t" x="124" y="66">station<tspan class="sp-hl">a</tspan>ry</text>
          <text class="sp-s" x="124" y="86">ruka hua, chal</text>
          <text class="sp-s" x="124" y="102">nahi raha</text>
          <text class="sp-k" x="20" y="140">A = At rest (khadi car)</text>

          <rect class="sp-pn" x="244" y="6" width="230" height="150" rx="12"/>
          <rect class="sp-env" x="262" y="58" width="80" height="50" rx="4"/>
          <path class="sp-fl" d="M262 58 L302 88 L342 58"/>
          <path class="sp-pen" d="M336 112 L356 46"/>
          <text class="sp-t" x="368" y="66">station<tspan class="sp-hl">e</tspan>ry</text>
          <text class="sp-s" x="368" y="86">pen, paper,</text>
          <text class="sp-s" x="368" y="102">file, lifafa</text>
          <text class="sp-k" x="258" y="140">E = Envelope (lifafa)</text>

          <rect class="sp-pn" x="6" y="164" width="230" height="150" rx="12"/>
          <circle class="sp-per" cx="66" cy="210" r="18"/>
          <ellipse class="sp-per" cx="66" cy="258" rx="32" ry="20"/>
          <text class="sp-t" x="124" y="222">princip<tspan class="sp-hl">al</tspan></text>
          <text class="sp-s" x="124" y="242">pradhan (insaan);</text>
          <text class="sp-s" x="124" y="258">sabse mukhya</text>
          <text class="sp-k" x="20" y="298">The principal is your PAL</text>

          <rect class="sp-pn" x="244" y="164" width="230" height="150" rx="12"/>
          <rect class="sp-doc" x="266" y="190" width="70" height="86" rx="6"/>
          <path class="sp-dl" d="M278 208 L324 208"/>
          <path class="sp-dl" d="M278 224 L324 224"/>
          <path class="sp-dl" d="M278 240 L310 240"/>
          <path class="sp-dl" d="M282 260 L290 268 L306 252"/>
          <text class="sp-t" x="350" y="222">princip<tspan class="sp-hl">le</tspan></text>
          <text class="sp-s" x="350" y="242">usool, siddhant,</text>
          <text class="sp-s" x="350" y="258">niyam</text>
          <text class="sp-k" x="258" y="298">princip-LE = ru-LE</text>
        </svg>