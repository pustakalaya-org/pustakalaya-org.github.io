<svg viewBox="0 0 680 320" role="img" aria-label="Formality ki line jisme casual, neutral aur formal phrases apni jagah par rakhe gaye hain" xmlns="http://www.w3.org/2000/svg"><title>Ek hi baat, teen jagah ke teen roop. Agar pata na ho ki kahan ho — beech wala column bolo.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .axis { stroke: var(--ink-300); stroke-width: 2.5; }
              .tick { stroke: var(--ink-300); stroke-width: 2; }
              .zone { font: 700 13px var(--font); }
              .zc { fill: var(--role-adv); }
              .zn { fill: var(--role-verb); }
              .zf { fill: var(--role-noun); }
              .ph { font: 600 12.5px var(--font); fill: var(--text); }
              .nt { font: 500 11px var(--font); fill: var(--text-soft); }
              .band { opacity: 0.12; }
            </style>
          </defs>

          <rect class="band" x="20" y="34" width="200" height="30" rx="8" fill="var(--role-adv)"/>
          <rect class="band" x="230" y="34" width="210" height="30" rx="8" fill="var(--role-verb)"/>
          <rect class="band" x="450" y="34" width="210" height="30" rx="8" fill="var(--role-noun)"/>

          <text class="zone zc" x="120" y="54" text-anchor="middle">CASUAL</text>
          <text class="zone zn" x="335" y="54" text-anchor="middle">NEUTRAL</text>
          <text class="zone zf" x="555" y="54" text-anchor="middle">FORMAL</text>

          <text class="nt" x="120" y="27" text-anchor="middle">dost, family, WhatsApp</text>
          <text class="nt" x="335" y="27" text-anchor="middle">office, team, client call</text>
          <text class="nt" x="555" y="27" text-anchor="middle">email, interview, likhit</text>

          <line class="axis" x1="20" y1="86" x2="660" y2="86"/>
          <line class="tick" x1="225" y1="78" x2="225" y2="94"/>
          <line class="tick" x1="445" y1="78" x2="445" y2="94"/>

          <!-- tired -->
          <text class="nt" x="20" y="122">thaka hua</text>
          <text class="ph" x="20" y="142">I'm beat</text>
          <text class="ph" x="240" y="142">I'm running on fumes</text>
          <text class="ph" x="460" y="142">I'm exhausted</text>

          <!-- not understanding -->
          <text class="nt" x="20" y="176">samajh nahi aaya</text>
          <text class="ph" x="20" y="196">You've lost me</text>
          <text class="ph" x="240" y="196">I'm not following</text>
          <text class="ph" x="460" y="196">Could you clarify?</text>

          <!-- leaving -->
          <text class="nt" x="20" y="230">nikalna hai</text>
          <text class="ph" x="20" y="250">I'm off</text>
          <text class="ph" x="240" y="250">I should get going</text>
          <text class="ph" x="460" y="250">I'll have to excuse myself</text>

          <!-- mistake -->
          <text class="nt" x="20" y="284">galti ho gayi</text>
          <text class="ph" x="20" y="304">My bad</text>
          <text class="ph" x="240" y="304">I dropped the ball</text>
          <text class="ph" x="460" y="304">I take responsibility</text>
        </svg>