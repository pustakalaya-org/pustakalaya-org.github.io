          <path class="aj-x" d="M250 196 L328 196"/>
          <rect class="aj-no" x="356" y="178" width="110" height="36" rx="18"/><text class="aj-b" x="411" y="201" text-anchor="middle">big</text>
          <path class="aj-x" d="M387 196 L435 196"/>

          <rect class="aj-n" x="10" y="224" width="96" height="36" rx="18"/><text class="aj-w" x="58" y="247" text-anchor="middle">traffic</text>
          <rect class="aj-ok" x="118" y="224" width="104" height="36" rx="18"/><text class="aj-g" x="170" y="247" text-anchor="middle">heavy ✓</text>
          <rect class="aj-no" x="234" y="224" width="110" height="36" rx="18"/><text class="aj-b" x="289" y="247" text-anchor="middle">crowded</text>
          <path class="aj-x" d="M255 242 L323 242"/>
