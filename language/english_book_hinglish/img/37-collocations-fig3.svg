          <rect class="aj-n" x="10" y="270" width="96" height="36" rx="18"/><text class="aj-w" x="58" y="293" text-anchor="middle">sleep</text>
          <rect class="aj-ok" x="118" y="270" width="104" height="36" rx="18"/><text class="aj-g" x="170" y="293" text-anchor="middle">deep ✓</text>
