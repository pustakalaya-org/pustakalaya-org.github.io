<svg viewBox="0 0 480 316" role="img" aria-label="Chhah noun aur unke sahi adjective: heavy rain, strong tea, high fever, high price, heavy traffic, deep sleep. Galat vikalp jaise big rain, big fever, expensive price kaate gaye hain." xmlns="http://www.w3.org/2000/svg"><title>&quot;Expensive price&quot; bahut aam galti hai — price khud mehngi nahi hoti, high hoti hai.
        Cheez expensive hoti hai: an expensive phone .</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-interj:#e11d48;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .aj-n { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .aj-ok { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2.5; }
              .aj-no { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 1.5; }
              .aj-x { fill: none; stroke: var(--role-interj); stroke-width: 2.5; }
              .aj-w { font: 700 14px var(--font); fill: var(--text); }
              .aj-g { font: 700 14px var(--font); fill: var(--role-conj); }
              .aj-b { font: 500 13.5px var(--font); fill: var(--text-soft); }
              .aj-h { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.06em; }
            </style>
          </defs>
          <text class="aj-h" x="58" y="24" text-anchor="middle">NOUN</text>
          <text class="aj-h" x="170" y="24" text-anchor="middle" fill="var(--role-conj)">✓ JAMTA HAI</text>
          <text class="aj-h" x="350" y="24" text-anchor="middle">✗ AJEEB LAGTA HAI</text>

          <rect class="aj-n" x="10" y="40" width="96" height="36" rx="18"/><text class="aj-w" x="58" y="63" text-anchor="middle">rain</text>
          <rect class="aj-ok" x="118" y="40" width="104" height="36" rx="18"/><text class="aj-g" x="170" y="63" text-anchor="middle">heavy ✓</text>
          <rect class="aj-no" x="234" y="40" width="110" height="36" rx="18"/><text class="aj-b" x="289" y="63" text-anchor="middle">big</text>
          <path class="aj-x" d="M265 58 L313 58"/>
          <rect class="aj-no" x="356" y="40" width="110" height="36" rx="18"/><text class="aj-b" x="411" y="63" text-anchor="middle">strong</text>
          <path class="aj-x" d="M381 58 L441 58"/>

          <rect class="aj-n" x="10" y="86" width="96" height="36" rx="18"/><text class="aj-w" x="58" y="109" text-anchor="middle">tea</text>
          <rect class="aj-ok" x="118" y="86" width="104" height="36" rx="18"/><text class="aj-g" x="170" y="109" text-anchor="middle">strong ✓</text>
