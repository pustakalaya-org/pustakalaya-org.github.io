<svg viewBox="0 0 700 400" role="img" aria-label="Active se passive banne ka naksha: active ka object passive ka subject ban jaata hai aur active ka subject by ke peeche chala jaata hai" xmlns="http://www.w3.org/2000/svg"><title>Neela = karne wala (agent). Baingani = jis par kaam hua (object). Passive me baingani aage
        aa jaata hai aur neela &quot;by&quot; ke peeche chala jaata hai.</title><style>svg{--brand-600:#ea580c;--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sb { fill: var(--card); stroke: var(--role-noun); stroke-width: 2; }
              .ob { fill: var(--card); stroke: var(--role-adj); stroke-width: 2; }
              .vbx{ fill: var(--card); stroke: var(--role-verb); stroke-width: 2; }
              .sl { font: 800 9.5px var(--font); letter-spacing: 0.06em; }
              .wt { font: 700 15px var(--font); fill: var(--text); }
              .band { font: 800 12px var(--font); letter-spacing: 0.08em; }
              .sw1 { fill: none; stroke: var(--role-noun); stroke-width: 2.4; stroke-dasharray: 6 4; }
              .sw2 { fill: none; stroke: var(--role-adj); stroke-width: 2.4; stroke-dasharray: 6 4; }
              .note { font: 600 11px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="v1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-noun)"/>
            </marker>
            <marker id="v2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-adj)"/>
            </marker>
          </defs>

          <!-- ACTIVE -->
          <text class="band" x="20" y="34" fill="var(--role-verb)">ACTIVE</text>
          <g transform="translate(20 46)">
            <rect class="sb" x="0" y="0" width="150" height="48" rx="10"/>
            <text class="wt" x="75" y="30" text-anchor="middle">The farmer</text>
            <text class="sl" x="75" y="-6" text-anchor="middle" fill="var(--role-noun)">KARNE WALA</text>

            <rect class="vbx" x="170" y="0" width="140" height="48" rx="10"/>
            <text class="wt" x="240" y="30" text-anchor="middle">grows</text>
            <text class="sl" x="240" y="-6" text-anchor="middle" fill="var(--role-verb)">VERB</text>

            <rect class="ob" x="330" y="0" width="170" height="48" rx="10"/>
            <text class="wt" x="415" y="30" text-anchor="middle">wheat</text>
            <text class="sl" x="415" y="-6" text-anchor="middle" fill="var(--role-adj)">JIS PAR KAAM HUA</text>
          </g>

          <!-- swap arrows -->
          <path class="sw2" d="M435 100 C 400 160, 150 160, 110 212" marker-end="url(#v2)"/>
          <path class="sw1" d="M95 100 C 140 170, 500 170, 540 212" marker-end="url(#v1)"/>
          <text class="note" x="350" y="152" text-anchor="middle">dono apni jagah badal lete hain</text>

          <!-- PASSIVE -->
          <text class="band" x="20" y="236" fill="var(--brand-600)">PASSIVE</text>
          <g transform="translate(20 248)">
            <rect class="ob" x="0" y="0" width="150" height="48" rx="10"/>
            <text class="wt" x="75" y="30" text-anchor="middle">Wheat</text>
            <text class="sl" x="75" y="68" text-anchor="middle" fill="var(--role-adj)">AB YE SUBJECT HAI</text>

            <rect class="vbx" x="170" y="0" width="190" height="48" rx="10"/>
            <text class="wt" x="265" y="30" text-anchor="middle">is grown</text>
            <text class="sl" x="265" y="68" text-anchor="middle" fill="var(--role-verb)">BE + V3</text>

            <rect class="sb" x="380" y="0" width="190" height="48" rx="10"/>
            <text class="wt" x="475" y="30" text-anchor="middle">by the farmer</text>
            <text class="sl" x="475" y="68" text-anchor="middle" fill="var(--role-noun)">BY KE PEECHE</text>
          </g>

          <text class="note" x="350" y="376" text-anchor="middle">Verb hamesha V3 me jaata hai (grow → grown). Tense ka kaam sirf "be" karta hai.</text>
        </svg>