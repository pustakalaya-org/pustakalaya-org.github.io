<svg viewBox="0 0 700 300" role="img" aria-label="Helping verb engine: be, have aur will teen helping verbs kaise verb ke roop se judkar continuous, perfect aur future tense banate hain" xmlns="http://www.w3.org/2000/svg"><title>BE, HAVE aur WILL — teen helping verbs. Inhe jis kram me jodoge, wahi tense banega.
        Kram hamesha ye hi rehta hai: will → have → been → V-ing .</title><style>svg{--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--page-alt:#eef1f6;--role-adj:#9333ea;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .hbox { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.4; }
              .hlab { font: 800 14px var(--font); }
              .hsub { font: 500 11px var(--font); fill: var(--text-soft); }
              .plus { font: 800 18px var(--font); fill: var(--text-soft); }
              .vform { font: 700 14px var(--font); fill: var(--role-verb); }
              .res { font: 700 12.5px var(--font); fill: var(--text); }
            </style>
          </defs>

          <text class="hsub" x="350" y="20" text-anchor="middle">Teen helping verb, teen kaam — bas inhe jodna seekho</text>

          <!-- BE + ing -->
          <g transform="translate(20 42)">
            <rect class="hbox" x="0" y="0" width="128" height="54" rx="9"/>
            <text class="hlab" x="64" y="26" text-anchor="middle" fill="var(--role-pron)">BE</text>
            <text class="hsub" x="64" y="43" text-anchor="middle">am · is · are · was · were</text>
            <text class="plus" x="152" y="34" text-anchor="middle">+</text>
            <rect class="hbox" x="176" y="0" width="96" height="54" rx="9"/>
            <text class="vform" x="224" y="32" text-anchor="middle">V-ing</text>
            <text class="plus" x="296" y="34" text-anchor="middle">=</text>
            <rect class="hbox" x="320" y="0" width="330" height="54" rx="9"/>
            <text class="res" x="336" y="24">CONTINUOUS — kaam chal raha hai</text>
            <text class="hsub" x="336" y="42">She is cooking · She was cooking</text>
          </g>

          <!-- HAVE + V3 -->
          <g transform="translate(20 120)">
            <rect class="hbox" x="0" y="0" width="128" height="54" rx="9"/>
            <text class="hlab" x="64" y="26" text-anchor="middle" fill="var(--role-adj)">HAVE</text>
            <text class="hsub" x="64" y="43" text-anchor="middle">have · has · had</text>
            <text class="plus" x="152" y="34" text-anchor="middle">+</text>
            <rect class="hbox" x="176" y="0" width="96" height="54" rx="9"/>
            <text class="vform" x="224" y="32" text-anchor="middle">V3</text>
            <text class="plus" x="296" y="34" text-anchor="middle">=</text>
            <rect class="hbox" x="320" y="0" width="330" height="54" rx="9"/>
            <text class="res" x="336" y="24">PERFECT — kaam ho chuka</text>
            <text class="hsub" x="336" y="42">She has cooked · She had cooked</text>
          </g>

          <!-- WILL + V1 -->
          <g transform="translate(20 198)">
            <rect class="hbox" x="0" y="0" width="128" height="54" rx="9"/>
            <text class="hlab" x="64" y="26" text-anchor="middle" fill="var(--brand-600)">WILL</text>
            <text class="hsub" x="64" y="43" text-anchor="middle">hamesha will, kabhi wills nahi</text>
            <text class="plus" x="152" y="34" text-anchor="middle">+</text>
            <rect class="hbox" x="176" y="0" width="96" height="54" rx="9"/>
            <text class="vform" x="224" y="32" text-anchor="middle">V1</text>
            <text class="plus" x="296" y="34" text-anchor="middle">=</text>
            <rect class="hbox" x="320" y="0" width="330" height="54" rx="9"/>
            <text class="res" x="336" y="24">FUTURE — aage hoga</text>
            <text class="hsub" x="336" y="42">She will cook · She will have cooked</text>
          </g>

          <text class="hsub" x="350" y="278" text-anchor="middle">Teeno ek saath: will + have + been + V-ing → "She will have been cooking."</text>
        </svg>