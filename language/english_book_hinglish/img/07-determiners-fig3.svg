<svg viewBox="0 0 620 252" role="img" aria-label="Do glass: 'a little water' me thoda paani hai jo kaafi hai, 'little water' me na ke barabar. Do group: 'a few friends' me paanch dost hain, 'few friends' me sirf ek, baaki khaali." xmlns="http://www.w3.org/2000/svg"><title>&quot;a&quot; laga = glass aadha bhara dikh raha hai. &quot;a&quot; hata = glass khaali dikh raha hai.</title><style>svg{--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-pron:#0891b2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lf-glass { fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linejoin: round; }
              .lf-water { fill: var(--role-noun); opacity: .55; }
              .lf-dot { fill: var(--role-pron); }
              .lf-empty { fill: none; stroke: var(--role-pron); stroke-width: 1.8; stroke-dasharray: 4 3; }
              .lf-hd { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: .08em; }
              .lf-w { font: 800 15px var(--font); fill: var(--text); }
              .lf-g { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .lf-div { fill: none; stroke: var(--accent-line); stroke-width: 1.5; stroke-dasharray: 4 5; }
            </style>
          </defs>

          <text class="lf-hd" x="160" y="22" text-anchor="middle">UNCOUNTABLE</text>
          <text class="lf-hd" x="465" y="22" text-anchor="middle">COUNTABLE</text>
          <path class="lf-div" d="M310 14 L310 240"/>

          <polygon class="lf-water" points="52.5,110 127.5,110 120,170 60,170"/>
          <path class="lf-glass" d="M45 50 L60 170 L120 170 L135 50"/>
          <text class="lf-w" x="90" y="200" text-anchor="middle">a little</text>
          <text class="lf-g" x="90" y="218" text-anchor="middle">thoda — kaafi hai</text>
          <text class="lf-g" x="90" y="235" text-anchor="middle">(positive)</text>

          <polygon class="lf-water" points="198.75,160 261.25,160 260,170 200,170"/>
          <path class="lf-glass" d="M185 50 L200 170 L260 170 L275 50"/>
          <text class="lf-w" x="230" y="200" text-anchor="middle">little</text>
          <text class="lf-g" x="230" y="218" text-anchor="middle">na ke barabar</text>
          <text class="lf-g" x="230" y="235" text-anchor="middle">(negative)</text>

          <circle class="lf-dot" cx="365" cy="92" r="11"/>
          <circle class="lf-dot" cx="395" cy="92" r="11"/>
          <circle class="lf-dot" cx="425" cy="92" r="11"/>
          <circle class="lf-dot" cx="380" cy="122" r="11"/>
          <circle class="lf-dot" cx="410" cy="122" r="11"/>
          <text class="lf-w" x="395" y="200" text-anchor="middle">a few</text>
          <text class="lf-g" x="395" y="218" text-anchor="middle">kuch — kaafi hain</text>
          <text class="lf-g" x="395" y="235" text-anchor="middle">(positive)</text>

          <circle class="lf-dot" cx="535" cy="92" r="11"/>
          <circle class="lf-empty" cx="565" cy="92" r="11"/>
          <circle class="lf-empty" cx="520" cy="122" r="11"/>
          <circle class="lf-empty" cx="550" cy="122" r="11"/>
          <text class="lf-w" x="540" y="200" text-anchor="middle">few</text>
          <text class="lf-g" x="540" y="218" text-anchor="middle">gine-chune — kami hai</text>
          <text class="lf-g" x="540" y="235" text-anchor="middle">(negative)</text>
        </svg>