<svg viewBox="0 0 640 210" role="img" aria-label="Kitna zaroori — should aur ought to salaah hain, have to bahar ka niyam hai, must sabse pakki zaroorat hai. Neeche: mustn't ka matlab mana hai, don't have to ka matlab zaroori nahi." xmlns="http://www.w3.org/2000/svg"><title>Upar: zaroorat badhti jaati hai. Neeche: negative me must aur have to ka matlab bilkul alag ho jaata hai.</title><style>svg{--accent:#ea580c;--bad:#be123c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ob-seg { fill: var(--accent); }
              .ob-w { font: 800 15px var(--font); fill: var(--text); }
              .ob-g { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .ob-ax { fill: none; stroke: var(--text-soft); stroke-width: 1.8; }
              .ob-hd { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .ob-box { fill: var(--sheet); stroke-width: 2; }
              .ob-ex { font: 600 11.5px var(--font); fill: var(--text); }
            </style>
            <marker id="obArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--text-soft)"/>
            </marker>
          </defs>

          <text class="ob-hd" x="30" y="16">KITNA ZAROORI?</text>
          <path class="ob-ax" d="M30 26 L612 26" marker-end="url(#obArrow)"/>

          <rect class="ob-seg" x="30" y="36" width="190" height="58" rx="10" opacity=".22"/>
          <text class="ob-w" x="125" y="62" text-anchor="middle">should / ought to</text>
          <text class="ob-g" x="125" y="81" text-anchor="middle">salaah — "chahiye"</text>

          <rect class="ob-seg" x="228" y="36" width="190" height="58" rx="10" opacity=".45"/>
          <text class="ob-w" x="323" y="62" text-anchor="middle">have to</text>
          <text class="ob-g" x="323" y="81" text-anchor="middle">bahar ka niyam — "padega"</text>

          <rect class="ob-seg" x="426" y="36" width="190" height="58" rx="10" opacity=".75"/>
          <text class="ob-w" x="521" y="62" text-anchor="middle">must</text>
          <text class="ob-g" x="521" y="81" text-anchor="middle" style="fill:var(--text)">pakki zaroorat — "hona hi hai"</text>

          <rect class="ob-box" x="30" y="118" width="285" height="78" rx="10" stroke="var(--bad)"/>
          <text class="ob-w" x="172" y="142" text-anchor="middle">mustn't</text>
          <text class="ob-g" x="172" y="161" text-anchor="middle">mana hai — mat karo!</text>
          <text class="ob-ex" x="172" y="182" text-anchor="middle">You mustn't smoke here.</text>

          <rect class="ob-box" x="331" y="118" width="285" height="78" rx="10" stroke="var(--good)"/>
          <text class="ob-w" x="473" y="142" text-anchor="middle">don't have to</text>
          <text class="ob-g" x="473" y="161" text-anchor="middle">zaroorat nahi — chaaho to karo</text>
          <text class="ob-ex" x="473" y="182" text-anchor="middle">You don't have to come early.</text>
        </svg>