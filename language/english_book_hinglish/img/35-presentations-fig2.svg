<svg viewBox="0 0 480 350" role="img" aria-label="Sadak par paanch signpost: First, Moving on, For example, As I said, aur To sum up. Har board batata hai ki presentation me hum kahan hain." xmlns="http://www.w3.org/2000/svg"><title>Sadak = aapki presentation. Board na hon to sunne wala bhatak jaata hai, chahe aapki English kitni bhi achhi ho.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .sg-rd { fill: var(--accent-line); }
              .sg-cl { stroke: var(--sheet); stroke-width: 2.5; stroke-dasharray: 12 10; }
              .sg-pl { fill: none; stroke: var(--text-soft); stroke-width: 3; }
              .sg-bd { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .sg-bd2 { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .sg-k { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
              .sg-t { font: 700 12px var(--font); fill: var(--text); }
              .sg-walk { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#sg-ar); }
              .sg-h { font: 600 13px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="sg-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>
          <text class="sg-h" x="10" y="24">Har board ka matlab: "ab hum yahan hain."</text>

