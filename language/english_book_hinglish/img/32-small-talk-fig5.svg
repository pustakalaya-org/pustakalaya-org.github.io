<svg viewBox="0 0 480 180" role="img" aria-label="Baat khatam karne ke teen kadam: signal, wajah, aur garam ant." xmlns="http://www.w3.org/2000/svg"><title>Signal saamne wale ko taiyaar karta hai, wajah se wo bura nahi maanta, aur garam line yaad reh jaati hai.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .xt-cv { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .xt-t { font: 700 15px var(--font); fill: var(--text); }
              .xt-s { font: italic 500 12.5px var(--font); fill: var(--text-soft); }
              .xt-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#xt-ar); }
              .xt-k { font: 600 12.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="xt-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>
          <polygon class="xt-cv" points="10,30 140,30 160,75 140,120 10,120 30,75"/>
          <polygon class="xt-cv" points="165,30 295,30 315,75 295,120 165,120 185,75"/>
          <polygon class="xt-cv" points="320,30 450,30 470,75 450,120 320,120 340,75"/>
          <text class="xt-t" x="88" y="70" text-anchor="middle">Signal</text>
          <text class="xt-s" x="88" y="92" text-anchor="middle">"Well…"</text>
          <text class="xt-t" x="243" y="70" text-anchor="middle">Wajah</text>
          <text class="xt-s" x="243" y="92" text-anchor="middle">"I should go and…"</text>
          <text class="xt-t" x="398" y="70" text-anchor="middle">Garam ant</text>
          <text class="xt-s" x="398" y="92" text-anchor="middle">"Lovely meeting you!"</text>
          <path class="xt-ln" d="M10 148 L466 148"/>
          <text class="xt-k" x="10" y="172">Teeno milkar sirf 10 second — par asar poori shaam ka.</text>
        </svg>