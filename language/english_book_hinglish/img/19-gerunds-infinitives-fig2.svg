<svg viewBox="0 0 640 248" role="img" aria-label="Samay ki rekha par beech me 'abhi'. -ing peeche dekhta hai — I remember locking the door (lock kar chuka, yaad hai). to aage dekhta hai — Remember to lock the door (abhi lock karna hai). Isi tarah I stopped smoking (smoking chhod di) aur I stopped to smoke (ruka taaki smoke kare)." xmlns="http://www.w3.org/2000/svg"><title>-ing ka teer peeche, &quot;to&quot; ka teer aage. Yahi ek tasveer stop, remember aur forget teeno samjha deti hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tm-line { fill: none; stroke: var(--text); stroke-width: 2.2; }
              .tm-arr { fill: none; stroke-width: 2.6; }
              .tm-now { fill: var(--accent); }
              .tm-hd { font: 800 15px var(--font); }
              .tm-g { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .tm-ex { font: 700 12.5px var(--font); fill: var(--text); }
              .tm-nl { font: 800 11.5px var(--font); fill: var(--accent); }
            </style>
            <marker id="tmA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/></marker>
            <marker id="tmA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--role-noun)"/></marker>
          </defs>

          <text class="tm-hd" x="170" y="28" text-anchor="middle" fill="var(--role-verb)">← -ing: peeche dekhta hai</text>
          <text class="tm-g" x="170" y="46" text-anchor="middle">jo pehle ho chuka / chal raha tha</text>
          <text class="tm-hd" x="470" y="28" text-anchor="middle" fill="var(--role-noun)">to: aage dekhta hai →</text>
          <text class="tm-g" x="470" y="46" text-anchor="middle">jo abhi karna hai / hone wala hai</text>

          <path class="tm-arr" stroke="var(--role-verb)" d="M306 80 L80 80" marker-end="url(#tmA1)"/>
          <path class="tm-arr" stroke="var(--role-noun)" d="M334 80 L560 80" marker-end="url(#tmA2)"/>

          <path class="tm-line" d="M30 110 L610 110"/>
          <circle class="tm-now" cx="320" cy="110" r="9"/>
          <text class="tm-nl" x="320" y="88" text-anchor="middle">ABHI</text>

          <text class="tm-ex" x="170" y="146" text-anchor="middle">I remember locking the door.</text>
          <text class="tm-g" x="170" y="163" text-anchor="middle">lock kar chuka — wo yaad hai</text>
          <text class="tm-ex" x="470" y="146" text-anchor="middle">Remember to lock the door.</text>
          <text class="tm-g" x="470" y="163" text-anchor="middle">abhi lock karna hai — bhoolna mat</text>

          <text class="tm-ex" x="170" y="200" text-anchor="middle">I stopped smoking.</text>
          <text class="tm-g" x="170" y="217" text-anchor="middle">smoking hi chhod di</text>
          <text class="tm-ex" x="470" y="200" text-anchor="middle">I stopped to smoke.</text>
          <text class="tm-g" x="470" y="217" text-anchor="middle">ruka, taaki smoke kar sakoon</text>
        </svg>