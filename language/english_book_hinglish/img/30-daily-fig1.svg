<svg viewBox="0 0 680 380" role="img" aria-label="Dukaan par baat-cheet ka bahaav: salaam se shuru, cheez maango, keemat poochho, phir mol-bhaav ya size badalna, phir paisa dena aur dhanyavaad" xmlns="http://www.w3.org/2000/svg"><title>Baayein taraf aapki lines, daayein taraf dukaandaar ki lines jo aapko pehchaanni hain.
        Sunna aadhi baat-cheet hai — isi liye dono taraf di gayi hain.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-adj:#9333ea;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .nd { fill: var(--sheet); stroke: var(--brand-500); stroke-width: 2; }
              .nd2 { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2; }
              .ndq { fill: var(--sheet); stroke: var(--role-adj); stroke-width: 2; stroke-dasharray: 5 4; }
              .ln { stroke: var(--ink-300); stroke-width: 2; fill: none; marker-end: url(#a2); }
              .st { font: 700 12.5px var(--font); fill: var(--text); }
              .sq { font: 500 11px var(--font); fill: var(--text-soft); }
              .bl { font: 700 10.5px var(--font); fill: var(--role-adj); }
              .hd5 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
            <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-300)"/>
            </marker>
          </defs>

          <text class="hd5" x="12" y="18">DUKAAN PAR BAAT KA RAASTA</text>

          <!-- 1 -->
          <rect class="nd" x="12" y="34" width="192" height="56" rx="10"/>
          <text class="st" x="24" y="56">1. Shuruaat</text>
          <text class="sq" x="24" y="76">"Excuse me, do you have…?"</text>

          <path class="ln" d="M108 92 L108 118"/>

          <!-- 2 -->
          <rect class="nd" x="12" y="120" width="192" height="56" rx="10"/>
          <text class="st" x="24" y="142">2. Keemat poochho</text>
          <text class="sq" x="24" y="162">"How much is this?"</text>

          <path class="ln" d="M108 178 L108 204"/>

          <!-- 3 branch -->
          <rect class="ndq" x="12" y="206" width="192" height="76" rx="10"/>
          <text class="bl" x="24" y="226">YAHAN DO RAASTE</text>
          <text class="sq" x="24" y="246">"Do you have a smaller one?"</text>
          <text class="sq" x="24" y="266">"Can you do it for less?"</text>

          <path class="ln" d="M108 284 L108 310"/>

          <!-- 4 -->
          <rect class="nd2" x="12" y="312" width="192" height="56" rx="10"/>
          <text class="st" x="24" y="334">4. Paisa aur shukriya</text>
          <text class="sq" x="24" y="354">"I'll take it. Card is fine?"</text>

          <!-- RIGHT: shopkeeper side -->
          <text class="hd5" x="266" y="18">DUKAANDAAR KYA BOLEGA — PEHCHAANO</text>

          <rect class="nd2" x="266" y="34" width="402" height="50" rx="10"/>
          <text class="sq" x="280" y="54">"Yes, which one are you looking for?"</text>
          <text class="sq" x="280" y="72">→ "Kaunsa chahiye?" — size ya rang batao</text>

          <rect class="nd2" x="266" y="96" width="402" height="50" rx="10"/>
          <text class="sq" x="280" y="116">"That one's four hundred."</text>
          <text class="sq" x="280" y="134">→ keemat. "Four hundred" = 400</text>

          <rect class="nd2" x="266" y="158" width="402" height="50" rx="10"/>
          <text class="sq" x="280" y="178">"Sorry, that's the best I can do."</text>
          <text class="sq" x="280" y="196">→ "isse kam nahi" — mol-bhaav khatam</text>

          <rect class="nd2" x="266" y="220" width="402" height="50" rx="10"/>
          <text class="sq" x="280" y="240">"We're out of stock in that size."</text>
          <text class="sq" x="280" y="258">→ "wo size nahi hai"</text>

          <rect class="nd2" x="266" y="282" width="402" height="50" rx="10"/>
          <text class="sq" x="280" y="302">"Cash or card?"</text>
          <text class="sq" x="280" y="320">→ "Card, please." ya "Cash."</text>

          <rect class="nd" x="266" y="344" width="402" height="24" rx="8"/>
          <text class="sq" x="280" y="361">Aakhir me hamesha: "Thanks a lot." — bas itna kaafi hai.</text>
        </svg>