<svg viewBox="0 0 660 318" role="img" aria-label="Paanch sentence patterns rangeen blocks me: SV — The baby slept. SVO — Priya reads novels. SVC — My father is a farmer. SVOO — Ma gave me a watch. SVOA — He kept the keys on the table." xmlns="http://www.w3.org/2000/svg"><title>Har rang ek kaam: subject, verb, object, complement, adverbial. Pattern verb tay karta hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--role-prep:#ea580c;--role-pron:#0891b2;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pt-pill { fill: var(--accent); }
              .pt-pt { font: 800 12.5px var(--font); fill: #fff; }
              .pt-blk { fill: var(--sheet); stroke-width: 2; }
              .pt-w { font: 700 13.5px var(--font); }
              .pt-tag { font: 800 10px var(--font); letter-spacing: .05em; }
              .pt-note { font: 500 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <!-- SV -->
          <rect class="pt-pill" x="10" y="20" width="74" height="36" rx="18"/>
          <text class="pt-pt" x="47" y="43" text-anchor="middle">SV</text>
          <text class="pt-tag" x="150" y="16" text-anchor="middle" fill="var(--role-noun)">S</text>
          <rect class="pt-blk" x="100" y="20" width="100" height="36" rx="8" stroke="var(--role-noun)"/>
          <text class="pt-w" x="150" y="43" text-anchor="middle" fill="var(--role-noun)">The baby</text>
          <text class="pt-tag" x="250" y="16" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="pt-blk" x="210" y="20" width="80" height="36" rx="8" stroke="var(--role-verb)"/>
          <text class="pt-w" x="250" y="43" text-anchor="middle" fill="var(--role-verb)">slept.</text>
          <text class="pt-note" x="510" y="43">aage kuch nahi chahiye</text>

          <!-- SVO -->
          <rect class="pt-pill" x="10" y="82" width="74" height="36" rx="18"/>
          <text class="pt-pt" x="47" y="105" text-anchor="middle">SVO</text>
          <text class="pt-tag" x="140" y="78" text-anchor="middle" fill="var(--role-noun)">S</text>
          <rect class="pt-blk" x="100" y="82" width="80" height="36" rx="8" stroke="var(--role-noun)"/>
          <text class="pt-w" x="140" y="105" text-anchor="middle" fill="var(--role-noun)">Priya</text>
          <text class="pt-tag" x="230" y="78" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="pt-blk" x="190" y="82" width="80" height="36" rx="8" stroke="var(--role-verb)"/>
          <text class="pt-w" x="230" y="105" text-anchor="middle" fill="var(--role-verb)">reads</text>
          <text class="pt-tag" x="325" y="78" text-anchor="middle" fill="var(--role-pron)">O</text>
          <rect class="pt-blk" x="280" y="82" width="90" height="36" rx="8" stroke="var(--role-pron)"/>
          <text class="pt-w" x="325" y="105" text-anchor="middle" fill="var(--role-pron)">novels.</text>
          <text class="pt-note" x="510" y="105">"kya?" → object</text>

          <!-- SVC -->
          <rect class="pt-pill" x="10" y="144" width="74" height="36" rx="18"/>
          <text class="pt-pt" x="47" y="167" text-anchor="middle">SVC</text>
          <text class="pt-tag" x="150" y="140" text-anchor="middle" fill="var(--role-noun)">S</text>
          <rect class="pt-blk" x="100" y="144" width="100" height="36" rx="8" stroke="var(--role-noun)"/>
          <text class="pt-w" x="150" y="167" text-anchor="middle" fill="var(--role-noun)">My father</text>
          <text class="pt-tag" x="235" y="140" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="pt-blk" x="210" y="144" width="50" height="36" rx="8" stroke="var(--role-verb)"/>
          <text class="pt-w" x="235" y="167" text-anchor="middle" fill="var(--role-verb)">is</text>
          <text class="pt-tag" x="320" y="140" text-anchor="middle" fill="var(--role-adj)">C</text>
          <rect class="pt-blk" x="270" y="144" width="100" height="36" rx="8" stroke="var(--role-adj)"/>
          <text class="pt-w" x="320" y="167" text-anchor="middle" fill="var(--role-adj)">a farmer.</text>
          <text class="pt-note" x="510" y="167">father = farmer</text>

          <!-- SVOO -->
          <rect class="pt-pill" x="10" y="206" width="74" height="36" rx="18"/>
          <text class="pt-pt" x="47" y="229" text-anchor="middle">SVOO</text>
          <text class="pt-tag" x="130" y="202" text-anchor="middle" fill="var(--role-noun)">S</text>
          <rect class="pt-blk" x="100" y="206" width="60" height="36" rx="8" stroke="var(--role-noun)"/>
          <text class="pt-w" x="130" y="229" text-anchor="middle" fill="var(--role-noun)">Ma</text>
          <text class="pt-tag" x="205" y="202" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="pt-blk" x="170" y="206" width="70" height="36" rx="8" stroke="var(--role-verb)"/>
          <text class="pt-w" x="205" y="229" text-anchor="middle" fill="var(--role-verb)">gave</text>
          <text class="pt-tag" x="280" y="202" text-anchor="middle" fill="var(--role-prep)">O (kisko)</text>
          <rect class="pt-blk" x="250" y="206" width="60" height="36" rx="8" stroke="var(--role-prep)"/>
          <text class="pt-w" x="280" y="229" text-anchor="middle" fill="var(--role-prep)">me</text>
          <text class="pt-tag" x="370" y="202" text-anchor="middle" fill="var(--role-pron)">O (kya)</text>
          <rect class="pt-blk" x="320" y="206" width="100" height="36" rx="8" stroke="var(--role-pron)"/>
          <text class="pt-w" x="370" y="229" text-anchor="middle" fill="var(--role-pron)">a watch.</text>
          <text class="pt-note" x="510" y="229">kisko + kya</text>

          <!-- SVOA -->
          <rect class="pt-pill" x="10" y="268" width="74" height="36" rx="18"/>
          <text class="pt-pt" x="47" y="291" text-anchor="middle">SVOA</text>
          <text class="pt-tag" x="130" y="264" text-anchor="middle" fill="var(--role-noun)">S</text>
          <rect class="pt-blk" x="100" y="268" width="60" height="36" rx="8" stroke="var(--role-noun)"/>
          <text class="pt-w" x="130" y="291" text-anchor="middle" fill="var(--role-noun)">He</text>
          <text class="pt-tag" x="205" y="264" text-anchor="middle" fill="var(--role-verb)">V</text>
          <rect class="pt-blk" x="170" y="268" width="70" height="36" rx="8" stroke="var(--role-verb)"/>
          <text class="pt-w" x="205" y="291" text-anchor="middle" fill="var(--role-verb)">kept</text>
          <text class="pt-tag" x="300" y="264" text-anchor="middle" fill="var(--role-pron)">O</text>
          <rect class="pt-blk" x="250" y="268" width="100" height="36" rx="8" stroke="var(--role-pron)"/>
          <text class="pt-w" x="300" y="291" text-anchor="middle" fill="var(--role-pron)">the keys</text>
          <text class="pt-tag" x="425" y="264" text-anchor="middle" fill="var(--role-adv)">A</text>
          <rect class="pt-blk" x="360" y="268" width="130" height="36" rx="8" stroke="var(--role-adv)"/>
          <text class="pt-w" x="425" y="291" text-anchor="middle" fill="var(--role-adv)">on the table.</text>
          <text class="pt-note" x="510" y="291">"kahan?" zaroori hai</text>
        </svg>