<svg viewBox="0 0 480 350" role="img" aria-label="Ping-pong jawaab: ek shabd ka jawaab baat ko rok deta hai, jabki jawaab, detail aur sawaal wapas wala jawaab baat ko aage badhata hai." xmlns="http://www.w3.org/2000/svg"><title>Detail saamne wale ko naya topic deti hai, aur sawaal ball unke paale me wapas bhejta hai.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-interj:#e11d48;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pp-q { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .pp-bad { fill: var(--sheet); stroke: var(--role-interj); stroke-width: 2; }
              .pp-ok { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2; }
              .pp-div { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
              .pp-back { fill: none; stroke: var(--role-conj); stroke-width: 2.5; marker-end: url(#pp-ar); }
              .pp-h { font: 800 12px var(--font); letter-spacing: 0.06em; }
              .pp-t { font: 500 14px var(--font); fill: var(--text); }
              .pp-k { font: 800 11.5px var(--font); fill: var(--accent); letter-spacing: 0.05em; }
              .pp-s { font: italic 500 13px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="pp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-conj)"/>
            </marker>
          </defs>

          <text class="pp-h" x="20" y="22" fill="var(--text-soft)">SAWAAL AAYA</text>
          <rect class="pp-q" x="20" y="32" width="250" height="40" rx="20"/>
          <text class="pp-t" x="38" y="57">"So, where are you from?"</text>

          <text class="pp-h" x="20" y="108" fill="var(--role-interj)">✗ EK SHABD — BALL GIR GAYI</text>
          <rect class="pp-bad" x="20" y="118" width="80" height="40" rx="10"/>
          <text class="pp-t" x="60" y="143" text-anchor="middle">Pune.</text>
          <text class="pp-s" x="118" y="143">…  chuppi  …  awkward smile</text>

          <text class="pp-h" x="20" y="194" fill="var(--role-conj)">✓ PING-PONG — BALL WAPAS AAYI</text>
          <rect class="pp-ok" x="20" y="204" width="430" height="40" rx="10"/>
          <path class="pp-div" d="M112 210 L112 238"/>
          <text class="pp-k" x="32" y="229">JAWAAB</text>
          <text class="pp-t" x="126" y="229">Pune.</text>

          <rect class="pp-ok" x="20" y="252" width="430" height="40" rx="10"/>
          <path class="pp-div" d="M112 258 L112 286"/>
          <text class="pp-k" x="32" y="277">DETAIL</text>
          <text class="pp-t" x="126" y="277">I moved here for work last year.</text>

          <rect class="pp-ok" x="20" y="300" width="430" height="40" rx="10"/>
          <path class="pp-div" d="M112 306 L112 334"/>
          <text class="pp-k" x="32" y="325">SAWAAL</text>
          <text class="pp-t" x="126" y="325">What about you?</text>

          <path class="pp-back" d="M452 320 C476 320 476 52 280 52"/>
        </svg>