<svg viewBox="0 0 680 200" role="img" aria-label="Complaint ka kram: pehle facts — kya, kab, order number; phir asar — kya nuksaan hua; phir maang — repair, replace ya refund; phir deadline — kab tak; aur neeche saboot attach karo" xmlns="http://www.w3.org/2000/svg"><title>Chaar kadam, ek kram. Gussa is kram me kahin nahi aata — aur zaroorat bhi nahi.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cp-1 { fill: var(--sheet-2); stroke: var(--accent-line); stroke-width: 1.6; }
              .cp-2 { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.6; }
              .cp-3 { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
              .cp-4 { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.6; }
              .cp-h { font: 800 13px var(--font); fill: var(--text); }
              .cp-s { font: 500 11px var(--font); fill: var(--text-soft); }
              .cp-at { fill: none; stroke: var(--accent-2); stroke-width: 1.8; stroke-dasharray: 5 5; }
              .cp-a { font: 700 11.5px var(--font); fill: var(--accent-ink); }
            </style>
          </defs>
          <path class="cp-1" d="M16 30 H160 L186 80 L160 130 H16 Z"/>
          <path class="cp-2" d="M176 30 H322 L348 80 L322 130 H176 L202 80 Z"/>
          <path class="cp-3" d="M338 30 H484 L510 80 L484 130 H338 L364 80 Z"/>
          <path class="cp-4" d="M500 30 H664 V130 H500 L526 80 Z"/>

          <text class="cp-h" x="34" y="70">1. Facts</text>
          <text class="cp-s" x="34" y="90">kya, kab, kahan,</text>
          <text class="cp-s" x="34" y="106">order number</text>

          <text class="cp-h" x="214" y="70">2. Asar</text>
          <text class="cp-s" x="214" y="90">kya nuksaan ya</text>
          <text class="cp-s" x="214" y="106">dikkat hui</text>

          <text class="cp-h" x="376" y="70">3. Maang</text>
          <text class="cp-s" x="376" y="90">repair, replace</text>
          <text class="cp-s" x="376" y="106">ya refund</text>

          <text class="cp-h" x="540" y="70">4. Deadline</text>
          <text class="cp-s" x="540" y="90">kab tak — ek</text>
          <text class="cp-s" x="540" y="106">pakki taarikh</text>

          <path class="cp-at" d="M60 136 V166 H620 V136"/>
          <text class="cp-a" x="340" y="188" text-anchor="middle">Saath me attach: invoice, photo, pichhla ticket number</text>
        </svg>