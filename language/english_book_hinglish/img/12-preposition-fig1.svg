<svg viewBox="0 0 640 340" role="img" aria-label="Box ke andar, upar, neeche, peeche, bagal aur beech ki position dikhati hui tasveer" xmlns="http://www.w3.org/2000/svg"><title>Narangi gola = jis cheez ki baat ho rahi hai. Dabba = jiske sandarbh me baat ho rahi hai.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-prep:#ea580c;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .bx { fill: none; stroke: var(--ink-300); stroke-width: 2.5; }
              .ball { fill: var(--role-prep); }
              .lbl { font: 700 13px var(--font); fill: var(--role-prep); }
              .sub { font: 500 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <!-- in -->
          <g transform="translate(20 30)">
            <rect class="bx" x="0" y="20" width="80" height="60" rx="6"/>
            <circle class="ball" cx="40" cy="50" r="11"/>
            <text class="lbl" x="40" y="104" text-anchor="middle">in</text>
            <text class="sub" x="40" y="120" text-anchor="middle">andar</text>
          </g>

          <!-- on -->
          <g transform="translate(130 30)">
            <rect class="bx" x="0" y="20" width="80" height="60" rx="6"/>
            <circle class="ball" cx="40" cy="9" r="11"/>
            <line class="bx" x1="0" y1="20" x2="80" y2="20"/>
            <text class="lbl" x="40" y="104" text-anchor="middle">on</text>
            <text class="sub" x="40" y="120" text-anchor="middle">upar (chipka hua)</text>
          </g>

          <!-- under -->
          <g transform="translate(240 30)">
            <rect class="bx" x="0" y="20" width="80" height="60" rx="6"/>
            <circle class="ball" cx="40" cy="95" r="11"/>
            <text class="lbl" x="40" y="124" text-anchor="middle">under</text>
            <text class="sub" x="40" y="140" text-anchor="middle">neeche</text>
          </g>

          <!-- behind -->
          <g transform="translate(350 30)">
            <rect class="bx" x="12" y="26" width="76" height="56" rx="6"/>
            <circle class="ball" cx="30" cy="18" r="11" opacity="0.45"/>
            <text class="lbl" x="50" y="104" text-anchor="middle">behind</text>
            <text class="sub" x="50" y="120" text-anchor="middle">peeche</text>
          </g>

          <!-- next to -->
          <g transform="translate(465 30)">
            <rect class="bx" x="0" y="20" width="60" height="60" rx="6"/>
            <circle class="ball" cx="88" cy="50" r="11"/>
            <text class="lbl" x="50" y="104" text-anchor="middle">next to</text>
            <text class="sub" x="50" y="120" text-anchor="middle">bilkul bagal me</text>
          </g>

          <!-- between -->
          <g transform="translate(140 200)">
            <rect class="bx" x="0" y="10" width="60" height="55" rx="6"/>
            <rect class="bx" x="140" y="10" width="60" height="55" rx="6"/>
            <circle class="ball" cx="100" cy="38" r="11"/>
            <text class="lbl" x="100" y="92" text-anchor="middle">between</text>
            <text class="sub" x="100" y="108" text-anchor="middle">do cheezon ke beech</text>
          </g>

          <!-- in front of -->
          <g transform="translate(400 200)">
            <rect class="bx" x="30" y="10" width="70" height="55" rx="6"/>
            <circle class="ball" cx="65" cy="78" r="11"/>
            <text class="lbl" x="65" y="112" text-anchor="middle">in front of</text>
            <text class="sub" x="65" y="128" text-anchor="middle">saamne</text>
          </g>
        </svg>