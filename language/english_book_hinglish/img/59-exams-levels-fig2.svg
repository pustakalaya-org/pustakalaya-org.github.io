<svg viewBox="0 0 640 300" role="img" aria-label="Kaunsa exam: beech me sawaal Kyun chahiye, chaar shaakhaayein — videsh me padhai, kaam ya migration, Europe ya international certificate, aur sirf apna level jaanna" xmlns="http://www.w3.org/2000/svg"><title>Ek hi desh me bhi alag-alag university ya visa alag exam maanti hai. Apply karne se pehle
        unki website par &quot;English language requirements&quot; padho.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ex-q { fill: var(--accent); }
              .ex-qt { font: 800 15px var(--font); fill: var(--sheet); }
              .ex-b { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .ex-h { font: 800 13px var(--font); fill: var(--text); }
              .ex-s { font: 600 12px var(--font); fill: var(--accent-2); }
              .ex-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; }
              .ex-f { font: italic 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <path class="ex-ln" d="M320 70 L85 140"/>
          <path class="ex-ln" d="M320 70 L240 140"/>
          <path class="ex-ln" d="M320 70 L400 140"/>
          <path class="ex-ln" d="M320 70 L555 140"/>
          <rect class="ex-q" x="210" y="20" width="220" height="50" rx="25"/>
          <text class="ex-qt" x="320" y="51" text-anchor="middle">Kyun chahiye?</text>

          <rect class="ex-b" x="10" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="85" y="166" text-anchor="middle">Videsh me padhai</text>
          <text class="ex-s" x="85" y="192" text-anchor="middle">IELTS Academic</text>
          <text class="ex-s" x="85" y="210" text-anchor="middle">TOEFL · PTE</text>
          <text class="ex-f" x="85" y="234" text-anchor="middle">university list dekho</text>

          <rect class="ex-b" x="165" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="240" y="166" text-anchor="middle">Kaam / migration</text>
          <text class="ex-s" x="240" y="192" text-anchor="middle">IELTS General</text>
          <text class="ex-s" x="240" y="210" text-anchor="middle">PTE (kuch desh)</text>
          <text class="ex-f" x="240" y="234" text-anchor="middle">visa site dekho</text>

          <rect class="ex-b" x="325" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="400" y="166" text-anchor="middle">Lamba certificate</text>
          <text class="ex-s" x="400" y="192" text-anchor="middle">B2 First</text>
          <text class="ex-s" x="400" y="210" text-anchor="middle">C1 Advanced</text>
          <text class="ex-f" x="400" y="234" text-anchor="middle">Europe, kai companies</text>

          <rect class="ex-b" x="480" y="140" width="150" height="110" rx="12"/>
          <text class="ex-h" x="555" y="166" text-anchor="middle">Bas level jaanna</text>
          <text class="ex-s" x="555" y="192" text-anchor="middle">is chapter ki list</text>
          <text class="ex-s" x="555" y="210" text-anchor="middle">+ Aakhri imtihaan</text>
          <text class="ex-f" x="555" y="234" text-anchor="middle">paisa bachao</text>

          <text class="ex-f" x="320" y="286" text-anchor="middle">Pehle manzil ki official list, phir exam — ulta kabhi nahi.</text>
        </svg>