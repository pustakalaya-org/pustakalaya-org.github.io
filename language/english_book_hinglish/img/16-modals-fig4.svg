<svg viewBox="0 0 640 286" role="img" aria-label="Yakeen ka meter: baayein 0 pratishat par can't (namumkin), phir might aur could (kam yakeen), may (aadha), should (zyada), aur daayein must (lagbhag pakka)." xmlns="http://www.w3.org/2000/svg"><title>Baayein se daayein yakeen badhta hai. &quot;can&#x27;t&quot; aur &quot;must&quot; dono pakke andaaze hain — ek &quot;nahi&quot; ka, ek &quot;haan&quot; ka.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cm-arc { fill: none; stroke: var(--accent-line); stroke-width: 14; stroke-linecap: round; }
              .cm-arc2 { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
              .cm-tick { fill: none; stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; }
              .cm-w { font: 800 15px var(--font); fill: var(--role-verb); }
              .cm-ex { font: 500 11px var(--font); fill: var(--text-soft); }
              .cm-c { font: 800 13px var(--font); fill: var(--text); }
              .cm-s { font: 600 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <path class="cm-arc" d="M140 240 A180 180 0 0 1 500 240"/>
          <path class="cm-arc2" d="M140 240 A180 180 0 0 1 500 240"/>

          <path class="cm-tick" d="M150.3 229.3 L130.4 228.1"/>
          <path class="cm-tick" d="M220 102.5 L208.3 86.3"/>
          <path class="cm-tick" d="M293.4 72.1 L290.3 52.3"/>
          <path class="cm-tick" d="M420 102.5 L431.7 86.3"/>
          <path class="cm-tick" d="M487.9 213.4 L507.7 210.3"/>

          <text class="cm-w" x="118" y="222" text-anchor="end">can't</text>
          <text class="cm-ex" x="118" y="238" text-anchor="end">That can't be true.</text>

          <text class="cm-w" x="200" y="74" text-anchor="end">might / could</text>
          <text class="cm-ex" x="200" y="90" text-anchor="end">It might rain.</text>

          <text class="cm-w" x="285" y="20" text-anchor="middle">may</text>
          <text class="cm-ex" x="285" y="36" text-anchor="middle">She may be busy.</text>

          <text class="cm-w" x="440" y="74">should</text>
          <text class="cm-ex" x="440" y="90">He should be home by now.</text>

          <text class="cm-w" x="522" y="205">must</text>
          <text class="cm-ex" x="522" y="221">You must be tired.</text>

          <text class="cm-c" x="320" y="214" text-anchor="middle">Kitna yakeen?</text>
          <text class="cm-s" x="140" y="268" text-anchor="middle">0% — namumkin</text>
          <text class="cm-s" x="500" y="268" text-anchor="middle">~100% — lagbhag pakka</text>
        </svg>