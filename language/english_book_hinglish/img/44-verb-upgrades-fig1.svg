<svg viewBox="0 0 680 360" role="img" aria-label="make better phrase se nikalti chaar shaakhayein: improve, enhance, refine aur optimize, har ek ke saath uska sahi istemaal" xmlns="http://www.w3.org/2000/svg"><title>Ek dheela phrase, chaar alag matlab. Shabd chunne se pehle sawaal poocho: cheez tooti hai,
        kamzor hai, achhi hai, ya dheemi hai?</title><style>svg{--brand-400:#fb923c;--brand-500:#f97316;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-100:#f1f5f9;--ink-300:#cbd5e1;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .rootbox { fill: var(--ink-100); stroke: var(--ink-300); stroke-width: 2; }
              .roott { font: 700 15px var(--font); fill: var(--text); }
              .branch { fill: none; stroke: var(--brand-400); stroke-width: 2.2; }
              .leafbox { fill: none; stroke: var(--brand-500); stroke-width: 2; }
              .leaft { font: 700 14px var(--font); fill: var(--brand-600); }
              .note { font: 500 11.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <rect class="rootbox" x="18" y="150" width="170" height="56" rx="12"/>
          <text class="roott" x="103" y="175" text-anchor="middle">make better</text>
          <text class="note" x="103" y="194" text-anchor="middle">kamzor phrase</text>

          <path class="branch" d="M188 178 C 250 178, 250 48, 320 48"/>
          <path class="branch" d="M188 178 C 250 178, 250 128, 320 128"/>
          <path class="branch" d="M188 178 C 250 178, 250 228, 320 228"/>
          <path class="branch" d="M188 178 C 250 178, 250 308, 320 308"/>

          <rect class="leafbox" x="320" y="24" width="150" height="46" rx="11"/>
          <text class="leaft" x="334" y="53">improve</text>
          <text class="note" x="482" y="43">jo kamzor hai use</text>
          <text class="note" x="482" y="59">behtar karna</text>

          <rect class="leafbox" x="320" y="104" width="150" height="46" rx="11"/>
          <text class="leaft" x="334" y="133">enhance</text>
          <text class="note" x="482" y="123">jo achha hai use</text>
          <text class="note" x="482" y="139">aur nikhaarna</text>

          <rect class="leafbox" x="320" y="204" width="150" height="46" rx="11"/>
          <text class="leaft" x="334" y="233">refine</text>
          <text class="note" x="482" y="223">chhoti-chhoti cheezein</text>
          <text class="note" x="482" y="239">saaf karna</text>

          <rect class="leafbox" x="320" y="284" width="150" height="46" rx="11"/>
          <text class="leaft" x="334" y="313">optimize</text>
          <text class="note" x="482" y="303">speed ya kharche ke</text>
          <text class="note" x="482" y="319">liye sabse behtar banana</text>
        </svg>