<svg viewBox="0 0 640 260" role="img" aria-label="Vaakya ki lambai ka meter: 1 se 6 shabd bahut chhota aur jhatkedaar, 10 se 20 shabd sahi, 30 se zyada shabd bahut lamba" xmlns="http://www.w3.org/2000/svg"><title>Peela = jhatkedaar, hara = behta hua, laal = kabhi na khatam hone wala.</title><style>svg{--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--bad:#be123c;--bad-bg:#fdecef;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--text:#121826;--text-soft:#4b5568;--warn:#a15c07;--warn-bg:#fff6e0;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pl-z1 { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.6; }
              .pl-z2 { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.6; }
              .pl-z3 { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 1.6; }
              .pl-h { font: 800 12px var(--font); fill: var(--text); }
              .pl-n { font: 700 11.5px var(--font); fill: var(--accent-ink); }
              .pl-s { font: 500 11px var(--font); fill: var(--text-soft); }
              .pl-e { font: 600 11.5px var(--font); fill: var(--text); }
              .pl-w1 { fill: none; stroke: var(--warn); stroke-width: 2.4; stroke-linejoin: round; }
              .pl-w2 { fill: none; stroke: var(--good); stroke-width: 2.4; stroke-linecap: round; }
              .pl-w3 { fill: none; stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
              .pl-k { font: 800 11px var(--font); fill: var(--text-soft); letter-spacing: 0.07em; }
            </style>
          </defs>
          <text class="pl-k" x="20" y="22">VAAKYA KITNA LAMBA HO?</text>

          <text class="pl-h" x="110" y="52" text-anchor="middle">Bahut chhota</text>
          <text class="pl-h" x="320" y="52" text-anchor="middle">Sahi lambai</text>
          <text class="pl-h" x="530" y="52" text-anchor="middle">Bahut lamba</text>

          <rect class="pl-z1" x="20" y="64" width="180" height="40" rx="10"/>
          <rect class="pl-z2" x="210" y="64" width="220" height="40" rx="10"/>
          <rect class="pl-z3" x="440" y="64" width="180" height="40" rx="10"/>
          <text class="pl-n" x="110" y="89" text-anchor="middle">1–6 shabd</text>
          <text class="pl-n" x="320" y="89" text-anchor="middle">10–20 shabd</text>
          <text class="pl-n" x="530" y="89" text-anchor="middle">30+ shabd</text>

          <path class="pl-w1" d="M30 150 L50 128 L70 150 L90 128 L110 150 L130 128 L150 150 L170 128 L190 150"/>
          <path class="pl-w2" d="M220 140 C 255 116, 285 116, 320 140 S 385 164, 420 140"/>
          <path class="pl-w3" d="M450 140 H610"/>

          <text class="pl-e" x="110" y="186" text-anchor="middle">"I went. It rained."</text>
          <text class="pl-s" x="110" y="204" text-anchor="middle">Jhatke-jhatke se chalta hai</text>

          <text class="pl-e" x="320" y="186" text-anchor="middle">"I went out, but it started to rain."</text>
          <text class="pl-s" x="320" y="204" text-anchor="middle">Ek saans me, aaraam se</text>

          <text class="pl-e" x="530" y="186" text-anchor="middle">"I went and it rained and…"</text>
          <text class="pl-s" x="530" y="204" text-anchor="middle">Saans phool jaati hai</text>

          <text class="pl-s" x="320" y="244" text-anchor="middle">Asli niyam: lambai badalte raho. Do-teen medium vaakyon ke beech ek chhota vaakya zor deta hai.</text>
        </svg>