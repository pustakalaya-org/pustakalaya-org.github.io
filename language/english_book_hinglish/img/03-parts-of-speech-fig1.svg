<svg viewBox="0 0 680 420" role="img" aria-label="Aath parts of speech ka naksha — beech me vaakya, chaaron taraf aath kaam apne rang ke saath" xmlns="http://www.w3.org/2000/svg"><title>Poori kitaab ka naksha. Beech me vaakya, chaaron taraf aath kaam — aur har kaam ka apna rang.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--role-adj:#9333ea;--role-adv:#db2777;--role-conj:#65a30d;--role-interj:#e11d48;--role-noun:#2563eb;--role-prep:#ea580c;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .hub { fill: var(--card); stroke: var(--ink-300); stroke-width: 2; }
              .hubt { font: 800 15px var(--font); fill: var(--text); }
              .hubs { font: 500 11px var(--font); fill: var(--text-soft); }
              .node { stroke-width: 2; fill: var(--card); }
              .nt { font: 800 12.5px var(--font); }
              .ns { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .spoke { stroke: var(--ink-300); stroke-width: 1.4; stroke-dasharray: 3 4; }
            </style>
          </defs>

          <!-- spokes -->
          <g class="spoke">
            <line x1="340" y1="210" x2="112" y2="60"/>
            <line x1="340" y1="210" x2="340" y2="56"/>
            <line x1="340" y1="210" x2="568" y2="60"/>
            <line x1="340" y1="210" x2="76" y2="150"/>
            <line x1="340" y1="210" x2="604" y2="150"/>
            <line x1="340" y1="210" x2="112" y2="360"/>
            <line x1="340" y1="210" x2="340" y2="366"/>
            <line x1="340" y1="210" x2="568" y2="360"/>
          </g>

          <!-- hub -->
          <ellipse class="hub" cx="340" cy="210" rx="92" ry="44"/>
          <text class="hubt" x="340" y="205" text-anchor="middle">VAAKYA</text>
          <text class="hubs" x="340" y="224" text-anchor="middle">har shabd ka ek kaam</text>

          <!-- noun -->
          <g transform="translate(112 60)">
            <rect class="node" x="-66" y="-24" width="132" height="48" rx="10" stroke="var(--role-noun)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-noun)">NOUN</text>
            <text class="ns" x="0" y="13" text-anchor="middle">naam — Ravi, city, love</text>
          </g>

          <!-- pronoun -->
          <g transform="translate(340 56)">
            <rect class="node" x="-66" y="-24" width="132" height="48" rx="10" stroke="var(--role-pron)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-pron)">PRONOUN</text>
            <text class="ns" x="0" y="13" text-anchor="middle">naam ki jagah — he, it</text>
          </g>

          <!-- verb -->
          <g transform="translate(568 60)">
            <rect class="node" x="-66" y="-24" width="132" height="48" rx="10" stroke="var(--role-verb)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-verb)">VERB</text>
            <text class="ns" x="0" y="13" text-anchor="middle">kaam — run, is, think</text>
          </g>

          <!-- adjective -->
          <g transform="translate(76 150)">
            <rect class="node" x="-66" y="-22" width="132" height="44" rx="10" stroke="var(--role-adj)"/>
            <text class="nt" x="0" y="-3" text-anchor="middle" fill="var(--role-adj)">ADJECTIVE</text>
            <text class="ns" x="0" y="13" text-anchor="middle">kaisa — tall, blue</text>
          </g>

          <!-- adverb -->
          <g transform="translate(604 150)">
            <rect class="node" x="-66" y="-22" width="132" height="44" rx="10" stroke="var(--role-adv)"/>
            <text class="nt" x="0" y="-3" text-anchor="middle" fill="var(--role-adv)">ADVERB</text>
            <text class="ns" x="0" y="13" text-anchor="middle">kaise — slowly, very</text>
          </g>

          <!-- preposition -->
          <g transform="translate(112 360)">
            <rect class="node" x="-66" y="-24" width="132" height="48" rx="10" stroke="var(--role-prep)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-prep)">PREPOSITION</text>
            <text class="ns" x="0" y="13" text-anchor="middle">rishta — in, on, under</text>
          </g>

          <!-- conjunction -->
          <g transform="translate(340 366)">
            <rect class="node" x="-70" y="-24" width="140" height="48" rx="10" stroke="var(--role-conj)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-conj)">CONJUNCTION</text>
            <text class="ns" x="0" y="13" text-anchor="middle">jod — and, but, because</text>
          </g>

          <!-- interjection -->
          <g transform="translate(568 360)">
            <rect class="node" x="-70" y="-24" width="140" height="48" rx="10" stroke="var(--role-interj)"/>
            <text class="nt" x="0" y="-4" text-anchor="middle" fill="var(--role-interj)">INTERJECTION</text>
            <text class="ns" x="0" y="13" text-anchor="middle">bhaav — Oh! Wow!</text>
          </g>
        </svg>