<svg viewBox="0 0 640 282" role="img" aria-label="Samay ki rekha: aaj (now) se peeche past ki taraf teen teer — should have gone (jaana chahiye tha), could have won (jeet sakte the), must have left (chala gaya hoga). Neeche formula: modal plus have plus V3." xmlns="http://www.w3.org/2000/svg"><title>Teeno teer aaj se peeche jaate hain — hum abhi khade hokar beete hue kal ke baare me bol rahe hain.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adv:#db2777;--role-prep:#ea580c;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pm-line { fill: none; stroke: var(--text); stroke-width: 2.4; }
              .pm-guide { fill: none; stroke: var(--accent-line); stroke-width: 1.5; stroke-dasharray: 4 5; }
              .pm-arr { fill: none; stroke-width: 2.4; }
              .pm-pt { fill: var(--accent); }
              .pm-w { font: 800 13.5px var(--font); }
              .pm-m { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .pm-lb { font: 800 12px var(--font); fill: var(--text); }
              .pm-g { font: 500 11px var(--font); fill: var(--text-soft); }
              .pm-f { font: 800 17px var(--font); fill: var(--accent); }
            </style>
            <marker id="pmA1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/></marker>
            <marker id="pmA2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--role-adv)"/></marker>
            <marker id="pmA3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--role-prep)"/></marker>
          </defs>

          <path class="pm-guide" d="M200 14 L200 172"/>
          <path class="pm-guide" d="M480 14 L480 172"/>

          <text class="pm-w" x="340" y="30" text-anchor="middle" fill="var(--role-verb)">should have gone</text>
          <path class="pm-arr" stroke="var(--role-verb)" d="M470 38 L212 38" marker-end="url(#pmA1)"/>
          <text class="pm-m" x="340" y="55" text-anchor="middle">jaana chahiye tha — afsos</text>

          <text class="pm-w" x="340" y="82" text-anchor="middle" fill="var(--role-adv)">could have won</text>
          <path class="pm-arr" stroke="var(--role-adv)" d="M470 90 L212 90" marker-end="url(#pmA2)"/>
          <text class="pm-m" x="340" y="107" text-anchor="middle">jeet sakte the — mauka chhoot gaya</text>

          <text class="pm-w" x="340" y="134" text-anchor="middle" fill="var(--role-prep)">must have left</text>
          <path class="pm-arr" stroke="var(--role-prep)" d="M470 142 L212 142" marker-end="url(#pmA3)"/>
          <text class="pm-m" x="340" y="159" text-anchor="middle">chala gaya hoga — pakka andaaza</text>

          <path class="pm-line" d="M30 180 L610 180"/>
          <circle class="pm-pt" cx="200" cy="180" r="8"/>
          <circle class="pm-pt" cx="480" cy="180" r="8"/>
          <text class="pm-lb" x="200" y="206" text-anchor="middle">PAST</text>
          <text class="pm-g" x="200" y="222" text-anchor="middle">jo ho chuka (ya nahi hua)</text>
          <text class="pm-lb" x="480" y="206" text-anchor="middle">NOW</text>
          <text class="pm-g" x="480" y="222" text-anchor="middle">hum aaj us par bol rahe hain</text>

          <text class="pm-f" x="320" y="254" text-anchor="middle">modal + have + V3</text>
          <text class="pm-g" x="320" y="273" text-anchor="middle">should have · could have · must have · might have · can't have</text>
        </svg>