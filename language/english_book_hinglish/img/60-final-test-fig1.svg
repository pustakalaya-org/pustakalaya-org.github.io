<svg viewBox="0 0 680 280" role="img" aria-label="Patti chart jo dikhati hai ki 30 sawaal kitaab ke paanch hisson me kaise baate gaye hain" xmlns="http://www.w3.org/2000/svg"><title>Test ka naksha. Score se zyada zaroori ye hai ki galtiyan kis rang me jamaa hui hain.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .s1 { fill: var(--role-noun); }
              .s2 { fill: var(--role-verb); }
              .s3 { fill: var(--role-adv); }
              .s4 { fill: var(--brand-500); }
              .s5 { fill: var(--role-adj); }
              .num { font: 800 15px var(--font); fill: #ffffff; }
              .lg { font: 600 12px var(--font); fill: var(--text); }
              .lgs { font: 500 11px var(--font); fill: var(--text-soft); }
              .ttl { font: 700 12px var(--font); fill: var(--text-soft); }
              .sw { rx: 3; }
            </style>
          </defs>

          <text class="ttl" x="40" y="30">30 sawaal, paanch hisse</text>

          <rect class="s1" x="40" y="44" width="98" height="46" rx="7"/>
          <rect class="s2" x="140" y="44" width="258" height="46" rx="7"/>
          <rect class="s3" x="400" y="44" width="38" height="46" rx="7"/>
          <rect class="s4" x="440" y="44" width="158" height="46" rx="7"/>
          <rect class="s5" x="600" y="44" width="38" height="46" rx="7"/>

          <text class="num" x="89" y="74" text-anchor="middle">5</text>
          <text class="num" x="269" y="74" text-anchor="middle">13</text>
          <text class="num" x="419" y="74" text-anchor="middle">2</text>
          <text class="num" x="519" y="74" text-anchor="middle">8</text>
          <text class="num" x="619" y="74" text-anchor="middle">2</text>

          <rect class="s1" x="40" y="118" width="14" height="14" rx="3"/>
          <text class="lg" x="62" y="130">Grammar ki buniyaad</text>
          <text class="lgs" x="62" y="146">noun, pronoun, verb, preposition, adjective</text>

          <rect class="s2" x="40" y="166" width="14" height="14" rx="3"/>
          <text class="lg" x="62" y="178">Vaakya banana</text>
          <text class="lgs" x="62" y="194">tenses, articles, sawaal, agreement, voice, punctuation</text>

          <rect class="s3" x="40" y="214" width="14" height="14" rx="3"/>
          <text class="lg" x="62" y="226">Bolna seekho</text>
          <text class="lgs" x="62" y="242">uchchaaran, rhythm, filler words</text>

          <rect class="s4" x="372" y="118" width="14" height="14" rx="3"/>
          <text class="lg" x="394" y="130">Shabd-bhandar</text>
          <text class="lgs" x="394" y="146">native phrases, verbs, adjectives,</text>
          <text class="lgs" x="394" y="160">advanced shabd, phrasal verbs, idioms</text>

          <rect class="s5" x="372" y="190" width="14" height="14" rx="3"/>
          <text class="lg" x="394" y="202">Galtiyan sudhaaro</text>
          <text class="lgs" x="394" y="218">Indian English ki aadatein</text>

          <text class="lgs" x="372" y="248">Ek rang me zyada galti? Us hisse me waapas jaao.</text>
