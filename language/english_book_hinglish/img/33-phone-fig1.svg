<svg viewBox="0 0 480 450" role="img" aria-label="Phone call ka flowchart: phone bajta hai, greeting aur naam, kaam batana, phir sawaal ki wo available hain. Haan to baat karo, nahi to message lo ya chhodo. Dono raaste wrap up aur bye par khatam." xmlns="http://www.w3.org/2000/svg"><title>Har call isi naqshe par chalti hai — aap call karo ya uthao. Beech ka sawaal (&quot;available hain?&quot;)
        hi tay karta hai ki raasta kaunsa hoga.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cf-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .cf-n2 { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .cf-d { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .cf-end { fill: var(--accent); }
              .cf-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#cf-ar); }
              .cf-t { font: 700 14px var(--font); fill: var(--text); }
              .cf-s { font: italic 500 12.5px var(--font); fill: var(--text-soft); }
              .cf-b { font: 700 12px var(--font); fill: var(--accent); }
              .cf-w { font: 700 14px var(--font); fill: var(--sheet); }
            </style>
            <marker id="cf-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>

          <rect class="cf-n2" x="140" y="10" width="200" height="44" rx="22"/>
          <text class="cf-t" x="240" y="37" text-anchor="middle">Phone bajta hai</text>
          <path class="cf-ln" d="M240 56 L240 76"/>

          <rect class="cf-n" x="90" y="80" width="300" height="56" rx="10"/>
          <text class="cf-t" x="240" y="103" text-anchor="middle">Greeting + naam</text>
          <text class="cf-s" x="240" y="123" text-anchor="middle">"Hello, this is Arjun from BlueLeaf."</text>
          <path class="cf-ln" d="M240 138 L240 158"/>

          <rect class="cf-n" x="90" y="162" width="300" height="56" rx="10"/>
          <text class="cf-t" x="240" y="185" text-anchor="middle">Kaam batao</text>
          <text class="cf-s" x="240" y="205" text-anchor="middle">"I'm calling about the invoice."</text>
          <path class="cf-ln" d="M240 220 L240 238"/>

          <polygon class="cf-d" points="240,242 340,277 240,312 140,277"/>
          <text class="cf-t" x="240" y="282" text-anchor="middle">Wo available hain?</text>

          <path class="cf-ln" d="M140 277 L95 277 L95 328"/>
          <text class="cf-b" x="112" y="268" text-anchor="middle">Haan</text>
          <path class="cf-ln" d="M340 277 L385 277 L385 328"/>
          <text class="cf-b" x="368" y="268" text-anchor="middle">Nahi</text>

          <rect class="cf-n2" x="10" y="332" width="170" height="52" rx="10"/>
          <text class="cf-t" x="95" y="354" text-anchor="middle">Baat karo</text>
          <text class="cf-s" x="95" y="373" text-anchor="middle">"Is this a good time?"</text>

          <rect class="cf-n2" x="300" y="332" width="170" height="52" rx="10"/>
          <text class="cf-t" x="385" y="354" text-anchor="middle">Message lo / chhodo</text>
          <text class="cf-s" x="385" y="373" text-anchor="middle">"Can I leave a message?"</text>

          <path class="cf-ln" d="M95 386 L95 418 L134 418"/>
          <path class="cf-ln" d="M385 386 L385 418 L346 418"/>
          <rect class="cf-end" x="140" y="400" width="200" height="36" rx="18"/>
          <text class="cf-w" x="240" y="423" text-anchor="middle">Wrap up + Bye</text>
        </svg>