<svg viewBox="0 0 640 230" role="img" aria-label="Kahani ki timeline: pehle flight book ki aur ID ghar par chhod di (past perfect), phir security queue me khade the (past continuous), tabhi yaad aaya (past simple), phir suitcase Delhi chala gaya tha" xmlns="http://www.w3.org/2000/svg"><title>&quot;had + V3&quot; sunte hi socho: ye aur bhi pehle hua tha . &quot;were + -ing&quot; = pardaa
    (background), aur beech me ek past simple ghatna — kahani ka jhatka.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line-strong:#cfd6e2;--role-adv:#db2777;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .tl-ln { fill: none; stroke: var(--line-strong); stroke-width: 3; marker-end: url(#tl-arrow); }
       .tl-pp { fill: var(--role-adv); }
       .tl-pc { fill: var(--accent-2); opacity: 0.35; }
       .tl-ps { fill: var(--accent); }
       .tl-t { font: 700 13px var(--font); fill: var(--text); }
       .tl-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .tl-k { font: 800 12px var(--font); }
      </style>
      <marker id="tl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong)"/>
      </marker>
     </defs>
     <path class="tl-ln" d="M20 110 H624"/>
     <text class="tl-s" x="610" y="134" text-anchor="end">time →</text>

     <circle class="tl-pp" cx="70" cy="110" r="10"/>
     <text class="tl-t" x="70" y="80" text-anchor="middle">had booked</text>
     <text class="tl-t" x="70" y="62" text-anchor="middle">had left ID</text>
     <text class="tl-k" x="70" y="140" text-anchor="middle" fill="var(--role-adv)">past perfect</text>
     <text class="tl-s" x="70" y="156" text-anchor="middle">sabse pehle</text>

     <rect class="tl-pc" x="170" y="98" width="200" height="24" rx="12"/>
     <text class="tl-t" x="270" y="80" text-anchor="middle">were standing in the queue</text>
     <text class="tl-k" x="270" y="140" text-anchor="middle" fill="var(--accent-2)">past continuous</text>
     <text class="tl-s" x="270" y="156" text-anchor="middle">chal raha tha…</text>

     <circle class="tl-ps" cx="320" cy="110" r="10"/>
     <text class="tl-t" x="320" y="196" text-anchor="middle">I realised!</text>
     <text class="tl-k" x="320" y="214" text-anchor="middle" fill="var(--accent)">past simple — beech me ghatna</text>

     <circle class="tl-ps" cx="440" cy="110" r="8"/>
     <text class="tl-t" x="440" y="80" text-anchor="middle">downloaded</text>
     <circle class="tl-ps" cx="540" cy="110" r="8"/>
     <text class="tl-t" x="540" y="80" text-anchor="middle">landed</text>
     <text class="tl-s" x="540" y="62" text-anchor="middle">bag had gone</text>
     <text class="tl-s" x="540" y="46" text-anchor="middle">to Delhi</text>
    </svg>