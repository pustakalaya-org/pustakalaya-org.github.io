<svg viewBox="0 0 640 290" role="img" aria-label="Ek idea ka filter: topic se judi lines kipp me jaakar ek saaf paragraph banti hain, aur alag idea wali line bahar nikal kar naye paragraph me jaati hai" xmlns="http://www.w3.org/2000/svg"><title>Canteen ki baat sach ho sakti hai — par wo library wale paragraph ki nahi hai.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--accent-softer:color-mix(in srgb, #ea580c 5%, #ffffff);--bad:#be123c;--bad-bg:#fdecef;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fi-fun { fill: var(--accent-softer); stroke: var(--accent); stroke-width: 2; }
              .fi-ok { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.5; }
              .fi-no { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 1.5; }
              .fi-out { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .fi-l { fill: none; stroke: var(--good); stroke-width: 2; }
              .fi-lx { fill: none; stroke: var(--bad); stroke-width: 2; stroke-dasharray: 5 5; }
              .fi-t { font: 600 11.5px var(--font); fill: var(--text); }
              .fi-h { font: 800 12px var(--font); fill: var(--accent-ink); }
              .fi-s { font: 500 11px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="fi-ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--good)"/>
            </marker>
            <marker id="fi-ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/>
            </marker>
          </defs>

          <rect class="fi-ok" x="16" y="30" width="180" height="34" rx="17"/>
          <text class="fi-t" x="106" y="52" text-anchor="middle">Students work by day</text>
          <rect class="fi-ok" x="16" y="80" width="180" height="34" rx="17"/>
          <text class="fi-t" x="106" y="102" text-anchor="middle">Rented rooms are crowded</text>
          <rect class="fi-no" x="16" y="130" width="180" height="34" rx="17"/>
          <text class="fi-t" x="106" y="152" text-anchor="middle">Canteen food is bad</text>

          <path class="fi-l" d="M196 47 C 230 47, 240 60, 262 64" marker-end="url(#fi-ag)"/>
          <path class="fi-l" d="M196 97 C 230 97, 245 84, 268 78" marker-end="url(#fi-ag)"/>
          <path class="fi-lx" d="M196 147 C 300 190, 420 196, 470 168" marker-end="url(#fi-ab)"/>

          <path class="fi-fun" d="M250 30 H430 L360 130 V182 H320 V130 Z"/>
          <text class="fi-h" x="340" y="54" text-anchor="middle">TOPIC</text>
          <text class="fi-s" x="340" y="72" text-anchor="middle">Library should</text>
          <text class="fi-s" x="340" y="88" text-anchor="middle">stay open late</text>

          <rect class="fi-no" x="440" y="120" width="184" height="46" rx="10"/>
          <text class="fi-t" x="532" y="140" text-anchor="middle">Alag idea!</text>
          <text class="fi-s" x="532" y="157" text-anchor="middle">Naya paragraph — ya hatao</text>

          <path class="fi-l" d="M340 182 V214" marker-end="url(#fi-ag)"/>
          <rect class="fi-out" x="220" y="220" width="240" height="50" rx="12"/>
          <text class="fi-h" x="340" y="242" text-anchor="middle">Ek saaf paragraph</text>
          <text class="fi-s" x="340" y="259" text-anchor="middle">Har line topic ko support karti hai</text>
        </svg>