<svg viewBox="0 0 480 250" role="img" aria-label="Care se do raaste: plus ful se careful aur phir plus ly se carefully; plus less se careless aur phir plus ly se carelessly." xmlns="http://www.w3.org/2000/svg"><title>Ek jad, chaar shabd. Upar ka raasta &quot;dhyaan se&quot;, neeche ka &quot;laaparwaahi se&quot;.</title><style>svg{--accent:#ea580c;--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cv-r { fill: var(--accent-soft); stroke: var(--role-noun); stroke-width: 2.5; }
              .cv-a { fill: var(--sheet); stroke: var(--role-adj); stroke-width: 2; }
              .cv-v { fill: var(--sheet); stroke: var(--role-adv); stroke-width: 2; }
              .cv-ln { fill: none; stroke: var(--accent); stroke-width: 2.5; marker-end: url(#cv-ar); }
              .cv-w { font: 700 15px var(--font); fill: var(--text); }
              .cv-ln2 { font: 600 11.5px var(--font); fill: var(--role-noun); }
              .cv-la { font: 600 11.5px var(--font); fill: var(--role-adj); }
              .cv-lv { font: 600 11.5px var(--font); fill: var(--role-adv); }
              .cv-tag { font: 800 13px var(--font); fill: var(--accent); }
              .cv-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="cv-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>

          <rect class="cv-r" x="6" y="100" width="112" height="50" rx="10"/>
          <text class="cv-w" x="62" y="124" text-anchor="middle">care</text>
          <text class="cv-ln2" x="62" y="141" text-anchor="middle">noun / verb</text>

          <path class="cv-ln" d="M120 112 C150 112 150 55 180 55"/>
          <text class="cv-tag" x="132" y="70">+ful</text>
          <path class="cv-ln" d="M120 138 C150 138 150 195 180 195"/>
          <text class="cv-tag" x="128" y="190">+less</text>

          <rect class="cv-a" x="184" y="30" width="112" height="50" rx="10"/>
          <text class="cv-w" x="240" y="54" text-anchor="middle">careful</text>
          <text class="cv-la" x="240" y="71" text-anchor="middle">adjective</text>
          <rect class="cv-a" x="184" y="170" width="112" height="50" rx="10"/>
          <text class="cv-w" x="240" y="194" text-anchor="middle">careless</text>
          <text class="cv-la" x="240" y="211" text-anchor="middle">adjective</text>

          <path class="cv-ln" d="M298 55 L358 55"/>
          <text class="cv-tag" x="328" y="46" text-anchor="middle">+ly</text>
          <path class="cv-ln" d="M298 195 L358 195"/>
          <text class="cv-tag" x="328" y="186" text-anchor="middle">+ly</text>

          <rect class="cv-v" x="362" y="30" width="112" height="50" rx="10"/>
          <text class="cv-w" x="418" y="54" text-anchor="middle">carefully</text>
          <text class="cv-lv" x="418" y="71" text-anchor="middle">adverb</text>
          <rect class="cv-v" x="362" y="170" width="112" height="50" rx="10"/>
          <text class="cv-w" x="418" y="194" text-anchor="middle">carelessly</text>
          <text class="cv-lv" x="418" y="211" text-anchor="middle">adverb</text>

          <text class="cv-s" x="240" y="244" text-anchor="middle">-ful = bhara hua · -less = bina · -ly = kaise (adverb)</text>
        </svg>