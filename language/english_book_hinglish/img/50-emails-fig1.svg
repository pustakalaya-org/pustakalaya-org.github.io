<svg viewBox="0 0 680 420" role="img" aria-label="Email ki banawat: subject, greeting, opening line, body, call to action, aur sign-off ke saath signature — har hissa label ke saath" xmlns="http://www.w3.org/2000/svg"><title>Har professional email ke chhe hisse. Is chapter me hum ek-ek karke sabko banayenge.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--line-strong:#cfd6e2;--sheet:#ffffff;--sheet-2:#f7f8fb;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .em-win { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.6; }
              .em-bar { fill: var(--sheet-2); stroke: var(--line); stroke-width: 1; }
              .em-dot { fill: var(--line-strong); }
              .em-sub { font: 800 12.5px var(--font); fill: var(--text); }
              .em-t { font: 600 12px var(--font); fill: var(--text); }
              .em-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .em-cta { font: 800 12px var(--font); fill: var(--accent-ink); }
              .em-txt { fill: var(--line-strong); }
              .em-ul { fill: none; stroke: var(--line); stroke-width: 1.2; }
              .em-ld { fill: none; stroke: var(--accent-2); stroke-width: 1.6; }
              .em-no { fill: var(--accent); }
              .em-n { font: 800 11px var(--font); fill: var(--sheet); }
              .em-h { font: 800 12.5px var(--font); fill: var(--text); }
            </style>
          </defs>

          <rect class="em-win" x="16" y="16" width="400" height="388" rx="12"/>
          <rect class="em-bar" x="16" y="16" width="400" height="30" rx="12"/>
          <circle class="em-dot" cx="34" cy="31" r="4.5"/>
          <circle class="em-dot" cx="50" cy="31" r="4.5"/>
          <circle class="em-dot" cx="66" cy="31" r="4.5"/>

          <text class="em-sub" x="32" y="74">Subject: Site visit — move to Tue, 13 Oct?</text>
          <path class="em-ul" d="M32 86 H400"/>

          <text class="em-t" x="32" y="112">Dear Mr Deshpande,</text>

          <text class="em-s" x="32" y="142">I am writing to ask if we can move Thursday's</text>
          <text class="em-s" x="32" y="158">site visit to Tuesday, 13 October.</text>

          <rect class="em-txt" x="32" y="180" width="350" height="7" rx="3.5"/>
          <rect class="em-txt" x="32" y="196" width="330" height="7" rx="3.5"/>
          <rect class="em-txt" x="32" y="212" width="210" height="7" rx="3.5"/>
          <rect class="em-txt" x="32" y="234" width="340" height="7" rx="3.5"/>
          <rect class="em-txt" x="32" y="250" width="180" height="7" rx="3.5"/>

          <text class="em-cta" x="32" y="286">Could you please confirm by Friday?</text>

          <text class="em-t" x="32" y="326">Kind regards,</text>
          <text class="em-t" x="32" y="344">Arjun Nair</text>
          <text class="em-s" x="32" y="362">Project Coordinator, Brightline Interiors</text>

          <path class="em-ld" d="M416 70 H446"/>
          <circle class="em-no" cx="458" cy="70" r="11"/>
          <text class="em-n" x="458" y="74" text-anchor="middle">1</text>
          <text class="em-h" x="476" y="66">Subject</text>
          <text class="em-s" x="476" y="82">topic + date / sawaal</text>

          <path class="em-ld" d="M416 108 H446"/>
          <circle class="em-no" cx="458" cy="108" r="11"/>
          <text class="em-n" x="458" y="112" text-anchor="middle">2</text>
          <text class="em-h" x="476" y="104">Greeting</text>
          <text class="em-s" x="476" y="120">Dear / Hi + naam</text>

          <path class="em-ld" d="M416 150 H446"/>
          <circle class="em-no" cx="458" cy="150" r="11"/>
          <text class="em-n" x="458" y="154" text-anchor="middle">3</text>
          <text class="em-h" x="476" y="146">Opening line</text>
          <text class="em-s" x="476" y="162">kyun likh rahe ho</text>

          <path class="em-ld" d="M416 216 H446"/>
          <circle class="em-no" cx="458" cy="216" r="11"/>
          <text class="em-n" x="458" y="220" text-anchor="middle">4</text>
          <text class="em-h" x="476" y="212">Body</text>
          <text class="em-s" x="476" y="228">details, chhote paragraph</text>

          <path class="em-ld" d="M416 282 H446"/>
          <circle class="em-no" cx="458" cy="282" r="11"/>
          <text class="em-n" x="458" y="286" text-anchor="middle">5</text>
          <text class="em-h" x="476" y="278">Call to action</text>
          <text class="em-s" x="476" y="294">kya chahiye, kab tak</text>

          <path class="em-ld" d="M416 340 H446"/>
          <circle class="em-no" cx="458" cy="340" r="11"/>
          <text class="em-n" x="458" y="344" text-anchor="middle">6</text>
          <text class="em-h" x="476" y="336">Sign-off + signature</text>
          <text class="em-s" x="476" y="352">naam, pad, company</text>
        </svg>