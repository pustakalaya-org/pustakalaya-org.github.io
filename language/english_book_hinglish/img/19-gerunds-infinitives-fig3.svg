<svg viewBox="0 0 640 244" role="img" aria-label="Test: 'to' ke baad koi noun rakh ke dekho. Agar noun fit hota hai, jaise look forward to the party, to 'to' preposition hai aur verb -ing lega — look forward to meeting you. Agar fit nahi hota, jaise want to the party, to 'to' infinitive hai aur V1 aayega — want to meet you." xmlns="http://www.w3.org/2000/svg"><title>&quot;to&quot; ke baad &quot;the party&quot; jaisa noun baith jaaye, to wo preposition hai — aur verb -ing lega.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-prep:#ea580c;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .tt-top { fill: var(--accent); }
              .tt-tt { font: 800 13.5px var(--font); fill: #fff; }
              .tt-box { fill: var(--sheet); stroke-width: 2.2; }
              .tt-hd { font: 800 13px var(--font); fill: var(--text); }
              .tt-t { font: 600 12px var(--font); fill: var(--text-soft); }
              .tt-big { font: 800 14.5px var(--font); }
              .tt-ex { font: 700 12.5px var(--font); fill: var(--text); }
              .tt-cn { fill: none; stroke: var(--text-soft); stroke-width: 1.7; }
            </style>
          </defs>

          <rect class="tt-top" x="140" y="8" width="360" height="36" rx="18"/>
          <text class="tt-tt" x="320" y="31" text-anchor="middle">Test: "to" ke baad koi noun rakh ke dekho</text>

          <path class="tt-cn" d="M320 44 L320 60 L170 60 L170 78"/>
          <path class="tt-cn" d="M320 60 L470 60 L470 78"/>

          <rect class="tt-box" x="30" y="78" width="280" height="154" rx="12" stroke="var(--role-prep)"/>
          <text class="tt-hd" x="170" y="102" text-anchor="middle">Noun fit hota hai ✓</text>
          <text class="tt-t" x="170" y="124" text-anchor="middle">look forward to the party ✓</text>
          <text class="tt-big" x="170" y="154" text-anchor="middle" fill="var(--role-prep)">to = preposition</text>
          <text class="tt-big" x="170" y="176" text-anchor="middle" fill="var(--role-prep)">→ verb-ing</text>
          <text class="tt-ex" x="170" y="210" text-anchor="middle">look forward to meeting you</text>

          <rect class="tt-box" x="330" y="78" width="280" height="154" rx="12" stroke="var(--role-noun)"/>
          <text class="tt-hd" x="470" y="102" text-anchor="middle">Noun fit nahi hota ✗</text>
          <text class="tt-t" x="470" y="124" text-anchor="middle">I want to the party ✗</text>
          <text class="tt-big" x="470" y="154" text-anchor="middle" fill="var(--role-noun)">to = infinitive</text>
          <text class="tt-big" x="470" y="176" text-anchor="middle" fill="var(--role-noun)">→ V1</text>
          <text class="tt-ex" x="470" y="210" text-anchor="middle">I want to meet you</text>
        </svg>