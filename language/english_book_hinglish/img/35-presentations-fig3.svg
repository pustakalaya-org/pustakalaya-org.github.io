<svg viewBox="0 0 480 300" role="img" aria-label="Kahani ka arc: Situation se shuru hokar Problem aur Koshish se upar chadhta hai, Turning point par sabse upar, phir Result aur Lesson par utarta hai." xmlns="http://www.w3.org/2000/svg"><title>Pahaad ki choti = mod, jahan sab badla. Wahan aawaaz dheemi karo aur ek pal ruko.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ar-c { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
              .ar-base { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
              .ar-d { fill: var(--accent); }
              .ar-pk { fill: var(--accent-2); }
              .ar-t { font: 700 13.5px var(--font); fill: var(--text); }
              .ar-s { font: italic 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <path class="ar-base" d="M20 290 L470 290"/>
          <path class="ar-c" d="M40 240 C90 230 110 215 130 200 C165 175 190 160 220 140 C255 115 275 70 300 70 C330 70 350 115 380 140 C405 160 430 172 450 180"/>

          <circle class="ar-d" cx="40" cy="240" r="7"/>
          <circle class="ar-d" cx="130" cy="200" r="7"/>
          <circle class="ar-d" cx="220" cy="140" r="7"/>
          <circle class="ar-pk" cx="300" cy="70" r="9"/>
          <circle class="ar-d" cx="380" cy="140" r="7"/>
          <circle class="ar-d" cx="450" cy="180" r="7"/>

          <text class="ar-t" x="28" y="266">Situation</text>
          <text class="ar-s" x="28" y="283">"Last year, we…"</text>
          <text class="ar-t" x="142" y="228">Problem</text>
          <text class="ar-s" x="142" y="245">"Then one day…"</text>
          <text class="ar-t" x="232" y="168">Koshish</text>
          <text class="ar-s" x="232" y="185">"We tried…"</text>
          <text class="ar-t" x="300" y="34" text-anchor="middle">Turning point</text>
          <text class="ar-s" x="300" y="51" text-anchor="middle">"Then we realised…"</text>
          <text class="ar-t" x="368" y="172" text-anchor="end">Result</text>
          <text class="ar-s" x="368" y="189" text-anchor="end">"As a result…"</text>
          <text class="ar-t" x="460" y="210" text-anchor="end">Lesson</text>
          <text class="ar-s" x="460" y="227" text-anchor="end">"What I learnt…"</text>
        </svg>