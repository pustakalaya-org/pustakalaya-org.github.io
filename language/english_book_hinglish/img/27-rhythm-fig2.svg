<svg viewBox="0 0 680 290" role="img" aria-label="Ek vaakya ki taal ki patti: content words bade aur ooncche dikhaye gaye hain, function words chhote aur dabe hue, teen zor wale beat ke saath" xmlns="http://www.w3.org/2000/svg"><title>Pehle sirf narangi shabd bolo — WANT · BUY · TICKet · MORNing · TRAIN .
        Phir beech wale chhote shabd bina zor ke bhar do. Poora vaakya apne aap sahi taal me aa jaayega.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--line:#e3e7ef;--role-adv:#db2777;--role-prep:#ea580c;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .beat { fill: var(--brand-500); }
              .flat { fill: var(--ink-200); }
              .big { font: 800 15px var(--font); fill: var(--role-prep); }
              .small2 { font: 500 11px var(--font); fill: var(--text-soft); }
              .cap2 { font: 500 12px var(--font); fill: var(--text-soft); }
              .hd4 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
              .tick { stroke: var(--role-adv); stroke-width: 2; stroke-dasharray: 3 4; }
              .tl { stroke: var(--line); stroke-width: 1.2; }
            </style>
          </defs>

          <text class="hd4" x="12" y="18">"I WANT TO BUY A TICKET FOR THE MORNING TRAIN"</text>

          <!-- baseline -->
          <line class="tl" x1="12" y1="140" x2="668" y2="140"/>

          <!-- blobs: I(small) WANT(big) to(small) BUY(big) a(small) TICKet(big) for(small) the(small) MORNing(big) TRAIN(big) -->
          <g>
            <circle class="flat" cx="30" cy="132" r="8"/>
            <text class="small2" x="30" y="166" text-anchor="middle">I</text>

            <circle class="beat" cx="86" cy="112" r="24"/>
            <text class="big" x="86" y="166" text-anchor="middle">WANT</text>

            <circle class="flat" cx="140" cy="132" r="8"/>
            <text class="small2" x="140" y="166" text-anchor="middle">to</text>

            <circle class="beat" cx="196" cy="112" r="24"/>
            <text class="big" x="196" y="166" text-anchor="middle">BUY</text>

            <circle class="flat" cx="248" cy="133" r="7"/>
            <text class="small2" x="248" y="166" text-anchor="middle">a</text>

            <circle class="beat" cx="306" cy="112" r="24"/>
            <text class="big" x="306" y="166" text-anchor="middle">TICK-et</text>

            <circle class="flat" cx="372" cy="132" r="8"/>
            <text class="small2" x="372" y="166" text-anchor="middle">for</text>

            <circle class="flat" cx="412" cy="133" r="7"/>
            <text class="small2" x="412" y="166" text-anchor="middle">the</text>

            <circle class="beat" cx="476" cy="112" r="24"/>
            <text class="big" x="476" y="166" text-anchor="middle">MOR-ning</text>

            <circle class="beat" cx="580" cy="112" r="24"/>
            <text class="big" x="580" y="166" text-anchor="middle">TRAIN</text>
          </g>

          <!-- beat ticks -->
          <line class="tick" x1="86" y1="60" x2="86" y2="86"/>
          <line class="tick" x1="196" y1="60" x2="196" y2="86"/>
          <line class="tick" x1="306" y1="60" x2="306" y2="86"/>
          <line class="tick" x1="476" y1="60" x2="476" y2="86"/>
          <line class="tick" x1="580" y1="60" x2="580" y2="86"/>
          <text class="small2" x="12" y="52">↓ paanch beat — tabla ki thaap jaise</text>

          <text class="cap2" x="12" y="210">Bade narangi gole = zor wale shabd. Chhote slate gole = dabe hue shabd.</text>
          <text class="cap2" x="12" y="232">Dabe shabd tezi se, bina mehnat, lagbhag nigal kar: "to" → tuh, "a" → uh, "for" → fuh, "the" → thuh.</text>
          <text class="cap2" x="12" y="254">Zor wale shabdon ke beech ka faasla lagbhag barabar rehta hai — isi liye taal banti hai.</text>
          <text class="cap2" x="12" y="276">Yahi hai wo "music" jo English me hoti hai aur sapaat bolne me gayab ho jaati hai.</text>
        </svg>