<svg viewBox="0 0 480 370" role="img" aria-label="Raay ki seedhi: I might be wrong but sabse naram, phir I feel, I think, In my view, aur I'm convinced sabse pakka." xmlns="http://www.w3.org/2000/svg"><title>Roz ki baat-cheet me beech ki seedhi (&quot;I think&quot;) sabse safe hai. Sabse upar wala step tab,
        jab aapke paas pakki wajah ho.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ld-s { fill: var(--accent); }
              .ld-p { font: 700 13px var(--font); fill: var(--text); }
              .ld-ax { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#ld-ar); }
              .ld-k { font: 800 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
              .ld-n { font: 600 13px var(--font); fill: var(--accent-2); }
              .ld-n2 { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="ld-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>

          <text class="ld-n" x="20" y="30">"To be honest…" seedhi ka hissa nahi —</text>
          <text class="ld-n2" x="20" y="50">ye signal hai ki ab sach aa raha hai, shayad kadwa.</text>

          <rect class="ld-s" x="20" y="270" width="88" height="50" rx="6" opacity="0.22"/>
          <rect class="ld-s" x="112" y="235" width="88" height="85" rx="6" opacity="0.38"/>
          <rect class="ld-s" x="204" y="200" width="88" height="120" rx="6" opacity="0.55"/>
          <rect class="ld-s" x="296" y="165" width="88" height="155" rx="6" opacity="0.75"/>
          <rect class="ld-s" x="388" y="130" width="88" height="190" rx="6" opacity="0.95"/>

          <text class="ld-p" x="64" y="242" text-anchor="middle">I might be</text>
          <text class="ld-p" x="64" y="260" text-anchor="middle">wrong, but…</text>
          <text class="ld-p" x="156" y="225" text-anchor="middle">I feel…</text>
          <text class="ld-p" x="248" y="190" text-anchor="middle">I think…</text>
          <text class="ld-p" x="340" y="137" text-anchor="middle">In my</text>
          <text class="ld-p" x="340" y="155" text-anchor="middle">view…</text>
          <text class="ld-p" x="432" y="102" text-anchor="middle">I'm</text>
          <text class="ld-p" x="432" y="120" text-anchor="middle">convinced…</text>

          <path class="ld-ax" d="M20 340 L470 340"/>
          <text class="ld-k" x="20" y="362">NARAM</text>
          <text class="ld-k" x="476" y="362" text-anchor="end">PAKKA</text>
        </svg>