<svg viewBox="0 0 640 260" role="img" aria-label="Assimilation ke chaar formula: t plus y banta hai ch, jaise don't you se doncha; d plus y banta hai j, jaise did you se didja; s plus y banta hai sh, jaise this year; n se pehle p ya b ho to m, jaise ten pounds." xmlns="http://www.w3.org/2000/svg"><title>Chaar formula, saikdon phrase. Ye aalas nahi hai — zubaan sabse chhota raasta leti hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-pron:#0891b2;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .as-a { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
              .as-b { fill: var(--sheet); stroke: var(--role-pron); stroke-width: 2.5; }
              .as-r { fill: var(--accent); }
              .as-t { font: 800 18px var(--font); fill: var(--text); }
              .as-rt { font: 800 18px var(--font); fill: var(--sheet); }
              .as-op { font: 800 18px var(--font); fill: var(--text-soft); }
              .as-e { font: italic 600 14px var(--font); fill: var(--text); }
            </style>
          </defs>

          <rect class="as-a" x="20" y="14" width="50" height="40" rx="8"/><text class="as-t" x="45" y="41" text-anchor="middle">t</text>
          <text class="as-op" x="86" y="41" text-anchor="middle">+</text>
          <rect class="as-b" x="102" y="14" width="50" height="40" rx="8"/><text class="as-t" x="127" y="41" text-anchor="middle">y</text>
          <text class="as-op" x="170" y="41" text-anchor="middle">=</text>
          <rect class="as-r" x="188" y="14" width="56" height="40" rx="8"/><text class="as-rt" x="216" y="41" text-anchor="middle">ch</text>
          <text class="as-e" x="266" y="40">don't you → "doncha" · what you → "wotcha"</text>

          <rect class="as-a" x="20" y="74" width="50" height="40" rx="8"/><text class="as-t" x="45" y="101" text-anchor="middle">d</text>
          <text class="as-op" x="86" y="101" text-anchor="middle">+</text>
          <rect class="as-b" x="102" y="74" width="50" height="40" rx="8"/><text class="as-t" x="127" y="101" text-anchor="middle">y</text>
          <text class="as-op" x="170" y="101" text-anchor="middle">=</text>
          <rect class="as-r" x="188" y="74" width="56" height="40" rx="8"/><text class="as-rt" x="216" y="101" text-anchor="middle">j</text>
          <text class="as-e" x="266" y="100">did you → "didja" · would you → "wudja"</text>

          <rect class="as-a" x="20" y="134" width="50" height="40" rx="8"/><text class="as-t" x="45" y="161" text-anchor="middle">s</text>
          <text class="as-op" x="86" y="161" text-anchor="middle">+</text>
          <rect class="as-b" x="102" y="134" width="50" height="40" rx="8"/><text class="as-t" x="127" y="161" text-anchor="middle">y</text>
          <text class="as-op" x="170" y="161" text-anchor="middle">=</text>
          <rect class="as-r" x="188" y="134" width="56" height="40" rx="8"/><text class="as-rt" x="216" y="161" text-anchor="middle">sh</text>
          <text class="as-e" x="266" y="160">this year → "thi-shear" · miss you → "mi-shoo"</text>

          <rect class="as-a" x="20" y="194" width="50" height="40" rx="8"/><text class="as-t" x="45" y="221" text-anchor="middle">n</text>
          <text class="as-op" x="86" y="221" text-anchor="middle">+</text>
          <rect class="as-b" x="102" y="194" width="50" height="40" rx="8"/><text class="as-t" x="127" y="221" text-anchor="middle">p/b</text>
          <text class="as-op" x="170" y="221" text-anchor="middle">→</text>
          <rect class="as-r" x="188" y="194" width="56" height="40" rx="8"/><text class="as-rt" x="216" y="221" text-anchor="middle">m</text>
          <text class="as-e" x="266" y="220" style="font-size:12px">ten pounds → "tem pounds" · green bag → "greem bag"</text>
        </svg>