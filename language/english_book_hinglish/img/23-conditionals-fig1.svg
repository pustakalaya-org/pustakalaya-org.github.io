<svg viewBox="0 0 720 530" role="img" aria-label="If vaakya ki chaar shaakhayein: zero conditional hamesha sach, first conditional ho sakta hai, second conditional mushkil ya kaalpanik, third conditional ab nahi ho sakta — har ek ke saath sambhaavna ki patti" xmlns="http://www.w3.org/2000/svg"><title>Dhyaan do ek khoobsurat baat: jaise-jaise sambhaavna ghatti hai, verb ek-ek kadam peeche
        ki tense me chala jaata hai. English me door ki baat purani tense me kehte hain.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--ink-300:#cbd5e1;--line:#e3e7ef;--page-alt:#eef1f6;--role-adj:#9333ea;--role-adv:#db2777;--role-noun:#2563eb;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ifc { fill: var(--brand-500); }
              .ift { font: 800 20px var(--font); fill: #fff; }
              .br  { fill: none; stroke: var(--ink-300); stroke-width: 2.2; }
              .cb  { fill: var(--page-alt); stroke: var(--line); stroke-width: 1.4; }
              .ct  { font: 800 13px var(--font); }
              .cf  { font: 600 11.5px var(--font); fill: var(--text-soft); }
              .ce  { font: 700 12px var(--font); fill: var(--text); }
              .trk { fill: var(--ink-200); }
              .pct { font: 800 12px var(--font); }
              .plb { font: 600 9.5px var(--font); fill: var(--text-soft); }
              .foot{ font: 600 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <!-- if node -->
          <circle class="ifc" cx="48" cy="258" r="32"/>
          <text class="ift" x="48" y="265" text-anchor="middle">IF</text>

          <!-- branches -->
          <path class="br" d="M80 258 C 126 258, 126 62, 172 62"/>
          <path class="br" d="M80 258 C 126 258, 126 188, 172 188"/>
          <path class="br" d="M80 258 C 126 258, 126 324, 172 324"/>
          <path class="br" d="M80 258 C 126 258, 126 450, 172 450"/>

          <!-- ZERO -->
          <g transform="translate(172 20)">
            <rect class="cb" x="0" y="0" width="356" height="84" rx="10"/>
            <text class="ct" x="16" y="24" fill="var(--role-verb)">ZERO — hamesha sach</text>
            <text class="cf" x="16" y="44">If + present simple , present simple</text>
            <text class="ce" x="16" y="66">If you heat ice, it melts.</text>
            <rect class="trk" x="376" y="30" width="120" height="12" rx="6"/>
            <rect x="376" y="30" width="120" height="12" rx="6" fill="var(--role-verb)"/>
            <text class="pct" x="436" y="22" text-anchor="middle" fill="var(--role-verb)">100%</text>
            <text class="plb" x="436" y="58" text-anchor="middle">niyam, vigyaan, aadat</text>
          </g>

          <!-- FIRST -->
          <g transform="translate(172 146)">
            <rect class="cb" x="0" y="0" width="356" height="84" rx="10"/>
            <text class="ct" x="16" y="24" fill="var(--role-noun)">FIRST — ho sakta hai</text>
            <text class="cf" x="16" y="44">If + present simple , will + V1</text>
            <text class="ce" x="16" y="66">If I get leave, I will visit you.</text>
            <rect class="trk" x="376" y="30" width="120" height="12" rx="6"/>
            <rect x="376" y="30" width="74" height="12" rx="6" fill="var(--role-noun)"/>
            <text class="pct" x="436" y="22" text-anchor="middle" fill="var(--role-noun)">~60%</text>
            <text class="plb" x="436" y="58" text-anchor="middle">asli, aane wala mauka</text>
          </g>

          <!-- SECOND -->
          <g transform="translate(172 282)">
            <rect class="cb" x="0" y="0" width="356" height="84" rx="10"/>
            <text class="ct" x="16" y="24" fill="var(--role-adj)">SECOND — mushkil / kaalpanik</text>
            <text class="cf" x="16" y="44">If + past simple , would + V1</text>
            <text class="ce" x="16" y="66">If I had a car, I would drive to Manali.</text>
            <rect class="trk" x="376" y="30" width="120" height="12" rx="6"/>
            <rect x="376" y="30" width="18" height="12" rx="6" fill="var(--role-adj)"/>
            <text class="pct" x="436" y="22" text-anchor="middle" fill="var(--role-adj)">~10%</text>
            <text class="plb" x="436" y="58" text-anchor="middle">sapna, salaah, kalpana</text>
          </g>

          <!-- THIRD -->
          <g transform="translate(172 408)">
            <rect class="cb" x="0" y="0" width="356" height="84" rx="10"/>
            <text class="ct" x="16" y="24" fill="var(--role-adv)">THIRD — ab nahi ho sakta</text>
            <text class="cf" x="16" y="44">If + had + V3 , would have + V3</text>
            <text class="ce" x="16" y="66">If I had studied, I would have passed.</text>
            <rect class="trk" x="376" y="30" width="120" height="12" rx="6"/>
            <rect x="376" y="30" width="4" height="12" rx="2" fill="var(--role-adv)"/>
            <text class="pct" x="436" y="22" text-anchor="middle" fill="var(--role-adv)">0%</text>
            <text class="plb" x="436" y="58" text-anchor="middle">pachhtaawa — waqt nikal gaya</text>
          </g>

          <text class="foot" x="360" y="518" text-anchor="middle">Patti jitni khaali, baat utni door — aur verb utna hi peeche ki tense me jaata hai.</text>
        </svg>