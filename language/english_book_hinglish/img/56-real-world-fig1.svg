<svg viewBox="0 0 640 330" role="img" aria-label="Listening strategy ka chakra: Predict, phir Gist, phir Detail, phir Check, aur wapas Predict. Beech me signposts, numbers aur names" xmlns="http://www.w3.org/2000/svg"><title>Predict → Gist → Detail → Check. Har naye audio par chakra phir se ghoomta hai. Beech wale
    teen cheezein har kadam par kaam aati hain.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .cy-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
       .cy-no { fill: var(--accent); }
       .cy-num { font: 800 14px var(--font); fill: var(--sheet); }
       .cy-t { font: 800 14px var(--font); fill: var(--accent); }
       .cy-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .cy-ar { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#cy-arrow); }
       .cy-mid { fill: var(--accent-soft); stroke: var(--accent-2); stroke-width: 1.5; }
       .cy-m { font: 700 12px var(--font); fill: var(--text); }
      </style>
      <marker id="cy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
      </marker>
     </defs>

     <rect class="cy-n" x="220" y="8" width="200" height="66" rx="12"/>
     <circle class="cy-no" cx="240" cy="30" r="12"/><text class="cy-num" x="240" y="35" text-anchor="middle">1</text>
     <text class="cy-t" x="260" y="35">PREDICT</text>
     <text class="cy-s" x="236" y="60">Kaun? Kya? Kaunse shabd?</text>

     <rect class="cy-n" x="430" y="132" width="200" height="66" rx="12"/>
     <circle class="cy-no" cx="450" cy="154" r="12"/><text class="cy-num" x="450" y="159" text-anchor="middle">2</text>
     <text class="cy-t" x="470" y="159">GIST</text>
     <text class="cy-s" x="446" y="184">Pehli baar: mudda kya hai?</text>

     <rect class="cy-n" x="220" y="256" width="200" height="66" rx="12"/>
     <circle class="cy-no" cx="240" cy="278" r="12"/><text class="cy-num" x="240" y="283" text-anchor="middle">3</text>
     <text class="cy-t" x="260" y="283">DETAIL</text>
     <text class="cy-s" x="236" y="308">Number, naam, samay, jagah</text>

     <rect class="cy-n" x="10" y="132" width="200" height="66" rx="12"/>
     <circle class="cy-no" cx="30" cy="154" r="12"/><text class="cy-num" x="30" y="159" text-anchor="middle">4</text>
     <text class="cy-t" x="50" y="159">CHECK</text>
     <text class="cy-s" x="26" y="184">Andaaza sahi tha? Kya chhoota?</text>

     <path class="cy-ar" d="M424 50 C500 60 528 90 530 126"/>
     <path class="cy-ar" d="M530 204 C528 240 500 270 426 284"/>
     <path class="cy-ar" d="M216 284 C140 270 112 240 110 204"/>
     <path class="cy-ar" d="M110 128 C112 90 140 60 214 50"/>

     <rect class="cy-mid" x="232" y="118" width="176" height="94" rx="14"/>
     <text class="cy-m" x="320" y="142" text-anchor="middle">Poore waqt kaan khule:</text>
     <text class="cy-m" x="320" y="164" text-anchor="middle">signposts (however…)</text>
     <text class="cy-m" x="320" y="184" text-anchor="middle">numbers (13 / 30)</text>
     <text class="cy-m" x="320" y="204" text-anchor="middle">names (S-H-A…)</text>
    </svg>