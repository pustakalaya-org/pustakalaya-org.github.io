<svg viewBox="0 0 640 300" role="img" aria-label="Teen clue — Words, Tone aur Situation — milkar Feeling batate hain. Udaharan: furious, chup ho gayi, ID ghar par bhool gaye, matlab bahut gussa" xmlns="http://www.w3.org/2000/svg"><title>Inference = teen clues ka jod. Ek clue galat raah dikha sakta hai; teeno ek hi taraf ishaara
    karein to jawaab pakka.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
     <defs>
      <style>
       .in-box { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
       .in-res { fill: var(--accent); }
       .in-t { font: 800 15px var(--font); fill: var(--accent-2); }
       .in-s { font: 500 12px var(--font); fill: var(--text-soft); }
       .in-e { font: italic 600 12px var(--font); fill: var(--text); }
       .in-rt { font: 800 16px var(--font); fill: var(--sheet); }
       .in-rs { font: 600 12px var(--font); fill: var(--sheet); }
       .in-ar { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#in-arrow); }
      </style>
      <marker id="in-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
      </marker>
     </defs>

     <rect class="in-box" x="10" y="14" width="250" height="80" rx="12"/>
     <text class="in-t" x="26" y="40">1. WORDS — shabd</text>
     <text class="in-s" x="26" y="60">bhaav wale shabd: furious, frustrating</text>
     <text class="in-e" x="26" y="80">"My sister was furious."</text>

     <rect class="in-box" x="10" y="110" width="250" height="80" rx="12"/>
     <text class="in-t" x="26" y="136">2. TONE — aawaz</text>
     <text class="in-s" x="26" y="156">tez / dheemi, ruk-ruk kar, hansi</text>
     <text class="in-e" x="26" y="176">"I'm joking. Well, mostly!"</text>

     <rect class="in-box" x="10" y="206" width="250" height="80" rx="12"/>
     <text class="in-t" x="26" y="232">3. SITUATION — haalat</text>
     <text class="in-s" x="26" y="252">kya hua, kya daav par hai</text>
     <text class="in-e" x="26" y="272">"I have a client call at three."</text>

     <path class="in-ar" d="M266 54 C330 54 340 150 392 150"/>
     <path class="in-ar" d="M266 150 H392"/>
     <path class="in-ar" d="M266 246 C330 246 340 150 392 150"/>

     <rect class="in-res" x="400" y="90" width="230" height="120" rx="16"/>
     <text class="in-rt" x="515" y="132" text-anchor="middle">FEELING</text>
     <text class="in-rs" x="515" y="156" text-anchor="middle">bolne wala kaisa hai?</text>
     <text class="in-rs" x="515" y="180" text-anchor="middle">angry · worried · relieved</text>
     <text class="in-rs" x="515" y="198" text-anchor="middle">impatient · happy</text>
    </svg>