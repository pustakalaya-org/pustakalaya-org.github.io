<svg viewBox="0 0 640 210" role="img" aria-label="Linking verb ek pul ki tarah subject ko uski pehchaan se jodta hai, aur action verb subject se object ki taraf teer chalata hai" xmlns="http://www.w3.org/2000/svg"><title>Linking verb ke dono sirey ek hi cheez hote hain; action verb me kaam subject se nikal kar object par girta hai.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pad { fill: var(--card); stroke-width: 2; }
              .pt { font: 700 13px var(--font); }
              .bridge { stroke: var(--role-verb); stroke-width: 3; fill: none; }
              .bl { font: 800 13px var(--font); fill: var(--role-verb); }
              .cap2 { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .hdr { font: 800 13px var(--font); fill: var(--text); }
            </style>
            <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--role-verb)"/>
            </marker>
          </defs>

          <text class="hdr" x="20" y="22">LINKING — pul (dono sirey ek hi cheez)</text>
          <g>
            <rect class="pad" x="30" y="38" width="100" height="38" rx="8" stroke="var(--role-pron)"/>
            <text class="pt" x="80" y="62" text-anchor="middle" fill="var(--role-pron)">She</text>
            <path class="bridge" d="M130 57 C170 24, 230 24, 270 57"/>
            <text class="bl" x="200" y="26" text-anchor="middle">is</text>
            <rect class="pad" x="270" y="38" width="120" height="38" rx="8" stroke="var(--role-adj)"/>
            <text class="pt" x="330" y="62" text-anchor="middle" fill="var(--role-adj)">a teacher</text>
            <text class="cap2" x="410" y="62">She = a teacher</text>
          </g>

          <text class="hdr" x="20" y="124">ACTION — teer (kaam ek se doosre par jaata hai)</text>
          <g>
            <rect class="pad" x="30" y="140" width="100" height="38" rx="8" stroke="var(--role-pron)"/>
            <text class="pt" x="80" y="164" text-anchor="middle" fill="var(--role-pron)">She</text>
            <line class="bridge" x1="134" y1="159" x2="264" y2="159" marker-end="url(#ah4)"/>
            <text class="bl" x="199" y="150" text-anchor="middle">teaches</text>
            <rect class="pad" x="272" y="140" width="120" height="38" rx="8" stroke="var(--role-noun)"/>
            <text class="pt" x="332" y="164" text-anchor="middle" fill="var(--role-noun)">maths</text>
            <text class="cap2" x="410" y="164">She ≠ maths</text>
          </g>
        </svg>