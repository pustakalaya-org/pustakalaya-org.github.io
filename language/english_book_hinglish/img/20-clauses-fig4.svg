<svg viewBox="0 0 660 228" role="img" aria-label="Baayein: teen bhai, beech wala gol ghere me — My brother who lives in Pune is a doctor; clause batata hai kaunsa bhai, bina comma. Daayein: ek hi bhai, bagal me extra jaankari ka bubble — My brother, who lives in Pune, is a doctor; commas ke saath." xmlns="http://www.w3.org/2000/svg"><title>Commas ke beech wala hissa &quot;bonus&quot; jaankari hai. Bina comma wala hissa batata hai ki kiski baat ho rahi hai.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-noun:#2563eb;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .dn-head { fill: var(--role-noun); }
              .dn-body { fill: var(--role-noun); opacity: .55; }
              .dn-ring { fill: none; stroke: var(--accent); stroke-width: 2.6; }
              .dn-bub { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2; stroke-dasharray: 5 4; }
              .dn-div { fill: none; stroke: var(--accent-line); stroke-width: 1.5; stroke-dasharray: 4 5; }
              .dn-hd { font: 800 12px var(--font); fill: var(--text); letter-spacing: .04em; }
              .dn-s { font: 700 12px var(--font); fill: var(--text); }
              .dn-g { font: 500 11px var(--font); fill: var(--text-soft); }
              .dn-b { font: 600 11.5px var(--font); fill: var(--role-conj); }
            </style>
          </defs>

          <text class="dn-hd" x="165" y="22" text-anchor="middle">DEFINING — bina comma</text>
          <circle class="dn-head" cx="85" cy="70" r="13"/>
          <rect class="dn-body" x="69" y="87" width="32" height="40" rx="10"/>
          <circle class="dn-head" cx="165" cy="70" r="13"/>
          <rect class="dn-body" x="149" y="87" width="32" height="40" rx="10"/>
          <circle class="dn-head" cx="245" cy="70" r="13"/>
          <rect class="dn-body" x="229" y="87" width="32" height="40" rx="10"/>
          <circle class="dn-ring" cx="165" cy="96" r="42"/>
          <text class="dn-b" x="165" y="154" text-anchor="middle">Pune wala</text>
          <text class="dn-s" x="165" y="186" text-anchor="middle">My brother who lives in Pune is a doctor.</text>
          <text class="dn-g" x="165" y="206" text-anchor="middle">Kai bhai hain — clause batata hai KAUNSA.</text>

          <path class="dn-div" d="M330 12 L330 214"/>

          <text class="dn-hd" x="495" y="22" text-anchor="middle">NON-DEFINING — commas ke saath</text>
          <circle class="dn-head" cx="440" cy="70" r="13"/>
          <rect class="dn-body" x="424" y="87" width="32" height="40" rx="10"/>
          <rect class="dn-bub" x="478" y="58" width="150" height="48" rx="12"/>
          <text class="dn-b" x="553" y="79" text-anchor="middle">lives in Pune</text>
          <text class="dn-g" x="553" y="96" text-anchor="middle">(extra jaankari)</text>
          <text class="dn-s" x="495" y="186" text-anchor="middle">My brother, who lives in Pune, is a doctor.</text>
          <text class="dn-g" x="495" y="206" text-anchor="middle">Ek hi bhai hai — clause hata do, matlab wahi.</text>
        </svg>