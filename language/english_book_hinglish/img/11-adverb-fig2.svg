<svg viewBox="0 0 700 330" role="img" aria-label="Adverb ki jagah ke chaar rule — frequency adverb helping verb ke baad, manner adverb vaakya ke aakhir me, aur manner-place-time ka kram" xmlns="http://www.w3.org/2000/svg"><title>Adverb ki jagah ke chaar rule — frequency, kram, degree, aur object ke beech na aana.</title><style>svg{--card:#ffffff;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--role-adv:#db2777;--role-pron:#0891b2;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .row { fill: var(--card); stroke: var(--ink-200); stroke-width: 1.4; }
              .rt2 { font: 700 11.5px var(--font); fill: var(--text-soft); }
              .cell { fill: none; stroke-width: 2; }
              .cw { font: 700 13px var(--font); }
              .tag2 { font: 700 9.5px var(--font); letter-spacing: .05em; }
              .note2 { font: 500 11px var(--font); fill: var(--text-soft); }
              .hd4 { font: 800 13px var(--font); fill: var(--text); }
            </style>
          </defs>

          <text class="hd4" x="14" y="20">1. FREQUENCY adverb — main verb se pehle, par "be" ke baad</text>
          <g transform="translate(14 32)">
            <rect class="row" x="0" y="0" width="672" height="40" rx="8"/>
            <text class="cw" x="16" y="26" fill="var(--role-pron)">She</text>
            <text class="cw" x="70" y="26" fill="var(--role-adv)">often</text>
            <text class="cw" x="140" y="26" fill="var(--role-verb)">visits</text>
            <text class="cw" x="206" y="26">her grandmother.</text>
            <text class="note2" x="400" y="26">✓ normal verb se pehle</text>
          </g>
          <g transform="translate(14 78)">
            <rect class="row" x="0" y="0" width="672" height="40" rx="8"/>
            <text class="cw" x="16" y="26" fill="var(--role-pron)">She</text>
            <text class="cw" x="70" y="26" fill="var(--role-verb)">is</text>
            <text class="cw" x="104" y="26" fill="var(--role-adv)">often</text>
            <text class="cw" x="170" y="26">late.</text>
            <text class="note2" x="400" y="26">✓ is / am / are ke baad</text>
          </g>
          <g transform="translate(14 124)">
            <rect class="row" x="0" y="0" width="672" height="40" rx="8"/>
            <text class="cw" x="16" y="26" fill="var(--role-pron)">She</text>
            <text class="cw" x="70" y="26" fill="var(--role-verb)">has</text>
            <text class="cw" x="116" y="26" fill="var(--role-adv)">never</text>
            <text class="cw" x="186" y="26" fill="var(--role-verb)">seen</text>
            <text class="cw" x="240" y="26">the sea.</text>
            <text class="note2" x="400" y="26">✓ helping verb ke baad, main se pehle</text>
          </g>

          <text class="hd4" x="14" y="196">2. Ek saath kai adverb — kram: MANNER → PLACE → TIME</text>
          <g transform="translate(14 208)">
            <rect class="row" x="0" y="0" width="672" height="56" rx="8"/>
            <text class="cw" x="16" y="26">He sang</text>
            <text class="cw" x="92" y="26" fill="var(--role-adv)">beautifully</text>
            <text class="cw" x="206" y="26" fill="var(--role-adv)">at the concert</text>
            <text class="cw" x="348" y="26" fill="var(--role-adv)">last night.</text>
            <text class="tag2" x="92" y="44" fill="var(--role-adv)">MANNER (kaise)</text>
            <text class="tag2" x="206" y="44" fill="var(--role-adv)">PLACE (kahan)</text>
            <text class="tag2" x="348" y="44" fill="var(--role-adv)">TIME (kab)</text>
          </g>

          <text class="note2" x="14" y="292">3. Degree adverb (very, too, quite) us shabd se turant pehle jiske baare me bata raha hai: "very tall", "too quickly".</text>
          <text class="note2" x="14" y="314">4. Verb aur uske object ke beech adverb kabhi nahi: ✗ "She speaks fluently English" → ✓ "She speaks English fluently".</text>
        </svg>