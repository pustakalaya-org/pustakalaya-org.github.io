<svg viewBox="0 0 640 310" role="img" aria-label="Linking ke teen tarike: consonant se vowel jaise turn it off aur an apple; vowel se vowel beech me w ya y jaise go out aur I am; aur British linking r jaise far away aur four eggs." xmlns="http://www.w3.org/2000/svg"><title>Har arc ek jod hai. Consonant agle vowel par &quot;kood&quot; jaata hai; do vowel ke beech halki w/y
        ka pul banta hai; British English me chhupa &quot;r&quot; agle vowel se pehle jaag jaata hai.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--line:#e3e7ef;--role-verb:#0d9488;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .lk-h { font: 800 12.5px var(--font); fill: var(--text-soft); letter-spacing: .05em; }
              .lk-w { font: 800 24px var(--font); fill: var(--text); }
              .lk-s { font: italic 600 14px var(--font); fill: var(--accent); }
              .lk-arc { fill: none; stroke: var(--accent); stroke-width: 2.5; }
              .lk-g { font: 800 14px var(--font); fill: var(--role-verb); }
              .lk-sep { stroke: var(--line); stroke-width: 1.2; }
            </style>
          </defs>

          <text class="lk-h" x="20" y="24">1. CONSONANT → VOWEL</text>
          <text class="lk-w" x="110" y="72" text-anchor="end">turn</text>
          <text class="lk-w" x="140" y="72" text-anchor="middle">it</text>
          <text class="lk-w" x="170" y="72">off</text>
          <path class="lk-arc" d="M104 50 Q118 30 132 50"/>
          <path class="lk-arc" d="M148 50 Q162 30 176 50"/>
          <text class="lk-s" x="40" y="98">"tur-ni-toff"</text>

          <text class="lk-w" x="420" y="72" text-anchor="end">an</text>
          <text class="lk-w" x="436" y="72">apple</text>
          <path class="lk-arc" d="M412 50 Q426 30 442 50"/>
          <text class="lk-s" x="380" y="98">"a-napple"</text>

          <line class="lk-sep" x1="20" y1="114" x2="620" y2="114"/>

          <text class="lk-h" x="20" y="134">2. VOWEL → VOWEL (beech me w / y)</text>
          <text class="lk-w" x="84" y="182" text-anchor="end">go</text>
          <text class="lk-w" x="110" y="182">out</text>
          <path class="lk-arc" d="M78 160 Q96 136 116 160"/>
          <text class="lk-g" x="97" y="150" text-anchor="middle">w</text>
          <text class="lk-s" x="40" y="208">"go-wout"</text>

          <text class="lk-w" x="400" y="182" text-anchor="end">I</text>
          <text class="lk-w" x="426" y="182">am</text>
          <path class="lk-arc" d="M398 160 Q414 136 432 160"/>
          <text class="lk-g" x="415" y="150" text-anchor="middle">y</text>
          <text class="lk-s" x="380" y="208">"I-yam"</text>

          <line class="lk-sep" x1="20" y1="224" x2="620" y2="224"/>

          <text class="lk-h" x="20" y="244">3. LINKING R (British)</text>
          <text class="lk-w" x="92" y="290" text-anchor="end">far</text>
          <text class="lk-w" x="118" y="290">away</text>
          <path class="lk-arc" d="M86 268 Q104 244 124 268"/>
          <text class="lk-g" x="105" y="258" text-anchor="middle">r</text>
          <text class="lk-s" x="200" y="290">"fa-ra-way"</text>

          <text class="lk-w" x="440" y="290" text-anchor="end">four</text>
          <text class="lk-w" x="466" y="290">eggs</text>
          <path class="lk-arc" d="M434 268 Q452 244 472 268"/>
          <text class="lk-g" x="453" y="258" text-anchor="middle">r</text>
          <text class="lk-s" x="540" y="290">"fou-reggs"</text>
        </svg>