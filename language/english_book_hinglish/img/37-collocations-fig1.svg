<svg viewBox="0 0 480 260" role="img" aria-label="Teen jodiyan: strong tea, heavy rain aur make a mistake jamti hain. Powerful tea, big rain aur do a mistake nahi jamti." xmlns="http://www.w3.org/2000/svg"><title>&quot;Powerful&quot; aur &quot;strong&quot; ka matlab lagbhag ek hai, par chai sirf strong hoti hai. Yahi collocation hai.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-interj:#e11d48;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cl-a { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2; }
              .cl-b { fill: var(--sheet); stroke: var(--role-interj); stroke-width: 2; }
              .cl-ok { fill: none; stroke: var(--role-conj); stroke-width: 4; }
              .cl-no { fill: none; stroke: var(--role-interj); stroke-width: 3; }
              .cl-w { font: 700 14px var(--font); fill: var(--text); }
              .cl-hg { font: 800 12px var(--font); fill: var(--role-conj); letter-spacing: 0.06em; }
              .cl-hb { font: 800 12px var(--font); fill: var(--role-interj); letter-spacing: 0.06em; }
              .cl-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <text class="cl-hg" x="10" y="22">✓ JODI JAMTI HAI</text>
          <text class="cl-hb" x="252" y="22">✗ JODI NAHI JAMTI</text>

          <rect class="cl-a" x="10" y="38" width="96" height="40" rx="20"/>
          <text class="cl-w" x="58" y="63" text-anchor="middle">strong</text>
          <path class="cl-ok" d="M106 58 L128 58"/>
          <rect class="cl-a" x="128" y="38" width="96" height="40" rx="20"/>
          <text class="cl-w" x="176" y="63" text-anchor="middle">tea</text>
          <rect class="cl-b" x="252" y="38" width="100" height="40" rx="20"/>
          <text class="cl-w" x="302" y="63" text-anchor="middle">powerful</text>
          <path class="cl-no" d="M360 50 L374 66 M374 50 L360 66"/>
          <rect class="cl-b" x="382" y="38" width="88" height="40" rx="20"/>
          <text class="cl-w" x="426" y="63" text-anchor="middle">tea</text>

          <rect class="cl-a" x="10" y="104" width="96" height="40" rx="20"/>
          <text class="cl-w" x="58" y="129" text-anchor="middle">heavy</text>
          <path class="cl-ok" d="M106 124 L128 124"/>
          <rect class="cl-a" x="128" y="104" width="96" height="40" rx="20"/>
          <text class="cl-w" x="176" y="129" text-anchor="middle">rain</text>
          <rect class="cl-b" x="252" y="104" width="100" height="40" rx="20"/>
          <text class="cl-w" x="302" y="129" text-anchor="middle">big</text>
          <path class="cl-no" d="M360 116 L374 132 M374 116 L360 132"/>
          <rect class="cl-b" x="382" y="104" width="88" height="40" rx="20"/>
          <text class="cl-w" x="426" y="129" text-anchor="middle">rain</text>

          <rect class="cl-a" x="10" y="170" width="96" height="40" rx="20"/>
          <text class="cl-w" x="58" y="195" text-anchor="middle">make</text>
          <path class="cl-ok" d="M106 190 L128 190"/>
          <rect class="cl-a" x="128" y="170" width="96" height="40" rx="20"/>
          <text class="cl-w" x="176" y="195" text-anchor="middle">a mistake</text>
          <rect class="cl-b" x="252" y="170" width="100" height="40" rx="20"/>
          <text class="cl-w" x="302" y="195" text-anchor="middle">do</text>
          <path class="cl-no" d="M360 182 L374 198 M374 182 L360 198"/>
          <rect class="cl-b" x="382" y="170" width="88" height="40" rx="20"/>
          <text class="cl-w" x="426" y="195" text-anchor="middle">a mistake</text>

          <text class="cl-s" x="10" y="244">Matlab dono taraf ek hai — par sirf baayein wali jodi English me "chalti" hai.</text>
        </svg>