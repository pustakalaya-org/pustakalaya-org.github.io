<svg viewBox="0 0 640 230" role="img" aria-label="Pandrah minute ka roz ka batwara: chaar minute padhna, chhah minute zor se bolna, teen minute quiz, do minute kal ka dohraav" xmlns="http://www.w3.org/2000/svg"><title>Dhyan do: sabse bada hissa narangi hai — bolna . Padhna sirf chauthai hissa hai.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-adj:#9333ea;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .slbl { font: 700 14px var(--font); fill: var(--sheet); }
              .smin { font: 800 22px var(--font); fill: var(--sheet); }
              .cap { font: 500 12px var(--font); fill: var(--text-soft); }
              .axis { font: 600 11px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="axis" x="10" y="22">15 MINUTE — ROZ</text>

          <rect x="10" y="36" width="162" height="86" rx="8" fill="var(--role-noun)"/>
          <text class="smin" x="91" y="72" text-anchor="middle">4</text>
          <text class="slbl" x="91" y="94" text-anchor="middle">Padho</text>

          <rect x="178" y="36" width="244" height="86" rx="8" fill="var(--brand-500)"/>
          <text class="smin" x="300" y="72" text-anchor="middle">6</text>
          <text class="slbl" x="300" y="94" text-anchor="middle">Zor se bolo</text>

          <rect x="428" y="36" width="122" height="86" rx="8" fill="var(--role-verb)"/>
          <text class="smin" x="489" y="72" text-anchor="middle">3</text>
          <text class="slbl" x="489" y="94" text-anchor="middle">Quiz</text>

          <rect x="556" y="36" width="74" height="86" rx="8" fill="var(--role-adj)"/>
          <text class="smin" x="593" y="72" text-anchor="middle">2</text>
          <text class="slbl" x="593" y="94" text-anchor="middle">Dohrao</text>

          <text class="cap" x="10" y="150">Ek adhyaay ka ek hissa padho — poora chapter ek din me nahi.</text>
          <text class="cap" x="10" y="170">Har example sentence 🔊 dabake suno, phir khud bolo. Yahi sabse bada hissa hai.</text>
          <text class="cap" x="10" y="190">Chapter ke aakhir ka quiz karo — galat jawaab se hi seekhna hota hai.</text>
          <text class="cap" x="10" y="210">Kal jo padha tha, uske teen sentence dobara bolo. Bas teen.</text>
        </svg>