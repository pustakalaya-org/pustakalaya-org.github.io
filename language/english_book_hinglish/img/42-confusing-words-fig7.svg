<svg viewBox="0 0 480 230" role="img" aria-label="Baayein: logon ke gole jo gine ja sakte hain — fewer people. Daayein: paani ka glass jo gina nahi ja sakta — less water." xmlns="http://www.w3.org/2000/svg"><title>Gol-gol log gine ja sakte hain → fewer. Paani beh jaata hai, gina nahi jaata → less.</title><style>svg{--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-pron:#0891b2;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .fl-p { fill: var(--role-noun); }
              .fl-po { fill: var(--accent-line); }
              .fl-gl { fill: none; stroke: var(--text-soft); stroke-width: 2.5; stroke-linejoin: round; }
              .fl-w { fill: var(--role-pron); opacity: 0.55; }
              .fl-t { font: 800 15px var(--font); fill: var(--text); }
              .fl-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
              .fl-dv { fill: none; stroke: var(--accent-line); stroke-width: 1.5; }
            </style>
          </defs>
          <circle class="fl-p" cx="40" cy="40" r="11"/>
          <circle class="fl-p" cx="74" cy="40" r="11"/>
          <circle class="fl-p" cx="108" cy="40" r="11"/>
          <circle class="fl-p" cx="142" cy="40" r="11"/>
          <circle class="fl-p" cx="40" cy="76" r="11"/>
          <circle class="fl-p" cx="74" cy="76" r="11"/>
          <circle class="fl-po" cx="108" cy="76" r="11"/>
          <circle class="fl-po" cx="142" cy="76" r="11"/>
          <circle class="fl-po" cx="40" cy="112" r="11"/>
          <circle class="fl-po" cx="74" cy="112" r="11"/>
          <circle class="fl-po" cx="108" cy="112" r="11"/>
          <circle class="fl-po" cx="142" cy="112" r="11"/>
          <text class="fl-t" x="20" y="160">fewer people</text>
          <text class="fl-s" x="20" y="180">1, 2, 3… gin sakte ho</text>

          <path class="fl-dv" d="M236 20 L236 200"/>

          <path class="fl-gl" d="M300 26 L380 26 L370 132 L310 132 Z"/>
          <path class="fl-w" d="M306 78 L374 78 L370 132 L310 132 Z"/>
          <text class="fl-t" x="270" y="160">less water</text>
          <text class="fl-s" x="270" y="180">gin nahi sakte — sirf maap</text>

          <text class="fl-s" x="20" y="218">fewer + plural (people, cars) · less + uncountable (water, time)</text>
        </svg>