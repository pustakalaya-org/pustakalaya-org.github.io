<svg viewBox="0 0 640 430" role="img" aria-label="Ek page ka CV layout: upar naam aur contact, phir profile summary, experience, skills, education. Daayein taraf har hisse ke liye chhota note." xmlns="http://www.w3.org/2000/svg"><title>Ek saaf, ek-page CV. Daayein ke note batate hain ki har hisse me kya jaata hai — aur kya nahi.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-300:#cbd5e1;--line-strong:#cfd6e2;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .cv-pg { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
              .cv-bk { fill: var(--accent-soft); }
              .cv-bar { fill: var(--accent); }
              .cv-gl { fill: var(--ink-300); }
              .cv-h { font: 800 13px var(--font); fill: var(--accent); }
              .cv-nm { font: 800 17px var(--font); fill: var(--text); }
              .cv-sm { font: 500 11px var(--font); fill: var(--text-soft); }
              .cv-ld { fill: none; stroke: var(--accent-line); stroke-width: 1.8; stroke-dasharray: 4 4; }
              .cv-n { font: 700 13px var(--font); fill: var(--text); }
              .cv-ns { font: 500 12px var(--font); fill: var(--text-soft); }
            </style>
          </defs>
          <rect class="cv-pg" x="20" y="10" width="300" height="410" rx="8"/>
          <text class="cv-nm" x="40" y="42">ANANYA IYER</text>
          <text class="cv-sm" x="40" y="60">Pune · 98xxx xxxxx · ananya@mail.com · LinkedIn</text>

          <text class="cv-h" x="40" y="92">PROFILE</text>
          <rect class="cv-gl" x="40" y="100" width="260" height="6" rx="3"/>
          <rect class="cv-gl" x="40" y="112" width="240" height="6" rx="3"/>
          <rect class="cv-gl" x="40" y="124" width="180" height="6" rx="3"/>

          <text class="cv-h" x="40" y="156">EXPERIENCE</text>
          <rect class="cv-bk" x="40" y="164" width="260" height="16" rx="3"/>
          <text class="cv-sm" x="46" y="176">Analyst, Fintech Co · 2023–now</text>
          <circle class="cv-bar" cx="46" cy="192" r="3"/>
          <rect class="cv-gl" x="56" y="189" width="230" height="6" rx="3"/>
          <circle class="cv-bar" cx="46" cy="206" r="3"/>
          <rect class="cv-gl" x="56" y="203" width="210" height="6" rx="3"/>
          <circle class="cv-bar" cx="46" cy="220" r="3"/>
          <rect class="cv-gl" x="56" y="217" width="190" height="6" rx="3"/>
          <rect class="cv-bk" x="40" y="234" width="260" height="16" rx="3"/>
          <text class="cv-sm" x="46" y="246">Intern, Retail Ltd · 2022</text>
          <circle class="cv-bar" cx="46" cy="262" r="3"/>
          <rect class="cv-gl" x="56" y="259" width="220" height="6" rx="3"/>

          <text class="cv-h" x="40" y="296">SKILLS</text>
          <rect class="cv-gl" x="40" y="304" width="250" height="6" rx="3"/>
          <rect class="cv-gl" x="40" y="316" width="200" height="6" rx="3"/>

          <text class="cv-h" x="40" y="350">EDUCATION</text>
          <rect class="cv-gl" x="40" y="358" width="240" height="6" rx="3"/>
          <rect class="cv-gl" x="40" y="370" width="160" height="6" rx="3"/>
          <text class="cv-sm" x="40" y="402">1 page · ek font · koi photo nahi</text>

          <path class="cv-ld" d="M310 46 H360"/>
          <text class="cv-n" x="368" y="42">Naam bada, contact ek line</text>
          <text class="cv-ns" x="368" y="60">city, phone, email, LinkedIn — bas</text>

          <path class="cv-ld" d="M310 112 H360"/>
          <text class="cv-n" x="368" y="108">Profile: 3–4 line</text>
          <text class="cv-ns" x="368" y="126">kaun ho + kya karte ho + ek nateeja</text>

          <path class="cv-ld" d="M310 172 H360"/>
          <text class="cv-n" x="368" y="168">Naya kaam sabse upar</text>
          <text class="cv-ns" x="368" y="186">reverse chronological order</text>

          <path class="cv-ld" d="M300 206 H360"/>
          <text class="cv-n" x="368" y="210">Har bullet = verb + task</text>
          <text class="cv-ns" x="368" y="228">+ result + number</text>

          <path class="cv-ld" d="M310 308 H360"/>
          <text class="cv-n" x="368" y="304">Sirf kaam ke skills</text>
          <text class="cv-ns" x="368" y="322">tools, languages, certificates</text>

          <path class="cv-ld" d="M310 362 H360"/>
          <text class="cv-n" x="368" y="358">Degree · college · saal</text>
          <text class="cv-ns" x="368" y="376">fresher ho to ise upar le jaao</text>
        </svg>