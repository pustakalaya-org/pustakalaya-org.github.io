<svg viewBox="0 0 640 320" role="img" aria-label="Meeting ka chakra: agenda, meeting, minutes, action items, follow up, deadline, phir wapas agle agenda par" xmlns="http://www.w3.org/2000/svg"><title>Ek meeting ka poora safar — har shabd apne verb ke saath: circulate the agenda, take the minutes, meet the deadline.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .mc-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#mc-ar); }
              .mc-c { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .mc-t { font: 800 14px var(--font); fill: var(--accent); }
              .mc-s { font: 500 12px var(--font); fill: var(--text-soft); }
              .mc-mid { font: 700 13px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="mc-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>
          <rect class="mc-c" x="245" y="10" width="150" height="56" rx="12"/>
          <text class="mc-t" x="320" y="34" text-anchor="middle">agenda</text>
          <text class="mc-s" x="320" y="52" text-anchor="middle">circulate it</text>

          <rect class="mc-c" x="460" y="80" width="160" height="56" rx="12"/>
          <text class="mc-t" x="540" y="104" text-anchor="middle">meeting</text>
          <text class="mc-s" x="540" y="122" text-anchor="middle">chair / attend it</text>

          <rect class="mc-c" x="460" y="200" width="160" height="56" rx="12"/>
          <text class="mc-t" x="540" y="224" text-anchor="middle">minutes</text>
          <text class="mc-s" x="540" y="242" text-anchor="middle">take / share them</text>

          <rect class="mc-c" x="245" y="256" width="150" height="56" rx="12"/>
          <text class="mc-t" x="320" y="280" text-anchor="middle">action items</text>
          <text class="mc-s" x="320" y="298" text-anchor="middle">assign them</text>

          <rect class="mc-c" x="20" y="200" width="160" height="56" rx="12"/>
          <text class="mc-t" x="100" y="224" text-anchor="middle">follow up</text>
          <text class="mc-s" x="100" y="242" text-anchor="middle">on each task</text>

          <rect class="mc-c" x="20" y="80" width="160" height="56" rx="12"/>
          <text class="mc-t" x="100" y="104" text-anchor="middle">deadline</text>
          <text class="mc-s" x="100" y="122" text-anchor="middle">meet / miss it</text>

          <path class="mc-ln" d="M397 40 C440 44 480 56 512 76"/>
          <path class="mc-ln" d="M540 138 L540 196"/>
          <path class="mc-ln" d="M500 258 C470 276 440 284 400 286"/>
          <path class="mc-ln" d="M242 286 C200 284 170 276 140 260"/>
          <path class="mc-ln" d="M100 198 L100 140"/>
          <path class="mc-ln" d="M128 78 C160 56 200 44 241 40"/>
          <text class="mc-mid" x="320" y="150" text-anchor="middle">Har dabbe ke neeche</text>
          <text class="mc-mid" x="320" y="170" text-anchor="middle">uski pakki jodi</text>
        </svg>