<svg viewBox="0 0 480 230" role="img" aria-label="Affect verb hai, A for Action. Effect noun hai, E for End result. Action se End result aata hai: The rain affected the match. The effect was a draw." xmlns="http://www.w3.org/2000/svg"><title>Pehle Action (affect), phir End result (effect) — alphabet me bhi A pehle aata hai, E baad me.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .af-v { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.5; }
              .af-n { fill: var(--sheet); stroke: var(--role-noun); stroke-width: 2.5; }
              .af-ln { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#af-ar); }
              .af-w { font: 800 20px var(--font); fill: var(--text); }
              .af-tv { font: 700 12px var(--font); fill: var(--role-verb); letter-spacing: 0.05em; }
              .af-tn { font: 700 12px var(--font); fill: var(--role-noun); letter-spacing: 0.05em; }
              .af-m { font: 600 12.5px var(--font); fill: var(--text-soft); }
              .af-e { font: 500 14px var(--font); fill: var(--text); }
              .af-hv { fill: var(--role-verb); font-weight: 800; }
              .af-hn { fill: var(--role-noun); font-weight: 800; }
            </style>
            <marker id="af-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
            </marker>
          </defs>
          <rect class="af-v" x="10" y="20" width="150" height="76" rx="12"/>
          <text class="af-w" x="85" y="56" text-anchor="middle">affect</text>
          <text class="af-tv" x="85" y="80" text-anchor="middle">VERB · A = ACTION</text>

          <path class="af-ln" d="M166 58 L312 58"/>
          <text class="af-m" x="240" y="46" text-anchor="middle">asar daalta hai…</text>
          <text class="af-m" x="240" y="80" text-anchor="middle">…to asar dikhta hai</text>

          <rect class="af-n" x="320" y="20" width="150" height="76" rx="12"/>
          <text class="af-w" x="395" y="56" text-anchor="middle">effect</text>
          <text class="af-tn" x="395" y="80" text-anchor="middle">NOUN · E = END RESULT</text>

          <text class="af-e" x="10" y="140">The rain <tspan class="af-hv">affected</tspan> the match.</text>
          <text class="af-e" x="10" y="166">The <tspan class="af-hn">effect</tspan> was a draw.</text>
          <text class="af-m" x="10" y="200">Test: "the / an / a" ke baad → effect. Kisi ko kuch karta hai → affect.</text>
        </svg>