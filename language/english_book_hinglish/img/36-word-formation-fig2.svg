<svg viewBox="0 0 480 300" role="img" aria-label="Pehle akshar ka niyam: p, m ya b se shuru hone wale shabd par im-, l par il-, r par ir-. Baaki shabdon me un-, dis-, in- ko shabd ke saath yaad karna hai." xmlns="http://www.w3.org/2000/svg"><title>Upar ke teen niyam bolne me aasaani ke liye bane hain — &quot;in-possible&quot; bolke dekho, zubaan khud
        &quot;im-possible&quot; kar degi.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ng-l { fill: var(--sheet); stroke: var(--accent-line); stroke-width: 2; }
              .ng-p { fill: var(--accent); }
              .ng-o { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .ng-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#ng-ar); }
              .ng-lt { font: 800 16px var(--font); fill: var(--text); }
              .ng-pt { font: 800 17px var(--font); fill: var(--sheet); }
              .ng-e { font: 500 13px var(--font); fill: var(--text); }
              .ng-h { font: 600 13px var(--font); fill: var(--text-soft); }
              .ng-b { font: 700 13px var(--font); fill: var(--text); }
              .ng-s { font: 500 12.5px var(--font); fill: var(--text-soft); }
            </style>
            <marker id="ng-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>
          <text class="ng-h" x="10" y="20">Jad ka pehla akshar dekho →</text>

          <rect class="ng-l" x="10" y="34" width="110" height="52" rx="10"/>
          <text class="ng-lt" x="65" y="66" text-anchor="middle">p · m · b</text>
          <path class="ng-ln" d="M122 60 L158 60"/>
          <rect class="ng-p" x="162" y="38" width="72" height="44" rx="22"/>
          <text class="ng-pt" x="198" y="66" text-anchor="middle">im-</text>
          <path class="ng-ln" d="M236 60 L262 60"/>
          <text class="ng-e" x="270" y="56">impossible, immature,</text>
          <text class="ng-e" x="270" y="74">imbalance, impatient</text>

          <rect class="ng-l" x="10" y="98" width="110" height="52" rx="10"/>
          <text class="ng-lt" x="65" y="130" text-anchor="middle">l</text>
          <path class="ng-ln" d="M122 124 L158 124"/>
          <rect class="ng-p" x="162" y="102" width="72" height="44" rx="22"/>
          <text class="ng-pt" x="198" y="130" text-anchor="middle">il-</text>
          <path class="ng-ln" d="M236 124 L262 124"/>
          <text class="ng-e" x="270" y="120">illegal, illogical,</text>
          <text class="ng-e" x="270" y="138">illiterate</text>

          <rect class="ng-l" x="10" y="162" width="110" height="52" rx="10"/>
          <text class="ng-lt" x="65" y="194" text-anchor="middle">r</text>
          <path class="ng-ln" d="M122 188 L158 188"/>
          <rect class="ng-p" x="162" y="166" width="72" height="44" rx="22"/>
          <text class="ng-pt" x="198" y="194" text-anchor="middle">ir-</text>
          <path class="ng-ln" d="M236 188 L262 188"/>
          <text class="ng-e" x="270" y="184">irregular, irrelevant,</text>
          <text class="ng-e" x="270" y="202">irresponsible</text>

          <rect class="ng-o" x="10" y="232" width="460" height="56" rx="10"/>
          <text class="ng-b" x="24" y="256">Baaki: un-, dis-, in- — koi pakka niyam nahi</text>
          <text class="ng-s" x="24" y="276">unhappy · dislike · incorrect → shabd ke saath hi yaad karo</text>
        </svg>