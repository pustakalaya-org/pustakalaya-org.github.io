<svg viewBox="0 0 640 250" role="img" aria-label="Suffix hata ke dekho: accept bachta hai jo poora shabd hai, isliye acceptable; poss bachta hai jo shabd nahi hai, isliye possible" xmlns="http://www.w3.org/2000/svg"><title>Kainchi chalao: suffix kaato aur dekho ki peeche kya bacha.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-ink:color-mix(in srgb, #ea580c 82%, #000);--bad:#be123c;--bad-bg:#fdecef;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--good:#15803d;--good-bg:#e8f7ee;--sheet:#ffffff;--text:#121826;--text-faint:#6b7385;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .ab-c { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .ab-ok { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.8; }
              .ab-no { fill: var(--bad-bg); stroke: var(--bad); stroke-width: 1.8; }
              .ab-cut { fill: none; stroke: var(--accent-2); stroke-width: 2.4; stroke-dasharray: 6 5; }
              .ab-l { fill: none; stroke: var(--accent-2); stroke-width: 2; }
              .ab-w { font: 800 22px var(--font); fill: var(--text); }
              .ab-x { font: 800 22px var(--font); fill: var(--text-faint); }
              .ab-t { font: 700 13px var(--font); fill: var(--text); }
              .ab-s { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .ab-h { font: 800 11px var(--font); fill: var(--accent-ink); letter-spacing: 0.06em; }
            </style>
            <marker id="ab-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>
          <text class="ab-h" x="20" y="22">SUFFIX HATAO — KYA POORA SHABD BACHA?</text>

          <rect class="ab-c" x="20" y="40" width="250" height="70" rx="12"/>
          <text class="ab-w" x="44" y="84">accept</text>
          <text class="ab-x" x="164" y="84">able</text>
          <path class="ab-cut" d="M155 48 V102"/>
          <path class="ab-l" d="M270 75 H330" marker-end="url(#ab-ar)"/>
          <rect class="ab-ok" x="336" y="40" width="284" height="70" rx="12"/>
          <text class="ab-t" x="352" y="66">"accept" poora shabd hai ✓</text>
          <text class="ab-s" x="352" y="88">→ -able: acceptable, comfortable,</text>
          <text class="ab-s" x="352" y="104">dependable, readable</text>

          <rect class="ab-c" x="20" y="134" width="250" height="70" rx="12"/>
          <text class="ab-w" x="58" y="178">poss</text>
          <text class="ab-x" x="140" y="178">ible</text>
          <path class="ab-cut" d="M131 142 V196"/>
          <path class="ab-l" d="M270 169 H330" marker-end="url(#ab-ar)"/>
          <rect class="ab-no" x="336" y="134" width="284" height="70" rx="12"/>
          <text class="ab-t" x="352" y="160">"poss" koi shabd nahi ✗</text>
          <text class="ab-s" x="352" y="182">→ -ible: possible, visible,</text>
          <text class="ab-s" x="352" y="198">terrible, eligible</text>

          <text class="ab-s" x="320" y="236" text-anchor="middle">Agar shabd e par khatam ho, to e girao: believe → believable, love → lovable</text>
        </svg>