<svg viewBox="0 0 480 400" role="img" aria-label="Small talk ke chaar kadam: Open, Follow up, Share aur Close. Follow up aur Share ke beech ek loop hai jo baar-baar ghoomta hai." xmlns="http://www.w3.org/2000/svg"><title>Kadam 2 aur 3 ek jhoola hain — aap sawaal poochhte ho, wo batate hain, aap apni baat jodte ho,
        phir naya sawaal. Jab baat thandi pade, kadam 4.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .st-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .st-n2 { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .st-c { fill: var(--accent); }
              .st-c2 { fill: var(--accent-2); }
              .st-num { font: 800 14px var(--font); fill: var(--sheet); }
              .st-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#st-ar); }
              .st-loop { fill: none; stroke: var(--accent-2); stroke-width: 2.5; marker-end: url(#st-ar2); }
              .st-t { font: 700 15px var(--font); fill: var(--text); }
              .st-s { font: italic 500 13px var(--font); fill: var(--text-soft); }
              .st-l { font: 700 13px var(--font); fill: var(--accent-2); }
            </style>
            <marker id="st-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
            <marker id="st-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
            </marker>
          </defs>

          <rect class="st-n" x="48" y="20" width="292" height="64" rx="12"/>
          <circle class="st-c" cx="26" cy="52" r="15"/>
          <text class="st-num" x="26" y="57" text-anchor="middle">1</text>
          <text class="st-t" x="64" y="46">OPEN — shuru karo</text>
          <text class="st-s" x="64" y="68">"Busy evening, isn't it?"</text>

          <path class="st-ln" d="M194 86 L194 108"/>

          <rect class="st-n2" x="48" y="112" width="292" height="64" rx="12"/>
          <circle class="st-c2" cx="26" cy="144" r="15"/>
          <text class="st-num" x="26" y="149" text-anchor="middle">2</text>
          <text class="st-t" x="64" y="138">FOLLOW UP — sawaal poochho</text>
          <text class="st-s" x="64" y="160">"How do you know the host?"</text>

          <path class="st-ln" d="M194 178 L194 200"/>

          <rect class="st-n2" x="48" y="204" width="292" height="64" rx="12"/>
          <circle class="st-c2" cx="26" cy="236" r="15"/>
          <text class="st-num" x="26" y="241" text-anchor="middle">3</text>
          <text class="st-t" x="64" y="230">SHARE — apni baat, apni raay</text>
          <text class="st-s" x="64" y="252">"I think the food is amazing."</text>

          <path class="st-ln" d="M194 270 L194 292"/>

          <rect class="st-n" x="48" y="296" width="292" height="64" rx="12"/>
          <circle class="st-c" cx="26" cy="328" r="15"/>
          <text class="st-num" x="26" y="333" text-anchor="middle">4</text>
          <text class="st-t" x="64" y="322">CLOSE — izzat se niklo</text>
          <text class="st-s" x="64" y="344">"Lovely talking to you!"</text>

          <path class="st-loop" d="M342 236 C420 236 420 144 352 144"/>
          <text class="st-l" x="430" y="186" text-anchor="middle">baar-</text>
          <text class="st-l" x="430" y="202" text-anchor="middle">baar</text>

          <text class="st-s" x="48" y="390">Ek round = 2 se 5 minute. Bas itna kaafi hai.</text>
        </svg>