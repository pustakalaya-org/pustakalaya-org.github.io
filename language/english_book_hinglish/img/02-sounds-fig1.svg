<svg viewBox="0 0 660 340" role="img" aria-label="Muh ka kaata hua chitra teen zubaan ki positions dikhata hai: Hindi ka dental t daanton ke peeche, English ka T daanton ke peeche ki ubhri jagah par, aur TH daanton ke beech se bahar" xmlns="http://www.w3.org/2000/svg"><title>English ka T Hindi ke &quot;त&quot; aur &quot;ट&quot; ke beech padta hai. Isi liye &quot;ट&quot; se bola gaya T
        videshi kaan ko bhaari lagta hai, aur &quot;त&quot; se bola gaya T thoda narm.</title><style>svg{--brand-500:#f97316;--brand-600:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-100:#f1f5f9;--ink-300:#cbd5e1;--role-adj:#9333ea;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .face { fill: none; stroke: var(--ink-300); stroke-width: 2.5; }
              .soft { fill: var(--ink-100); stroke: var(--ink-300); stroke-width: 1.5; }
              .tooth { fill: var(--sheet); stroke: var(--ink-300); stroke-width: 1.8; }
              .tng { fill: color-mix(in srgb, var(--brand-500) 30%, transparent); stroke: var(--brand-600); stroke-width: 2; }
              .pt { font: 800 12px var(--font); fill: var(--sheet); }
              .lb { font: 700 13px var(--font); fill: var(--text); }
              .lbs { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .ldr { stroke: var(--ink-300); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
              .hd { font: 700 12px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="hd" x="12" y="20">MUH KA KAATA HUA CHITRA — BAAYEN TARAF HOTH</text>

          <!-- upper palate / head outline -->
          <path class="face" d="M30 90 C 60 58, 150 44, 250 52 C 360 60, 440 96, 452 150"/>
          <!-- palate (roof of mouth) -->
          <path class="soft" d="M70 104 C 140 76, 250 78, 330 108 C 360 120, 372 140, 366 164 L 120 164 Z"/>
          <text class="lbs" x="215" y="142" text-anchor="middle">talu (mouth ki chhat)</text>
          <!-- lower jaw -->
          <path class="face" d="M30 250 C 90 276, 200 286, 300 268 C 380 254, 430 220, 440 186"/>
          <path class="soft" d="M74 212 C 160 236, 260 238, 340 214 L 340 258 C 250 282, 150 280, 74 254 Z"/>
          <text class="lbs" x="206" y="250" text-anchor="middle">neeche ka jabda</text>

          <!-- upper teeth -->
          <rect class="tooth" x="62" y="160" width="16" height="30" rx="3"/>
          <rect class="tooth" x="80" y="160" width="16" height="30" rx="3"/>
          <!-- lower teeth -->
          <rect class="tooth" x="62" y="186" width="16" height="28" rx="3"/>
          <rect class="tooth" x="80" y="186" width="16" height="28" rx="3"/>
          <text class="lbs" x="78" y="152" text-anchor="middle">daant</text>

          <!-- tongue body -->
          <path class="tng" d="M120 236 C 150 200, 210 190, 260 196 C 320 204, 360 222, 372 242 C 330 258, 180 262, 120 236 Z"/>
          <text class="lbs" x="300" y="232" text-anchor="middle">zubaan</text>

          <!-- position markers -->
          <circle cx="104" cy="178" r="12" fill="var(--role-noun)"/>
          <text class="pt" x="104" y="183" text-anchor="middle">1</text>
          <circle cx="134" cy="166" r="12" fill="var(--brand-600)"/>
          <text class="pt" x="134" y="171" text-anchor="middle">2</text>
          <circle cx="252" cy="118" r="12" fill="var(--role-adj)"/>
          <text class="pt" x="252" y="123" text-anchor="middle">3</text>
          <circle cx="56" cy="176" r="12" fill="var(--role-verb)"/>
          <text class="pt" x="56" y="181" text-anchor="middle">4</text>

          <!-- legend -->
          <g transform="translate(460 60)">
            <circle cx="10" cy="0" r="9" fill="var(--role-noun)"/>
            <text class="lb" x="26" y="5">1 — Hindi ka त</text>
            <text class="lbs" x="26" y="22">zubaan daanton ke</text>
            <text class="lbs" x="26" y="37">peeche, bilkul chipki</text>

            <circle cx="10" cy="76" r="9" fill="var(--brand-600)"/>
            <text class="lb" x="26" y="81">2 — English T / D / N</text>
            <text class="lbs" x="26" y="98">daanton se thoda peeche,</text>
            <text class="lbs" x="26" y="113">ubhri hui jagah par</text>

            <circle cx="10" cy="152" r="9" fill="var(--role-adj)"/>
            <text class="lb" x="26" y="157">3 — Hindi ka ट</text>
            <text class="lbs" x="26" y="174">talu se lagti hai —</text>
            <text class="lbs" x="26" y="189">English me yahan nahi!</text>

            <circle cx="10" cy="228" r="9" fill="var(--role-verb)"/>
            <text class="lb" x="26" y="233">4 — TH (think, this)</text>
            <text class="lbs" x="26" y="250">zubaan daanton ke</text>
            <text class="lbs" x="26" y="265">BEECH se bahar</text>
          </g>
        </svg>