<svg viewBox="0 0 480 400" role="img" aria-label="Sawaal-jawaab ka flowchart: poora suno, dohraao, phir socho ki jawaab pata hai ya nahi. Pata ho to chhota jawaab, na pata ho to imaandaari aur vaada. Ant me poochho ki jawaab mila ya nahi." xmlns="http://www.w3.org/2000/svg"><title>Dohraane se do faayde: sabne sawaal sun liya, aur aapko sochne ke teen second mil gaye.</title><style>svg{--accent:#ea580c;--accent-2:#f59e0b;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--accent-soft:color-mix(in srgb, #ea580c 10%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .qa-n { fill: var(--sheet); stroke: var(--accent); stroke-width: 2; }
              .qa-n2 { fill: var(--sheet); stroke: var(--accent-2); stroke-width: 2; }
              .qa-d { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
              .qa-e { fill: var(--accent-soft); stroke: var(--role-conj); stroke-width: 2; }
              .qa-ln { fill: none; stroke: var(--accent-line); stroke-width: 2.5; marker-end: url(#qa-ar); }
              .qa-t { font: 700 14px var(--font); fill: var(--text); }
              .qa-s { font: italic 500 12px var(--font); fill: var(--text-soft); }
              .qa-b { font: 700 12px var(--font); fill: var(--accent); }
            </style>
            <marker id="qa-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-line)"/>
            </marker>
          </defs>

          <rect class="qa-n" x="20" y="14" width="440" height="48" rx="10"/>
          <text class="qa-t" x="240" y="43" text-anchor="middle">1 · Poora suno — beech me mat kaato</text>
          <path class="qa-ln" d="M240 64 L240 84"/>

          <rect class="qa-n" x="20" y="88" width="440" height="56" rx="10"/>
          <text class="qa-t" x="240" y="111" text-anchor="middle">2 · Apne shabdon me dohraao</text>
          <text class="qa-s" x="240" y="131" text-anchor="middle">"So you're asking about the cost…"</text>
          <path class="qa-ln" d="M240 146 L240 162"/>

          <polygon class="qa-d" points="240,166 350,196 240,226 130,196"/>
          <text class="qa-t" x="240" y="201" text-anchor="middle">Jawaab pata hai?</text>

          <path class="qa-ln" d="M130 196 L110 196 L110 250"/>
          <text class="qa-b" x="96" y="188" text-anchor="middle">Haan</text>
          <path class="qa-ln" d="M350 196 L366 196 L366 250"/>
          <text class="qa-b" x="384" y="188" text-anchor="middle">Nahi</text>

          <rect class="qa-n2" x="10" y="254" width="200" height="66" rx="10"/>
          <text class="qa-t" x="110" y="280" text-anchor="middle">Chhota jawaab</text>
          <text class="qa-s" x="110" y="302" text-anchor="middle">"In short, about two lakh."</text>

          <rect class="qa-n2" x="262" y="254" width="208" height="66" rx="10"/>
          <text class="qa-t" x="366" y="280" text-anchor="middle">Imaandaari + vaada</text>
          <text class="qa-s" x="366" y="302" text-anchor="middle">"I'll get back to you by Friday."</text>

          <path class="qa-ln" d="M110 322 L110 340"/>
          <path class="qa-ln" d="M366 322 L366 340"/>
          <rect class="qa-e" x="60" y="344" width="360" height="44" rx="22"/>
          <text class="qa-t" x="240" y="371" text-anchor="middle">3 · "Does that answer your question?"</text>
        </svg>