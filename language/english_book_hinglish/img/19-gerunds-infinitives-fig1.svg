<svg viewBox="0 0 680 296" role="img" aria-label="Verb sorter: pehla verb dekho. Pehla dabba plus -ing — enjoy, avoid, finish, suggest, mind, keep, practise, consider. Doosra dabba dono, par matlab badalta hai — stop, remember, forget, try. Teesra dabba plus to V1 — want, decide, hope, plan, agree, refuse, promise, manage." xmlns="http://www.w3.org/2000/svg"><title>Pehla verb dekho, phir dabba yaad karo. Beech wale dabbe ke verbs dono le sakte hain — par matlab alag.</title><style>svg{--accent:#ea580c;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-noun:#2563eb;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .gs-top { fill: var(--accent); }
              .gs-tt { font: 800 13.5px var(--font); fill: #fff; }
              .gs-bin { fill: var(--sheet); stroke-width: 2.2; }
              .gs-hd { font: 800 15px var(--font); }
              .gs-sub { font: 500 11px var(--font); fill: var(--text-soft); }
              .gs-w { font: 600 12.5px var(--font); fill: var(--text); }
              .gs-ex { font: 700 11.5px var(--font); }
              .gs-cn { fill: none; stroke: var(--text-soft); stroke-width: 1.7; }
            </style>
            <marker id="gsArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--text-soft)"/>
            </marker>
          </defs>

          <rect class="gs-top" x="230" y="10" width="220" height="36" rx="18"/>
          <text class="gs-tt" x="340" y="33" text-anchor="middle">Pehla verb kaun hai?</text>

          <path class="gs-cn" d="M340 46 L340 62 L120 62 L120 96" marker-end="url(#gsArrow)"/>
          <path class="gs-cn" d="M340 62 L340 96" marker-end="url(#gsArrow)"/>
          <path class="gs-cn" d="M340 62 L560 62 L560 96" marker-end="url(#gsArrow)"/>

          <!-- -ing -->
          <rect class="gs-bin" x="20" y="100" width="200" height="184" rx="12" stroke="var(--role-verb)"/>
          <text class="gs-hd" x="120" y="126" text-anchor="middle" fill="var(--role-verb)">+ verb-ing</text>
          <text class="gs-sub" x="120" y="143" text-anchor="middle">gerund leta hai</text>
          <text class="gs-w" x="70" y="172" text-anchor="middle">enjoy</text>
          <text class="gs-w" x="170" y="172" text-anchor="middle">mind</text>
          <text class="gs-w" x="70" y="194" text-anchor="middle">avoid</text>
          <text class="gs-w" x="170" y="194" text-anchor="middle">keep</text>
          <text class="gs-w" x="70" y="216" text-anchor="middle">finish</text>
          <text class="gs-w" x="170" y="216" text-anchor="middle">practise</text>
          <text class="gs-w" x="70" y="238" text-anchor="middle">suggest</text>
          <text class="gs-w" x="170" y="238" text-anchor="middle">consider</text>
          <text class="gs-ex" x="120" y="268" text-anchor="middle" fill="var(--role-verb)">I enjoy dancing.</text>

          <!-- both -->
          <rect class="gs-bin" x="240" y="100" width="200" height="184" rx="12" stroke="var(--accent)"/>
          <text class="gs-hd" x="340" y="126" text-anchor="middle" fill="var(--accent)">dono</text>
          <text class="gs-sub" x="340" y="143" text-anchor="middle">par matlab badal jaata hai</text>
          <text class="gs-w" x="340" y="172" text-anchor="middle">stop</text>
          <text class="gs-w" x="340" y="194" text-anchor="middle">remember</text>
          <text class="gs-w" x="340" y="216" text-anchor="middle">forget</text>
          <text class="gs-w" x="340" y="238" text-anchor="middle">try</text>
          <text class="gs-ex" x="340" y="268" text-anchor="middle" fill="var(--accent)">stop eating ≠ stop to eat</text>

          <!-- to -->
          <rect class="gs-bin" x="460" y="100" width="200" height="184" rx="12" stroke="var(--role-noun)"/>
          <text class="gs-hd" x="560" y="126" text-anchor="middle" fill="var(--role-noun)">+ to V1</text>
          <text class="gs-sub" x="560" y="143" text-anchor="middle">infinitive leta hai</text>
          <text class="gs-w" x="510" y="172" text-anchor="middle">want</text>
          <text class="gs-w" x="610" y="172" text-anchor="middle">agree</text>
          <text class="gs-w" x="510" y="194" text-anchor="middle">decide</text>
          <text class="gs-w" x="610" y="194" text-anchor="middle">refuse</text>
          <text class="gs-w" x="510" y="216" text-anchor="middle">hope</text>
          <text class="gs-w" x="610" y="216" text-anchor="middle">promise</text>
          <text class="gs-w" x="510" y="238" text-anchor="middle">plan</text>
          <text class="gs-w" x="610" y="238" text-anchor="middle">manage</text>
          <text class="gs-ex" x="560" y="268" text-anchor="middle" fill="var(--role-noun)">I want to dance.</text>
        </svg>