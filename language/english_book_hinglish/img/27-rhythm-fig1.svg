<svg viewBox="0 0 660 340" role="img" aria-label="Teen shabdon ki stress patti: PHO-to-graph me pehla hissa ooncha, pho-TO-gra-pher me doosra hissa ooncha, pho-to-GRAPH-ic me teesra hissa ooncha" xmlns="http://www.w3.org/2000/svg"><title>Narangi ooncha khamba = zor wala hissa. Dhyan do — shabd ka roop badalte hi zor jagah badal deta hai . Yaad rakhne layak baat: ek shabd = ek chamakta hissa.</title><style>svg{--brand-500:#f97316;--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--ink-200:#e2e8f0;--line:#e3e7ef;--role-prep:#ea580c;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .base { fill: var(--ink-200); }
              .hit { fill: var(--brand-500); }
              .syl { font: 600 12px var(--font); fill: var(--text-soft); }
              .sylhit { font: 800 13px var(--font); fill: var(--role-prep); }
              .wd3 { font: 700 14px var(--font); fill: var(--text); }
              .mn3 { font: 500 11.5px var(--font); fill: var(--text-soft); }
              .gl { stroke: var(--line); stroke-width: 1; }
              .hd3 { font: 700 11.5px var(--font); fill: var(--text-soft); letter-spacing: 0.08em; }
            </style>
          </defs>

          <text class="hd3" x="12" y="18">EK HI JAD, TEEN ALAG ZOR</text>

          <!-- ROW 1 : PHOtograph -->
          <g transform="translate(12 34)">
            <text class="wd3" x="0" y="12">photograph</text>
            <text class="mn3" x="100" y="12">(tasveer)</text>
            <line class="gl" x1="0" y1="78" x2="636" y2="78"/>
            <!-- bars baseline y=78, grow upward -->
            <rect class="hit" x="8" y="26" width="76" height="52" rx="5"/>
            <text class="sylhit" x="46" y="94" text-anchor="middle">PHO</text>
            <rect class="base" x="94" y="58" width="76" height="20" rx="5"/>
            <text class="syl" x="132" y="94" text-anchor="middle">to</text>
            <rect class="base" x="180" y="52" width="76" height="26" rx="5"/>
            <text class="syl" x="218" y="94" text-anchor="middle">graph</text>
          </g>

          <!-- ROW 2 : phoTOGrapher -->
          <g transform="translate(12 142)">
            <text class="wd3" x="0" y="12">photographer</text>
            <text class="mn3" x="112" y="12">(tasveer kheenchne wala)</text>
            <line class="gl" x1="0" y1="78" x2="636" y2="78"/>
            <rect class="base" x="8" y="60" width="76" height="18" rx="5"/>
            <text class="syl" x="46" y="94" text-anchor="middle">pho</text>
            <rect class="hit" x="94" y="26" width="76" height="52" rx="5"/>
            <text class="sylhit" x="132" y="94" text-anchor="middle">TOG</text>
            <rect class="base" x="180" y="62" width="76" height="16" rx="5"/>
            <text class="syl" x="218" y="94" text-anchor="middle">ra</text>
            <rect class="base" x="266" y="58" width="76" height="20" rx="5"/>
            <text class="syl" x="304" y="94" text-anchor="middle">pher</text>
          </g>

          <!-- ROW 3 : photoGRAPHic -->
          <g transform="translate(12 250)">
            <text class="wd3" x="0" y="12">photographic</text>
            <text class="mn3" x="112" y="12">(tasveer se juda)</text>
            <line class="gl" x1="0" y1="78" x2="636" y2="78"/>
            <rect class="base" x="8" y="58" width="76" height="20" rx="5"/>
            <text class="syl" x="46" y="94" text-anchor="middle">pho</text>
            <rect class="base" x="94" y="62" width="76" height="16" rx="5"/>
            <text class="syl" x="132" y="94" text-anchor="middle">to</text>
            <rect class="hit" x="180" y="26" width="76" height="52" rx="5"/>
            <text class="sylhit" x="218" y="94" text-anchor="middle">GRAPH</text>
            <rect class="base" x="266" y="62" width="76" height="16" rx="5"/>
            <text class="syl" x="304" y="94" text-anchor="middle">ic</text>
          </g>
        </svg>