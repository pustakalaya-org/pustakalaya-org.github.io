<svg viewBox="0 0 660 236" role="img" aria-label="Vaakya 'When the rain stopped, the children ran into the garden' ke andar do clauses hain. Har clause ke andar phrases hain — 'the rain', 'the children' noun phrase aur 'into the garden' prepositional phrase." xmlns="http://www.w3.org/2000/svg"><title>Vaakya ke andar clause, clause ke andar phrase — jaise dabbe ke andar chhote dabbe.</title><style>svg{--accent:#ea580c;--accent-line:color-mix(in srgb, #ea580c 28%, #ffffff);--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .pc-out { fill: none; stroke: var(--accent-line); stroke-width: 2; stroke-dasharray: 6 5; }
              .pc-cl { fill: none; stroke-width: 2.2; }
              .pc-ph { fill: var(--sheet); stroke: var(--text-soft); stroke-width: 1.5; }
              .pc-w { font: 700 13.5px var(--font); fill: var(--text); }
              .pc-hd { font: 800 11.5px var(--font); letter-spacing: .04em; }
              .pc-sm { font: 500 10.5px var(--font); fill: var(--text-soft); }
              .pc-note { font: 500 11.5px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <rect class="pc-out" x="10" y="10" width="640" height="168" rx="14"/>
          <text class="pc-hd" x="26" y="30" fill="var(--accent)">SENTENCE</text>

          <rect class="pc-cl" x="24" y="40" width="230" height="122" rx="10" stroke="var(--role-conj)"/>
          <text class="pc-hd" x="139" y="60" text-anchor="middle" fill="var(--role-conj)">CLAUSE 1</text>
          <text class="pc-w" x="34" y="101">When</text>
          <rect class="pc-ph" x="80" y="78" width="88" height="34" rx="7"/>
          <text class="pc-w" x="124" y="101" text-anchor="middle">the rain</text>
          <text class="pc-w" x="176" y="101" fill="var(--role-verb)">stopped,</text>
          <text class="pc-sm" x="124" y="132" text-anchor="middle">noun phrase</text>
          <text class="pc-sm" x="205" y="132" text-anchor="middle">verb</text>

          <rect class="pc-cl" x="268" y="40" width="370" height="122" rx="10" stroke="var(--role-verb)"/>
          <text class="pc-hd" x="453" y="60" text-anchor="middle" fill="var(--role-verb)">CLAUSE 2</text>
          <rect class="pc-ph" x="280" y="78" width="112" height="34" rx="7"/>
          <text class="pc-w" x="336" y="101" text-anchor="middle">the children</text>
          <text class="pc-w" x="400" y="101" fill="var(--role-verb)">ran</text>
          <rect class="pc-ph" x="438" y="78" width="150" height="34" rx="7"/>
          <text class="pc-w" x="513" y="101" text-anchor="middle">into the garden.</text>
          <text class="pc-sm" x="336" y="132" text-anchor="middle">noun phrase</text>
          <text class="pc-sm" x="412" y="132" text-anchor="middle">verb</text>
          <text class="pc-sm" x="513" y="132" text-anchor="middle">prepositional phrase</text>

          <text class="pc-note" x="330" y="204" text-anchor="middle">Clause = subject + verb ki jodi (rain stopped · children ran)</text>
          <text class="pc-note" x="330" y="224" text-anchor="middle">Phrase = shabdon ka jhund, jisme ye jodi nahi hoti</text>
        </svg>