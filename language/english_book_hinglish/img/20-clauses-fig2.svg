<svg viewBox="0 0 660 300" role="img" aria-label="Chaar vaakya ke prakaar clause dabbon me: Simple — ek independent clause. Compound — do independent clauses 'and' se jude. Complex — ek independent aur ek dependent clause. Compound-complex — do independent aur kam se kam ek dependent clause." xmlns="http://www.w3.org/2000/svg"><title>Solid dabba = independent clause, dashed = dependent. Prakaar sirf ginti se tay hota hai.</title><style>svg{--font:'Inter', 'Noto Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;--role-conj:#65a30d;--role-verb:#0d9488;--sheet:#ffffff;--text:#121826;--text-soft:#4b5568;background:#fff;font-family:var(--font,sans-serif)}</style>
          <defs>
            <style>
              .st-i { fill: var(--sheet); stroke: var(--role-verb); stroke-width: 2.2; }
              .st-d { fill: var(--sheet); stroke: var(--role-conj); stroke-width: 2.2; stroke-dasharray: 6 4; }
              .st-wi { font: 700 13px var(--font); fill: var(--role-verb); }
              .st-wd { font: 700 13px var(--font); fill: var(--role-conj); }
              .st-cj { font: 800 13px var(--font); fill: var(--text); }
              .st-nm { font: 800 13px var(--font); fill: var(--text); }
              .st-f { font: 700 11.5px var(--font); fill: var(--text-soft); }
              .st-lg { font: 500 11px var(--font); fill: var(--text-soft); }
            </style>
          </defs>

          <text class="st-nm" x="14" y="45">Simple</text>
          <rect class="st-i" x="150" y="22" width="110" height="36" rx="8"/>
          <text class="st-wi" x="205" y="45" text-anchor="middle">I like tea.</text>
          <text class="st-f" x="646" y="45" text-anchor="end">I</text>

          <text class="st-nm" x="14" y="110">Compound</text>
          <rect class="st-i" x="150" y="87" width="110" height="36" rx="8"/>
          <text class="st-wi" x="205" y="110" text-anchor="middle">I like tea,</text>
          <text class="st-cj" x="285" y="110" text-anchor="middle">and</text>
          <rect class="st-i" x="310" y="87" width="150" height="36" rx="8"/>
          <text class="st-wi" x="385" y="110" text-anchor="middle">she likes coffee.</text>
          <text class="st-f" x="646" y="110" text-anchor="end">I + I</text>

          <text class="st-nm" x="14" y="175">Complex</text>
          <rect class="st-i" x="150" y="152" width="110" height="36" rx="8"/>
          <text class="st-wi" x="205" y="175" text-anchor="middle">I drink tea</text>
          <rect class="st-d" x="270" y="152" width="150" height="36" rx="8"/>
          <text class="st-wd" x="345" y="175" text-anchor="middle">when I am tired.</text>
          <text class="st-f" x="646" y="175" text-anchor="end">I + D</text>

          <text class="st-nm" x="14" y="232">Compound-</text>
          <text class="st-nm" x="14" y="249">complex</text>
          <rect class="st-i" x="150" y="217" width="110" height="36" rx="8"/>
          <text class="st-wi" x="205" y="240" text-anchor="middle">I like tea,</text>
          <text class="st-cj" x="282" y="240" text-anchor="middle">but</text>
          <rect class="st-i" x="304" y="217" width="124" height="36" rx="8"/>
          <text class="st-wi" x="366" y="240" text-anchor="middle">I drink coffee</text>
          <rect class="st-d" x="438" y="217" width="150" height="36" rx="8"/>
          <text class="st-wd" x="513" y="240" text-anchor="middle">when I work late.</text>
          <text class="st-f" x="646" y="240" text-anchor="end">I+I+D</text>

          <rect class="st-i" x="150" y="276" width="26" height="14" rx="3"/>
          <text class="st-lg" x="184" y="287">independent (I)</text>
          <rect class="st-d" x="300" y="276" width="26" height="14" rx="3"/>
          <text class="st-lg" x="334" y="287">dependent (D)</text>
        </svg>