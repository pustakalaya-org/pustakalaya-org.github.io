<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pustakālaya</title>
  <!-- The mark of Pustakālaya: a lamp (dīpa) whose flame rises from an open book, on a maroon seal.
       Flat colours only. tools/icons.py reads this file (circles and paths with M, L, Q, C and Z) and draws
       the PNG icons from it; elements with class="fine" are left out of the smallest icons. -->
  <circle cx="256" cy="256" r="256" fill="#800000"/>
  <circle class="fine" cx="256" cy="256" r="230" fill="none" stroke="#DAA520" stroke-width="6"/>
  <!-- book: gold binding under two cream pages -->
  <path d="M100 318 Q182 304 256 334 Q330 304 412 318 L412 392 Q330 380 256 408 Q182 380 100 392 Z" fill="#DAA520"/>
  <path d="M256 320 Q184 292 112 304 L112 376 Q184 364 256 392 Z" fill="#FBF3E0"/>
  <path d="M256 320 Q328 292 400 304 L400 376 Q328 364 256 392 Z" fill="#FBF3E0"/>
  <!-- lines of text -->
  <path class="fine" d="M136 330 Q184 322 228 340" fill="none" stroke="#800000" stroke-width="7" stroke-linecap="round"/>
  <path class="fine" d="M136 352 Q184 344 228 362" fill="none" stroke="#800000" stroke-width="7" stroke-linecap="round"/>
  <path class="fine" d="M376 330 Q328 322 284 340" fill="none" stroke="#800000" stroke-width="7" stroke-linecap="round"/>
  <path class="fine" d="M376 352 Q328 344 284 362" fill="none" stroke="#800000" stroke-width="7" stroke-linecap="round"/>
  <!-- spine -->
  <path d="M256 322 L256 390" fill="none" stroke="#800000" stroke-width="6" stroke-linecap="round"/>
  <!-- the lamp: a gold bowl resting in the open book -->
  <path d="M196 282 L316 282 Q306 326 256 328 Q206 326 196 282 Z" fill="#DAA520"/>
  <path d="M188 276 L324 276 L320 288 L192 288 Z" fill="#DAA520"/>
  <!-- flame -->
  <path d="M262 84 C266 128 314 172 314 224 C314 260 290 280 256 280 C222 280 198 260 198 226 C198 184 236 158 250 122 C255 108 260 96 262 84 Z" fill="#FF9933"/>
  <path d="M259 152 C262 184 288 208 288 236 C288 258 274 270 256 270 C238 270 224 258 224 238 C224 214 243 198 251 178 C255 168 258 160 259 152 Z" fill="#FBF3E0"/>
</svg>
