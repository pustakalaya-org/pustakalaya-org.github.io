<svg class="dg" viewBox="0 0 1000 433" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The signature is checked by the firmware itself; LVFS and fwupd only deliver and stage.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="426.2"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="426.2"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="426.2"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="426.2"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Vendor</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">LVFS</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">fwupd</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">UEFI firmware</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Upload signed capsule</tspan><tspan x="240.0" dy="18.8">(.cab)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Signed metadata (GUIDs,</tspan><tspan x="500.0" dy="18.8">versions)</tspan></text><line class="ln" x1="370.0" y1="163.8" x2="619.0" y2="163.8"/><polygon class="ah" points="630.0,163.8 619.0,157.7 619.0,169.8"/><text class="n ml" x="500.0" y="215.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. Download matching .cab</tspan></text><line class="ln" x1="630.0" y1="227.5" x2="381.0" y2="227.5"/><polygon class="ah" points="370.0,227.5 381.0,233.6 381.0,221.4"/><text class="n ml" x="760.0" y="260.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. Stage capsule, reboot</tspan></text><line class="ln" x1="630.0" y1="272.5" x2="879.0" y2="272.5"/><polygon class="ah" points="890.0,272.5 879.0,266.4 879.0,278.6"/><text class="n ml" x="760.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">5. Sig + LSV verified,</tspan><tspan x="760.0" dy="18.8">flashed; ESRT status</tspan></text><line class="ln lnd" x1="890.0" y1="317.5" x2="641.0" y2="317.5"/><polygon class="ah" points="630.0,317.5 641.0,323.6 641.0,311.4"/><text class="n ml" x="500.0" y="369.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Optional success report</tspan></text><line class="ln lnd" x1="630.0" y1="381.2" x2="381.0" y2="381.2"/><polygon class="ah" points="370.0,381.2 381.0,387.3 381.0,375.2"/></svg>