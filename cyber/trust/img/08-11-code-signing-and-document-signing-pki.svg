<svg class="dg" viewBox="0 0 1000 309" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The key never leaves the HSM; the timestamp preserves validity past certificate expiry.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="302.5"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="302.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="302.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Build server</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">HSM</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Timestamp</tspan><tspan x="890.0" dy="22.5">authority</tspan></text></g><text class="n ml" x="305.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. hash of artefact to sign</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="489.0" y2="122.5"/><polygon class="ah" points="500.0,122.5 489.0,116.5 489.0,128.6"/><text class="n ml" x="305.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">2. signature (key stays inside)</tspan></text><line class="ln lnd" x1="500.0" y1="167.5" x2="121.0" y2="167.5"/><polygon class="ah" points="110.0,167.5 121.0,173.6 121.0,161.4"/><text class="n ml" x="500.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. request timestamp over signature</tspan></text><line class="ln" x1="110.0" y1="212.5" x2="879.0" y2="212.5"/><polygon class="ah" points="890.0,212.5 879.0,206.4 879.0,218.6"/><text class="n ml" x="500.0" y="245.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. signed timestamp token (RFC 3161)</tspan></text><line class="ln lnd" x1="890.0" y1="257.5" x2="121.0" y2="257.5"/><polygon class="ah" points="110.0,257.5 121.0,263.6 121.0,251.4"/></svg>