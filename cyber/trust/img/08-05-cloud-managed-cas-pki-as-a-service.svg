<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The provider runs and protects the CA; clients enrol over standard protocols.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="111.0" x2="500.0" y2="195.4"/><polygon class="ah" points="500.0,206.4 506.1,195.4 493.9,195.4"/><line class="ln" x1="751.7" y1="211.2" x2="630.8" y2="229.8"/><polygon class="ah" points="619.9,231.5 631.7,235.8 629.9,223.8"/><line class="ln" x1="664.2" y1="357.3" x2="572.5" y2="297.4"/><polygon class="ah" points="563.3,291.4 569.2,302.4 575.8,292.3"/><line class="ln" x1="335.8" y1="357.3" x2="427.5" y2="297.4"/><polygon class="ah" points="436.7,291.4 424.2,292.3 430.8,302.4"/><line class="ln" x1="248.3" y1="211.2" x2="369.2" y2="229.8"/><polygon class="ah" points="380.1,231.5 370.1,223.8 368.3,235.8"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Load balancers</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">serverAuth certs</tspan></text><rect class="bx" x="756.6" y="161.0" width="200.0" height="68.0" rx="12"/><text class="t" x="856.6" y="190.4" text-anchor="middle" font-size="17"><tspan x="856.6" dy="0.0">Kubernetes</tspan></text><text class="n" x="856.6" y="214.0" text-anchor="middle" font-size="13"><tspan x="856.6" dy="0.0">via cert-manager issuer</tspan></text><rect class="bx" x="620.4" y="360.0" width="200.0" height="68.0" rx="12"/><text class="t" x="720.4" y="389.5" text-anchor="middle" font-size="17"><tspan x="720.4" dy="0.0">IoT fleet</tspan></text><text class="n" x="720.4" y="413.0" text-anchor="middle" font-size="13"><tspan x="720.4" dy="0.0">device identity</tspan></text><rect class="bx" x="179.6" y="360.0" width="200.0" height="68.0" rx="12"/><text class="t" x="279.6" y="389.5" text-anchor="middle" font-size="17"><tspan x="279.6" dy="0.0">VPN / clients</tspan></text><text class="n" x="279.6" y="413.0" text-anchor="middle" font-size="13"><tspan x="279.6" dy="0.0">mTLS</tspan></text><rect class="bx" x="43.4" y="161.0" width="200.0" height="68.0" rx="12"/><text class="t" x="143.4" y="190.4" text-anchor="middle" font-size="17"><tspan x="143.4" dy="0.0">CI/CD</tspan></text><text class="n" x="143.4" y="214.0" text-anchor="middle" font-size="13"><tspan x="143.4" dy="0.0">signing &amp; test certs</tspan></text><rect class="bxa" x="385.0" y="211.4" width="230.0" height="