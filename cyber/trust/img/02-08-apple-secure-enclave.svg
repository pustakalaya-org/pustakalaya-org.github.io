<svg class="dg" viewBox="0 0 1000 494" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The application processor can only ask; secrets and decisions stay in the Enclave.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="28.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Application</tspan><tspan x="4.0" dy="17.5">processor</tspan></text><line class="ln" x1="346.0" y1="55.0" x2="572.0" y2="130.0"/><line class="ln" x1="572.0" y1="55.0" x2="572.0" y2="130.0"/><line class="ln" x1="798.0" y1="55.0" x2="572.0" y2="130.0"/><text class="lab" x="4.0" y="159.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Mailbox (only</tspan><tspan x="4.0" dy="17.5">path)</tspan></text><line class="ln" x1="572.0" y1="196.0" x2="228.0" y2="286.0"/><line class="ln" x1="572.0" y1="196.0" x2="400.0" y2="286.0"/><line class="ln" x1="572.0" y1="196.0" x2="572.0" y2="286.0"/><line class="ln" x1="572.0" y1="196.0" x2="744.0" y2="286.0"/><line class="ln" x1="572.0" y1="196.0" x2="916.0" y2="266.0"/><text class="lab" x="4.0" y="314.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Secure Enclave</tspan></text><line class="ln" x1="228.0" y1="332.0" x2="459.0" y2="432.0"/><line class="ln" x1="400.0" y1="332.0" x2="459.0" y2="432.0"/><line class="ln" x1="572.0" y1="332.0" x2="459.0" y2="432.0"/><line class="ln" x1="744.0" y1="332.0" x2="685.0" y2="422.0"/><line class="ln" x1="916.0" y1="352.0" x2="685.0" y2="422.0"/><text class="lab" x="4.0" y="460.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Silicon roots</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">iOS / macOS kernel</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Apps</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">Keychain services</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Request: sign,</tspan><tspan x="572.0" dy="20.0">unwrap, match</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="150.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="228.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="228.0" dy="0.0">SEP + sepOS</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="322.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="400.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="400.0" dy="0.0">Boot ROM</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="494.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">AES engine</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="666.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="744.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="744.0" dy="0.0">PKA &amp; TRNG</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="838.0" y="-43.0" width="156.0" height="86.0" rx="12"/><text class="t" x="916.0" y="-14.4" text-anchor="middle" font-size="16"><tspan x="916.0" dy="0.0">Memory</tspan><tspan x="916.0" dy="20.0">Protection</tspan><tspan x="916.0" dy="20.0">Engine</tspan></text></g><g transform="translate(0,455.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">UID key (fused)</tspan></text></g><g transform="translate(0,455.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Secure Storage</tspan><tspan x="685.0" dy="20.0">Component</tspan></text></g></svg>