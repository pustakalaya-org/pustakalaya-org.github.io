<svg class="dg" viewBox="0 0 1000 534" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Same messages work over MCTP (out-of-band) or PCIe DOE (in-band).</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="527.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="527.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="110.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Requester (BMC /</tspan><tspan x="110.0" dy="22.5">RoT)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Responder (GPU,</tspan><tspan x="890.0" dy="22.5">NIC, SSD)</tspan></text></g><text class="n ml" x="500.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">1. GET_VERSION / GET_CAPABILITIES</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="879.0" y2="122.5"/><polygon class="ah" points="890.0,122.5 879.0,116.5 879.0,128.6"/><text class="n ml" x="500.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. NEGOTIATE_ALGORITHMS (e.g. ECDSA P-384, SHA-384)</tspan></text><line class="ln" x1="110.0" y1="167.5" x2="879.0" y2="167.5"/><polygon class="ah" points="890.0,167.5 879.0,161.4 879.0,173.6"/><text class="n ml" x="500.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. GET_DIGESTS, GET_CERTIFICATE</tspan></text><line class="ln" x1="110.0" y1="212.5" x2="879.0" y2="212.5"/><polygon class="ah" points="890.0,212.5 879.0,206.4 879.0,218.6"/><text class="n ml" x="500.0" y="245.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. Device certificate chain</tspan></text><line class="ln lnd" x1="890.0" y1="257.5" x2="121.0" y2="257.5"/><polygon class="ah" points="110.0,257.5 121.0,263.6 121.0,251.4"/><text class="n ml" x="500.0" y="290.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. CHALLENGE (nonce)</tspan></text><line class="ln" x1="110.0" y1="302.5" x2="879.0" y2="302.5"/><polygon class="ah" points="890.0,302.5 879.0,296.4 879.0,308.6"/><text class="n ml" x="500.0" y="335.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. CHALLENGE_AUTH (signed)</tspan></text><line class="ln lnd" x1="890.0" y1="347.5" x2="121.0" y2="347.5"/><polygon class="ah" points="110.0,347.5 121.0,353.6 121.0,341.4"/><text class="n ml" x="500.0" y="380.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. GET_MEASUREMENTS (nonce)</tspan></text><line class="ln" x1="110.0" y1="392.5" x2="879.0" y2="392.5"/><polygon class="ah" points="890.0,392.5 879.0,386.4 879.0,398.6"/><text class="n ml" x="500.0" y="425.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. Signed firmware measurements</tspan></text><line class="ln lnd" x1="890.0" y1="437.5" x2="121.0" y2="437.5"/><polygon class="ah" points="110.0,437.5 121.0,443.6 121.0,431.4"/><text class="n ml" x="500.0" y="470.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">9. KEY_EXCHANGE / FINISH (secure session)</tspan></text><line class="ln" x1="110.0" y1="482.5" x2="879.0" y2="482.5"/><polygon class="ah" points="890.0,482.5 879.0,476.4 879.0,488.6"/></svg>