<svg class="dg" viewBox="0 0 1000 397" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Templates and AD permissions decide who gets what, with no human in the loop.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect class="bx" x="0.0" y="6.0" width="215.5" height="159.5" rx="14"/><rect class="bar" x="0.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="36.0" r="15"/><text class="bn" x="26.0" y="41.5" text-anchor="middle" font-size="16">1</text><text class="t" x="107.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">Template defined</tspan></text><text class="n" x="107.8" y="102.0" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">EKU, key usage,</tspan><tspan x="107.8" dy="19.5">validity, enrol rights</tspan></text><line class="ln" x1="220.5" y1="85.8" x2="245.5" y2="85.8"/><polygon class="ah" points="256.5,85.8 245.5,79.7 245.5,91.8"/><rect class="bx" x="261.5" y="6.0" width="215.5" height="159.5" rx="14"/><rect class="bar" x="261.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="36.0" r="15"/><text class="bn" x="287.5" y="41.5" text-anchor="middle" font-size="16">2</text><text class="t" x="369.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">GPO enables</tspan><tspan x="369.2" dy="23.8">autoenrolment</tspan></text><text class="n" x="369.2" y="125.8" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">for users/computers</tspan></text><line class="ln" x1="482.0" y1="85.8" x2="507.0" y2="85.8"/><polygon class="ah" points="518.0,85.8 507.0,79.7 507.0,91.8"/><rect class="bx" x="523.0" y="6.0" width="215.5" height="159.5" rx="14"/><rect class="bar" x="523.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="549.0" cy="36.0" r="15"/><text class="bn" x="549.0" y="41.5" text-anchor="middle" font-size="16">3</text><text class="t" x="630.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="630.8" dy="0.0">Client checks</tspan><tspan x="630.8" dy="23.8">eligibility</tspan></text><text class="n" x="630.8" y="125.8" text-anchor="middle" font-size="15"><tspan x="630.8" dy="0.0">reads templates from AD</tspan></text><line class="ln" x1="743.5" y1="85.8" x2="768.5" y2="85.8"/><polygon class="ah" points="779.5,85.8 768.5,79.7 768.5,91.8"/><rect class="bx" x="784.5" y="6.0" width="215.5" height="159.5" rx="14"/><rect class="bar" x="784.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="810.5" cy="36.0" r="15"/><text class="bn" x="810.5" y="41.5" text-anchor="middle" font-size="16">4</text><text class="t" x="892.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="892.2" dy="0.0">CSR sent to</tspan><tspan x="892.2" dy="23.8">enterprise CA</tspan></text><text class="n" x="892.2" y="125.8" text-anchor="middle" font-size="15"><tspan x="892.2" dy="0.0">over RPC/DCOM</tspan></text><path class="ln" d="M892.2,169.5 V197.5 H107.8"/><line class="ln" x1="107.8" y1="197.5" x2="107.8" y2="214.5"/><polygon class="ah" points="107.8,225.5 113.8,214.5 101.7,214.5"/><rect class="bx" x="0.0" y="229.5" width="215.5" height="159.5" rx="14"/><rect class="bar" x="0.0" y="229.5" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="259.5" r="15"/><text class="bn" x="26.0" y="265.0" text-anchor="middle" font-size="16">5</text><text class="t" x="107.8" y="297.6" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">CA applies</tspan><tspan x="107.8" dy="23.8">template &amp;</tspan><tspan x="107.8" dy="23.8">issues</tspan></text><text class="n" x="107.8" y="373.0" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">signs with CA key</tspan></text><line class="ln" x1="220.5" y1="309.2" x2="245.5" y2="309.2"/><polygon class="ah" points="256.5,309.2 245.5,303.2 245.5,315.3"/><rect class="bx" x="261.5" y="229.5" width="215.5" height="159.5" rx="14"/><rect class="bar" x="261.5" y="229.5" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="259.5" r="15"/><text class="bn" x="287.5" y="265.0" text-anchor="middle" font-size="16">6</text><text class="t" x="369.2" y="297.6" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">Cert installed &amp;</tspan><tspan x="369.2" dy="23.8">auto-renewed</tspan></text><text class="n" x="369.2" y="349.2" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">before expiry</tspan></text></svg>