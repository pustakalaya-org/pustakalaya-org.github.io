<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>One TPM underpins disk encryption, sign-in, credential isolation and compliance.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="235.4" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="589.7" y1="237.9" x2="692.8" y2="177.9"/><polygon class="ah" points="702.4,172.4 689.8,172.7 695.9,183.1"/><line class="ln" x1="620.0" y1="290.0" x2="759.0" y2="290.0"/><polygon class="ah" points="770.0,290.0 759.0,283.9 759.0,296.1"/><line class="ln" x1="589.7" y1="342.1" x2="674.6" y2="391.5"/><polygon class="ah" points="684.1,397.0 677.6,386.3 671.5,396.7"/><line class="ln" x1="500.0" y1="344.6" x2="500.0" y2="449.6"/><polygon class="ah" points="500.0,460.6 506.1,449.6 493.9,449.6"/><line class="ln" x1="410.3" y1="342.1" x2="325.4" y2="391.5"/><polygon class="ah" points="315.9,397.0 328.5,396.7 322.4,386.3"/><line class="ln" x1="380.0" y1="290.0" x2="241.0" y2="290.0"/><polygon class="ah" points="230.0,290.0 241.0,296.1 241.0,283.9"/><line class="ln" x1="410.3" y1="237.9" x2="325.4" y2="188.5"/><polygon class="ah" points="315.9,183.0 322.4,193.7 328.5,183.3"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">BitLocker</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">seals key to PCRs 7, 11</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Windows Hello</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">TPM-bound sign-in keys</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Credential Guard</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">protects VBS secrets</tspan></text><rect class="bx" x="665.2" y="399.5" width="200.0" height="89.2" rx="12"/><text class="t" x="765.2" y="429.0" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Health</tspan><tspan x="765.2" dy="21.2">attestation</tspan></text><text class="n" x="765.2" y="473.8" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">Intune compliance signals</tspan></text><rect class="bx" x="400.0" y="465.6" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="495.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Autopilot</tspan></text><text class="n" x="500.0" y="518.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">TPM attestation at</tspan><tspan x="500.0" dy="16.9">enrolment</tspan></text><rect class="bx" x="134.8" y="399.5" width="200.0" height="89.2" rx="12"/><text class="t" x="234.8" y="429.0" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Platform Crypto</tspan><tspan x="234.8" dy="21.2">Provider</tspan></text><text class="n" x="234.8" y="473.8" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">TPM-backed CNG keys</tspan></text><rect class="bx" x="25.0" y="245.4" width="200.0" height="89.2" rx="12"/><text class="t" x="125.0" y="274.8" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">AD CS key</tspan><tspan x="125.0" dy="21.2">attestation</tspan></text><text class="n" x="125.0" y="319.6" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">TPM-proven certificates</tspan></text><rect class="bx" x="134.8" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="234.8" y="120.7" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Virtual smart</tspan><tspan x="234.8" dy="21.2">card</tspan></text><text class="n" x="234.8" y="165.5" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">legacy TPM smart card</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Windows + TPM</tspan><tspan x="500.0" dy="26.2">2.0</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">via TPM Base Services</tspan></text></svg>