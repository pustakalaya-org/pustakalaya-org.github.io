<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>TCG names the first three; NIST SP 800-193 adds update, detection and recovery.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="239.4" x2="500.0" y2="130.4"/><polygon class="ah" points="500.0,119.5 493.9,130.4 506.1,130.4"/><line class="ln" x1="602.9" y1="242.3" x2="705.3" y2="194.8"/><polygon class="ah" points="715.3,190.2 702.8,189.3 707.9,200.3"/><line class="ln" x1="620.0" y1="305.9" x2="749.7" y2="323.1"/><polygon class="ah" points="760.6,324.6 750.5,317.1 748.9,329.1"/><line class="ln" x1="541.0" y1="339.5" x2="617.3" y2="431.6"/><polygon class="ah" points="624.4,440.1 622.0,427.8 612.7,435.5"/><line class="ln" x1="459.0" y1="339.5" x2="382.7" y2="431.6"/><polygon class="ah" points="375.6,440.1 387.3,435.5 378.0,427.8"/><line class="ln" x1="380.0" y1="305.9" x2="250.3" y2="323.1"/><polygon class="ah" points="239.4,324.6 251.1,329.1 249.5,317.1"/><line class="ln" x1="397.1" y1="242.3" x2="294.7" y2="194.8"/><polygon class="ah" points="284.7,190.2 292.1,200.3 297.2,189.3"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Measurement (RTM)</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">First reliable hash of</tspan><tspan x="500.0" dy="16.9">code</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Storage (RTS)</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">Shielded keys and PCRs</tspan></text><rect class="bx" x="765.6" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="865.6" y="334.0" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Reporting (RTR)</tspan></text><text class="n" x="865.6" y="357.5" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">Signs what was measured</tspan></text><rect class="bx" x="562.7" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="662.7" y="473.4" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Verification</tspan></text><text class="n" x="662.7" y="497.0" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">Checks signatures before</tspan><tspan x="662.7" dy="16.9">running</tspan></text><rect class="bx" x="237.3" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="337.3" y="473.4" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Update (RTU)</tspan></text><text class="n" x="337.3" y="497.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">Accepts only authentic</tspan><tspan x="337.3" dy="16.9">updates</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Detection (RTD)</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">Spots corrupted firmware</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Recovery (RTRec)</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">Restores known-good images</tspan></text><rect class="bxa" x="385.0" y="244.4" width="230.0" height="91.2" rx="12"/><text class="t" x="500.0" y="277.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Roots of trust</tspan></text><text class="n" x="500.0" y="302.4" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">Trusted because nothing can</tspan><tspan x="500.0" dy="18.2">check them</tspan></text></svg>