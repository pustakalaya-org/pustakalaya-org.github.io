<svg class="dg" viewBox="0 0 1000 353" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The device trusts the result only because the public key&#x27;s hash is fixed in hardware.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="347.0"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="347.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="347.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Vendor HSM</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Update server</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Device boot ROM</tspan></text></g><text class="n ml" x="305.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. Signed image: firmware + ECDSA signature</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="489.0" y2="100.0"/><polygon class="ah" points="500.0,100.0 489.0,94.0 489.0,106.0"/><text class="n ml" x="695.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">2. Download image and public key</tspan></text><line class="ln" x1="500.0" y1="145.0" x2="879.0" y2="145.0"/><polygon class="ah" points="890.0,145.0 879.0,138.9 879.0,151.1"/><text class="n" x="820.0" y="198.9" text-anchor="end" font-size="15"><tspan x="820.0" dy="0.0">3. Hash public key, compare</tspan><tspan x="820.0" dy="18.8">with fuses</tspan></text><path class="ln" d="M890.0,190.0 H835.0 V216.0 H876.0"/><line class="ln" x1="870.0" y1="216.0" x2="876.0" y2="216.0"/><polygon class="ah" points="887.0,216.0 876.0,209.9 876.0,222.1"/><text class="n" x="820.0" y="254.9" text-anchor="end" font-size="15"><tspan x="820.0" dy="0.0">4. Hash firmware, verify</tspan><tspan x="820.0" dy="18.8">signature</tspan></text><path class="ln" d="M890.0,246.0 H835.0 V272.0 H876.0"/><line class="ln" x1="870.0" y1="272.0" x2="876.0" y2="272.0"/><polygon class="ah" points="887.0,272.0 876.0,265.9 876.0,278.1"/><text class="n ml" x="695.0" y="289.8" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">5. Accept and run, or reject</tspan></text><line class="ln lnd" x1="890.0" y1="302.0" x2="511.0" y2="302.0"/><polygon class="ah" points="500.0,302.0 511.0,308.1 511.0,295.9"/></svg>