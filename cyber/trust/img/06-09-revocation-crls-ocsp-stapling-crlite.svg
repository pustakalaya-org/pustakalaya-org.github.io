<svg class="dg" viewBox="0 0 1000 221" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The trend is from online lookups toward pushed lists and certificates too short-lived to need revoking.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1988 · X.509 CRLs</tspan></text><text class="n" x="70.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">signed lists of revoked</tspan><tspan x="70.0" dy="16.2">serials</tspan></text><circle class="dot" cx="177.5" cy="107.2" r="9"/><line class="ln" x1="177.5" y1="116.2" x2="177.5" y2="127.2"/><text class="t" x="177.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="177.5" dy="0.0">1999 · OCSP</tspan></text><text class="n" x="177.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="177.5" dy="0.0">RFC 2560 per-certificate</tspan><tspan x="177.5" dy="16.2">queries</tspan></text><circle class="dot" cx="285.0" cy="107.2" r="9"/><line class="ln" x1="285.0" y1="98.2" x2="285.0" y2="89.2"/><text class="t" x="285.0" y="63.7" text-anchor="middle" font-size="17"><tspan x="285.0" dy="0.0">2003 · Stapling</tspan></text><text class="n" x="285.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="285.0" dy="0.0">TLS status_request extension</tspan></text><circle class="dot" cx="392.5" cy="107.2" r="9"/><line class="ln" x1="392.5" y1="116.2" x2="392.5" y2="127.2"/><text class="t" x="392.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="392.5" dy="0.0">2012 · CRLSets</tspan></text><text class="n" x="392.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="392.5" dy="0.0">Chrome stops online checks</tspan></text><circle class="dot" cx="500.0" cy="107.2" r="9"/><line class="ln" x1="500.0" y1="98.2" x2="500.0" y2="89.2"/><text class="t" x="500.0" y="63.7" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">2015 · Must-Staple</tspan></text><text class="n" x="500.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">RFC 7633 TLS Feature</tspan></text><circle class="dot" cx="607.5" cy="107.2" r="9"/><line class="ln" x1="607.5" y1="116.2" x2="607.5" y2="127.2"/><text class="t" x="607.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="607.5" dy="0.0">2024 · SC-063</tspan></text><text class="n" x="607.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="607.5" dy="0.0">OCSP optional, CRLs</tspan><tspan x="607.5" dy="16.2">mandatory</tspan></text><circle class="dot" cx="715.0" cy="107.2" r="9"/><line class="ln" x1="715.0" y1="98.2" x2="715.0" y2="89.2"/><text class="t" x="715.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="715.0" dy="0.0">2025 · CRLite</tspan></text><text class="n" x="715.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="715.0" dy="0.0">Firefox 137; OCSP off for DV</tspan><tspan x="715.0" dy="16.2">in 142</tspan></text><circle class="dot" cx="822.5" cy="107.2" r="9"/><line class="ln" x1="822.5" y1="116.2" x2="822.5" y2="127.2"/><text class="t" x="822.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="822.5" dy="0.0">Aug 2025 · LE OCSP</tspan><tspan x="822.5" dy="21.2">off</tspan></text><text class="n" x="822.5" y="190.5" text-anchor="middle" font-size="13"><tspan x="822.5" dy="0.0">Let&#x27;s Encrypt responders</tspan><tspan x="822.5" dy="16.2">shut down</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="98.2" x2="930.0" y2="89.2"/><text class="t" x="930.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">Jan 2026 · 6-day</tspan><tspan x="930.0" dy="21.2">certs</tspan></text><text class="n" x="930.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">Let&#x27;s Encrypt short-lived GA</tspan></text></svg>