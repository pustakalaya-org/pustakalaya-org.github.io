<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>In the background-check model the relying party forwards evidence to the verifier; in the passport model the attester presents the result itself.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="477.1" y1="99.8" x2="311.2" y2="373.0"/><polygon class="ah" points="305.5,382.4 316.3,376.1 306.0,369.9"/><line class="ln" x1="762.2" y1="233.7" x2="382.4" y2="381.3"/><polygon class="ah" points="372.2,385.3 384.6,387.0 380.2,375.7"/><line class="ln" x1="627.5" y1="420.2" x2="383.5" y2="420.2"/><polygon class="ah" points="372.5,420.2 383.5,426.2 383.5,414.1"/><line class="ln" x1="259.6" y1="382.4" x2="176.8" y2="246.0"/><polygon class="ah" points="171.0,236.6 171.6,249.1 181.9,242.9"/><line class="ln" x1="627.8" y1="385.3" x2="248.0" y2="237.7"/><polygon class="ah" points="237.8,233.7 245.8,243.3 250.2,232.0"/><rect class="lbg" x="313.3" y="228.1" width="156" height="23.0" rx="6"/><text class="n" x="391.3" y="243.1" text-anchor="middle" font-size="13"><tspan x="391.3" dy="0.0">Endorsements</tspan></text><rect class="lbg" x="489.2" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="567.2" y="311.5" text-anchor="middle" font-size="13"><tspan x="567.2" dy="0.0">Reference values</tspan></text><rect class="lbg" x="422.0" y="407.2" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="422.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Evidence</tspan></text><rect class="lbg" x="137.3" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="215.3" y="311.5" text-anchor="middle" font-size="13"><tspan x="215.3" dy="0.0">Attestation result</tspan></text><rect class="lbg" x="354.8" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="432.8" y="311.5" text-anchor="middle" font-size="13"><tspan x="432.8" dy="0.0">Passport: result</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Endorser</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">chip maker</tspan></text><rect class="bx" x="766.9" y="155.3" width="170.0" height="87.0" rx="12"/><text class="t" x="851.9" y="183.9" text-anchor="middle" font-size="16"><tspan x="851.9" dy="0.0">Reference Value</tspan><tspan x="851.9" dy="20.0">Provider</tspan></text><text class="n" x="851.9" y="227.3" text-anchor="middle" font-size=