<svg class="dg" viewBox="0 0 1000 378" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each step forced more automation; the last bar is Let&#x27;s Encrypt&#x27;s optional short-lived profile.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2015 (39 months)</tspan></text><rect class="bfill" x="280" y="14.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="33.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~1,185 d</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2018</tspan></text><rect class="bfill" x="280" y="64.0" width="497.3" height="28" rx="6"/><text class="n" x="787.3" y="83.0" text-anchor="start" font-size="15"><tspan x="787.3" dy="0.0">825 d</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Sep 2020</tspan></text><rect class="bfill" x="280" y="114.0" width="431.5" height="28" rx="6"/><text class="n" x="721.5" y="133.0" text-anchor="start" font-size="15"><tspan x="721.5" dy="0.0">398 d</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2026</tspan></text><rect class="bfill" x="280" y="164.0" width="369.4" height="28" rx="6"/><text class="n" x="659.4" y="183.0" text-anchor="start" font-size="15"><tspan x="659.4" dy="0.0">200 d</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2027</tspan></text><rect class="bfill" x="280" y="214.0" width="306.8" height="28" rx="6"/><text class="n" x="596.8" y="233.0" text-anchor="start" font-size="15"><tspan x="596.8" dy="0.0">100 d</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2029</tspan></text><rect class="bfill" x="280" y="264.0" width="238.6" height="28" rx="6"/><text class="n" x="528.6" y="283.0" text-anchor="start" font-size="15"><tspan x="528.6" dy="0.0">47 d</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">LE shortlived</tspan></text><rect class="bfill" x="280" y="314.0" width="62.4" height="28" rx="6"/><text class="n" x="352.4" y="333.0" text-anchor="start" font-size="15"><tspan x="352.4" dy="0.0">160 h</tspan></text><text class="n" x="996.0" y="368.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>