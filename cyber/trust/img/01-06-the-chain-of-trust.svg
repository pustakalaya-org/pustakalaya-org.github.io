<svg class="dg" viewBox="0 0 1000 464" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Code chains and certificate chains look different but follow the same rule: each link checks the next.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Roots</tspan></text><text class="lab" x="4.0" y="173.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Middle links</tspan></text><text class="lab" x="4.0" y="299.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Next links</tspan></text><text class="lab" x="4.0" y="430.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">End result</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="354.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="459.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Boot ROM + fused</tspan><tspan x="459.0" dy="20.0">key hash</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Root CA in trust</tspan><tspan x="685.0" dy="20.0">store</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">UEFI firmware</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Intermediate CA</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Bootloader</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Server certificate</tspan></text></g><g transform="translate(0,425.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Running OS kernel</tspan></text></g><g transform="translate(0,425.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Trusted HTTPS</tspan><tspan x="685.0" dy="20.0">session</tspan></text></g></svg>