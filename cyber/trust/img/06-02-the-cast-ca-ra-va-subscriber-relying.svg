<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The relying party never contacts the RA; it trusts the CA&#x27;s signature and checks status with the VA.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="85.2" x2="688.8" y2="110.7"/><polygon class="ah" points="699.4,113.4 690.3,104.8 687.3,116.5"/><line class="ln" x1="805.5" y1="174.6" x2="836.6" y2="247.4"/><polygon class="ah" points="840.9,257.5 842.1,245.0 831.0,249.8"/><line class="ln" x1="794.1" y1="259.3" x2="575.8" y2="112.9"/><polygon class="ah" points="566.7,106.7 572.4,117.9 579.2,107.8"/><line class="ln" x1="794.1" y1="348.8" x2="723.7" y2="396.0"/><polygon class="ah" points="714.6,402.1 727.1,401.0 720.4,391.0"/><line class="ln" x1="770.9" y1="327.2" x2="440.0" y2="412.5"/><polygon class="ah" points="429.3,415.2 441.5,418.4 438.4,406.6"/><line class="ln" x1="433.3" y1="106.7" x2="202.5" y2="261.6"/><polygon class="ah" points="193.4,267.8 205.9,266.7 199.1,256.6"/><line class="ln" x1="229.1" y1="327.2" x2="560.0" y2="412.5"/><polygon class="ah" points="570.7,415.2 561.6,406.6 558.5,418.4"/><line class="ln" x1="155.5" y1="266.0" x2="190.2" y2="184.8"/><polygon class="ah" points="194.5,174.6 184.6,182.4 195.7,187.1"/><rect class="lbg" x="566.6" y="86.3" width="156" height="23.0" rx="6"/><text class="n" x="644.6" y="101.3" text-anchor="middle" font-size="13"><tspan x="644.6" dy="0.0">CSR + evidence</tspan></text><rect class="lbg" x="747.0" y="207.3" width="156" height="23.0" rx="6"/><text class="n" x="825.0" y="222.3" text-anchor="middle" font-size="13"><tspan x="825.0" dy="0.0">approved request</tspan></text><rect class="lbg" x="602.4" y="170.0" width="156" height="23.0" rx="6"/><text class="n" x="680.4" y="185.0" text-anchor="middle" font-size="13"><tspan x="680.4" dy="0.0">certificate</tspan></text><rect class="lbg" x="682.6" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="760.6" y="373.2" text-anchor="middle" font-size="13"><tspan x="760.6" dy="0.0">publishes status</tspan></text><rect class="lbg" x="522.1" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="600.1" y="373.2" text-anchor="middle" font-size="13"><tspan x="600.1" dy="0.0">precertificate</tspan></text><rect class="lbg" x="241.6" y="170.0" width="156" height="23.0" rx="6"/><text class="n" x="319.6" y="185.0" text-anchor="middle" font-size="13"><tspan x="319.6" dy="0.0">presents chain</tspan></text><rect class="lbg" x="321.9" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="399.9" y="373.2" text-anchor="middle" font-size="13"><tspan x="399.9" dy="0.0">status check</tspan></text><rect class="lbg" x="97.0" y="207.3" width="156" height="23.0" rx="6"/><text class="n" x="175.0" y="222.3" text-anchor="middle" font-size="13"><tspan x="175.0" dy="0.0">chain ends here</tspan></text><rect class="bx" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Subscriber</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">applicant until</tspan><tspan x="500.0" dy="16.9">issued</tspan></text><rect class="bx" x="704.3" y="103.0" width="170.0" height="67.0" rx="12"/><text class="t" x="789.3" y="131.6" text-anchor="middle" font-size="16"><tspan x="789.3" dy="0.0">RA</tspan></text><text class="n" x="789.3" y="155.0" text-anchor="middle" font-size="13"><tspan x="789.3" dy="0.0">verifies requests</tspan></text><rect class="bxa" x="775.7" y="262.1" width="170.0" height="83.9" rx="12"/><text class="t" x="860.7" y="290.7" text-anchor="middle" font-size="16"><tspan x="860.7" dy="0.0">CA</tspan></text><text class="n" x="860.7" y="314.1" text-anchor="middle" font-size="13"><tspan x="860.7" dy="0.0">signs certificates &amp;</tspan><tspan x="860.7" dy="16.9">CRLs</tspan></text><rect class="bx" x="575.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="660.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="660.5" dy="0.0">Repository / VA</tspan></text><text class="n" x="660.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="660.5" dy="0.0">CRLs, OCSP, CPS</tspan></text><rect class="bx" x="254.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="339.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="339.5" dy="0.0">CT logs</tspan></text><text class="n" x="339.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="339.5" dy="0.0">public TLS only</tspan></text><rect class="bx" x="54.3" y="270.6" width="170.0" height="67.0" rx="12"/><text class="t" x="139.3" y="299.2" text-anchor="middle" font-size="16"><tspan x="139.3" dy="0.0">Relying party</tspan></text><text class="n" x="139.3" y="322.6" text-anchor="middle" font-size="13"><tspan x="139.3" dy="0.0">browser, app, gateway</tspan></text><rect class="bx" x="125.7" y="103.0" width="170.0" height="67.0" rx="12"/><text class="t" x="210.7" y="131.6" text-anchor="middle" font-size="16"><tspan x="210.7" dy="0.0">Trust anchor</tspan></text><text class="n" x="210.7" y="155.0" text-anchor="middle" font-size="13"><tspan x="210.7" dy="0.0">root in trust store</tspan></text></svg>