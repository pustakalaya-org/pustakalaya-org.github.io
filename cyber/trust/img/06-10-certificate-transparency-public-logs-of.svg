<svg class="dg" viewBox="0 0 1000 519" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The SCT is a promise to log; monitors close the loop by watching what was actually logged.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="512.5"/><line class="ln lnd life" x1="305.0" y1="76.5" x2="305.0" y2="512.5"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="512.5"/><line class="ln lnd life" x1="695.0" y1="76.5" x2="695.0" y2="512.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="512.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">CA</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">CT log</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="410.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="500.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Site owner /</tspan><tspan x="500.0" dy="22.5">server</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Browser</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Monitor</tspan></text></g><text class="n ml" x="207.5" y="91.5" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. submit</tspan><tspan x="207.5" dy="18.8">precertificate</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="294.0" y2="122.5"/><polygon class="ah" points="305.0,122.5 294.0,116.5 294.0,128.6"/><text class="n ml" x="207.5" y="155.2" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">2. SCT (signed</tspan><tspan x="207.5" dy="18.8">timestamp)</tspan></text><line class="ln lnd" x1="305.0" y1="186.2" x2="121.0" y2="186.2"/><polygon class="ah" points="110.0,186.2 121.0,192.3 121.0,180.2"/><text class="n ml" x="305.0" y="237.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. final cert with embedded SCTs</tspan></text><line class="ln" x1="110.0" y1="250.0" x2="489.0" y2="250.0"/><polygon class="ah" points="500.0,250.0 489.0,243.9 489.0,256.1"/><text class="n ml" x="597.5" y="264.0" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">4. TLS Certificate</tspan><tspan x="597.5" dy="18.8">message</tspan></text><line class="ln" x1="500.0" y1="295.0" x2="684.0" y2="295.0"/><polygon class="ah" points="695.0,295.0 684.0,288.9 684.0,301.1"/><text class="n ml" x="597.5" y="327.8" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">5. accept: enough</tspan><tspan x="597.5" dy="18.8">valid SCTs</tspan></text><line class="ln lnd" x1="695.0" y1="358.8" x2="511.0" y2="358.8"/><polygon class="ah" points="500.0,358.8 511.0,364.8 511.0,352.7"/><text class="n ml" x="597.5" y="410.2" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">6. fetch tiles / entries</tspan></text><line class="ln" x1="890.0" y1="422.5" x2="316.0" y2="422.5"/><polygon class="ah" points="305.0,422.5 316.0,428.6 316.0,416.4"/><text class="n ml" x="695.0" y="455.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">7. alert owner: unexpected cert</tspan></text><line class="ln lnd" x1="890.0" y1="467.5" x2="511.0" y2="467.5"/><polygon class="ah" points="500.0,467.5 511.0,473.6 511.0,461.4"/></svg>