<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Requests cross between worlds only through the EL3 monitor via SMC; secure memory is invisible to the normal world.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="41.5" r="15"/><text class="bn" x="34.0" y="47.0" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="36.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Normal-world apps</tspan><tspan x="64.0" dy="25.0">(EL0)</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="67.0"/><text class="n" x="350.0" y="47.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">Android apps, Linux processes</tspan></text><rect x="2" y="87.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.13;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="118.0" r="15"/><text class="bn" x="34.0" y="123.5" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="125.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Rich OS kernel (EL1)</tspan></text><line class="sep" x1="330.0" y1="99.0" x2="330.0" y2="137.0"/><text class="n" x="350.0" y="123.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">Linux/Android with TEE driver</tspan></text><rect x="2" y="157.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.19;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="188.0" r="15"/><text class="bn" x="34.0" y="193.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="195.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Hypervisor (EL2)</tspan></text><line class="sep" x1="330.0" y1="169.0" x2="330.0" y2="207.0"/><text class="n" x="350.0" y="193.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">KVM or Android pKVM</tspan></text><rect x="2" y="227.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="258.0" r="15"/><text class="bn" x="34.0" y="263.5" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="265.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Trusted apps (S-EL0)</tspan></text><line class="sep" x1="330.0" y1="239.0" x2="330.0" y2="277.0"/><text class="n" x="350.0" y="263.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">KeyMint, biometrics, DRM TAs</tspan></text><rect x="2" y="297.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.29;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="328.0" r="15"/><text class="bn" x="34.0" y="333.5" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="335.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">TEE OS (S-EL1)</tspan></text><line class="sep" x1="330.0" y1="309.0" x2="330.0" y2="347.0"/><text class="n" x="350.0" y="333.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">OP-TEE, Trusty, QTEE, Kinibi</tspan></text><rect x="2" y="367.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.35;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="404.5" r="15"/><text class="bn" x="34.0" y="410.0" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="399.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Secure partition</tspan><tspan x="64.0" dy="25.0">manager (S-EL2)</tspan></text><line class="sep" x1="330.0" y1="379.0" x2="330.0" y2="430.0"/><text class="n" x="350.0" y="410.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">optional, e.g. Hafnium</tspan></text><rect x="2" y="450.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="481.0" r="15"/><text class="bn" x="34.0" y="486.5" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="488.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Secure monitor (EL3)</tspan></text><line class="sep" x1="330.0" y1="462.0" x2="330.0" y2="500.0"/><text class="n" x="350.0" y="486.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">TF-A BL31 switches worlds</tspan></text></svg>