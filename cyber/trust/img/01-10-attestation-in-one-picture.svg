<svg class="dg" viewBox="0 0 1000 443" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The nonce makes the evidence fresh; the hardware key makes it believable.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="437.0"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="437.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="437.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Relying party</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Attester (device)</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Verifier</tspan></text></g><text class="n ml" x="305.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. Challenge: nonce N</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="489.0" y2="100.0"/><polygon class="ah" points="500.0,100.0 489.0,94.0 489.0,106.0"/><text class="n" x="570.0" y="153.9" text-anchor="start" font-size="15"><tspan x="570.0" dy="0.0">2. Collect measurements,</tspan><tspan x="570.0" dy="18.8">sign with HW key</tspan></text><path class="ln" d="M500.0,145.0 H555.0 V171.0 H514.0"/><line class="ln" x1="520.0" y1="171.0" x2="514.0" y2="171.0"/><polygon class="ah" points="503.0,171.0 514.0,177.1 514.0,164.9"/><text class="n ml" x="305.0" y="188.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. Evidence (claims + N + signature)</tspan></text><line class="ln" x1="500.0" y1="201.0" x2="121.0" y2="201.0"/><polygon class="ah" points="110.0,201.0 121.0,207.1 121.0,194.9"/><text class="n ml" x="500.0" y="233.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. Forward evidence</tspan></text><line class="ln" x1="110.0" y1="246.0" x2="879.0" y2="246.0"/><polygon class="ah" points="890.0,246.0 879.0,239.9 879.0,252.1"/><text class="n" x="820.0" y="299.9" text-anchor="end" font-size="15"><tspan x="820.0" dy="0.0">5. Check endorsements +</tspan><tspan x="820.0" dy="18.8">reference values</tspan></text><path class="ln" d="M890.0,291.0 H835.0 V317.0 H876.0"/><line class="ln" x1="870.0" y1="317.0" x2="876.0" y2="317.0"/><polygon class="ah" points="887.0,317.0 876.0,310.9 876.0,323.1"/><text class="n ml" x="500.0" y="334.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Attestation result: pass / fail</tspan></text><line class="ln lnd" x1="890.0" y1="347.0" x2="121.0" y2="347.0"/><polygon class="ah" points="110.0,347.0 121.0,353.1 121.0,340.9"/><text class="n ml" x="305.0" y="379.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">7. Grant access or release secret</tspan></text><line class="ln" x1="110.0" y1="392.0" x2="489.0" y2="392.0"/><polygon class="ah" points="500.0,392.0 489.0,385.9 489.0,398.1"/></svg>