<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>High-value events go to the SIEM; everything else lands in cheap storage.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="511.8" y1="89.6" x2="640.0" y2="390.2"/><polygon class="ah" points="644.3,400.3 645.5,387.8 634.4,392.5"/><line class="ln" x1="777.5" y1="164.1" x2="681.1" y2="390.2"/><polygon class="ah" points="676.8,400.3 686.7,392.5 675.5,387.8"/><line class="ln" x1="822.3" y1="329.8" x2="723.7" y2="396.0"/><polygon class="ah" points="714.6,402.1 727.1,401.0 720.4,391.0"/><line class="ln" x1="570.5" y1="438.4" x2="440.5" y2="438.4"/><polygon class="ah" points="429.5,438.4 440.5,444.4 440.5,432.3"/><line class="ln" x1="570.7" y1="415.2" x2="239.8" y2="330.0"/><polygon class="ah" points="229.1,327.2 238.3,335.8 241.3,324.1"/><line class="ln" x1="606.5" y1="402.1" x2="273.9" y2="179.0"/><polygon class="ah" points="264.8,172.8 270.6,184.0 277.3,173.9"/><rect class="lbg" x="502.3" y="237.2" width="156" height="23.0" rx="6"/><text class="n" x="580.3" y="252.2" text-anchor="middle" font-size="13"><tspan x="580.3" dy="0.0">agents</tspan></text><rect class="lbg" x="646.9" y="274.5" width="156" height="23.0" rx="6"/><text class="n" x="724.9" y="289.5" text-anchor="middle" font-size="13"><tspan x="724.9" dy="0.0">syslog</tspan></text><rect class="lbg" x="682.6" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="760.6" y="373.2" text-anchor="middle" font-size="13"><tspan x="760.6" dy="0.0">APIs</tspan></text><rect class="lbg" x="422.0" y="425.4" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="440.4" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">security events</tspan></text><rect class="lbg" x="321.9" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="399.9" y="373.2" text-anchor="middle" font-size="13"><tspan x="399.9" dy="0.0">full raw copy</tspan></text><rect class="lbg" x="357.6" y="274.5" width="156" height="23.0" rx="6"/><text class="n" x="435.6" y="289.5" text-anchor="middle" font-size="13"><tspan x="435.6" dy="0.0">metrics, errors</tspan></text><rect class="bx" x="415.0" y="39.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="67.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Servers &amp; PCs</tspan></text><rect class="bx" x="704.3" y="113.5" width="170.0" height="46.0" rx="12"/><text class="t" x="789.3" y="142.1" text-anchor="middle" font-size="16"><tspan x="789.3" dy="0.0">Firewalls</tspan></text><rect class="bx" x="775.7" y="281.1" width="170.0" height="46.0" rx="12"/><text class="t" x="860.7" y="309.7" text-anchor="middle" font-size="16"><tspan x="860.7" dy="0.0">Cloud &amp; SaaS</tspan></text><rect class="bxa" x="575.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="660.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="660.5" dy="0.0">Pipeline</tspan></text><text class="n" x="660.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="660.5" dy="0.0">Filter, mask, enrich</tspan></text><rect class="bx" x="254.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="339.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="339.5" dy="0.0">SIEM</tspan></text><text class="n" x="339.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="339.5" dy="0.0">Detection, hot search</tspan></text><rect class="bx" x="54.3" y="270.6" width="170.0" height="67.0" rx="12"/><text class="t" x="139.3" y="299.2" text-anchor="middle" font-size="16"><tspan x="139.3" dy="0.0">Object storage</tspan></text><text class="n" x="139.3" y="322.6" text-anchor="middle" font-size="13"><tspan x="139.3" dy="0.0">Cheap, long retention</tspan></text><rect class="bx" x="125.7" y="103.0" width="170.0" height="67.0" rx="12"/><text class="t" x="210.7" y="131.6" text-anchor="middle" font-size="16"><tspan x="210.7" dy="0.0">Observability</tspan></text><text class="n" x="210.7" y="155.0" text-anchor="middle" font-size="13"><tspan x="210.7" dy="0.0">Ops dashboards</tspan></text></svg>