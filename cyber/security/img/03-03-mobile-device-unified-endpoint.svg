<svg class="dg" viewBox="0 0 1000 463" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Access to email is granted only after the device proves it is compliant.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="456.2"/><line class="ln lnd life" x1="370.0" y1="76.5" x2="370.0" y2="456.2"/><line class="ln lnd life" x1="630.0" y1="76.5" x2="630.0" y2="456.2"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="456.2"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">iPad</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="265.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="370.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Apple Business</tspan><tspan x="370.0" dy="22.5">Manager</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Intune (MDM)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Entra ID</tspan></text></g><text class="n ml" x="240.0" y="91.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. First power-on: am I</tspan><tspan x="240.0" dy="18.8">assigned?</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="359.0" y2="122.5"/><polygon class="ah" points="370.0,122.5 359.0,116.5 359.0,128.6"/><text class="n ml" x="240.0" y="174.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">2. Yes: enrol with Intune</tspan></text><line class="ln lnd" x1="370.0" y1="186.2" x2="121.0" y2="186.2"/><polygon class="ah" points="110.0,186.2 121.0,192.3 121.0,180.2"/><text class="n ml" x="370.0" y="219.0" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">3. MDM enrolment + device certificate</tspan></text><line class="ln" x1="110.0" y1="231.2" x2="619.0" y2="231.2"/><polygon class="ah" points="630.0,231.2 619.0,225.2 619.0,237.3"/><text class="n ml" x="370.0" y="264.0" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">4. Passcode policy, apps, Wi-Fi, VPN</tspan></text><line class="ln" x1="630.0" y1="276.2" x2="121.0" y2="276.2"/><polygon class="ah" points="110.0,276.2 121.0,282.3 121.0,270.2"/><text class="n ml" x="370.0" y="309.0" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">5. Compliance report (OS, passcode)</tspan></text><line class="ln" x1="110.0" y1="321.2" x2="619.0" y2="321.2"/><polygon class="ah" points="630.0,321.2 619.0,315.2 619.0,327.3"/><text class="n ml" x="760.0" y="354.0" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">6. Device compliant = true</tspan></text><line class="ln" x1="630.0" y1="366.2" x2="879.0" y2="366.2"/><polygon class="ah" points="890.0,366.2 879.0,360.2 879.0,372.3"/><text class="n ml" x="500.0" y="399.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. Conditional Access: Outlook allowed</tspan></text><line class="ln lnd" x1="890.0" y1="411.2" x2="121.0" y2="411.2"/><polygon class="ah" points="110.0,411.2 121.0,417.3 121.0,405.2"/></svg>