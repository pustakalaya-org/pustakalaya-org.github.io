<svg class="dg" viewBox="0 0 1000 523" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>No long-lived signing key exists: identity comes from the build&#x27;s OIDC token, and the public log makes signatures auditable.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="516.2"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="516.2"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="516.2"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="516.2"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="516.2"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">CI pipeline</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">Fulcio CA</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Rekor log</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Registry</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Cluster</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. OIDC token</tspan><tspan x="207.5" dy="18.8">(workflow identity)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="207.5" y="132.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">2. 10-minute signing</tspan><tspan x="207.5" dy="18.8">certificate</tspan></text><line class="ln lnd" x1="305.0" y1="163.8" x2="121.0" y2="163.8"/><polygon class="ah" points="110.0,163.8 121.0,169.8 121.0,157.7"/><text class="n ml" x="305.0" y="215.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. Record signature entry</tspan></text><line class="ln" x1="110.0" y1="227.5" x2="489.0" y2="227.5"/><polygon class="ah" points="500.0,227.5 489.0,221.4 489.0,233.6"/><text class="n ml" x="305.0" y="260.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. Inclusion proof</tspan></text><line class="ln lnd" x1="500.0" y1="272.5" x2="121.0" y2="272.5"/><polygon class="ah" points="110.0,272.5 121.0,278.6 121.0,266.4"/><text class="n ml" x="402.5" y="305.2" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">5. Push image, signature, SBOM</tspan></text><line class="ln" x1="110.0" y1="317.5" x2="684.0" y2="317.5"/><polygon class="ah" points="695.0,317.5 684.0,311.4 684.0,323.6"/><text class="n ml" x="792.5" y="331.5" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">6. Pull image and</tspan><tspan x="792.5" dy="18.8">signature</tspan></text><line class="ln" x1="890.0" y1="362.5" x2="706.0" y2="362.5"/><polygon class="ah" points="695.0,362.5 706.0,368.6 706.0,356.4"/><text class="n ml" x="695.0" y="414.0" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">7. Check log entry and identity</tspan></text><line class="ln" x1="890.0" y1="426.2" x2="511.0" y2="426.2"/><polygon class="ah" points="500.0,426.2 511.0,432.3 511.0,420.2"/><text class="n ml" x="695.0" y="459.0" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">8. Verified: built by release.yml</tspan></text><line class="ln lnd" x1="500.0" y1="471.2" x2="879.0" y2="471.2"/><polygon class="ah" points="890.0,471.2 879.0,465.2 879.0,477.3"/></svg>