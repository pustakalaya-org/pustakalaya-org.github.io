<svg class="dg" viewBox="0 0 1000 418" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The password never crosses the network; time-limited tickets (10 hours by default in AD) prove identity instead.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="411.2"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="411.2"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="411.2"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Windows PC</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="395.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="500.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Domain controller</tspan><tspan x="500.0" dy="22.5">(KDC)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">File server</tspan></text></g><text class="n ml" x="305.0" y="91.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. AS-REQ: logon, timestamp encrypted with</tspan><tspan x="305.0" dy="18.8">password key</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="489.0" y2="122.5"/><polygon class="ah" points="500.0,122.5 489.0,116.5 489.0,128.6"/><text class="n ml" x="305.0" y="174.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">2. AS-REP: ticket-granting ticket (TGT)</tspan></text><line class="ln lnd" x1="500.0" y1="186.2" x2="121.0" y2="186.2"/><polygon class="ah" points="110.0,186.2 121.0,192.3 121.0,180.2"/><text class="n ml" x="305.0" y="219.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. TGS-REQ: TGT + &#x27;cifs/fileserver&#x27;</tspan></text><line class="ln" x1="110.0" y1="231.2" x2="489.0" y2="231.2"/><polygon class="ah" points="500.0,231.2 489.0,225.2 489.0,237.3"/><text class="n ml" x="305.0" y="264.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. TGS-REP: service ticket</tspan></text><line class="ln lnd" x1="500.0" y1="276.2" x2="121.0" y2="276.2"/><polygon class="ah" points="110.0,276.2 121.0,282.3 121.0,270.2"/><text class="n ml" x="500.0" y="309.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. AP-REQ: present service ticket</tspan></text><line class="ln" x1="110.0" y1="321.2" x2="879.0" y2="321.2"/><polygon class="ah" points="890.0,321.2 879.0,315.2 879.0,327.3"/><text class="n ml" x="500.0" y="354.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Access by group SIDs in ticket</tspan></text><line class="ln lnd" x1="890.0" y1="366.2" x2="121.0" y2="366.2"/><polygon class="ah" points="110.0,366.2 121.0,372.3 121.0,360.2"/></svg>