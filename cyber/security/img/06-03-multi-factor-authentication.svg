<svg class="dg" viewBox="0 0 1000 418" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The signature covers the website&#x27;s real domain, so a look-alike phishing site receives nothing it can reuse.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="411.2"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="411.2"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="411.2"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="110.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Authenticator</tspan><tspan x="110.0" dy="22.5">(phone or key)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Browser</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Website</tspan></text></g><text class="n ml" x="695.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">1. Start sign-in</tspan></text><line class="ln" x1="500.0" y1="122.5" x2="879.0" y2="122.5"/><polygon class="ah" points="890.0,122.5 879.0,116.5 879.0,128.6"/><text class="n ml" x="695.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">2. Random challenge + site ID (rpId)</tspan></text><line class="ln lnd" x1="890.0" y1="167.5" x2="511.0" y2="167.5"/><polygon class="ah" points="500.0,167.5 511.0,173.6 511.0,161.4"/><text class="n ml" x="305.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. Request signature for this origin</tspan></text><line class="ln" x1="500.0" y1="212.5" x2="121.0" y2="212.5"/><polygon class="ah" points="110.0,212.5 121.0,218.6 121.0,206.4"/><text class="n ml" x="305.0" y="226.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. User unlocks (face/PIN); key signs</tspan><tspan x="305.0" dy="18.8">challenge</tspan></text><line class="ln lnd" x1="110.0" y1="257.5" x2="489.0" y2="257.5"/><polygon class="ah" points="500.0,257.5 489.0,251.4 489.0,263.6"/><text class="n ml" x="695.0" y="309.0" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">5. Assertion: signature + origin data</tspan></text><line class="ln" x1="500.0" y1="321.2" x2="879.0" y2="321.2"/><polygon class="ah" points="890.0,321.2 879.0,315.2 879.0,327.3"/><text class="n ml" x="695.0" y="354.0" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">6. Verified with stored public key: signed in</tspan></text><line class="ln lnd" x1="890.0" y1="366.2" x2="511.0" y2="366.2"/><polygon class="ah" points="500.0,366.2 511.0,372.3 511.0,360.2"/></svg>