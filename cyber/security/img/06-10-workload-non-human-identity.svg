<svg class="dg" viewBox="0 0 1000 436" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>No cloud key is stored in the repository; the pipeline proves where it runs and receives credentials that expire within an hour.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="430.0"/><line class="ln lnd life" x1="370.0" y1="76.5" x2="370.0" y2="430.0"/><line class="ln lnd life" x1="630.0" y1="76.5" x2="630.0" y2="430.0"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="430.0"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="110.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">GitHub Actions</tspan><tspan x="110.0" dy="22.5">job</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="265.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="370.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">GitHub OIDC</tspan><tspan x="370.0" dy="22.5">issuer</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">AWS STS</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">S3 bucket</tspan></text></g><text class="n ml" x="240.0" y="91.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Request ID token (aud:</tspan><tspan x="240.0" dy="18.8">sts.amazonaws.com)</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="359.0" y2="122.5"/><polygon class="ah" points="370.0,122.5 359.0,116.5 359.0,128.6"/><text class="n ml" x="240.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">2. Signed JWT: repo, branch,</tspan><tspan x="240.0" dy="18.8">workflow</tspan></text><line class="ln lnd" x1="370.0" y1="186.2" x2="121.0" y2="186.2"/><polygon class="ah" points="110.0,186.2 121.0,192.3 121.0,180.2"/><text class="n ml" x="370.0" y="237.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">3. AssumeRoleWithWebIdentity + JWT</tspan></text><line class="ln" x1="110.0" y1="250.0" x2="619.0" y2="250.0"/><polygon class="ah" points="630.0,250.0 619.0,243.9 619.0,256.1"/><text class="n ml" x="370.0" y="282.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">4. Trust policy checked: 1-hour credentials</tspan></text><line class="ln lnd" x1="630.0" y1="295.0" x2="121.0" y2="295.0"/><polygon class="ah" points="110.0,295.0 121.0,301.1 121.0,288.9"/><text class="n ml" x="500.0" y="327.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Upload build with temporary keys</tspan></text><line class="ln" x1="110.0" y1="340.0" x2="879.0" y2="340.0"/><polygon class="ah" points="890.0,340.0 879.0,333.9 879.0,346.1"/><text class="n ml" x="500.0" y="372.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. 200 OK; keys expire automatically</tspan></text><line class="ln lnd" x1="890.0" y1="385.0" x2="121.0" y2="385.0"/><polygon class="ah" points="110.0,385.0 121.0,391.1 121.0,378.9"/></svg>