<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Because the hub controls every device, it needs the strongest protection of all.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="208.5" x2="500.0" y2="130.4"/><polygon class="ah" points="500.0,119.5 493.9,130.4 506.1,130.4"/><line class="ln" x1="619.8" y1="217.2" x2="709.3" y2="192.6"/><polygon class="ah" points="719.9,189.7 707.7,186.8 710.9,198.5"/><line class="ln" x1="619.8" y1="282.8" x2="709.3" y2="307.4"/><polygon class="ah" points="719.9,310.3 710.9,301.5 707.7,313.2"/><line class="ln" x1="500.0" y1="291.5" x2="500.0" y2="378.0"/><polygon class="ah" points="500.0,389.0 506.1,378.0 493.9,378.0"/><line class="ln" x1="380.2" y1="282.8" x2="290.7" y2="307.4"/><polygon class="ah" points="280.1,310.3 292.3,313.2 289.1,301.5"/><line class="ln" x1="380.2" y1="217.2" x2="290.7" y2="192.6"/><polygon class="ah" points="280.1,189.7 289.1,198.5 292.3,186.8"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Technicians</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">SSO + phishing-resistant</tspan><tspan x="500.0" dy="16.9">MFA</tspan></text><rect class="bx" x="724.8" y="127.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="156.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Client A laptops</tspan></text><text class="n" x="824.8" y="180.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">Patching, monitoring</tspan></text><rect class="bx" x="724.8" y="305.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="334.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Client B servers</tspan></text><text class="n" x="824.8" y="358.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">Scripts, backups checks</tspan></text><rect class="bx" x="400.0" y="394.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="423.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Remote sessions</tspan></text><text class="n" x="500.0" y="447.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Consent and recording</tspan></text><rect class="bx" x="75.2" y="305.0" width="200.0" height="68.0" rx="12"/><text class="t" x="175.2" y="334.5" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Script library</tspan></text><text class="n" x="175.2" y="358.0" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">Mass runs need approval</tspan></text><rect class="bx" x="75.2" y="127.0" width="200.0" height="68.0" rx="12"/><text class="t" x="175.2" y="156.4" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Audit logs</tspan></text><text class="n" x="175.2" y="180.0" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">Forward to SIEM</tspan></text><rect class="bxa" x="385.0" y="213.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="246.3" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">RMM console</tspan></text><text class="n" x="500.0" y="271.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">SYSTEM/root on every agent</tspan></text></svg>