<svg class="dg" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The server stores only public keys and relays ciphertext; it never holds a key that can decrypt the conversation.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="433.8"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="433.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="433.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Alice&#x27;s phone</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Messaging server</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Bob&#x27;s phone</tspan></text></g><text class="n ml" x="695.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">1. Upload identity key + signed &amp; PQ prekeys</tspan></text><line class="ln" x1="890.0" y1="100.0" x2="511.0" y2="100.0"/><polygon class="ah" points="500.0,100.0 511.0,106.0 511.0,94.0"/><text class="n ml" x="305.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">2. Request Bob&#x27;s prekey bundle</tspan></text><line class="ln" x1="110.0" y1="145.0" x2="489.0" y2="145.0"/><polygon class="ah" points="500.0,145.0 489.0,138.9 489.0,151.1"/><text class="n ml" x="305.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. Bob&#x27;s public keys</tspan></text><line class="ln lnd" x1="500.0" y1="190.0" x2="121.0" y2="190.0"/><polygon class="ah" points="110.0,190.0 121.0,196.1 121.0,183.9"/><text class="n ml" x="305.0" y="204.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. First message + ephemeral key + ML-KEM</tspan><tspan x="305.0" dy="18.8">ciphertext</tspan></text><line class="ln" x1="110.0" y1="235.0" x2="489.0" y2="235.0"/><polygon class="ah" points="500.0,235.0 489.0,228.9 489.0,241.1"/><text class="n ml" x="695.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">5. Relay sealed ciphertext</tspan></text><line class="ln" x1="500.0" y1="298.8" x2="879.0" y2="298.8"/><polygon class="ah" points="890.0,298.8 879.0,292.7 879.0,304.8"/><text class="n ml" x="695.0" y="331.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">6. Reply (ratchet: fresh keys)</tspan></text><line class="ln" x1="890.0" y1="343.8" x2="511.0" y2="343.8"/><polygon class="ah" points="500.0,343.8 511.0,349.8 511.0,337.7"/><text class="n ml" x="305.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">7. Relay reply</tspan></text><line class="ln lnd" x1="500.0" y1="388.8" x2="121.0" y2="388.8"/><polygon class="ah" points="110.0,388.8 121.0,394.8 121.0,382.7"/></svg>