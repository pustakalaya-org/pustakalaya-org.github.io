<svg class="dg" viewBox="0 0 1000 484" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every tier is a networked computer, so each needs patching, encryption and strong passwords.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Management</tspan></text><line class="ln" x1="459.0" y1="70.0" x2="459.0" y2="150.0"/><line class="ln" x1="685.0" y1="70.0" x2="685.0" y2="140.0"/><text class="lab" x="4.0" y="169.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Field</tspan><tspan x="4.0" dy="17.5">controllers</tspan></text><line class="ln" x1="459.0" y1="196.0" x2="346.0" y2="286.0"/><line class="ln" x1="459.0" y1="196.0" x2="572.0" y2="276.0"/><line class="ln" x1="685.0" y1="206.0" x2="798.0" y2="286.0"/><text class="lab" x="4.0" y="314.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Edge devices</tspan></text><line class="ln" x1="346.0" y1="332.0" x2="346.0" y2="412.0"/><line class="ln" x1="572.0" y1="342.0" x2="572.0" y2="412.0"/><line class="ln" x1="798.0" y1="332.0" x2="798.0" y2="422.0"/><text class="lab" x="4.0" y="450.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Credentials</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="354.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="459.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Access control</tspan><tspan x="459.0" dy="20.0">server or cloud</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Video management</tspan><tspan x="685.0" dy="20.0">system</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Door controllers</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Network video</tspan><tspan x="685.0" dy="20.0">recorders</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">OSDP readers</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Locks and door</tspan><tspan x="572.0" dy="20.0">sensors</tspan></text></g><g transform="translate(0,309.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">IP cameras</tspan></text></g><g transform="translate(0,445.0)"><rect class="bx" x="241.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="346.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">DESFire / SEOS</tspan><tspan x="346.0" dy="20.0">cards</tspan></text></g><g transform="translate(0,445.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Mobile wallet</tspan><tspan x="572.0" dy="20.0">badges</tspan></text></g><g transform="translate(0,445.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">PIN or biometric</tspan></text></g></svg>