<svg class="dg" viewBox="0 0 1000 221" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Standards change on fixed dates; procurement and audits follow them, so put these dates in the roadmap.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">2019 · FIPS 140-3</tspan></text><text class="n" x="70.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Replaces FIPS 140-2 for new</tspan><tspan x="70.0" dy="16.2">validations</tspan></text><circle class="dot" cx="192.9" cy="107.2" r="9"/><line class="ln" x1="192.9" y1="116.2" x2="192.9" y2="127.2"/><text class="t" x="192.9" y="147.7" text-anchor="middle" font-size="17"><tspan x="192.9" dy="0.0">2023 · FIPS 186-5</tspan></text><text class="n" x="192.9" y="169.2" text-anchor="middle" font-size="13"><tspan x="192.9" dy="0.0">EdDSA approved, DSA retired for</tspan><tspan x="192.9" dy="16.2">signing</tspan></text><circle class="dot" cx="315.7" cy="107.2" r="9"/><line class="ln" x1="315.7" y1="98.2" x2="315.7" y2="89.2"/><text class="t" x="315.7" y="42.5" text-anchor="middle" font-size="17"><tspan x="315.7" dy="0.0">2024 · FIPS</tspan><tspan x="315.7" dy="21.2">203/204/205</tspan></text><text class="n" x="315.7" y="85.2" text-anchor="middle" font-size="13"><tspan x="315.7" dy="0.0">First post-quantum standards</tspan></text><circle class="dot" cx="438.6" cy="107.2" r="9"/><line class="ln" x1="438.6" y1="116.2" x2="438.6" y2="127.2"/><text class="t" x="438.6" y="147.7" text-anchor="middle" font-size="17"><tspan x="438.6" dy="0.0">2025 · PCI DSS v4</tspan></text><text class="n" x="438.6" y="169.2" text-anchor="middle" font-size="13"><tspan x="438.6" dy="0.0">Future-dated requirements become</tspan><tspan x="438.6" dy="16.2">mandatory</tspan></text><circle class="dot" cx="561.4" cy="107.2" r="9"/><line class="ln" x1="561.4" y1="98.2" x2="561.4" y2="89.2"/><text class="t" x="561.4" y="47.5" text-anchor="middle" font-size="17"><tspan x="561.4" dy="0.0">2026 · FIPS 140-2 ends</tspan></text><text class="n" x="561.4" y="69.0" text-anchor="middle" font-size="13"><tspan x="561.4" dy="0.0">Remaining certificates become</tspan><tspan x="561.4" dy="16.2">historical</tspan></text><circle class="dot" cx="684.3" cy="107.2" r="9"/><line class="ln" x1="684.3" y1="116.2" x2="684.3" y2="127.2"/><text class="t" x="684.3" y="147.7" text-anchor="middle" font-size="17"><tspan x="684.3" dy="0.0">2027 · CNSA 2.0</tspan></text><text class="n" x="684.3" y="169.2" text-anchor="middle" font-size="13"><tspan x="684.3" dy="0.0">New national-security buys must</tspan><tspan x="684.3" dy="16.2">comply</tspan></text><circle class="dot" cx="807.1" cy="107.2" r="9"/><line class="ln" x1="807.1" y1="98.2" x2="807.1" y2="89.2"/><text class="t" x="807.1" y="63.7" text-anchor="middle" font-size="17"><tspan x="807.1" dy="0.0">2030 · 112-bit RSA/ECC</tspan></text><text class="n" x="807.1" y="85.2" text-anchor="middle" font-size="13"><tspan x="807.1" dy="0.0">Deprecated in NIST&#x27;s draft plan</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="116.2" x2="930.0" y2="127.2"/><text class="t" x="930.0" y="147.7" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2035 · RSA/ECC</tspan><tspan x="930.0" dy="21.2">disallowed</tspan></text><text class="n" x="930.0" y="190.5" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">Quantum-vulnerable algorithms</tspan><tspan x="930.0" dy="16.2">retired</tspan></text></svg>