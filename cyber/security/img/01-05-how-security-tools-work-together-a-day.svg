<svg class="dg" viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each tool hands context to the next, which is what keeps the whole response under an hour.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect class="bx" x="0.0" y="6.0" width="215.5" height="174.8" rx="14"/><rect class="bar" x="0.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="36.0" r="15"/><text class="bn" x="26.0" y="41.5" text-anchor="middle" font-size="16">1</text><text class="t" x="107.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">09:02 Email</tspan><tspan x="107.8" dy="23.8">gateway</tspan></text><text class="n" x="107.8" y="125.8" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">Delivers invoice with</tspan><tspan x="107.8" dy="19.5">warning banner</tspan></text><line class="ln" x1="220.5" y1="93.4" x2="245.5" y2="93.4"/><polygon class="ah" points="256.5,93.4 245.5,87.3 245.5,99.4"/><rect class="bx" x="261.5" y="6.0" width="215.5" height="174.8" rx="14"/><rect class="bar" x="261.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="36.0" r="15"/><text class="bn" x="287.5" y="41.5" text-anchor="middle" font-size="16">2</text><text class="t" x="369.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">09:04 EDR</tspan></text><text class="n" x="369.2" y="102.0" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">Blocks macro launching</tspan><tspan x="369.2" dy="19.5">PowerShell</tspan></text><line class="ln" x1="482.0" y1="93.4" x2="507.0" y2="93.4"/><polygon class="ah" points="518.0,93.4 507.0,87.3 507.0,99.4"/><rect class="bx" x="523.0" y="6.0" width="215.5" height="174.8" rx="14"/><rect class="bar" x="523.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="549.0" cy="36.0" r="15"/><text class="bn" x="549.0" y="41.5" text-anchor="middle" font-size="16">3</text><text class="t" x="630.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="630.8" dy="0.0">09:05 Identity</tspan><tspan x="630.8" dy="23.8">provider</tspan></text><text class="n" x="630.8" y="125.8" text-anchor="middle" font-size="15"><tspan x="630.8" dy="0.0">MFA blocks foreign login</tspan><tspan x="630.8" dy="19.5">attempt</tspan></text><line class="ln" x1="743.5" y1="93.4" x2="768.5" y2="93.4"/><polygon class="ah" points="779.5,93.4 768.5,87.3 768.5,99.4"/><rect class="bx" x="784.5" y="6.0" width="215.5" height="174.8" rx="14"/><rect class="bar" x="784.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="810.5" cy="36.0" r="15"/><text class="bn" x="810.5" y="41.5" text-anchor="middle" font-size="16">4</text><text class="t" x="892.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="892.2" dy="0.0">09:06 SIEM</tspan></text><text class="n" x="892.2" y="102.0" text-anchor="middle" font-size="15"><tspan x="892.2" dy="0.0">Correlates both into one</tspan><tspan x="892.2" dy="19.5">incident</tspan></text><path class="ln" d="M892.2,184.8 V212.8 H107.8"/><line class="ln" x1="107.8" y1="212.8" x2="107.8" y2="229.8"/><polygon class="ah" points="107.8,240.8 113.8,229.8 101.7,229.8"/><rect class="bx" x="0.0" y="244.8" width="215.5" height="174.8" rx="14"/><rect class="bar" x="0.0" y="244.8" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="274.8" r="15"/><text class="bn" x="26.0" y="280.2" text-anchor="middle" font-size="16">5</text><text class="t" x="107.8" y="312.9" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">09:07 SOAR</tspan></text><text class="n" x="107.8" y="340.8" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">Isolates laptop, resets</tspan><tspan x="107.8" dy="19.5">password, opens ticket</tspan></text><line class="ln" x1="220.5" y1="332.1" x2="245.5" y2="332.1"/><polygon class="ah" points="256.5,332.1 245.5,326.1 245.5,338.2"/><rect class="bx" x="261.5" y="244.8" width="215.5" height="174.8" rx="14"/><rect class="bar" x="261.5" y="244.8" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="274.8" r="15"/><text class="bn" x="287.5" y="280.2" text-anchor="middle" font-size="16">6</text><text class="t" x="369.2" y="312.9" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">09:15 Analyst</tspan><tspan x="369.2" dy="23.8">triage</tspan></text><text class="n" x="369.2" y="364.5" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">Confirms scope with</tspan><tspan x="369.2" dy="19.5">forensics and threat</tspan><tspan x="369.2" dy="19.5">intel</tspan></text><line class="ln" x1="482.0" y1="332.1" x2="507.0" y2="332.1"/><polygon class="ah" points="518.0,332.1 507.0,326.1 507.0,338.2"/><rect class="bx" x="523.0" y="244.8" width="215.5" height="174.8" rx="14"/><rect class="bar" x="523.0" y="244.8" width="215.5" height="6" rx="3"/><circle class="bc" cx="549.0" cy="274.8" r="15"/><text class="bn" x="549.0" y="280.2" text-anchor="middle" font-size="16">7</text><text class="t" x="630.8" y="312.9" text-anchor="middle" font-size="19"><tspan x="630.8" dy="0.0">09:50 Recover &amp;</tspan><tspan x="630.8" dy="23.8">improve</tspan></text><text class="n" x="630.8" y="364.5" text-anchor="middle" font-size="15"><tspan x="630.8" dy="0.0">Re-image, restore,</tspan><tspan x="630.8" dy="19.5">update filters</tspan></text></svg>