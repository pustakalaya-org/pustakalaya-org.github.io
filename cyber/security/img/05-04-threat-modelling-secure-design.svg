<svg class="dg" viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The four questions from the Threat Modeling Manifesto, done early and repeated as the design evolves.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect class="bx" x="0.0" y="6.0" width="215.5" height="155.2" rx="14"/><rect class="bar" x="0.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="36.0" r="15"/><text class="bn" x="26.0" y="41.5" text-anchor="middle" font-size="16">1</text><text class="t" x="107.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">What are we</tspan><tspan x="107.8" dy="23.8">building?</tspan></text><text class="n" x="107.8" y="125.8" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">Diagram, trust</tspan><tspan x="107.8" dy="19.5">boundaries</tspan></text><line class="ln" x1="220.5" y1="83.6" x2="245.5" y2="83.6"/><polygon class="ah" points="256.5,83.6 245.5,77.6 245.5,89.7"/><rect class="bx" x="261.5" y="6.0" width="215.5" height="155.2" rx="14"/><rect class="bar" x="261.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="36.0" r="15"/><text class="bn" x="287.5" y="41.5" text-anchor="middle" font-size="16">2</text><text class="t" x="369.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">What can go</tspan><tspan x="369.2" dy="23.8">wrong?</tspan></text><text class="n" x="369.2" y="125.8" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">STRIDE, attack trees</tspan></text><line class="ln" x1="482.0" y1="83.6" x2="507.0" y2="83.6"/><polygon class="ah" points="518.0,83.6 507.0,77.6 507.0,89.7"/><rect class="bx" x="523.0" y="6.0" width="215.5" height="155.2" rx="14"/><rect class="bar" x="523.0" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="549.0" cy="36.0" r="15"/><text class="bn" x="549.0" y="41.5" text-anchor="middle" font-size="16">3</text><text class="t" x="630.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="630.8" dy="0.0">What will we do?</tspan></text><text class="n" x="630.8" y="102.0" text-anchor="middle" font-size="15"><tspan x="630.8" dy="0.0">Choose controls per</tspan><tspan x="630.8" dy="19.5">threat</tspan></text><line class="ln" x1="743.5" y1="83.6" x2="768.5" y2="83.6"/><polygon class="ah" points="779.5,83.6 768.5,77.6 768.5,89.7"/><rect class="bx" x="784.5" y="6.0" width="215.5" height="155.2" rx="14"/><rect class="bar" x="784.5" y="6.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="810.5" cy="36.0" r="15"/><text class="bn" x="810.5" y="41.5" text-anchor="middle" font-size="16">4</text><text class="t" x="892.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="892.2" dy="0.0">Did we do a good</tspan><tspan x="892.2" dy="23.8">job?</tspan></text><text class="n" x="892.2" y="125.8" text-anchor="middle" font-size="15"><tspan x="892.2" dy="0.0">Review, test, iterate</tspan></text></svg>