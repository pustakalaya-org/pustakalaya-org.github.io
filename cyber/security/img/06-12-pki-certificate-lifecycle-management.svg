<svg class="dg" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Shrinking lifetimes make manual renewal impossible: from 2029 every public certificate must be replaced about eight times a year.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2012</tspan></text><rect class="bfill" x="280" y="14.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="33.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">60 months</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2015</tspan></text><rect class="bfill" x="280" y="64.0" width="344.2" height="28" rx="6"/><text class="n" x="634.2" y="83.0" text-anchor="start" font-size="15"><tspan x="634.2" dy="0.0">39 months</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2018</tspan></text><rect class="bfill" x="280" y="114.0" width="239.5" height="28" rx="6"/><text class="n" x="529.5" y="133.0" text-anchor="start" font-size="15"><tspan x="529.5" dy="0.0">825 days</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2020</tspan></text><rect class="bfill" x="280" y="164.0" width="115.5" height="28" rx="6"/><text class="n" x="405.5" y="183.0" text-anchor="start" font-size="15"><tspan x="405.5" dy="0.0">398 days</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2026</tspan></text><rect class="bfill" x="280" y="214.0" width="58.1" height="28" rx="6"/><text class="n" x="348.1" y="233.0" text-anchor="start" font-size="15"><tspan x="348.1" dy="0.0">200 days</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2027</tspan></text><rect class="bfill" x="280" y="264.0" width="29.0" height="28" rx="6"/><text class="n" x="319.0" y="283.0" text-anchor="start" font-size="15"><tspan x="319.0" dy="0.0">100 days</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Mar 2029</tspan></text><rect class="bfill" x="280" y="314.0" width="13.6" height="28" rx="6"/><text class="n" x="303.6" y="333.0" text-anchor="start" font-size="15"><tspan x="303.6" dy="0.0">47 days</tspan></text></svg>