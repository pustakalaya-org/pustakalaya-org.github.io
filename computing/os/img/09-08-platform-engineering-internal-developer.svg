<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Developers see one self-service interface; the platform team wires the tools together behind it.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="213.2" x2="500.0" y2="111.0"/><line class="ln" x1="619.3" y1="220.6" x2="684.1" y2="183.0"/><line class="ln" x1="620.0" y1="290.0" x2="770.0" y2="290.0"/><line class="ln" x1="619.3" y1="359.4" x2="702.4" y2="407.6"/><line class="ln" x1="500.0" y1="366.9" x2="500.0" y2="458.4"/><line class="ln" x1="380.7" y1="359.4" x2="297.6" y2="407.6"/><line class="ln" x1="380.0" y1="290.0" x2="230.0" y2="290.0"/><line class="ln" x1="380.7" y1="220.6" x2="315.9" y2="183.0"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Developer portal</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Backstage or SaaS portal</tspan></text><rect class="bx" x="665.2" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="765.2" y="120.7" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Golden-path</tspan><tspan x="765.2" dy="21.2">templates</tspan></text><text class="n" x="765.2" y="165.5" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">repo, CI, chart, SLO</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Service catalogue</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">owners, docs, dependencies</tspan></text><rect class="bx" x="665.2" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="439.6" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">CI/CD &amp; GitOps</tspan></text><text class="n" x="765.2" y="463.1" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">pipelines, Argo CD, Flux</tspan></text><rect class="bx" x="400.0" y="463.4" width="200.0" height="89.2" rx="12"/><text class="t" x="500.0" y="492.8" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Infrastructure</tspan><tspan x="500.0" dy="21.2">APIs</tspan></text><text class="n" x="500.0" y="537.6" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Crossplane, OpenTofu</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Observability</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">dashboards, alerts, SLOs</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Security &amp; policy</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">scanning, admission rules</tspan></text><rect class="bx" x="134.8" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="234.8" y="120.7" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Secrets &amp;</tspan><tspan x="234.8" dy="21.2">identity</tspan></text><text class="n" x="234.8" y="165.5" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">vaults, workload identity</tspan></text><rect class="bxa" x="385.0" y="218.2" width="230.0" height="143.7" rx="12"/><text class="t" x="500.0" y="251.0" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Internal</tspan><tspan x="500.0" dy="26.2">developer</tspan><tspan x="500.0" dy="26.2">platform</tspan></text><text class="n" x="500.0" y="328.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">self-service via portal, CLI</tspan><tspan x="500.0" dy="18.2">or API</tspan></text></svg>