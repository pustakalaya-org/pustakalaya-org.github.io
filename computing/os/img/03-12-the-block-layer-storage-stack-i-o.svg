<svg class="dg" viewBox="0 0 1000 494" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each layer looks like a block device to the one above it.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="35.0" r="15"/><text class="bn" x="34.0" y="40.5" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="42.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">File system</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="54.0"/><text class="n" x="350.0" y="40.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">XFS, ext4, Btrfs</tspan></text><rect x="2" y="74.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.13;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="105.0" r="15"/><text class="bn" x="34.0" y="110.5" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="112.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">LVM logical volume</tspan></text><line class="sep" x1="330.0" y1="86.0" x2="330.0" y2="124.0"/><text class="n" x="350.0" y="110.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">device mapper: dm-linear</tspan></text><rect x="2" y="144.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.19;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="175.0" r="15"/><text class="bn" x="34.0" y="180.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="182.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">dm-crypt (LUKS2)</tspan></text><line class="sep" x1="330.0" y1="156.0" x2="330.0" y2="194.0"/><text class="n" x="350.0" y="180.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">AES-XTS encryption</tspan></text><rect x="2" y="214.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="245.0" r="15"/><text class="bn" x="34.0" y="250.5" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="252.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">MD RAID</tspan></text><line class="sep" x1="330.0" y1="226.0" x2="330.0" y2="264.0"/><text class="n" x="350.0" y="250.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">mdadm RAID 1/5/6/10</tspan></text><rect x="2" y="284.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.29;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="315.0" r="15"/><text class="bn" x="34.0" y="320.5" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="322.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">blk-mq + scheduler</tspan></text><line class="sep" x1="330.0" y1="296.0" x2="330.0" y2="334.0"/><text class="n" x="350.0" y="320.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">none / mq-deadline / BFQ / Kyber</tspan></text><rect x="2" y="354.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.35;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="385.0" r="15"/><text class="bn" x="34.0" y="390.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="392.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Device driver</tspan></text><line class="sep" x1="330.0" y1="366.0" x2="330.0" y2="404.0"/><text class="n" x="350.0" y="390.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">nvme, ahci (SATA), virtio-blk</tspan></text><rect x="2" y="424.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="455.0" r="15"/><text class="bn" x="34.0" y="460.5" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="462.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Hardware</tspan></text><line class="sep" x1="330.0" y1="436.0" x2="330.0" y2="474.0"/><text class="n" x="350.0" y="460.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">SSD, HDD, cloud volume</tspan></text></svg>