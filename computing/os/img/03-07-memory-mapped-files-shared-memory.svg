<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Mapped processes and read() callers all share the same cached pages of the file.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="208.5" x2="500.0" y2="111.0"/><line class="ln" x1="619.9" y1="231.5" x2="751.7" y2="211.2"/><line class="ln" x1="560.1" y1="289.2" x2="664.2" y2="357.3"/><line class="ln" x1="439.9" y1="289.2" x2="335.8" y2="357.3"/><line class="ln" x1="380.1" y1="231.5" x2="248.3" y2="211.2"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Worker 1</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">mmap MAP_SHARED</tspan></text><rect class="bx" x="756.6" y="161.0" width="200.0" height="68.0" rx="12"/><text class="t" x="856.6" y="190.4" text-anchor="middle" font-size="17"><tspan x="856.6" dy="0.0">Worker 2</tspan></text><text class="n" x="856.6" y="214.0" text-anchor="middle" font-size="13"><tspan x="856.6" dy="0.0">mmap MAP_SHARED</tspan></text><rect class="bx" x="620.4" y="360.0" width="200.0" height="68.0" rx="12"/><text class="t" x="720.4" y="389.5" text-anchor="middle" font-size="17"><tspan x="720.4" dy="0.0">Worker 3</tspan></text><text class="n" x="720.4" y="413.0" text-anchor="middle" font-size="13"><tspan x="720.4" dy="0.0">MAP_PRIVATE (COW)</tspan></text><rect class="bx" x="179.6" y="360.0" width="200.0" height="68.0" rx="12"/><text class="t" x="279.6" y="389.5" text-anchor="middle" font-size="17"><tspan x="279.6" dy="0.0">Backup tool</tspan></text><text class="n" x="279.6" y="413.0" text-anchor="middle" font-size="13"><tspan x="279.6" dy="0.0">plain read()</tspan></text><rect class="bx" x="43.4" y="161.0" width="200.0" height="68.0" rx="12"/><text class="t" x="143.4" y="190.4" text-anchor="middle" font-size="17"><tspan x="143.4" dy="0.0">Disk file</tspan></text><text class="n" x="143.4" y="214.0" text-anchor="middle" font-size="13"><tspan x="143.4" dy="0.0">writeback / msync</tspan></text><rect class="bxa" x="385.0" y="213.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="246.3" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Page cache</tspan></text><text class="n" x="500.0" y="271.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">pages of index.bin</tspan></text></svg>