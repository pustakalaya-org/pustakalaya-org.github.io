<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each node owns a slice of the Pod CIDR; the CNI either tunnels between nodes or routes natively.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="80.0" y1="260.0" x2="248.0" y2="260.0"/><line class="ln" x1="248.0" y1="260.0" x2="416.0" y2="260.0"/><line class="ln" x1="416.0" y1="260.0" x2="584.0" y2="260.0"/><line class="ln" x1="584.0" y1="260.0" x2="752.0" y2="260.0"/><line class="ln" x1="752.0" y1="260.0" x2="920.0" y2="260.0"/><rect class="lbg" x="422.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">VXLAN or BGP route</tspan></text><rect class="lbg" x="758.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="836.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="836.0" dy="0.0">policy check</tspan></text><rect class="bx" x="-5.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="80.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="80.0" dy="0.0">Pod A</tspan></text><text class="n" x="80.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="80.0" dy="0.0">10.244.1.7</tspan></text><rect class="bx" x="163.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="248.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="248.0" dy="0.0">veth / eBPF</tspan></text><text class="n" x="248.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="248.0" dy="0.0">node 1 datapath</tspan></text><rect class="bx" x="331.0" y="218.1" width="170.0" height="83.9" rx="12"/><text class="t" x="416.0" y="246.7" text-anchor="middle" font-size="16"><tspan x="416.0" dy="0.0">Node 1</tspan></text><text class="n" x="416.0" y="270.0" text-anchor="middle" font-size="13"><tspan x="416.0" dy="0.0">Pod CIDR</tspan><tspan x="416.0" dy="16.9">10.244.1.0/24</tspan></text><rect class="bx" x="499.0" y="218.1" width="170.0" height="83.9" rx="12"/><text class="t" x="584.0" y="246.7" text-anchor="middle" font-size="16"><tspan x="584.0" dy="0.0">Node 2</tspan></text><text class="n" x="584.0" y="270.0" text-anchor="middle" font-size="13"><tspan x="584.0" dy="0.0">Pod CIDR</tspan><tspan x="584.0" dy="16.9">10.244.2.0/24</tspan></text><rect class="bxa" x="667.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="752.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="752.0" dy="0.0">veth / eBPF</tspan></text><text class="n" x="752.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="752.0" dy="0.0">node 2 datapath</tspan></text><rect class="bx" x="835.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="920.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="920.0" dy="0.0">Pod B</tspan></text><text class="n" x="920.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="920.0" dy="0.0">10.244.2.9</tspan></text></svg>