<svg class="dg" viewBox="0 0 1000 590" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The highest ready thread always wins, so the real-time band sits above everything an ordinary app does.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="33.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Real-time band</tspan><tspan x="4.0" dy="17.5">(16-31)</tspan></text><text class="lab" x="4.0" y="178.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">High (13)</tspan></text><text class="lab" x="4.0" y="300.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Above normal /</tspan><tspan x="4.0" dy="17.5">Normal (10 / 8)</tspan></text><text class="lab" x="4.0" y="426.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Below normal /</tspan><tspan x="4.0" dy="17.5">Idle (6 / 4)</tspan></text><text class="lab" x="4.0" y="561.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Level 0</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="354.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="459.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Realtime class:</tspan><tspan x="459.0" dy="20.0">base 24</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">MMCSS audio threads</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Task Manager</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">critical system</tspan><tspan x="685.0" dy="20.0">tools</tspan></text></g><g transform="translate(0,304.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">most applications</tspan></text></g><g transform="translate(0,304.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">foreground boosts</tspan></text></g><g transform="translate(0,430.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">indexers</tspan></text></g><g transform="translate(0,430.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">background updaters</tspan></text></g><g transform="translate(0,556.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">zero-page thread</tspan></text></g></svg>