<svg class="dg" viewBox="0 0 1000 568" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every step is an API call between services; the compute node does the actual VM start with libvirt and KVM.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="99.0" x2="110.0" y2="561.2"/><line class="ln lnd life" x1="305.0" y1="99.0" x2="305.0" y2="561.2"/><line class="ln lnd life" x1="500.0" y1="99.0" x2="500.0" y2="561.2"/><line class="ln lnd life" x1="695.0" y1="99.0" x2="695.0" y2="561.2"/><line class="ln lnd life" x1="890.0" y1="99.0" x2="890.0" y2="561.2"/><g transform="translate(0,52.5)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">User</tspan></text></g><g transform="translate(0,52.5)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">Keystone</tspan></text></g><g transform="translate(0,52.5)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Nova</tspan></text></g><g transform="translate(0,52.5)"><rect class="bxa" x="605.5" y="-46.5" width="179.0" height="93.0" rx="12"/><text class="t" x="695.0" y="-16.2" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Glance /</tspan><tspan x="695.0" dy="22.5">Neutron /</tspan><tspan x="695.0" dy="22.5">Cinder</tspan></text></g><g transform="translate(0,52.5)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Compute node</tspan></text></g><text class="n ml" x="207.5" y="132.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. authenticate</tspan></text><line class="ln" x1="110.0" y1="145.0" x2="294.0" y2="145.0"/><polygon class="ah" points="305.0,145.0 294.0,138.9 294.0,151.1"/><text class="n ml" x="207.5" y="159.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">2. token (project,</tspan><tspan x="207.5" dy="18.8">roles)</tspan></text><line class="ln lnd" x1="305.0" y1="190.0" x2="121.0" y2="190.0"/><polygon class="ah" points="110.0,190.0 121.0,196.1 121.0,183.9"/><text class="n ml" x="305.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. server create (flavor, image, net)</tspan></text><line class="ln" x1="110.0" y1="253.8" x2="489.0" y2="253.8"/><polygon class="ah" points="500.0,253.8 489.0,247.7 489.0,259.8"/><text class="n ml" x="695.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">4. build on host chosen via Placement</tspan></text><line class="ln" x1="500.0" y1="298.8" x2="879.0" y2="298.8"/><polygon class="ah" points="890.0,298.8 879.0,292.7 879.0,304.8"/><text class="n ml" x="792.5" y="312.8" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">5. get image, port,</tspan><tspan x="792.5" dy="18.8">volume</tspan></text><line class="ln" x1="890.0" y1="343.8" x2="706.0" y2="343.8"/><polygon class="ah" points="695.0,343.8 706.0,349.8 706.0,337.7"/><text class="n ml" x="792.5" y="376.5" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">6. image data, port,</tspan><tspan x="792.5" dy="18.8">volume attached</tspan></text><line class="ln lnd" x1="695.0" y1="407.5" x2="879.0" y2="407.5"/><polygon class="ah" points="890.0,407.5 879.0,401.4 879.0,413.6"/><text class="n ml" x="695.0" y="459.0" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">7. libvirt booted KVM guest</tspan></text><line class="ln lnd" x1="890.0" y1="471.2" x2="511.0" y2="471.2"/><polygon class="ah" points="500.0,471.2 511.0,477.3 511.0,465.2"/><text class="n ml" x="305.0" y="504.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">8. status ACTIVE, IP address</tspan></text><line class="ln lnd" x1="500.0" y1="516.2" x2="121.0" y2="516.2"/><polygon class="ah" points="110.0,516.2 121.0,522.3 121.0,510.2"/></svg>