lass="ln" x1="643.3" y1="77.0" x2="643.3" y2="68.0"/><text class="t" x="643.3" y="42.5" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">1991 · Linux</tspan></text><text class="n" x="643.3" y="64.0" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">Torvalds&#x27; hobby kernel</tspan></text><circle class="dot" cx="738.9" cy="86.0" r="9"/><line class="ln" x1="738.9" y1="95.0" x2="738.9" y2="106.0"/><text class="t" x="738.9" y="126.5" text-anchor="middle" font-size="17"><tspan x="738.9" dy="0.0">1993 · Windows NT</tspan></text><text class="n" x="738.9" y="148.0" text-anchor="middle" font-size="13"><tspan x="738.9" dy="0.0">Cutler&#x27;s new kernel</tspan></text><circle class="dot" cx="834.4" cy="86.0" r="9"/><line class="ln" x1="834.4" y1="77.0" x2="834.4" y2="68.0"/><text class="t" x="834.4" y="42.5" text-anchor="middle" font-size="17"><tspan x="834.4" dy="0.0">2001 · Mac OS X</tspan></text><text class="n" x="834.4" y="64.0" text-anchor="middle" font-size="13"><tspan x="834.4" dy="0.0">Unix core, Aqua GUI</tspan></text><circle class="dot" cx="930.0" cy="86.0" r="9"/><line class="ln" x1="930.0" y1="95.0" x2="930.0" y2="106.0"/><text class="t" x="930.0" y="126.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2007-08 · iOS,</tspan><tspan x="930.0" dy="21.2">Android</tspan></text><text class="n" x="930.0" y="169.2" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">smartphone era</tspan></text></svg>