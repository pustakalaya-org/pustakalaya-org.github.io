<svg class="dg" viewBox="0 0 1000 546" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Swap the bottom box and you change the isolation model without touching anything above it.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="41.5" r="15"/><text class="bn" x="34.0" y="47.0" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="36.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">kubelet / dockerd /</tspan><tspan x="64.0" dy="25.0">Podman</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="67.0"/><text class="n" x="350.0" y="47.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">asks for containers</tspan></text><rect x="2" y="87.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.13;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="124.5" r="15"/><text class="bn" x="34.0" y="130.0" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="119.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">CRI (gRPC) / engine</tspan><tspan x="64.0" dy="25.0">API</tspan></text><line class="sep" x1="330.0" y1="99.0" x2="330.0" y2="150.0"/><text class="n" x="350.0" y="130.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">standard request interface</tspan></text><rect x="2" y="170.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.19;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="201.0" r="15"/><text class="bn" x="34.0" y="206.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="208.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">containerd or CRI-O</tspan></text><line class="sep" x1="330.0" y1="182.0" x2="330.0" y2="220.0"/><text class="n" x="350.0" y="206.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">images, snapshots, lifecycle</tspan></text><rect x="2" y="240.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="277.5" r="15"/><text class="bn" x="34.0" y="283.0" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="272.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Shim (shim v2 /</tspan><tspan x="64.0" dy="25.0">conmon)</tspan></text><line class="sep" x1="330.0" y1="252.0" x2="330.0" y2="303.0"/><text class="n" x="350.0" y="283.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">one per container or Pod</tspan></text><rect x="2" y="323.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.29;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="354.0" r="15"/><text class="bn" x="34.0" y="359.5" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="361.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">OCI runtime</tspan></text><line class="sep" x1="330.0" y1="335.0" x2="330.0" y2="373.0"/><text class="n" x="350.0" y="359.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">runc · crun · youki · runsc · kata</tspan></text><rect x="2" y="393.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.35;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="424.0" r="15"/><text class="bn" x="34.0" y="429.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="431.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Isolation</tspan></text><line class="sep" x1="330.0" y1="405.0" x2="330.0" y2="443.0"/><text class="n" x="350.0" y="429.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">namespaces · user-space kernel · micro-VM</tspan></text><rect x="2" y="463.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="500.5" r="15"/><text class="bn" x="34.0" y="506.0" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="495.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Host kernel +</tspan><tspan x="64.0" dy="25.0">hardware</tspan></text><line class="sep" x1="330.0" y1="475.0" x2="330.0" y2="526.0"/><text class="n" x="350.0" y="506.1" text-anchor="start" font-size="