.5" y="415.3" text-anchor="middle" font-size="16"><tspan x="717.5" dy="0.0">Debian</tspan></text><text class="n" x="717.5" y="438.7" text-anchor="middle" font-size="13"><tspan x="717.5" dy="0.0">community, ~2-yearly</tspan></text><rect class="bx" x="415.0" y="416.1" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="444.7" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Ubuntu</tspan></text><text class="n" x="500.0" y="468.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Canonical, LTS every</tspan><tspan x="500.0" dy="16.9">2 yrs</tspan></text><rect class="bx" x="197.5" y="386.7" width="170.0" height="67.0" rx="12"/><text class="t" x="282.5" y="415.3" text-anchor="middle" font-size="16"><tspan x="282.5" dy="0.0">Linux Mint</tspan></text><text class="n" x="282.5" y="438.7" text-anchor="middle" font-size="13"><tspan x="282.5" dy="0.0">desktop, Ubuntu base</tspan></text><rect class="bx" x="63.1" y="277.7" width="170.0" height="87.0" rx="12"/><text class="t" x="148.1" y="306.3" text-anchor="middle" font-size="16"><tspan x="148.1" dy="0.0">openSUSE</tspan><tspan x="148.1" dy="20.0">Tumbleweed</tspan></text><text class="n" x="148.1" y="349.7" text-anchor="middle" font-size="13"><tspan x="148.1" dy="0.0">rolling</tspan></text><rect class="bxa" x="63.1" y="165.3" width="170.0" height="67.0" rx="12"/><text class="t" x="148.1" y="193.9" text-anchor="middle" font-size="16"><tspan x="148.1" dy="0.0">SLES 16</tspan></text><text class="n" x="148.1" y="217.3" text-anchor="middle" font-size="13"><tspan x="148.1" dy="0.0">SUSE enterprise</tspan></text><rect class="bx" x="197.5" y="56.3" width="170.0" height="87.0" rx="12"/><text class="t" x="282.5" y="84.9" text-anchor="middle" font-size="16"><tspan x="282.5" dy="0.0">openSUSE Leap</tspan><tspan x="282.5" dy="20.0">16</tspan></text><text class="n" x="282.5" y="128.3" text-anchor="middle" font-size="13"><tspan x="282.5" dy="0.0">built from SLES</tspan></text></svg>