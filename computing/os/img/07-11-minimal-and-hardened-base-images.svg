<svg class="dg" viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Log scale: a full language image can be hundreds of times larger than a distroless or Alpine base. Sizes vary by version.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">distroless/static</tspan></text><rect class="bfill" x="280" y="14.0" width="53.0" height="28" rx="6"/><text class="n" x="343.0" y="33.0" text-anchor="start" font-size="15"><tspan x="343.0" dy="0.0">~2 MB</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">busybox</tspan></text><rect class="bfill" x="280" y="64.0" width="111.8" height="28" rx="6"/><text class="n" x="401.8" y="83.0" text-anchor="start" font-size="15"><tspan x="401.8" dy="0.0">~4 MB</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">alpine:3.22</tspan></text><rect class="bfill" x="280" y="114.0" width="162.2" height="28" rx="6"/><text class="n" x="452.2" y="133.0" text-anchor="start" font-size="15"><tspan x="452.2" dy="0.0">~8 MB</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">debian:bookworm-slim</tspan></text><rect class="bfill" x="280" y="164.0" width="331.2" height="28" rx="6"/><text class="n" x="621.2" y="183.0" text-anchor="start" font-size="15"><tspan x="621.2" dy="0.0">~75 MB</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ubuntu:24.04</tspan></text><rect class="bfill" x="280" y="214.0" width="334.2" height="28" rx="6"/><text class="n" x="624.2" y="233.0" text-anchor="start" font-size="15"><tspan x="624.2" dy="0.0">~78 MB</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">debian:bookworm</tspan></text><rect class="bfill" x="280" y="264.0" width="365.3" height="28" rx="6"/><text class="n" x="655.3" y="283.0" text-anchor="start" font-size="15"><tspan x="655.3" dy="0.0">~117 MB</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">python:3.13-slim</tspan></text><rect class="bfill" x="280" y="314.0" width="370.4" height="28" rx="6"/><text class="n" x="660.4" y="333.0" text-anchor="start" font-size="15"><tspan x="660.4" dy="0.0">~125 MB</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">