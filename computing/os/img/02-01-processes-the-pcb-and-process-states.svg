<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>A process spends most of its life bouncing between ready, running and blocked.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.7" y1="96.9" x2="752.0" y2="160.0"/><polygon class="ah" points="762.2,164.0 754.2,154.3 749.8,165.6"/><line class="ln" x1="829.0" y1="236.6" x2="746.1" y2="373.0"/><polygon class="ah" points="740.4,382.4 751.3,376.1 741.0,369.9"/><line class="ln" x1="740.4" y1="382.4" x2="823.2" y2="246.0"/><polygon class="ah" points="829.0,236.6 818.1,242.9 828.4,249.1"/><line class="ln" x1="627.5" y1="420.2" x2="383.5" y2="420.2"/><polygon class="ah" points="372.5,420.2 383.5,426.2 383.5,414.1"/><line class="ln" x1="372.2" y1="385.3" x2="752.0" y2="237.7"/><polygon class="ah" points="762.2,233.7 749.8,232.0 754.2,243.3"/><line class="ln" x1="627.8" y1="385.3" x2="248.0" y2="237.7"/><polygon class="ah" points="237.8,233.7 245.8,243.3 250.2,232.0"/><rect class="lbg" x="597.9" y="117.4" width="156" height="23.0" rx="6"/><text class="n" x="675.9" y="132.4" text-anchor="middle" font-size="13"><tspan x="675.9" dy="0.0">admitted</tspan></text><rect class="lbg" x="706.7" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="784.7" y="311.5" text-anchor="middle" font-size="13"><tspan x="784.7" dy="0.0">dispatched</tspan></text><rect class="lbg" x="706.7" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="784.7" y="311.5" text-anchor="middle" font-size="13"><tspan x="784.7" dy="0.0">preempted</tspan></text><rect class="lbg" x="422.0" y="407.2" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="422.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">waits</tspan></text><rect class="lbg" x="489.2" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="567.2" y="311.5" text-anchor="middle" font-size="13"><tspan x="567.2" dy="0.0">event done</tspan></text><rect class="lbg" x="354.8" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="432.8" y="311.5" text-anchor="middle" font-size="13"><tspan x="432.8" dy="0.0">exit</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">New</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">PCB being set up</tspan></text><rect class="bx" x="766.9" y="165.3" width="170.0" height="67.0" rx="12"/><text class="t" x="851.9" y="193.9" text-anchor="middle" font-size="16"><tspan x="851.9" dy="0.0">Ready</tspan></text><text class="n" x="851.9" y="217.3" text-anchor="middle" font-size="13"><tspan x="851.9" dy="0.0">waiting for a CPU</tspan></text><rect class="bxa" x="632.5" y="386.7" width="170.0" height="67.0" rx="12"/><text class="t" x="717.5" y="415.3" text-anchor="middle" font-size="16"><tspan x="717.5" dy="0.0">Running</tspan></text><text class="n" x="717.5" y="438.7" text-anchor="middle" font-size="13"><tspan x="717.5" dy="0.0">on a CPU now</tspan></text><rect class="bx" x="197.5" y="378.2" width="170.0" height="83.9" rx="12"/><text class="t" x="282.5" y="406.8" text-anchor="middle" font-size="16"><tspan x="282.5" dy="0.0">Blocked</tspan></text><text class="n" x="282.5" y="430.2" text-anchor="middle" font-size="13"><tspan x="282.5" dy="0.0">waiting for I/O or</tspan><tspan x="282.5" dy="16.9">event</tspan></text><rect class="bx" x="63.1" y="165.3" width="170.0" height="67.0" rx="12"/><text class="t" x="148.1" y="193.9" text-anchor="middle" font-size="16"><tspan x="148.1" dy="0.0">Terminated</tspan></text><text class="n" x="148.1" y="217.3" text-anchor="middle" font-size="13"><tspan x="148.1" dy="0.0">zombie until reaped</tspan></text></svg>