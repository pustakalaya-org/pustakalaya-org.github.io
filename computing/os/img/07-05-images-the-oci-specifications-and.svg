<svg class="dg" viewBox="0 0 1000 530" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Only the small manifest is fetched by tag; everything else is fetched by digest and verified.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="523.8"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="523.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="523.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Client</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Auth service</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Registry</tspan></text></g><text class="n ml" x="500.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">1. GET /v2/library/nginx/manifests/1.29</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="879.0" y2="100.0"/><polygon class="ah" points="890.0,100.0 879.0,94.0 879.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. 401 + WWW-Authenticate: Bearer realm</tspan></text><line class="ln lnd" x1="890.0" y1="145.0" x2="121.0" y2="145.0"/><polygon class="ah" points="110.0,145.0 121.0,151.1 121.0,138.9"/><text class="n ml" x="305.0" y="159.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">3. GET</tspan><tspan x="305.0" dy="18.8">/token?scope=repository:library/nginx:pull</tspan></text><line class="ln" x1="110.0" y1="190.0" x2="489.0" y2="190.0"/><polygon class="ah" points="500.0,190.0 489.0,183.9 489.0,196.1"/><text class="n ml" x="305.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. 200 bearer token</tspan></text><line class="ln lnd" x1="500.0" y1="253.8" x2="121.0" y2="253.8"/><polygon class="ah" points="110.0,253.8 121.0,259.8 121.0,247.7"/><text class="n ml" x="500.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. GET manifests/1.29 (with token)</tspan></text><line class="ln" x1="110.0" y1="298.8" x2="879.0" y2="298.8"/><polygon class="ah" points="890.0,298.8 879.0,292.7 879.0,304.8"/><text class="n ml" x="500.0" y="331.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. image index (amd64, arm64, …)</tspan></text><line class="ln lnd" x1="890.0" y1="343.8" x2="121.0" y2="343.8"/><polygon class="ah" points="110.0,343.8 121.0,349.8 121.0,337.7"/><text class="n ml" x="500.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. GET manifests/sha256:… (linux/amd64)</tspan></text><line class="ln" x1="110.0" y1="388.8" x2="879.0" y2="388.8"/><polygon class="ah" points="890.0,388.8 879.0,382.7 879.0,394.8"/><text class="n ml" x="500.0" y="421.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. GET blobs/sha256:… (config, layers)</tspan></text><line class="ln" x1="110.0" y1="433.8" x2="879.0" y2="433.8"/><polygon class="ah" points="890.0,433.8 879.0,427.7 879.0,439.8"/><text class="n ml" x="500.0" y="466.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">9. blobs streamed; client verifies digests</tspan></text><line class="ln lnd" x1="890.0" y1="478.8" x2="121.0" y2="478.8"/><polygon class="ah" points="110.0,478.8 121.0,484.8 121.0,472.7"/></svg>