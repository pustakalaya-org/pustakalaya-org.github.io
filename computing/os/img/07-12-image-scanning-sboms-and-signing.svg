lass="bn" x="549.0" y="260.8" text-anchor="middle" font-size="16">7</text><text class="t" x="630.8" y="293.4" text-anchor="middle" font-size="19"><tspan x="630.8" dy="0.0">Verify at</tspan><tspan x="630.8" dy="23.8">admission</tspan></text><text class="n" x="630.8" y="345.0" text-anchor="middle" font-size="15"><tspan x="630.8" dy="0.0">policy checks signer</tspan><tspan x="630.8" dy="19.5">identity</tspan></text><line class="ln" x1="743.5" y1="302.9" x2="768.5" y2="302.9"/><polygon class="ah" points="779.5,302.9 768.5,296.8 768.5,308.9"/><rect class="bx" x="784.5" y="225.2" width="215.5" height="155.2" rx="14"/><rect class="bar" x="784.5" y="225.2" width="215.5" height="6" rx="3"/><circle class="bc" cx="810.5" cy="255.2" r="15"/><text class="bn" x="810.5" y="260.8" text-anchor="middle" font-size="16">8</text><text class="t" x="892.2" y="293.4" text-anchor="middle" font-size="19"><tspan x="892.2" dy="0.0">Re-scan</tspan><tspan x="892.2" dy="23.8">continuously</tspan></text><text class="n" x="892.2" y="345.0" text-anchor="middle" font-size="15"><tspan x="892.2" dy="0.0">new CVEs, VEX updates</tspan></text></svg>