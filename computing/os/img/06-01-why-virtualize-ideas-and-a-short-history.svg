<svg class="dg" viewBox="0 0 1000 221" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Virtualization began on 1960s mainframes and returned with x86 servers around 2000.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1967 · IBM CP-40</tspan></text><text class="n" x="70.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">first full VMs on</tspan><tspan x="70.0" dy="16.2">System/360</tspan></text><circle class="dot" cx="165.6" cy="107.2" r="9"/><line class="ln" x1="165.6" y1="116.2" x2="165.6" y2="127.2"/><text class="t" x="165.6" y="147.7" text-anchor="middle" font-size="17"><tspan x="165.6" dy="0.0">1972 · IBM VM/370</tspan></text><text class="n" x="165.6" y="169.2" text-anchor="middle" font-size="13"><tspan x="165.6" dy="0.0">commercial mainframe</tspan><tspan x="165.6" dy="16.2">virtualization</tspan></text><circle class="dot" cx="261.1" cy="107.2" r="9"/><line class="ln" x1="261.1" y1="98.2" x2="261.1" y2="89.2"/><text class="t" x="261.1" y="42.5" text-anchor="middle" font-size="17"><tspan x="261.1" dy="0.0">1974 ·</tspan><tspan x="261.1" dy="21.2">Popek-Goldberg</tspan></text><text class="n" x="261.1" y="85.2" text-anchor="middle" font-size="13"><tspan x="261.1" dy="0.0">formal requirements paper</tspan></text><circle class="dot" cx="356.7" cy="107.2" r="9"/><line class="ln" x1="356.7" y1="116.2" x2="356.7" y2="127.2"/><text class="t" x="356.7" y="147.7" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">1999 · VMware</tspan><tspan x="356.7" dy="21.2">Workstation</tspan></text><text class="n" x="356.7" y="190.5" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">x86 via binary</tspan><tspan x="356.7" dy="16.2">translation</tspan></text><circle class="dot" cx="452.2" cy="107.2" r="9"/><line class="ln" x1="452.2" y1="98.2" x2="452.2" y2="89.2"/><text class="t" x="452.2" y="47.5" text-anchor="middle" font-size="17"><tspan x="452.2" dy="0.0">2003 · Xen</tspan></text><text class="n" x="452.2" y="69.0" text-anchor="middle" font-size="13"><tspan x="452.2" dy="0.0">paravirtualization,</tspan><tspan x="452.2" dy="16.2">Cambridge</tspan></text><circle class="dot" cx="547.8" cy="107.2" r="9"/><line class="ln" x1="547.8" y1="116.2" x2="547.8" y2="127.2"/><text class="t" x="547.8" y="147.7" text-anchor="middle" font-size="17"><tspan x="547.8" dy="0.0">2005-06 · VT-x,</tspan><tspan x="547.8" dy="21.2">AMD-V</tspan></text><text class="n" x="547.8" y="190.5" text-anchor="middle" font-size="13"><tspan x="547.8" dy="0.0">hardware assist on x86</tspan></text><circle class="dot" cx="643.3" cy="107.2" r="9"/><line class="ln" x1="643.3" y1="98.2" x2="643.3" y2="89.2"/><text class="t" x="643.3" y="63.7" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">2007 · KVM</tspan></text><text class="n" x="643.3" y="85.2" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">merged into Linux 2.6.20</tspan></text><circle class="dot" cx="738.9" cy="107.2" r="9"/><line class="ln" x1="738.9" y1="116.2" x2="738.9" y2="127.2"/><text class="t" x="738.9" y="147.7" text-anchor="middle" font-size="17"><tspan x="738.9" dy="0.0">2008 · Hyper-V</tspan></text><text class="n" x="738.9" y="169.2" text-anchor="middle" font-size="13"><tspan x="738.9" dy="0.0">with Windows Server 2008</tspan></text><circle class="dot" cx="834.4" cy="107.2" r="9"/><line class="ln" x1="834.4" y1="98.2" x2="834.4" y2="89.2"/><text class="t" x="834.4" y="42.5" text-anchor="middle" font-size="17"><tspan x="834.4" dy="0.0">2018 ·</tspan><tspan x="834.4" dy="21.2">Firecracker</tspan></text><text class="n" x="834.4" y="85.2" text-anchor="middle" font-size="13"><tspan x="834.4" dy="0.0">microVMs for serverless</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="116.2" x2="930.0" y2="127.2"/><text class="t" x="930.0" y="147.7" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2023 · Broadcom</tspan><tspan x="930.0" dy="21.2">buys VMware</tspan></text><text class="n" x="930.0" y="190.5" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">triggers migration wave</tspan></text></svg>