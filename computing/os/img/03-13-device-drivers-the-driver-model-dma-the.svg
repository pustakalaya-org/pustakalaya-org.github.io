<svg class="dg" viewBox="0 0 1000 414" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The CPU is involved only at the start and the end; the IOMMU checks the DMA write.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="407.5"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="407.5"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="407.5"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="407.5"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Driver (CPU)</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">NIC</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">IOMMU</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">RAM</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. post RX buffer addresses</tspan><tspan x="240.0" dy="18.8">(MMIO)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="151.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. DMA write to IOVA 0x8000</tspan></text><line class="ln" x1="370.0" y1="163.8" x2="619.0" y2="163.8"/><polygon class="ah" points="630.0,163.8 619.0,157.7 619.0,169.8"/><text class="n ml" x="760.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. allowed → physical frame</tspan></text><line class="ln" x1="630.0" y1="208.8" x2="879.0" y2="208.8"/><polygon class="ah" points="890.0,208.8 879.0,202.7 879.0,214.8"/><text class="n ml" x="240.0" y="222.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">4. MSI-X interrupt: packet</tspan><tspan x="240.0" dy="18.8">ready</tspan></text><line class="ln" x1="370.0" y1="253.8" x2="121.0" y2="253.8"/><polygon class="ah" points="110.0,253.8 121.0,259.8 121.0,247.7"/><text class="n ml" x="500.0" y="305.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. NAPI poll reads packet</tspan></text><line class="ln" x1="110.0" y1="317.5" x2="879.0" y2="317.5"/><polygon class="ah" points="890.0,317.5 879.0,311.4 879.0,323.6"/><text class="n ml" x="240.0" y="350.2" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">6. refill RX ring</tspan></text><line class="ln lnd" x1="110.0" y1="362.5" x2="359.0" y2="362.5"/><polygon class="ah" points="370.0,362.5 359.0,356.4 359.0,368.6"/></svg>