<svg class="dg" viewBox="0 0 1000 564" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Components never call each other directly — they all watch the API server and reconcile.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="557.5"/><line class="ln lnd life" x1="305.0" y1="76.5" x2="305.0" y2="557.5"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="557.5"/><line class="ln lnd life" x1="695.0" y1="76.5" x2="695.0" y2="557.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="557.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">kubectl</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">API server</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">etcd</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="605.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="695.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Controllers &amp;</tspan><tspan x="695.0" dy="22.5">scheduler</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">kubelet</tspan></text></g><text class="n ml" x="207.5" y="72.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. PATCH Deployment</tspan><tspan x="207.5" dy="18.8">(authn, authz,</tspan><tspan x="207.5" dy="18.8">admission)</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="294.0" y2="122.5"/><polygon class="ah" points="305.0,122.5 294.0,116.5 294.0,128.6"/><text class="n ml" x="402.5" y="174.0" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. store desired</tspan><tspan x="402.5" dy="18.8">state</tspan></text><line class="ln" x1="305.0" y1="205.0" x2="489.0" y2="205.0"/><polygon class="ah" points="500.0,205.0 489.0,198.9 489.0,211.1"/><text class="n ml" x="207.5" y="237.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">3. deployment</tspan><tspan x="207.5" dy="18.8">configured</tspan></text><line class="ln lnd" x1="305.0" y1="268.8" x2="121.0" y2="268.8"/><polygon class="ah" points="110.0,268.8 121.0,274.8 121.0,262.7"/><text class="n ml" x="500.0" y="320.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. watch: Deployment changed</tspan></text><line class="ln lnd" x1="305.0" y1="332.5" x2="684.0" y2="332.5"/><polygon class="ah" points="695.0,332.5 684.0,326.4 684.0,338.6"/><text class="n ml" x="500.0" y="365.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. create ReplicaSet, then Pods</tspan></text><line class="ln" x1="695.0" y1="377.5" x2="316.0" y2="377.5"/><polygon class="ah" points="305.0,377.5 316.0,383.6 316.0,371.4"/><text class="n ml" x="500.0" y="410.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. scheduler binds Pod to node-2</tspan></text><line class="ln" x1="695.0" y1="422.5" x2="316.0" y2="422.5"/><polygon class="ah" points="305.0,422.5 316.0,428.6 316.0,416.4"/><text class="n ml" x="597.5" y="455.2" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">7. watch: Pod assigned to node-2</tspan></text><line class="ln lnd" x1="305.0" y1="467.5" x2="879.0" y2="467.5"/><polygon class="ah" points="890.0,467.5 879.0,461.4 879.0,473.6"/><text class="n ml" x="597.5" y="500.2" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">8. status: Running, Ready</tspan></text><line class="ln" x1="890.0" y1="512.5" x2="316.0" y2="512.5"/><polygon class="ah" points="305.0,512.5 316.0,518.5 316.0,506.4"/></svg>