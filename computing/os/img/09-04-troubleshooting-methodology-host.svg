<svg class="dg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Go round the loop again if the symptom is not gone — and never skip the last step.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><ellipse class="ring" cx="500.0" cy="280.0" rx="360" ry="200.0"/><line class="ln acc" x1="666.7" y1="102.5" x2="676.2" y2="105.6"/><polygon class="ah" points="689.5,109.8 678.5,98.2 673.8,112.9"/><line class="ln acc" x1="860.0" y1="266.0" x2="860.0" y2="276.0"/><polygon class="ah" points="860.0,290.0 867.7,276.0 852.3,276.0"/><line class="ln acc" x1="693.3" y1="448.9" x2="683.8" y2="452.0"/><polygon class="ah" points="670.5,456.3 686.2,459.3 681.5,444.7"/><line class="ln acc" x1="333.3" y1="457.5" x2="323.8" y2="454.4"/><polygon class="ah" points="310.5,450.2 321.5,461.8 326.2,447.1"/><line class="ln acc" x1="140.0" y1="294.0" x2="140.0" y2="284.0"/><polygon class="ah" points="140.0,270.0 132.3,284.0 147.7,284.0"/><line class="ln acc" x1="306.7" y1="111.1" x2="316.2" y2="108.0"/><polygon class="ah" points="329.5,103.7 313.8,100.7 318.5,115.3"/><text class="t" x="500.0" y="286.0" text-anchor="middle" font-size="22"><tspan x="500.0" dy="0.0">Change one thing at</tspan><tspan x="500.0" dy="27.5">a time</tspan></text><rect class="bx" x="395.0" y="37.5" width="210.0" height="84.9" rx="12"/><text class="t" x="500.0" y="67.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Observe</tspan></text><text class="n" x="500.0" y="90.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">symptoms, metrics, logs,</tspan><tspan x="500.0" dy="16.9">changes</tspan></text><circle class="bc" cx="399.0" cy="41.5" r="13"/><text class="bn" x="399.0" y="47.0" text-anchor="middle" font-size="16">1</text><rect class="bx" x="706.8" y="146.0" width="210.0" height="68.0" rx="12"/><text class="t" x="811.8" y="175.4" text-anchor="middle" font-size="17"><tspan x="811.8" dy="0.0">Hypothesise</tspan></text><text class="n" x="811.8" y="199.0" text-anchor="middle" font-size="13"><tspan x="811.8" dy="0.0">one most likely cause</tspan></text><circle class="bc" cx="710.8" cy="150.0" r="13"/><text class="bn" x="710.8" y="155.5" text-anchor="middle" font-size="16">2</text><rect class="bx" x="706.8" y="346.0" width="210.0" height="68.0" rx="12"/><text class="t" x="811.8" y="375.4" text-anchor="middle" font-size="17"><tspan x="811.8" dy="0.0">Test</tspan></text><text class="n" x="811.8" y="399.0" text-anchor="middle" font-size="13"><tspan x="811.8" dy="0.0">one command, one change</tspan></text><circle class="bc" cx="710.8" cy="350.0" r="13"/><text class="bn" x="710.8" y="355.5" text-anchor="middle" font-size="16">3</text><rect class="bx" x="395.0" y="446.0" width="210.0" height="68.0" rx="12"/><text class="t" x="500.0" y="475.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Fix</tspan></text><text class="n" x="500.0" y="499.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">smallest safe change</tspan></text><circle class="bc" cx="399.0" cy="450.0" r="13"/><text class="bn" x="399.0" y="455.5" text-anchor="middle" font-size="16">4</text><rect class="bx" x="83.2" y="346.0" width="210.0" height="68.0" rx="12"/><text class="t" x="188.2" y="375.5" text-anchor="middle" font-size="17"><tspan x="188.2" dy="0.0">Verify</tspan></text><text class="n" x="188.2" y="399.0" text-anchor="middle" font-size="13"><tspan x="188.2" dy="0.0">is the symptom gone?</tspan></text><circle class="bc" cx="87.2" cy="350.0" r="13"/><text class="bn" x="87.2" y="355.5" text-anchor="middle" font-size="16">5</text><rect class="bx" x="83.2" y="146.0" width="210.0" height="68.0" rx="12"/><text class="t" x="188.2" y="175.4" text-anchor="middle" font-size="17"><tspan x="188.2" dy="0.0">Document</tspan></text><text class="n" x="188.2" y="199.0" text-anchor="middle" font-size="13"><tspan x="188.2" dy="0.0">cause and prevention</tspan></text><circle class="bc" cx="87.2" cy="150.0" r="13"/><text class="bn" x="87.2" y="155.5" text-anchor="middle" font-size="16">6</text></svg>