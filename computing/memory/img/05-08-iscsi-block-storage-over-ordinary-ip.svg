<svg class="dg" viewBox="0 0 1000 534" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Everything rides on TCP port 3260; CHAP proves the initiator&#x27;s identity before any disk I/O.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="527.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="527.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Initiator (host)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Target portal</tspan><tspan x="890.0" dy="22.5">:3260</tspan></text></g><text class="n ml" x="500.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">1. TCP connect + Login (discovery)</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="879.0" y2="122.5"/><polygon class="ah" points="890.0,122.5 879.0,116.5 879.0,128.6"/><text class="n ml" x="500.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Text: SendTargets=All</tspan></text><line class="ln" x1="110.0" y1="167.5" x2="879.0" y2="167.5"/><polygon class="ah" points="890.0,167.5 879.0,161.4 879.0,173.6"/><text class="n ml" x="500.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. TargetName=iqn.2026-03…:vol1</tspan></text><line class="ln lnd" x1="890.0" y1="212.5" x2="121.0" y2="212.5"/><polygon class="ah" points="110.0,212.5 121.0,218.6 121.0,206.4"/><text class="n ml" x="500.0" y="245.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. Login (normal session, CHAP)</tspan></text><line class="ln" x1="110.0" y1="257.5" x2="879.0" y2="257.5"/><polygon class="ah" points="890.0,257.5 879.0,251.4 879.0,263.6"/><text class="n ml" x="500.0" y="290.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. CHAP challenge</tspan></text><line class="ln lnd" x1="890.0" y1="302.5" x2="121.0" y2="302.5"/><polygon class="ah" points="110.0,302.5 121.0,308.6 121.0,296.4"/><text class="n ml" x="500.0" y="335.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. CHAP response</tspan></text><line class="ln" x1="110.0" y1="347.5" x2="879.0" y2="347.5"/><polygon class="ah" points="890.0,347.5 879.0,341.4 879.0,353.6"/><text class="n ml" x="500.0" y="380.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. Login accepted</tspan></text><line class="ln lnd" x1="890.0" y1="392.5" x2="121.0" y2="392.5"/><polygon class="ah" points="110.0,392.5 121.0,398.6 121.0,386.4"/><text class="n ml" x="500.0" y="425.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. SCSI Command PDU: READ(10)</tspan></text><line class="ln" x1="110.0" y1="437.5" x2="879.0" y2="437.5"/><polygon class="ah" points="890.0,437.5 879.0,431.4 879.0,443.6"/><text class="n ml" x="500.0" y="470.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">9. Data-In PDU + status GOOD</tspan></text><line class="ln lnd" x1="890.0" y1="482.5" x2="121.0" y2="482.5"/><polygon class="ah" points="110.0,482.5 121.0,488.6 121.0,476.4"/></svg>