<svg class="dg" viewBox="0 0 1000 278" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each step up — more channels, faster DRAM, then stacked HBM — multiplies bandwidth.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">DDR4-3200, 2 ch (PC)</tspan></text><rect class="bfill" x="280" y="14.0" width="63.8" height="28" rx="6"/><text class="n" x="353.8" y="33.0" text-anchor="start" font-size="15"><tspan x="353.8" dy="0.0">51 GB/s</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">DDR5-5600, 2 ch (PC)</tspan></text><rect class="bfill" x="280" y="64.0" width="115.4" height="28" rx="6"/><text class="n" x="405.4" y="83.0" text-anchor="start" font-size="15"><tspan x="405.4" dy="0.0">90 GB/s</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">DDR5-6400, 12 ch (server)</tspan></text><rect class="bfill" x="280" y="114.0" width="293.1" height="28" rx="6"/><text class="n" x="583.1" y="133.0" text-anchor="start" font-size="15"><tspan x="583.1" dy="0.0">614 GB/s</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">H100 SXM (HBM3)</tspan></text><rect class="bfill" x="280" y="164.0" width="449.7" height="28" rx="6"/><text class="n" x="739.7" y="183.0" text-anchor="start" font-size="15"><tspan x="739.7" dy="0.0">3.35 TB/s</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">B200 (HBM3E)</tspan></text><rect class="bfill" x="280" y="214.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="233.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">8 TB/s</tspan></text><text class="n" x="996.0" y="268.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>