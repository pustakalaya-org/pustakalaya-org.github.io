<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Controllers and drives are only the start; the software features are what customers pay for.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="111.0"/><line class="ln" x1="567.1" y1="251.0" x2="684.1" y2="183.0"/><line class="ln" x1="620.0" y1="290.0" x2="770.0" y2="290.0"/><line class="ln" x1="567.1" y1="329.0" x2="687.8" y2="399.2"/><line class="ln" x1="500.0" y1="331.5" x2="500.0" y2="469.0"/><line class="ln" x1="432.9" y1="329.0" x2="297.6" y2="407.6"/><line class="ln" x1="380.0" y1="290.0" x2="230.0" y2="290.0"/><line class="ln" x1="432.9" y1="251.0" x2="312.2" y2="180.8"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Data reduction</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">dedupe + compression</tspan></text><rect class="bx" x="665.2" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="765.2" y="120.7" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Snapshots &amp;</tspan><tspan x="765.2" dy="21.2">clones</tspan></text><text class="n" x="765.2" y="165.5" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">instant, space-efficient</tspan></text><rect class="bx" x="775.0" y="247.6" width="200.0" height="84.9" rx="12"/><text class="t" x="875.0" y="277.0" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Replication</tspan></text><text class="n" x="875.0" y="300.6" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">sync / async /</tspan><tspan x="875.0" dy="16.9">active-active</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Multi-protocol</tspan></text><text class="n" x="765.2" y="454.7" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">FC, iSCSI, NVMe-oF, NFS,</tspan><tspan x="765.2" dy="16.9">SMB, S3</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">QoS</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">IOPS / MB/s limits</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Encryption</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">SEDs or software, KMIP</tspan></text><rect class="bx" x="25.0" y="236.9" width="200.0" height="106.2" rx="12"/><text class="t" x="125.0" y="266.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Ransomware</tspan><tspan x="125.0" dy="21.2">detection</tspan></text><text class="n" x="125.0" y="311.2" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">anomaly alerts, safe</tspan><tspan x="125.0" dy="16.9">snapshots</tspan></text><rect class="bx" x="134.8" y="93.4" width="200.0" height="84.9" rx="12"/><text class="t" x="234.8" y="122.9" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Cloud analytics</tspan></text><text class="n" x="234.8" y="146.4" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">telemetry, predictive</tspan><tspan x="234.8" dy="16.9">support</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Array OS</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">dual controllers</tspan></text></svg>