<svg class="dg" viewBox="0 0 1000 478" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Log scale: each tier is roughly 3x to 1,000x slower than the one above it (approximate 2026 values).</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Register</tspan></text><rect class="bfill" x="280" y="14.0" width="13.7" height="28" rx="6"/><text class="n" x="303.7" y="33.0" text-anchor="start" font-size="15"><tspan x="303.7" dy="0.0">~0.3 ns</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">L1 cache</tspan></text><rect class="bfill" x="280" y="64.0" width="37.6" height="28" rx="6"/><text class="n" x="327.6" y="83.0" text-anchor="start" font-size="15"><tspan x="327.6" dy="0.0">~1 ns</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">L2 cache</tspan></text><rect class="bfill" x="280" y="114.0" width="65.1" height="28" rx="6"/><text class="n" x="355.1" y="133.0" text-anchor="start" font-size="15"><tspan x="355.1" dy="0.0">~4 ns</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">L3 cache</tspan></text><rect class="bfill" x="280" y="164.0" width="91.3" height="28" rx="6"/><text class="n" x="381.3" y="183.0" text-anchor="start" font-size="15"><tspan x="381.3" dy="0.0">~10-20 ns</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">DRAM</tspan></text><rect class="bfill" x="280" y="214.0" width="129.0" height="28" rx="6"/><text class="n" x="419.0" y="233.0" text-anchor="start" font-size="15"><tspan x="419.0" dy="0.0">~80-120 ns</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">CXL memory</tspan></text><rect class="bfill" x="280" y="264.0" width="147.1" height="28" rx="6"/><text class="n" x="437.1" y="283.0" text-anchor="start" font-size="15"><tspan x="437.1" dy="0.0">~200-300 ns</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">NVMe SSD read</tspan></text><rect class="bfill" x="280" y="314.0" width="261.6" height="28" rx="6"/><text class="n" x="551.6" y="333.0" text-anchor="start" font-size="15"><tspan x="551.6" dy="0.0">~50-100 µs</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">HDD read</tspan></text><rect class="bfill" x="280" y="364.0" width="353.0" height="28" rx="6"/><text class="n" x="643.0" y="383.0" text-anchor="start" font-size="15"><tspan x="643.0" dy="0.0">~5-10 ms</tspan></text><text class="t" x="266.0" y="433.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Tape (load + seek)</tspan></text><rect class="bfill" x="280" y="414.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="433.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~1 min+</tspan></text><text class="n" x="996.0" y="468.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>