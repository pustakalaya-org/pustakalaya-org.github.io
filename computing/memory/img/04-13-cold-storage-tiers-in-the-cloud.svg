<svg class="dg" viewBox="0 0 1000 338" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Archive tiers cost about 1/20th of standard storage — before retrieval fees.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">S3 Standard</tspan></text><rect class="bfill" x="280" y="14.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="33.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~$23</tspan></text><text class="t" x="266.0" y="80.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">S3 Glacier Instant</tspan><tspan x="266.0" dy="20.0">Retrieval</tspan></text><rect class="bfill" x="280" y="71.0" width="92.2" height="28" rx="6"/><text class="n" x="382.2" y="90.0" text-anchor="start" font-size="15"><tspan x="382.2" dy="0.0">~$4</tspan></text><text class="t" x="266.0" y="144.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">S3 Glacier Flexible</tspan><tspan x="266.0" dy="20.0">Retrieval</tspan></text><rect class="bfill" x="280" y="135.0" width="83.0" height="28" rx="6"/><text class="n" x="373.0" y="154.0" text-anchor="start" font-size="15"><tspan x="373.0" dy="0.0">~$3.60</tspan></text><text class="t" x="266.0" y="211.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Google Cloud Archive</tspan></text><rect class="bfill" x="280" y="192.0" width="27.7" height="28" rx="6"/><text class="n" x="317.7" y="211.0" text-anchor="start" font-size="15"><tspan x="317.7" dy="0.0">~$1.20</tspan></text><text class="t" x="266.0" y="261.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Azure Archive (LRS)</tspan></text><rect class="bfill" x="280" y="242.0" width="22.8" height="28" rx="6"/><text class="n" x="312.8" y="261.0" text-anchor="start" font-size="15"><tspan x="312.8" dy="0.0">~$1</tspan></text><text class="t" x="266.0" y="311.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">S3 Glacier Deep Archive</tspan></text><rect class="bfill" x="280" y="292.0" width="22.8" height="28" rx="6"/><text class="n" x="312.8" y="311.0" text-anchor="start" font-size="15"><tspan x="312.8" dy="0.0">~$0.99</tspan></text></svg>