<svg class="dg" viewBox="0 0 1000 328" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Approximate sustained reads; the link, not the SSD, usually sets the ceiling.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USB 2.0 (480 Mbps)</tspan></text><rect class="bfill" x="280" y="14.0" width="63.3" height="28" rx="6"/><text class="n" x="353.3" y="33.0" text-anchor="start" font-size="15"><tspan x="353.3" dy="0.0">~40 MB/s</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USB 5Gbps</tspan></text><rect class="bfill" x="280" y="64.0" width="281.0" height="28" rx="6"/><text class="n" x="571.0" y="83.0" text-anchor="start" font-size="15"><tspan x="571.0" dy="0.0">~430 MB/s</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USB 10Gbps</tspan></text><rect class="bfill" x="280" y="114.0" width="362.9" height="28" rx="6"/><text class="n" x="652.9" y="133.0" text-anchor="start" font-size="15"><tspan x="652.9" dy="0.0">~1,050 MB/s</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USB 20Gbps</tspan></text><rect class="bfill" x="280" y="164.0" width="421.9" height="28" rx="6"/><text class="n" x="711.9" y="183.0" text-anchor="start" font-size="15"><tspan x="711.9" dy="0.0">~2,000 MB/s</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USB4 / TB4 40Gbps</tspan></text><rect class="bfill" x="280" y="214.0" width="480.8" height="28" rx="6"/><text class="n" x="770.8" y="233.0" text-anchor="start" font-size="15"><tspan x="770.8" dy="0.0">~3,800 MB/s</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">TB5 / USB4 v2 80Gbps</tspan></text><rect class="bfill" x="280" y="264.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="283.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~6,000+ MB/s</tspan></text><text class="n" x="996.0" y="318.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>