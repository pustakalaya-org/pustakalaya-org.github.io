<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each layer is how a different part of the system likes to move data.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="35.0" r="15"/><text class="bn" x="34.0" y="40.5" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="42.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Bit</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="54.0"/><text class="n" x="350.0" y="40.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">one 0 or 1</tspan></text><rect x="2" y="74.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.13;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="105.0" r="15"/><text class="bn" x="34.0" y="110.5" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="112.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Byte — 8 bits</tspan></text><line class="sep" x1="330.0" y1="86.0" x2="330.0" y2="124.0"/><text class="n" x="350.0" y="110.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">smallest addressable unit</tspan></text><rect x="2" y="144.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.19;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="175.0" r="15"/><text class="bn" x="34.0" y="180.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="182.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Word — 8 bytes</tspan></text><line class="sep" x1="330.0" y1="156.0" x2="330.0" y2="194.0"/><text class="n" x="350.0" y="180.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">64-bit register size</tspan></text><rect x="2" y="214.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="245.0" r="15"/><text class="bn" x="34.0" y="250.5" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="252.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Cache line — 64 B</tspan></text><line class="sep" x1="330.0" y1="226.0" x2="330.0" y2="264.0"/><text class="n" x="350.0" y="250.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">unit caches move</tspan></text><rect x="2" y="284.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.29;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="321.5" r="15"/><text class="bn" x="34.0" y="327.0" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="316.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Sector — 512 B / 4</tspan><tspan x="64.0" dy="25.0">KiB</tspan></text><line class="sep" x1="330.0" y1="296.0" x2="330.0" y2="347.0"/><text class="n" x="350.0" y="327.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">drive&#x27;s physical unit</tspan></text><rect x="2" y="367.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.35;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="398.0" r="15"/><text class="bn" x="34.0" y="403.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="405.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Page — 4 KiB</tspan></text><line class="sep" x1="330.0" y1="379.0" x2="330.0" y2="417.0"/><text class="n" x="350.0" y="403.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">OS memory unit</tspan></text><rect x="2" y="437.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="474.5" r="15"/><text class="bn" x="34.0" y="480.0" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="469.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Huge page — 2 MiB /</tspan><tspan x="64.0" dy="25.0">1 GiB</tspan></text><line class="sep" x1="330.0" y1="449.0" x2="330.0" y2="500.0"/><text class="n" x="350.0" y="480.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">fewer TLB entries</tspan></text></svg>