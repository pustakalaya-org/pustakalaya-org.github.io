<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each socket reaches its own DIMMs directly; remote memory costs an extra hop across the socket link.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="717.5" y2="420.2"/><line class="ln" x1="851.9" y1="198.8" x2="282.5" y2="420.2"/><line class="ln" x1="500.0" y1="62.0" x2="851.9" y2="198.8"/><line class="ln" x1="500.0" y1="62.0" x2="148.1" y2="198.8"/><rect class="lbg" x="530.7" y="228.1" width="156" height="23.0" rx="6"/><text class="n" x="608.7" y="243.1" text-anchor="middle" font-size="13"><tspan x="608.7" dy="0.0">local</tspan></text><rect class="lbg" x="489.2" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="567.2" y="311.5" text-anchor="middle" font-size="13"><tspan x="567.2" dy="0.0">local</tspan></text><rect class="lbg" x="597.9" y="117.4" width="156" height="23.0" rx="6"/><text class="n" x="675.9" y="132.4" text-anchor="middle" font-size="13"><tspan x="675.9" dy="0.0">UPI / Infinity Fabric</tspan></text><rect class="lbg" x="246.1" y="117.4" width="156" height="23.0" rx="6"/><text class="n" x="324.1" y="132.4" text-anchor="middle" font-size="13"><tspan x="324.1" dy="0.0">CXL link</tspan></text><rect class="bxa" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">CPU 0</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">12 memory channels</tspan></text><rect class="bxa" x="766.9" y="165.3" width="170.0" height="67.0" rx="12"/><text class="t" x="851.9" y="193.9" text-anchor="middle" font-size="16"><tspan x="851.9" dy="0.0">CPU 1</tspan></text><text class="n" x="851.9" y="217.3" text-anchor="middle" font-size="13"><tspan x="851.9" dy="0.0">12 memory channels</tspan></text><rect class="bx" x="632.5" y="386.7" width="170.0" height="67.0" rx="12"/><text class="t" x="717.5" y="415.3" text-anchor="middle" font-size="16"><tspan x="717.5" dy="0.0">Node 0 DRAM</tspan></text><text class="n" x="717.5" y="438.7" text-anchor="middle" font-size="13"><tspan x="717.5" dy="0.0">~110 ns local</tspan></text><rect class="bx" x="197.5" y="386.7" width="170.0" height="67.0" rx="12"/><text class="t" x="282.5" y="415.3" text-anchor="middle" font-size="16"><tspan x="282.5" dy="0.0">Node 1 DRAM</tspan></text><text class="n" x="282.5" y="438.7" text-anchor="middle" font-size="13"><tspan x="282.5" dy="0.0">~110 ns local</tspan></text><rect class="bx" x="63.1" y="165.3" width="170.0" height="67.0" rx="12"/><text class="t" x="148.1" y="193.9" text-anchor="middle" font-size="16"><tspan x="148.1" dy="0.0">CXL memory</tspan></text><text class="n" x="148.1" y="217.3" text-anchor="middle" font-size="13"><tspan x="148.1" dy="0.0">extra tier, slower</tspan></text></svg>