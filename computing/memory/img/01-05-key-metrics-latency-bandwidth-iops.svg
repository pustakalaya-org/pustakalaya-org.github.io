<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>No single metric decides; match the metric to the workload.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="235.4" x2="500.0" y2="111.0"/><line class="ln" x1="589.7" y1="237.9" x2="702.4" y2="172.4"/><line class="ln" x1="620.0" y1="290.0" x2="770.0" y2="290.0"/><line class="ln" x1="589.7" y1="342.1" x2="702.4" y2="407.6"/><line class="ln" x1="500.0" y1="344.6" x2="500.0" y2="469.0"/><line class="ln" x1="410.3" y1="342.1" x2="297.6" y2="407.6"/><line class="ln" x1="380.0" y1="290.0" x2="230.0" y2="290.0"/><line class="ln" x1="410.3" y1="237.9" x2="297.6" y2="172.4"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Latency</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">time per request</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Bandwidth</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">GB/s possible</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">IOPS</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">small ops per second</tspan></text><rect class="bx" x="665.2" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="439.6" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Capacity</tspan></text><text class="n" x="765.2" y="463.1" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">GB / TB stored</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Endurance</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">TBW, DWPD</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Reliability</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">AFR, MTBF</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Power</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">watts, pJ per bit</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Cost</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">$ per GB</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Memory / storage</tspan><tspan x="500.0" dy="26.2">device</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">judge it by…</tspan></text></svg>