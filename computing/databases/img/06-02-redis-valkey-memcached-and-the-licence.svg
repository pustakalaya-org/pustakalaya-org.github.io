<svg class="dg" viewBox="0 0 1000 184" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Licence changes split one community into two compatible projects.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="63.7" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">2009 · Redis created</tspan></text><text class="n" x="70.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Salvatore Sanfilippo, BSD</tspan></text><circle class="dot" cx="192.9" cy="107.2" r="9"/><line class="ln" x1="192.9" y1="116.2" x2="192.9" y2="127.2"/><text class="t" x="192.9" y="147.7" text-anchor="middle" font-size="17"><tspan x="192.9" dy="0.0">2015 · Redis Labs</tspan></text><text class="n" x="192.9" y="169.2" text-anchor="middle" font-size="13"><tspan x="192.9" dy="0.0">company sponsors Redis</tspan></text><circle class="dot" cx="315.7" cy="107.2" r="9"/><line class="ln" x1="315.7" y1="98.2" x2="315.7" y2="89.2"/><text class="t" x="315.7" y="42.5" text-anchor="middle" font-size="17"><tspan x="315.7" dy="0.0">2018 · Modules</tspan><tspan x="315.7" dy="21.2">relicensed</tspan></text><text class="n" x="315.7" y="85.2" text-anchor="middle" font-size="13"><tspan x="315.7" dy="0.0">core stays BSD</tspan></text><circle class="dot" cx="438.6" cy="107.2" r="9"/><line class="ln" x1="438.6" y1="116.2" x2="438.6" y2="127.2"/><text class="t" x="438.6" y="147.7" text-anchor="middle" font-size="17"><tspan x="438.6" dy="0.0">Mar 2024 · Redis 7.4</tspan></text><text class="n" x="438.6" y="169.2" text-anchor="middle" font-size="13"><tspan x="438.6" dy="0.0">RSALv2 / SSPL</tspan></text><circle class="dot" cx="561.4" cy="107.2" r="9"/><line class="ln" x1="561.4" y1="98.2" x2="561.4" y2="89.2"/><text class="t" x="561.4" y="63.7" text-anchor="middle" font-size="17"><tspan x="561.4" dy="0.0">Mar 2024 · Valkey fork</tspan></text><text class="n" x="561.4" y="85.2" text-anchor="middle" font-size="13"><tspan x="561.4" dy="0.0">Linux Foundation, BSD</tspan></text><circle class="dot" cx="684.3" cy="107.2" r="9"/><line class="ln" x1="684.3" y1="116.2" x2="684.3" y2="127.2"/><text class="t" x="684.3" y="147.7" text-anchor="middle" font-size="17"><tspan x="684.3" dy="0.0">Sep 2024 · Valkey 8.0</tspan></text><text class="n" x="684.3" y="169.2" text-anchor="middle" font-size="13"><tspan x="684.3" dy="0.0">faster multithreaded I/O</tspan><