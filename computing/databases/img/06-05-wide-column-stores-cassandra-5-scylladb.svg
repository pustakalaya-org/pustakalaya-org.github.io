<svg class="dg" viewBox="0 0 1000 485" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>With three replicas, the client succeeds after two acknowledgements; the third catches up.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="478.8"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="478.8"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="478.8"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="478.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="478.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Client</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">Coordinator</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Replica 1</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Replica 2</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Replica 3</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. INSERT reading,</tspan><tspan x="207.5" dy="18.8">CL=QUORUM</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="402.5" y="151.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. write</tspan></text><line class="ln" x1="305.0" y1="163.8" x2="489.0" y2="163.8"/><polygon class="ah" points="500.0,163.8 489.0,157.7 489.0,169.8"/><text class="n ml" x="500.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. write</tspan></text><line class="ln" x1="305.0" y1="208.8" x2="684.0" y2="208.8"/><polygon class="ah" points="695.0,208.8 684.0,202.7 684.0,214.8"/><text class="n ml" x="597.5" y="241.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">4. write</tspan></text><line class="ln" x1="305.0" y1="253.8" x2="879.0" y2="253.8"/><polygon class="ah" points="890.0,253.8 879.0,247.7 879.0,259.8"/><text class="n ml" x="402.5" y="286.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">5. ack</tspan></text><line class="ln lnd" x1="500.0" y1="298.8" x2="316.0" y2="298.8"/><polygon class="ah" points="305.0,298.8 316.0,304.8 316.0,292.7"/><text class="n ml" x="500.0" y="331.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. ack</tspan></text><line class="ln lnd" x1="695.0" y1="343.8" x2="316.0" y2="343.8"/><polygon class="ah" points="305.0,343.8 316.0,349.8 316.0,337.7"/><text class="n ml" x="207.5" y="376.5" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">7. success (2 of 3)</tspan></text><line class="ln lnd" x1="305.0" y1="388.8" x2="121.0" y2="388.8"/><polygon class="ah" points="110.0,388.8 121.0,394.8 121.0,382.7"/><text class="n ml" x="597.5" y="421.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">8. late ack</tspan></text><line class="ln lnd" x1="890.0" y1="433.8" x2="316.0" y2="433.8"/><polygon class="ah" points="305.0,433.8 316.0,439.8 316.0,427.7"/></svg>