<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Engines share tables safely because every commit goes through the catalog.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="186.3" x2="500.0" y2="111.0"/><line class="ln" x1="619.8" y1="217.2" x2="719.9" y2="189.7"/><line class="ln" x1="619.8" y1="282.8" x2="719.9" y2="310.3"/><line class="ln" x1="500.0" y1="313.7" x2="500.0" y2="389.0"/><line class="ln" x1="380.2" y1="282.8" x2="280.1" y2="310.3"/><line class="ln" x1="380.2" y1="217.2" x2="280.1" y2="189.7"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Spark</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">writes silver</tspan></text><rect class="bx" x="724.8" y="127.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="156.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Flink</tspan></text><text class="n" x="824.8" y="180.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">streams upserts</tspan></text><rect class="bx" x="724.8" y="305.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="334.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Trino</tspan></text><text class="n" x="824.8" y="358.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">ad-hoc SQL</tspan></text><rect class="bx" x="400.0" y="394.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="423.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Snowflake</tspan></text><text class="n" x="500.0" y="447.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">reads gold</tspan></text><rect class="bx" x="75.2" y="294.4" width="200.0" height="89.2" rx="12"/><text class="t" x="175.2" y="323.8" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">DuckDB /</tspan><tspan x="175.2" dy="21.2">PyIceberg</tspan></text><text class="n" x="175.2" y="368.6" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">laptop analysis</tspan></text><rect class="bx" x="75.2" y="127.0" width="200.0" height="68.0" rx="12"/><text class="t" x="175.2" y="156.4" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Object storage</tspan></text><text class="n" x="175.2" y="180.0" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">Parquet + metadata</tspan></text><rect class="bxa" x="385.0" y="191.3" width="230.0" height="117.5" rx="12"/><text class="t" x="500.0" y="224.1" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Iceberg REST</tspan><tspan x="500.0" dy="26.2">catalog</tspan></text><text class="n" x="500.0" y="275.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">tables, commits, access</tspan><tspan x="500.0" dy="18.2">control</tspan></text></svg>