<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each job would otherwise have to be rewritten inside every application.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="567.1" y1="251.0" x2="692.8" y2="177.9"/><polygon class="ah" points="702.4,172.4 689.8,172.7 695.9,183.1"/><line class="ln" x1="620.0" y1="290.0" x2="759.0" y2="290.0"/><polygon class="ah" points="770.0,290.0 759.0,283.9 759.0,296.1"/><line class="ln" x1="567.1" y1="329.0" x2="678.3" y2="393.7"/><polygon class="ah" points="687.8,399.2 681.4,388.4 675.3,398.9"/><line class="ln" x1="500.0" y1="331.5" x2="500.0" y2="458.0"/><polygon class="ah" points="500.0,469.0 506.1,458.0 493.9,458.0"/><line class="ln" x1="432.9" y1="329.0" x2="307.2" y2="402.1"/><polygon class="ah" points="297.6,407.6 310.2,407.3 304.1,396.9"/><line class="ln" x1="380.0" y1="290.0" x2="241.0" y2="290.0"/><polygon class="ah" points="230.0,290.0 241.0,296.1 241.0,283.9"/><line class="ln" x1="432.9" y1="251.0" x2="325.4" y2="188.5"/><polygon class="ah" points="315.9,183.0 322.4,193.7 328.5,183.3"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Storage</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">pages and files on disk</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Query language</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">SQL parsing and planning</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Concurrency</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">many users, no clashes</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Recovery</tspan></text><text class="n" x="765.2" y="454.7" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">write-ahead log after</tspan><tspan x="765.2" dy="16.9">crashes</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Security</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">logins, roles, privileges</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Integrity</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">constraints and types</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Catalogue</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">data dictionary of schemas</tspan></text><rect class="bx" x="134.8" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="234.8" y="120.7" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Backup &amp;</tspan><tspan x="234.8" dy="21.2">replication</tspan></text><text class="n" x="234.8" y="165.5" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">copies elsewhere</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">DBMS</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">e.g. PostgreSQL</tspan></text></svg>