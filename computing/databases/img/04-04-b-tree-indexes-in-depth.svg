<svg class="dg" viewBox="0 0 1000 328" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Inner pages only guide the search; all keys and row pointers live in linked leaves.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Root</tspan></text><line class="ln" x1="572.0" y1="70.0" x2="346.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="572.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="798.0" y2="145.0"/><text class="lab" x="4.0" y="173.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Inner pages</tspan></text><line class="ln" x1="346.0" y1="191.0" x2="213.7" y2="271.0"/><line class="ln" x1="346.0" y1="191.0" x2="357.0" y2="271.0"/><line class="ln" x1="572.0" y1="191.0" x2="500.3" y2="271.0"/><line class="ln" x1="572.0" y1="191.0" x2="643.7" y2="271.0"/><line class="ln" x1="798.0" y1="191.0" x2="787.0" y2="271.0"/><line class="ln" x1="798.0" y1="191.0" x2="930.3" y2="271.0"/><text class="lab" x="4.0" y="290.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Leaf pages</tspan><tspan x="4.0" dy="17.5">(linked →)</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">&lt; 500 | 500-999 | ≥</tspan><tspan x="572.0" dy="20.0">1000</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">&lt; 200 | 200-499</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">500-749 | 750-999</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">1000-1399 | ≥ 1400</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="150.0" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="213.7" y="5.6" text-anchor="middle" font-size="16"><tspan x="213.7" dy="0.0">1-199</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="293.3" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="357.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="357.0" dy="0.0">200-499</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="436.7" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="500.3" y="5.6" text-anchor="middle" font-size="16"><tspan x="500.3" dy="0.0">500-749</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="580.0" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="643.7" y="5.6" text-anchor="middle" font-size="16"><tspan x="643.7" dy="0.0">750-999</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="723.3" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="787.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="787.0" dy="0.0">1000-1399</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="866.7" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="930.3" y="5.6" text-anchor="middle" font-size="16"><tspan x="930.3" dy="0.0">1400+</tspan></text></g></svg>