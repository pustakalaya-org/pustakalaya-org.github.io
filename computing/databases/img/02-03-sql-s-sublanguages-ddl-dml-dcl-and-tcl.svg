<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Some books add DQL for SELECT alone; most treat SELECT as DML.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="208.5" x2="500.0" y2="130.4"/><polygon class="ah" points="500.0,119.5 493.9,130.4 506.1,130.4"/><line class="ln" x1="620.0" y1="250.0" x2="759.0" y2="250.0"/><polygon class="ah" points="770.0,250.0 759.0,243.9 759.0,256.1"/><line class="ln" x1="500.0" y1="291.5" x2="500.0" y2="378.0"/><polygon class="ah" points="500.0,389.0 506.1,378.0 493.9,378.0"/><line class="ln" x1="380.0" y1="250.0" x2="241.0" y2="250.0"/><polygon class="ah" points="230.0,250.0 241.0,256.1 241.0,244.0"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">DDL</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">CREATE, ALTER, DROP,</tspan><tspan x="500.0" dy="16.9">TRUNCATE</tspan></text><rect class="bx" x="775.0" y="207.6" width="200.0" height="84.9" rx="12"/><text class="t" x="875.0" y="237.0" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">DML</tspan></text><text class="n" x="875.0" y="260.6" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">SELECT, INSERT, UPDATE,</tspan><tspan x="875.0" dy="16.9">DELETE, MERGE</tspan></text><rect class="bx" x="400.0" y="394.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="423.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">DCL</tspan></text><text class="n" x="500.0" y="447.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">GRANT, REVOKE</tspan></text><rect class="bx" x="25.0" y="207.6" width="200.0" height="84.9" rx="12"/><text class="t" x="125.0" y="237.0" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">TCL</tspan></text><text class="n" x="125.0" y="260.6" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">BEGIN, COMMIT, ROLLBACK,</tspan><tspan x="125.0" dy="16.9">SAVEPOINT</tspan></text><rect class="bxa" x="385.0" y="213.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="246.3" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">SQL</tspan></text><text class="n" x="500.0" y="271.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">ISO/IEC 9075</tspan></text></svg>