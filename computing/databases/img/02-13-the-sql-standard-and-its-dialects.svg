<svg class="dg" viewBox="0 0 1000 195" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each edition added features; vendors adopt them years apart.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="102.2" x2="980.0" y2="102.2"/><circle class="dot" cx="70.0" cy="102.2" r="9"/><line class="ln" x1="70.0" y1="93.2" x2="70.0" y2="84.2"/><text class="t" x="70.0" y="58.7" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1986 · SQL-86</tspan></text><text class="n" x="70.0" y="80.2" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">first ANSI standard</tspan></text><circle class="dot" cx="165.6" cy="102.2" r="9"/><line class="ln" x1="165.6" y1="111.2" x2="165.6" y2="122.2"/><text class="t" x="165.6" y="142.7" text-anchor="middle" font-size="17"><tspan x="165.6" dy="0.0">1992 · SQL-92</tspan></text><text class="n" x="165.6" y="164.2" text-anchor="middle" font-size="13"><tspan x="165.6" dy="0.0">JOIN syntax, CASE, CAST</tspan></text><circle class="dot" cx="261.1" cy="102.2" r="9"/><line class="ln" x1="261.1" y1="93.2" x2="261.1" y2="84.2"/><text class="t" x="261.1" y="42.5" text-anchor="middle" font-size="17"><tspan x="261.1" dy="0.0">1999 · SQL:1999</tspan></text><text class="n" x="261.1" y="64.0" text-anchor="middle" font-size="13"><tspan x="261.1" dy="0.0">recursive CTEs, triggers,</tspan><tspan x="261.1" dy="16.2">ROLLUP</tspan></text><circle class="dot" cx="356.7" cy="102.2" r="9"/><line class="ln" x1="356.7" y1="111.2" x2="356.7" y2="122.2"/><text class="t" x="356.7" y="142.7" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">2003 · SQL:2003</tspan></text><text class="n" x="356.7" y="164.2" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">window functions, MERGE,</tspan><tspan x="356.7" dy="16.2">XML</tspan></text><circle class="dot" cx="452.2" cy="102.2" r="9"/><line class="ln" x1="452.2" y1="93.2" x2="452.2" y2="84.2"/><text class="t" x="452.2" y="58.7" text-anchor="middle" font-size="17"><tspan x="452.2" dy="0.0">2008 · SQL:2008</tspan></text><text class="n" x="452.2" y="80.2" text-anchor="middle" font-size="13"><tspan x="452.2" dy="0.0">FETCH FIRST, TRUNCATE</tspan></text><circle class="dot" cx="547.8" cy="102.2" r="9"/><line class="ln" x1="547.8" y1="111.2" x2="547.8" y2="122.2"/><text class="t" x="547.8" y="142.7" text-anchor="middle" font-size="17"><tspan x="547.8" dy="0.0">2011 · SQL:2011</tspan></text><text class="n" x="547.8" y="164.2" text-anchor="middle" font-size="13"><tspan x="547.8" dy="0.0">temporal tables</tspan></text><circle class="dot" cx="643.3" cy="102.2" r="9"/><line class="ln" x1="643.3" y1="93.2" x2="643.3" y2="84.2"/><text class="t" x="643.3" y="42.5" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">2016 · SQL:2016</tspan></text><text class="n" x="643.3" y="64.0" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">JSON, row pattern</tspan><tspan x="643.3" dy="16.2">matching</tspan></text><circle class="dot" cx="738.9" cy="102.2" r="9"/><line class="ln" x1="738.9" y1="111.2" x2="738.9" y2="122.2"/><text class="t" x="738.9" y="142.7" text-anchor="middle" font-size="17"><tspan x="738.9" dy="0.0">2019 · Part 15</tspan></text><text class="n" x="738.9" y="164.2" text-anchor="middle" font-size="13"><tspan x="738.9" dy="0.0">multidimensional arrays</tspan></text><circle class="dot" cx="834.4" cy="102.2" r="9"/><line class="ln" x1="834.4" y1="93.2" x2="834.4" y2="84.2"/><text class="t" x="834.4" y="42.5" text-anchor="middle" font-size="17"><tspan x="834.4" dy="0.0">2023 · SQL:2023</tspan></text><text class="n" x="834.4" y="64.0" text-anchor="middle" font-size="13"><tspan x="834.4" dy="0.0">property graphs, JSON</tspan><tspan x="834.4" dy="16.2">type</tspan></text><circle class="dot" cx="930.0" cy="102.2" r="9"/><line class="ln" x1="930.0" y1="111.2" x2="930.0" y2="122.2"/><text class="t" x="930.0" y="142.7" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">Next edition</tspan></text><text class="n" x="930.0" y="164.2" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">drafting; vectors</tspan><tspan x="930.0" dy="16.2">proposed</tspan></text></svg>