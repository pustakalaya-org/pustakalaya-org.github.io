<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>No single source explains an incident; correlating them is what makes a system observable.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="119.5" x2="500.0" y2="224.4"/><polygon class="ah" points="500.0,235.4 506.1,224.4 493.9,224.4"/><line class="ln" x1="715.3" y1="190.2" x2="621.6" y2="233.6"/><polygon class="ah" points="611.6,238.3 624.1,239.1 619.0,228.2"/><line class="ln" x1="760.6" y1="324.6" x2="630.9" y2="307.4"/><polygon class="ah" points="620.0,305.9 630.1,313.4 631.7,301.4"/><line class="ln" x1="631.4" y1="448.6" x2="551.3" y2="351.9"/><polygon class="ah" points="544.3,343.5 546.7,355.8 556.0,348.1"/><line class="ln" x1="377.5" y1="437.9" x2="448.7" y2="351.9"/><polygon class="ah" points="455.7,343.5 444.0,348.1 453.3,355.8"/><line class="ln" x1="239.4" y1="324.6" x2="369.1" y2="307.4"/><polygon class="ah" points="380.0,305.9 368.3,301.4 369.9,313.4"/><line class="ln" x1="284.7" y1="190.2" x2="378.4" y2="233.6"/><polygon class="ah" points="388.4,238.3 381.0,228.2 375.9,239.1"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Statistics views</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">pg_stat_*, DMVs,</tspan><tspan x="500.0" dy="16.9">performance_schema</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">OS metrics</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">CPU, memory, disk I/O</tspan></text><rect class="bx" x="765.6" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="865.6" y="325.5" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Database logs</tspan></text><text class="n" x="865.6" y="349.1" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">errors, slow queries,</tspan><tspan x="865.6" dy="16.9">deadlocks</tspan></text><rect class="bx" x="562.7" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="662.7" y="481.9" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Query samples</tspan></text><text class="n" x="662.7" y="505.4" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">plans and wait events</tspan></text><rect class="bx" x="237.3" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="337.3" y="471.2" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Replication</tspan><tspan x="337.3" dy="21.2">status</tspan></text><text class="n" x="337.3" y="516.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">lag, slots, replica health</tspan></text><rect class="bx" x="34.4" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="134.4" y="325.5" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">App traces</tspan></text><text class="n" x="134.4" y="349.1" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">OpenTelemetry database</tspan><tspan x="134.4" dy="16.9">spans</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Cloud metrics</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">CloudWatch, Azure Monitor</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Monitoring</tspan><tspan x="500.0" dy="26.2">platform</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">dashboards + alerts</tspan></text></svg>