<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Multi-model databases expose several data models over shared storage, indexes and replication.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="226.3" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="619.5" y1="234.6" x2="705.3" y2="194.8"/><polygon class="ah" points="715.3,190.2 702.8,189.3 707.9,200.3"/><line class="ln" x1="620.0" y1="305.9" x2="749.7" y2="323.1"/><polygon class="ah" points="760.6,324.6 750.5,317.1 748.9,329.1"/><line class="ln" x1="551.8" y1="352.6" x2="624.3" y2="440.1"/><polygon class="ah" points="631.4,448.6 629.0,436.2 619.7,443.9"/><line class="ln" x1="448.2" y1="352.6" x2="375.7" y2="440.1"/><polygon class="ah" points="368.6,448.6 380.3,443.9 371.0,436.2"/><line class="ln" x1="380.0" y1="305.9" x2="250.3" y2="323.1"/><polygon class="ah" points="239.4,324.6 251.1,329.1 249.5,317.1"/><line class="ln" x1="380.5" y1="234.6" x2="294.7" y2="194.8"/><polygon class="ah" points="284.7,190.2 292.1,200.3 297.2,189.3"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Documents</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">JSON collections</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Graph</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">vertices and edges</tspan></text><rect class="bx" x="765.6" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="865.6" y="334.0" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Key-value</tspan></text><text class="n" x="865.6" y="357.5" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">lookup by key</tspan></text><rect class="bx" x="562.7" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="662.7" y="481.9" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Relational / SQL</tspan></text><text class="n" x="662.7" y="505.4" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">tables or SQL-like queries</tspan></text><rect class="bx" x="237.3" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="337.3" y="481.9" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Search</tspan></text><text class="n" x="337.3" y="505.4" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">full-text indexes</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Vectors</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">similarity search</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Time-series</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">in some products</tspan></text><rect class="bxa" x="385.0" y="231.3" width="230.0" height="117.5" rx="12"/><text class="t" x="500.0" y="264.1" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Multi-model</tspan><tspan x="500.0" dy="26.2">engine</tspan></text><text class="n" x="500.0" y="315.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">shared storage &amp;</tspan><tspan x="500.0" dy="18.2">transactions</tspan></text></svg>