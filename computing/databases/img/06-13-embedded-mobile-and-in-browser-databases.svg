<svg class="dg" viewBox="0 0 1000 474" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Apps read and write locally; sync moves changes to the server when a connection exists.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="37.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">App UI</tspan></text><line class="ln" x1="346.0" y1="55.0" x2="346.0" y2="140.0"/><line class="ln" x1="572.0" y1="55.0" x2="572.0" y2="140.0"/><line class="ln" x1="798.0" y1="55.0" x2="798.0" y2="130.0"/><text class="lab" x="4.0" y="168.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Local database</tspan></text><line class="ln" x1="346.0" y1="186.0" x2="572.0" y2="266.0"/><line class="ln" x1="572.0" y1="186.0" x2="572.0" y2="266.0"/><line class="ln" x1="798.0" y1="196.0" x2="572.0" y2="266.0"/><text class="lab" x="4.0" y="304.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Sync layer</tspan></text><line class="ln" x1="572.0" y1="332.0" x2="572.0" y2="402.0"/><text class="lab" x="4.0" y="440.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Server</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">Android app</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">iPad app</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">Web app</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">Room / SQLite</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">SwiftData / SQLite</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="693.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="798.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">IndexedDB or</tspan><tspan x="798.0" dy="20.0">SQLite-Wasm</tspan></text></g><g transform="translate(0,299.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Change queue +</tspan><tspan x="572.0" dy="20.0">conflict rules</tspan></text></g><g transform="translate(0,435.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">PostgreSQL (source</tspan><tspan x="572.0" dy="20.0">of truth)</tspan></text></g></svg>