<svg class="dg" viewBox="0 0 1000 342" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Log scale: each step down the storage hierarchy is roughly ten to a hundred times slower.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">CPU L3 cache</tspan></text><rect class="bfill" x="280" y="14.0" width="23.0" height="28" rx="6"/><text class="n" x="313.0" y="33.0" text-anchor="start" font-size="15"><tspan x="313.0" dy="0.0">~20 ns</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Main memory (DRAM)</tspan></text><rect class="bfill" x="280" y="64.0" width="76.7" height="28" rx="6"/><text class="n" x="366.7" y="83.0" text-anchor="start" font-size="15"><tspan x="366.7" dy="0.0">~100 ns</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">NVMe SSD read</tspan></text><rect class="bfill" x="280" y="114.0" width="307.1" height="28" rx="6"/><text class="n" x="597.1" y="133.0" text-anchor="start" font-size="15"><tspan x="597.1" dy="0.0">~100 µs</tspan></text><text class="t" x="266.0" y="180.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Same-zone network round</tspan><tspan x="266.0" dy="20.0">trip</tspan></text><rect class="bfill" x="280" y="171.0" width="360.7" height="28" rx="6"/><text class="n" x="650.7" y="190.0" text-anchor="start" font-size="15"><tspan x="650.7" dy="0.0">~0.5 ms</tspan></text><text class="t" x="266.0" y="247.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Hard disk seek</tspan></text><rect class="bfill" x="280" y="228.0" width="460.7" height="28" rx="6"/><text class="n" x="750.7" y="247.0" text-anchor="start" font-size="15"><tspan x="750.7" dy="0.0">~10 ms</tspan></text><text class="t" x="266.0" y="297.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Cross-continent round trip</tspan></text><rect class="bfill" x="280" y="278.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="297.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~80 ms</tspan></text><text class="n" x="996.0" y="332.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>