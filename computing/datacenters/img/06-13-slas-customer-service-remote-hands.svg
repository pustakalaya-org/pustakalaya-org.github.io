<svg class="dg" viewBox="0 0 1000 451" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The SLA clock starts when the ticket is logged and stops when the customer is told it is done.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="445.0"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="445.0"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="445.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="445.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Customer</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Portal</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">NOC</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Technician</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Ticket: power-cycle server</tspan><tspan x="240.0" dy="18.8">R12, U20</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Ticket queued, SLA clock</tspan><tspan x="500.0" dy="18.8">starts</tspan></text><line class="ln" x1="370.0" y1="163.8" x2="619.0" y2="163.8"/><polygon class="ah" points="630.0,163.8 619.0,157.7 619.0,169.8"/><text class="n ml" x="760.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. Assign task, check</tspan><tspan x="760.0" dy="18.8">authorisation</tspan></text><line class="ln" x1="630.0" y1="227.5" x2="879.0" y2="227.5"/><polygon class="ah" points="890.0,227.5 879.0,221.4 879.0,233.6"/><text class="n ml" x="760.0" y="260.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. Done in 12 min, photo</tspan><tspan x="760.0" dy="18.8">attached</tspan></text><line class="ln" x1="890.0" y1="291.2" x2="641.0" y2="291.2"/><polygon class="ah" points="630.0,291.2 641.0,297.3 641.0,285.2"/><text class="n ml" x="500.0" y="342.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Ticket resolved</tspan></text><line class="ln" x1="630.0" y1="355.0" x2="381.0" y2="355.0"/><polygon class="ah" points="370.0,355.0 381.0,361.1 381.0,348.9"/><text class="n ml" x="240.0" y="387.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">6. Notification and photo</tspan></text><line class="ln lnd" x1="370.0" y1="400.0" x2="121.0" y2="400.0"/><polygon class="ah" points="110.0,400.0 121.0,406.1 121.0,393.9"/></svg>