<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Electricity-driven carbon dominates for most sites, but the local impacts decide whether a community accepts it.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="235.4" x2="500.0" y2="130.4"/><polygon class="ah" points="500.0,119.5 493.9,130.4 506.1,130.4"/><line class="ln" x1="611.6" y1="238.3" x2="687.1" y2="203.3"/><polygon class="ah" points="697.1,198.6 684.6,197.8 689.6,208.7"/><line class="ln" x1="620.0" y1="305.9" x2="749.7" y2="323.1"/><polygon class="ah" points="760.6,324.6 750.5,317.1 748.9,329.1"/><line class="ln" x1="544.3" y1="343.5" x2="617.3" y2="431.6"/><polygon class="ah" points="624.4,440.1 622.0,427.8 612.7,435.5"/><line class="ln" x1="455.7" y1="343.5" x2="382.7" y2="431.6"/><polygon class="ah" points="375.6,440.1 387.3,435.5 378.0,427.8"/><line class="ln" x1="380.0" y1="305.9" x2="250.3" y2="323.1"/><polygon class="ah" points="239.4,324.6 251.1,329.1 249.5,317.1"/><line class="ln" x1="388.4" y1="238.3" x2="312.9" y2="203.3"/><polygon class="ah" points="302.9,198.6 310.4,208.7 315.4,197.8"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Electricity</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Operational carbon via</tspan><tspan x="500.0" dy="16.9">grid mix</tspan></text><rect class="bx" x="693.2" y="111.6" width="200.0" height="84.9" rx="12"/><text class="t" x="793.2" y="141.1" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Water</tspan></text><text class="n" x="793.2" y="164.6" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">Withdrawal and evaporation</tspan><tspan x="793.2" dy="16.9">for cooling</tspan></text><rect class="bx" x="765.6" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="865.6" y="325.5" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Embodied carbon</tspan></text><text class="n" x="865.6" y="349.1" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">Steel, concrete, servers,</tspan><tspan x="865.6" dy="16.9">batteries</tspan></text><rect class="bx" x="562.7" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="662.7" y="473.4" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Land</tspan></text><text class="n" x="662.7" y="497.0" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">Buildings, substations,</tspan><tspan x="662.7" dy="16.9">buffers</tspan></text><rect class="bx" x="237.3" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="337.3" y="473.4" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Noise</tspan></text><text class="n" x="337.3" y="497.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">Fans, chillers, generator</tspan><tspan x="337.3" dy="16.9">tests</tspan></text><rect class="bx" x="34.4" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="134.4" y="325.5" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Air quality</tspan></text><text class="n" x="134.4" y="349.1" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">Generator exhaust (NOx,</tspan><tspan x="134.4" dy="16.9">particulates)</tspan></text><rect class="bx" x="106.8" y="111.6" width="200.0" height="84.9" rx="12"/><text class="t" x="206.8" y="141.1" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">E-waste</tspan></text><text class="n" x="206.8" y="164.6" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">Hardware refreshed every</tspan><tspan x="206.8" dy="16.9">few years</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Data-centre</tspan><tspan x="500.0" dy="26.2">campus</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">Runs 24/7 for 20+ years</tspan></text></svg>