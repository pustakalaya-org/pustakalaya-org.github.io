<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Signed leases are what turn investor money into buildings; power is usually passed through to tenants.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="89.7" x2="720.1" y2="130.0"/><polygon class="ah" points="730.7,133.3 721.9,124.2 718.4,135.8"/><line class="ln" x1="820.4" y1="302.1" x2="820.4" y2="220.5"/><polygon class="ah" points="820.4,209.5 814.4,220.5 826.5,220.5"/><line class="ln" x1="550.6" y1="411.1" x2="761.8" y2="215.4"/><polygon class="ah" points="769.8,207.9 757.7,210.9 765.9,219.8"/><line class="ln" x1="269.6" y1="161.0" x2="719.4" y2="161.0"/><polygon class="ah" points="730.4,161.0 719.4,154.9 719.4,167.1"/><line class="ln" x1="410.2" y1="430.3" x2="279.9" y2="390.0"/><polygon class="ah" points="269.3,386.7 278.1,395.8 281.6,384.2"/><line class="ln" x1="730.7" y1="133.3" x2="600.3" y2="93.0"/><polygon class="ah" points="589.8,89.7 598.5,98.8 602.1,87.2"/><rect class="lbg" x="582.2" y="98.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="113.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">equity &amp; debt</tspan></text><rect class="lbg" x="742.4" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="820.4" y="262.0" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">rent per kW</tspan></text><rect class="lbg" x="582.2" y="296.5" width="156" height="39.2" rx="6"/><text class="n" x="660.2" y="311.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">rent + cross-connect</tspan><tspan x="660.2" dy="16.2">fees</tspan></text><rect class="lbg" x="422.0" y="148.0" width="156" height="39.2" rx="6"/><text class="n" x="500.0" y="163.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">power (passed</tspan><tspan x="500.0" dy="16.2">through)</tspan></text><rect class="lbg" x="261.8" y="395.5" width="156" height="39.2" rx="6"/><text class="n" x="339.8" y="410.5" text-anchor="middle" font-size="13"><tspan x="339.8" dy="0.0">connect via</tspan><tspan x="339.8" dy="16.2">cross-connects</tspan></text><rect class="lbg" x="582.2" y="98.5" width="156" height="39.2" rx="6"/><text class="n" x="660.2" y="113.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">dividends, asset</tspan><tspan x="660.2" dy="16.2">sales</tspan></text><rect class="bx" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Investors</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">REIT shareholders,</tspan><tspan x="500.0" dy="16.9">funds, banks</tspan></text><rect class="bxa" x="735.4" y="117.5" width="170.0" height="87.0" rx="12"/><text class="t" x="820.4" y="146.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Developer /</tspan><tspan x="820.4" dy="20.0">landlord</tspan></text><text class="n" x="820.4" y="189.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">Builds and operates</tspan></text><rect class="bx" x="735.4" y="307.1" width="170.0" height="103.9" rx="12"/><text class="t" x="820.4" y="335.7" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Hyperscale</tspan><tspan x="820.4" dy="20.0">tenant</tspan></text><text class="n" x="820.4" y="379.1" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">Wholesale lease,</tspan><tspan x="820.4" dy="16.9">10-20 years</tspan></text><rect class="bx" x="415.0" y="414.5" width="170.0" height="87.0" rx="12"/><text class="t" x="500.0" y="443.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Retail</tspan><tspan x="500.0" dy="20.0">customers</tspan></text><text class="n" x="500.0" y="486.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Racks, cages, suites</tspan></text><rect class="bx" x="94.6" y="307.1" width="170.0" height="103.9" rx="12"/><text class="t" x="179.6" y="335.7" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Carriers &amp;</tspan><tspan x="179.6" dy="20.0">clouds</tspan></text><text class="n" x="179.6" y="379.1" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">Interconnection</tspan><tspan x="179.6" dy="16.9">ecosystem</tspan></text><rect class="bx" x="94.6" y="127.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="156.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Utility</tspan></text><text class="n" x="179.6" y="179.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">Grid power</tspan></text></svg>