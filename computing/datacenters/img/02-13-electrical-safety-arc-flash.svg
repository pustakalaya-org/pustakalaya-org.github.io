"163.2" height="174.8" rx="14"/><rect class="bar" x="209.2" y="244.8" width="163.2" height="6" rx="3"/><circle class="bc" cx="235.2" cy="274.8" r="15"/><text class="bn" x="235.2" y="280.2" text-anchor="middle" font-size="16">7</text><text class="t" x="290.8" y="312.9" text-anchor="middle" font-size="19"><tspan x="290.8" dy="0.0">Re-prove</tspan><tspan x="290.8" dy="23.8">tester</tspan></text><text class="n" x="290.8" y="364.5" text-anchor="middle" font-size="15"><tspan x="290.8" dy="0.0">confirm it still</tspan><tspan x="290.8" dy="19.5">works</tspan></text><line class="ln" x1="377.4" y1="332.1" x2="402.4" y2="332.1"/><polygon class="ah" points="413.4,332.1 402.4,326.1 402.4,338.2"/><rect class="bx" x="418.4" y="244.8" width="163.2" height="174.8" rx="14"/><rect class="bar" x="418.4" y="244.8" width="163.2" height="6" rx="3"/><circle class="bc" cx="444.4" cy="274.8" r="15"/><text class="bn" x="444.4" y="280.2" text-anchor="middle" font-size="16">8</text><text class="t" x="500.0" y="312.9" text-anchor="middle" font-size="19"><tspan x="500.0" dy="0.0">Do the work</tspan></text><text class="n" x="500.0" y="340.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">within the</tspan><tspan x="500.0" dy="19.5">approved scope</tspan></text><line class="ln" x1="586.6" y1="332.1" x2="611.6" y2="332.1"/><polygon class="ah" points="622.6,332.1 611.6,326.1 611.6,338.2"/><rect class="bx" x="627.6" y="244.8" width="163.2" height="174.8" rx="14"/><rect class="bar" x="627.6" y="244.8" width="163.2" height="6" rx="3"/><circle class="bc" cx="653.6" cy="274.8" r="15"/><text class="bn" x="653.6" y="280.2" text-anchor="middle" font-size="16">9</text><text class="t" x="709.2" y="312.9" text-anchor="middle" font-size="19"><tspan x="709.2" dy="0.0">Restore</tspan></text><text class="n" x="709.2" y="340.8" text-anchor="middle" font-size="15"><tspan x="709.2" dy="0.0">clear people,</tspan><tspan x="709.2" dy="19.5">remove locks,</tspan><tspan x="709.2" dy="19.5">re-energise</tspan></text></svg>