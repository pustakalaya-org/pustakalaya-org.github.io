<svg class="dg" viewBox="0 0 1000 688" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The whole trip usually takes well under a second, crossing several networks and buildings.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="681.2"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="681.2"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="681.2"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="681.2"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="681.2"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Phone</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">DNS / CDN</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Carrier &amp; IXP</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">DC network</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">App &amp; database</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. DNS query for app</tspan><tspan x="207.5" dy="18.8">domain</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="207.5" y="132.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">2. IP address</tspan><tspan x="207.5" dy="18.8">returned</tspan></text><line class="ln lnd" x1="305.0" y1="163.8" x2="121.0" y2="163.8"/><polygon class="ah" points="110.0,163.8 121.0,169.8 121.0,157.7"/><text class="n ml" x="207.5" y="215.2" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">3. GET map tiles</tspan></text><line class="ln" x1="110.0" y1="227.5" x2="294.0" y2="227.5"/><polygon class="ah" points="305.0,227.5 294.0,221.4 294.0,233.6"/><text class="n ml" x="207.5" y="241.5" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">4. Tiles from edge</tspan><tspan x="207.5" dy="18.8">cache (~15 ms)</tspan></text><line class="ln lnd" x1="305.0" y1="272.5" x2="121.0" y2="272.5"/><polygon class="ah" points="110.0,272.5 121.0,278.6 121.0,266.4"/><text class="n ml" x="305.0" y="324.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">5. TLS + API request</tspan></text><line class="ln" x1="110.0" y1="336.2" x2="489.0" y2="336.2"/><polygon class="ah" points="500.0,336.2 489.0,330.2 489.0,342.3"/><text class="n ml" x="597.5" y="350.2" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">6. IXP /</tspan><tspan x="597.5" dy="18.8">cross-connect to MMR</tspan></text><line class="ln" x1="500.0" y1="381.2" x2="684.0" y2="381.2"/><polygon class="ah" points="695.0,381.2 684.0,375.2 684.0,387.3"/><text class="n ml" x="792.5" y="414.0" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">7. Firewall, load</tspan><tspan x="792.5" dy="18.8">balancer, leaf-spine</tspan></text><line class="ln" x1="695.0" y1="445.0" x2="879.0" y2="445.0"/><polygon class="ah" points="890.0,445.0 879.0,438.9 879.0,451.1"/><text class="n ml" x="792.5" y="477.8" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">8. Routes read from</tspan><tspan x="792.5" dy="18.8">flash DB</tspan></text><line class="ln lnd" x1="890.0" y1="508.8" x2="706.0" y2="508.8"/><polygon class="ah" points="695.0,508.8 706.0,514.8 706.0,502.7"/><text class="n ml" x="597.5" y="541.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">9. Out via border</tspan><tspan x="597.5" dy="18.8">router</tspan></text><line class="ln lnd" x1="695.0" y1="572.5" x2="511.0" y2="572.5"/><polygon class="ah" points="500.0,572.5 511.0,578.5 511.0,566.5"/><text class="n ml" x="305.0" y="624.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">10. Response (~120 ms total)</tspan></text><line class="ln lnd" x1="500.0" y1="636.2" x2="121.0" y2="636.2"/><polygon class="ah" points="110.0,636.2 121.0,642.3 121.0,630.2"/></svg>