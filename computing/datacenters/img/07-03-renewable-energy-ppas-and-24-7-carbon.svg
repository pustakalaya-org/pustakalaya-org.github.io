<svg class="dg" viewBox="0 0 1000 481" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>No electricity flows to the buyer: it receives a price hedge and the certificates that support its clean-energy claim.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="475.0"/><line class="ln lnd life" x1="370.0" y1="76.5" x2="370.0" y2="475.0"/><line class="ln lnd life" x1="630.0" y1="76.5" x2="630.0" y2="475.0"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="475.0"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Wind farm</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Power market</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Data-centre buyer</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Certificate</tspan><tspan x="890.0" dy="22.5">registry</tspan></text></g><text class="n ml" x="240.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Sells MWh at spot price</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="359.0" y2="122.5"/><polygon class="ah" points="370.0,122.5 359.0,116.5 359.0,128.6"/><text class="n ml" x="370.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">2. Pays strike ($45) minus spot, if spot is lower</tspan></text><line class="ln" x1="630.0" y1="167.5" x2="121.0" y2="167.5"/><polygon class="ah" points="110.0,167.5 121.0,173.6 121.0,161.4"/><text class="n ml" x="370.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">3. Pays spot minus strike, if spot is higher</tspan></text><line class="ln lnd" x1="110.0" y1="212.5" x2="619.0" y2="212.5"/><polygon class="ah" points="630.0,212.5 619.0,206.4 619.0,218.6"/><text class="n ml" x="500.0" y="245.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. Issues 1 certificate per MWh</tspan></text><line class="ln" x1="890.0" y1="257.5" x2="121.0" y2="257.5"/><polygon class="ah" points="110.0,257.5 121.0,263.6 121.0,251.4"/><text class="n ml" x="500.0" y="290.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Transfers certificates to buyer</tspan></text><line class="ln" x1="110.0" y1="302.5" x2="879.0" y2="302.5"/><polygon class="ah" points="890.0,302.5 879.0,296.4 879.0,308.6"/><text class="n ml" x="760.0" y="316.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">6. Retires certificates for</tspan><tspan x="760.0" dy="18.8">its claim</tspan></text><line class="ln" x1="630.0" y1="347.5" x2="879.0" y2="347.5"/><polygon class="ah" points="890.0,347.5 879.0,341.4 879.0,353.6"/><text class="n ml" x="500.0" y="380.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. Site still draws normal</tspan><tspan x="500.0" dy="18.8">grid power</tspan></text><line class="ln lnd" x1="370.0" y1="411.2" x2="619.0" y2="411.2"/><polygon class="ah" points="630.0,411.2 619.0,405.2 619.0,417.3"/></svg>