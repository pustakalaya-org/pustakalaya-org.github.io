<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>DCIM is only as good as the data flowing in and the discipline of updating it after every change.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="239.4" x2="500.0" y2="111.0"/><line class="ln" x1="582.8" y1="241.9" x2="702.4" y2="172.4"/><line class="ln" x1="620.0" y1="290.0" x2="770.0" y2="290.0"/><line class="ln" x1="582.8" y1="338.1" x2="687.8" y2="399.2"/><line class="ln" x1="500.0" y1="340.6" x2="500.0" y2="460.6"/><line class="ln" x1="417.2" y1="338.1" x2="297.6" y2="407.6"/><line class="ln" x1="380.0" y1="290.0" x2="230.0" y2="290.0"/><line class="ln" x1="417.2" y1="241.9" x2="297.6" y2="172.4"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Rack PDUs</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">power per outlet via SNMP</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">UPS &amp; EPMS</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">load and alarms via Modbus</tspan></text><rect class="bx" x="775.0" y="247.6" width="200.0" height="84.9" rx="12"/><text class="t" x="875.0" y="277.0" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">BMS</tspan></text><text class="n" x="875.0" y="300.6" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">cooling status via</tspan><tspan x="875.0" dy="16.9">BACnet/API</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Rack sensors</tspan></text><text class="n" x="765.2" y="454.7" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">inlet temperature,</tspan><tspan x="765.2" dy="16.9">humidity</tspan></text><rect class="bx" x="400.0" y="465.6" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="495.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Asset records</tspan></text><text class="n" x="500.0" y="518.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">serials, U positions,</tspan><tspan x="500.0" dy="16.9">owners</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Cable &amp; port map</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">every patch end to end</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Work orders</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">moves, adds and changes</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Capacity reports</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">space, power, cooling left</tspan></text><rect class="bxa" x="385.0" y="244.4" width="230.0" height="91.2" rx="12"/><text class="t" x="500.0" y="277.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">DCIM</tspan></text><text class="n" x="500.0" y="302.4" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">single source of truth for</tspan><tspan x="500.0" dy="18.2">the physical site</tspan></text></svg>