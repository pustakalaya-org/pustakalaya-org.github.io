rect link to one big</tspan><tspan x="662.7" dy="16.9">peer</tspan></text><rect class="bx" x="237.3" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="337.3" y="473.4" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Cloud on-ramp</tspan></text><text class="n" x="337.3" y="497.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">Direct Connect,</tspan><tspan x="337.3" dy="16.9">ExpressRoute</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Partner cage</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">private B2B link</tspan></text><rect class="bx" x="106.8" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="206.8" y="138.9" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">DCI to second</tspan><tspan x="206.8" dy="21.2">site</tspan></text><text class="n" x="206.8" y="183.7" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">replication and failover</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Your edge router</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">in a carrier-neutral colo</tspan></text></svg>