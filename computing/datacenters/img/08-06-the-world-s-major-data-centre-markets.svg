<svg class="dg" viewBox="0 0 1000 348" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Growth is spreading from famous interconnection hubs to wherever power can be found.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="52.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Primary hubs</tspan></text><text class="lab" x="4.0" y="193.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Fast-growing</tspan></text><text class="lab" x="4.0" y="310.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">AI power</tspan><tspan x="4.0" dy="17.5">frontier</tspan></text><g transform="translate(0,47.0)"><rect class="bx" x="150.0" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="203.4" y="-4.4" text-anchor="middle" font-size="16"><tspan x="203.4" dy="0.0">Northern</tspan><tspan x="203.4" dy="20.0">Virginia</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="272.9" y="-43.0" width="106.9" height="86.0" rx="12"/><text class="t" x="326.3" y="-14.4" text-anchor="middle" font-size="16"><tspan x="326.3" dy="0.0">Dallas-Fo</tspan><tspan x="326.3" dy="20.0">rt</tspan><tspan x="326.3" dy="20.0">Worth</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="395.7" y="-23.0" width="106.9" height="46.0" rx="12"/><text class="t" x="449.1" y="5.6" text-anchor="middle" font-size="16"><tspan x="449.1" dy="0.0">Chicago</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="518.6" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Silicon</tspan><tspan x="572.0" dy="20.0">Valley</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="641.4" y="-23.0" width="106.9" height="46.0" rx="12"/><text class="t" x="694.9" y="5.6" text-anchor="middle" font-size="16"><tspan x="694.9" dy="0.0">FLAP-D</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="764.3" y="-23.0" width="106.9" height="46.0" rx="12"/><text class="t" x="817.7" y="5.6" text-anchor="middle" font-size="16"><tspan x="817.7" dy="0.0">Singapore</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="887.1" y="-23.0" width="106.9" height="46.0" rx="12"/><text class="t" x="940.6" y="5.6" text-anchor="middle" font-size="16"><tspan x="940.6" dy="0.0">Tokyo</tspan></text></g><g transform="translate(0,188.0)"><rect class="bx" x="150.0" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="213.7" y="5.6" text-anc