<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The controller balances on-site sources, storage, grid supply and load, and can island the campus.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="235.4" x2="500.0" y2="119.5"/><line class="ln" x1="589.7" y1="237.9" x2="684.1" y2="183.0"/><line class="ln" x1="620.0" y1="290.0" x2="770.0" y2="290.0"/><line class="ln" x1="589.7" y1="342.1" x2="687.8" y2="399.2"/><line class="ln" x1="500.0" y1="344.6" x2="500.0" y2="469.0"/><line class="ln" x1="410.3" y1="342.1" x2="315.9" y2="397.0"/><line class="ln" x1="380.0" y1="290.0" x2="230.0" y2="290.0"/><line class="ln" x1="410.3" y1="237.9" x2="297.6" y2="172.4"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Grid connection</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">front-of-meter supply and</tspan><tspan x="500.0" dy="16.9">PPAs</tspan></text><rect class="bx" x="665.2" y="91.2" width="200.0" height="89.2" rx="12"/><text class="t" x="765.2" y="120.7" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Gas engines /</tspan><tspan x="765.2" dy="21.2">turbines</tspan></text><text class="n" x="765.2" y="165.5" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">bridge or prime power</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Fuel cells</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">quiet, low local emissions</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">BESS</tspan></text><text class="n" x="765.2" y="454.7" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">smoothing, backup, grid</tspan><tspan x="765.2" dy="16.9">services</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Solar PV</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">small share of demand</tspan></text><rect class="bx" x="134.8" y="399.5" width="200.0" height="89.2" rx="12"/><text class="t" x="234.8" y="429.0" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Diesel / HVO</tspan><tspan x="234.8" dy="21.2">gensets</tspan></text><text class="n" x="234.8" y="473.8" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">emergency backup</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Nuclear PPA</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">firm low-carbon supply</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Data-centre load</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">IT plus cooling</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Microgrid</tspan><tspan x="500.0" dy="26.2">controller</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">balances sources and load</tspan></text></svg>