<svg class="dg" viewBox="0 0 1000 661" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The UPS covers the first seconds; generators carry the site until the grid is stable again.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="655.0"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="655.0"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="655.0"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="655.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="655.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Utility</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">ATS / controls</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Generators</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">UPS</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">IT load</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. Mains fails or out</tspan><tspan x="207.5" dy="18.8">of tolerance</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="792.5" y="132.8" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">2. Battery carries</tspan><tspan x="792.5" dy="18.8">load, zero break</tspan></text><line class="ln" x1="695.0" y1="163.8" x2="879.0" y2="163.8"/><polygon class="ah" points="890.0,163.8 879.0,157.7 879.0,169.8"/><text class="n ml" x="402.5" y="196.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">3. Start signal (t =</tspan><tspan x="402.5" dy="18.8">0 s)</tspan></text><line class="ln" x1="305.0" y1="227.5" x2="489.0" y2="227.5"/><polygon class="ah" points="500.0,227.5 489.0,221.4 489.0,233.6"/><text class="n ml" x="402.5" y="260.2" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">4. Rated speed and</tspan><tspan x="402.5" dy="18.8">voltage (~10 s)</tspan></text><line class="ln lnd" x1="500.0" y1="291.2" x2="316.0" y2="291.2"/><polygon class="ah" points="305.0,291.2 316.0,297.3 316.0,285.2"/><text class="n ml" x="500.0" y="342.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Transfer: UPS input on generator</tspan></text><line class="ln" x1="305.0" y1="355.0" x2="684.0" y2="355.0"/><polygon class="ah" points="695.0,355.0 684.0,348.9 684.0,361.1"/><text class="n ml" x="792.5" y="350.2" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">6. Rectifier carries</tspan><tspan x="792.5" dy="18.8">load, batteries</tspan><tspan x="792.5" dy="18.8">recharge</tspan></text><line class="ln" x1="695.0" y1="400.0" x2="879.0" y2="400.0"/><polygon class="ah" points="890.0,400.0 879.0,393.9 879.0,406.1"/><text class="n ml" x="207.5" y="451.5" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">7. Utility restored</tspan><tspan x="207.5" dy="18.8">and stable</tspan></text><line class="ln lnd" x1="110.0" y1="482.5" x2="294.0" y2="482.5"/><polygon class="ah" points="305.0,482.5 294.0,476.4 294.0,488.6"/><text class="n ml" x="500.0" y="534.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. Retransfer after time delay</tspan></text><line class="ln" x1="305.0" y1="546.2" x2="684.0" y2="546.2"/><polygon class="ah" points="695.0,546.2 684.0,540.2 684.0,552.3"/><text class="n ml" x="402.5" y="560.2" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">9. Cool-down run,</tspan><tspan x="402.5" dy="18.8">then stop</tspan></text><line class="ln" x1="305.0" y1="591.2" x2="489.0" y2="591.2"/><polygon class="ah" points="500.0,591.2 489.0,585.2 489.0,597.3"/></svg>