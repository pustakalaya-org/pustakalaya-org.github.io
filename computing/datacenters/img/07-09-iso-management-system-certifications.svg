<svg class="dg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every ISO management-system standard runs this loop, so one integrated system can serve several certificates.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><ellipse class="ring" cx="500.0" cy="280.0" rx="360" ry="200.0"/><line class="ln acc" x1="742.3" y1="131.8" x2="751.1" y2="136.6"/><polygon class="ah" points="763.3,143.4 754.8,129.9 747.3,143.4"/><line class="ln acc" x1="766.8" y1="414.6" x2="758.1" y2="419.5"/><polygon class="ah" points="745.8,426.3 761.8,426.2 754.3,412.7"/><line class="ln acc" x1="257.7" y1="428.2" x2="248.9" y2="423.4"/><polygon class="ah" points="236.7,416.6 245.2,430.1 252.7,416.6"/><line class="ln acc" x1="233.2" y1="145.4" x2="241.9" y2="140.5"/><polygon class="ah" points="254.2,133.7 238.2,133.8 245.7,147.3"/><text class="t" x="500.0" y="286.0" text-anchor="middle" font-size="22"><tspan x="500.0" dy="0.0">Clauses 4-10</tspan></text><rect class="bx" x="395.0" y="37.5" width="210.0" height="84.9" rx="12"/><text class="t" x="500.0" y="67.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Plan</tspan></text><text class="n" x="500.0" y="90.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Context, leadership, risks,</tspan><tspan x="500.0" dy="16.9">objectives</tspan></text><circle class="bc" cx="399.0" cy="41.5" r="13"/><text class="bn" x="399.0" y="47.0" text-anchor="middle" font-size="16">1</text><rect class="bx" x="755.0" y="237.6" width="210.0" height="84.9" rx="12"/><text class="t" x="860.0" y="267.0" text-anchor="middle" font-size="17"><tspan x="860.0" dy="0.0">Do</tspan></text><text class="n" x="860.0" y="290.6" text-anchor="middle" font-size="13"><tspan x="860.0" dy="0.0">Support, operation,</tspan><tspan x="860.0" dy="16.9">training, records</tspan></text><circle class="bc" cx="759.0" cy="241.6" r="13"/><text class="bn" x="759.0" y="247.1" text-anchor="middle" font-size="16">2</text><rect class="bx" x="395.0" y="437.6" width="210.0" height="84.9" rx="12"/><text class="t" x="500.0" y="467.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Check</tspan></text><text class="n" x="500.0" y="490.6" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">KPIs, internal audit,</tspan><tspan x="500.0" dy="16.9">management review</tspan></text><circle class="bc" cx="399.0" cy="441.6" r="13"/><text class="bn" x="399.0" y="447.1" text-anchor="middle" font-size="16">3</text><rect class="bx" x="35.0" y="237.6" width="210.0" height="84.9" rx="12"/><text class="t" x="140.0" y="267.0" text-anchor="middle" font-size="17"><tspan x="140.0" dy="0.0">Act</tspan></text><text class="n" x="140.0" y="290.6" text-anchor="middle" font-size="13"><tspan x="140.0" dy="0.0">Corrective action,</tspan><tspan x="140.0" dy="16.9">continual improvement</tspan></text><circle class="bc" cx="39.0" cy="241.6" r="13"/><text class="bn" x="39.0" y="247.1" text-anchor="middle" font-size="16">4</text></svg>