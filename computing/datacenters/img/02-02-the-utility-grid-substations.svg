<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Voltage is stepped down at each tier; big campuses connect high up the chain with their own substation.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Generation</tspan></text><line class="ln" x1="459.0" y1="60.0" x2="459.0" y2="145.0"/><line class="ln" x1="685.0" y1="70.0" x2="685.0" y2="145.0"/><text class="lab" x="4.0" y="164.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Transmission</tspan><tspan x="4.0" dy="17.5">132-400 kV</tspan></text><line class="ln" x1="459.0" y1="191.0" x2="459.0" y2="271.0"/><line class="ln" x1="685.0" y1="191.0" x2="685.0" y2="271.0"/><text class="lab" x="4.0" y="290.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">On-site</tspan><tspan x="4.0" dy="17.5">substation</tspan></text><line class="ln" x1="459.0" y1="317.0" x2="459.0" y2="397.0"/><line class="ln" x1="685.0" y1="317.0" x2="685.0" y2="397.0"/><text class="lab" x="4.0" y="416.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Campus MV</tspan><tspan x="4.0" dy="17.5">11-34.5 kV</tspan></text><line class="ln" x1="459.0" y1="443.0" x2="459.0" y2="523.0"/><line class="ln" x1="685.0" y1="443.0" x2="685.0" y2="523.0"/><text class="lab" x="4.0" y="542.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Building LV</tspan><tspan x="4.0" dy="17.5">400-480 V</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Power stations</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="580.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="685.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Wind and solar</tspan><tspan x="685.0" dy="20.0">farms</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Overhead lines</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Grid substation</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">HV breakers</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">HV/MV transformers</tspan></text></g><g transform="translate(0,420.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">MV ring A</tspan></text></g><g transform="translate(0,420.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">MV ring B</tspan></text></g><g transform="translate(0,546.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Hall transformers</tspan></text></g><g transform="translate(0,546.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">LV switchboards</tspan></text></g></svg>