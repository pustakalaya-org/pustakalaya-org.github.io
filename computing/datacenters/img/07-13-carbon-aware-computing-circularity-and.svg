<svg class="dg" viewBox="0 0 1000 189" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The job does the same work; only its timing or location changes.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect class="bx" x="0.0" y="6.0" width="163.2" height="174.8" rx="14"/><rect class="bar" x="0.0" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="26.0" cy="36.0" r="15"/><text class="bn" x="26.0" y="41.5" text-anchor="middle" font-size="16">1</text><text class="t" x="81.6" y="74.2" text-anchor="middle" font-size="19"><tspan x="81.6" dy="0.0">Job</tspan><tspan x="81.6" dy="23.8">submitted</tspan></text><text class="n" x="81.6" y="125.8" text-anchor="middle" font-size="15"><tspan x="81.6" dy="0.0">Flexible</tspan><tspan x="81.6" dy="19.5">deadline, e.g.</tspan><tspan x="81.6" dy="19.5">within 24 h</tspan></text><line class="ln" x1="168.2" y1="93.4" x2="193.2" y2="93.4"/><polygon class="ah" points="204.2,93.4 193.2,87.3 193.2,99.4"/><rect class="bx" x="209.2" y="6.0" width="163.2" height="174.8" rx="14"/><rect class="bar" x="209.2" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="235.2" cy="36.0" r="15"/><text class="bn" x="235.2" y="41.5" text-anchor="middle" font-size="16">2</text><text class="t" x="290.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="290.8" dy="0.0">Fetch</tspan><tspan x="290.8" dy="23.8">forecast</tspan></text><text class="n" x="290.8" y="125.8" text-anchor="middle" font-size="15"><tspan x="290.8" dy="0.0">gCO2/kWh by hour</tspan><tspan x="290.8" dy="19.5">and region</tspan></text><line class="ln" x1="377.4" y1="93.4" x2="402.4" y2="93.4"/><polygon class="ah" points="413.4,93.4 402.4,87.3 402.4,99.4"/><rect class="bx" x="418.4" y="6.0" width="163.2" height="174.8" rx="14"/><rect class="bar" x="418.4" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="444.4" cy="36.0" r="15"/><text class="bn" x="444.4" y="41.5" text-anchor="middle" font-size="16">3</text><text class="t" x="500.0" y="74.2" text-anchor="middle" font-size="19"><tspan x="500.0" dy="0.0">Pick window</tspan></text><text class="n" x="500.0" y="102.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">Lowest-carbon</tspan><tspan x="500.0" dy="19.5">slot meeting</tspan><tspan x="500.0" dy="19.5">deadline</tspan></text><line class="ln" x1="586.6" y1="93.4" x2="611.6" y2="93.4"/><polygon class="ah" points="622.6,93.4 611.6,87.3 611.6,99.4"/><rect class="bx" x="627.6" y="6.0" width="163.2" height="174.8" rx="14"/><rect class="bar" x="627.6" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="653.6" cy="36.0" r="15"/><text class="bn" x="653.6" y="41.5" text-anchor="middle" font-size="16">4</text><text class="t" x="709.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="709.2" dy="0.0">Run job</tspan></text><text class="n" x="709.2" y="102.0" text-anchor="middle" font-size="15"><tspan x="709.2" dy="0.0">Same work,</tspan><tspan x="709.2" dy="19.5">cleaner</tspan><tspan x="709.2" dy="19.5">electricity</tspan></text><line class="ln" x1="795.8" y1="93.4" x2="820.8" y2="93.4"/><polygon class="ah" points="831.8,93.4 820.8,87.3 820.8,99.4"/><rect class="bx" x="836.8" y="6.0" width="163.2" height="174.8" rx="14"/><rect class="bar" x="836.8" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="862.8" cy="36.0" r="15"/><text class="bn" x="862.8" y="41.5" text-anchor="middle" font-size="16">5</text><text class="t" x="918.4" y="74.2" text-anchor="middle" font-size="19"><tspan x="918.4" dy="0.0">Measure and</tspan><tspan x="918.4" dy="23.8">report</tspan></text><text class="n" x="918.4" y="125.8" text-anchor="middle" font-size="15"><tspan x="918.4" dy="0.0">SCI per</tspan><tspan x="918.4" dy="19.5">functional unit</tspan></text></svg>