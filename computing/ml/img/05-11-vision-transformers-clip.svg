<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Matching image-caption pairs are pulled together; mismatched pairs in the batch are pushed apart.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="579.2" y1="86.5" x2="720.1" y2="130.0"/><polygon class="ah" points="730.7,133.3 721.9,124.2 718.4,135.8"/><line class="ln" x1="741.2" y1="383.5" x2="589.7" y2="430.3"/><polygon class="ah" points="579.2,433.5 591.5,436.1 587.9,424.5"/><line class="ln" x1="730.7" y1="188.7" x2="269.3" y2="331.3"/><polygon class="ah" points="258.8,334.5 271.1,337.1 267.5,325.5"/><line class="ln" x1="420.8" y1="433.5" x2="269.3" y2="386.7"/><polygon class="ah" points="258.8,383.5 267.5,392.5 271.1,380.9"/><line class="ln" x1="179.6" y1="331.0" x2="179.6" y2="210.0"/><polygon class="ah" points="179.6,199.0 173.5,210.0 185.6,210.0"/><rect class="lbg" x="422.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">image vector</tspan></text><rect class="lbg" x="261.8" y="395.5" width="156" height="23.0" rx="6"/><text class="n" x="339.8" y="410.5" text-anchor="middle" font-size="13"><tspan x="339.8" dy="0.0">text vector</tspan></text><rect class="lbg" x="101.6" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="179.6" y="262.0" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">match pairs</tspan></text><rect class="bx" x="415.0" y="39.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="67.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Image</tspan></text><rect class="bx" x="735.4" y="128.0" width="170.0" height="66.0" rx="12"/><text class="t" x="820.4" y="156.6" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Image encoder</tspan><tspan x="820.4" dy="20.0">(ViT)</tspan></text><rect class="bx" x="735.4" y="336.0" width="170.0" height="46.0" rx="12"/><text class="t" x="820.4" y="364.6" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Caption text</tspan></text><rect class="bx" x="415.0" y="435.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="463.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Text encoder</tspan></text><rect class="bxa" x="94.6" y="336.0" width="170.0" height="46.0" rx="12"/><text class="t" x="179.6" y="364.6" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Shared space</tspan></text><rect class="bx" x="94.6" y="128.0" width="170.0" height="66.0" rx="12"/><text class="t" x="179.6" y="156.6" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Contrastive</tspan><tspan x="179.6" dy="20.0">loss</tspan></text></svg>