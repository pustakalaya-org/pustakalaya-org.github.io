<svg class="dg" viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Most latency budget goes to feature lookups and the model call; logging happens asynchronously.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="546.0"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="546.0"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="546.0"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="546.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="546.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Client app</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">API gateway</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Model server</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Feature store</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Monitoring</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. POST /predict</tspan><tspan x="207.5" dy="18.8">{user_id: 8812}</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="402.5" y="132.8" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. route to v9 (95%)</tspan><tspan x="402.5" dy="18.8">/ v10 canary (5%)</tspan></text><line class="ln" x1="305.0" y1="163.8" x2="489.0" y2="163.8"/><polygon class="ah" points="500.0,163.8 489.0,157.7 489.0,169.8"/><text class="n ml" x="597.5" y="196.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">3. get features for</tspan><tspan x="597.5" dy="18.8">8812</tspan></text><line class="ln" x1="500.0" y1="227.5" x2="684.0" y2="227.5"/><polygon class="ah" points="695.0,227.5 684.0,221.4 684.0,233.6"/><text class="n ml" x="597.5" y="279.0" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">4. 25 features, 2 ms</tspan></text><line class="ln lnd" x1="695.0" y1="291.2" x2="511.0" y2="291.2"/><polygon class="ah" points="500.0,291.2 511.0,297.3 511.0,285.2"/><text class="n" x="570.0" y="354.5" text-anchor="start" font-size="15"><tspan x="570.0" dy="0.0">5. batch + run model</tspan></text><path class="ln" d="M500.0,336.2 H555.0 V362.2 H514.0"/><line class="ln" x1="520.0" y1="362.2" x2="514.0" y2="362.2"/><polygon class="ah" points="503.0,362.2 514.0,368.3 514.0,356.2"/><text class="n ml" x="402.5" y="380.0" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">6. score 0.83, 18 ms</tspan></text><line class="ln lnd" x1="500.0" y1="392.2" x2="316.0" y2="392.2"/><polygon class="ah" points="305.0,392.2 316.0,398.3 316.0,386.2"/><text class="n ml" x="207.5" y="406.2" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">7. 200 OK {risk:</tspan><tspan x="207.5" dy="18.8">high}</tspan></text><line class="ln lnd" x1="305.0" y1="437.2" x2="121.0" y2="437.2"/><polygon class="ah" points="110.0,437.2 121.0,443.3 121.0,431.2"/><text class="n ml" x="695.0" y="488.8" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">8. log inputs, output, latency (async)</tspan></text><line class="ln" x1="500.0" y1="501.0" x2="879.0" y2="501.0"/><polygon class="ah" points="890.0,501.0 879.0,494.9 879.0,507.1"/></svg>