<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Starting points, not rules — always confirm with a fair validation comparison.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="567.1" y1="251.0" x2="660.0" y2="197.0"/><polygon class="ah" points="669.5,191.4 657.0,191.7 663.1,202.2"/><line class="ln" x1="620.0" y1="290.0" x2="759.0" y2="290.0"/><polygon class="ah" points="770.0,290.0 759.0,283.9 759.0,296.1"/><line class="ln" x1="567.1" y1="329.0" x2="660.0" y2="383.0"/><polygon class="ah" points="669.5,388.6 663.1,377.8 657.0,388.3"/><line class="ln" x1="500.0" y1="331.5" x2="500.0" y2="458.0"/><polygon class="ah" points="500.0,469.0 506.1,458.0 493.9,458.0"/><line class="ln" x1="432.9" y1="329.0" x2="307.2" y2="402.1"/><polygon class="ah" points="297.6,407.6 310.2,407.3 304.1,396.9"/><line class="ln" x1="380.0" y1="290.0" x2="241.0" y2="290.0"/><polygon class="ah" points="230.0,290.0 241.0,296.1 241.0,283.9"/><line class="ln" x1="432.9" y1="251.0" x2="307.2" y2="177.9"/><polygon class="ah" points="297.6,172.4 304.1,183.1 310.2,172.7"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Labelled table</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">gradient-boosted trees</tspan></text><rect class="bx" x="665.2" y="82.8" width="200.0" height="106.2" rx="12"/><text class="t" x="765.2" y="112.2" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Must explain</tspan><tspan x="765.2" dy="21.2">simply</tspan></text><text class="n" x="765.2" y="157.0" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">linear model or shallow</tspan><tspan x="765.2" dy="16.9">tree</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Small table</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">regularised linear, TabPFN</tspan></text><rect class="bx" x="665.2" y="391.1" width="200.0" height="106.2" rx="12"/><text class="t" x="765.2" y="420.5" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Images, text,</tspan><tspan x="765.2" dy="21.2">audio</tspan></text><text class="n" x="765.2" y="465.3" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">fine-tune pre-trained</tspan><tspan x="765.2" dy="16.9">network</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">No labels</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">clustering, PCA, UMAP</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Rare oddities</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">isolation forest, LOF</tspan></text><rect class="bx" x="25.0" y="247.6" width="200.0" height="84.9" rx="12"/><text class="t" x="125.0" y="277.0" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Future values</tspan></text><text class="n" x="125.0" y="300.6" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">seasonal naive, ETS,</tspan><tspan x="125.0" dy="16.9">boosting</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Similar items</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">kNN on embeddings</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Your problem</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">task, data, constraints</tspan></text></svg>