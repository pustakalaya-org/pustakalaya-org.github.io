<svg class="dg" viewBox="0 0 1000 464" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Only the chosen experts run, so compute follows active, not total, parameters.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="37.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Token</tspan></text><line class="ln" x1="572.0" y1="55.0" x2="572.0" y2="130.0"/><text class="lab" x="4.0" y="168.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Router</tspan></text><line class="ln" x1="572.0" y1="196.0" x2="213.7" y2="271.0"/><line class="ln" x1="572.0" y1="196.0" x2="357.0" y2="271.0"/><line class="ln" x1="572.0" y1="196.0" x2="500.3" y2="271.0"/><line class="ln" x1="572.0" y1="196.0" x2="643.7" y2="271.0"/><line class="ln" x1="572.0" y1="196.0" x2="787.0" y2="271.0"/><line class="ln" x1="572.0" y1="196.0" x2="930.3" y2="271.0"/><text class="lab" x="4.0" y="299.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Experts</tspan></text><line class="ln" x1="213.7" y1="317.0" x2="572.0" y2="392.0"/><line class="ln" x1="357.0" y1="317.0" x2="572.0" y2="392.0"/><line class="ln" x1="500.3" y1="317.0" x2="572.0" y2="392.0"/><line class="ln" x1="643.7" y1="317.0" x2="572.0" y2="392.0"/><line class="ln" x1="787.0" y1="317.0" x2="572.0" y2="392.0"/><line class="ln" x1="930.3" y1="317.0" x2="572.0" y2="392.0"/><text class="lab" x="4.0" y="430.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Output</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">token vector</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">score all experts,</tspan><tspan x="572.0" dy="20.0">pick top-k</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="150.0" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="213.7" y="5.6" text-anchor="middle" font-size="16"><tspan x="213.7" dy="0.0">E1</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="293.3" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="357.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="357.0" dy="0.0">E2 ✓</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="436.7" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="500.3" y="5.6" text-anchor="middle" font-size="16"><tspan x="500.3" dy="0.0">E3</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="580.0" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="643.7" y="5.6" text-anchor="middle" font-size="16"><tspan x="643.7" dy="0.0">…</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="723.3" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="787.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="787.0" dy="0.0">E255 ✓</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="866.7" y="-23.0" width="127.3" height="46.0" rx="12"/><text class="t" x="930.3" y="5.6" text-anchor="middle" font-size="16"><tspan x="930.3" dy="0.0">E256</tspan></text></g><g transform="translate(0,425.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">weighted sum (+</tspan><tspan x="572.0" dy="20.0">shared expert)</tspan></text></g></svg>