<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Noisy rules vote; a label model weighs them; a normal model learns from the result.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="89.7" x2="720.1" y2="130.0"/><polygon class="ah" points="730.7,133.3 721.9,124.2 718.4,135.8"/><line class="ln" x1="539.8" y1="98.9" x2="772.6" y2="314.6"/><polygon class="ah" points="780.6,322.1 776.7,310.2 768.4,319.1"/><line class="ln" x1="500.0" y1="100.5" x2="500.0" y2="398.5"/><polygon class="ah" points="500.0,409.5 506.1,398.5 493.9,398.5"/><line class="ln" x1="730.7" y1="188.7" x2="279.9" y2="328.0"/><polygon class="ah" points="269.3,331.3 281.6,333.8 278.1,322.2"/><line class="ln" x1="730.4" y1="359.0" x2="280.6" y2="359.0"/><polygon class="ah" points="269.6,359.0 280.6,365.1 280.6,353.0"/><line class="ln" x1="410.2" y1="430.3" x2="279.9" y2="390.0"/><polygon class="ah" points="269.3,386.7 278.1,395.8 281.6,384.2"/><line class="ln" x1="179.6" y1="320.5" x2="179.6" y2="210.5"/><polygon class="ah" points="179.6,199.5 173.5,210.5 185.6,210.5"/><rect class="lbg" x="101.6" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="179.6" y="262.0" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">probabilistic labels</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Unlabelled data</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">500k contracts</tspan></text><rect class="bx" x="735.4" y="127.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="156.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Keyword rules</tspan></text><text class="n" x="820.4" y="179.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">LF 1-10</tspan></text><rect class="bx" x="735.4" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="354.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Regex patterns</tspan></text><text class="n" x="820.4" y="377.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">LF 11-20</tspan></text><rect class="bx" x="415.0" y="414.5" width="170.0" height="87.0" rx="12"/><text class="t" x="500.0" y="443.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Existing model</tspan><tspan x="500.0" dy="20.0">/ LLM</tspan></text><text class="n" x="500.0" y="486.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">LF 21-25</tspan></text><rect class="bxa" x="94.6" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="354.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Label model</tspan></text><text class="n" x="179.6" y="377.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">weighs LF accuracy</tspan></text><rect class="bx" x="94.6" y="127.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="156.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">End model</tspan></text><text class="n" x="179.6" y="179.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">trained classifier</tspan></text></svg>