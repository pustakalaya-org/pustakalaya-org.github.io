<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every learning type is defined by where its feedback comes from, not by which algorithm it uses.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="111.0" x2="500.0" y2="228.4"/><polygon class="ah" points="500.0,239.4 506.1,228.4 493.9,228.4"/><line class="ln" x1="715.3" y1="190.2" x2="612.9" y2="237.7"/><polygon class="ah" points="602.9,242.3 615.4,243.2 610.3,232.2"/><line class="ln" x1="760.6" y1="324.6" x2="630.9" y2="307.4"/><polygon class="ah" points="620.0,305.9 630.1,313.4 631.7,301.4"/><line class="ln" x1="622.5" y1="437.9" x2="548.0" y2="347.9"/><polygon class="ah" points="541.0,339.5 543.3,351.8 552.6,344.1"/><line class="ln" x1="377.5" y1="437.9" x2="452.0" y2="347.9"/><polygon class="ah" points="459.0,339.5 447.4,344.1 456.7,351.8"/><line class="ln" x1="239.4" y1="324.6" x2="369.1" y2="307.4"/><polygon class="ah" points="380.0,305.9 368.3,301.4 369.9,313.4"/><line class="ln" x1="284.7" y1="190.2" x2="387.1" y2="237.7"/><polygon class="ah" points="397.1,242.3 389.7,232.2 384.6,243.2"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Human labels</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">supervised</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Data structure</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">unsupervised</tspan></text><rect class="bx" x="765.6" y="293.9" width="200.0" height="89.2" rx="12"/><text class="t" x="865.6" y="323.3" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Hidden parts of</tspan><tspan x="865.6" dy="21.2">data</tspan></text><text class="n" x="865.6" y="368.1" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">self-supervised</tspan></text><rect class="bx" x="562.7" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="662.7" y="471.2" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Few labels + many</tspan><tspan x="662.7" dy="21.2">unlabelled</tspan></text><text class="n" x="662.7" y="516.0" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">semi-supervised</tspan></text><rect class="bx" x="237.3" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="337.3" y="471.2" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Rewards from</tspan><tspan x="337.3" dy="21.2">actions</tspan></text><text class="n" x="337.3" y="516.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">reinforcement learning</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Human preferences</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">RLHF</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Checkable answers</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">RL with verifiable rewards</tspan></text><rect class="bxa" x="385.0" y="244.4" width="230.0" height="91.2" rx="12"/><text class="t" x="500.0" y="277.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Learning signal</tspan></text><text class="n" x="500.0" y="302.4" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">what tells the model it is</tspan><tspan x="500.0" dy="18.2">wrong?</tspan></text></svg>