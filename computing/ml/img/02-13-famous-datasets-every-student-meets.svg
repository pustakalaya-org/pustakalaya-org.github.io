<svg class="dg" viewBox="0 0 1000 478" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Log scale: from 150 flowers to billions of image-text pairs.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Iris</tspan></text><rect class="bfill" x="280" y="14.0" width="20.1" height="28" rx="6"/><text class="n" x="310.1" y="33.0" text-anchor="start" font-size="15"><tspan x="310.1" dy="0.0">150</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Titanic (OpenML)</tspan></text><rect class="bfill" x="280" y="64.0" width="83.3" height="28" rx="6"/><text class="n" x="373.3" y="83.0" text-anchor="start" font-size="15"><tspan x="373.3" dy="0.0">1,309</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">CIFAR-10</tspan></text><rect class="bfill" x="280" y="114.0" width="194.9" height="28" rx="6"/><text class="n" x="484.9" y="133.0" text-anchor="start" font-size="15"><tspan x="484.9" dy="0.0">60,000</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">MNIST</tspan></text><rect class="bfill" x="280" y="164.0" width="199.4" height="28" rx="6"/><text class="n" x="489.4" y="183.0" text-anchor="start" font-size="15"><tspan x="489.4" dy="0.0">70,000</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SQuAD 1.1</tspan></text><rect class="bfill" x="280" y="214.0" width="212.0" height="28" rx="6"/><text class="n" x="502.0" y="233.0" text-anchor="start" font-size="15"><tspan x="502.0" dy="0.0">≈108,000</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">COCO</tspan></text><rect class="bfill" x="280" y="264.0" width="244.6" height="28" rx="6"/><text class="n" x="534.6" y="283.0" text-anchor="start" font-size="15"><tspan x="534.6" dy="0.0">≈330,000</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ImageNet-1k train</tspan></text><rect class="bfill" x="280" y="314.0" width="284.2" height="28" rx="6"/><text class="n" x="574.2" y="333.0" text-anchor="start" font-size="15"><tspan x="574.2" dy="0.0">1.28 M</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ImageNet full</tspan></text><rect class="bfill" x="280" y="364.0" width="354.4" height="28" rx="6"/><text class="n" x="644.4" y="383.0" text-anchor="start" font-size="15"><tspan x="644.4" dy="0.0">14.2 M</tspan></text><text class="t" x="266.0" y="433.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">LAION-5B pairs</tspan></text><rect class="bfill" x="280" y="414.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="433.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">5.85 B</tspan></text><text class="n" x="996.0" y="468.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>