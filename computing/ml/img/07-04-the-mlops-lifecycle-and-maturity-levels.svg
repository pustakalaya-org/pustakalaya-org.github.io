<svg class="dg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>MLOps is a loop, not a line: monitoring feeds straight back into new data and retraining.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><ellipse class="ring" cx="500.0" cy="280.0" rx="360" ry="200.0"/><line class="ln acc" x1="642.7" y1="96.2" x2="652.3" y2="98.8"/><polygon class="ah" points="665.9,102.4 654.3,91.3 650.3,106.2"/><line class="ln acc" x1="845.7" y1="222.5" x2="849.5" y2="231.8"/><polygon class="ah" points="854.8,244.7 856.6,228.9 842.3,234.7"/><line class="ln acc" x1="792.9" y1="396.7" x2="784.7" y2="402.4"/><polygon class="ah" points="773.3,410.4 789.1,408.7 780.3,396.1"/><line class="ln acc" x1="514.0" y1="480.0" x2="504.0" y2="480.0"/><polygon class="ah" points="490.0,480.0 504.0,487.7 504.0,472.3"/><line class="ln acc" x1="230.0" y1="412.7" x2="221.8" y2="407.0"/><polygon class="ah" points="210.3,399.0 217.4,413.3 226.2,400.7"/><line class="ln acc" x1="143.7" y1="248.4" x2="147.5" y2="239.2"/><polygon class="ah" points="152.8,226.2 140.4,236.3 154.6,242.1"/><line class="ln acc" x1="330.3" y1="103.4" x2="339.9" y2="100.8"/><polygon class="ah" points="353.5,97.2 337.9,93.4 341.9,108.3"/><text class="t" x="500.0" y="286.0" text-anchor="middle" font-size="22"><tspan x="500.0" dy="0.0">Versioned code,</tspan><tspan x="500.0" dy="27.5">data &amp; models</tspan></text><rect class="bx" x="395.0" y="37.5" width="210.0" height="84.9" rx="12"/><text class="t" x="500.0" y="67.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Scope</tspan></text><text class="n" x="500.0" y="90.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">problem, metric,</tspan><tspan x="500.0" dy="16.9">constraints</tspan></text><circle class="bc" cx="399.0" cy="41.5" r="13"/><text class="bn" x="399.0" y="47.0" text-anchor="middle" font-size="16">1</text><rect class="bx" x="676.5" y="121.3" width="210.0" height="68.0" rx="12"/><text class="t" x="781.5" y="150.8" text-anchor="middle" font-size="17"><tspan x="781.5" dy="0.0">Data</tspan></text><text class="n" x="781.5" y="174.3" text-anchor="middle" font-size="13"><tspan x="781.5" dy="0.0">collect, validate, version</tspan></text><circle class="bc" cx="680.5" cy="125.3" r="13"/><text class="bn" x="680.5" y="130.8" text-anchor="middle" font-size="16">2</text><rect class="bx" x="746.0" y="290.5" width="210.0" height="68.0" rx="12"/><text class="t" x="851.0" y="320.0" text-anchor="middle" font-size="17"><tspan x="851.0" dy="0.0">Train</tspan></text><text cla