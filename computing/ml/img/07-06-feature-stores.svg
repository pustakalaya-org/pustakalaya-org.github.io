<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>One feature definition feeds both paths, removing training-serving skew.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="89.7" x2="720.1" y2="130.0"/><polygon class="ah" points="730.7,133.3 721.9,124.2 718.4,135.8"/><line class="ln" x1="820.4" y1="209.5" x2="820.4" y2="309.5"/><polygon class="ah" points="820.4,320.5 826.5,309.5 814.4,309.5"/><line class="ln" x1="730.7" y1="386.7" x2="600.3" y2="427.0"/><polygon class="ah" points="589.8,430.3 602.1,432.8 598.5,421.2"/><line class="ln" x1="730.4" y1="359.0" x2="280.6" y2="359.0"/><polygon class="ah" points="269.6,359.0 280.6,365.1 280.6,353.0"/><line class="ln" x1="460.2" y1="421.1" x2="238.2" y2="215.4"/><polygon class="ah" points="230.2,207.9 234.1,219.8 242.3,210.9"/><rect class="lbg" x="582.2" y="98.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="113.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">transform</tspan></text><rect class="lbg" x="742.4" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="820.4" y="262.0" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">batch write</tspan></text><rect class="lbg" x="582.2" y="395.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="410.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">materialise</tspan></text><rect class="lbg" x="422.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">historical</tspan></text><rect class="lbg" x="261.8" y="296.5" width="156" height="23.0" rx="6"/><text class="n" x="339.8" y="311.5" text-anchor="middle" font-size="13"><tspan x="339.8" dy="0.0">latest values</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Raw data</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">events, tables</tspan></text><rect class="bxa" x="735.4" y="117.5" width="170.0" height="87.0" rx="12"/><text class="t" x="820.4" y="146.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Feature</tspan><tspan x="820.4" dy="20.0">definitions</tspan></text><text class="n" x="820.4" y="189.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">versioned code</tspan></text><rect class="bx" x="735.4" y="