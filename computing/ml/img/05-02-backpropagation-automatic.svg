<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Values flow forward; gradients flow back, each edge multiplying by a local derivative.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="90.0" x2="500.0" y2="419.0"/><polygon class="ah" points="500.0,430.0 506.1,419.0 493.9,419.0"/><line class="ln" x1="822.6" y1="285.4" x2="557.1" y2="427.5"/><polygon class="ah" points="547.4,432.6 559.9,432.8 554.2,422.1"/><line class="ln" x1="452.6" y1="432.6" x2="205.8" y2="300.5"/><polygon class="ah" points="196.1,295.4 202.9,305.9 208.6,295.2"/><line class="ln" x1="196.1" y1="295.4" x2="442.9" y2="427.5"/><polygon class="ah" points="452.6,432.6 445.8,422.1 440.1,432.8"/><line class="ln" x1="547.4" y1="432.6" x2="812.9" y2="290.5"/><polygon class="ah" points="822.6,285.4 810.1,285.2 815.8,295.9"/><rect class="lbg" x="422.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">forward</tspan></text><rect class="lbg" x="607.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="685.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="685.0" dy="0.0">forward</tspan></text><rect class="lbg" x="237.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="315.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="315.0" dy="0.0">forward</tspan></text><rect class="lbg" x="237.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="315.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="315.0" dy="0.0">∂L/∂y = −8</tspan></text><rect class="lbg" x="607.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="685.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="685.0" dy="0.0">∂L/∂w = −24</tspan></text><rect class="bx" x="415.0" y="39.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="67.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Input x = 3</tspan></text><rect class="bxa" x="785.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="870.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="870.0" dy="0.0">Weight w = 2</tspan></text><rect class="bx" x="415.0" y="435.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="463.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">y = w·x = 6</tspan></text><rect class="bx" x="45.0" y="227.0" width="170.0" height="66.0" rx="12"/><text class="t" x="130.0" y="255.6" text-anchor="middle" font-size="16"><tspan x="130.0" dy="0.0">Loss (y−10)² =</tspan><tspan x="130.0" dy="20.0">16</tspan></text></svg>