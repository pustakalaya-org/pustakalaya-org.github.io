<svg class="dg" viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Raw data never leaves the hospitals; only updates travel, and secure aggregation hides each one.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="482.0"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="482.0"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="482.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="482.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Server</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Hospital A</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Hospital B</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Hospital C</tspan></text></g><text class="n ml" x="240.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. global model v5</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="370.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">2. global model v5</tspan></text><line class="ln" x1="110.0" y1="145.0" x2="619.0" y2="145.0"/><polygon class="ah" points="630.0,145.0 619.0,138.9 619.0,151.1"/><text class="n ml" x="500.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. global model v5</tspan></text><line class="ln" x1="110.0" y1="190.0" x2="879.0" y2="190.0"/><polygon class="ah" points="890.0,190.0 879.0,183.9 879.0,196.1"/><text class="n" x="440.0" y="253.2" text-anchor="start" font-size="15"><tspan x="440.0" dy="0.0">4. train on local records</tspan></text><path class="ln" d="M370.0,235.0 H425.0 V261.0 H384.0"/><line class="ln" x1="390.0" y1="261.0" x2="384.0" y2="261.0"/><polygon class="ah" points="373.0,261.0 384.0,267.1 384.0,254.9"/><text class="n ml" x="240.0" y="278.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">5. masked update ΔA</tspan></text><line class="ln lnd" x1="370.0" y1="291.0" x2="121.0" y2="291.0"/><polygon class="ah" points="110.0,291.0 121.0,297.1 121.0,284.9"/><text class="n ml" x="370.0" y="323.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">6. masked update ΔB</tspan></text><line class="ln lnd" x1="630.0" y1="336.0" x2="121.0" y2="336.0"/><polygon class="ah" points="110.0,336.0 121.0,342.1 121.0,329.9"/><text class="n ml" x="500.0" y="368.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. masked update ΔC</tspan></text><line class="ln lnd" x1="890.0" y1="381.0" x2="121.0" y2="381.0"/><polygon class="ah" points="110.0,381.0 121.0,387.1 121.0,374.9"/><text class="n" x="180.0" y="434.9" text-anchor="start" font-size="15"><tspan x="180.0" dy="0.0">8. average → model v6 (+DP</tspan><tspan x="180.0" dy="18.8">noise)</tspan></text><path class="ln" d="M110.0,426.0 H165.0 V452.0 H124.0"/><line class="ln" x1="130.0" y1="452.0" x2="124.0" y2="452.0"/><polygon class="ah" points="113.0,452.0 124.0,458.1 124.0,445.9"/></svg>