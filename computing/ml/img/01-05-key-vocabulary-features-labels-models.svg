<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Training is the loop on the right; inference is just features in, prediction out.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="89.7" x2="720.1" y2="130.0"/><polygon class="ah" points="730.7,133.3 721.9,124.2 718.4,135.8"/><line class="ln" x1="820.4" y1="199.5" x2="820.4" y2="309.5"/><polygon class="ah" points="820.4,320.5 826.5,309.5 814.4,309.5"/><line class="ln" x1="730.4" y1="359.0" x2="280.6" y2="359.0"/><polygon class="ah" points="269.6,359.0 280.6,365.1 280.6,353.0"/><line class="ln" x1="410.2" y1="430.3" x2="279.9" y2="390.0"/><polygon class="ah" points="269.3,386.7 278.1,395.8 281.6,384.2"/><line class="ln" x1="179.6" y1="320.5" x2="179.6" y2="210.5"/><polygon class="ah" points="179.6,199.5 173.5,210.5 185.6,210.5"/><line class="ln" x1="269.6" y1="161.0" x2="719.4" y2="161.0"/><polygon class="ah" points="730.4,161.0 719.4,154.9 719.4,167.1"/><rect class="lbg" x="422.0" y="148.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="163.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">update</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Features (X)</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">inputs</tspan></text><rect class="bx" x="735.4" y="127.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="156.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Model</tspan></text><text class="n" x="820.4" y="179.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">parameters = weights</tspan></text><rect class="bx" x="735.4" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="354.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Prediction</tspan></text><text class="n" x="820.4" y="377.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">ŷ</tspan></text><rect class="bx" x="415.0" y="424.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="453.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Label (y)</tspan></text><text class="n" x="500.0" y="476.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">true answer</tspan></text><rect class="bxa" x="94.6" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="354.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Loss</tspan></text><text class="n" x="179.6" y="377.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">how wrong?</tspan></text><rect class="bx" x="94.6" y="127.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="156.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Optimiser</tspan></text><text class="n" x="179.6" y="179.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">updates parameters</tspan></text></svg>