<svg class="dg" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Demand is projected to more than double by 2030, with AI the largest driver of growth.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2024</tspan></text><rect class="bfill" x="280" y="14.0" width="183.3" height="28" rx="6"/><text class="n" x="473.3" y="33.0" text-anchor="start" font-size="15"><tspan x="473.3" dy="0.0">415 TWh</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2030 (proj.)</tspan></text><rect class="bfill" x="280" y="64.0" width="417.4" height="28" rx="6"/><text class="n" x="707.4" y="83.0" text-anchor="start" font-size="15"><tspan x="707.4" dy="0.0">~945 TWh</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2035 (proj.)</tspan></text><rect class="bfill" x="280" y="114.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="133.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~1,200 TWh</tspan></text></svg>