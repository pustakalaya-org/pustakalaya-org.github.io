<svg class="dg" viewBox="0 0 1000 162" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each generation got deeper or more efficient; ConvNeXt showed CNNs still compete with transformers.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="86.0" x2="980.0" y2="86.0"/><circle class="dot" cx="70.0" cy="86.0" r="9"/><line class="ln" x1="70.0" y1="77.0" x2="70.0" y2="68.0"/><text class="t" x="70.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1998 · LeNet-5</tspan></text><text class="n" x="70.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">digits, about 60k parameters</tspan></text><circle class="dot" cx="213.3" cy="86.0" r="9"/><line class="ln" x1="213.3" y1="95.0" x2="213.3" y2="106.0"/><text class="t" x="213.3" y="126.5" text-anchor="middle" font-size="17"><tspan x="213.3" dy="0.0">2012 · AlexNet</tspan></text><text class="n" x="213.3" y="148.0" text-anchor="middle" font-size="13"><tspan x="213.3" dy="0.0">ImageNet top-5 error 15.3%</tspan></text><circle class="dot" cx="356.7" cy="86.0" r="9"/><line class="ln" x1="356.7" y1="77.0" x2="356.7" y2="68.0"/><text class="t" x="356.7" y="42.5" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">2014 · VGG &amp; GoogLeNet</tspan></text><text class="n" x="356.7" y="64.0" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">deeper; Inception modules</tspan></text><circle class="dot" cx="500.0" cy="86.0" r="9"/><line class="ln" x1="500.0" y1="95.0" x2="500.0" y2="106.0"/><text class="t" x="500.0" y="126.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">2015 · ResNet &amp; U-Net</tspan></text><text class="n" x="500.0" y="148.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">152 layers; segmentation</tspan></text><circle class="dot" cx="643.3" cy="86.0" r="9"/><line class="ln" x1="643.3" y1="77.0" x2="643.3" y2="68.0"/><text class="t" x="643.3" y="42.5" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">2017 · MobileNet</tspan></text><text class="n" x="643.3" y="64.0" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">depthwise separable, phones</tspan></text><circle class="dot" cx="786.7" cy="86.0" r="9"/><line class="ln" x1="786.7" y1="95.0" x2="786.7" y2="106.0"/><text class="t" x="786.7" y="126.5" text-anchor="middle" font-size="17"><tspan x="786.7" dy="0.0">2019 · EfficientNet</tspan></text><text class="n" x="786.7" y="148.0" text-anchor="middle" font-size="13"><tspan x="786.7" dy="0.0">compound scaling</tspan></text><circle class="dot" cx="930.0" cy="86.0" r="9"/><line class="ln" x1="930.0" y1="77.0" x2="930.0" y2="68.0"/><text class="t" x="930.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2022 · ConvNeXt</tspan></text><text class="n" x="930.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">CNN modernised vs ViT</tspan></text></svg>