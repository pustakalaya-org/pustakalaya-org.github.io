<svg class="dg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Value flows down to chips and data; products sit on top of shared models.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Applications</tspan></text><text class="lab" x="4.0" y="178.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Models</tspan></text><text class="lab" x="4.0" y="300.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Platforms &amp;</tspan><tspan x="4.0" dy="17.5">tools</tspan></text><text class="lab" x="4.0" y="435.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Compute</tspan></text><text class="lab" x="4.0" y="566.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Rules &amp; research</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="150.0" y="-33.0" width="156.0" height="66.0" rx="12"/><text class="t" x="228.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="228.0" dy="0.0">Chat</tspan><tspan x="228.0" dy="20.0">assistants</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="322.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="400.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="400.0" dy="0.0">Coding agents</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="494.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Search &amp; ads</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="666.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="744.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="744.0" dy="0.0">Fraud &amp; risk</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="838.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="916.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="916.0" dy="0.0">Healthcare AI</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="150.0" y="-33.0" width="199.0" height="66.0" rx="12"/><text class="t" x="249.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="249.5" dy="0.0">Closed frontier</tspan><tspan x="249.5" dy="20.0">models</tspan></text></g><g transform="translate(0,173.0)"><rect class="bx" x="365.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="464.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="