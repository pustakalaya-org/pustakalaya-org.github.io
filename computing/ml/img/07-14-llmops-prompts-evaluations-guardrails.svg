<svg class="dg" viewBox="0 0 1000 575" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each arrow becomes a span in the trace, so failures and costs can be pinned to a step.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="568.2"/><line class="ln lnd life" x1="305.0" y1="76.5" x2="305.0" y2="568.2"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="568.2"/><line class="ln lnd life" x1="695.0" y1="76.5" x2="695.0" y2="568.2"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="568.2"/><g transform="translate(0,41.2)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">User</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="215.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="305.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">App +</tspan><tspan x="305.0" dy="22.5">guardrails</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Retriever</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">LLM</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Tracing</tspan></text></g><text class="n ml" x="207.5" y="110.2" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. question</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="294.0" y2="122.5"/><polygon class="ah" points="305.0,122.5 294.0,116.5 294.0,128.6"/><text class="n" x="375.0" y="176.4" text-anchor="start" font-size="15"><tspan x="375.0" dy="0.0">2. input check: injection,</tspan><tspan x="375.0" dy="18.8">PII</tspan></text><path class="ln" d="M305.0,167.5 H360.0 V193.5 H319.0"/><line class="ln" x1="325.0" y1="193.5" x2="319.0" y2="193.5"/><polygon class="ah" points="308.0,193.5 319.0,199.6 319.0,187.4"/><text class="n ml" x="402.5" y="192.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">3. search top-5</tspan><tspan x="402.5" dy="18.8">chunks</tspan></text><line class="ln" x1="305.0" y1="223.5" x2="489.0" y2="223.5"/><polygon class="ah" points="500.0,223.5 489.0,217.4 489.0,229.6"/><text class="n ml" x="402.5" y="275.0" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">4. chunks + scores</tspan></text><line class="ln lnd" x1="500.0" y1="287.2" x2="316.0" y2="287.2"/><polygon class="ah" points="305.0,287.2 316.0,293.3 316.0,281.2"/><text class="n ml" x="500.0" y="320.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. prompt v12 + context</tspan></text><line class="ln" x1="305.0" y1="332.2" x2="684.0" y2="332.2"/><polygon class="ah" points="695.0,332.2 684.0,326.2 684.0,338.3"/><text class="n ml" x="500.0" y="365.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. answer, 812 tokens</tspan></text><line class="ln lnd" x1="695.0" y1="377.2" x2="316.0" y2="377.2"/><polygon class="ah" points="305.0,377.2 316.0,383.3 316.0,371.2"/><text class="n" x="375.0" y="431.1" text-anchor="start" font-size="15"><tspan x="375.0" dy="0.0">7. output check: safety,</tspan><tspan x="375.0" dy="18.8">schema</tspan></text><path class="ln" d="M305.0,422.2 H360.0 V448.2 H319.0"/><line class="ln" x1="325.0" y1="448.2" x2="319.0" y2="448.2"/><polygon class="ah" points="308.0,448.2 319.0,454.3 319.0,442.2"/><text class="n ml" x="207.5" y="466.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">8. answer + citations</tspan></text><line class="ln lnd" x1="305.0" y1="478.2" x2="121.0" y2="478.2"/><polygon class="ah" points="110.0,478.2 121.0,484.3 121.0,472.2"/><text class="n ml" x="597.5" y="511.0" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">9. spans, cost, latency, feedback</tspan></text><line class="ln" x1="305.0" y1="523.2" x2="879.0" y2="523.2"/><polygon class="ah" points="890.0,523.2 879.0,517.2 879.0,529.3"/></svg>