lass="t" x="337.3" y="473.4" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Accelerated</tspan></text><text class="n" x="337.3" y="497.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">GPUs and AI chips: P, G,</tspan><tspan x="337.3" dy="16.9">Trn, N-series</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Burstable</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">AWS T, Azure B, Google E2</tspan></text><rect class="bx" x="106.8" y="111.6" width="200.0" height="84.9" rx="12"/><text class="t" x="206.8" y="141.1" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">HPC</tspan></text><text class="n" x="206.8" y="164.6" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">AWS Hpc, Azure HB/HX,</tspan><tspan x="206.8" dy="16.9">placement + EFA</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Choose an</tspan><tspan x="500.0" dy="26.2">instance</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">family → generation → size</tspan></text></svg>