<svg class="dg" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Start at the top with a broad view, then drill down only as far as needed.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="35.0" r="15"/><text class="bn" x="34.0" y="40.5" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="42.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Fleet &amp; services</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="54.0"/><text class="n" x="350.0" y="40.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">Prometheus, Grafana, Pyroscope</tspan></text><rect x="2" y="74.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.14;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="105.0" r="15"/><text class="bn" x="34.0" y="110.5" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="112.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Language runtime</tspan></text><line class="sep" x1="330.0" y1="86.0" x2="330.0" y2="124.0"/><text class="n" x="350.0" y="110.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">py-spy, async-profiler, Instruments</tspan></text><rect x="2" y="144.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.21;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="175.0" r="15"/><text class="bn" x="34.0" y="180.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="182.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Process &amp; functions</tspan></text><line class="sep" x1="330.0" y1="156.0" x2="330.0" y2="194.0"/><text class="n" x="350.0" y="180.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">perf, VTune, uProf, Valgrind, flame graphs</tspan></text><rect x="2" y="214.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.27;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="251.5" r="15"/><text class="bn" x="34.0" y="257.0" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="246.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Kernel &amp; system</tspan><tspan x="64.0" dy="25.0">calls</tspan></text><line class="sep" x1="330.0" y1="226.0" x2="330.0" y2="277.0"/><text class="n" x="350.0" y="257.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">bpftrace, BCC, WPR/WPA</tspan></text><rect x="2" y="297.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.34;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="334.5" r="15"/><text class="bn" x="34.0" y="340.0" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="329.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">CPU</tspan><tspan x="64.0" dy="25.0">microarchitecture</tspan></text><line class="sep" x1="330.0" y1="309.0" x2="330.0" y2="360.0"/><text class="n" x="350.0" y="340.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">Hardware counters, top-down analysis, Advisor</tspan></text><rect x="2" y="380.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="411.0" r="15"/><text class="bn" x="34.0" y="416.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="418.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">GPU</tspan></text><line class="sep" x1="330.0" y1="392.0" x2="330.0" y2="430.0"/><text class="n" x="350.0" y="416.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">nvidia-smi, amd-smi, nsys, ncu</tspan></text></svg>