<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Everything a small product needs sits on one chip around the CPU core.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="111.0"/><line class="ln" x1="556.8" y1="250.7" x2="687.9" y2="159.8"/><line class="ln" x1="620.0" y1="277.7" x2="764.3" y2="262.9"/><line class="ln" x1="613.5" y1="328.1" x2="720.0" y2="363.8"/><line class="ln" x1="525.5" y1="330.7" x2="604.3" y2="456.6"/><line class="ln" x1="474.5" y1="330.7" x2="395.7" y2="456.6"/><line class="ln" x1="386.5" y1="328.1" x2="280.0" y2="363.8"/><line class="ln" x1="380.0" y1="277.7" x2="235.7" y2="262.9"/><line class="ln" x1="443.2" y1="250.7" x2="312.1" y2="159.8"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Flash</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Program code, KB to MB</tspan></text><rect class="bx" x="641.0" y="89.0" width="200.0" height="68.0" rx="12"/><text class="t" x="741.0" y="118.5" text-anchor="middle" font-size="17"><tspan x="741.0" dy="0.0">SRAM</tspan></text><text class="n" x="741.0" y="142.0" text-anchor="middle" font-size="13"><tspan x="741.0" dy="0.0">Variables and stack</tspan></text><rect class="bx" x="769.3" y="218.1" width="200.0" height="68.0" rx="12"/><text class="t" x="869.3" y="247.6" text-anchor="middle" font-size="17"><tspan x="869.3" dy="0.0">GPIO</tspan></text><text class="n" x="869.3" y="271.1" text-anchor="middle" font-size="13"><tspan x="869.3" dy="0.0">Digital pins</tspan></text><rect class="bx" x="724.8" y="365.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="394.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">ADC / DAC</tspan></text><text class="n" x="824.8" y="418.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">Analogue in and out</tspan></text><rect class="bx" x="528.3" y="460.9" width="200.0" height="68.0" rx="12"/><text class="t" x="628.3" y="490.3" text-anchor="middle" font-size="17"><tspan x="628.3" dy="0.0">Timers &amp; PWM</tspan></text><text class="n" x="628.3" y="513.9" text-anchor="middle" font-size="13"><tspan x="628.3" dy="0.0">Timing, motors, LEDs</tspan></text><rect class="bx" x="271.7" y="460.9" width="200.0" height="68.0" rx="12"/><text class="t" x="371.7" y="490.3" text-anchor="middle" font-size="17"><tspan x="371.7" dy="0.0">I2C, SPI, UART</tspan></text><text class="n" x="371.7" y="513.9" text-anchor="middle" font-size="13"><tspan x="371.7" dy="0.0">Talk to sensors</tspan></text><rect class="bx" x="75.2" y="356.6" width="200.0" height="84.9" rx="12"/><text class="t" x="175.2" y="386.0" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Radio</tspan></text><text class="n" x="175.2" y="409.6" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">Wi-Fi, Bluetooth LE,</tspan><tspan x="175.2" dy="16.9">Thread</tspan></text><rect class="bx" x="30.7" y="218.1" width="200.0" height="68.0" rx="12"/><text class="t" x="130.7" y="247.6" text-anchor="middle" font-size="17"><tspan x="130.7" dy="0.0">Debug port</tspan></text><text class="n" x="130.7" y="271.1" text-anchor="middle" font-size="13"><tspan x="130.7" dy="0.0">SWD or JTAG</tspan></text><rect class="bx" x="159.0" y="89.0" width="200.0" height="68.0" rx="12"/><text class="t" x="259.0" y="118.5" text-anchor="middle" font-size="17"><tspan x="259.0" dy="0.0">Power &amp; clocks</tspan></text><text class="n" x="259.0" y="142.0" text-anchor="middle" font-size="13"><tspan x="259.0" dy="0.0">Sleep modes, oscillators</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">CPU core</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">Arm Cortex-M or RISC-V</tspan></text></svg>