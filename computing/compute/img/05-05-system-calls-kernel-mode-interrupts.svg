<svg class="dg" viewBox="0 0 1000 433" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The CPU switches mode twice per call — one reason batched interfaces such as io_uring are faster.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="426.2"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="426.2"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="426.2"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="426.2"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">App</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">glibc</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Kernel</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">SSD driver</tspan></text></g><text class="n ml" x="240.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. read(fd, buf, 4096)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="114.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. syscall, rax=0 → kernel</tspan><tspan x="500.0" dy="18.8">mode</tspan></text><line class="ln" x1="370.0" y1="145.0" x2="619.0" y2="145.0"/><polygon class="ah" points="630.0,145.0 619.0,138.9 619.0,151.1"/><text class="n ml" x="760.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. page-cache miss: submit</tspan><tspan x="760.0" dy="18.8">I/O</tspan></text><line class="ln" x1="630.0" y1="208.8" x2="879.0" y2="208.8"/><polygon class="ah" points="890.0,208.8 879.0,202.7 879.0,214.8"/><text class="n ml" x="760.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. interrupt: data in RAM via</tspan><tspan x="760.0" dy="18.8">DMA</tspan></text><line class="ln lnd" x1="890.0" y1="272.5" x2="641.0" y2="272.5"/><polygon class="ah" points="630.0,272.5 641.0,278.6 641.0,266.4"/><text class="n ml" x="500.0" y="324.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. return 4096 → user mode</tspan></text><line class="ln lnd" x1="630.0" y1="336.2" x2="381.0" y2="336.2"/><polygon class="ah" points="370.0,336.2 381.0,342.3 381.0,330.2"/><text class="n ml" x="240.0" y="369.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">6. 4096 bytes read</tspan></text><line class="ln lnd" x1="370.0" y1="381.2" x2="121.0" y2="381.2"/><polygon class="ah" points="110.0,381.2 121.0,387.3 121.0,375.2"/></svg>