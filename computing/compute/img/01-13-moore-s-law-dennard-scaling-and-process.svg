<svg class="dg" viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>On a log scale about 26 doublings in 53 years look like steady growth — Moore&#x27;s law in one picture.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Intel 4004 (1971)</tspan></text><rect class="bfill" x="280" y="14.0" width="19.3" height="28" rx="6"/><text class="n" x="309.3" y="33.0" text-anchor="start" font-size="15"><tspan x="309.3" dy="0.0">2,300</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Intel 8086 (1978)</tspan></text><rect class="bfill" x="280" y="64.0" width="89.9" height="28" rx="6"/><text class="n" x="379.9" y="83.0" text-anchor="start" font-size="15"><tspan x="379.9" dy="0.0">29,000</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Intel 486 (1989)</tspan></text><rect class="bfill" x="280" y="114.0" width="193.7" height="28" rx="6"/><text class="n" x="483.7" y="133.0" text-anchor="start" font-size="15"><tspan x="483.7" dy="0.0">1.2 million</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Pentium 4 (2000)</tspan></text><rect class="bfill" x="280" y="164.0" width="292.8" height="28" rx="6"/><text class="n" x="582.8" y="183.0" text-anchor="start" font-size="15"><tspan x="582.8" dy="0.0">42 million</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Core 2 Duo (2006)</tspan></text><rect class="bfill" x="280" y="214.0" width="346.8" height="28" rx="6"/><text class="n" x="636.8" y="233.0" text-anchor="start" font-size="15"><tspan x="636.8" dy="0.0">291 million</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">NVIDIA GK110 (2012)</tspan></text><rect class="bfill" x="280" y="264.0" width="435.8" height="28" rx="6"/><text class="n" x="725.8" y="283.0" text-anchor="start" font-size="15"><tspan x="725.8" dy="0.0">7.1 billion</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">NVIDIA H100 (2022)</tspan></text><rect class="bfill" x="280" y="314.0" width="503.4" height="28" rx="6"/><text class="n" x="793.4" y="333.0" text-anchor="start" font-size="15"><tspan x="793.4" dy="0.0">80 billion</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"