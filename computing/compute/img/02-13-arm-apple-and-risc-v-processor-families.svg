ass="t" x="249.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="249.5" dy="0.0">Graviton, Axion,</tspan><tspan x="249.5" dy="20.0">Cobalt</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="365.0" y="-33.0" width="199.0" height="66.0" rx="12"/><text class="t" x="464.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="464.5" dy="0.0">Apple M5,</tspan><tspan x="464.5" dy="20.0">Snapdragon X2</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="580.0" y="-33.0" width="199.0" height="66.0" rx="12"/><text class="t" x="679.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="679.5" dy="0.0">NVIDIA Grace /</tspan><tspan x="679.5" dy="20.0">Vera</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="795.0" y="-33.0" width="199.0" height="66.0" rx="12"/><text class="t" x="894.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="894.5" dy="0.0">RISC-V boards and</tspan><tspan x="894.5" dy="20.0">SoCs</tspan></text></g></svg>