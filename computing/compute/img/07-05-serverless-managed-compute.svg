<svg class="dg" viewBox="0 0 1000 594" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Only the first request after a quiet spell pays the cold-start set-up cost.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="587.5"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="587.5"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="587.5"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="587.5"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Browser</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">API Gateway</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Lambda service</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Execution env</tspan></text></g><text class="n ml" x="240.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. POST /donate</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Invoke with event JSON</tspan></text><line class="ln" x1="370.0" y1="145.0" x2="619.0" y2="145.0"/><polygon class="ah" points="630.0,145.0 619.0,138.9 619.0,151.1"/><text class="n ml" x="760.0" y="159.0" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. Cold start: new microVM,</tspan><tspan x="760.0" dy="18.8">load code, run init</tspan></text><line class="ln" x1="630.0" y1="190.0" x2="879.0" y2="190.0"/><polygon class="ah" points="890.0,190.0 879.0,183.9 879.0,196.1"/><text class="n ml" x="760.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. Handler returns 200</tspan></text><line class="ln lnd" x1="890.0" y1="253.8" x2="641.0" y2="253.8"/><polygon class="ah" points="630.0,253.8 641.0,259.8 641.0,247.7"/><text class="n ml" x="500.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Result</tspan></text><line class="ln lnd" x1="630.0" y1="298.8" x2="381.0" y2="298.8"/><polygon class="ah" points="370.0,298.8 381.0,304.8 381.0,292.7"/><text class="n ml" x="240.0" y="331.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">6. 200 OK</tspan></text><line class="ln lnd" x1="370.0" y1="343.8" x2="121.0" y2="343.8"/><polygon class="ah" points="110.0,343.8 121.0,349.8 121.0,337.7"/><text class="n ml" x="240.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">7. Next POST /donate</tspan></text><line class="ln" x1="110.0" y1="388.8" x2="359.0" y2="388.8"/><polygon class="ah" points="370.0,388.8 359.0,382.7 359.0,394.8"/><text class="n ml" x="500.0" y="421.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. Invoke</tspan></text><line class="ln" x1="370.0" y1="433.8" x2="619.0" y2="433.8"/><polygon class="ah" points="630.0,433.8 619.0,427.7 619.0,439.8"/><text class="n ml" x="760.0" y="447.8" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">9. Warm start: reuse</tspan><tspan x="760.0" dy="18.8">environment</tspan></text><line class="ln" x1="630.0" y1="478.8" x2="879.0" y2="478.8"/><polygon class="ah" points="890.0,478.8 879.0,472.7 879.0,484.8"/><text class="n ml" x="500.0" y="530.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">10. 200 OK in milliseconds</tspan></text><line class="ln lnd" x1="890.0" y1="542.5" x2="121.0" y2="542.5"/><polygon class="ah" points="110.0,542.5 121.0,548.5 121.0,536.5"/></svg>