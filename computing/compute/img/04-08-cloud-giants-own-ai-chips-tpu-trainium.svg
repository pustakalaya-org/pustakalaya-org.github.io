<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each cloud builds chips for its own workloads, mostly with design partners and TSMC manufacturing.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="235.4" x2="500.0" y2="119.5"/><line class="ln" x1="611.6" y1="238.3" x2="715.3" y2="190.2"/><line class="ln" x1="620.0" y1="305.9" x2="760.6" y2="324.6"/><line class="ln" x1="544.3" y1="343.5" x2="631.4" y2="448.6"/><line class="ln" x1="455.7" y1="343.5" x2="375.6" y2="440.1"/><line class="ln" x1="380.0" y1="305.9" x2="239.4" y2="324.6"/><line class="ln" x1="388.4" y1="238.3" x2="302.9" y2="198.6"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Google TPU</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">v5e/v5p, Trillium,</tspan><tspan x="500.0" dy="16.9">Ironwood, TPU 8</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">AWS Trainium</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">Trn2 and Trn3 UltraServers</tspan></text><rect class="bx" x="765.6" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="865.6" y="334.0" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">AWS Inferentia</tspan></text><text class="n" x="865.6" y="357.5" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">Inf2 low-cost inference</tspan></text><rect class="bx" x="562.7" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="662.7" y="481.9" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Microsoft Maia</tspan></text><text class="n" x="662.7" y="505.4" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">Maia 100, Maia 200 (2026)</tspan></text><rect class="bx" x="237.3" y="444.0" width="200.0" height="84.9" rx="12"/><text class="t" x="337.3" y="473.4" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Meta MTIA</tspan></text><text class="n" x="337.3" y="497.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">internal ranking and</tspan><tspan x="337.3" dy="16.9">recommendation</tspan></text><rect class="bx" x="34.4" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="134.4" y="325.5" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Design partners</tspan></text><text class="n" x="134.4" y="349.1" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">Broadcom, Marvell, Alchip,</tspan><tspan x="134.4" dy="16.9">GUC</tspan></text><rect class="bx" x="106.8" y="111.6" width="200.0" height="84.9" rx="12"/><text class="t" x="206.8" y="141.1" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Foundry and HBM</tspan></text><text class="n" x="206.8" y="164.6" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">TSMC plus SK hynix,</tspan><tspan x="206.8" dy="16.9">Samsung, Micron</tspan></text><rect class="bxa" x="385.0" y="240.4" width="230.0" height="99.2" rx="12"/><text class="t" x="500.0" y="273.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Custom cloud AI</tspan><tspan x="500.0" dy="26.2">chips</tspan></text><text class="n" x="500.0" y="324.6" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">rented as cloud services</tspan></text></svg>