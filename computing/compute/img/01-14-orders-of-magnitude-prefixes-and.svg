<svg class="dg" viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each step to the right is roughly 10-1,000× slower — design around the big gaps, not the small ones.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">CPU cycle (3 GHz)</tspan></text><rect class="bfill" x="280" y="14.0" width="18.4" height="28" rx="6"/><text class="n" x="308.4" y="33.0" text-anchor="start" font-size="15"><tspan x="308.4" dy="0.0">0.3 ns</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">L1 cache hit</tspan></text><rect class="bfill" x="280" y="64.0" width="47.8" height="28" rx="6"/><text class="n" x="337.8" y="83.0" text-anchor="start" font-size="15"><tspan x="337.8" dy="0.0">~1 ns</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">L3 cache hit</tspan></text><rect class="bfill" x="280" y="114.0" width="119.9" height="28" rx="6"/><text class="n" x="409.9" y="133.0" text-anchor="start" font-size="15"><tspan x="409.9" dy="0.0">~15 ns</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">DRAM access</tspan></text><rect class="bfill" x="280" y="164.0" width="170.3" height="28" rx="6"/><text class="n" x="460.3" y="183.0" text-anchor="start" font-size="15"><tspan x="460.3" dy="0.0">~100 ns</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">NVMe SSD read</tspan></text><rect class="bfill" x="280" y="214.0" width="354.0" height="28" rx="6"/><text class="n" x="644.0" y="233.0" text-anchor="start" font-size="15"><tspan x="644.0" dy="0.0">~100 µs</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Same-data-centre round trip</tspan></text><rect class="bfill" x="280" y="264.0" width="396.8" height="28" rx="6"/><text class="n" x="686.8" y="283.0" text-anchor="start" font-size="15"><tspan x="686.8" dy="0.0">~0.5 ms</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Hard-disk seek</tspan></text><rect class="bfill" x="280" y="314.0" width="458.0" height="28" rx="6"/><text class="n" x="748.0" y="333.0" text-anchor="start" font-size="15"><tspan x="748.0" dy="0.0">~5 ms</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">London-New York round trip</tspan></text><rect class="bfill" x="280" y="364.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="383.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~75 ms</tspan></text><text class="n" x="996.0" y="418.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>