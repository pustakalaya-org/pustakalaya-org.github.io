<svg class="dg" viewBox="0 0 1000 368" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Start at the top and finish one project before starting the next.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Beginner</tspan></text><text class="lab" x="4.0" y="188.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Intermediate</tspan></text><text class="lab" x="4.0" y="334.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Advanced</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="150.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="249.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="249.5" dy="0.0">Logic-sim CPU</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="365.0" y="-33.0" width="199.0" height="66.0" rx="12"/><text class="t" x="464.5" y="-4.4" text-anchor="middle" font-size="16"><tspan x="464.5" dy="0.0">Benchmark your</tspan><tspan x="464.5" dy="20.0">laptop</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="580.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="679.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="679.5" dy="0.0">CUDA notebook</tspan></text></g><g transform="translate(0,37.0)"><rect class="bx" x="795.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="894.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="894.5" dy="0.0">Sensor node</tspan></text></g><g transform="translate(0,183.0)"><rect class="bx" x="150.0" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="203.4" y="-4.4" text-anchor="middle" font-size="16"><tspan x="203.4" dy="0.0">FPGA</tspan><tspan x="203.4" dy="20.0">Verilog</tspan></text></g><g transform="translate(0,183.0)"><rect class="bx" x="272.9" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="326.3" y="-4.4" text-anchor="middle" font-size="16"><tspan x="326.3" dy="0.0">Pi</tspan><tspan x="326.3" dy="20.0">cluster</tspan></text></g><g transform="translate(0,183.0)"><rect class="bx" x="395.7" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="449.1" y="-4.4" text-anchor="middle" font-size="16"><tspan x="449.1" dy="0.0">Proxmox</tspan><tspan x="449.1" dy="20.0">homelab</tspan></text></g><g transform="translate(0,183.0)"><rect class="bx" x="518.6" y="-33.0" width="106.9" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572