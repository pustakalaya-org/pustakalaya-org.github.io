<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Local memory is fastest; reaching the other socket&#x27;s memory crosses the inter-socket link and adds latency.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="870.0" y2="260.0"/><line class="ln" x1="500.0" y1="458.0" x2="130.0" y2="260.0"/><line class="ln" x1="500.0" y1="62.0" x2="500.0" y2="458.0"/><rect class="lbg" x="607.0" y="148.0" width="156" height="23.0" rx="6"/><text class="n" x="685.0" y="163.0" text-anchor="middle" font-size="13"><tspan x="685.0" dy="0.0">local: fastest</tspan></text><rect class="lbg" x="237.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="315.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="315.0" dy="0.0">local: fastest</tspan></text><rect class="lbg" x="422.0" y="247.0" width="156" height="39.2" rx="6"/><text class="n" x="500.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">UPI / Infinity</tspan><tspan x="500.0" dy="16.2">Fabric: remote hops</tspan></text><rect class="bx" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Socket 0 cores</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">many cores sharing an</tspan><tspan x="500.0" dy="16.9">L3</tspan></text><rect class="bx" x="785.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="870.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="870.0" dy="0.0">DRAM node 0</tspan></text><text class="n" x="870.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="870.0" dy="0.0">local to socket 0</tspan></text><rect class="bx" x="415.0" y="416.1" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="444.7" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Socket 1 cores</tspan></text><text class="n" x="500.0" y="468.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">many cores sharing an</tspan><tspan x="500.0" dy="16.9">L3</tspan></text><rect class="bx" x="45.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="130.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="130.0" dy="0.0">DRAM node 1</tspan></text><text class="n" x="130.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="130.0" dy="0.0">local to socket 1</tspan></text></svg>