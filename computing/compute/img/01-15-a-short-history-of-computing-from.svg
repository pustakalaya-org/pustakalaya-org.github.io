<svg class="dg" viewBox="0 0 1000 237" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each milestone made computing smaller, cheaper or faster — usually all three.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="123.5" x2="980.0" y2="123.5"/><circle class="dot" cx="70.0" cy="123.5" r="9"/><line class="ln" x1="70.0" y1="114.5" x2="70.0" y2="105.5"/><text class="t" x="70.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1837 · Analytical</tspan><tspan x="70.0" dy="21.2">Engine</tspan></text><text class="n" x="70.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Babbage&#x27;s mechanical</tspan><tspan x="70.0" dy="16.2">general-purpose design</tspan></text><circle class="dot" cx="165.6" cy="123.5" r="9"/><line class="ln" x1="165.6" y1="132.5" x2="165.6" y2="143.5"/><text class="t" x="165.6" y="163.9" text-anchor="middle" font-size="17"><tspan x="165.6" dy="0.0">1936 · Turing</tspan><tspan x="165.6" dy="21.2">machine</tspan></text><text class="n" x="165.6" y="206.8" text-anchor="middle" font-size="13"><tspan x="165.6" dy="0.0">defines what can be</tspan><tspan x="165.6" dy="16.2">computed</tspan></text><circle class="dot" cx="261.1" cy="123.5" r="9"/><line class="ln" x1="261.1" y1="114.5" x2="261.1" y2="105.5"/><text class="t" x="261.1" y="42.5" text-anchor="middle" font-size="17"><tspan x="261.1" dy="0.0">1945 ·</tspan><tspan x="261.1" dy="21.2">ENIAC/EDVAC</tspan></text><text class="n" x="261.1" y="85.2" text-anchor="middle" font-size="13"><tspan x="261.1" dy="0.0">electronic computing;</tspan><tspan x="261.1" dy="16.2">stored-program plan</tspan></text><circle class="dot" cx="356.7" cy="123.5" r="9"/><line class="ln" x1="356.7" y1="132.5" x2="356.7" y2="143.5"/><text class="t" x="356.7" y="163.9" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">1947 · Transistor</tspan></text><text class="n" x="356.7" y="185.5" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">Bell Labs replaces vacuum</tspan><tspan x="356.7" dy="16.2">tubes</tspan></text><circle class="dot" cx="452.2" cy="123.5" r="9"/><line class="ln" x1="452.2" y1="114.5" x2="452.2" y2="105.5"/><text class="t" x="452.2" y="58.7" text-anchor="middle" font-size="17"><tspan x="452.2" dy="0.0">1958-59 ·</tspan><tspan x="452.2" dy="21.2">Integrated…</tspan></text><text class="n" x="452.2" y="101.5" text-anchor="middle" font-size="13"><tspan x="452.2" dy="0.0">Kilby and Noyce</tspan></text><circle class="dot" cx="547.8" cy="123.5" r="9"/><line class="ln" x1="547.8" y1="132.5" x2="547.8" y2="143.5"/><text class="t" x="547.8" y="163.9" text-anchor="middle" font-size="17"><tspan x="547.8" dy="0.0">1971 · Intel 4004</tspan></text><text class="n" x="547.8" y="185.5" text-anchor="middle" font-size="13"><tspan x="547.8" dy="0.0">first commercial</tspan><tspan x="547.8" dy="16.2">microprocessor</tspan></text><circle class="dot" cx="643.3" cy="123.5" r="9"/><line class="ln" x1="643.3" y1="114.5" x2="643.3" y2="105.5"/><text class="t" x="643.3" y="63.7" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">1981 · IBM PC</tspan></text><text class="n" x="643.3" y="85.2" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">the PC-compatible</tspan><tspan x="643.3" dy="16.2">industry begins</tspan></text><circle class="dot" cx="738.9" cy="123.5" r="9"/><line class="ln" x1="738.9" y1="132.5" x2="738.9" y2="143.5"/><text class="t" x="738.9" y="163.9" text-anchor="middle" font-size="17"><tspan x="738.9" dy="0.0">2007 · iPhone</tspan></text><text class="n" x="738.9" y="185.5" text-anchor="middle" font-size="13"><tspan x="738.9" dy="0.0">smartphones put computers</tspan><tspan x="738.9" dy="16.2">in pockets</tspan></text><circle class="dot" cx="834.4" cy="123.5" r="9"/><line class="ln" x1="834.4" y1="114.5" x2="834.4" y2="105.5"/><text class="t" x="834.4" y="63.7" text-anchor="middle" font-size="17"><tspan x="834.4" dy="0.0">2012 · AlexNet</tspan></text><text class="n" x="834.4" y="85.2" text-anchor="middle" font-size="13"><tspan x="834.4" dy="0.0">GPUs launch the</tspan><tspan x="834.4" dy="16.2">deep-learning boom</tspan></text><circle class="dot" cx="930.0" cy="123.5" r="9"/><line class="ln" x1="930.0" y1="132.5" x2="930.0" y2="143.5"/><text class="t" x="930.0" y="163.9" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2022 · Frontier</tspan></text><text class="n" x="930.0" y="185.5" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">first official exascale</tspan><tspan x="930.0" 