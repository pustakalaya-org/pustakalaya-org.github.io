<svg class="dg" viewBox="0 0 1000 192" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every leaf links to every spine, so any rack-to-rack path is leaf, spine, leaf.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="37.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Spines</tspan></text><line class="ln" x1="249.5" y1="55.0" x2="213.7" y2="135.0"/><line class="ln" x1="249.5" y1="55.0" x2="357.0" y2="135.0"/><line class="ln" x1="249.5" y1="55.0" x2="500.3" y2="135.0"/><line class="ln" x1="249.5" y1="55.0" x2="643.7" y2="135.0"/><line class="ln" x1="249.5" y1="55.0" x2="787.0" y2="135.0"/><line class="ln" x1="249.5" y1="55.0" x2="930.3" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="213.7" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="357.0" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="500.3" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="643.7" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="787.0" y2="135.0"/><line class="ln" x1="464.5" y1="55.0" x2="930.3" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="213.7" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="357.0" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="500.3" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="643.7" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="787.0" y2="135.0"/><line class="ln" x1="679.5" y1="55.0" x2="930.3" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="213.7" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="357.0" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="500.3" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="643.7" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="787.0" y2="135.0"/><line class="ln" x1="894.5" y1="55.0" x2="930.3" y2="135.0"/><text class="lab" x="4.0" y="163.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Leaves (ToR)</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="150.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="249.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="249.5" dy="0.0">Spine 1</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="365.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="464.5" y="5.6" text-anchor="middle" font-size="16"><tspan x="464.5" dy="0.0">Spine 2</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="580.0" y="-23.0" width="199.0" height="46.0" rx="12"/><text class="t" x="679.5" y="5.6" text-anchor="middle" font-s