<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The IP address picks the machine; the destination port picks the program that receives the data.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="111.0" x2="500.0" y2="215.3"/><polygon class="ah" points="500.0,226.3 506.1,215.3 493.9,215.3"/><line class="ln" x1="702.4" y1="172.4" x2="614.9" y2="223.2"/><polygon class="ah" points="605.3,228.8 617.9,228.5 611.8,218.0"/><line class="ln" x1="770.0" y1="290.0" x2="631.0" y2="290.0"/><polygon class="ah" points="620.0,290.0 631.0,296.1 631.0,283.9"/><line class="ln" x1="702.4" y1="407.6" x2="614.9" y2="356.8"/><polygon class="ah" points="605.3,351.2 611.8,362.0 617.9,351.5"/><line class="ln" x1="500.0" y1="469.0" x2="500.0" y2="364.7"/><polygon class="ah" points="500.0,353.7 493.9,364.7 506.1,364.7"/><line class="ln" x1="297.6" y1="407.6" x2="385.1" y2="356.8"/><polygon class="ah" points="394.7,351.2 382.1,351.5 388.2,362.0"/><line class="ln" x1="230.0" y1="290.0" x2="369.0" y2="290.0"/><polygon class="ah" points="380.0,290.0 369.0,283.9 369.0,296.1"/><line class="ln" x1="297.6" y1="172.4" x2="385.1" y2="223.2"/><polygon class="ah" points="394.7,228.8 388.2,218.0 382.1,228.5"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">TCP 22</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">SSH / SFTP</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">TCP 25 / 587</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">SMTP relay / submission</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">UDP+TCP 53</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">DNS</tspan></text><rect class="bx" x="665.2" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="439.6" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">TCP 80</tspan></text><text class="n" x="765.2" y="463.1" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">HTTP</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">TCP+UDP 443</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">HTTPS, HTTP/3</tspan></text><rect class="bx" x="134.8" y="410.1" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="439.6" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">TCP 993</tspan></text><text class="n" x="234.8" y="463.1" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">IMAPS</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">TCP 3389</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">RDP</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">UDP 123</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">NTP</tspan></text><rect class="bxa" x="385.0" y="231.3" width="230.0" height="117.5" rx="12"/><text class="t" x="500.0" y="264.1" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Server</tspan><tspan x="500.0" dy="26.2">203.0.113.10</tspan></text><text class="n" x="500.0" y="315.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">OS hands traffic to the</tspan><tspan x="500.0" dy="18.2">listening process</tspan></text></svg>