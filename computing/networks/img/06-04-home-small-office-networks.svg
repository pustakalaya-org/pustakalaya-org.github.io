<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>One router joins everything; the guest network reaches only the internet.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="789.3" y2="136.5"/><line class="ln" x1="789.3" y1="136.5" x2="860.7" y2="304.1"/><line class="ln" x1="860.7" y1="304.1" x2="660.5" y2="438.4"/><line class="ln" x1="660.5" y1="438.4" x2="339.5" y2="438.4"/><line class="ln" x1="860.7" y1="304.1" x2="139.3" y2="304.1"/><line class="ln" x1="860.7" y1="304.1" x2="210.7" y2="136.5"/><rect class="lbg" x="566.6" y="86.3" width="156" height="23.0" rx="6"/><text class="n" x="644.6" y="101.3" text-anchor="middle" font-size="13"><tspan x="644.6" dy="0.0">fibre</tspan></text><rect class="lbg" x="747.0" y="207.3" width="156" height="23.0" rx="6"/><text class="n" x="825.0" y="222.3" text-anchor="middle" font-size="13"><tspan x="825.0" dy="0.0">Ethernet</tspan></text><rect class="lbg" x="682.6" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="760.6" y="373.2" text-anchor="middle" font-size="13"><tspan x="760.6" dy="0.0">Ethernet</tspan></text><rect class="lbg" x="422.0" y="425.4" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="440.4" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Ethernet</tspan></text><rect class="lbg" x="422.0" y="291.1" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="306.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">wireless backhaul</tspan></text><rect class="lbg" x="457.7" y="207.3" width="156" height="23.0" rx="6"/><text class="n" x="535.7" y="222.3" text-anchor="middle" font-size="13"><tspan x="535.7" dy="0.0">isolated VLAN</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Internet / ISP</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Public IP or CGNAT</tspan></text><rect class="bx" x="704.3" y="103.0" width="170.0" height="67.0" rx="12"/><text class="t" x="789.3" y="131.6" text-anchor="middle" font-size="16"><tspan x="789.3" dy="0.0">ONT or modem</tspan></text><text class="n" x="789.3" y="155.0" text-anchor="middle" font-size="13"><tspan x="789.3" dy="0.0">Fibre, cable or DSL</tspan></text><rect class="bxa" x="775.7" y="262.1" width="170.0" height="83.9" rx="12"/><text class="t" x="860.7" y="290.7" text-anchor="middle" font-size="16"><tspan x="860.7" dy="0.0">Home router</tspan></text><text class="n" x="860.7" y="314.1" text-anchor="middle" font-size="13"><tspan x="860.7" dy="0.0">NAT, DHCP, firewall,</tspan><tspan x="860.7" dy="16.9">Wi-Fi</tspan></text><rect class="bx" x="575.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="660.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="660.5" dy="0.0">Switch</tspan></text><text class="n" x="660.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="660.5" dy="0.0">TV, console, NAS</tspan></text><rect class="bx" x="254.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="339.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="339.5" dy="0.0">NAS</tspan></text><text class="n" x="339.5" y="456.9" text-anchor="middle" font-size="13"><tspan x="339.5" dy="0.0">Photos and backups</tspan></text><rect class="bx" x="54.3" y="262.1" width="170.0" height="83.9" rx="12"/><text class="t" x="139.3" y="290.7" text-anchor="middle" font-size="16"><tspan x="139.3" dy="0.0">Mesh node</tspan></text><text class="n" x="139.3" y="314.1" text-anchor="middle" font-size="13"><tspan x="139.3" dy="0.0">Upstairs phones and</tspan><tspan x="139.3" dy="16.9">laptops</tspan></text><rect class="bx" x="125.7" y="93.0" width="170.0" height="87.0" rx="12"/><text class="t" x="210.7" y="121.6" text-anchor="middle" font-size="16"><tspan x="210.7" dy="0.0">Guest / IoT</tspan><tspan x="210.7" dy="20.0">SSID</tspan></text><text class="n" x="210.7" y="165.0" text-anchor="middle" font-size="13"><tspan x="210.7" dy="0.0">Internet only</tspan></text></svg>