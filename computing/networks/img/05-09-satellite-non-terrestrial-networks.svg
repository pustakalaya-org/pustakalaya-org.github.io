<svg class="dg" viewBox="0 0 1000 228" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Physics sets the floor: a GEO round trip travels about 140,000 km before any processing.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Fibre, same country</tspan></text><rect class="bfill" x="280" y="14.0" width="83.6" height="28" rx="6"/><text class="n" x="373.6" y="33.0" text-anchor="start" font-size="15"><tspan x="373.6" dy="0.0">~10-20 ms</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">LEO (~550 km)</tspan></text><rect class="bfill" x="280" y="64.0" width="186.1" height="28" rx="6"/><text class="n" x="476.1" y="83.0" text-anchor="start" font-size="15"><tspan x="476.1" dy="0.0">~25-50 ms</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">MEO (~8,000 km)</tspan></text><rect class="bfill" x="280" y="114.0" width="362.2" height="28" rx="6"/><text class="n" x="652.2" y="133.0" text-anchor="start" font-size="15"><tspan x="652.2" dy="0.0">~100-150 ms</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">GEO (35,786 km)</tspan></text><rect class="bfill" x="280" y="164.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="183.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~600 ms+</tspan></text><text class="n" x="996.0" y="218.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>