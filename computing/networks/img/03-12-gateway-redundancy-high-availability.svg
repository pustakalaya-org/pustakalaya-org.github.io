<svg class="dg" viewBox="0 0 1000 410" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Hosts never change their gateway setting; the virtual IP and MAC simply move to the backup.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="403.5"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="403.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="403.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="5.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="110.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">PCs (gw</tspan><tspan x="110.0" dy="22.5">10.10.10.1)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="395.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="500.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">R1 master (prio</tspan><tspan x="500.0" dy="22.5">120)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="785.0" y="-35.2" width="210.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">R2 backup (prio</tspan><tspan x="890.0" dy="22.5">100)</tspan></text></g><text class="n ml" x="695.0" y="110.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">1. VRRP advert every 1 s (224.0.0.18)</tspan></text><line class="ln" x1="500.0" y1="122.5" x2="879.0" y2="122.5"/><polygon class="ah" points="890.0,122.5 879.0,116.5 879.0,128.6"/><text class="n ml" x="305.0" y="155.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">2. Traffic to virtual MAC 00:00:5e:00:01:0a</tspan></text><line class="ln" x1="110.0" y1="167.5" x2="489.0" y2="167.5"/><polygon class="ah" points="500.0,167.5 489.0,161.4 489.0,173.6"/><text class="n ml" x="695.0" y="200.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">3. R1 power fails: adverts stop</tspan></text><line class="ln lnd" x1="500.0" y1="212.5" x2="879.0" y2="212.5"/><polygon class="ah" points="890.0,212.5 879.0,206.4 879.0,218.6"/><text class="n" x="820.0" y="266.4" text-anchor="end" font-size="15"><tspan x="820.0" dy="0.0">4. Master-down timer (~3.6</tspan><tspan x="820.0" dy="18.8">s) expires</tspan></text><path class="ln" d="M890.0,257.5 H835.0 V283.5 H876.0"/><line class="ln" x1="870.0" y1="283.5" x2="876.0" y2="283.5"/><polygon class="ah" points="887.0,283.5 876.0,277.4 876.0,289.6"/><text class="n ml" x="500.0" y="301.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Gratuitous ARP: 10.10.10.1 at virtual MAC</tspan></text><line class="ln" x1="890.0" y1="313.5" x2="121.0" y2="313.5"/><polygon class="ah" points="110.0,313.5 121.0,319.6 121.0,307.4"/><text class="n ml" x="500.0" y="346.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Traffic continues via R2</tspan></text><line class="ln" x1="110.0" y1="358.5" x2="879.0" y2="358.5"/><polygon class="ah" points="890.0,358.5 879.0,352.4 879.0,364.6"/></svg>