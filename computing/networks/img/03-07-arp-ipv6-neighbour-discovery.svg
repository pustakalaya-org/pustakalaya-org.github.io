<svg class="dg" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The request is broadcast to everyone, but the reply is unicast back to the asker only.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="343.8"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="343.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="343.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Maria&#x27;s PC .10</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">Switch</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Printer .30</tspan></text></g><text class="n ml" x="305.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. ARP request (to ff:ff:ff:ff:ff:ff): who has</tspan><tspan x="305.0" dy="18.8">.30?</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="489.0" y2="100.0"/><polygon class="ah" points="500.0,100.0 489.0,94.0 489.0,106.0"/><text class="n ml" x="695.0" y="151.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">2. Flooded to all ports in the VLAN</tspan></text><line class="ln" x1="500.0" y1="163.8" x2="879.0" y2="163.8"/><polygon class="ah" points="890.0,163.8 879.0,157.7 879.0,169.8"/><text class="n ml" x="695.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">3. ARP reply: .30 is at 3c:52:82:aa:10:07</tspan></text><line class="ln lnd" x1="890.0" y1="208.8" x2="511.0" y2="208.8"/><polygon class="ah" points="500.0,208.8 511.0,214.8 511.0,202.7"/><text class="n ml" x="305.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">4. Unicast reply forwarded</tspan></text><line class="ln lnd" x1="500.0" y1="253.8" x2="121.0" y2="253.8"/><polygon class="ah" points="110.0,253.8 121.0,259.8 121.0,247.7"/><text class="n ml" x="500.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. Print job frame to 3c:52:82:aa:10:07 (cached)</tspan></text><line class="ln" x1="110.0" y1="298.8" x2="879.0" y2="298.8"/><polygon class="ah" points="890.0,298.8 879.0,292.7 879.0,304.8"/></svg>