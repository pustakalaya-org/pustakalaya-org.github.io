<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>One port on the B-C link blocks, breaking the loop but keeping a backup path.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="820.4" y2="359.0"/><line class="ln" x1="500.0" y1="62.0" x2="179.6" y2="359.0"/><line class="ln" x1="820.4" y1="359.0" x2="179.6" y2="359.0"/><rect class="lbg" x="582.2" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="212.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">DP to RP</tspan></text><rect class="lbg" x="261.8" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="339.8" y="212.5" text-anchor="middle" font-size="13"><tspan x="339.8" dy="0.0">DP to RP</tspan></text><rect class="lbg" x="422.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">DP to ALT (blocked)</tspan></text><rect class="bxa" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Switch A</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Root bridge (lowest</tspan><tspan x="500.0" dy="16.9">Bridge ID)</tspan></text><rect class="bx" x="735.4" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="354.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Switch B</tspan></text><text class="n" x="820.4" y="377.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">Root port faces A</tspan></text><rect class="bx" x="94.6" y="317.1" width="170.0" height="83.9" rx="12"/><text class="t" x="179.6" y="345.7" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Switch C</tspan></text><text class="n" x="179.6" y="369.1" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">Root port faces A;</tspan><tspan x="179.6" dy="16.9">one port blocked</tspan></text></svg>