" dy="0.0">Branch A</tspan></text><text class="n" x="820.4" y="179.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">Fibre + 5G</tspan></text><rect class="bx" x="735.4" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="354.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Branch B</tspan></text><text class="n" x="820.4" y="377.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">MPLS + broadband</tspan></text><rect class="bx" x="415.0" y="424.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="453.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Branch C</tspan></text><text class="n" x="500.0" y="476.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Broadband + LEO</tspan></text><rect class="bx" x="94.6" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="354.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Cloud VPC</tspan></text><text class="n" x="179.6" y="377.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">Virtual SD-WAN edge</tspan></text><rect class="bx" x="94.6" y="117.5" width="170.0" height="87.0" rx="12"/><text class="t" x="179.6" y="146.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">SD-WAN</tspan><tspan x="179.6" dy="20.0">controller</tspan></text><text class="n" x="179.6" y="189.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">Policy and keys</tspan></text></svg>