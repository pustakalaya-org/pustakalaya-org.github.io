<svg class="dg" viewBox="0 0 1000 478" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>More lanes and faster lanes per module drive each new generation.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SFP</tspan></text><rect class="bfill" x="280" y="14.0" width="45.4" height="28" rx="6"/><text class="n" x="335.4" y="33.0" text-anchor="start" font-size="15"><tspan x="335.4" dy="0.0">1G</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SFP+</tspan></text><rect class="bfill" x="280" y="64.0" width="196.6" height="28" rx="6"/><text class="n" x="486.6" y="83.0" text-anchor="start" font-size="15"><tspan x="486.6" dy="0.0">10G</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SFP28</tspan></text><rect class="bfill" x="280" y="114.0" width="256.8" height="28" rx="6"/><text class="n" x="546.8" y="133.0" text-anchor="start" font-size="15"><tspan x="546.8" dy="0.0">25G</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">QSFP+</tspan></text><rect class="bfill" x="280" y="164.0" width="287.7" height="28" rx="6"/><text class="n" x="577.7" y="183.0" text-anchor="start" font-size="15"><tspan x="577.7" dy="0.0">40G (4x10G)</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">QSFP28</tspan></text><rect class="bfill" x="280" y="214.0" width="347.9" height="28" rx="6"/><text class="n" x="637.9" y="233.0" text-anchor="start" font-size="15"><tspan x="637.9" dy="0.0">100G (4x25G)</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">QSFP56</tspan></text><rect class="bfill" x="280" y="264.0" width="393.4" height="28" rx="6"/><text class="n" x="683.4" y="283.0" text-anchor="start" font-size="15"><tspan x="683.4" dy="0.0">200G (4x50G)</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">QSFP-DD</tspan></text><rect class="bfill" x="280" y="314.0" width="438.9" height="28" rx="6"/><text class="n" x="728.9" y="333.0" text-anchor="start" font-size="15"><tspan x="728.9" dy="0.0">400G (8x50G)</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">OSFP / QSFP-DD800</tspan></text><rect class="bfill" x="280" y="364.0" width="484.5" height="28" rx="6"/><text class="n" x="774.5" y="383.0" text-anchor="start" font-size="15"><tspan x="774.5" dy="0.0">800G (8x100G)</tspan></text><text class="t" x="266.0" y="433.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">OSFP 1.6T</tspan></text><rect class="bfill" x="280" y="414.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="433.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">1.6T (8x200G)</tspan></text><text class="n" x="996.0" y="468.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>