<svg class="dg" viewBox="0 0 1000 193" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The first matching sequence wins; anything that matches nothing hits the hidden deny at the end.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect class="bx" x="0.0" y="6.0" width="163.2" height="179.0" rx="14"/><rect class="bar" x="0.0" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="26.0" cy="36.0" r="15"/><text class="bn" x="26.0" y="41.5" text-anchor="middle" font-size="16">1</text><text class="t" x="81.6" y="74.2" text-anchor="middle" font-size="19"><tspan x="81.6" dy="0.0">Route</tspan><tspan x="81.6" dy="23.8">arrives</tspan></text><text class="n" x="81.6" y="125.8" text-anchor="middle" font-size="15"><tspan x="81.6" dy="0.0">e.g.</tspan><tspan x="81.6" dy="19.5">203.0.113.0/24</tspan><tspan x="81.6" dy="19.5">from OSPF</tspan></text><line class="ln" x1="168.2" y1="95.5" x2="193.2" y2="95.5"/><polygon class="ah" points="204.2,95.5 193.2,89.5 193.2,101.5"/><rect class="bx" x="209.2" y="6.0" width="163.2" height="179.0" rx="14"/><rect class="bar" x="209.2" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="235.2" cy="36.0" r="15"/><text class="bn" x="235.2" y="41.5" text-anchor="middle" font-size="16">2</text><text class="t" x="290.8" y="74.2" text-anchor="middle" font-size="19"><tspan x="290.8" dy="0.0">Sequence 10</tspan></text><text class="n" x="290.8" y="102.0" text-anchor="middle" font-size="15"><tspan x="290.8" dy="0.0">match prefix-list</tspan><tspan x="290.8" dy="19.5">OUR-NETS?</tspan></text><line class="ln" x1="377.4" y1="95.5" x2="402.4" y2="95.5"/><polygon class="ah" points="413.4,95.5 402.4,89.5 402.4,101.5"/><rect class="bx" x="418.4" y="6.0" width="163.2" height="179.0" rx="14"/><rect class="bar" x="418.4" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="444.4" cy="36.0" r="15"/><text class="bn" x="444.4" y="41.5" text-anchor="middle" font-size="16">3</text><text class="t" x="500.0" y="74.2" text-anchor="middle" font-size="19"><tspan x="500.0" dy="0.0">Match: apply</tspan><tspan x="500.0" dy="23.8">set</tspan></text><text class="n" x="500.0" y="125.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">set metric, tag,</tspan><tspan x="500.0" dy="19.5">community; permit</tspan></text><line class="ln" x1="586.6" y1="95.5" x2="611.6" y2="95.5"/><polygon class="ah" points="622.6,95.5 611.6,89.5 611.6,101.5"/><rect class="bx" x="627.6" y="6.0" width="163.2" height="179.0" rx="14"/><rect class="bar" x="627.6" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="653.6" cy="36.0" r="15"/><text class="bn" x="653.6" y="41.5" text-anchor="middle" font-size="16">4</text><text class="t" x="709.2" y="74.2" text-anchor="middle" font-size="19"><tspan x="709.2" dy="0.0">No match:</tspan><tspan x="709.2" dy="23.8">next</tspan><tspan x="709.2" dy="23.8">sequence</tspan></text><text class="n" x="709.2" y="149.5" text-anchor="middle" font-size="15"><tspan x="709.2" dy="0.0">seq 20, 30 ... in</tspan><tspan x="709.2" dy="19.5">order</tspan></text><line class="ln" x1="795.8" y1="95.5" x2="820.8" y2="95.5"/><polygon class="ah" points="831.8,95.5 820.8,89.5 820.8,101.5"/><rect class="bx" x="836.8" y="6.0" width="163.2" height="179.0" rx="14"/><rect class="bar" x="836.8" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="862.8" cy="36.0" r="15"/><text class="bn" x="862.8" y="41.5" text-anchor="middle" font-size="16">5</text><text class="t" x="918.4" y="74.2" text-anchor="middle" font-size="19"><tspan x="918.4" dy="0.0">Implicit</tspan><tspan x="918.4" dy="23.8">deny</tspan></text><text class="n" x="918.4" y="125.8" text-anchor="middle" font-size="15"><tspan x="918.4" dy="0.0">Unmatched routes</tspan><tspan x="918.4" dy="19.5">are dropped</tspan></text></svg>