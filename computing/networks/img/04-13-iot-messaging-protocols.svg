<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Publishers and subscribers never talk directly; the broker matches topics and fans out messages.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="199.4" x2="500.0" y2="119.5"/><line class="ln" x1="619.8" y1="217.2" x2="719.9" y2="189.7"/><line class="ln" x1="619.8" y1="282.8" x2="719.9" y2="310.3"/><line class="ln" x1="500.0" y1="300.6" x2="500.0" y2="369.9"/><line class="ln" x1="380.2" y1="282.8" x2="280.1" y2="310.3"/><line class="ln" x1="380.2" y1="217.2" x2="280.1" y2="189.7"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Soil sensors</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">publish</tspan><tspan x="500.0" dy="16.9">greenhouse/3/moisture</tspan></text><rect class="bx" x="724.8" y="118.5" width="200.0" height="84.9" rx="12"/><text class="t" x="824.8" y="148.0" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Weather station</tspan></text><text class="n" x="824.8" y="171.6" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">publish</tspan><tspan x="824.8" dy="16.9">greenhouse/outside/temp</tspan></text><rect class="bx" x="724.8" y="305.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="334.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Dashboard</tspan></text><text class="n" x="824.8" y="358.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">subscribe greenhouse/#</tspan></text><rect class="bx" x="400.0" y="374.9" width="200.0" height="106.2" rx="12"/><text class="t" x="500.0" y="404.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Irrigation</tspan><tspan x="500.0" dy="21.2">controller</tspan></text><text class="n" x="500.0" y="449.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">subscribe</tspan><tspan x="500.0" dy="16.9">greenhouse/+/moisture</tspan></text><rect class="bx" x="75.2" y="296.6" width="200.0" height="84.9" rx="12"/><text class="t" x="175.2" y="326.0" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Valve actuator</tspan></text><text class="n" x="175.2" y="349.6" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">subscribe</tspan><tspan x="175.2" dy="16.9">greenhouse/3/valve</tspan></text><rect class="bx" x="75.2" y="118.5" width="200.0" height="84.9" rx="12"/><text class="t" x="175.2" y="148.0" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Kafka bridge</tspan></text><text class="n" x="175.2" y="171.6" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">forwards data for</tspan><tspan x="175.2" dy="16.9">analytics</tspan></text><rect class="bxa" x="385.0" y="204.4" width="230.0" height="91.2" rx="12"/><text class="t" x="500.0" y="237.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">MQTT broker</tspan></text><text class="n" x="500.0" y="262.4" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">Mosquitto, TCP 1883 / 8883</tspan><tspan x="500.0" dy="18.2">TLS</tspan></text></svg>