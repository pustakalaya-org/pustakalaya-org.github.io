<svg class="dg" viewBox="0 0 1000 454" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every public IP address traces back through an RIR to IANA&#x27;s global pool.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="42.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Global</tspan></text><line class="ln" x1="572.0" y1="70.0" x2="228.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="400.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="572.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="744.0" y2="145.0"/><line class="ln" x1="572.0" y1="70.0" x2="916.0" y2="145.0"/><text class="lab" x="4.0" y="173.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Regional (RIRs)</tspan></text><line class="ln" x1="228.0" y1="191.0" x2="459.0" y2="271.0"/><line class="ln" x1="400.0" y1="191.0" x2="459.0" y2="271.0"/><line class="ln" x1="572.0" y1="191.0" x2="459.0" y2="271.0"/><line class="ln" x1="744.0" y1="191.0" x2="685.0" y2="271.0"/><line class="ln" x1="916.0" y1="191.0" x2="685.0" y2="271.0"/><text class="lab" x="4.0" y="299.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">National / local</tspan></text><line class="ln" x1="459.0" y1="317.0" x2="459.0" y2="397.0"/><line class="ln" x1="685.0" y1="317.0" x2="685.0" y2="397.0"/><text class="lab" x="4.0" y="425.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">End users</tspan></text><g transform="translate(0,37.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">IANA (run by PTI</tspan><tspan x="572.0" dy="20.0">for ICANN)</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="150.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="228.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="228.0" dy="0.0">AFRINIC</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="322.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="400.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="400.0" dy="0.0">APNIC</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="494.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">ARIN</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="666.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="744.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="744.0" dy="0.0">LACNIC</tspan></text></g><g transform="translate(0,168.0)"><rect class="bx" x="838.0" y="-23.0" width="156.0" height="46.0" rx="12"/><text class="t" x="916.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="916.0" dy="0.0">RIPE NCC</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">NIRs (e.g. JPNIC)</tspan></text></g><g transform="translate(0,294.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">ISPs / LIRs</tspan></text></g><g transform="translate(0,420.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Businesses</tspan></text></g><g transform="translate(0,420.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Homes and phones</tspan></text></g></svg>