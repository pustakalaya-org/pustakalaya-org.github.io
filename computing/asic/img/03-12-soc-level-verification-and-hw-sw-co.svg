<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Software on the CPU and UVM agents at the pins work together through the real interconnect.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="37.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Software</tspan></text><line class="ln" x1="346.0" y1="55.0" x2="346.0" y2="140.0"/><line class="ln" x1="572.0" y1="55.0" x2="572.0" y2="140.0"/><line class="ln" x1="798.0" y1="55.0" x2="798.0" y2="130.0"/><text class="lab" x="4.0" y="168.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">CPU subsystem</tspan></text><line class="ln" x1="346.0" y1="186.0" x2="572.0" y2="271.0"/><line class="ln" x1="572.0" y1="186.0" x2="572.0" y2="271.0"/><line class="ln" x1="798.0" y1="196.0" x2="572.0" y2="271.0"/><text class="lab" x="4.0" y="299.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Interconnect</tspan></text><line class="ln" x1="572.0" y1="317.0" x2="249.5" y2="397.0"/><line class="ln" x1="572.0" y1="317.0" x2="464.5" y2="397.0"/><line class="ln" x1="572.0" y1="317.0" x2="679.5" y2="397.0"/><line class="ln" x1="572.0" y1="317.0" x2="894.5" y2="397.0"/><text class="lab" x="4.0" y="425.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">IP and memory</tspan></text><line class="ln" x1="249.5" y1="443.0" x2="346.0" y2="523.0"/><line class="ln" x1="464.5" y1="443.0" x2="346.0" y2="523.0"/><line class="ln" x1="679.5" y1="443.0" x2="572.0" y2="523.0"/><line class="ln" x1="894.5" y1="443.0" x2="798.0" y2="523.0"/><text class="lab" x="4.0" y="551.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Testbench</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">C tests</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Firmware / drivers</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">PSS-generated tests</tspan></text></g><g transform="translate(0,163.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y=