<svg class="dg" viewBox="0 0 1000 533" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Heat leaves through the top while signals and power travel down through bumps, substrate and balls.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="35.0" r="15"/><text class="bn" x="34.0" y="40.5" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="42.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Lid / heat spreader</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="54.0"/><text class="n" x="350.0" y="40.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">copper; carries heat to the cooler</tspan></text><rect x="2" y="74.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.13;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="111.5" r="15"/><text class="bn" x="34.0" y="117.0" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="106.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Thermal interface</tspan><tspan x="64.0" dy="25.0">material</tspan></text><line class="sep" x1="330.0" y1="86.0" x2="330.0" y2="137.0"/><text class="n" x="350.0" y="117.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">fills microscopic air gaps</tspan></text><rect x="2" y="157.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.19;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="194.5" r="15"/><text class="bn" x="34.0" y="200.0" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="189.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Silicon die (face</tspan><tspan x="64.0" dy="25.0">down)</tspan></text><line class="sep" x1="330.0" y1="169.0" x2="330.0" y2="220.0"/><text class="n" x="350.0" y="200.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">transistors face the substrate</tspan></text><rect x="2" y="240.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="271.0" r="15"/><text class="bn" x="34.0" y="276.5" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="278.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Bumps and underfill</tspan></text><line class="sep" x1="330.0" y1="252.0" x2="330.0" y2="290.0"/><text class="n" x="350.0" y="276.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">C4 or copper pillars in epoxy</tspan></text><rect x="2" y="310.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.29;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="341.0" r="15"/><text class="bn" x="34.0" y="346.5" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="348.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Package substrate</tspan></text><line class="sep" x1="330.0" y1="322.0" x2="330.0" y2="360.0"/><text class="n" x="350.0" y="346.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">ABF build-up layers fan signals out</tspan></text><rect x="2" y="380.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.35;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="411.0" r="15"/><text class="bn" x="34.0" y="416.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="418.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Solder balls (BGA)</tspan></text><line class="sep" x1="330.0" y1="392.0" x2="330.0" y2="430.0"/><text class="n" x="350.0" y="416.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">about 0.4-1 mm pitch</tspan></text><rect x="2" y="450.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="487.5" r="15"/><text class="bn" x="34.0" y="493.0" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="482.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Printed circuit</tspan><tspan x="64.0" dy="25.0">board</tspan></text><line class="sep" x1="330.0" y1="462.0" x2="330.0" y2="513.0"/><text class="n" x="350.0" y="493.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">the system board</tspan></text></svg>