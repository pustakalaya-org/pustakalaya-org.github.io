<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Look beyond the famous names: design-service firms, IDMs and start-ups hire many graduates.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="246.4" x2="500.0" y2="111.0"/><line class="ln" x1="587.9" y1="249.3" x2="692.4" y2="200.8"/><line class="ln" x1="620.0" y1="305.9" x2="760.6" y2="324.6"/><line class="ln" x1="535.2" y1="332.5" x2="622.5" y2="437.9"/><line class="ln" x1="464.8" y1="332.5" x2="377.5" y2="437.9"/><line class="ln" x1="380.0" y1="305.9" x2="239.4" y2="324.6"/><line class="ln" x1="412.1" y1="249.3" x2="284.7" y2="190.2"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Fabless companies</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">NVIDIA, Qualcomm, MediaTek</tspan></text><rect class="bx" x="693.2" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="793.2" y="138.9" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Hyperscalers and</tspan><tspan x="793.2" dy="21.2">systems</tspan></text><text class="n" x="793.2" y="183.7" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">Google, Amazon, Apple</tspan></text><rect class="bx" x="765.6" y="296.1" width="200.0" height="84.9" rx="12"/><text class="t" x="865.6" y="325.5" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">IDMs and memory</tspan></text><text class="n" x="865.6" y="349.1" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">Intel, TI, Infineon,</tspan><tspan x="865.6" dy="16.9">Micron</tspan></text><rect class="bx" x="562.7" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="662.7" y="471.2" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">EDA and IP</tspan><tspan x="662.7" dy="21.2">vendors</tspan></text><text class="n" x="662.7" y="516.0" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">Synopsys, Cadence, Arm</tspan></text><rect class="bx" x="237.3" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="337.3" y="471.2" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Foundries and</tspan><tspan x="337.3" dy="21.2">OSATs</tspan></text><text class="n" x="337.3" y="516.0" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">TSMC, GF, ASE, Amkor</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Design services</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">ASIC partners</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Start-ups</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">AI, RISC-V, photonics</tspan></text><rect class="bxa" x="385.0" y="251.4" width="230.0" height="77.2" rx="12"/><text class="t" x="500.0" y="284.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Your first chip</tspan><tspan x="500.0" dy="26.2">job</tspan></text></svg>