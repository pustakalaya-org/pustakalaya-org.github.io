<svg class="dg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>A leading-edge wafer goes round this loop dozens of times, with variations for each layer.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><ellipse class="ring" cx="500.0" cy="280.0" rx="360" ry="200.0"/><line class="ln acc" x1="624.1" y1="92.1" x2="633.9" y2="94.3"/><polygon class="ah" points="647.5,97.5 635.6,86.8 632.1,101.8"/><line class="ln acc" x1="824.2" y1="192.2" x2="830.2" y2="200.3"/><polygon class="ah" points="838.6,211.5 836.4,195.7 824.0,204.9"/><line class="ln acc" x1="841.0" y1="345.3" x2="835.0" y2="353.3"/><polygon class="ah" points="826.6,364.6 841.2,357.9 828.8,348.7"/><line class="ln acc" x1="651.4" y1="461.6" x2="641.7" y2="463.9"/><polygon class="ah" points="628.0,467.0 643.4,471.4 639.9,456.4"/><line class="ln acc" x1="375.9" y1="467.9" x2="366.1" y2="465.7"/><polygon class="ah" points="352.5,462.5 364.4,473.2 367.9,458.2"/><line class="ln acc" x1="175.8" y1="367.8" x2="169.8" y2="359.7"/><polygon class="ah" points="161.4,348.5 163.6,364.3 176.0,355.1"/><line class="ln acc" x1="159.0" y1="214.7" x2="165.0" y2="206.7"/><polygon class="ah" points="173.4,195.4 158.8,202.1 171.2,211.3"/><line class="ln acc" x1="348.6" y1="98.4" x2="358.3" y2="96.1"/><polygon class="ah" points="372.0,93.0 356.6,88.6 360.1,103.6"/><text class="t" x="500.0" y="286.0" text-anchor="middle" font-size="22"><tspan x="500.0" dy="0.0">Repeat for every</tspan><tspan x="500.0" dy="27.5">mask layer</tspan></text><rect class="bx" x="395.0" y="46.0" width="210.0" height="68.0" rx="12"/><text class="t" x="500.0" y="75.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Deposit film</tspan></text><text class="n" x="500.0" y="99.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">CVD, PVD or ALD</tspan></text><circle class="bc" cx="399.0" cy="50.0" r="13"/><text class="bn" x="399.0" y="55.5" text-anchor="middle" font-size="16">1</text><rect class="bx" x="649.6" y="104.6" width="210.0" height="68.0" rx="12"/><text class="t" x="754.6" y="134.0" text-anchor="middle" font-size="17"><tspan x="754.6" dy="0.0">Coat resist</tspan></text><text class="n" x="754.6" y="157.6" text-anchor="middle" font-size="13"><tspan x="754.6" dy="0.0">spun on in a track</tspan></text><circle class="bc" cx="653.6" cy="108.6" r="13"/><text class="bn" x="653.6" y="114.1" text-anchor="middle" font-size="16">2</text><rect class="bx" x="755.0" y="246.0" width="210.0" height="68.0" rx="12"/><text class="t" x="860.0" y="275.4" text-anchor="middle" font-size="17"><tspan x="860.0" dy="0.0">Expose</tspan></text><text class="n" x="860.0" y="299.0" text-anchor="middle" font-size="13"><tspan x="860.0" dy="0.0">DUV or EUV scanner</tspan></text><circle class="bc" cx="759.0" cy="250.0" r="13"/><text class="bn" x="759.0" y="255.5" text-anchor="middle" font-size="16">3</text><rect class="bx" x="649.6" y="387.4" width="210.0" height="68.0" rx="12"/><text class="t" x="754.6" y="416.9" text-anchor="middle" font-size="17"><tspan x="754.6" dy="0.0">Develop</tspan></text><text class="n" x="754.6" y="440.4" text-anchor="middle" font-size="13"><tspan x="754.6" dy="0.0">pattern appears in resist</tspan></text><circle class="bc" cx="653.6" cy="391.4" r="13"/><text class="bn" x="653.6" y="396.9" text-anchor="middle" font-size="16">4</text><rect class="bx" x="395.0" y="446.0" width="210.0" height="68.0" rx="12"/><text class="t" x="500.0" y="475.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Etch</tspan></text><text class="n" x="500.0" y="499.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">transfer pattern into film</tspan></text><circle class="bc" cx="399.0" cy="450.0" r="13"/><text class="bn" x="399.0" y="455.5" text-anchor="middle" font-size="16">5</text><rect class="bx" x="140.4" y="387.4" width="210.0" height="68.0" rx="12"/><text class="t" x="245.4" y="416.9" text-anchor="middle" font-size="17"><tspan x="245.4" dy="0.0">Implant / dope</tspan></text><text class="n" x="245.4" y="440.4" text-anchor="middle" font-size="13"><tspan x="245.4" dy="0.0">mainly FEOL layers</tspan></text><circle class="bc" cx="144.4" cy="391.4" r="13"/><text class="bn" x="144.4" y="396.9" text-anchor="middle" font-size="16">6</text><rect class="bx" x="35.0" y="246.0" width="210.0" height="68.0" rx="12"/><text class="t" x="140.0" y="275.4" text-anchor="middle" font-size="17"><tspan x="140.0" dy="0.0">Strip and clean</tspan></text><text class="n" x="140.0" y="299.0" text-anchor="middle" font-size="13"><tspan x="140.0" dy="0.0">remove resist, rinse</tspan></text><circle class="bc" cx="39.0" cy="250.0" r="13"/><text class="bn" x="39.0" y="255.5" text-anchor="middle" font-size="16">7</text><rect class="bx" x="140.4" y="104.6" width="210.0" height="68.0" rx="12"/><text class="t" x="245.4" y="134.0" text-anchor="middle" font-size="17"><tspan x="245.4" dy="0.0">CMP</tspan></text><text class="n" x="245.4" y="157.6" text-anchor="middle" font-size="13"><tspan x="245.4" dy="0.0">polish flat for next layer</tspan></text><circle class="bc" cx="144.4" cy="108.6" r="13"/><text class="bn" x="144.4" y="114.1" text-anchor="middle" font-size="16">8</text></svg>