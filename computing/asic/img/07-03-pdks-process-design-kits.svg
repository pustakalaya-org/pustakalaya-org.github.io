<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Every EDA tool in the flow reads a different part of the same PDK, so all parts must come from one release.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="130.4"/><polygon class="ah" points="500.0,119.5 493.9,130.4 506.1,130.4"/><line class="ln" x1="567.1" y1="251.0" x2="692.8" y2="177.9"/><polygon class="ah" points="702.4,172.4 689.8,172.7 695.9,183.1"/><line class="ln" x1="620.0" y1="290.0" x2="759.0" y2="290.0"/><polygon class="ah" points="770.0,290.0 759.0,283.9 759.0,296.1"/><line class="ln" x1="567.1" y1="329.0" x2="678.3" y2="393.7"/><polygon class="ah" points="687.8,399.2 681.4,388.4 675.3,398.9"/><line class="ln" x1="500.0" y1="331.5" x2="500.0" y2="458.0"/><polygon class="ah" points="500.0,469.0 506.1,458.0 493.9,458.0"/><line class="ln" x1="432.9" y1="329.0" x2="321.7" y2="393.7"/><polygon class="ah" points="312.2,399.2 324.7,398.9 318.6,388.4"/><line class="ln" x1="380.0" y1="290.0" x2="241.0" y2="290.0"/><polygon class="ah" points="230.0,290.0 241.0,296.1 241.0,283.9"/><line class="ln" x1="432.9" y1="251.0" x2="340.0" y2="197.0"/><polygon class="ah" points="330.5,191.4 336.9,202.2 343.0,191.7"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">SPICE models</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">BSIM corners and Monte</tspan><tspan x="500.0" dy="16.9">Carlo</tspan></text><rect class="bx" x="665.2" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="765.2" y="131.3" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">DRC/LVS decks</tspan></text><text class="n" x="765.2" y="154.9" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">Calibre, ICV, Pegasus</tspan></text><rect class="bx" x="775.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="875.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Extraction tech</tspan></text><text class="n" x="875.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">ITF, QRC tech files</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">P&amp;R tech LEF</tspan></text><text class="n" x="765.2" y="454.