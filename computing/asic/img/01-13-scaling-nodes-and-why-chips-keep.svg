<svg class="dg" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Progress now comes from new transistor shapes, lithography and power delivery, not just shrinking.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1965 · Moore&#x27;s Law</tspan></text><text class="n" x="70.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Gordon Moore predicts doubling</tspan><tspan x="70.0" dy="16.2">transistor counts</tspan></text><circle class="dot" cx="192.9" cy="107.2" r="9"/><line class="ln" x1="192.9" y1="116.2" x2="192.9" y2="127.2"/><text class="t" x="192.9" y="147.7" text-anchor="middle" font-size="17"><tspan x="192.9" dy="0.0">1971 · Intel 4004</tspan></text><text class="n" x="192.9" y="169.2" text-anchor="middle" font-size="13"><tspan x="192.9" dy="0.0">10 µm process, about 2,300</tspan><tspan x="192.9" dy="16.2">transistors</tspan></text><circle class="dot" cx="315.7" cy="107.2" r="9"/><line class="ln" x1="315.7" y1="98.2" x2="315.7" y2="89.2"/><text class="t" x="315.7" y="42.5" text-anchor="middle" font-size="17"><tspan x="315.7" dy="0.0">2007 · High-k metal</tspan><tspan x="315.7" dy="21.2">gate</tspan></text><text class="n" x="315.7" y="85.2" text-anchor="middle" font-size="13"><tspan x="315.7" dy="0.0">Intel 45 nm cuts gate leakage</tspan></text><circle class="dot" cx="438.6" cy="107.2" r="9"/><line class="ln" x1="438.6" y1="116.2" x2="438.6" y2="127.2"/><text class="t" x="438.6" y="147.7" text-anchor="middle" font-size="17"><tspan x="438.6" dy="0.0">2011 · FinFET</tspan></text><text class="n" x="438.6" y="169.2" text-anchor="middle" font-size="13"><tspan x="438.6" dy="0.0">Intel 22 nm Tri-Gate transistors</tspan></text><circle class="dot" cx="561.4" cy="107.2" r="9"/><line class="ln" x1="561.4" y1="98.2" x2="561.4" y2="89.2"/><text class="t" x="561.4" y="63.7" text-anchor="middle" font-size="17"><tspan x="561.4" dy="0.0">2019 · EUV in volume</tspan></text><text class="n" x="561.4" y="85.2" text-anchor="middle" font-size="13"><tspan x="561.4" dy="0.0">TSMC N7+ uses 13.5 nm light</tspan></text><circle class="dot" cx="684.3" cy="107.2" r="9"/><line class="ln" x1="684.3" y1="116.2" x2="684.3" y2="127.2"/><text class="t" x="684.3" y="147.7" text-anchor="middle" font-size="17"><tspan x="684.3" dy="0.0">2022 · First GAA</tspan></text><text class="n" x="684.3" y="169.2" text-anchor="middle" font-size="13"><tspan x="684.3" dy="0.0">Samsung 3 nm MBCFET nanosheets</tspan></text><circle class="dot" cx="807.1" cy="107.2" r="9"/><line class="ln" x1="807.1" y1="98.2" x2="807.1" y2="89.2"/><text class="t" x="807.1" y="47.5" text-anchor="middle" font-size="17"><tspan x="807.1" dy="0.0">2025 · 2 nm class</tspan></text><text class="n" x="807.1" y="69.0" text-anchor="middle" font-size="13"><tspan x="807.1" dy="0.0">TSMC N2 nanosheets; Intel 18A</tspan><tspan x="807.1" dy="16.2">with PowerVia</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="116.2" x2="930.0" y2="127.2"/><text class="t" x="930.0" y="147.7" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2027 · TSMC A16</tspan></text><text class="n" x="930.0" y="169.2" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">Super Power Rail backside power;</tspan><tspan x="930.0" dy="16.2">volume slipped to 2027</tspan></text></svg>