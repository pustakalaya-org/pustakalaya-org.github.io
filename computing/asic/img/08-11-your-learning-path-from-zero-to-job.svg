<svg class="dg" viewBox="0 0 1000 205" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>About ten hours a week is enough if you finish each stage with a working, tested project.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">Months 1-3 · Logic and</tspan><tspan x="70.0" dy="21.2">Verilog</tspan></text><text class="n" x="70.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Harris &amp; Harris, HDLBits</tspan></text><circle class="dot" cx="285.0" cy="107.2" r="9"/><line class="ln" x1="285.0" y1="116.2" x2="285.0" y2="127.2"/><text class="t" x="285.0" y="147.7" text-anchor="middle" font-size="17"><tspan x="285.0" dy="0.0">Months 4-6 · Testbenches and</tspan><tspan x="285.0" dy="21.2">FPGA</tspan></text><text class="n" x="285.0" y="190.5" text-anchor="middle" font-size="13"><tspan x="285.0" dy="0.0">Verilator, cocotb, UART on a board</tspan></text><circle class="dot" cx="500.0" cy="107.2" r="9"/><line class="ln" x1="500.0" y1="98.2" x2="500.0" y2="89.2"/><text class="t" x="500.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Months 7-9 · SV, UVM and a</tspan><tspan x="500.0" dy="21.2">CPU</tspan></text><text class="n" x="500.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">small RISC-V core, assertions</tspan></text><circle class="dot" cx="715.0" cy="107.2" r="9"/><line class="ln" x1="715.0" y1="116.2" x2="715.0" y2="127.2"/><text class="t" x="715.0" y="147.7" text-anchor="middle" font-size="17"><tspan x="715.0" dy="0.0">Months 10-12 · ASIC flow</tspan></text><text class="n" x="715.0" y="169.2" text-anchor="middle" font-size="13"><tspan x="715.0" dy="0.0">Yosys, LibreLane, SDC, Tiny Tapeout</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="98.2" x2="930.0" y2="89.2"/><text class="t" x="930.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">Ongoing · Portfolio and</tspan><tspan x="930.0" dy="21.2">interviews</tspan></text><text class="n" x="930.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">GitHub, blog, mock interviews</tspan></text></svg>