<svg class="dg" viewBox="0 0 1000 421" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Address, data and response travel on separate channels, each with its own VALID/READY handshake.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="415.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="415.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Manager</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Subordinate</tspan></text></g><text class="n ml" x="500.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">1. AW: AWADDR=0x8000_0000, AWLEN=3, AWVALID</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="879.0" y2="100.0"/><polygon class="ah" points="890.0,100.0 879.0,94.0 879.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. AWREADY (address accepted)</tspan></text><line class="ln lnd" x1="890.0" y1="145.0" x2="121.0" y2="145.0"/><polygon class="ah" points="110.0,145.0 121.0,151.1 121.0,138.9"/><text class="n ml" x="500.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. W beat 0 (WVALID, WSTRB)</tspan></text><line class="ln" x1="110.0" y1="190.0" x2="879.0" y2="190.0"/><polygon class="ah" points="890.0,190.0 879.0,183.9 879.0,196.1"/><text class="n ml" x="500.0" y="222.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. W beats 1 and 2</tspan></text><line class="ln" x1="110.0" y1="235.0" x2="879.0" y2="235.0"/><polygon class="ah" points="890.0,235.0 879.0,228.9 879.0,241.1"/><text class="n ml" x="500.0" y="267.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. W beat 3 with WLAST</tspan></text><line class="ln" x1="110.0" y1="280.0" x2="879.0" y2="280.0"/><polygon class="ah" points="890.0,280.0 879.0,273.9 879.0,286.1"/><text class="n ml" x="500.0" y="312.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. B: BRESP=OKAY, BVALID</tspan></text><line class="ln" x1="890.0" y1="325.0" x2="121.0" y2="325.0"/><polygon class="ah" points="110.0,325.0 121.0,331.1 121.0,318.9"/><text class="n ml" x="500.0" y="357.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. BREADY (response taken)</tspan></text><line class="ln lnd" x1="110.0" y1="370.0" x2="879.0" y2="370.0"/><polygon class="ah" points="890.0,370.0 879.0,363.9 879.0,376.1"/></svg>