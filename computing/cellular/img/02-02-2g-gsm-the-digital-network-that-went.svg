<svg class="dg" viewBox="0 0 1000 570" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The radio subsystem (BSS) is separate from the switching subsystem (NSS) — a split every later generation kept.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="37.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Mobile station</tspan></text><line class="ln" x1="459.0" y1="55.0" x2="346.0" y2="135.0"/><line class="ln" x1="459.0" y1="55.0" x2="572.0" y2="135.0"/><line class="ln" x1="685.0" y1="55.0" x2="798.0" y2="135.0"/><text class="lab" x="4.0" y="154.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Base station</tspan><tspan x="4.0" dy="17.5">subsystem</tspan></text><line class="ln" x1="346.0" y1="181.0" x2="459.0" y2="261.0"/><line class="ln" x1="572.0" y1="181.0" x2="459.0" y2="261.0"/><line class="ln" x1="798.0" y1="181.0" x2="685.0" y2="261.0"/><text class="lab" x="4.0" y="280.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Switching</tspan><tspan x="4.0" dy="17.5">subsystem</tspan></text><line class="ln" x1="459.0" y1="307.0" x2="346.0" y2="387.0"/><line class="ln" x1="459.0" y1="307.0" x2="572.0" y2="387.0"/><line class="ln" x1="685.0" y1="307.0" x2="798.0" y2="387.0"/><text class="lab" x="4.0" y="415.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Databases</tspan></text><line class="ln" x1="346.0" y1="433.0" x2="346.0" y2="513.0"/><line class="ln" x1="572.0" y1="433.0" x2="572.0" y2="513.0"/><line class="ln" x1="798.0" y1="433.0" x2="798.0" y2="513.0"/><text class="lab" x="4.0" y="541.0" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Other networks</tspan></text><g transform="translate(0,32.0)"><rect class="bx" x="354.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="459.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Handset (IMEI)</tspan></text></g><g transform="translate(0,32.0)"><rect class="bx" x="580.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="685.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">SIM (IMSI, Ki)</tspan></text></g><g transform="translate(0,158.0)"><rect class="bx" x="241.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="346.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">BTS</tspan></text></g><g transform="translate(0,158.0)"><rect class="bx" x="467.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="572.0" y="5.6" text-anchor="middle" fo