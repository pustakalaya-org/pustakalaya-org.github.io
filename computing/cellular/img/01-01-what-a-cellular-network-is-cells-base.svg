<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Neighbouring cells always use different channel groups; the same group (f1) returns only in a cell that does not touch it.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="820.4" y2="161.0"/><line class="ln" x1="500.0" y1="62.0" x2="820.4" y2="359.0"/><line class="ln" x1="820.4" y1="161.0" x2="820.4" y2="359.0"/><line class="ln" x1="820.4" y1="161.0" x2="179.6" y2="161.0"/><line class="ln" x1="820.4" y1="359.0" x2="179.6" y2="161.0"/><line class="ln" x1="500.0" y1="458.0" x2="179.6" y2="161.0"/><line class="ln" x1="179.6" y1="359.0" x2="179.6" y2="161.0"/><line class="ln" x1="500.0" y1="458.0" x2="179.6" y2="359.0"/><rect class="lbg" x="582.2" y="98.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="113.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">neighbour</tspan></text><rect class="lbg" x="582.2" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="212.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">neighbour</tspan></text><rect class="bxa" x="415.0" y="39.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="67.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Cell 1 · f1</tspan></text><rect class="bx" x="735.4" y="138.0" width="170.0" height="46.0" rx="12"/><text class="t" x="820.4" y="166.6" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Cell 2 · f2</tspan></text><rect class="bx" x="735.4" y="336.0" width="170.0" height="46.0" rx="12"/><text class="t" x="820.4" y="364.6" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">Cell 3 · f3</tspan></text><rect class="bx" x="415.0" y="435.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="463.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Cell 4 · f2</tspan></text><rect class="bx" x="94.6" y="336.0" width="170.0" height="46.0" rx="12"/><text class="t" x="179.6" y="364.6" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Cell 5 · f3</tspan></text><rect class="bxa" x="94.6" y="138.0" width="170.0" height="46.0" rx="12"/><text class="t" x="179.6" y="166.6" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">Cell 6 · f1</tspan></text></svg>