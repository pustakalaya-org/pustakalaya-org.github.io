<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>INACTIVE lets a device sleep like IDLE but resume much faster.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="539.8" y1="98.9" x2="772.6" y2="314.6"/><polygon class="ah" points="780.6,322.1 776.7,310.2 768.4,319.1"/><line class="ln" x1="780.6" y1="322.1" x2="547.9" y2="106.4"/><polygon class="ah" points="539.8,98.9 543.8,110.8 552.0,101.9"/><line class="ln" x1="730.4" y1="359.0" x2="280.6" y2="359.0"/><polygon class="ah" points="269.6,359.0 280.6,365.1 280.6,353.0"/><line class="ln" x1="269.6" y1="359.0" x2="719.4" y2="359.0"/><polygon class="ah" points="730.4,359.0 719.4,352.9 719.4,365.1"/><line class="ln" x1="219.4" y1="322.1" x2="452.1" y2="106.4"/><polygon class="ah" points="460.2,98.9 448.0,101.9 456.2,110.8"/><rect class="lbg" x="582.2" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="212.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">RRCSetup</tspan></text><rect class="lbg" x="582.2" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="660.2" y="212.5" text-anchor="middle" font-size="13"><tspan x="660.2" dy="0.0">RRCRelease</tspan></text><rect class="lbg" x="422.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">RRCRelease + suspend</tspan></text><rect class="lbg" x="422.0" y="346.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="361.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">RRCResume</tspan></text><rect class="lbg" x="261.8" y="197.5" width="156" height="23.0" rx="6"/><text class="n" x="339.8" y="212.5" text-anchor="middle" font-size="13"><tspan x="339.8" dy="0.0">release / failure</tspan></text><rect class="bx" x="415.0" y="28.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="57.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">RRC_IDLE</tspan></text><text class="n" x="500.0" y="80.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">no context in RAN</tspan></text><rect class="bx" x="735.4" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="820.4" y="354.1" text-anchor="middle" font-size="16"><tspan x="820.4" dy="0.0">RRC_CONNECTED</tspan></text><text class="n" x="820.4" y="377.5" text-anchor="middle" font-size="13"><tspan x="820.4" dy="0.0">active data, handover</tspan></text><rect class="bx" x="94.6" y="325.5" width="170.0" height="67.0" rx="12"/><text class="t" x="179.6" y="354.1" text-anchor="middle" font-size="16"><tspan x="179.6" dy="0.0">RRC_INACTIVE</tspan></text><text class="n" x="179.6" y="377.5" text-anchor="middle" font-size="13"><tspan x="179.6" dy="0.0">context stored, RNA</tspan></text></svg>