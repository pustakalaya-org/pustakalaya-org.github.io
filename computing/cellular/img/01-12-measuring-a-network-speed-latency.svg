<svg class="dg" viewBox="0 0 1000 378" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Peak rates grew about a million-fold in 30 years; note the logarithmic scale.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">GSM data</tspan></text><rect class="bfill" x="280" y="14.0" width="24.0" height="28" rx="6"/><text class="n" x="314.0" y="33.0" text-anchor="start" font-size="15"><tspan x="314.0" dy="0.0">9.6 kbit/s</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">GPRS</tspan></text><rect class="bfill" x="280" y="64.0" width="124.0" height="28" rx="6"/><text class="n" x="414.0" y="83.0" text-anchor="start" font-size="15"><tspan x="414.0" dy="0.0">~171 kbit/s</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">UMTS (R99)</tspan></text><rect class="bfill" x="280" y="114.0" width="152.3" height="28" rx="6"/><text class="n" x="442.3" y="133.0" text-anchor="start" font-size="15"><tspan x="442.3" dy="0.0">384 kbit/s</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">HSPA+</tspan></text><rect class="bfill" x="280" y="164.0" width="315.6" height="28" rx="6"/><text class="n" x="605.6" y="183.0" text-anchor="start" font-size="15"><tspan x="605.6" dy="0.0">42 Mbit/s</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">LTE Cat 4</tspan></text><rect class="bfill" x="280" y="214.0" width="359.8" height="28" rx="6"/><text class="n" x="649.8" y="233.0" text-anchor="start" font-size="15"><tspan x="649.8" dy="0.0">150 Mbit/s</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">LTE-Advanced</tspan></text><rect class="bfill" x="280" y="264.0" width="425.8" height="28" rx="6"/><text class="n" x="715.8" y="283.0" text-anchor="start" font-size="15"><tspan x="715.8" dy="0.0">1 Gbit/s</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">5G (IMT-2020)</tspan></text><rect class="bfill" x="280" y="314.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="333.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">20 Gbit/s target</tspan></text><text class="n" x="996.0" y="368.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>