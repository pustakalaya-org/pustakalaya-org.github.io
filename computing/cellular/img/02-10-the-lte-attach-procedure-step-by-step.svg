<svg class="dg" viewBox="0 0 1000 849" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Authentication and security come before any bearer is created; the IP address arrives inside Attach Accept.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="842.5"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="842.5"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="842.5"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="842.5"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="842.5"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Phone</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">eNodeB</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">MME</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">HSS</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">S-GW / P-GW</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. RRC setup + Attach</tspan><tspan x="207.5" dy="18.8">Request</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="402.5" y="151.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. Initial UE Message</tspan></text><line class="ln" x1="305.0" y1="163.8" x2="489.0" y2="163.8"/><polygon class="ah" points="500.0,163.8 489.0,157.7 489.0,169.8"/><text class="n ml" x="597.5" y="177.8" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">3. Authentication</tspan><tspan x="597.5" dy="18.8">Info Request</tspan></text><line class="ln" x1="500.0" y1="208.8" x2="684.0" y2="208.8"/><polygon class="ah" points="695.0,208.8 684.0,202.7 684.0,214.8"/><text class="n ml" x="597.5" y="241.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">4. Vectors: RAND,</tspan><tspan x="597.5" dy="18.8">AUTN, XRES, KASME</tspan></text><line class="ln" x1="695.0" y1="272.5" x2="511.0" y2="272.5"/><polygon class="ah" points="500.0,272.5 511.0,278.6 511.0,266.4"/><text class="n ml" x="305.0" y="324.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">5. Authentication Request</tspan></text><line class="ln" x1="500.0" y1="336.2" x2="121.0" y2="336.2"/><polygon class="ah" points="110.0,336.2 121.0,342.3 121.0,330.2"/><text class="n ml" x="305.0" y="369.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">6. Authentication Response (RES)</tspan></text><line class="ln" x1="110.0" y1="381.2" x2="489.0" y2="381.2"/><polygon class="ah" points="500.0,381.2 489.0,375.2 489.0,387.3"/><text class="n ml" x="305.0" y="414.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">7. NAS Security Mode Command/Complete</tspan></text><line class="ln" x1="500.0" y1="426.2" x2="121.0" y2="426.2"/><polygon class="ah" points="110.0,426.2 121.0,432.3 121.0,420.2"/><text class="n ml" x="597.5" y="440.2" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">8. Update Location</tspan><tspan x="597.5" dy="18.8">Request</tspan></text><line class="ln" x1="500.0" y1="471.2" x2="684.0" y2="471.2"/><polygon class="ah" points="695.0,471.2 684.0,465.2 684.0,477.3"/><text class="n ml" x="597.5" y="504.0" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">9. Update Location</tspan><tspan x="597.5" dy="18.8">Answer (profile)</tspan></text><line class="ln lnd" x1="695.0" y1="535.0" x2="511.0" y2="535.0"/><polygon class="ah" points="500.0,535.0 511.0,541.0 511.0,529.0"/><text class="n ml" x="695.0" y="586.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">10. Create Session Request</tspan></text><line class="ln" x1="500.0" y1="598.8" x2="879.0" y2="598.8"/><polygon class="ah" points="890.0,598.8 879.0,592.7 879.0,604.8"/><text class="n ml" x="695.0" y="631.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">11. Create Session Response (IP)</tspan></text><line class="ln" x1="890.0" y1="643.8" x2="511.0" y2="643.8"/><polygon class="ah" points="500.0,643.8 511.0,649.8 511.0,637.7"/><text class="n ml" x="402.5" y="657.8" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">12. Initial Context</tspan><tspan x="402.5" dy="18.8">Setup (Attach Accept)</tspan></text><line class="ln" x1="500.0" y1="688.8" x2="316.0" y2="688.8"/><polygon class="ah" points="305.0,688.8 316.0,694.8 316.0,682.7"/><text class="n ml" x="305.0" y="740.2" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">13. Attach Complete</tspan></text><line class="ln" x1="110.0" y1="752.5" x2="489.0" y2="752.5"/><polygon class="ah" points="500.0,752.5 489.0,746.5 489.0,758.5"/><text class="n ml" x="695.0" y="785.2" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">14. Modify Bearer Request</tspan></text><line class="ln" x1="500.0" y1="797.5" x2="879.0" y2="797.5"/><polygon class="ah" points="890.0,797.5 879.0,791.5 879.0,803.5"/></svg>