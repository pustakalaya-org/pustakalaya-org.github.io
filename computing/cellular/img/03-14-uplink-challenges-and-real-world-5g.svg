<svg class="dg" viewBox="0 0 1000 278" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>A massive MIMO radio transmits around a thousand times more power than a phone (log scale).</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Phone PC3</tspan></text><rect class="bfill" x="280" y="14.0" width="48.2" height="28" rx="6"/><text class="n" x="338.2" y="33.0" text-anchor="start" font-size="15"><tspan x="338.2" dy="0.0">0.2 W (23 dBm)</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">HPUE PC2</tspan></text><rect class="bfill" x="280" y="64.0" width="96.5" height="28" rx="6"/><text class="n" x="386.5" y="83.0" text-anchor="start" font-size="15"><tspan x="386.5" dy="0.0">0.4 W (26 dBm)</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">FWA router PC1.5</tspan></text><rect class="bfill" x="280" y="114.0" width="144.9" height="28" rx="6"/><text class="n" x="434.9" y="133.0" text-anchor="start" font-size="15"><tspan x="434.9" dy="0.0">0.8 W (29 dBm)</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Small cell</tspan></text><rect class="bfill" x="280" y="164.0" width="272.7" height="28" rx="6"/><text class="n" x="562.7" y="183.0" text-anchor="start" font-size="15"><tspan x="562.7" dy="0.0">~5 W</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Massive MIMO macro</tspan></text><rect class="bfill" x="280" y="214.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="233.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~200 W+</tspan></text><text class="n" x="996.0" y="268.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>