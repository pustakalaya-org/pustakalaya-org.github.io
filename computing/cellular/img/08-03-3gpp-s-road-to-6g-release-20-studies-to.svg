<svg class="dg" viewBox="0 0 1000 237" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Dates after 2026 are plans agreed at the June 2026 plenaries; 3GPP has moved dates before.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="123.5" x2="980.0" y2="123.5"/><circle class="dot" cx="70.0" cy="123.5" r="9"/><line class="ln" x1="70.0" y1="114.5" x2="70.0" y2="105.5"/><text class="t" x="70.0" y="58.7" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">Mar 2025 ·</tspan><tspan x="70.0" dy="21.2">Workshop</tspan></text><text class="n" x="70.0" y="101.5" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">Incheon 6G workshop</tspan></text><circle class="dot" cx="165.6" cy="123.5" r="9"/><line class="ln" x1="165.6" y1="132.5" x2="165.6" y2="143.5"/><text class="t" x="165.6" y="163.9" text-anchor="middle" font-size="17"><tspan x="165.6" dy="0.0">Jun 2025 · Study</tspan><tspan x="165.6" dy="21.2">starts</tspan></text><text class="n" x="165.6" y="206.8" text-anchor="middle" font-size="13"><tspan x="165.6" dy="0.0">6G radio study approved</tspan></text><circle class="dot" cx="261.1" cy="123.5" r="9"/><line class="ln" x1="261.1" y1="114.5" x2="261.1" y2="105.5"/><text class="t" x="261.1" y="58.7" text-anchor="middle" font-size="17"><tspan x="261.1" dy="0.0">Mar 2026 · TR</tspan><tspan x="261.1" dy="21.2">22.870</tspan></text><text class="n" x="261.1" y="101.5" text-anchor="middle" font-size="13"><tspan x="261.1" dy="0.0">6G use cases approved</tspan></text><circle class="dot" cx="356.7" cy="123.5" r="9"/><line class="ln" x1="356.7" y1="132.5" x2="356.7" y2="143.5"/><text class="t" x="356.7" y="163.9" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">Jun 2026 ·</tspan><tspan x="356.7" dy="21.2">TSGs#112</tspan></text><text class="n" x="356.7" y="206.8" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">TR 38.914; Rel-21 dates</tspan></text><circle class="dot" cx="452.2" cy="123.5" r="9"/><line class="ln" x1="452.2" y1="114.5" x2="452.2" y2="105.5"/><text class="t" x="452.2" y="42.5" text-anchor="middle" font-size="17"><tspan x="452.2" dy="0.0">Sep 2026 ·</tspan><tspan x="452.2" dy="21.2">TSGs#113</tspan></text><text class="n" x="452.2" y="85.2" text-anchor="middle" font-size="13"><tspan x="452.2" dy="0.0">migration options</tspan><tspan x="452.2" dy="16.2">narrowed</tspan></text><circle class="dot" cx="547.8" cy="123.5" r="9"/><line class="ln" x1="547.8" y1="132.5" x2="547.8" y2="143.5"/><text class="t" x="547.8" y="163.9" text-anchor="m