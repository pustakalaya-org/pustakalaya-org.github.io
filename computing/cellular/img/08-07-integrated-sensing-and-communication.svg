<svg class="dg" viewBox="0 0 1000 519" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The target carries no device — the network senses it purely from reflected radio waves.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="76.5" x2="110.0" y2="512.5"/><line class="ln lnd life" x1="305.0" y1="76.5" x2="305.0" y2="512.5"/><line class="ln lnd life" x1="500.0" y1="76.5" x2="500.0" y2="512.5"/><line class="ln lnd life" x1="695.0" y1="76.5" x2="695.0" y2="512.5"/><line class="ln lnd life" x1="890.0" y1="76.5" x2="890.0" y2="512.5"/><g transform="translate(0,41.2)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Sensing app</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="215.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="305.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">Core sensing</tspan><tspan x="305.0" dy="22.5">function</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="410.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="500.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">gNB A</tspan><tspan x="500.0" dy="22.5">(transmit)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">Target (drone)</tspan></text></g><g transform="translate(0,41.2)"><rect class="bxa" x="800.5" y="-35.2" width="179.0" height="70.5" rx="12"/><text class="t" x="890.0" y="-5.0" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">gNB B</tspan><tspan x="890.0" dy="22.5">(receive)</tspan></text></g><text class="n ml" x="207.5" y="91.5" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. Sensing request:</tspan><tspan x="207.5" dy="18.8">area, target type</tspan></text><line class="ln" x1="110.0" y1="122.5" x2="294.0" y2="122.5"/><polygon class="ah" points="305.0,122.5 294.0,116.5 294.0,128.6"/><text class="n ml" x="402.5" y="155.2" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. Configure sensing</tspan><tspan x="402.5" dy="18.8">signal</tspan></text><line class="ln" x1="305.0" y1="186.2" x2="489.0" y2="186.2"/><polygon class="ah" points="500.0,186.2 489.0,180.2 489.0,192.3"/><text class="n ml" x="597.5" y="237.8" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">3. Configure echo measurement</tspan></text><line class="ln" x1="305.0" y1="250.0" x2="879.0" y2="250.0"/><polygon class="ah" points="890.0,250.0 879.0,243.9 879.0,256.1"/><text class="n ml" x="597.5" y="264.0" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">4. Radio signal (data</tspan><tspan x="597.5" dy="18.8">+ sensing)</tspan></text><line class="ln" x1="500.0" y1="295.0" x2="684.0" y2="295.0"/><polygon class="ah" points="695.0,295.0 684.0,288.9 684.0,301.1"/><text class="n ml" x="792.5" y="346.5" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">5. Reflected echo</tspan></text><line class="ln lnd" x1="695.0" y1="358.8" x2="879.0" y2="358.8"/><polygon class="ah" points="890.0,358.8 879.0,352.7 879.0,364.8"/><text class="n ml" x="597.5" y="391.5" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">6. Delay, Doppler, angle</tspan></text><line class="ln" x1="890.0" y1="403.8" x2="316.0" y2="403.8"/><polygon class="ah" points="305.0,403.8 316.0,409.8 316.0,397.7"/><text class="n ml" x="207.5" y="417.8" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">7. Track: position,</tspan><tspan x="207.5" dy="18.8">speed</tspan></text><line class="ln lnd" x1="305.0" y1="448.8" x2="121.0" y2="448.8"/><polygon class="ah" points="110.0,448.8 121.0,454.8 121.0,442.7"/></svg>