="18.8">_Get…</tspan></text><line class="ln" x1="695.0" y1="227.5" x2="879.0" y2="227.5"/><polygon class="ah" points="890.0,227.5 879.0,221.4 879.0,233.6"/><text class="n ml" x="792.5" y="297.8" text-anchor="middle" font-size="15"><tspan x="792.5" dy="0.0">4. 5G HE AV</tspan></text><line class="ln lnd" x1="890.0" y1="310.0" x2="706.0" y2="310.0"/><polygon class="ah" points="695.0,310.0 706.0,316.1 706.0,303.9"/><text class="n ml" x="305.0" y="342.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">5. Authentication Request (RAND, AUTN)</tspan></text><line class="ln" x1="500.0" y1="355.0" x2="121.0" y2="355.0"/><polygon class="ah" points="110.0,355.0 121.0,361.1 121.0,348.9"/><text class="n ml" x="305.0" y="387.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">6. Authentication Response (RES*)</tspan></text><line class="ln" x1="110.0" y1="400.0" x2="489.0" y2="400.0"/><polygon class="ah" points="500.0,400.0 489.0,393.9 489.0,406.1"/><text class="n ml" x="597.5" y="432.8" text-anchor="middle" font-size="15"><tspan x="597.5" dy="0.0">7. Confirm RES*</tspan></text><line class="ln" x1="500.0" y1="445.0" x2="684.0" y2="445.0"/><polygon class="ah" points="695.0,445.0 684.0,438.9 684.0,451.1"/><text class="n ml" x="305.0" y="477.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">8. Security Mode Command</tspan></text><line class="ln" x1="500.0" y1="490.0" x2="121.0" y2="490.0"/><polygon class="ah" points="110.0,490.0 121.0,496.1 121.0,483.9"/><text class="n ml" x="305.0" y="522.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">9. Security Mode Complete</tspan></text><line class="ln" x1="110.0" y1="535.0" x2="489.0" y2="535.0"/><polygon class="ah" points="500.0,535.0 489.0,529.0 489.0,541.0"/><text class="n ml" x="695.0" y="567.8" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">10. Nudm_UECM_Registration + SDM_Get</tspan></text><line class="ln" x1="500.0" y1="580.0" x2="879.0" y2="580.0"/><polygon class="ah" points="890.0,580.0 879.0,574.0 879.0,586.0"/><text class="n ml" x="305.0" y="594.0" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">11. Registration Accept (5G-GUTI, allowed</tspan><tspan x="305.0" dy="18.8">NSSAI)</tspan></text><line class="ln" x1="500.0" y1="625.0" x2="121.0" y2="625.0"/><polygon class="ah" points="110.0,625.0 121.0,631.0 121.0,619.0"/><text class="n ml" x="305.0" y="676.5" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">12. Registration Complete</tspan></text><line class="ln" x1="110.0" y1="688.8" x2="489.0" y2="688.8"/><polygon class="ah" points="500.0,688.8 489.0,682.7 489.0,694.8"/></svg>