<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each line is an open interface; F1 and E1 come from 3GPP, the rest from O-RAN.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="62.0" x2="789.3" y2="136.5"/><line class="ln" x1="789.3" y1="136.5" x2="860.7" y2="304.1"/><line class="ln" x1="860.7" y1="304.1" x2="660.5" y2="438.4"/><line class="ln" x1="860.7" y1="304.1" x2="339.5" y2="438.4"/><line class="ln" x1="660.5" y1="438.4" x2="339.5" y2="438.4"/><line class="ln" x1="339.5" y1="438.4" x2="139.3" y2="304.1"/><line class="ln" x1="500.0" y1="62.0" x2="210.7" y2="136.5"/><line class="ln" x1="500.0" y1="62.0" x2="339.5" y2="438.4"/><rect class="lbg" x="566.6" y="86.3" width="156" height="23.0" rx="6"/><text class="n" x="644.6" y="101.3" text-anchor="middle" font-size="13"><tspan x="644.6" dy="0.0">hosts</tspan></text><rect class="lbg" x="747.0" y="207.3" width="156" height="23.0" rx="6"/><text class="n" x="825.0" y="222.3" text-anchor="middle" font-size="13"><tspan x="825.0" dy="0.0">A1</tspan></text><rect class="lbg" x="682.6" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="760.6" y="373.2" text-anchor="middle" font-size="13"><tspan x="760.6" dy="0.0">E2</tspan></text><rect class="lbg" x="522.1" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="600.1" y="373.2" text-anchor="middle" font-size="13"><tspan x="600.1" dy="0.0">E2</tspan></text><rect class="lbg" x="422.0" y="425.4" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="440.4" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">F1</tspan></text><rect class="lbg" x="161.4" y="358.2" width="156" height="23.0" rx="6"/><text class="n" x="239.4" y="373.2" text-anchor="middle" font-size="13"><tspan x="239.4" dy="0.0">Open fronthaul</tspan></text><rect class="lbg" x="277.4" y="86.3" width="156" height="23.0" rx="6"/><text class="n" x="355.4" y="101.3" text-anchor="middle" font-size="13"><tspan x="355.4" dy="0.0">O2</tspan></text><rect class="lbg" x="341.7" y="237.2" width="156" height="23.0" rx="6"/><text class="n" x="419.7" y="252.2" text-anchor="middle" font-size="13"><tspan x="419.7" dy="0.0">O1</tspan></text><rect class="bxa" x="415.0" y="39.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="67.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">SMO</tspan></text><rect class="bx" x="704.3" y="113.5" width="170.0" height="46.0" rx="12"/><text class="t" x="789.3" y="142.1" text-anchor="middle" font-s