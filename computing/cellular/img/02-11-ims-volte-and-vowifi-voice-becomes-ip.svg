<svg class="dg" viewBox="0 0 1000 639" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The voice bearer is reserved before the phone rings, so speech gets priority from the first word.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="632.5"/><line class="ln lnd life" x1="305.0" y1="54.0" x2="305.0" y2="632.5"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="632.5"/><line class="ln lnd life" x1="695.0" y1="54.0" x2="695.0" y2="632.5"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="632.5"/><g transform="translate(0,30.0)"><rect class="bxa" x="20.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Phone A</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="215.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="305.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="305.0" dy="0.0">P-CSCF</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="410.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">S-CSCF / TAS</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="605.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="695.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="695.0" dy="0.0">PCRF + P-GW</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="800.5" y="-24.0" width="179.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Phone B</tspan></text></g><text class="n ml" x="207.5" y="69.0" text-anchor="middle" font-size="15"><tspan x="207.5" dy="0.0">1. SIP INVITE (SDP:</tspan><tspan x="207.5" dy="18.8">EVS, AMR-WB)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="294.0" y2="100.0"/><polygon class="ah" points="305.0,100.0 294.0,94.0 294.0,106.0"/><text class="n ml" x="402.5" y="151.5" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">2. INVITE</tspan></text><line class="ln" x1="305.0" y1="163.8" x2="489.0" y2="163.8"/><polygon class="ah" points="500.0,163.8 489.0,157.7 489.0,169.8"/><text class="n ml" x="695.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">3. INVITE (via B&#x27;s CSCFs)</tspan></text><line class="ln" x1="500.0" y1="208.8" x2="879.0" y2="208.8"/><polygon class="ah" points="890.0,208.8 879.0,202.7 879.0,214.8"/><text class="n ml" x="695.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="695.0" dy="0.0">4. 183 Session Progress (SDP answer)</tspan></text><line class="ln" x1="890.0" y1="253.8" x2="511.0" y2="253.8"/><polygon class="ah" points="500.0,253.8 511.0,259.8 511.0,247.7"/><text class="n ml" x="402.5" y="267.8" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">5. 183 Session</tspan><tspan x="402.5" dy="18.8">Progress</tspan></text><line class="ln" x1="500.0" y1="298.8" x2="316.0" y2="298.8"/><polygon class="ah" points="305.0,298.8 316.0,304.8 316.0,292.7"/><text class="n ml" x="500.0" y="350.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Rx: request voice QoS</tspan></text><line class="ln" x1="305.0" y1="362.5" x2="684.0" y2="362.5"/><polygon class="ah" points="695.0,362.5 684.0,356.4 684.0,368.6"/><text class="n ml" x="402.5" y="395.2" text-anchor="middle" font-size="15"><tspan x="402.5" dy="0.0">7. Dedicated QCI 1 bearer</tspan></text><line class="ln lnd" x1="695.0" y1="407.5" x2="121.0" y2="407.5"/><polygon class="ah" points="110.0,407.5 121.0,413.6 121.0,401.4"/><text class="n ml" x="500.0" y="440.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. 180 Ringing (via CSCFs)</tspan></text><line class="ln" x1="890.0" y1="452.5" x2="121.0" y2="452.5"/><polygon class="ah" points="110.0,452.5 121.0,458.6 121.0,446.4"/><text class="n ml" x="500.0" y="485.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">9. 200 OK</tspan></text><line class="ln" x1="890.0" y1="497.5" x2="121.0" y2="497.5"/><polygon class="ah" points="110.0,497.5 121.0,503.6 121.0,491.4"/><text class="n ml" x="500.0" y="530.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">10. ACK</tspan></text><line class="ln" x1="110.0" y1="542.5" x2="879.0" y2="542.5"/><polygon class="ah" points="890.0,542.5 879.0,536.5 879.0,548.5"/><text class="n ml" x="500.0" y="575.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">11. RTP voice every 20 ms</tspan></text><line class="ln lnd" x1="110.0" y1="587.5" x2="879.0" y2="587.5"/><polygon class="ah" points="890.0,587.5 879.0,581.5 879.0,593.5"/></svg>