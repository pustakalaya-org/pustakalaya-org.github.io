<svg class="dg" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Subcarrier spacing is 15 × 2^μ kHz; each step up halves the slot length.</title><style>svg.dg{--a:#be123c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=0</tspan></text><rect class="bfill" x="280" y="14.0" width="8.3" height="28" rx="6"/><text class="n" x="298.3" y="33.0" text-anchor="start" font-size="15"><tspan x="298.3" dy="0.0">15 kHz · 1 ms slot</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=1</tspan></text><rect class="bfill" x="280" y="64.0" width="16.6" height="28" rx="6"/><text class="n" x="306.6" y="83.0" text-anchor="start" font-size="15"><tspan x="306.6" dy="0.0">30 kHz · 0.5 ms</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=2</tspan></text><rect class="bfill" x="280" y="114.0" width="33.1" height="28" rx="6"/><text class="n" x="323.1" y="133.0" text-anchor="start" font-size="15"><tspan x="323.1" dy="0.0">60 kHz · 0.25 ms</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=3</tspan></text><rect class="bfill" x="280" y="164.0" width="66.2" height="28" rx="6"/><text class="n" x="356.2" y="183.0" text-anchor="start" font-size="15"><tspan x="356.2" dy="0.0">120 kHz · 125 µs</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=4</tspan></text><rect class="bfill" x="280" y="214.0" width="132.5" height="28" rx="6"/><text class="n" x="422.5" y="233.0" text-anchor="start" font-size="15"><tspan x="422.5" dy="0.0">240 kHz · SSB only</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=5</tspan></text><rect class="bfill" x="280" y="264.0" width="265.0" height="28" rx="6"/><text class="n" x="555.0" y="283.0" text-anchor="start" font-size="15"><tspan x="555.0" dy="0.0">480 kHz · FR2-2</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">μ=6</tspan></text><rect class="bfill" x="280" y="314.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="333.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">960 kHz · FR2-2</tspan></text></svg>