<svg class="dg" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The operator confirms the number from the device&#x27;s own mobile data session — no SMS code.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="433.8"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="433.8"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="433.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="433.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Banking app</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">App backend</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Aggregator</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Operator</tspan></text></g><text class="n ml" x="500.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">1. Auth request over mobile data (OIDC)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="879.0" y2="100.0"/><polygon class="ah" points="890.0,100.0 879.0,94.0 879.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Auth code (line identified)</tspan></text><line class="ln lnd" x1="890.0" y1="145.0" x2="121.0" y2="145.0"/><polygon class="ah" points="110.0,145.0 121.0,151.1 121.0,138.9"/><text class="n ml" x="240.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">3. Pass auth code</tspan></text><line class="ln" x1="110.0" y1="190.0" x2="359.0" y2="190.0"/><polygon class="ah" points="370.0,190.0 359.0,183.9 359.0,196.1"/><text class="n ml" x="500.0" y="222.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. Exchange code for token</tspan></text><line class="ln" x1="370.0" y1="235.0" x2="619.0" y2="235.0"/><polygon class="ah" points="630.0,235.0 619.0,228.9 619.0,241.1"/><text class="n ml" x="500.0" y="267.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. verify(phoneNumber)</tspan></text><line class="ln" x1="370.0" y1="280.0" x2="619.0" y2="280.0"/><polygon class="ah" points="630.0,280.0 619.0,273.9 619.0,286.1"/><text class="n ml" x="760.0" y="294.0" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">6. Route to customer&#x27;s</tspan><tspan x="760.0" dy="18.8">operator</tspan></text><line class="ln" x1="630.0" y1="325.0" x2="879.0" y2="325.0"/><polygon class="ah" points="890.0,325.0 879.0,318.9 879.0,331.1"/><text class="n ml" x="630.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="630.0" dy="0.0">7. devicePhoneNumberVerified: true</tspan></text><line class="ln lnd" x1="890.0" y1="388.8" x2="381.0" y2="388.8"/><polygon class="ah" points="370.0,388.8 381.0,394.8 381.0,382.7"/></svg>