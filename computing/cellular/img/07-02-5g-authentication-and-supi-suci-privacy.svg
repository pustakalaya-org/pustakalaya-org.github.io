<svg class="dg" viewBox="0 0 1000 613" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The visited AMF never sees the SUPI until the home AUSF has confirmed the subscriber&#x27;s response.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="606.2"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="606.2"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="606.2"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="606.2"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Phone (UE)</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">AMF / SEAF</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">AUSF</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">UDM / SIDF</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Registration Request</tspan><tspan x="240.0" dy="18.8">(SUCI)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. Authenticate (SUCI,</tspan><tspan x="500.0" dy="18.8">network name)</tspan></text><line class="ln" x1="370.0" y1="163.8" x2="619.0" y2="163.8"/><polygon class="ah" points="630.0,163.8 619.0,157.7 619.0,169.8"/><text class="n ml" x="760.0" y="215.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. Get auth vector</tspan></text><line class="ln" x1="630.0" y1="227.5" x2="879.0" y2="227.5"/><polygon class="ah" points="890.0,227.5 879.0,221.4 879.0,233.6"/><text class="n ml" x="760.0" y="260.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. RAND, AUTN, XRES*, KAUSF</tspan></text><line class="ln lnd" x1="890.0" y1="272.5" x2="641.0" y2="272.5"/><polygon class="ah" points="630.0,272.5 641.0,278.6 641.0,266.4"/><text class="n ml" x="500.0" y="305.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">5. RAND, AUTN, HXRES*</tspan></text><line class="ln lnd" x1="630.0" y1="317.5" x2="381.0" y2="317.5"/><polygon class="ah" points="370.0,317.5 381.0,323.6 381.0,311.4"/><text class="n ml" x="240.0" y="350.2" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">6. Authentication Request</tspan></text><line class="ln" x1="370.0" y1="362.5" x2="121.0" y2="362.5"/><polygon class="ah" points="110.0,362.5 121.0,368.6 121.0,356.4"/><text class="n ml" x="240.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">7. Authentication Response</tspan><tspan x="240.0" dy="18.8">(RES*)</tspan></text><line class="ln" x1="110.0" y1="407.5" x2="359.0" y2="407.5"/><polygon class="ah" points="370.0,407.5 359.0,401.4 359.0,413.6"/><text class="n ml" x="500.0" y="459.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. RES* for confirmation</tspan></text><line class="ln" x1="370.0" y1="471.2" x2="619.0" y2="471.2"/><polygon class="ah" points="630.0,471.2 619.0,465.2 619.0,477.3"/><text class="n ml" x="500.0" y="504.0" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">9. Success, KSEAF, SUPI</tspan></text><line class="ln lnd" x1="630.0" y1="516.2" x2="381.0" y2="516.2"/><polygon class="ah" points="370.0,516.2 381.0,522.3 381.0,510.2"/><text class="n ml" x="240.0" y="549.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">10. NAS Security Mode Command</tspan></text><line class="ln" x1="370.0" y1="561.2" x2="121.0" y2="561.2"/><polygon class="ah" points="110.0,561.2 121.0,567.3 121.0,555.2"/></svg>