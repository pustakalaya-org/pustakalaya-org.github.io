<svg class="dg" viewBox="0 0 1000 477" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The device does the hard work of correcting for satellite motion before it sends anything.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="471.0"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="471.0"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="471.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="471.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">UE</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">LEO satellite</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Gateway + gNB</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">5G core</tspan></text></g><text class="n ml" x="370.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">1. SSB + SIB19 (ephemeris, timing) via satellite</tspan></text><line class="ln" x1="630.0" y1="100.0" x2="121.0" y2="100.0"/><polygon class="ah" points="110.0,100.0 121.0,106.0 121.0,94.0"/><text class="n" x="180.0" y="153.9" text-anchor="start" font-size="15"><tspan x="180.0" dy="0.0">2. GNSS fix: pre-compensate</tspan><tspan x="180.0" dy="18.8">TA and Doppler</tspan></text><path class="ln" d="M110.0,145.0 H165.0 V171.0 H124.0"/><line class="ln" x1="130.0" y1="171.0" x2="124.0" y2="171.0"/><polygon class="ah" points="113.0,171.0 124.0,177.1 124.0,164.9"/><text class="n ml" x="370.0" y="188.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">3. PRACH preamble (relayed)</tspan></text><line class="ln" x1="110.0" y1="201.0" x2="619.0" y2="201.0"/><polygon class="ah" points="630.0,201.0 619.0,194.9 619.0,207.1"/><text class="n ml" x="370.0" y="233.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">4. Random access response</tspan></text><line class="ln lnd" x1="630.0" y1="246.0" x2="121.0" y2="246.0"/><polygon class="ah" points="110.0,246.0 121.0,252.1 121.0,239.9"/><text class="n ml" x="370.0" y="278.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">5. RRC setup request</tspan></text><line class="ln" x1="110.0" y1="291.0" x2="619.0" y2="291.0"/><polygon class="ah" points="630.0,291.0 619.0,284.9 619.0,297.1"/><text class="n ml" x="370.0" y="323.8" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">6. RRC setup</tspan></text><line class="ln lnd" x1="630.0" y1="336.0" x2="121.0" y2="336.0"/><polygon class="ah" points="110.0,336.0 121.0,342.1 121.0,329.9"/><text class="n ml" x="500.0" y="368.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. NAS registration request</tspan></text><line class="ln" x1="110.0" y1="381.0" x2="879.0" y2="381.0"/><polygon class="ah" points="890.0,381.0 879.0,374.9 879.0,387.1"/><text class="n ml" x="500.0" y="413.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">8. Registration accept</tspan></text><line class="ln lnd" x1="890.0" y1="426.0" x2="121.0" y2="426.0"/><polygon class="ah" points="110.0,426.0 121.0,432.1 121.0,419.9"/></svg>