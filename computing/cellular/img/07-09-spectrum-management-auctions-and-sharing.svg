<svg class="dg" viewBox="0 0 1000 366" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Raw totals mislead: bandwidth, population and licence length differ, which is why analysts normalise to $/MHz-pop.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="30.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">US C-band, Auction 107</tspan><tspan x="266.0" dy="20.0">(2021)</tspan></text><rect class="bfill" x="280" y="21.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="40.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">≈ $81 bn</tspan></text><text class="t" x="266.0" y="94.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">US 3.45 GHz, Auction 110</tspan><tspan x="266.0" dy="20.0">(2022)</tspan></text><rect class="bfill" x="280" y="85.0" width="147.0" height="28" rx="6"/><text class="n" x="437.0" y="104.0" text-anchor="start" font-size="15"><tspan x="437.0" dy="0.0">≈ $22.5 bn</tspan></text><text class="t" x="266.0" y="161.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">India multi-band (2022)</tspan></text><rect class="bfill" x="280" y="142.0" width="124.2" height="28" rx="6"/><text class="n" x="414.2" y="161.0" text-anchor="start" font-size="15"><tspan x="414.2" dy="0.0">≈ ₹1.5 lakh crore</tspan></text><text class="t" x="266.0" y="208.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Germany 2 GHz + 3.6 GHz</tspan><tspan x="266.0" dy="20.0">(2019)</tspan></text><rect class="bfill" x="280" y="199.0" width="47.7" height="28" rx="6"/><text class="n" x="337.7" y="218.0" text-anchor="start" font-size="15"><tspan x="337.7" dy="0.0">€6.55 bn</tspan></text><text class="t" x="266.0" y="272.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">US CBRS PALs, Auction 105</tspan><tspan x="266.0" dy="20.0">(2020)</tspan></text><rect class="bfill" x="280" y="263.0" width="30.1" height="28" rx="6"/><text class="n" x="320.1" y="282.0" text-anchor="start" font-size="15"><tspan x="320.1" dy="0.0">≈ $4.6 bn</tspan></text><text class="t" x="266.0" y="339.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">UK 700 MHz + 3.6 GHz (2021)</tspan></text><rect class="bfill" x="280" y="320.0" width="12.4" height="28" rx="6"/><text class="n" x="302.4" y="339.0" text-anchor="start" font-size="15"><tspan x="302.4" dy="0.0">£1.36 bn</tspan></text></svg>