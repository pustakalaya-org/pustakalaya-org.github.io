<svg class="dg" viewBox="0 0 1000 310" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each step adds orders of magnitude; optical ion and lattice clocks lead (approximate fractional uncertainty).</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Quartz watch</tspan></text><rect class="bfill" x="280" y="14.0" width="144.8" height="28" rx="6"/><text class="n" x="434.8" y="33.0" text-anchor="start" font-size="15"><tspan x="434.8" dy="0.0">~10⁻⁵</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Rubidium oscillator</tspan></text><rect class="bfill" x="280" y="64.0" width="318.6" height="28" rx="6"/><text class="n" x="608.6" y="83.0" text-anchor="start" font-size="15"><tspan x="608.6" dy="0.0">~10⁻¹¹</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Caesium beam clock</tspan></text><rect class="bfill" x="280" y="114.0" width="362.0" height="28" rx="6"/><text class="n" x="652.0" y="133.0" text-anchor="start" font-size="15"><tspan x="652.0" dy="0.0">~10⁻¹³</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Caesium fountain</tspan></text><rect class="bfill" x="280" y="164.0" width="463.4" height="28" rx="6"/><text class="n" x="753.4" y="183.0" text-anchor="start" font-size="15"><tspan x="753.4" dy="0.0">~10⁻¹⁶</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Optical lattice clock</tspan></text><rect class="bfill" x="280" y="214.0" width="521.3" height="28" rx="6"/><text class="n" x="811.3" y="233.0" text-anchor="start" font-size="15"><tspan x="811.3" dy="0.0">~10⁻¹⁸</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Al⁺ ion clock (NIST 2025)</tspan></text><rect class="bfill" x="280" y="264.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="283.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">5.5×10⁻¹⁹</tspan></text></svg>