<svg class="dg" viewBox="0 0 1000 647" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Programs flow down the stack, results flow back up; most jobs sit above the physics.</title><style>svg.dg{--a:#4f46e5;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><rect x="2" y="4.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.08;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="35.0" r="15"/><text class="bn" x="34.0" y="40.5" text-anchor="middle" font-size="16">1</text><text class="t" x="64.0" y="42.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Applications</tspan></text><line class="sep" x1="330.0" y1="16.0" x2="330.0" y2="54.0"/><text class="n" x="350.0" y="40.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">chemistry, finance, crypto, materials</tspan></text><rect x="2" y="74.0" width="996" height="75.0" rx="12" style="fill:var(--a);fill-opacity:0.12;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="111.5" r="15"/><text class="bn" x="34.0" y="117.0" text-anchor="middle" font-size="16">2</text><text class="t" x="64.0" y="106.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Algorithms &amp;</tspan><tspan x="64.0" dy="25.0">libraries</tspan></text><line class="sep" x1="330.0" y1="86.0" x2="330.0" y2="137.0"/><text class="n" x="350.0" y="117.1" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">VQE, QPE, Grover, Shor</tspan></text><rect x="2" y="157.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.16;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="188.0" r="15"/><text class="bn" x="34.0" y="193.5" text-anchor="middle" font-size="16">3</text><text class="t" x="64.0" y="195.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">SDKs &amp; languages</tspan></text><line class="sep" x1="330.0" y1="169.0" x2="330.0" y2="207.0"/><text class="n" x="350.0" y="193.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">Qiskit, Cirq, CUDA-Q, Q#</tspan></text><rect x="2" y="227.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.20;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="258.0" r="15"/><text class="bn" x="34.0" y="263.5" text-anchor="middle" font-size="16">4</text><text class="t" x="64.0" y="265.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">IR &amp; compiler</tspan></text><line class="sep" x1="330.0" y1="239.0" x2="330.0" y2="277.0"/><text class="n" x="350.0" y="263.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">OpenQASM 3, QIR, transpiler</tspan></text><rect x="2" y="297.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.24;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="328.0" r="15"/><text class="bn" x="34.0" y="333.5" text-anchor="middle" font-size="16">5</text><text class="t" x="64.0" y="335.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Runtime &amp; cloud</tspan></text><line class="sep" x1="330.0" y1="309.0" x2="330.0" y2="347.0"/><text class="n" x="350.0" y="333.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">queues, primitives, HPC links</tspan></text><rect x="2" y="367.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.28;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="398.0" r="15"/><text class="bn" x="34.0" y="403.5" text-anchor="middle" font-size="16">6</text><text class="t" x="64.0" y="405.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">QEC &amp; decoders</tspan></text><line class="sep" x1="330.0" y1="379.0" x2="330.0" y2="417.0"/><text class="n" x="350.0" y="403.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">syndromes decoded in real time</tspan></text><rect x="2" y="437.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.32;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="468.0" r="15"/><text class="bn" x="34.0" y="473.5" text-anchor="middle" font-size="16">7</text><text class="t" x="64.0" y="475.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Control electronics</tspan></text><line class="sep" x1="330.0" y1="449.0" x2="330.0" y2="487.0"/><text class="n" x="350.0" y="473.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">AWGs, FPGAs, cryo-CMOS</tspan></text><rect x="2" y="507.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.36;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="538.0" r="15"/><text class="bn" x="34.0" y="543.5" text-anchor="middle" font-size="16">8</text><text class="t" x="64.0" y="545.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Physical qubits</tspan></text><line class="sep" x1="330.0" y1="519.0" x2="330.0" y2="557.0"/><text class="n" x="350.0" y="543.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">transmons, ions, atoms, photons</tspan></text><rect x="2" y="577.0" width="996" height="62.0" rx="12" style="fill:var(--a);fill-opacity:0.40;stroke:var(--a);stroke-opacity:.55;stroke-width:1.5"/><circle class="bc" cx="34.0" cy="608.0" r="15"/><text class="bn" x="34.0" y="613.5" text-anchor="middle" font-size="16">9</text><text class="t" x="64.0" y="615.0" text-anchor="start" font-size="20"><tspan x="64.0" dy="0.0">Environment</tspan></text><line class="sep" x1="330.0" y1="589.0" x2="330.0" y2="627.0"/><text class="n" x="350.0" y="613.6" text-anchor="start" font-size="16"><tspan x="350.0" dy="0.0">fridge ~10 mK, vacuum, lasers</tspan></text></svg>