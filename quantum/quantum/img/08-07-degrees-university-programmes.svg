<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Many routes lead to the same jobs; research roles go through a PhD.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.8" y1="85.2" x2="688.8" y2="110.7"/><polygon class="ah" points="699.4,113.4 690.3,104.8 687.3,116.5"/><line class="ln" x1="809.6" y1="184.1" x2="840.2" y2="255.8"/><polygon class="ah" points="844.5,266.0 845.7,253.5 834.6,258.2"/><line class="ln" x1="721.0" y1="182.3" x2="401.9" y2="396.5"/><polygon class="ah" points="392.8,402.6 405.3,401.5 398.6,391.5"/><line class="ln" x1="699.3" y1="136.5" x2="311.7" y2="136.5"/><polygon class="ah" points="300.7,136.5 311.7,142.6 311.7,130.5"/><line class="ln" x1="806.6" y1="340.3" x2="723.7" y2="396.0"/><polygon class="ah" points="714.6,402.1 727.1,401.0 720.4,391.0"/><line class="ln" x1="770.9" y1="327.2" x2="440.0" y2="412.5"/><polygon class="ah" points="429.3,415.2 441.5,418.4 438.4,406.6"/><line class="ln" x1="570.7" y1="415.2" x2="239.8" y2="330.0"/><polygon class="ah" points="229.1,327.2 238.3,335.8 241.3,324.1"/><line class="ln" x1="570.5" y1="438.4" x2="440.5" y2="438.4"/><polygon class="ah" points="429.5,438.4 440.5,444.4 440.5,432.3"/><rect class="lbg" x="486.4" y="274.5" width="156" height="23.0" rx="6"/><text class="n" x="564.4" y="289.5" text-anchor="middle" font-size="13"><tspan x="564.4" dy="0.0">with projects</tspan></text><rect class="bx" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">School</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">maths, physics,</tspan><tspan x="500.0" dy="16.9">coding</tspan></text><rect class="bx" x="704.3" y="93.5" width="170.0" height="86.0" rx="12"/><text class="t" x="789.3" y="122.1" text-anchor="middle" font-size="16"><tspan x="789.3" dy="0.0">BSc</tspan><tspan x="789.3" dy="20.0">physics/CS/EE/m</tspan><tspan x="789.3" dy="20.0">aths</tspan></text><rect class="bx" x="775.7" y="270.6" width="170.0" height="67.0" rx="12"/><text class="t" x="860.7" y="299.2" text-anchor="middle" font-size="16"><tspan x="860.7" dy="0.0">MSc quantum</tspan></text><text class="n" x="860.7" y="322.6" text-anchor="middle" font-size="13"><tspan x="860.7" dy="0.0">1-2 years</tspan></text><rect class="bxa" x="575.5" y="404.9" width="170.0" height="67.0" rx="12"/><text class="t" x="660.5" y="433.5" text-anchor="middle" font-size="16"><tspan x="660.