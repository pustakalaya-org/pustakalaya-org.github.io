<svg class="dg" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Deadlines cluster around 2030 for high-risk systems and 2035 for everything else.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="107.2" x2="980.0" y2="107.2"/><circle class="dot" cx="70.0" cy="107.2" r="9"/><line class="ln" x1="70.0" y1="98.2" x2="70.0" y2="89.2"/><text class="t" x="70.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">2022 · CNSA 2.0</tspan></text><text class="n" x="70.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">NSA sets national-security</tspan><tspan x="70.0" dy="16.2">timeline</tspan></text><circle class="dot" cx="177.5" cy="107.2" r="9"/><line class="ln" x1="177.5" y1="116.2" x2="177.5" y2="127.2"/><text class="t" x="177.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="177.5" dy="0.0">2024 · FIPS 203-205</tspan></text><text class="n" x="177.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="177.5" dy="0.0">first NIST PQC standards</tspan></text><circle class="dot" cx="285.0" cy="107.2" r="9"/><line class="ln" x1="285.0" y1="98.2" x2="285.0" y2="89.2"/><text class="t" x="285.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="285.0" dy="0.0">2024 · Chrome</tspan><tspan x="285.0" dy="21.2">hybrid</tspan></text><text class="n" x="285.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="285.0" dy="0.0">X25519MLKEM768 on by default</tspan></text><circle class="dot" cx="392.5" cy="107.2" r="9"/><line class="ln" x1="392.5" y1="116.2" x2="392.5" y2="127.2"/><text class="t" x="392.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="392.5" dy="0.0">2025 · OpenSSH 10</tspan></text><text class="n" x="392.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="392.5" dy="0.0">ML-KEM hybrid default</tspan></text><circle class="dot" cx="500.0" cy="107.2" r="9"/><line class="ln" x1="500.0" y1="98.2" x2="500.0" y2="89.2"/><text class="t" x="500.0" y="63.7" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">2028 · UK NCSC</tspan></text><text class="n" x="500.0" y="85.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">discovery and plan complete</tspan></text><circle class="dot" cx="607.5" cy="107.2" r="9"/><line class="ln" x1="607.5" y1="116.2" x2="607.5" y2="127.2"/><text class="t" x="607.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="607.5" dy="0.0">2030 · Deprecate</tspan></text><text class="n" x="607.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="607.5" dy="0.0">NIST deprecates RSA/ECC; EU</tspan><tspan x="607.5" dy="16.2">high-risk done</tspan></text><circle class="dot" cx="715.0" cy="107.2" r="9"/><line class="ln" x1="715.0" y1="98.2" x2="715.0" y2="89.2"/><text class="t" x="715.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="715.0" dy="0.0">2031 · UK priority</tspan></text><text class="n" x="715.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="715.0" dy="0.0">highest-priority migrations</tspan><tspan x="715.0" dy="16.2">done</tspan></text><circle class="dot" cx="822.5" cy="107.2" r="9"/><line class="ln" x1="822.5" y1="116.2" x2="822.5" y2="127.2"/><text class="t" x="822.5" y="147.7" text-anchor="middle" font-size="17"><tspan x="822.5" dy="0.0">2033 · CNSA 2.0</tspan></text><text class="n" x="822.5" y="169.2" text-anchor="middle" font-size="13"><tspan x="822.5" dy="0.0">browsers, servers, cloud</tspan><tspan x="822.5" dy="16.2">exclusive</tspan></text><circle class="dot" cx="930.0" cy="107.2" r="9"/><line class="ln" x1="930.0" y1="98.2" x2="930.0" y2="89.2"/><text class="t" x="930.0" y="47.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2035 · Finish</tspan></text><text class="n" x="930.0" y="69.0" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">NIST disallows; UK and US</tspan><tspan x="930.0" dy="16.2">NSS complete</tspan></text></svg>