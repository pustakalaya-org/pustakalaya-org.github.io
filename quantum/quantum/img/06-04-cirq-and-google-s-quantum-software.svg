<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Cirq is the hub; specialised tools cover simulation, error correction, chemistry and fault-tolerant design.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="248.5" x2="500.0" y2="119.5"/><line class="ln" x1="583.3" y1="251.4" x2="715.3" y2="190.2"/><line class="ln" x1="620.0" y1="305.9" x2="760.6" y2="324.6"/><line class="ln" x1="533.4" y1="330.4" x2="631.4" y2="448.6"/><line class="ln" x1="466.6" y1="330.4" x2="368.6" y2="448.6"/><line class="ln" x1="380.0" y1="305.9" x2="239.4" y2="324.6"/><line class="ln" x1="416.7" y1="251.4" x2="284.7" y2="190.2"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">qsim</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">fast state-vector</tspan><tspan x="500.0" dy="16.9">simulator</tspan></text><rect class="bx" x="693.2" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="793.2" y="149.5" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Stim</tspan></text><text class="n" x="793.2" y="173.1" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">QEC / Clifford simulator</tspan></text><rect class="bx" x="765.6" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="865.6" y="334.0" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">OpenFermion</tspan></text><text class="n" x="865.6" y="357.5" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">chemistry Hamiltonians</tspan></text><rect class="bx" x="562.7" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="662.7" y="481.9" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Qualtran</tspan></text><text class="n" x="662.7" y="505.4" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">fault-tolerant algorithms</tspan></text><rect class="bx" x="237.3" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="337.3" y="481.9" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">cirq-google</tspan></text><text class="n" x="337.3" y="505.4" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">Google hardware access</tspan></text><rect class="bx" x="34.4" y="304.5" width="200.0" height="68.0" rx="12"/><text class="t" x="134.4" y="334.0" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Vendor modules</tspan></text><text class="n" x="134.4" y="357.5" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">IonQ, AQT, Pasqal</tspan></text><rect class="bx" x="106.8" y="120.1" width="200.0" height="68.0" rx="12"/><text class="t" x="206.8" y="149.5" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">ReCirq</tspan></text><text class="n" x="206.8" y="173.1" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">published experiments</tspan></text><rect class="bxa" x="385.0" y="253.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="286.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Cirq</tspan></text><text class="n" x="500.0" y="311.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">circuits, moments, devices</tspan></text></svg>