<svg class="dg" viewBox="0 0 1000 356" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Lower is better — but these mix medians, means and best-case prototypes, which is exactly why footnotes matter.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">IonQ EQC prototype (2025)</tspan></text><rect class="bfill" x="280" y="14.0" width="70.5" height="28" rx="6"/><text class="n" x="360.5" y="33.0" text-anchor="start" font-size="15"><tspan x="360.5" dy="0.0">0.01%</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Quantinuum Helios (2025)</tspan></text><rect class="bfill" x="280" y="64.0" width="281.6" height="28" rx="6"/><text class="n" x="571.6" y="83.0" text-anchor="start" font-size="15"><tspan x="571.6" dy="0.0">0.079%</tspan></text><text class="t" x="266.0" y="130.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Google Willow, CZ mean</tspan><tspan x="266.0" dy="20.0">(2024)</tspan></text><rect class="bfill" x="280" y="121.0" width="427.6" height="28" rx="6"/><text class="n" x="717.6" y="140.0" text-anchor="start" font-size="15"><tspan x="717.6" dy="0.0">0.33%</tspan></text><text class="t" x="266.0" y="197.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Zuchongzhi 3.0 (2025)</tspan></text><rect class="bfill" x="280" y="178.0" width="442.0" height="28" rx="6"/><text class="n" x="732.0" y="197.0" text-anchor="start" font-size="15"><tspan x="732.0" dy="0.0">0.38%</tspan></text><text class="t" x="266.0" y="247.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Harvard/QuEra atoms (2023)</tspan></text><rect class="bfill" x="280" y="228.0" width="470.0" height="28" rx="6"/><text class="n" x="760.0" y="247.0" text-anchor="start" font-size="15"><tspan x="760.0" dy="0.0">0.5%</tspan></text><text class="t" x="266.0" y="294.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Rigetti Cepheus-108Q median</tspan><tspan x="266.0" dy="20.0">(2026)</tspan></text><rect class="bfill" x="280" y="285.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="304.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">0.9%</tspan></text><text class="n" x="996.0" y="346.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>