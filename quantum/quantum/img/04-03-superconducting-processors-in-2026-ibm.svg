<svg class="dg" viewBox="0 0 1000 374" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>IBM&#x27;s 1,121-qubit Condor was a scaling test; today&#x27;s best-performing chips hold 100-160 qubits.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">IBM Condor (2023)</tspan></text><rect class="bfill" x="280" y="14.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="33.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">1,121</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Fujitsu-RIKEN (2025)</tspan></text><rect class="bfill" x="280" y="64.0" width="121.0" height="28" rx="6"/><text class="n" x="411.0" y="83.0" text-anchor="start" font-size="15"><tspan x="411.0" dy="0.0">256</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">IBM Heron r2/r3</tspan></text><rect class="bfill" x="280" y="114.0" width="73.8" height="28" rx="6"/><text class="n" x="363.8" y="133.0" text-anchor="start" font-size="15"><tspan x="363.8" dy="0.0">156</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">IBM Nighthawk (2025)</tspan></text><rect class="bfill" x="280" y="164.0" width="56.7" height="28" rx="6"/><text class="n" x="346.7" y="183.0" text-anchor="start" font-size="15"><tspan x="346.7" dy="0.0">120</tspan></text><text class="t" x="266.0" y="230.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Rigetti Cepheus-1-108Q</tspan><tspan x="266.0" dy="20.0">(2026)</tspan></text><rect class="bfill" x="280" y="221.0" width="51.1" height="28" rx="6"/><text class="n" x="341.1" y="240.0" text-anchor="start" font-size="15"><tspan x="341.1" dy="0.0">108</tspan></text><text class="t" x="266.0" y="297.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Google Willow (2024)</tspan></text><rect class="bfill" x="280" y="278.0" width="49.6" height="28" rx="6"/><text class="n" x="339.6" y="297.0" text-anchor="start" font-size="15"><tspan x="339.6" dy="0.0">105</tspan></text><text class="t" x="266.0" y="347.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">USTC Zuchongzhi 3.0 (2025)</tspan></text><rect class="bfill" x="280" y="328.0" width="49.6" height="28" rx="6"/><text class="n" x="339.6" y="347.0" text-anchor="start" font-size="15"><tspan x="339.6" dy="0.0">105</tspan></text></svg>