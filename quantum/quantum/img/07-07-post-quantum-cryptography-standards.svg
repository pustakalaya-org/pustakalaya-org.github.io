<svg class="dg" viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Post-quantum keys and signatures are much larger than elliptic-curve ones — the main deployment cost.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">X25519 public key</tspan></text><rect class="bfill" x="280" y="14.0" width="52.5" height="28" rx="6"/><text class="n" x="342.5" y="33.0" text-anchor="start" font-size="15"><tspan x="342.5" dy="0.0">32</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ECDSA P-256 signature</tspan></text><rect class="bfill" x="280" y="64.0" width="105.2" height="28" rx="6"/><text class="n" x="395.2" y="83.0" text-anchor="start" font-size="15"><tspan x="395.2" dy="0.0">64</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">RSA-2048 signature</tspan></text><rect class="bfill" x="280" y="114.0" width="210.6" height="28" rx="6"/><text class="n" x="500.6" y="133.0" text-anchor="start" font-size="15"><tspan x="500.6" dy="0.0">256</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">FN-DSA-512 signature</tspan></text><rect class="bfill" x="280" y="164.0" width="283.3" height="28" rx="6"/><text class="n" x="573.3" y="183.0" text-anchor="start" font-size="15"><tspan x="573.3" dy="0.0">~666</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ML-KEM-768 public key</tspan></text><rect class="bfill" x="280" y="214.0" width="327.0" height="28" rx="6"/><text class="n" x="617.0" y="233.0" text-anchor="start" font-size="15"><tspan x="617.0" dy="0.0">1,184</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ML-DSA-65 signature</tspan></text><rect class="bfill" x="280" y="264.0" width="405.2" height="28" rx="6"/><text class="n" x="695.2" y="283.0" text-anchor="start" font-size="15"><tspan x="695.2" dy="0.0">3,309</tspan></text><text class="t" x="266.0" y="333.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SLH-DSA-128s signature</tspan></text><rect class="bfill" x="280" y="314.0" width="470.9" height="28" rx="6"/><text class="n" x="760.9" y="333.0" text-anchor="start" font-size="15"><tspan x="760.9" dy="0.0">7,856</tspan></text><text class="t" x="266.0" y="383.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">SLH-DSA-128f signature</tspan></text><rect class="bfill" x="280" y="364.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="383.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">17,088</tspan></text><text class="n" x="996.0" y="418.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>