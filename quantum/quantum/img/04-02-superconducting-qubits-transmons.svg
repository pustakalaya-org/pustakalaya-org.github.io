<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each qubit needs a drive path, a coupler to its neighbours and a readout chain.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="589.9" y1="81.9" x2="661.0" y2="97.7"/><polygon class="ah" points="671.7,100.1 662.3,91.8 659.7,103.6"/><line class="ln" x1="790.6" y1="157.4" x2="827.7" y2="205.4"/><polygon class="ah" points="834.5,214.1 832.5,201.7 823.0,209.1"/><line class="ln" x1="834.5" y1="305.9" x2="797.4" y2="353.9"/><polygon class="ah" points="790.6,362.6 802.1,357.6 792.6,350.2"/><line class="ln" x1="732.6" y1="157.4" x2="550.0" y2="393.4"/><polygon class="ah" points="543.3,402.1 554.8,397.1 545.2,389.7"/><line class="ln" x1="410.1" y1="438.1" x2="339.0" y2="422.3"/><polygon class="ah" points="328.3,419.9 337.7,428.2 340.3,416.4"/><line class="ln" x1="209.4" y1="362.6" x2="172.3" y2="314.6"/><polygon class="ah" points="165.5,305.9 167.5,318.3 177.0,310.9"/><line class="ln" x1="165.5" y1="214.1" x2="202.6" y2="166.1"/><polygon class="ah" points="209.4,157.4 197.9,162.4 207.4,169.8"/><rect class="lbg" x="552.8" y="78.0" width="156" height="23.0" rx="6"/><text class="n" x="630.8" y="93.0" text-anchor="middle" font-size="13"><tspan x="630.8" dy="0.0">pulse</tspan></text><rect class="lbg" x="737.8" y="317.0" width="156" height="23.0" rx="6"/><text class="n" x="815.8" y="332.0" text-anchor="middle" font-size="13"><tspan x="815.8" dy="0.0">CZ</tspan></text><rect class="lbg" x="552.8" y="276.0" width="156" height="23.0" rx="6"/><text class="n" x="630.8" y="291.0" text-anchor="middle" font-size="13"><tspan x="630.8" dy="0.0">dispersive</tspan></text><rect class="lbg" x="106.2" y="317.0" width="156" height="23.0" rx="6"/><text class="n" x="184.2" y="332.0" text-anchor="middle" font-size="13"><tspan x="184.2" dy="0.0">signal</tspan></text><rect class="bx" x="415.0" y="20.0" width="170.0" height="83.9" rx="12"/><text class="t" x="500.0" y="48.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Drive line</tspan></text><text class="n" x="500.0" y="72.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">shaped microwave</tspan><tspan x="500.0" dy="16.9">pulses</tspan></text><rect class="bxa" x="676.6" y="86.5" width="170.0" height="67.0" rx="12"/><text class="t" x="761.6" y="115.1" text-anchor="middle" font-size="16"><tspan x="761.6" dy="0.0">Transmon</tspan></text><text class="n" x="761.6" y="138.5" text-anchor="middle" font-size="13"><tspan x="761.6" dy="0.0">junction + capacitor</tspan></text><rect class="bx" x="785.0" y="218.1" width="170.0" height="83.9" rx="12"/><text class="t" x="870.0" y="246.7" text-anchor="middle" font-size="16"><tspan x="870.0" dy="0.0">Tunable coupler</tspan></text><text class="n" x="870.0" y="270.0" text-anchor="middle" font-size="13"><tspan x="870.0" dy="0.0">turns interaction</tspan><tspan x="870.0" dy="16.9">on/off</tspan></text><rect class="bx" x="676.6" y="366.5" width="170.0" height="67.0" rx="12"/><text class="t" x="761.6" y="395.1" text-anchor="middle" font-size="16"><tspan x="761.6" dy="0.0">Neighbour qubit</tspan></text><text class="n" x="761.6" y="418.5" text-anchor="middle" font-size="13"><tspan x="761.6" dy="0.0">partner for CZ</tspan></text><rect class="bx" x="415.0" y="406.1" width="170.0" height="103.9" rx="12"/><text class="t" x="500.0" y="434.7" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Readout</tspan><tspan x="500.0" dy="20.0">resonator</tspan></text><text class="n" x="500.0" y="478.1" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">frequency shifts with</tspan><tspan x="500.0" dy="16.9">state</tspan></text><rect class="bx" x="153.4" y="366.5" width="170.0" height="67.0" rx="12"/><text class="t" x="238.4" y="395.1" text-anchor="middle" font-size="16"><tspan x="238.4" dy="0.0">Purcell filter</tspan></text><text class="n" x="238.4" y="418.5" text-anchor="middle" font-size="13"><tspan x="238.4" dy="0.0">protects T1</tspan></text><rect class="bx" x="45.0" y="218.1" width="170.0" height="83.9" rx="12"/><text class="t" x="130.0" y="246.7" text-anchor="middle" font-size="16"><tspan x="130.0" dy="0.0">TWPA / JPA</tspan></text><text class="n" x="130.0" y="270.0" text-anchor="middle" font-size="13"><tspan x="130.0" dy="0.0">quantum-limited</tspan><tspan x="130.0" dy="16.9">amplifier</tspan></text><rect class="bx" x="153.4" y="86.5" width="170.0" height="67.0" rx="12"/><text class="t" x="238.4" y="115.1" text-anchor="middle" font-size="16"><tspan x="238.4" dy="0.0">HEMT at 4 K</tspan></text><text class="n" x="238.4" y="138.5" text-anchor="middle" font-size="13"><tspan x="238.4" dy="0.0">second amplifier</tspan></text></svg>