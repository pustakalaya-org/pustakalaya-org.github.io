<svg class="dg" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Algorithms improved from simple product formulas to provably optimal query complexity.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="102.2" x2="980.0" y2="102.2"/><circle class="dot" cx="70.0" cy="102.2" r="9"/><line class="ln" x1="70.0" y1="93.2" x2="70.0" y2="84.2"/><text class="t" x="70.0" y="58.7" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">1982 · Feynman</tspan></text><text class="n" x="70.0" y="80.2" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">simulate physics with quantum machines</tspan></text><circle class="dot" cx="213.3" cy="102.2" r="9"/><line class="ln" x1="213.3" y1="111.2" x2="213.3" y2="122.2"/><text class="t" x="213.3" y="142.7" text-anchor="middle" font-size="17"><tspan x="213.3" dy="0.0">1996 · Lloyd</tspan></text><text class="n" x="213.3" y="164.2" text-anchor="middle" font-size="13"><tspan x="213.3" dy="0.0">Trotter circuits for local</tspan><tspan x="213.3" dy="16.2">Hamiltonians</tspan></text><circle class="dot" cx="356.7" cy="102.2" r="9"/><line class="ln" x1="356.7" y1="93.2" x2="356.7" y2="84.2"/><text class="t" x="356.7" y="58.7" text-anchor="middle" font-size="17"><tspan x="356.7" dy="0.0">2007 · Berry et al.</tspan></text><text class="n" x="356.7" y="80.2" text-anchor="middle" font-size="13"><tspan x="356.7" dy="0.0">sparse Hamiltonians, higher orders</tspan></text><circle class="dot" cx="500.0" cy="102.2" r="9"/><line class="ln" x1="500.0" y1="111.2" x2="500.0" y2="122.2"/><text class="t" x="500.0" y="142.7" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">2012 · LCU</tspan></text><text class="n" x="500.0" y="164.2" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Childs-Wiebe linear combinations</tspan></text><circle class="dot" cx="643.3" cy="102.2" r="9"/><line class="ln" x1="643.3" y1="93.2" x2="643.3" y2="84.2"/><text class="t" x="643.3" y="58.7" text-anchor="middle" font-size="17"><tspan x="643.3" dy="0.0">2017 · QSP</tspan></text><text class="n" x="643.3" y="80.2" text-anchor="middle" font-size="13"><tspan x="643.3" dy="0.0">Low-Chuang optimal simulation</tspan></text><circle class="dot" cx="786.7" cy="102.2" r="9"/><line class="ln" x1="786.7" y1="111.2" x2="786.7" y2="122.2"/><text class="t" x="786.7" y="142.7" text-anchor="middle" font-size="17"><tspan x="786.7" dy="0.0">2019 · Qubitisation,</tspan><tspan x="786.7" dy="21.2">qDRIFT</tspan></text><text class="n" x="786.7" y="185.5" text-anchor="middle" font-size="13"><tspan x="786.7" dy="0.0">optimal and randomised methods</tspan></text><circle class="dot" cx="930.0" cy="102.2" r="9"/><line class="ln" x1="930.0" y1="93.2" x2="930.0" y2="84.2"/><text class="t" x="930.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2023 · Utility runs</tspan></text><text class="n" x="930.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">127-qubit Trotter circuits on IBM</tspan><tspan x="930.0" dy="16.2">Eagle</tspan></text></svg>