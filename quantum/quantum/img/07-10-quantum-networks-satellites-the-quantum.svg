<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Short entangled links are joined by swapping at repeaters with quantum memories.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="80.0" y1="260.0" x2="360.0" y2="260.0"/><line class="ln" x1="360.0" y1="260.0" x2="640.0" y2="260.0"/><line class="ln" x1="640.0" y1="260.0" x2="920.0" y2="260.0"/><rect class="lbg" x="142.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="220.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="220.0" dy="0.0">50 km link</tspan></text><rect class="lbg" x="422.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="500.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">50 km link</tspan></text><rect class="lbg" x="702.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="780.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="780.0" dy="0.0">50 km link</tspan></text><rect class="bx" x="-5.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="80.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="80.0" dy="0.0">Alice node</tspan></text><text class="n" x="80.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="80.0" dy="0.0">memory + processor</tspan></text><rect class="bxa" x="275.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="360.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0.0">Repeater 1</tspan></text><text class="n" x="360.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="360.0" dy="0.0">memory, swap</tspan></text><rect class="bxa" x="555.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="640.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="640.0" dy="0.0">Repeater 2</tspan></text><text class="n" x="640.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="640.0" dy="0.0">memory, swap</tspan></text><rect class="bx" x="835.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="920.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="920.0" dy="0.0">Bob node</tspan></text><text class="n" x="920.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="920.0" dy="0.0">memory + processor</tspan></text></svg>