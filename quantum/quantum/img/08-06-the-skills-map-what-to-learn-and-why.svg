<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Everyone needs the maths and Python core; the other skills depend on your track.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="119.5" x2="500.0" y2="222.2"/><polygon class="ah" points="500.0,233.2 506.1,222.2 493.9,222.2"/><line class="ln" x1="687.8" y1="180.8" x2="602.9" y2="230.2"/><polygon class="ah" points="593.3,235.7 605.9,235.4 599.8,225.0"/><line class="ln" x1="770.0" y1="290.0" x2="631.0" y2="290.0"/><polygon class="ah" points="620.0,290.0 631.0,296.1 631.0,283.9"/><line class="ln" x1="687.8" y1="399.2" x2="602.9" y2="349.8"/><polygon class="ah" points="593.3,344.3 599.8,355.0 605.9,344.6"/><line class="ln" x1="500.0" y1="469.0" x2="500.0" y2="357.8"/><polygon class="ah" points="500.0,346.8 493.9,357.8 506.1,357.8"/><line class="ln" x1="312.2" y1="399.2" x2="397.1" y2="349.8"/><polygon class="ah" points="406.7,344.3 394.1,344.6 400.2,355.0"/><line class="ln" x1="230.0" y1="290.0" x2="369.0" y2="290.0"/><polygon class="ah" points="380.0,290.0 369.0,283.9 369.0,296.1"/><line class="ln" x1="297.6" y1="172.4" x2="397.1" y2="230.2"/><polygon class="ah" points="406.7,235.7 400.2,225.0 394.1,235.4"/><rect class="bx" x="400.0" y="29.5" width="200.0" height="84.9" rx="12"/><text class="t" x="500.0" y="59.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Linear algebra</tspan></text><text class="n" x="500.0" y="82.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">vectors, matrices,</tspan><tspan x="500.0" dy="16.9">eigenvalues</tspan></text><rect class="bx" x="665.2" y="93.4" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="122.9" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Probability</tspan></text><text class="n" x="765.2" y="146.4" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">distributions, sampling,</tspan><tspan x="765.2" dy="16.9">statistics</tspan></text><rect class="bx" x="775.0" y="247.6" width="200.0" height="84.9" rx="12"/><text class="t" x="875.0" y="277.0" text-anchor="middle" font-size="17"><tspan x="875.0" dy="0.0">Python &amp; SDKs</tspan></text><text class="n" x="875.0" y="300.6" text-anchor="middle" font-size="13"><tspan x="875.0" dy="0.0">NumPy,</tspan><tspan x="875.0" dy="16.9">Qiskit/Cirq/PennyLane</tspan></text><rect class="bx" x="665.2" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="765.2" y="431.1" text-anchor="middle" font-size="17"><tspan x="765.2" dy="0.0">Quantum basics</tspan></text><text class="n" x="765.2" y="454.7" text-anchor="middle" font-size="13"><tspan x="765.2" dy="0.0">circuits, measurement,</tspan><tspan x="765.2" dy="16.9">noise</tspan></text><rect class="bx" x="400.0" y="474.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="503.4" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">CS theory</tspan></text><text class="n" x="500.0" y="527.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">algorithms, complexity</tspan></text><rect class="bx" x="134.8" y="401.7" width="200.0" height="84.9" rx="12"/><text class="t" x="234.8" y="431.1" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Physics</tspan></text><text class="n" x="234.8" y="454.7" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">QM, electromagnetism,</tspan><tspan x="234.8" dy="16.9">optics</tspan></text><rect class="bx" x="25.0" y="256.0" width="200.0" height="68.0" rx="12"/><text class="t" x="125.0" y="285.4" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0.0">Engineering</tspan></text><text class="n" x="125.0" y="309.0" text-anchor="middle" font-size="13"><tspan x="125.0" dy="0.0">RF, FPGA, cryogenics</tspan></text><rect class="bx" x="134.8" y="101.9" width="200.0" height="68.0" rx="12"/><text class="t" x="234.8" y="131.3" text-anchor="middle" font-size="17"><tspan x="234.8" dy="0.0">Communication</tspan></text><text class="n" x="234.8" y="154.9" text-anchor="middle" font-size="13"><tspan x="234.8" dy="0.0">writing, talks, teamwork</tspan></text><rect class="bxa" x="385.0" y="238.2" width="230.0" height="103.5" rx="12"/><text class="t" x="500.0" y="271.1" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Job-ready</tspan><tspan x="500.0" dy="26.2">quantum</tspan><tspan x="500.0" dy="26.2">professional</tspan></text></svg>