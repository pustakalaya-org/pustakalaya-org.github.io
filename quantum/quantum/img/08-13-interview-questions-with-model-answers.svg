<svg class="dg" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each stage tests something different; prepare for all of them.</title><style>svg.dg{--a:#ea580c;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="433.8"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="433.8"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="433.8"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="433.8"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Candidate</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Recruiter</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Engineer</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">Hiring manager</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. Screen: background,</tspan><tspan x="240.0" dy="18.8">motivation</tspan></text><line class="ln" x1="370.0" y1="100.0" x2="121.0" y2="100.0"/><polygon class="ah" points="110.0,100.0 121.0,106.0 121.0,94.0"/><text class="n ml" x="240.0" y="151.5" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">2. Portfolio &amp; CV walkthrough</tspan></text><line class="ln lnd" x1="110.0" y1="163.8" x2="359.0" y2="163.8"/><polygon class="ah" points="370.0,163.8 359.0,157.7 359.0,169.8"/><text class="n ml" x="370.0" y="196.5" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">3. Concepts: qubits, gates, noise</tspan></text><line class="ln" x1="630.0" y1="208.8" x2="121.0" y2="208.8"/><polygon class="ah" points="110.0,208.8 121.0,214.8 121.0,202.7"/><text class="n ml" x="370.0" y="241.5" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">4. Explain + derive on whiteboard</tspan></text><line class="ln lnd" x1="110.0" y1="253.8" x2="619.0" y2="253.8"/><polygon class="ah" points="630.0,253.8 619.0,247.7 619.0,259.8"/><text class="n ml" x="370.0" y="286.5" text-anchor="middle" font-size="15"><tspan x="370.0" dy="0.0">5. Coding: build &amp; analyse a circuit</tspan></text><line class="ln" x1="630.0" y1="298.8" x2="121.0" y2="298.8"/><polygon class="ah" points="110.0,298.8 121.0,304.8 121.0,292.7"/><text class="n ml" x="500.0" y="331.5" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">6. Role deep dive + behavioural</tspan></text><line class="ln" x1="890.0" y1="343.8" x2="121.0" y2="343.8"/><polygon class="ah" points="110.0,343.8 121.0,349.8 121.0,337.7"/><text class="n ml" x="630.0" y="376.5" text-anchor="middle" font-size="15"><tspan x="630.0" dy="0.0">7. Hiring decision</tspan></text><line class="ln" x1="890.0" y1="388.8" x2="381.0" y2="388.8"/><polygon class="ah" points="370.0,388.8 381.0,394.8 381.0,382.7"/></svg>