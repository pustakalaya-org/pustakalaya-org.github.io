<svg class="dg" viewBox="0 0 1000 162" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Several headline speed-ups shrank once classical researchers were given a fair comparison.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="86.0" x2="980.0" y2="86.0"/><circle class="dot" cx="70.0" cy="86.0" r="9"/><line class="ln" x1="70.0" y1="77.0" x2="70.0" y2="68.0"/><text class="t" x="70.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">2016 · Kerenidis-Prakash</tspan></text><text class="n" x="70.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">quantum recommendation systems</tspan></text><circle class="dot" cx="242.0" cy="86.0" r="9"/><line class="ln" x1="242.0" y1="95.0" x2="242.0" y2="106.0"/><text class="t" x="242.0" y="126.5" text-anchor="middle" font-size="17"><tspan x="242.0" dy="0.0">2018 · Tang</tspan></text><text class="n" x="242.0" y="148.0" text-anchor="middle" font-size="13"><tspan x="242.0" dy="0.0">classical recommendation, poly-log time</tspan></text><circle class="dot" cx="414.0" cy="86.0" r="9"/><line class="ln" x1="414.0" y1="77.0" x2="414.0" y2="68.0"/><text class="t" x="414.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="414.0" dy="0.0">2020 · Chia et al.</tspan></text><text class="n" x="414.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="414.0" dy="0.0">dequantised low-rank QSVT</tspan></text><circle class="dot" cx="586.0" cy="86.0" r="9"/><line class="ln" x1="586.0" y1="95.0" x2="586.0" y2="106.0"/><text class="t" x="586.0" y="126.5" text-anchor="middle" font-size="17"><tspan x="586.0" dy="0.0">2022 · Pan-Chen-Zhang</tspan></text><text class="n" x="586.0" y="148.0" text-anchor="middle" font-size="13"><tspan x="586.0" dy="0.0">tensor networks match Sycamore sampling</tspan></text><circle class="dot" cx="758.0" cy="86.0" r="9"/><line class="ln" x1="758.0" y1="77.0" x2="758.0" y2="68.0"/><text class="t" x="758.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="758.0" dy="0.0">2023 · Tindall et al.</tspan></text><text class="n" x="758.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="758.0" dy="0.0">IBM utility circuits simulated</tspan></text><circle class="dot" cx="930.0" cy="86.0" r="9"/><line class="ln" x1="930.0" y1="95.0" x2="930.0" y2="106.0"/><text class="t" x="930.0" y="126.5" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2026 · Flatiron/BU</tspan></text><text class="n" x="930.0" y="148.0" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.