<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Edges are CZ bonds; measuring left to right pushes the logical qubit along the chain.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="170.0" y1="260.0" x2="189.0" y2="260.0"/><polygon class="ah" points="200.0,260.0 189.0,253.9 189.0,266.1"/><line class="ln" x1="380.0" y1="260.0" x2="399.0" y2="260.0"/><polygon class="ah" points="410.0,260.0 399.0,253.9 399.0,266.1"/><line class="ln" x1="590.0" y1="260.0" x2="609.0" y2="260.0"/><polygon class="ah" points="620.0,260.0 609.0,253.9 609.0,266.1"/><line class="ln" x1="800.0" y1="260.0" x2="819.0" y2="260.0"/><polygon class="ah" points="830.0,260.0 819.0,253.9 819.0,266.1"/><rect class="lbg" x="107.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="185.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="185.0" dy="0.0">CZ</tspan></text><rect class="lbg" x="317.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="395.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="395.0" dy="0.0">CZ</tspan></text><rect class="lbg" x="527.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="605.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="605.0" dy="0.0">CZ</tspan></text><rect class="lbg" x="737.0" y="247.0" width="156" height="23.0" rx="6"/><text class="n" x="815.0" y="262.0" text-anchor="middle" font-size="13"><tspan x="815.0" dy="0.0">CZ</tspan></text><rect class="bx" x="-5.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="80.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="80.0" dy="0.0">Input |ψ⟩</tspan></text><text class="n" x="80.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="80.0" dy="0.0">measure at θ1</tspan></text><rect class="bx" x="205.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="290.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="290.0" dy="0.0">Qubit 2</tspan></text><text class="n" x="290.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="290.0" dy="0.0">measure at ±θ2</tspan></text><rect class="bx" x="415.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="500.0" y="255.1" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Qubit 3</tspan></text><text class="n" x="500.0" y="278.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">measure at ±θ3</tspan></text><rect class="bx" x="625.0" y="226.5" width="170.0" height="67.0" rx="12"/><text class="t" x="710.0" y=