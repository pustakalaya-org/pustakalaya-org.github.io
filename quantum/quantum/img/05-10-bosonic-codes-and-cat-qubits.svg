<svg class="dg" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Cats store data; transmons between them measure phase-flip parities along a single line.</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="80.0" y1="260.0" x2="185.0" y2="260.0"/><line class="ln" x1="185.0" y1="260.0" x2="290.0" y2="260.0"/><line class="ln" x1="290.0" y1="260.0" x2="395.0" y2="260.0"/><line class="ln" x1="395.0" y1="260.0" x2="500.0" y2="260.0"/><line class="ln" x1="500.0" y1="260.0" x2="605.0" y2="260.0"/><line class="ln" x1="605.0" y1="260.0" x2="710.0" y2="260.0"/><line class="ln" x1="710.0" y1="260.0" x2="815.0" y2="260.0"/><line class="ln" x1="815.0" y1="260.0" x2="920.0" y2="260.0"/><rect class="bxa" x="-5.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="80.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="80.0" dy="0.0">Cat 1</tspan></text><rect class="bx" x="100.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="185.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="185.0" dy="0.0">Transmon A</tspan></text><rect class="bxa" x="205.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="290.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="290.0" dy="0.0">Cat 2</tspan></text><rect class="bx" x="310.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="395.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="395.0" dy="0.0">Transmon B</tspan></text><rect class="bxa" x="415.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="500.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="500.0" dy="0.0">Cat 3</tspan></text><rect class="bx" x="520.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="605.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="605.0" dy="0.0">Transmon C</tspan></text><rect class="bxa" x="625.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="710.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="710.0" dy="0.0">Cat 4</tspan></text><rect class="bx" x="730.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="815.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="815.0" dy="0.0">Transmon D</tspan></text><rect class="bxa" x="835.0" y="237.0" width="170.0" height="46.0" rx="12"/><text class="t" x="920.0" y="265.6" text-anchor="middle" font-size="16"><tspan x="920.0" dy="0.0">Cat 5</tspan></text></svg>