<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Changing only the polynomial turns the same QSVT circuit into different famous algorithms.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="239.4" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="602.9" y1="242.3" x2="682.4" y2="205.4"/><polygon class="ah" points="692.4,200.8 679.9,199.9 685.0,210.9"/><line class="ln" x1="620.0" y1="305.9" x2="749.7" y2="323.1"/><polygon class="ah" points="760.6,324.6 750.5,317.1 748.9,329.1"/><line class="ln" x1="541.0" y1="339.5" x2="624.3" y2="440.1"/><polygon class="ah" points="631.4,448.6 629.0,436.2 619.7,443.9"/><line class="ln" x1="459.0" y1="339.5" x2="375.7" y2="440.1"/><polygon class="ah" points="368.6,448.6 380.3,443.9 371.0,436.2"/><line class="ln" x1="380.0" y1="305.9" x2="250.3" y2="323.1"/><polygon class="ah" points="239.4,324.6 251.1,329.1 249.5,317.1"/><line class="ln" x1="397.1" y1="242.3" x2="317.6" y2="205.4"/><polygon class="ah" points="307.6,200.8 315.0,210.9 320.1,199.9"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Grover search</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">sign-like polynomial</tspan></text><rect class="bx" x="693.2" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="793.2" y="138.9" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Amplitude</tspan><tspan x="793.2" dy="21.2">amplification</tspan></text><text class="n" x="793.2" y="183.7" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">fixed-point variants</tspan></text><rect class="bx" x="765.6" y="293.9" width="200.0" height="89.2" rx="12"/><text class="t" x="865.6" y="323.3" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">Hamiltonian</tspan><tspan x="865.6" dy="21.2">simulation</tspan></text><text class="n" x="865.6" y="368.1" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">approximates e^(−iHt)</tspan></text><rect class="bx" x="562.7" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="662.7" y="481.9" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Matrix inversion</tspan></text><text class="n" x="662.7" y="505.4" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">approximates 1/x</tspan></text><rect class="bx" x="237.3" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="337.3" y="481.9" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Phase estimation</tspan></text><text class="n" x="337.3" y="505.4" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">threshold polynomials</tspan></text><rect class="bx" x="34.4" y="293.9" width="200.0" height="89.2" rx="12"/><text class="t" x="134.4" y="323.3" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Eigenstate</tspan><tspan x="134.4" dy="21.2">filtering</tspan></text><text class="n" x="134.4" y="368.1" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">projects onto one energy</tspan></text><rect class="bx" x="106.8" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="206.8" y="138.9" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Gibbs state</tspan><tspan x="206.8" dy="21.2">preparation</tspan></text><text class="n" x="206.8" y="183.7" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">approximates e^(−βH)</tspan></text><rect class="bxa" x="385.0" y="244.4" width="230.0" height="91.2" rx="12"/><text class="t" x="500.0" y="277.2" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">QSVT</tspan></text><text class="n" x="500.0" y="302.4" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">block-encoding + phase</tspan><tspan x="500.0" dy="18.2">angles</tspan></text></svg>