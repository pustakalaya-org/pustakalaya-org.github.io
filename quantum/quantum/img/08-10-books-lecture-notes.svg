 · Hidary 2nd ed.</tspan></text><text class="n" x="684.3" y="185.5" text-anchor="middle" font-size="13"><tspan x="684.3" dy="0.0">An Applied Approach</tspan></text><circle class="dot" cx="807.1" cy="123.5" r="9"/><line class="ln" x1="807.1" y1="114.5" x2="807.1" y2="105.5"/><text class="t" x="807.1" y="58.7" text-anchor="middle" font-size="17"><tspan x="807.1" dy="0.0">2021 · Kaiser &amp;</tspan><tspan x="807.1" dy="21.2">Granade</tspan></text><text class="n" x="807.1" y="101.5" text-anchor="middle" font-size="13"><tspan x="807.1" dy="0.0">Python and Q#</tspan></text><circle class="dot" cx="930.0" cy="123.5" r="9"/><line class="ln" x1="930.0" y1="132.5" x2="930.0" y2="143.5"/><text class="t" x="930.0" y="163.9" text-anchor="middle" font-size="17"><tspan x="930.0" dy="0.0">2024 · Sutor 2nd ed.</tspan></text><text class="n" x="930.0" y="185.5" text-anchor="middle" font-size="13"><tspan x="930.0" dy="0.0">Dancing with Qubits</tspan></text></svg>