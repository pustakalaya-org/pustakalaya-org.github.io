<svg class="dg" viewBox="0 0 1000 242" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Estimates keep falling thanks to better algorithms and codes; these are projections for hardware that does not yet exist.</title><style>svg.dg{--a:#059669;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">RSA-2048, Gidney-Ekerå 2019</tspan></text><rect class="bfill" x="280" y="14.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="33.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">20 M (≈8 h)</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">RSA-2048, Gidney 2025</tspan></text><rect class="bfill" x="280" y="64.0" width="264.9" height="28" rx="6"/><text class="n" x="554.9" y="83.0" text-anchor="start" font-size="15"><tspan x="554.9" dy="0.0">&lt; 1 M (&lt; 1 week)</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">ECC-256, Google 2026</tspan></text><rect class="bfill" x="280" y="114.0" width="203.6" height="28" rx="6"/><text class="n" x="493.6" y="133.0" text-anchor="start" font-size="15"><tspan x="493.6" dy="0.0">&lt; 500 k (minutes)</tspan></text><text class="t" x="266.0" y="180.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">RSA-2048, qLDPC preprint</tspan><tspan x="266.0" dy="20.0">2026</tspan></text><rect class="bfill" x="280" y="171.0" width="61.1" height="28" rx="6"/><text class="n" x="351.1" y="190.0" text-anchor="start" font-size="15"><tspan x="351.1" dy="0.0">&lt; 100 k (claim)</tspan></text><text class="n" x="996.0" y="232.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>