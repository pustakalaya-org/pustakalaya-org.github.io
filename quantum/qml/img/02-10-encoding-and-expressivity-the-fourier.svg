<svg class="dg" viewBox="0 0 1000 310" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each Pauli-rotation upload adds one integer frequency; scaled encodings grow faster.</title><style>svg.dg{--a:#0284c7;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">1 upload</tspan></text><rect class="bfill" x="280" y="14.0" width="35.3" height="28" rx="6"/><text class="n" x="325.3" y="33.0" text-anchor="start" font-size="15"><tspan x="325.3" dy="0.0">1 highest frequency</tspan></text><text class="t" x="266.0" y="83.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">2 uploads</tspan></text><rect class="bfill" x="280" y="64.0" width="70.7" height="28" rx="6"/><text class="n" x="360.7" y="83.0" text-anchor="start" font-size="15"><tspan x="360.7" dy="0.0">2 highest frequency</tspan></text><text class="t" x="266.0" y="133.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">3 uploads</tspan></text><rect class="bfill" x="280" y="114.0" width="106.0" height="28" rx="6"/><text class="n" x="396.0" y="133.0" text-anchor="start" font-size="15"><tspan x="396.0" dy="0.0">3 highest frequency</tspan></text><text class="t" x="266.0" y="183.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">4 uploads</tspan></text><rect class="bfill" x="280" y="164.0" width="141.3" height="28" rx="6"/><text class="n" x="431.3" y="183.0" text-anchor="start" font-size="15"><tspan x="431.3" dy="0.0">4 highest frequency</tspan></text><text class="t" x="266.0" y="233.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">3 uploads, scales 1,3,9</tspan></text><rect class="bfill" x="280" y="214.0" width="459.3" height="28" rx="6"/><text class="n" x="749.3" y="233.0" text-anchor="start" font-size="15"><tspan x="749.3" dy="0.0">13 highest frequency</tspan></text><text class="t" x="266.0" y="283.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">4 uploads, scales 1,2,4,8</tspan></text><rect class="bfill" x="280" y="264.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="283.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">15 highest frequency</tspan></text></svg>