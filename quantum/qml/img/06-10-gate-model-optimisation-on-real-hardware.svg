<svg class="dg" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Routing a dense problem onto sparse hardware multiplies depth and therefore noise.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="t" x="266.0" y="33.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Heavy-hex native graph</tspan></text><rect class="bfill" x="280" y="14.0" width="87.2" height="28" rx="6"/><text class="n" x="377.2" y="33.0" text-anchor="start" font-size="15"><tspan x="377.2" dy="0.0">~3</tspan></text><text class="t" x="266.0" y="80.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">3-regular graph, all-to-all</tspan><tspan x="266.0" dy="20.0">hardware</tspan></text><rect class="bfill" x="280" y="71.0" width="87.2" height="28" rx="6"/><text class="n" x="377.2" y="90.0" text-anchor="start" font-size="15"><tspan x="377.2" dy="0.0">~3-4</tspan></text><text class="t" x="266.0" y="144.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Dense 20-node, line swap</tspan><tspan x="266.0" dy="20.0">network</tspan></text><rect class="bfill" x="280" y="135.0" width="326.8" height="28" rx="6"/><text class="n" x="616.8" y="154.0" text-anchor="start" font-size="15"><tspan x="616.8" dy="0.0">~n = 20</tspan></text><text class="t" x="266.0" y="208.0" text-anchor="end" font-size="16"><tspan x="266.0" dy="0.0">Dense 100-node, line swap</tspan><tspan x="266.0" dy="20.0">network</tspan></text><rect class="bfill" x="280" y="199.0" width="530.0" height="28" rx="6"/><text class="n" x="820.0" y="218.0" text-anchor="start" font-size="15"><tspan x="820.0" dy="0.0">~n = 100</tspan></text><text class="n" x="996.0" y="260.0" text-anchor="end" font-size="13"><tspan x="996.0" dy="0.0">log scale</tspan></text></svg>