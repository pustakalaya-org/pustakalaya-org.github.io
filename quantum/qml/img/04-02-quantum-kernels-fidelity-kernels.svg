<svg class="dg" viewBox="0 0 1000 376" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The QPU only estimates overlaps; learning happens in a classical convex solver.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="370.0"/><line class="ln lnd life" x1="500.0" y1="54.0" x2="500.0" y2="370.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="370.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">Classical PC</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="395.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="500.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="500.0" dy="0.0">QPU</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">SVM solver</tspan></text></g><text class="n ml" x="305.0" y="87.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">1. run U(xᵢ) then U(xⱼ)† (all pairs)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="489.0" y2="100.0"/><polygon class="ah" points="500.0,100.0 489.0,94.0 489.0,106.0"/><text class="n ml" x="305.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">2. counts → P(00…0) = k(xᵢ, xⱼ)</tspan></text><line class="ln lnd" x1="500.0" y1="145.0" x2="121.0" y2="145.0"/><polygon class="ah" points="110.0,145.0 121.0,151.1 121.0,138.9"/><text class="n ml" x="500.0" y="177.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">3. Gram matrix K (N × N)</tspan></text><line class="ln" x1="110.0" y1="190.0" x2="879.0" y2="190.0"/><polygon class="ah" points="890.0,190.0 879.0,183.9 879.0,196.1"/><text class="n ml" x="500.0" y="222.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">4. support vectors and αᵢ</tspan></text><line class="ln lnd" x1="890.0" y1="235.0" x2="121.0" y2="235.0"/><polygon class="ah" points="110.0,235.0 121.0,241.1 121.0,228.9"/><text class="n ml" x="305.0" y="267.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">5. new x: U(x) U(x_sv)†</tspan></text><line class="ln" x1="110.0" y1="280.0" x2="489.0" y2="280.0"/><polygon class="ah" points="500.0,280.0 489.0,273.9 489.0,286.1"/><text class="n ml" x="305.0" y="312.8" text-anchor="middle" font-size="15"><tspan x="305.0" dy="0.0">6. k(x, x_sv) → prediction</tspan></text><line class="ln lnd" x1="500.0" y1="325.0" x2="121.0" y2="325.0"/><polygon class="ah" points="110.0,325.0 121.0,331.1 121.0,318.9"/></svg>