<svg class="dg" viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The classical optimiser runs in a managed container next to the QPU queue, with priority access for the job&#x27;s tasks.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln lnd life" x1="110.0" y1="54.0" x2="110.0" y2="546.0"/><line class="ln lnd life" x1="370.0" y1="54.0" x2="370.0" y2="546.0"/><line class="ln lnd life" x1="630.0" y1="54.0" x2="630.0" y2="546.0"/><line class="ln lnd life" x1="890.0" y1="54.0" x2="890.0" y2="546.0"/><g transform="translate(0,30.0)"><rect class="bxa" x="5.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="110.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="110.0" dy="0.0">You</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="265.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="370.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="370.0" dy="0.0">Braket</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="525.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="630.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="630.0" dy="0.0">Job container</tspan></text></g><g transform="translate(0,30.0)"><rect class="bxa" x="785.0" y="-24.0" width="210.0" height="48.0" rx="12"/><text class="t" x="890.0" y="6.3" text-anchor="middle" font-size="18"><tspan x="890.0" dy="0.0">QPU</tspan></text></g><text class="n ml" x="240.0" y="69.0" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">1. create job (script, device</tspan><tspan x="240.0" dy="18.8">ARN)</tspan></text><line class="ln" x1="110.0" y1="100.0" x2="359.0" y2="100.0"/><polygon class="ah" points="370.0,100.0 359.0,94.0 359.0,106.0"/><text class="n ml" x="500.0" y="132.8" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">2. start ml.m5.xlarge</tspan><tspan x="500.0" dy="18.8">container</tspan></text><line class="ln" x1="370.0" y1="163.8" x2="619.0" y2="163.8"/><polygon class="ah" points="630.0,163.8 619.0,157.7 619.0,169.8"/><text class="n ml" x="760.0" y="215.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">3. circuit batch, 1,000 shots</tspan></text><line class="ln" x1="630.0" y1="227.5" x2="879.0" y2="227.5"/><polygon class="ah" points="890.0,227.5 879.0,221.4 879.0,233.6"/><text class="n ml" x="760.0" y="260.2" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">4. counts</tspan></text><line class="ln lnd" x1="890.0" y1="272.5" x2="641.0" y2="272.5"/><polygon class="ah" points="630.0,272.5 641.0,278.6 641.0,266.4"/><text class="n" x="560.0" y="335.8" text-anchor="end" font-size="15"><tspan x="560.0" dy="0.0">5. optimiser updates weights</tspan></text><path class="ln" d="M630.0,317.5 H575.0 V343.5 H616.0"/><line class="ln" x1="610.0" y1="343.5" x2="616.0" y2="343.5"/><polygon class="ah" points="627.0,343.5 616.0,337.4 616.0,349.6"/><text class="n ml" x="760.0" y="342.5" text-anchor="middle" font-size="15"><tspan x="760.0" dy="0.0">6. next batch (priority</tspan><tspan x="760.0" dy="18.8">queue)</tspan></text><line class="ln" x1="630.0" y1="373.5" x2="879.0" y2="373.5"/><polygon class="ah" points="890.0,373.5 879.0,367.4 879.0,379.6"/><text class="n ml" x="500.0" y="406.2" text-anchor="middle" font-size="15"><tspan x="500.0" dy="0.0">7. save metrics, final</tspan><tspan x="500.0" dy="18.8">weights</tspan></text><line class="ln" x1="630.0" y1="437.2" x2="381.0" y2="437.2"/><polygon class="ah" points="370.0,437.2 381.0,443.3 381.0,431.2"/><text class="n ml" x="240.0" y="488.8" text-anchor="middle" font-size="15"><tspan x="240.0" dy="0.0">8. results in S3</tspan></text><line class="ln lnd" x1="370.0" y1="501.0" x2="121.0" y2="501.0"/><polygon class="ah" points="110.0,501.0 121.0,507.1 121.0,494.9"/></svg>