<svg class="dg" viewBox="0 0 1000 184" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Each week reuses the previous week&#x27;s code and adds one new idea.</title><style>svg.dg{--a:#0d9488;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln axis" x1="20.0" y1="86.0" x2="980.0" y2="86.0"/><circle class="dot" cx="70.0" cy="86.0" r="9"/><line class="ln" x1="70.0" y1="77.0" x2="70.0" y2="68.0"/><text class="t" x="70.0" y="42.5" text-anchor="middle" font-size="17"><tspan x="70.0" dy="0.0">Week 1 · VQC on moons</tspan></text><text class="n" x="70.0" y="64.0" text-anchor="middle" font-size="13"><tspan x="70.0" dy="0.0">PennyLane basics</tspan></text><circle class="dot" cx="192.9" cy="86.0" r="9"/><line class="ln" x1="192.9" y1="95.0" x2="192.9" y2="106.0"/><text class="t" x="192.9" y="126.5" text-anchor="middle" font-size="17"><tspan x="192.9" dy="0.0">Week 2 · Quantum</tspan><tspan x="192.9" dy="21.2">kernel</tspan></text><text class="n" x="192.9" y="169.2" text-anchor="middle" font-size="13"><tspan x="192.9" dy="0.0">vs RBF SVM</tspan></text><circle class="dot" cx="315.7" cy="86.0" r="9"/><line class="ln" x1="315.7" y1="77.0" x2="315.7" y2="68.0"/><text class="t" x="315.7" y="42.5" text-anchor="middle" font-size="17"><tspan x="315.7" dy="0.0">Week 3 · Re-uploading</tspan></text><text class="n" x="315.7" y="64.0" text-anchor="middle" font-size="13"><tspan x="315.7" dy="0.0">1 qubit, circles</tspan></text><circle class="dot" cx="438.6" cy="86.0" r="9"/><line class="ln" x1="438.6" y1="95.0" x2="438.6" y2="106.0"/><text class="t" x="438.6" y="126.5" text-anchor="middle" font-size="17"><tspan x="438.6" dy="0.0">Week 4 · Hybrid</tspan><tspan x="438.6" dy="21.2">PyTorch</tspan></text><text class="n" x="438.6" y="169.2" text-anchor="middle" font-size="13"><tspan x="438.6" dy="0.0">TorchLayer</tspan></text><circle class="dot" cx="561.4" cy="86.0" r="9"/><line class="ln" x1="561.4" y1="77.0" x2="561.4" y2="68.0"/><text class="t" x="561.4" y="42.5" text-anchor="middle" font-size="17"><tspan x="561.4" dy="0.0">Week 5 · Qiskit VQC</tspan></text><text class="n" x="561.4" y="64.0" text-anchor="middle" font-size="13"><tspan x="561.4" dy="0.0">primitives</tspan></text><circle class="dot" cx="684.3" cy="86.0" r="9"/><line class="ln" x1="684.3" y1="95.0" x2="684.3" y2="106.0"/><text class="t" x="684.3" y="126.5" text-anchor="middle" font-size="17"><tspan x="684.3" dy="0.0">Week 6 · Noise study</tspan></text><text class="n" x="684.3" y="148.0" text-anchor="middle" font-size="13"><tspan x="684.3" dy="0.0">default.mixed</tspan></text><circle c