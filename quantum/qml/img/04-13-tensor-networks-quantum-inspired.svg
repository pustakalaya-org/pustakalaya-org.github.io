<svg class="dg" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The same data structure is a model, a simulator and a baseline.</title><style>svg.dg{--a:#b45309;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="208.5" x2="500.0" y2="122.0"/><polygon class="ah" points="500.0,111.0 493.9,122.0 506.1,122.0"/><line class="ln" x1="619.8" y1="217.2" x2="709.3" y2="192.6"/><polygon class="ah" points="719.9,189.7 707.7,186.8 710.9,198.5"/><line class="ln" x1="619.8" y1="282.8" x2="709.3" y2="307.4"/><polygon class="ah" points="719.9,310.3 710.9,301.5 707.7,313.2"/><line class="ln" x1="500.0" y1="291.5" x2="500.0" y2="367.4"/><polygon class="ah" points="500.0,378.4 506.1,367.4 493.9,367.4"/><line class="ln" x1="380.2" y1="282.8" x2="290.7" y2="307.4"/><polygon class="ah" points="280.1,310.3 292.3,313.2 289.1,301.5"/><line class="ln" x1="380.2" y1="217.2" x2="290.7" y2="192.6"/><polygon class="ah" points="280.1,189.7 289.1,198.5 292.3,186.8"/><rect class="bx" x="400.0" y="38.0" width="200.0" height="68.0" rx="12"/><text class="t" x="500.0" y="67.5" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">MPS classifiers</tspan></text><text class="n" x="500.0" y="91.0" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">Stoudenmire &amp; Schwab 2016</tspan></text><rect class="bx" x="724.8" y="127.0" width="200.0" height="68.0" rx="12"/><text class="t" x="824.8" y="156.4" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">MPS Born machines</tspan></text><text class="n" x="824.8" y="180.0" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">Han et al. 2018</tspan></text><rect class="bx" x="724.8" y="294.4" width="200.0" height="89.2" rx="12"/><text class="t" x="824.8" y="323.8" text-anchor="middle" font-size="17"><tspan x="824.8" dy="0.0">Circuit</tspan><tspan x="824.8" dy="21.2">simulation</tspan></text><text class="n" x="824.8" y="368.6" text-anchor="middle" font-size="13"><tspan x="824.8" dy="0.0">tests simulability claims</tspan></text><rect class="bx" x="400.0" y="383.4" width="200.0" height="89.2" rx="12"/><text class="t" x="500.0" y="412.8" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Circuit</tspan><tspan x="500.0" dy="21.2">pretraining</tspan></text><text class="n" x="500.0" y="457.6" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">initialise PQCs</tspan></text><rect class="bx" x="75.2" y="305.0" width="200.0" height="68.0" rx="12"/><text class="t" x="175.2" y="334.5" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Model compression</tspan></text><text class="n" x="175.2" y="358.0" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">e.g. compressed LLMs</tspan></text><rect class="bx" x="75.2" y="116.4" width="200.0" height="89.2" rx="12"/><text class="t" x="175.2" y="145.8" text-anchor="middle" font-size="17"><tspan x="175.2" dy="0.0">Quantum-inspired</tspan><tspan x="175.2" dy="21.2">algorithms</tspan></text><text class="n" x="175.2" y="190.6" text-anchor="middle" font-size="13"><tspan x="175.2" dy="0.0">dequantised linear algebra</tspan></text><rect class="bxa" x="385.0" y="213.5" width="230.0" height="73.0" rx="12"/><text class="t" x="500.0" y="246.3" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Tensor networks</tspan></text><text class="n" x="500.0" y="271.5" text-anchor="middle" font-size="14"><tspan x="500.0" dy="0.0">MPS, TTN, MERA, PEPS</tspan></text></svg>