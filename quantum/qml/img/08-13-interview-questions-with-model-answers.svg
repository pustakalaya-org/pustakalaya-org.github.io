dle" font-size="19"><tspan x="709.2" dy="0.0">Limitation</tspan></text><text class="n" x="709.2" y="102.0" text-anchor="middle" font-size="15"><tspan x="709.2" dy="0.0">honest caveat</tspan></text><line class="ln" x1="795.8" y1="71.8" x2="820.8" y2="71.8"/><polygon class="ah" points="831.8,71.8 820.8,65.7 820.8,77.8"/><rect class="bx" x="836.8" y="6.0" width="163.2" height="131.5" rx="14"/><rect class="bar" x="836.8" y="6.0" width="163.2" height="6" rx="3"/><circle class="bc" cx="862.8" cy="36.0" r="15"/><text class="bn" x="862.8" y="41.5" text-anchor="middle" font-size="16">5</text><text class="t" x="918.4" y="74.2" text-anchor="middle" font-size="19"><tspan x="918.4" dy="0.0">Evidence</tspan></text><text class="n" x="918.4" y="102.0" text-anchor="middle" font-size="15"><tspan x="918.4" dy="0.0">paper or project</tspan></text></svg>