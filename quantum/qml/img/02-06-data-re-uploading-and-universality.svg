" text-anchor="middle" font-size="15"><tspan x="892.2" dy="0.0">upload 3</tspan></text><path class="ln" d="M892.2,122.0 V150.0 H107.8"/><line class="ln" x1="107.8" y1="150.0" x2="107.8" y2="167.0"/><polygon class="ah" points="107.8,178.0 113.8,167.0 101.7,167.0"/><rect class="bx" x="0.0" y="182.0" width="215.5" height="112.0" rx="14"/><rect class="bar" x="0.0" y="182.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="26.0" cy="212.0" r="15"/><text class="bn" x="26.0" y="217.5" text-anchor="middle" font-size="16">5</text><text class="t" x="107.8" y="250.2" text-anchor="middle" font-size="19"><tspan x="107.8" dy="0.0">Measure ⟨Z⟩</tspan></text><text class="n" x="107.8" y="278.0" text-anchor="middle" font-size="15"><tspan x="107.8" dy="0.0">frequencies −3…3</tspan></text><line class="ln" x1="220.5" y1="238.0" x2="245.5" y2="238.0"/><polygon class="ah" points="256.5,238.0 245.5,231.9 245.5,244.1"/><rect class="bx" x="261.5" y="182.0" width="215.5" height="112.0" rx="14"/><rect class="bar" x="261.5" y="182.0" width="215.5" height="6" rx="3"/><circle class="bc" cx="287.5" cy="212.0" r="15"/><text class="bn" x="287.5" y="217.5" text-anchor="middle" font-size="16">6</text><text class="t" x="369.2" y="250.2" text-anchor="middle" font-size="19"><tspan x="369.2" dy="0.0">Loss → update θ</tspan></text><text class="n" x="369.2" y="278.0" text-anchor="middle" font-size="15"><tspan x="369.2" dy="0.0">classical optimiser</tspan></text></svg>