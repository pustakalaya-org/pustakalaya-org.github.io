<svg class="dg" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>A single missing ingredient can turn a &#x27;speed-up&#x27; into an artefact.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><line class="ln" x1="500.0" y1="259.5" x2="500.0" y2="121.6"/><line class="ln" x1="559.5" y1="262.4" x2="692.4" y2="200.8"/><line class="ln" x1="620.0" y1="305.9" x2="760.6" y2="324.6"/><line class="ln" x1="524.3" y1="319.4" x2="622.5" y2="437.9"/><line class="ln" x1="475.7" y1="319.4" x2="368.6" y2="448.6"/><line class="ln" x1="380.0" y1="305.9" x2="239.4" y2="324.6"/><line class="ln" x1="440.5" y1="262.4" x2="307.6" y2="200.8"/><rect class="bx" x="400.0" y="27.4" width="200.0" height="89.2" rx="12"/><text class="t" x="500.0" y="56.8" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Best classical</tspan><tspan x="500.0" dy="21.2">solvers</tspan></text><text class="n" x="500.0" y="101.6" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">not brute force</tspan></text><rect class="bx" x="693.2" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="793.2" y="138.9" text-anchor="middle" font-size="17"><tspan x="793.2" dy="0.0">Same target</tspan><tspan x="793.2" dy="21.2">quality</tspan></text><text class="n" x="793.2" y="183.7" text-anchor="middle" font-size="13"><tspan x="793.2" dy="0.0">e.g. 1% from best known</tspan></text><rect class="bx" x="765.6" y="285.4" width="200.0" height="106.2" rx="12"/><text class="t" x="865.6" y="314.9" text-anchor="middle" font-size="17"><tspan x="865.6" dy="0.0">All overheads</tspan><tspan x="865.6" dy="21.2">counted</tspan></text><text class="n" x="865.6" y="359.7" text-anchor="middle" font-size="13"><tspan x="865.6" dy="0.0">embedding, queueing,</tspan><tspan x="865.6" dy="16.9">training</tspan></text><rect class="bx" x="562.7" y="441.8" width="200.0" height="89.2" rx="12"/><text class="t" x="662.7" y="471.2" text-anchor="middle" font-size="17"><tspan x="662.7" dy="0.0">Equal tuning</tspan><tspan x="662.7" dy="21.2">effort</tspan></text><text class="n" x="662.7" y="516.0" text-anchor="middle" font-size="13"><tspan x="662.7" dy="0.0">for every solver</tspan></text><rect class="bx" x="237.3" y="452.4" width="200.0" height="68.0" rx="12"/><text class="t" x="337.3" y="481.9" text-anchor="middle" font-size="17"><tspan x="337.3" dy="0.0">Scaling with size</tspan></text><text class="n" x="337.3" y="505.4" text-anchor="middle" font-size="13"><tspan x="337.3" dy="0.0">not one instance</tspan></text><rect class="bx" x="34.4" y="293.9" width="200.0" height="89.2" rx="12"/><text class="t" x="134.4" y="323.3" text-anchor="middle" font-size="17"><tspan x="134.4" dy="0.0">Realistic</tspan><tspan x="134.4" dy="21.2">instances</tspan></text><text class="n" x="134.4" y="368.1" text-anchor="middle" font-size="13"><tspan x="134.4" dy="0.0">not only crafted ones</tspan></text><rect class="bx" x="106.8" y="109.5" width="200.0" height="89.2" rx="12"/><text class="t" x="206.8" y="138.9" text-anchor="middle" font-size="17"><tspan x="206.8" dy="0.0">Open data and</tspan><tspan x="206.8" dy="21.2">code</tspan></text><text class="n" x="206.8" y="183.7" text-anchor="middle" font-size="13"><tspan x="206.8" dy="0.0">so others can replicate</tspan></text><rect class="bxa" x="385.0" y="264.5" width="230.0" height="51.0" rx="12"/><text class="t" x="500.0" y="297.4" text-anchor="middle" font-size="21"><tspan x="500.0" dy="0.0">Fair benchmark</tspan></text></svg>