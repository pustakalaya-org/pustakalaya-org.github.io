<svg class="dg" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>The quantum computer only evaluates; the classical optimiser decides.</title><style>svg.dg{--a:#db2777;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><ellipse class="ring" cx="500.0" cy="280.0" rx="360" ry="200.0"/><line class="ln acc" x1="698.6" y1="113.0" x2="707.9" y2="116.7"/><polygon class="ah" points="720.9,121.9 710.8,109.6 705.0,123.8"/><line class="ln acc" x1="849.4" y1="329.7" x2="844.4" y2="338.4"/><polygon class="ah" points="837.3,350.4 851.0,342.2 837.8,334.5"/><line class="ln acc" x1="514.0" y1="480.0" x2="504.0" y2="480.0"/><polygon class="ah" points="490.0,480.0 504.0,487.7 504.0,472.3"/><line class="ln acc" x1="164.7" y1="353.9" x2="159.6" y2="345.3"/><polygon class="ah" points="152.6,333.2 153.0,349.1 166.3,341.4"/><line class="ln acc" x1="275.4" y1="123.4" x2="284.7" y2="119.7"/><polygon class="ah" points="297.7,114.5 281.8,112.6 287.6,126.8"/><text class="t" x="500.0" y="286.0" text-anchor="middle" font-size="22"><tspan x="500.0" dy="0.0">p layers</tspan></text><rect class="bx" x="395.0" y="37.5" width="210.0" height="84.9" rx="12"/><text class="t" x="500.0" y="67.0" text-anchor="middle" font-size="17"><tspan x="500.0" dy="0.0">Prepare |+⟩ⁿ</tspan></text><text class="n" x="500.0" y="90.5" text-anchor="middle" font-size="13"><tspan x="500.0" dy="0.0">all bitstrings equally</tspan><tspan x="500.0" dy="16.9">likely</tspan></text><circle class="bc" cx="399.0" cy="41.5" r="13"/><text class="bn" x="399.0" y="47.0" text-anchor="middle" font-size="16">1</text><rect class="bx" x="737.4" y="175.7" width="210.0" height="84.9" rx="12"/><text class="t" x="842.4" y="205.2" text-anchor="middle" font-size="17"><tspan x="842.4" dy="0.0">Cost layer</tspan></text><text class="n" x="842.4" y="228.7" text-anchor="middle" font-size="13"><tspan x="842.4" dy="0.0">e^{−iγH_C}: phase by</tspan><tspan x="842.4" dy="16.9">objective</tspan></text><circle class="bc" cx="741.4" cy="179.7" r="13"/><text class="bn" x="741.4" y="185.2" text-anchor="middle" font-size="16">2</text><rect class="bx" x="606.6" y="407.8" width="210.0" height="68.0" rx="12"/><text class="t" x="711.6" y="437.3" text-anchor="middle" font-size="17"><tspan x="711.6" dy="0.0">Mixer layer</tspan></text><text class="n" x="711.6" y="460.8" text-anchor="middle" font-size="13"><tspan x="711.6" dy="0.0">e^{−iβΣX}: move amplitude</tspan></text><circle class="bc" cx="610.6" cy="411.8" r="13"/><text class="bn" x="610.6" y="417.3" text-anchor="middle" font-size="16">3</text><rect class="bx" x="183.4" y="407.8" width="210.0" height="68.0" rx="12"/><text class="t" x="288.4" y="437.3" text-anchor="middle" font-size="17"><tspan x="288.4" dy="0.0">Measure shots</tspan></text><text class="n" x="288.4" y="460.8" text-anchor="middle" font-size="13"><tspan x="288.4" dy="0.0">estimate ⟨H_C⟩</tspan></text><circle class="bc" cx="187.4" cy="411.8" r="13"/><text class="bn" x="187.4" y="417.3" text-anchor="middle" font-size="16">4</text><rect class="bx" x="52.6" y="184.2" width="210.0" height="68.0" rx="12"/><text class="t" x="157.6" y="213.6" text-anchor="middle" font-size="17"><tspan x="157.6" dy="0.0">Classical update</tspan></text><text class="n" x="157.6" y="237.2" text-anchor="middle" font-size="13"><tspan x="157.6" dy="0.0">new γ, β angles</tspan></text><circle class="bc" cx="56.6" cy="188.2" r="13"/><text class="bn" x="56.6" y="193.7" text-anchor="middle" font-size="16">5</text></svg>