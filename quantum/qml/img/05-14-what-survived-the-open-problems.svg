<svg class="dg" viewBox="0 0 1000 504" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Read from top (strongest) to bottom (dequantised).</title><style>svg.dg{--a:#7c3aed;--dg-bg:#f8fafc;--dg-line:#cbd5e1;--dg-line2:#64748b;--dg-ink:#0f172a;--dg-muted:#475569;--dg-halo:#fff;background:#fff;overflow:visible;font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif}svg.dg text { font-family: inherit; }svg.dg text.t { fill: var(--dg-ink); font-weight: 700; }svg.dg text.n { fill: var(--dg-muted); }svg.dg text.ml { paint-order: stroke; stroke: var(--dg-halo, #fff); stroke-width: 7px; stroke-linejoin: round; }svg.dg text.lab { fill: var(--dg-muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }svg.dg text.bn { fill: #fff; font-weight: 800; }svg.dg .bx { fill: var(--dg-bg); stroke: var(--dg-line); stroke-width: 1.5; }svg.dg .bxa { fill: color-mix(in srgb, var(--a) 16%, var(--dg-bg)); stroke: var(--a); stroke-width: 2; }svg.dg .bar, .dg .bc, .dg .bfill, .dg .dot { fill: var(--a); }svg.dg .ln { stroke: var(--dg-line2); stroke-width: 2.2; fill: none; }svg.dg .lnd { stroke-dasharray: 7 6; }svg.dg .life { stroke-width: 1.5; opacity: .7; }svg.dg .acc { stroke: var(--a); }svg.dg .ah { fill: var(--dg-line2); }svg.dg .sep { stroke: var(--a); stroke-opacity: .35; stroke-width: 1.5; }svg.dg .ring { fill: none; stroke: var(--a); stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }svg.dg .axis { stroke: var(--a); stroke-width: 4; stroke-linecap: round; }svg.dg .lbg { fill: var(--dg-bg); stroke: var(--dg-line); }</style><text class="lab" x="4.0" y="43.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Strong</tspan><tspan x="4.0" dy="17.5">(provable)</tspan></text><text class="lab" x="4.0" y="189.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Promising</tspan><tspan x="4.0" dy="17.5">(structured)</tspan></text><text class="lab" x="4.0" y="325.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Modest</tspan><tspan x="4.0" dy="17.5">(quadratic)</tspan></text><text class="lab" x="4.0" y="461.2" text-anchor="start" font-size="14"><tspan x="4.0" dy="0.0">Dequantised</tspan><tspan x="4.0" dy="17.5">(low-rank)</tspan></text><g transform="translate(0,47.0)"><rect class="bx" x="354.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="459.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="459.0" dy="0.0">Learning from</tspan><tspan x="459.0" dy="20.0">quantum data</tspan></text></g><g transform="translate(0,47.0)"><rect class="bx" x="580.0" y="-43.0" width="210.0" height="86.0" rx="12"/><text class="t" x="685.0" y="-14.4" text-anchor="middle" font-size="16"><tspan x="685.0" dy="0.0">Quantum</tspan><tspan x="685.0" dy="20.0">simulation-based</tspan><tspan x="685.0" dy="20.0">learning</tspan></text></g><g transform="translate(0,193.0)"><rect class="bx" x="241.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="346.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">Sparse high-rank</tspan><tspan x="346.0" dy="20.0">linear algebra</tspan></text></g><g transform="translate(0,193.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">TDA in narrow</tspan><tspan x="572.0" dy="20.0">regimes</tspan></text></g><g transform="translate(0,193.0)"><rect class="bx" x="693.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="798.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">Discrete-log</tspan><tspan x="798.0" dy="20.0">learning</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="241.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="346.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">Grover search &amp;</tspan><tspan x="346.0" dy="20.0">k-NN</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">Amplitude</tspan><tspan x="572.0" dy="20.0">estimation</tspan></text></g><g transform="translate(0,329.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">Gradient estimation</tspan></text></g><g transform="translate(0,465.0)"><rect class="bx" x="241.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="346.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="346.0" dy="0.0">Recommendation</tspan><tspan x="346.0" dy="20.0">systems</tspan></text></g><g transform="translate(0,465.0)"><rect class="bx" x="467.0" y="-33.0" width="210.0" height="66.0" rx="12"/><text class="t" x="572.0" y="-4.4" text-anchor="middle" font-size="16"><tspan x="572.0" dy="0.0">qPCA on classical</tspan><tspan x="572.0" dy="20.0">data</tspan></text></g><g transform="translate(0,465.0)"><rect class="bx" x="693.0" y="-23.0" width="210.0" height="46.0" rx="12"/><text class="t" x="798.0" y="5.6" text-anchor="middle" font-size="16"><tspan x="798.0" dy="0.0">Least-squares SVM</tspan></text></g></svg>